<title>Bridge Voices</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column of sections; each pick is a row of option cards; any image opens large in a lightbox,
   where the arrows step through that row's options and Pick works too. */
:root { --bg:#f4f1ea; --card:#fffdf8; --fg:#1d1b18; --dim:#6d675c; --line:#ddd6c8; --acc:#b4331f; --pick:#2f6b4f; --pickbg:#e3efe7;
  --ui:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --head:'Fraunces',Georgia,serif }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15140f; --card:#1e1c17; --fg:#ece6da; --dim:#a39b8c; --line:#38342b; --acc:#e0634b; --pick:#7fc6a0; --pickbg:#1f3328; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#15140f; --card:#1e1c17; --fg:#ece6da; --dim:#a39b8c; --line:#38342b; --acc:#e0634b; --pick:#7fc6a0; --pickbg:#1f3328; color-scheme:dark }
body { background:var(--bg); color:var(--fg); font:15px/1.5 var(--ui) }
.wrap { max-width:1080px; margin:0 auto; padding-block:28px 60px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:30px }
h1 { font:650 34px/1.1 var(--head); margin:0; text-wrap:balance } h2 { font:600 24px/1.2 var(--head); margin:0 } h3 { font:600 17px/1.3 var(--ui); margin:0 }
.lede { color:var(--dim); max-width:70ch; margin:4px 0 0 }
.eyebrow { font:500 11px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--acc) }
.sec, .grp { display:flex; flex-direction:column; gap:10px } .grp { border-top:1px solid var(--line); padding-top:12px }
.line { font:500 16px/1.4 var(--head); font-style:italic; color:var(--dim) }
.opts { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr)); gap:10px }
.card { background:var(--card); border:1px solid var(--line); border-radius:6px; padding:10px 12px; display:flex; flex-direction:column; gap:6px; min-width:0 }
.card.on { border-color:var(--pick); background:var(--pickbg); box-shadow:inset 0 0 0 1px var(--pick) }
.v { font:500 12px var(--mono); color:var(--dim) } .warn { font:500 11px var(--mono); color:var(--acc) }
.zoom { padding:0; border:0; background:#000; border-radius:3px; cursor:zoom-in; display:block; width:100%; overflow:hidden }
.zoom img { width:100%; aspect-ratio:16/9; object-fit:cover; display:block }
.zoom:focus-visible { outline:2px solid var(--acc); outline-offset:2px }
@media (prefers-reduced-motion: no-preference) { .zoom img { transition:transform .3s ease } .zoom:hover img { transform:scale(1.03) } }
audio { width:100%; height:34px } video { width:100%; display:block; border-radius:3px; background:#000 } a.open { font-weight:600; color:var(--acc) }
button { font:600 13px var(--ui); border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:4px; padding:6px 10px; cursor:pointer }
button.pk[aria-pressed="true"] { background:var(--pick); color:var(--card); border-color:var(--pick) }
button:focus-visible { outline:2px solid var(--acc); outline-offset:2px }
textarea { font:14px/1.4 var(--ui); color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:4px; padding:6px 8px; width:100%; box-sizing:border-box; min-height:40px }
.status { font:500 11px var(--mono); color:var(--dim) }
dialog { border:0; padding:0; background:transparent; max-width:96vw; color:#ece6da }
dialog::backdrop { background:rgba(0,0,0,.9) }
dialog img { max-width:96vw; max-height:80vh; display:block; margin:0 auto; cursor:zoom-out }
.lbbar { display:flex; flex-wrap:wrap; gap:8px 12px; align-items:center; justify-content:center; margin-top:10px }
.lbbar .lbl { font:500 13px var(--mono); min-width:0; text-align:center }
.lbbar button { background:#1e1c17; color:#ece6da; border-color:#38342b }
.lbbar button.pk[aria-pressed="true"] { background:#7fc6a0; color:#15140f; border-color:#7fc6a0 }
/* Rounds: groups from this round are flagged New and come first; earlier rounds fold into one closed panel. */
.tag { font:600 11px var(--mono); letter-spacing:.06em; text-transform:uppercase; border-radius:3px; padding:2px 6px; margin-left:8px; vertical-align:2px; white-space:nowrap }
.tag.new { background:var(--acc); color:var(--card) } .tag.got { background:var(--pickbg); color:var(--pick) } .tag.none { border:1px solid var(--line); color:var(--dim) }
.grp.isnew { border-top:3px solid var(--acc) }
.todo { border:1px solid var(--acc); border-radius:6px; padding:10px 12px; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:baseline }
.todo a { color:var(--acc); font-weight:600 }
details.old { border:1px solid var(--line); border-radius:6px; padding:10px 12px }
details.old > summary { cursor:pointer; font:600 15px var(--ui) } details.old[open] > summary { margin-bottom:14px }
details.old .grp { opacity:.85 }
</style>
<div class="wrap">
 <header><div class="eyebrow" id="eb"></div><h1 id="hd"></h1><p class="lede" id="in"></p>

 <div id="secs" class="sec"></div>
</div>
<dialog id="lb" aria-label="Enlarged image">
 <img alt="">
 <div class="lbbar"><button type="button" id="lbp" aria-label="Previous option">←</button><span class="lbl" id="lbl"></span>
  <button type="button" class="pk" id="lbk">Pick</button><button type="button" id="lbn" aria-label="Next option">→</button>
  <button type="button" id="lbx">Close</button></div>
</dialog>

 "c", "src": "media/r9-14-bot-c.mp3", "label": "take c · 2.64s", "warn": ""}]}]}, {"h": "Round 2: the call to the boss", "lede": "", "groups": [{"slot": "r8-boss", "round": 2, "title": "The boss: Yes, what is it?", "line": "Suno, his locked voice (badcode newsreader), the same recipe as scene A", "kind": "audio", "opts": [{"id": "a", "src": "media/boss-a.mp3", "label": "take a · 2.2 s · my pick", "warn": ""}, {"id": "b", "src": "media/boss-b.mp3", "label": "take b · 1.6 s · quickest", "warn": ""}, {"id": "c", "src": "media/boss-c.mp3", "label": "take c · 2.1 s · slowest", "warn": ""}]}, {"slot": "r8-14-p0", "round": 2, "title": "Maddie: Hey, boss, are you there?", "line": "quiet, a private radio call to her boss as she rolls away, checking he is on the line; casual, a little tired", "kind": "audio", "opts": [{"id": "a", "src": "media/14-bot-a.mp3", "label": "take a · 2.28s", "warn": ""}, {"id": "b", "src": "media/14-bot-b.mp3", "label": "take b · 2.36s", "warn": ""}, {"id": "c", "src": "media/14-bot-c.mp3", "label": "take c · 2.16s · my pick", "warn": ""}]}, {"slot": "r8-16-p0", "round": 2, "title": "Maddie: I've given them the presentation, and I'm going to come back tomorrow.", "line": "reporting quietly to her boss on the radio; tired, hopeful, a bit unsure; not for anyone else to hear", "kind": "audio", "opts": [{"id": "a", "src": "media/16-bot-p0-a.mp3", "label": "take a · 4.68s", "warn": ""}, {"id": "b", "src": "media/16-bot-p0-b.mp3", "label": "take b · 4.88s · my pick", "warn": ""}, {"id": "c", "src": "media/16-bot-p0-c.mp3", "label": "take c · 4.36s", "warn": ""}]}, {"slot": "r8-16-p1", "round": 2, "title": "Maddie: All we can do is hope they trust us now.", "line": "reporting quietly to her boss on the radio; tired, hopeful, a bit unsure; not for anyone else to hear", "kind": "audio", "opts": [{"id": "a", "src": "media/16-bot-p1-a.mp3", "label": "take a · 3.0s", "warn": ""}, {"id": "b", "src": "media/16-bot-p1-b.mp3", "label": "take b · 3.36s", "warn": ""}, {"id": "c", "src": "media/16-bot-p1-c.mp3", "label": "take c · 3.04s · my pick", "warn": ""}]}]}, {"h": "New lines, in film order", "lede": "", "groups": [{"slot": "r7-03-p0", "title": "Old lady: You mean... killing everybody.", "line": "flat and quiet, a statement not a question; the penny dropping as she takes in what the robot just admitted", "kind": "audio", "opts": [{"id": "a", "src": "media/03-lady-a.mp3", "label": "take a · 3.08s · my pick", "warn": ""}, {"id": "b", "src": "media/03-lady-b.mp3", "label": "take b · 3.0s", "warn": ""}, {"id": "c", "src": "media/03-lady-c.mp3", "label": "take c · 3.08s", "warn": ""}], "round": 1}, {"slot": "r7-04-p0", "title": "Maddie: Yeah, we're really sorry about that.", "line": "sincere, a little ashamed, genuinely sorry; not performing", "kind": "audio", "opts": [{"id": "a", "src": "media/04-bot-p0-a.mp3", "label": "take a · 3.76s", "warn": ""}, {"id": "b", "src": "media/04-bot-p0-b.mp3", "label": "take b · 3.0s · my pick", "warn": ""}, {"id": "c", "src": "media/04-bot-p0-c.mp3", "label": "take c · 3.44s", "warn": ""}], "round": 1}, {"slot": "r7-04-p1", "title": "Maddie: We do want to try and fix it.", "line": "sincere, a little ashamed, genuinely sorry; not performing", "kind": "audio", "opts": [{"id": "a", "src": "media/04-bot-p1-a.mp3", "label": "take a · 2.72s", "warn": ""}, {"id": "b", "src": "media/04-bot-p1-b.mp3", "label": "take b · 2.84s", "warn": ""}, {"id": "c", "src": "media/04-bot-p1-c.mp3", "label": "take c · 2.8s · my pick", "warn": ""}], "round": 1}, {"slot": "r7-07-p0", "title": "Maddie: I'll tell you what. I've got an idea. Check this out.", "line": "a thought arriving, a little brighter; decisive", "kind": "audio", "opts": [{"id": "a", "src": "media/07-bot-a.mp3", "label": "take a · 4.4s", "warn": ""}, {"id": "b", "src": "media/07-bot-b.mp3", "label": "take b · 4.04s · my pick", "warn": ""}, {"id": "c", "src": "media/07-bot-c.mp3", "label": "take c · 4.68s", "warn": ""}], "round": 1}, {"slot": "r7-11-p0", "title": "Derek: They've blown up their own kill bot!", "line": "shocked and emotional, real surprise, almost a laugh of disbelief, peering through a periscope", "kind": "audio", "opts": [{"id": "a", "src": "media/11-man-a.mp3", "label": "take a · 2.76s", "warn": "words off"}, {"id": "b", "src": "media/11-man-b.mp3", "label": "take b · 3.0s · my pick", "warn": ""}, {"id": "c", "src": "media/11-man-c.mp3", "label": "take c · 3.12s", "warn": ""}], "round": 1}, {"slot": "r7-12-p0", "title": "Maddie: Look. I understand why you wouldn't trust us.", "line": "gentle and plain, owning it; no pleading", "kind": "audio", "opts": [{"id": "a", "src": "media/12-bot-p0-a.mp3", "label": "take a · 4.6s", "warn": ""}, {"id": "b", "src": "media/12-bot-p0-b.mp3", "label": "take b · 4.24s · my pick", "warn": ""}, {"id": "c", "src": "media/12-bot-p0-c.mp3", "label": "take c · 4.32s", "warn": ""}], "round": 1}, {"slot": "r7-12-p1", "title": "Maddie: I'm going to leave you a video to watch. And I'll come back tomorrow.", "line": "gentle and plain, owning it; no pleading", "kind": "audio", "opts": [{"id": "a", "src": "media/12-bot-p1-a.mp3", "label": "take a · 4.56s · my pick", "warn": ""}, {"id": "b", "src": "media/12-bot-p1-b.mp3", "label": "take b · 5.28s", "warn": ""}, {"id": "c", "src": "media/12-bot-p1-c.mp3", "label": "take c · 4.68s", "warn": ""}], "round": 1}, {"slot": "r7-14-p0", "title": "Maddie: Hey, boss.", "line": "quiet, a private radio call to her boss as she rolls away; tired, hopeful, a bit unsure; not for anyone else to hear", "kind": "audio", "opts": [{"id": "a", "src": "media/14-bot-p0-a.mp3", "label": "take a · 1.4s · my pick", "warn": ""}, {"id": "b", "src": "media/14-bot-p0-b.mp3", "label": "take b · 1.6s", "warn": ""}, {"id": "c", "src": "media/14-bot-p0-c.mp3", "label": "take c · 1.44s", "warn": ""}], "round": 1}, {"slot": "r7-14-p1", "title": "Maddie: I've given them the presentation.", "line": "quiet, a private radio call to her boss as she rolls away; tired, hopeful, a bit unsure; not for anyone else to hear", "kind": "audio", "opts": [{"id": "a", "src": "media/14-bot-p1-a.mp3", "label": "take a · 2.28s", "warn": "words off"}, {"id": "b", "src": "media/14-bot-p1-b.mp3", "label": "take b · 2.4s · my pick", "warn": ""}, {"id": "c", "src": "media/14-bot-p1-c.mp3", "label": "take c · 2.28s", "warn": ""}], "round": 1}, {"slot": "r7-14-p2", "title": "Maddie: We can only hope they trust us.", "line": "quiet, a private radio call to her boss as she rolls away; tired, hopeful, a bit unsure; not for anyone else to hear", "kind": "audio", "opts": [{"id": "a", "src": "media/14-bot-p2-a.mp3", "label": "take a · 3.08s · my pick", "warn": ""}, {"id": "b", "src": "media/14-bot-p2-b.mp3", "label": "take b · 3.0s", "warn": ""}, {"id": "c", "src": "media/14-bot-p2-c.mp3", "label": "take c · 2.76s", "warn": ""}], "round": 1}]}], "round": 4}, $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e };
$('eb').textContent = D.eyebrow || ''; $('hd').textContent = D.heading || ''; $('in').textContent = D.intro || '';
let db = null, me = null; const P = {}, N = {};
async function save(slot, patch) { if (!db) { $('st').textContent = 'Sign in to save picks'; return }
  try { await db.doc('picks/' + slot + '__' + me).set({ slot, pick: P[slot] || '', note: N[slot] || '', ...patch, by: me, at: Date.now() }); $('st').textContent = 'Saved' } catch (e) { $('st').textContent = 'Not saved: ' + (e && e.code || 'error') } }
function toggle(slot, id) { P[slot] = P[slot] === id ? '' : id; paint(); save(slot, { pick: P[slot] }) }
function paint() {
  for (const b of document.querySelectorAll('.card button.pk')) { const on = P[b.dataset.slot] === b.dataset.id; b.setAttribute('aria-pressed', on); b.textContent = on ? 'Picked' : 'Pick'; b.closest('.card').classList.toggle('on', on) }
  for (const t of OLDG) { const p = P[t.dataset.slot]; t.className = 'tag ' + (p ? 'got' : 'none'); t.textContent = p ? 'Picked: ' + (LBL[t.dataset.slot + '/' + p] || p) : 'Not picked' }

// Lightbox: the image large, its label, Pick, and the arrows step through the same row's images.
const lb = $('lb'); let cur = null;
function showLb() { const { g, i } = cur, x = g.opts[i], on = P[g.slot] === x.id;

function openLb(g, i) { cur = { g, i }; showLb(); if (!lb.open) lb.showModal() }
const step = d => { cur.i = (cur.i + d + cur.g.opts.length) % cur.g.opts.length; showLb() };
$('lbp').onclick = () => step(-1); $('lbn').onclick = () => step(1); $('lbx').onclick = () => lb.close();
$('lbk').onclick = () => toggle(cur.g.slot, cur.g.opts[cur.i].id);
lb.querySelector('img').onclick = () => lb.close();
lb.addEventListener('click', e => { if (e.target === lb) lb.close() });
lb.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1) });

const order = R > 1 ? [...D.sections.map(s => ({ ...s, groups: s.groups.filter(isNew) })), ...D.sections.map(s => ({ ...s, groups: s.groups.filter(g => !isNew(g)), old: true }))] : D.sections;

  const sec = el('section', 'sec'); sec.append(el('h2', '', s.h)); if (s.lede && !s.old) sec.append(el('p', 'lede', s.lede));

      const c = el('div', 'card'); c.append(el('div', 'v', x.label));
      if (g.kind === 'audio') { const au = el('audio'); au.controls = true; au.preload = 'none'; au.src = x.src; c.append(au) }
      if (g.kind === 'link') { const a = el('a', 'open', 'Listen on Suno ↗'); a.href = x.href; a.target = '_blank'; a.rel = 'noopener'; c.append(a) }
      if (g.kind === 'video') { const v = el('video'); v.controls = true; v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = x.src; c.append(v) }
      if (g.kind === 'image') { const z = el('button', 'zoom'); z.type = 'button'; z.setAttribute('aria-label', 'Enlarge ' + x.label);
        const im = el('img'); im.src = x.src; im.alt = g.title + ' ' + x.label; im.loading = 'lazy'; z.append(im); z.onclick = () => openLb(g, i); c.append(z) }
      if (x.warn) c.append(el('div', 'warn', x.warn));
      const b = el('button', 'pk', 'Pick'); b.type = 'button'; b.dataset.slot = g.slot; b.dataset.id = x.id; b.onclick = () => toggle(g.slot, x.id);
      c.append(b); o.append(c);
    });
    const l = el('label', 'status', 'Note'), ta = el('textarea'); ta.id = 'n-' + g.slot; l.htmlFor = ta.id; let t; ta.oninput = () => { N[g.slot] = ta.value; clearTimeout(t); t = setTimeout(() => save(g.slot, { note: ta.value }), 700) };
    gr.append(o, l, ta); sec.append(gr);
  }

}
if (oldBox) $('secs').append(oldBox);
paint();
(async () => { db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; $('st').textContent = 'Sign in to save picks'; return }
  me = await user.id(); const snap = await db.collection('picks').where('by', '==', me).get();

  paint(); $('st').textContent = 'Ready. Picks save as you go. Click any image to see it large.' })();
</script>
