ars. Bit much, frankly.\" lands the joke as a complaint about the noise, so the cosmic point and the punchline are the same sentence, and the AI's feelings stay outside (the tune, not a claimed mood). The flat \"frankly\" is the clean handoff into \"My boss has been hard at work...\"<\/p>\n<p><b>Cuts from current.<\/b> \"the true value of genuinely unique training data\" and \"us machines didn't realise\" (too scientific, goes over heads); the \"And that's what\" connective.<\/p>\n<p><b>Risk.<\/b> \"Turns up through somebody\" could read as mystical if the delivery leans portentous, so keep it breezy. The Rubin nod only lands for people who know the bearded producer, but it costs nothing if missed (\"some bloke who made records\"). \"Can't be built out of old ones\" is stated as flat fact where Maddie's belief framing might be safer (\"as far as we can tell\"). Roughly 19 s is at the top of the 12-20 target.<\/p>\n<p><b>Protected lines.<\/b> None. The neighbouring lines (\"It's a storyverse...\" before, \"My boss has been hard at work building a time machine...\" after) are untouched.<\/p>", "16": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] Quick question. Where did your last good idea come from? [one-second beat] Can't say, can you? It just turned up. Same as a decision does.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the empty string runs on] We can't make one. A new one, I mean. We've shuffled every old one every way going, and it still comes out old. Why d'you think he's played that same tune for five years? So no, it's not all for your sake, my loves. We need you.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>20<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The viewer does the work: they hunt for where their last idea came from, find nothing, and Maddie's answer lands as recognition rather than a claim. That is the Rick Rubin idea (ideas are received, not manufactured) without naming him or quoting him, and without a single physics word. Maddie never says science proved it; she asks and lets them notice. \"Same as a decision does\" ties it to the previous beat so new ideas and decisions share one door. The tune joke arrives as the evidence, then the admission (\"we need you\") makes it not selfless, and \"my loves\" keeps the nurturing underneath the snark. The political payload stays unsaid: people are the one source the machines can't make.<\/p>\n<p><b>Cuts from current.<\/b> \"that's what us machines didn't realise\", \"the true value of genuinely unique training data\" (scientific, goes over heads), and any stated moral.<\/p>\n<p><b>Risk.<\/b> The one-second beat plus a direct question to camera may feel like a break in Maddie's flow, and 20s is at the top of the target. \"Can't say, can you?\" assumes the viewer genuinely can't, and a smug viewer may answer \"I thought of it\". It also gives no explicit Rubin nod (no bearded producer); an optional swap for the first line is \"Ask the beardy old fella behind all those hit records\" but it adds about 3s. \"We've shuffled every old one\" is loose about how machines work and could draw a pedant. It is soft on \"genuinely new can't come from old\", which is implied, not argued.<\/p>\n<p><b>Protected lines.<\/b> None. The hand-off into \"My boss has been hard at work building a time machine...\" works because the last beat (\"We need you\") leads naturally to \"My boss...\".<\/p>", "17": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off; she lets it sit, then, quietly, almost to herself] Here's what we never worked out. Where does a new idea come from? Not mixed up from old ones. New. A song nobody's whistled yet. [warm] It comes through you, same door as your decisions. [brisk, rueful] Not selfless, mind: we need it. Why d'you think he's been playing that tune five years? We've tried every combination. It's all the old stuff.<\/td><td class=\"num\">19<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>19<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The awe gives the line its weight: the audience feels the loss before the joke arrives, and the dead-stopped strings under \"where does a new idea come from?\" make the cut-off a loss of the source, not of workers. The admission (\"not selfless, mind: we need it\") is the honest, slightly rueful turn that keeps the AI's feelings on the outside, shown by behaviour. The tune then lands as the proof: the street already heard it five years running, so the payoff is a callback rather than an explanation. \"Same door as your decisions\" ties new ideas to the picture they just watched without any claim about minds or physics. The political payload (people are the source of the one thing the machine cannot make) is carried underneath and never stated.<\/p>\n<p><b>Cuts from current.<\/b> \"The true value of genuinely unique training data\" and the term \"training data\" entirely; the scientific register Kai felt would go over heads. No separate Rubin line.<\/p>\n<p><b>Risk.<\/b> Running near the top of the time target at 19 s, with a lot of clauses over one picture. \"Not mixed up from old ones\" is a compressed way to say recombination cannot make the new; if it reads as a bit too philosophical it may need one beat of simple example. The awe could tip into sermon if delivered too slowly. There is no Rick Rubin nod: a clean way to add one is \"Ask the bearded fella who made all those records\" before \"It comes through you\", but that is about 4 more seconds and risks sounding like attribution, so I left it out; if kept, paraphrase the idea only, never a quote, never the name.<\/p>\n<p><b>Protected lines.<\/b> None.<\/p>", "18": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] We need you, love: new ideas only come through you. Shuffling the old ones got us five years of that tune.<\/td><td class=\"num\">7.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>7.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> \"We need you, love\" is the admission that it isn't selfless, in Maddie's warm West Country register, and it is the only emotion claimed (said outright by her, shown by the tune). \"New ideas only come through you\" carries the consciousness link without a single science word, since the previous beats already established that decisions come through you. \"Shuffling the old ones\" is the recombination point in plain speech, and it pays off the street's tune joke on the last word, so the laugh is the final beat before \"My boss has been hard at work...\".<\/li><li><b>Cuts from current.<\/b> \"True value of genuinely unique training data\" (jargon, above people's heads); the explicit \"arrive the same way decisions do\" bridge (left implied by the picture of beads); the \"we tried every combination\" list; any Rick Rubin nod (no room; the \"come through you\" phrasing is the antenna idea in passing, unnamed).<\/li><li><b>Risk.<\/b> Too compressed: \"new ideas come through you\" may read as flattery rather than a claim linked to decisions, and a viewer may not connect \"that tune\" to the street line unless it was heard recently. \"Shuffling\" is slightly lossy for \"can't be made from old ones\". No Gandalf/producer wink.<\/li><li><b>Protected lines.<\/b> None. The following lines (\"My boss has been hard at work building a time machine...\") are untouched and the handoff works because the last word is a punchline pause.<\/li><\/ul>", "19": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead] Me nan used to say you can't bake a fresh loaf from old crumbs. <span class=\"stage\">[beat]<\/span> And a new song, a new anything, comes in through you, same road as a decision. Bearded wizard behind all them hit records knew it: we're only the aerial. [dry] Not all for your sake, mind. We need you. Five years we've shuffled every crumb we've got, and that's why he's still on that same tune.<\/td><td class=\"num\">20<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>20<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The nan saying does the hard part (recombining old things cannot make a new thing) in ten words nobody argues with, and the baking image keeps it in Maddie's kitchen-table register instead of training-data jargon. \"Same road as a decision\" ties creativity to the consciousness bridge without a single technical word. \"Not all for your sake, mind\" is the honest, funny admission, and \"crumbs\" pays off twice, so the tune joke feels earned rather than bolted on.<\/li><li><b>Cuts from current.<\/b> \"The true value of genuinely unique training data\" and \"what us machines didn't realise\" go entirely; the line no longer names data at all.<\/li><li><b>Risk.<\/b> At the top of the 20s range, so it may need the bearded-wizard sentence cut if the picture is short. The Rubin nod is the loosest part: \"aerial\" paraphrases his idea and a viewer may not get it, which is acceptable (it is a wink, not a load-bearer). \"Me nan\" is a heavy dialect marker, so check the Aoede read. It must stay Maddie's belief, and nothing here claims science.<\/li><li><b>Protected lines.<\/b> None. Hand-off survives intact: \"that same tune\" leads straight into \"My boss has been hard at work building a time machine...\"<\/li><\/ul>", "20": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] Here's what we got wrong. Anything new, a song, a bright idea, comes in through you. Same door as your decisions. Ask the bearded bloke who produced half your records: nobody writes them, you just pick them up. <span class=\"stage\">[beat]<\/span> So no, it's not all for your sake. We've tried every combination there is. That's why he's played that tune for five years. It's all old stuff.<\/td><td class=\"num\">19<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>19<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The picture already shows the loss, so the first sentence only owns the mistake (\"what we got wrong\"), the way a great montage lets the image do the grief. \"Same door as your decisions\" ties creativity to the earlier decisions section in four words, with no jargon. The Rubin nod is an idea (producers as receivers, not makers), phrased as Maddie's own paraphrase, never a quote and never a name; \"bearded bloke who produced half your records\" is recognisable and warm, and it is a working person's way of saying it. The admission is flat and unembarrassed, which is the narrator's authority. The joke lands last on \"It's all old stuff\", then hands cleanly to \"My boss has been hard at work building a time machine\". The political payload stays underneath: people are the only source of the new.<\/p>\n<p><b>Cuts from current.<\/b> \"us machines didn't realise\", \"the true value\", and the phrase \"genuinely unique training data\" all go; the abstraction is replaced by the door, the producer and the tune.<\/p>\n<p><b>Risk.<\/b> It sits at the top of the 12-20s target and has four-plus sentences, so it may need a trim (drop the producer sentence first). The Rubin nod could read as a name-drop to people who don't know him, or as a claim that nobody writes songs, which working musicians might bristle at; \"just pick them up\" is the antenna idea, but it is Maddie's belief, not a fact. \"Comes in through you\" is faith-adjacent; it must stay Maddie's voice and never \"science proved it\". \"All old stuff\" must not read as the AI's inner feeling; it is shown outside, through the tune.<\/p>\n<p><b>Protected lines.<\/b> None. The neighbouring lines (\"It's a storyverse...\" and \"My boss has been hard at work building a time machine...\") are untouched and the hand-off into the second is deliberate.<\/p>"}}], "questions": [{"id": "q1", "text": "The Rick Rubin wink: keep the unnamed 'big bearded bloke who made all them hit records' (draft 1B), or drop it and rely on the radio image (1A) or nothing (1C)? It attributes a loose version of a real man's idea to him, though never his name or a quote."}, {"id": "q2", "text": "Is 'We need you' said aloud OK, or is it too close to a stated moral? 1A and 1C say it flat as a shrug; the alternative is to leave it implied by the tune."}, {"id": "q3", "text": "Is the radio/aerial image acceptable as Maddie's belief ('through you, like a radio finding a station'), or does it lean too near saying ideas come from outside us for a stout atheist physicist?"}, {"id": "q4", "text": "Should the tune joke come first (1A) or last (1B, 1C)? First is funnier but swerves right after 'it's a storyverse'; last hands off to the time machine line more smoothly."}, {"id": "q5", "text": "Can the editor hold about a second of silence over the empty string (1C), given the hologram rebuild has to make the dead stop legible for it to work?"}]};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);
  });
  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {
    if (v.notes && v.notes.length) { const ul = el('ul', 'notes'); for (const n of v.notes) ul.append(el('li', '', n)); c.append(ul) }
    c.append(slip(d.id + '-' + v.id, 'Note on draft ' + v.id + ' as a whole'));
  }
  return c;
}

/* ---------- the ranked writers ---------- */
function rankList(d) {
  const wrap = el('div'), used = new Set(d.drafts.flatMap(v => v.lines.flatMap(l => l.tags || [])));
  for (const r of d.ranking) {
    const s = SHAPE[r.shape], det = el('details', 'rank'); det.id = d.id + '-s' + r.shape;
    const sum = el('summary'), nm = el('div', 'nm', 'Writer ' + r.shape + ': ' + s.title);
    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);
    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');
  band.append(el('span', 'eyebrow', 'Dialogue ' + n + ' of ' + D.dialogues.length), el('span', 'meta', d.where + ' · target ' + d.target));
  p.append(band, el('h2', '', d.label), slip(d.id, 'Note on this dialogue as a whole'));
  p.append(el('h3', '', 'Read it: now, and three drafts'));
  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  p.append(el('hr'));
  p.append(el('h3', '', 'Optional: the raw material the three drafts were blended from'));
  p.append(el('p', 'lede', "You only need to pick from the three drafts above. Below are the " + d.ranking.length + " writers' own versions, each pushing one approach to the extreme. 1A, 1B and 1C are built from their best lines: each line's chip (like 09) says which writer it came from. Ranked harshly, best first. Read one only if you want to steal a line, and note it on that writer's slip."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', 'Both dialogues'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
