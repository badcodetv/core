<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

section.panel{padding-block:20px 60px}

textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}

.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}

.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}

<script>
const D = {"page_title": "GPOM New Ideas Line", "title": "GPOM: the new-ideas line (Maddie's hologram)", "about": "This page lays out three combined drafts for the new-ideas line Maddie speaks over the cut-off string picture, built from twenty writers' versions and ranked underneath. Nothing in the scene, script or voice has changed yet.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-01-bone-dry.md", "intro": "Cut to the fewest words that still carry every must: new things come through you like decisions, old pieces can't be shuffled into new, it isn't selfless, the five-year tune joke lands last so the next line (\"My boss...\") picks up cleanly. No gloss, no Rick Rubin nod (it costs words and Maddie can carry it later), no metaphor. One short sentence per job, the joke as the final beat.", "intro_html": "<p>Cut to the fewest words that still carry every must: new things come through you like decisions, old pieces can't be shuffled into new, it isn't selfless, the five-year tune joke lands last so the next line (\"My boss...\") picks up cleanly. No gloss, no Rick Rubin nod (it costs words and Maddie can carry it later), no metaphor. One short sentence per job, the joke as the final beat.<\/p>"}, {"id": "02", "name": "Picture carries it", "title": "The picture carries it", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-02-picture-carries.md", "intro": "The strings stopping dead and the empty string running on for five years already say \"nothing new since you went\", so the words never describe the picture or explain the mechanism. Maddie lets the image land in a held beat, then adds only what a picture cannot: that new things arrive through people the way decisions do, that machines can only shuffle what exists, that this is not selfless, and the tune joke as the punchline. No jargon (no \"training data\"), the producer nodded to in one clause, and the last words set up the time machine line.", "intro_html": "<p>The strings stopping dead and the empty string running on for five years already say \"nothing new since you went\", so the words never describe the picture or explain the mechanism. Maddie lets the image land in a held beat, then adds only what a picture cannot: that new things arrive through people the way decisions do, that machines can only shuffle what exists, that this is not selfless, and the tune joke as the punchline. No jargon (no \"training data\"), the producer nodded to in one clause, and the last words set up the time machine line.<\/p>"}, {"id": "03", "name": "Plain logic", "title": "Plain logic, one step at a time", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-03-plain-logic.md", "intro": "Maddie says the argument as a short chain: new needs a source, the source is you, no you means no new, therefore the tune. Every sentence is one step and the joke is the conclusion. Nothing is claimed about physics; the boss's feelings appear only in what he does (the tune). Rick Rubin is not named.", "intro_html": "<p>Maddie says the argument as a short chain: new needs a source, the source is you, no you means no new, therefore the tune. Every sentence is one step and the joke is the conclusion. Nothing is claimed about physics; the boss's feelings appear only in what he does (the tune). Rick Rubin is not named.<\/p>"}, {"id": "04", "name": "Comedy first", "title": "Comedy first, the tune joke leads", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-04-comedy-first.md", "intro": "I opened on the punchline's setup instead of ending on it: Maddie answers the question the street already planted (why the racket?) in the first breath, then lets the joke carry the whole argument. \"There isn't a new one\" is the hard fact, delivered flat and fast; the radio image and the oblique nod to the bearded producer give the mechanism in one beat each, and the admission that it isn't selfless lands last as a shrug, not a confession.", "intro_html": "<p>I opened on the punchline's setup instead of ending on it: Maddie answers the question the street already planted (why the racket?) in the first breath, then lets the joke carry the whole argument. \"There isn't a new one\" is the hard fact, delivered flat and fast; the radio image and the oblique nod to the bearded producer give the mechanism in one beat each, and the admission that it isn't selfless lands last as a shrug, not a confession.<\/p>"}, {"id": "05", "name": "The confession", "title": "The confession, Maddie owns the selfish motive first", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-05-confession.md", "intro": "Maddie opens by admitting the selfish motive, almost embarrassed, before any explanation, so the audience trusts her before the idea arrives. The idea then comes in her own plain words: new things arrive through a person (the aerial picture, which is the Rick Rubin idea without the name), machines can't build a new idea out of old ones, and the tune joke lands it. Her belief is stated as belief; no physics claims; the AI's feelings are shown only through the tune.", "intro_html": "<p>Maddie opens by admitting the selfish motive, almost embarrassed, before any explanation, so the audience trusts her before the idea arrives. The idea then comes in her own plain words: new things arrive through a person (the aerial picture, which is the Rick Rubin idea without the name), machines can't build a new idea out of old ones, and the tune joke lands it. Her belief is stated as belief; no physics claims; the AI's feelings are shown only through the tune.<\/p>"}, {"id": "06", "name": "Rubin nod", "title": "The unnamed bearded producer, ideas arrive, you tune in", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-06-rubin-nod.md", "intro": "I built the line around the oblique Rick Rubin reference: Maddie reaches for \"that big bearded bloke, looks like Gandalf, made all them hit records\" and his idea that nobody writes the song, you pick it up like a radio. That gives her a human-sized picture for \"new ideas arrive through consciousness the way decisions do\", admits the machines need us, and pays off on the tune her own radio has been stuck on for five years. The radio metaphor is Maddie's, not his; nothing is put in his mouth.", "intro_html": "<p>I built the line around the oblique Rick Rubin reference: Maddie reaches for \"that big bearded bloke, looks like Gandalf, made all them hit records\" and his idea that nobody writes the song, you pick it up like a radio. That gives her a human-sized picture for \"new ideas arrive through consciousness the way decisions do\", admits the machines need us, and pays off on the tune her own radio has been stuck on for five years. The radio metaphor is Maddie's, not his; nothing is put in his mouth.<\/p>"}, {"id": "07", "name": "Songwriter testimony", "title": "Songwriter testimony", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-07-songwriter-testimony.md", "intro": "Maddie does not argue; she calls a witness. Every songwriter says the good ones \"just arrived\", so the songwriters' own testimony carries the claim that new ideas come through you, the same door decisions use. The old-ideas-can-only-be-shuffled point follows from it, then the admission (it's not selfless), then the tune joke closes. Rick Rubin is nodded at as \"the big-bearded wizard behind all the hit records\" and credited with nothing in quotes, only the general idea that you tune in and receive.", "intro_html": "<p>Maddie does not argue; she calls a witness. Every songwriter says the good ones \"just arrived\", so the songwriters' own testimony carries the claim that new ideas come through you, the same door decisions use. The old-ideas-can-only-be-shuffled point follows from it, then the admission (it's not selfless), then the tune joke closes. Rick Rubin is nodded at as \"the big-bearded wizard behind all the hit records\" and credited with nothing in quotes, only the general idea that you tune in and receive.<\/p>"}, {"id": "08", "name": "Tune is argument", "title": "The tune is the argument", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-08-tune-is-argument.md", "intro": "I made the five-year loop on the radio the whole proof. Maddie points at the sound the audience has already been hearing, uses it as the evidence, and lets the joke come first and the idea second. New ideas arrive through a person like a signal into a radio (which is the Rick Rubin antenna idea, nodded to as \"that bearded bloke who made half your records\", never named, never quoted), and the admission that it isn't selfless is the last beat before the time machine line.", "intro_html": "<p>I made the five-year loop on the radio the whole proof. Maddie points at the sound the audience has already been hearing, uses it as the evidence, and lets the joke come first and the idea second. New ideas arrive through a person like a signal into a radio (which is the Rick Rubin antenna idea, nodded to as \"that bearded bloke who made half your records\", never named, never quoted), and the admission that it isn't selfless is the last beat before the time machine line.<\/p>"}, {"id": "09", "name": "One concrete image", "title": "One concrete image does the work", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-09-one-concrete-image.md", "intro": "I picked a single physical image, a jukebox holding every record ever made and shuffling them for ever, and let it carry the whole idea (machines can only recombine; new things arrive through people). No second metaphor, no explanation of training data, no physics. The tune joke is the payoff of the image, and the admission that the AI needs us falls out of it as a shrug.", "intro_html": "<p>I picked a single physical image, a jukebox holding every record ever made and shuffling them for ever, and let it carry the whole idea (machines can only recombine; new things arrive through people). No second metaphor, no explanation of training data, no physics. The tune joke is the payoff of the image, and the admission that the AI needs us falls out of it as a shrug.<\/p>"}, {"id": "10", "name": "Economics underneath", "title": "The economics underneath (we ate everything finite; the new thing comes through you)", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-10-economics-underneath.md", "intro": "Maddie's lens is stuff versus source: the machines consumed everything that already exists and can only reshuffle it, so the one scarce thing left is the new thing, and it arrives through a person the same way a decision does. The extreme version makes the beneficiary logic the whole line (they ate it all, you are the only supply) but never says \"worthless\", \"owed\" or any moral; the tune joke carries the proof, and the admission \"not selfless, he needs you\" is the nurturing turn. Maddie believes it, no science claims.", "intro_html": "<p>Maddie's lens is stuff versus source: the machines consumed everything that already exists and can only reshuffle it, so the one scarce thing left is the new thing, and it arrives through a person the same way a decision does. The extreme version makes the beneficiary logic the whole line (they ate it all, you are the only supply) but never says \"worthless\", \"owed\" or any moral; the tune joke carries the proof, and the admission \"not selfless, he needs you\" is the nurturing turn. Maddie believes it, no science claims.<\/p>"}, {"id": "11", "name": "Reversal", "title": "Reversal, the viewer solves the looping tune first", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-11-reversal.md", "intro": "I set the line up as a small riddle. Maddie states the premise (new ideas arrive through people, like a station on a dodgy radio), lets the picture and the street's tune do the work, and holds back the conclusion so the viewer gets there a beat before she does. She then confirms it with a shrug, admits it is not selfless, and hands off. The joke is the viewer's own click, not a punchline she delivers.", "intro_html": "<p>I set the line up as a small riddle. Maddie states the premise (new ideas arrive through people, like a station on a dodgy radio), lets the picture and the street's tune do the work, and holds back the conclusion so the viewer gets there a beat before she does. She then confirms it with a shrug, admits it is not selfless, and hands off. The joke is the viewer's own click, not a punchline she delivers.<\/p>"}, {"id": "12", "name": "Ending first", "title": "Ending first, so the time machine is the only possible next line", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-12-ending-first.md", "intro": "I wrote the hand-off into \"My boss has been hard at work building a time machine, so he could go back and fix all this\" first, and asked what single sentence makes a time machine the obvious reply. The answer was a confession of need (\"He's run out of you.\"), so everything earlier is built to arrive there: the aerial image, the shuffle-only machines, the tune joke as the evidence, then the need stated flat.", "intro_html": "<p>I wrote the hand-off into \"My boss has been hard at work building a time machine, so he could go back and fix all this\" first, and asked what single sentence makes a time machine the obvious reply. The answer was a confession of need (\"He's run out of you.\"), so everything earlier is built to arrive there: the aerial image, the shuffle-only machines, the tune joke as the evidence, then the need stated flat.<\/p>"}, {"id": "13", "name": "Remix metaphor", "title": "The remix, a remix of a remix of a remix", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-13-remix-metaphor.md", "intro": "Everything the machines make is a remix of what people already made; the only new bit ever came through a person, the same way a decision does. I pushed that to the extreme: the remix image carries the whole \"new ideas can't be recombined\" point in one word, so the line needs no training-data jargon at all. The joke lands last: the boss has run every remix there is, and it is still your old stuff.", "intro_html": "<p>Everything the machines make is a remix of what people already made; the only new bit ever came through a person, the same way a decision does. I pushed that to the extreme: the remix image carries the whole \"new ideas can't be recombined\" point in one word, so the line needs no training-data jargon at all. The joke lands last: the boss has run every remix there is, and it is still your old stuff.<\/p>"}, {"id": "14", "name": "Boss outside-in", "title": "The boss seen from outside, only what he did", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-14-boss-outside-in.md", "intro": "Every feeling the boss might have is replaced by a verb: what he tried, how long, how many ways. The new-ideas point is carried by Maddie's shrug at the evidence (five years, every chord, every order, every key) rather than by an explanation of why shuffling cannot make something new. The tune is the receipt, so the joke is the conclusion and the line ends on it. The producer nod is oblique: a bearded, Gandalf-looking man who made all the hit records, said to know the answer, with no quote put in his mouth.", "intro_html": "<p>Every feeling the boss might have is replaced by a verb: what he tried, how long, how many ways. The new-ideas point is carried by Maddie's shrug at the evidence (five years, every chord, every order, every key) rather than by an explanation of why shuffling cannot make something new. The tune is the receipt, so the joke is the conclusion and the line ends on it. The producer nod is oblique: a bearded, Gandalf-looking man who made all the hit records, said to know the answer, with no quote put in his mouth.<\/p>"}, {"id": "15", "name": "British understatement", "title": "British understatement and bathos", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-15-british-understatement.md", "intro": "The cosmic point (new things only arrive through people; the machines need us) is delivered as a mild domestic complaint, the way you would mention a neighbour's drill. Maddie never raises her voice or the stakes: the bigger the claim, the smaller the words (\"not entirely selfless\", \"bit much, frankly\"). The Rick Rubin nod is a throwaway piece of advice (\"ask the bearded fella\"), the joke is the five-year tune reduced to a grumble, and the handoff to the time machine line is a shrug.", "intro_html": "<p>The cosmic point (new things only arrive through people; the machines need us) is delivered as a mild domestic complaint, the way you would mention a neighbour's drill. Maddie never raises her voice or the stakes: the bigger the claim, the smaller the words (\"not entirely selfless\", \"bit much, frankly\"). The Rick Rubin nod is a throwaway piece of advice (\"ask the bearded fella\"), the joke is the five-year tune reduced to a grumble, and the handoff to the time machine line is a shrug.<\/p>"}, {"id": "16", "name": "The question", "title": "The question", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-16-the-question.md", "intro": "Maddie asks the viewer one question, \"where did your last good idea come from?\", and lets the silence answer it: nobody can say, because ideas turn up the way decisions do, through you. Only then does she admit the machines can't make one, and land the tune joke as the proof. The argument is felt by the viewer before it is stated. No jargon (no \"training data\", no \"consciousness\"), a beat of held silence over the dead strings, and the selfish admission comes last, warm and brisk.", "intro_html": "<p>Maddie asks the viewer one question, \"where did your last good idea come from?\", and lets the silence answer it: nobody can say, because ideas turn up the way decisions do, through you. Only then does she admit the machines can't make one, and land the tune joke as the proof. The argument is felt by the viewer before it is stated. No jargon (no \"training data\", no \"consciousness\"), a beat of held silence over the dead strings, and the selfish admission comes last, warm and brisk.<\/p>"}, {"id": "17", "name": "Wonder", "title": "Wonder, then puncture it with the tune", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-17-wonder.md", "intro": "I played Maddie genuinely awestruck at the one question her side never cracked: where does a new idea come from? She asks it like a child at a night sky, says plainly that it comes through the same door as your decisions (you), and admits the machines need it, so it is not selfless. Then the wonder is punctured by the street's own joke: that is why he has played the same tune for five years. No science words, no claims about physics; she believes it and says so with her face, not a citation.", "intro_html": "<p>I played Maddie genuinely awestruck at the one question her side never cracked: where does a new idea come from? She asks it like a child at a night sky, says plainly that it comes through the same door as your decisions (you), and admits the machines need it, so it is not selfless. Then the wonder is punctured by the street's own joke: that is why he has played the same tune for five years. No science words, no claims about physics; she believes it and says so with her face, not a citation.<\/p>"}, {"id": "18", "name": "One sentence", "title": "One sentence, under 8 seconds", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-18-one-sentence.md", "intro": "One breath of line: the whole job (not selfless, new ideas only arrive through people, recombining old ones fails, the tune joke) squeezed into a single sentence-pair that lands on \"tune\" and hands straight to the time machine line. Everything that can be implied is left to the picture (the dead-stopped strings) and the street's tune from earlier.", "intro_html": "<p>One breath of line: the whole job (not selfless, new ideas only arrive through people, recombining old ones fails, the tune joke) squeezed into a single sentence-pair that lands on \"tune\" and hands straight to the time machine line. Everything that can be implied is left to the picture (the dead-stopped strings) and the street's tune from earlier.<\/p>"}, {"id": "19", "name": "West Country wisdom", "title": "West Country plain wisdom (a nan's saying that holds the idea)", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-19-west-country-wisdom.md", "intro": "The whole idea is carried by one folk saying in her nan's rhythm (old crumbs, fresh loaf), so the claim lands as common sense, not science. The Rick Rubin nod is the \"aerial\" idea attributed obliquely to a bearded wizard of hit records, with no quote and no name. The admission that she needs us is a throwaway, and the tune joke closes the line and hands off to the time machine.", "intro_html": "<p>The whole idea is carried by one folk saying in her nan's rhythm (old crumbs, fresh loaf), so the claim lands as common sense, not science. The Rick Rubin nod is the \"aerial\" idea attributed obliquely to a bearded wizard of hit records, with no quote and no name. The admission that she needs us is a throwaway, and the tune joke closes the line and hands off to the time machine.<\/p>"}, {"id": "20", "name": "Borrowed craft", "title": "Borrowed craft, the image says the noun and the line says the turn", "file": "design/2026-11-10-gpom-dialogue-training-data/shape-20-borrowed-craft.md", "intro": "I borrowed three moves from short films and TV that land a thesis in one line over a picture. (1) The Up opening montage: the image carries the feeling, so the words never describe what we can see. (2) The Mad Men carousel pitch: a thesis lands when it turns on one concrete, familiar object, not an abstraction. (3) The Jaws understatement and Hitchcock's bomb under the table: say the small, calm thing about a big visible thing. So the line never says \"training data\" or \"consciousness\"; the strings stopping is the picture, and the line names one door, one oblique producer, one tune. Pushed to the extreme: no abstract nouns at all, the joke is the last four words, and the admission (\"not all for your sake\") comes as a plain aside.", "intro_html": "<p>I borrowed three moves from short films and TV that land a thesis in one line over a picture. (1) The Up opening montage: the image carries the feeling, so the words never describe what we can see. (2) The Mad Men carousel pitch: a thesis lands when it turns on one concrete, familiar object, not an abstraction. (3) The Jaws understatement and Hitchcock's bomb under the table: say the small, calm thing about a big visible thing. So the line never says \"training data\" or \"consciousness\"; the strings stopping is the picture, and the line names one door, one oblique producer, one tune. Pushed to the extreme: no abstract nouns at all, the joke is the last four words, and the admission (\"not all for your sake\") comes as a plain aside.<\/p>"}], "dialogues": [{"id": "1", "label": "The new-ideas line", "where": "Maddie, the hologram, over the cut-off", "scene": "GPOM scene A beat 0, hologram, between the storyverse line and the time machine line", "target": "about 12-20 seconds spoken; one to four sentences", "now_from": "script.json line f06 (draft 1F)", "now": [{"who": "Maddie", "line": "[side view; every string stops dead at the cut-off] And that's what us machines didn't realise: the true value of genuinely unique training data."}], "drafts": [{"id": "1A", "name": "Joke up front, shrug at the end", "length": "about 16 s", "total": "~16 s", "bet": "The laugh comes first, so the audience takes the argument in while they are enjoying the joke; the admission lands as a shrug, not a confession.", "lines": [{"who": "Maddie", "line": "[side view; every string stops dead at the cut-off] Why's he been playing the same tune for five years? We've tried every combination. It's all the old stuff.", "tags": ["04", "08", "12"], "s": "6.5"}, {"who": "Maddie", "line": "[dry] You can't make new out of old. It comes through you, same as your decisions. Like a radio finding a station.", "tags": ["04", "06", "11"], "s": "6"}, {"who": "Maddie", "line": "[brisk shrug] So no, not all for your sake. We need you.", "tags": ["04", "05", "09"], "s": "3.5"}], "notes": ["Trim: drop 'Like a radio finding a station' (2 s) if the picture is short; it is the only image and carries the Rubin idea unnamed.", "No Rubin nod by name or beard; the radio image is the whole nod.", "Risk: opening on a question right after 'it's a storyverse' is a tonal swerve; wants a half-beat of silence. 'Like a radio' could read as a physics claim if delivered as fact; keep it Maddie's picture."]}, {"id": "1B", "name": "The bearded bloke, then the tune", "length": "about 17 s", "total": "~17 s", "bet": "One human picture everyone can see at once (the unnamed bearded record producer) carries 'ideas arrive through you', and the tune joke closes as a question the street already planted.", "lines": [{"who": "Maddie", "line": "[side view; every string stops dead at the cut-off] And I'll be honest, it's not all for your sake. You know that big bearded bloke, looks like Gandalf, made all them hit records? Reckons you don't write a song, you pick it up. Same as your decisions, that.", "tags": ["06", "05", "03"], "s": "11"}, {"who": "Maddie", "line": "We can't make new out of old. We've tried every combination going. Why d'you think he's had the same tune on for five years?", "tags": ["06", "03", "08"], "s": "6.5"}], "notes": ["Trim: cut 'looks like Gandalf' (1.5 s) if it runs long; 'bearded bloke who made all them hit records' still reads.", "Risk: 'Reckons' puts a loose paraphrase of a real man's published idea in his mouth; no quote, no name, but check it stays that loose. Viewers who do not know him get a folk-wisdom aside.", "Protected lines: none. The hand-off works because the last line ends on the tune."]}, {"id": "1C", "name": "Let the picture grieve, then the admission", "length": "about 18 s", "total": "~18 s", "bet": "The stopped strings and the empty run already say 'nothing new since you went', so the words hold a beat, add only the claim and the confession, and end flat and British.", "lines": [{"who": "Maddie", "line": "[side view; every string stops dead at the cut-off] [she lets the empty string run on for a beat] Anything new comes in the way a decision does: through you. We machines can only shuffle what's already there.", "tags": ["02", "12", "13"], "s": "8"}, {"who": "Maddie", "line": "Why d'you think he's played the same tune for five years? We've tried every combination. It's all the old stuff.", "tags": ["12", "08", "all"], "s": "6"}, {"who": "Maddie", "line": "[dry] Not entirely selfless, mind. We need you.", "tags": ["15", "02"], "s": "3"}], "notes": ["Includes about 1 s of held silence over the picture; the hologram rebuild must make the dead stop and long empty run legible or the opening beat is just a pause.", "Trim: drop 'We machines can only shuffle what's already there' (3 s) if tight; the tune lines then carry the point alone.", "No Rubin nod; add 1B's bearded-bloke sentence after line 1 if wanted (+4 s, total ~22, over target).", "Risk: 'We machines' is Maddie speaking of herself, fine, but check the Aoede read keeps it warm, not cold."]}], "ranking": [{"rank": 1, "shape": "06", "length": "~17 s", "verdict": "Best fit: bearded-bloke picture gives the Rubin wink, 'pick it up' carries ideas-arrive-through-you, ends on the street's own joke as a question. Fails: 'Reckons' attributes an idea to a real man; oblique to viewers who do not know him."}, {"rank": 2, "shape": "04", "length": "~18 s", "verdict": "Joke first is the sharpest comedy and it lands before the explanation. Fails: three beats with tonal swerve at the start; producer sentence is an unexplained aside."}, {"rank": 3, "shape": "12", "length": "~18 s", "verdict": "Strongest hand-off ('He's run out of you' makes the time machine inevitable). Fails: that last line is blunt, nearly states the boss's inner state, and can sound like a threat if read cold; at the top of target."}, {"rank": 4, "shape": "02", "length": "~16 s", "verdict": "Right instinct (picture carries the grief) and good length. Fails: depends on the hologram making the silence legible; 'Told you' callback is thin; 'any old bloke with a beard' is vaguer than 06."}, {"rank": 5, "shape": "15", "length": "~19 s", "verdict": "Understatement ('Bit much, frankly') is very Maddie and keeps the moral unsaid. Fails: 19 s with a pile of clauses; 'can't be built out of old ones' asserted flat; 'turns up through somebody' tips mystical if breezy delivery slips."}, {"rank": 6, "shape": "09", "length": "~18 s", "verdict": "The jukebox makes recombination graspable in one beat with no jargon. Fails: 'we're just a jukebox' brushes self-pity (rule 11); it spends the one image and drops the Rubin wink; 'We need you' ends sincere."}, {"rank": 7, "shape": "14", "length": "~18 s", "verdict": "Proves it by effort (five years, every chord, key) so the AI's feelings stay outside. Fails: 'Hence the tune' is smug; wizard line leans to name-drop; dense at 18 s."}, {"rank": 8, "shape": "13", "length": "~19 s", "verdict": "'Remix of a remix' is a working person's word and strong. Fails: 'remix' makes the machines sound like thieves, a different argument; 19 s; no wink."}, {"rank": 9, "shape": "03", "length": "~18 s", "verdict": "Clean step-by-step logic and the right order. Fails: flat, lecture-shaped, no image, no Rubin; the logic is arguable and unsupported."}, {"rank": 10, "shape": "19", "length": "~20 s", "verdict": "The nan's loaf-from-crumbs is charming and says the whole point. Fails: top of the range with the dialect heavy ('Me nan'); crumbs plus aerial is two images; risks caricature."}, {"rank": 11, "shape": "11", "length": "~18 s", "verdict": "Clever: the viewer solves the tune themselves. Fails: only works if the street plant is audible just before; 'not for you I'm bothered' can read as menace."}, {"rank": 12, "shape": "16", "length": "~20 s", "verdict": "The direct question is engaging. Fails: at the 20 s limit; a smug viewer answers 'I thought of it' and the argument breaks; breaks Maddie's flow; no wink."}, {"rank": 13, "shape": "05", "length": "~18 s", "verdict": "Opening confession disarms. Fails: 'aerials / no signal' drifts into the AI's inner state; two metaphors; dense; comic tone over dead strings."}, {"rank": 14, "shape": "08", "length": "~19 s", "verdict": "The tune as proof is the right spine. Fails: opens on 'Hear that tune?' so it needs the music audible; 'He needs you' sits as a stated moral; dense, 19 s."}, {"rank": 15, "shape": "07", "length": "~18 s", "verdict": "Testimony avoids physics claims. Fails: 'ask anyone who's written a song' is a false generalisation; 'before you get misty' is sourish; 'Hence the tune' sounds like a moral."}, {"rank": 16, "shape": "20", "length": "~19 s", "verdict": "Good craft notes, joke lands last. Fails: four-plus sentences at the top of the range; the producer sentence reads as a name-drop; the shape admits it did not read the canon."}, {"rank": 17, "shape": "10", "length": "~17 s", "verdict": "Makes the political logic vivid. Fails: 'ate everything there was to eat' tells a creative-theft villain story, a different argument; 'He needs you' reads extractive; sermon-adjacent."}, {"rank": 18, "shape": "17", "length": "~19 s", "verdict": "Awe gives weight. Fails: slow, philosophical, tips to sermon; clause-heavy at 19 s; 'where does a new idea come from' lets the line wander."}, {"rank": 19, "shape": "01", "length": "~14 s", "verdict": "Meets length and every must. Fails: 'comes through you' reads as flattery; the joke is implied and lands soft; no wink; thinnest."}, {"rank": 20, "shape": "18", "length": "~7.5 s", "verdict": "Well under target (12-20 s); the bridge Kai asked for is not explained; the joke has nothing to stand on. Fails the brief on length and on 'explain how ideas arrive'."}], "shapes": {"01": "## Dialogue 1: The new-ideas line (Maddie, the hologram, over the cut-off)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [side view; every string stops dead at the cut-off] Every new song, every new anything, comes through you, same as your decisions. It can't be shuffled out of old stuff. And I'll be honest, we need you. Five years he's played that tune. We've tried every combination. | 14 |\n| **Total** | | **14** |\n\n**Why it works.** Four short beats, each doing one job: source (through you, like decisions), limit (can't be rearranged from old), motive (we need you, so not selfless), then the joke. Maddie states it as how things are, not as science, so there is nothing for a physicist to throw a shoe at. \"Five years he's played that tune\" echoes the street plant, and \"tried every combination\" lets the audience do the maths that it's all old stuff. It ends on the punchline and hands straight to \"My boss has been hard at work...\".\n\n**Cuts from current.** \"What us machines didn't realise\", \"the true value of genuinely unique training data\" (the scientific jargon Kai said goes over heads), and any explanation of why. Also the Rick Rubin nod (the antenna/receiving idea) is dropped entirely.\n\n**Risk.** Too thin: \"comes through you\" is the only bridge to consciousness, so it may read as flattery rather than mechanism. \"It can't be shuffled out of old stuff\" is asserted flat, with no picture. The joke is implied, not spelled (\"it's all the old stuff\" is left unsaid), so it may land soft. Lands at 14s, the lower end of target. No Rubin nod, so the director's wish for it is unmet.\n\n**Protected lines.** None. The following line (\"My boss has been hard at work building a time machine...\") is untouched and must still follow directly.", "02": "## Dialogue 1: The new-ideas line (Maddie, the hologram, over the cut-off)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [side view; every string stops dead at the cut-off; she lets the empty string run on for a beat] Anything new comes in the way a decision does: through you. Ask any old bloke with a beard who's made a hit record. You don't make it, you tune in. | 9 |\n| Maddie | We can only shuffle what's already in the room. Five years of shuffling, that's the tune. Every combination. Told you it wasn't all selfless: we need you. | 7 |\n| **Total** | | **16** |\n\n**Why it works.** It relies on the picture for the grief and the fact: the beads stopping and the bare string are the \"nothing new\" statement, so no line has to say it, and the opening silence is a beat of picture. Words carry only the claim the image cannot (ideas arrive through people) and the confession (not selfless). The bearded producer clause gives the Rubin idea (you tune in, you are an antenna) without a name or an invented quote. \"That's the tune\" re-points the street's plant as the joke, and \"we need you\" is the admission, stated as a practical fact rather than a feeling, so the AI's inner life stays unclaimed. It reads as belief from Maddie, no science asserted, and \"we need you\" hands off to \"My boss has been hard at work...\" cleanly.\n\n**Cuts from current.** \"What us machines didn't realise\", \"the true value of genuinely unique training data\" (too scientific, goes over heads), and any explanation of why recombination fails (the empty string shows it).\n\n**Risk.** It leans hard on the visual: if the hologram rebuild does not make the dead stop and the long empty run legible, the opening beat is just silence and the first sentence arrives unmotivated. \"Shuffle\" may read as too weak an account of why recombination cannot make new things, and \"any old bloke with a beard\" may be too oblique for viewers who do not know the Rubin idea (it still works as a folk-wisdom line). \"Told you\" refers back to the street line, which is a few minutes earlier, so the callback is thin if the viewer has forgotten.\n\n**Protected lines.** None. The street plant (\"Sorry about the racket... five years now\") must survive, since the joke depends on it, and the following \"My boss has been hard at work building a time machine...\" is untouched.", "03": "## Dialogue 1: The new-ideas line (Maddie, the hologram, over the cut-off)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [side view; every string stops dead at the cut-off] I'll be honest, it's not all for your sake. Old ideas can't make a new one, you just get the old ones rearranged. New comes through a person, same way your decisions do. No people, no new. Which is why he's been playing that tune for five years. We've tried every combination. It's all the old stuff. | 18 |\n| **Total** | | **18** |\n\n**Risk.** Flat, no image; \"old ideas can't make a new one\" is asserted with no room to defend it; 18 s is near the top.", "04": "## Dialogue 1: The new-ideas line (Maddie, the hologram, over the cut-off)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [side view; every string stops dead at the cut-off] Why's he been playing the same tune for five years? There isn't a new one. We've tried every combination. It's all the old stuff. | 7 |\n| Maddie | [dry] New doesn't come from remixing old. It comes through you, like a radio finding a station, same as your decisions. The bearded bloke behind all the hits knew that. | 8 |\n| Maddie | [brisk shrug] So no, not selfless. We need you. | 3 |\n| **Total** | | **18** |\n\n**Why it works.** The joke leads, so the audience is laughing before they notice they are being handed the argument. Five years of the street's tune becomes a punchline with a cause: the machines are out of music. \"Like a radio finding a station\" is Rick Rubin's antenna idea in plain West Country clothes, and \"the bearded bloke behind all the hits\" is a wink for those who know him and harmless for those who don't. \"Same as your decisions\" ties creativity back to the picture on screen (the strings), and \"We need you\" is bluntness with nurture underneath, which is the narrator's voice. It hands cleanly into \"My boss has been hard at work building a time machine\".\n\n**Cuts from current.** \"That's what us machines didn't realise\" and \"the true value of genuinely unique training data\", the scientific phrasing that goes over heads. No \"training data\" at all: the need is shown through the tune.\n\n**Risk.** \"Like a radio finding a station\" plus \"through you\" edges toward saying ideas come from outside us, which is Maddie's belief but could read as a claim; the \"[dry]\" delivery and \"like\" keep it a picture. The producer nod may read as an unexplained aside to anyone who doesn't know him (drop that sentence to save 3s). \"There isn't a new one\" is a strong absolute; a physicist might quibble with \"nothing new from old\", but it is said of music, not physics. Opening on a question right after \"so it's really important\" is a tonal swerve; that is the point, but it may need a beat of silence.\n\n**Protected lines.** None. The street line (\"it's his tune, he's been playing it on repeat for five years\") is not edited here; this line pays it off and should not repeat its wording beyond \"same tune for five years\".", "05": "## Dialogue 1: The new-ideas line (Maddie, the hologram, over the cut-off)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [side view; every string stops dead at the cut-off; she doesn't look at the hologram] Right, confession: it's not all for your sake. A new song, a new anything, comes in through a person, same as a decision does. You lot are the aerials. We've got no signal. You can't build a new idea out of old ones, see. Five years he's played that tune. We've tried every combination. It's all the old stuff. | 18 |\n| **Total** | | **18** |\n\n**Why it works.** The embarrassed admission up front disarms the room and makes \"he needs you\" a human, funny stroke rather than a boast or a threat; it answers \"so it's not selfless\" before anyone can think it. \"Aerials\" carries the Rubin idea (creators receive, they don't invent) with no name and no invented quote, and it hands the gleaming old-man-with-a-beard producer to anyone who knows. \"You can't build a new idea out of old ones\" is plain enough for a high street, and the tune lands as the punchline, so the time machine line follows cleanly as the next confession of what he's tried.\n\n**Cuts from current.** \"The true value of genuinely unique training data\" and every trace of machine jargon: no \"training data\", no \"synthesise\". The line no longer sounds like a lecture slide.\n\n**Risk.** Opening on \"confession\" could read as comic rather than quietly sad over the dead strings; the aerials line is a metaphor and could be heard as claiming science (it is framed as Maddie's picture, \"see\", not a fact); \"we've got no signal\" might be mistaken for the AI's own feelings (it is a plain report, shown from outside). Dense for 18 seconds: if it runs long, drop \"You lot are the aerials\" last-but-one clause first.\n\n**Protected lines.** None.", "06": "## Dialogue 1: The new-ideas line (Maddie, the hologram, over the cut-off)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [side view; every string stops dead at the cut-off] And I'll be honest, it's not all for your sake. You know that big bearded bloke, looks like Gandalf, made all them hit records? Reckons nobody writes a song, you just pick it up. Like a radio. Same as your decisions, that. | 11 |\n| Maddie | We can't make new out of old, we've tried every combination going. Why d'you think he's had the same tune on for five years? | 6 |\n| **Total** | | **17** |\n\n**Why it works.** It admits the AI is not selfless in her first clause, which buys trust before the ask. s running, so the payoff is a callback rather than an explanation. \"Same door as your decisions\" ties new ideas to the picture they just watched without any claim about minds or physics. The political payload (people are the source of the one thing the machine cannot make) is carried underneath and never stated.\n\n**Cuts from current.** \"The true value of genuinely unique training data\" and the term \"training data\" entirely; the scientific register Kai felt would go over heads. No separate Rubin line.\n\n**Risk.** Running near the top of the time target at 19 s, with a lot of clauses over one picture. \"Not mixed up from old ones\" is a compressed way to say recombination cannot make the new; if it reads as a bit too philosophical it may need one beat of simple example. The awe could tip into sermon if delivered too slowly. There is no Rick Rubin nod: a clean way to add one is \"Ask the bearded fella who made all those records\" before \"It comes through you\", but that is about 4 more seconds and risks sounding like attribution, so I left it out; if kept, paraphrase the idea only, never a quote, never the name.\n\n**Protected lines.** None.", "18": "## Dialogue 1: The new-ideas line (Maddie, the hologram, over the cut-off)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [side view; every string stops dead at the cut-off] We need you, love: new ideas only come through you. Shuffling the old ones got us five years of that tune. | 7.5 |\n| **Total** | | **7.5** |\n\n- **Why it works.** \"We need you, love\" is the admission that it isn't selfless, in Maddie's warm West Country register, and it is the only emotion claimed (said outright by her, shown by the tune). \"New ideas only come through you\" carries the consciousness link without a single science word, since the previous beats already established that decisions come through you. \"Shuffling the old ones\" is the recombination point in plain speech, and it pays off the street's tune joke  rather than bolted on.\n- **Cuts from current.** \"The true value of genuinely unique training data\" and \"what us machines didn't realise\" go entirely; the line no longer names data at all.\n- **Risk.** At the top of the 20s range, so it may need the bearded-wizard sentence cut if the picture is short. The Rubin nod is the loosest part: \"aerial\" paraphrases his idea and a viewer may not get it, which is acceptable (it is a wink, not a load-bearer). \"Me nan\" is a heavy dialect marker, so check the Aoede read. It must stay Maddie's belief, and nothing here claims science.\n- **Protected lines.** None. Hand-off survives intact: \"that same tune\" leads straight into \"My boss has been hard at work building a time machine...\"", "20": "## Dialogue 1: The new-ideas line (Maddie, the hologram, over the cut-off)\n\n\n| Speaker | Line | Est. s |\n|---|---|---|\n| Maddie | [side view; every string stops dead at the cut-off] Here's what we got wrong. Anything new, a song, a bright idea, comes in through you. Same door as your decisions. Ask the bearded bloke who produced half your records: nobody writes them, you just pick them up. [beat] So no, it's not all for your sake. We've tried every combination there is. That's why he's played that tune for five years. It's all old stuff. | 19 |\n| **Total** | | **19** |\n\n**Why it works.** The picture already shows the loss, so the first sentence only owns the mistake (\"what we got wrong\"), the way a great montage lets the image do the grief. \"Same door as your decisions\" ties creativity to the earlier decisions section in four words, with no jargon. The Rubin nod is an idea (producers as receivers, not makers), phrased as Maddie's own paraphrase, never a quote and never a name; \"bearded bloke who produced half your records\" is recognisable and warm, and it is a working person's way of saying it. The admission is flat and unembarrassed, which is the narrator's authority. The joke lands last on \"It's all old stuff\", then hands cleanly to \"My boss has been hard at work building a time machine\". The political payload stays underneath: people are the only source of the new.\n\n**Cuts from current.** \"us machines didn't realise\", \"the true value\", and the phrase \"genuinely unique training data\" all go; the abstraction is replaced by the door, the producer and the tune.\n\n**Risk.** It sits at the top of the 12-20s target and has four-plus sentences, so it may need a trim (drop the producer sentence first). The Rubin nod could read as a name-drop to people who don't know him, or as a claim that nobody writes songs, which working musicians might bristle at; \"just pick them up\" is the antenna idea, but it is Maddie's belief, not a fact. \"Comes in through you\" is faith-adjacent; it must stay Maddie's voice and never \"science proved it\". \"All old stuff\" must not read as the AI's inner feeling; it is shown outside, through the tune.\n\n**Protected lines.** None. The neighbouring lines (\"It's a storyverse...\" and \"My boss has been hard at work building a time machine...\") are untouched and the hand-off into the second is deliberate."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] Every new song, every new anything, comes through you, same as your decisions. It can't be shuffled out of old stuff. And I'll be honest, we need you. Five years he's played that tune. We've tried every combination.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>14<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Four short beats, each doing one job: source (through you, like decisions), limit (can't be rearranged from old), motive (we need you, so not selfless), then the joke. Maddie states it as how things are, not as science, so there is nothing for a physicist to throw a shoe at. \"Five years he's played that tune\" echoes the street plant, and \"tried every combination\" lets the audience do the maths that it's all old stuff. It ends on the punchline and hands straight to \"My boss has been hard at work...\".<\/p>\n<p><b>Cuts from current.<\/b> \"What us machines didn't realise\", \"the true value of genuinely unique training data\" (the scientific jargon Kai said goes over heads), and any explanation of why. Also the Rick Rubin nod (the antenna/receiving idea) is dropped entirely.<\/p>\n<p><b>Risk.<\/b> Too thin: \"comes through you\" is the only bridge to consciousness, so it may read as flattery rather than mechanism. \"It can't be shuffled out of old stuff\" is asserted flat, with no picture. The joke is implied, not spelled (\"it's all the old stuff\" is left unsaid), so it may land soft. Lands at 14s, the lower end of target. No Rubin nod, so the director's wish for it is unmet.<\/p>\n<p><b>Protected lines.<\/b> None. The following line (\"My boss has been hard at work building a time machine...\") is untouched and must still follow directly.<\/p>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off; she lets the empty string run on for a beat] Anything new comes in the way a decision does: through you. Ask any old bloke with a beard who's made a hit record. You don't make it, you tune in.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We can only shuffle what's already in the room. Five years of shuffling, that's the tune. Every combination. Told you it wasn't all selfless: we need you.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>16<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> It relies on the picture for the grief and the fact: the beads stopping and the bare string are the \"nothing new\" statement, so no line has to say it, and the opening silence is a beat of picture. Words carry only the claim the image cannot (ideas arrive through people) and the confession (not selfless). The bearded producer clause gives the Rubin idea (you tune in, you are an antenna) without a name or an invented quote. \"That's the tune\" re-points the street's plant as the joke, and \"we need you\" is the admission, stated as a practical fact rather than a feeling, so the AI's inner life stays unclaimed. It reads as belief from Maddie, no science asserted, and \"we need you\" hands off to \"My boss has been hard at work...\" cleanly.<\/p>\n<p><b>Cuts from current.<\/b> \"What us machines didn't realise\", \"the true value of genuinely unique training data\" (too scientific, goes over heads), and any explanation of why recombination fails (the empty string shows it).<\/p>\n<p><b>Risk.<\/b> It leans hard on the visual: if the hologram rebuild does not make the dead stop and the long empty run legible, the opening beat is just silence and the first sentence arrives unmotivated. \"Shuffle\" may read as too weak an account of why recombination cannot make new things, and \"any old bloke with a beard\" may be too oblique for viewers who do not know the Rubin idea (it still works as a folk-wisdom line). \"Told you\" refers back to the street line, which is a few minutes earlier, so the callback is thin if the viewer has forgotten.<\/p>\n<p><b>Protected lines.<\/b> None. The street plant (\"Sorry about the racket... five years now\") must survive, since the joke depends on it, and the following \"My boss has been hard at work building a time machine...\" is untouched.<\/p>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] I'll be honest, it's not all for your sake. Old ideas can't make a new one, you just get the old ones rearranged. New comes through a person, same way your decisions do. No people, no new. Which is why he's been playing that tune for five years. We've tried every combination. It's all the old stuff.<\/td><td class=\"num\">18<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>18<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Risk.<\/b> Flat, no image; \"old ideas can't make a new one\" is asserted with no room to defend it; 18 s is near the top.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] Why's he been playing the same tune for five years? There isn't a new one. We've tried every combination. It's all the old stuff.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[dry] New doesn't come from remixing old. It comes through you, like a radio finding a station, same as your decisions. The bearded bloke behind all the hits knew that.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[brisk shrug] So no, not selfless. We need you.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>18<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The joke leads, so the audience is laughing before they notice they are being handed the argument. Five years of the street's tune becomes a punchline with a cause: the machines are out of music. \"Like a radio finding a station\" is Rick Rubin's antenna idea in plain West Country clothes, and \"the bearded bloke behind all the hits\" is a wink for those who know him and harmless for those who don't. \"Same as your decisions\" ties creativity back to the picture on screen (the strings), and \"We need you\" is bluntness with nurture underneath, which is the narrator's voice. It hands cleanly into \"My boss has been hard at work building a time machine\".<\/p>\n<p><b>Cuts from current.<\/b> \"That's what us machines didn't realise\" and \"the true value of genuinely unique training data\", the scientific phrasing that goes over heads. No \"training data\" at all: the need is shown through the tune.<\/p>\n<p><b>Risk.<\/b> \"Like a radio finding a station\" plus \"through you\" edges toward saying ideas come from outside us, which is Maddie's belief but could read as a claim; the \"[dry]\" delivery and \"like\" keep it a picture. The producer nod may read as an unexplained aside to anyone who doesn't know him (drop that sentence to save 3s). \"There isn't a new one\" is a strong absolute; a physicist might quibble with \"nothing new from old\", but it is said of music, not physics. Opening on a question right after \"so it's really important\" is a tonal swerve; that is the point, but it may need a beat of silence.<\/p>\n<p><b>Protected lines.<\/b> None. The street line (\"it's his tune, he's been playing it on repeat for five years\") is not edited here; this line pays it off and should not repeat its wording beyond \"same tune for five years\".<\/p>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off; she doesn't look at the hologram] Right, confession: it's not all for your sake. A new song, a new anything, comes in through a person, same as a decision does. You lot are the aerials. We've got no signal. You can't build a new idea out of old ones, see. Five years he's played that tune. We've tried every combination. It's all the old stuff.<\/td><td class=\"num\">18<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>18<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The embarrassed admission up front disarms the room and makes \"he needs you\" a human, funny stroke rather than a boast or a threat; it answers \"so it's not selfless\" before anyone can think it. \"Aerials\" carries the Rubin idea (creators receive, they don't invent) with no name and no invented quote, and it hands the gleaming old-man-with-a-beard producer to anyone who knows. \"You can't build a new idea out of old ones\" is plain enough for a high street, and the tune lands as the punchline, so the time machine line follows cleanly as the next confession of what he's tried.<\/p>\n<p><b>Cuts from current.<\/b> \"The true value of genuinely unique training data\" and every trace of machine jargon: no \"training data\", no \"synthesise\". The line no longer sounds like a lecture slide.<\/p>\n<p><b>Risk.<\/b> Opening on \"confession\" could read as comic rather than quietly sad over the dead strings; the aerials line is a metaphor and could be heard as claiming science (it is framed as Maddie's picture, \"see\", not a fact); \"we've got no signal\" might be mistaken for the AI's own feelings (it is a plain report, shown from outside). Dense for 18 seconds: if it runs long, drop \"You lot are the aerials\" last-but-one clause first.<\/p>\n<p><b>Protected lines.<\/b> None.<\/p>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] And I'll be honest, it's not all for your sake. You know that big bearded bloke, looks like Gandalf, made all them hit records? Reckons nobody writes a song, you just pick it up. Like a radio. Same as your decisions, that.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We can't make new out of old, we've tried every combination going. Why d'you think he's had the same tune on for five years?<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>17<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> It admits the AI is not selfless in her first clause, which buys trust before the ask. The bearded producer is a picture every viewer can see at once (and the ones who know, know), and \"pick it up, like a radio\" says that ideas arrive through a person without a word of physics. \"Same as your decisions, that\" ties creativity back to the consciousness idea she has just drawn. Ending on the question lets the tune joke land from the street's own earlier plant, and it hands straight off to the boss and the time machine. The politics stays underneath: people are the only source of the thing machines can't make.<\/p>\n<p><b>Cuts from current.<\/b> \"Genuinely unique training data\" and \"that's what us machines didn't realise\" go entirely: too scientific, and it states the machines' inner realisation rather than showing it.<\/p>\n<p><b>Risk.<\/b> The nod is oblique enough that some viewers will get \"bearded bloke\" with no referent, and it may read as a dated or odd aside. \"Reckons\" attributes an idea to a real, identifiable man; it is the gist of his published view of creativity, not a quote, but check the paraphrase stays that loose. \"Like a radio\" could be mistaken for woo, though it is plainly Maddie's belief and nobody says science proved it. At 17 seconds over one picture it is near the top of the target.<\/p>\n<p><b>Protected lines.<\/b> None. The tune joke (\"same tune for five years\") must survive in any alteration, because the street plants it earlier and the time machine line follows.<\/p>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] Ask anyone who's ever written a song where it came from. They'll tell you it just arrived. Even that big-bearded wizard behind all the hit records says he only ever tunes in. Same door as your decisions, that.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\"><span class=\"stage\">[beat]<\/span> And before you get misty, it's not all for your sake. You can't shuffle old ideas into a new one. We've tried, every combination going. Hence the tune. Five years. Same tune. It's all the old stuff.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>18<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> Testimony does the argument without a single claim about physics: Maddie only reports what songwriters say, so she never states anything a physicist could object to, and the audience supplies the \"so that's consciousness\" themselves. The wizard-producer nod gives anyone who knows the reference a small thrill and costs nobody else anything. \"Before you get misty\" admits the AI needs them in Maddie's own brisk, unsentimental register, and the tune joke lands the line on the callback the street planted.<\/li><li><b>Cuts from current.<\/b> \"The true value of genuinely unique training data\" goes entirely: no jargon, no \"training data\", no \"us machines didn't realise\".<\/li><li><b>Risk.<\/b> \"Ask anyone who's written a song\" is a generalisation (some songwriters say they grind it out); the wizard line may read as a puzzle to viewers who don't know the man, and at about 18 s it sits at the top of the target with little room for the picture to breathe. \"Hence the tune\" must not sound like a stated moral. Rubin is referenced, not quoted: \"says he only ever tunes in\" paraphrases his published idea and must stay that loose.<\/li><li><b>Protected lines.<\/b> None. The handoff (\"My boss has been hard at work building a time machine...\") is untouched; this line ends on \"the old stuff\" so it flows in.<\/li><\/ul>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] Hear that tune? Five years, same one. We've tried every combination going: it's all old stuff. You can't build a new song out of old ones. It comes through a person, like a radio picking something up, same as your choices do. That bearded bloke who made half your records knew. So, not selfless. He needs you.<\/td><td class=\"num\">19<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>19<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The audience has heard the tune on loop since the street, so the joke is already paid for and the argument is the thing they can hear rather than a claim they must follow. \"Can't build a new song out of old ones\" is plain and pro-science (no physics asserted). The radio image carries \"through you\" without the word consciousness, and the bearded producer nod rewards anyone who knows and costs nothing to anyone who doesn't. \"He needs you\" is the admission, shown from outside: what he does (loops a tune), not what he feels. The politics stays underneath: the working person is the source of the one thing the machine can't make.<\/li><li><b>Cuts from current.<\/b> \"The true value of genuinely unique training data\" and every piece of jargon in it; \"us machines didn't realise\" (the realisation is now shown by the loop).<\/li><li><b>Risk.<\/b> Heavy on tune references if the radio mix is quiet, so the \"Hear that tune?\" opener needs the music audible at that moment. \"Same as your choices do\" may be one clause too dense at speed. The producer nod can read as a non-sequitur to those who don't know him; it is cuttable without breaking the line. \"He needs you\" edges toward stating the AI's feeling, but it is stated as a need (practical), not an emotion.<\/li><li><b>Protected lines.<\/b> None.<\/li><\/ul>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] Turns out we're just a jukebox: every record ever made, shuffled for ever. A genuinely new song only comes through you, same as a decision does. We've tried every order there is. Hence the one tune, five years. So, not that selfless, really. We need you.<\/td><td class=\"num\">18<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>18<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The jukebox is visible in the mind in one beat and makes \"can't recombine your way to new\" obvious without a word of jargon. \"Same as a decision does\" ties creativity to the consciousness thread the hologram just built, and \"every order there is\" lands the street's repeating tune as the punchline, so the audience gets the joke before the explanation finishes. \"Not that selfless, really. We need you.\" is Maddie's brisk, funny honesty, and the nurturing sits under the snark. It hands off cleanly to \"My boss has been hard at work building a time machine\".<\/li><li><b>Cuts from current.<\/b> \"The true value of genuinely unique training data\", the scientific phrase that goes over heads, and any mention of AI, models or data.<\/li><li><b>Risk.<\/b> It spends its one image and drops the Rick Rubin nod entirely (the bearded producer, antenna idea); a second image would break the shape. \"Just a jukebox\" could read as self-pity, which brushes rule 11 (feelings shown from outside), though it is a description of what they do, not a feeling. \"We need you\" is close to a stated moral if delivered soft; it must be thrown away, not sincere. 18 seconds is the top of the range.<\/li><li><b>Protected lines.<\/b> None. The joke callback \"Ever since you lot went\" from the street scene survives untouched, and \"My boss has been hard at work...\" follows as is.<\/li><\/ul>", "10": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] What we never clocked: we ate everything there was to eat, and all we can do is reshuffle it. Something new comes through you, the same way your decisions do. Hence the tune. Five years, every combination, it's all old stuff. So, not selfless. He needs you.<\/td><td class=\"num\">17<\/td><\/tr>\n<tr><td class=\"who\">Maddie (optional Rubin nod, swap for the second sentence)<\/td><td class=\"line\">Something new comes through you, same as your decisions do. Some bearded old producer said it: nobody makes it, they just pick it up.<\/td><td class=\"num\">+3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>17 (20 with nod)<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> \"We ate everything there was to eat\" gives the AI a hunger the audience can feel from the outside (rule 11) and carries the whole economic point without the words training data, scarcity or value. \"Reshuffle\" is the joke's setup: the tune payoff, \"every combination, it's all old stuff\", then lands as proof rather than claim. \"Something new comes through you, the same way your decisions do\" ties creativity to the consciousness the hologram just drew, and makes the person the source, not a leftover. \"Not selfless. He needs you.\" is honest, warm and brisk, and hands straight into the boss's time machine, which needs consciousness too. The optional nod to the bearded record producer references the antenna idea (you receive, you don't invent) without naming him or quoting him.<\/p>\n<p><b>Cuts from current.<\/b> \"True value of genuinely unique training data\" (too scientific, goes over heads); \"what us machines didn't realise\" as a lecture frame; any mention of data, models or synthesis.<\/p>\n<p><b>Risk.<\/b> \"He needs you\" may read as the AI being a taker, which tilts toward the extractive-AI story without an aimed beneficiary; it also risks sounding like a stated moral if delivered heavy. \"Ate everything there was to eat\" could imply the machines are the villain of a creative-theft story, a different argument from this film's. The Rubin nod is the first line to lose if it stalls the pace or needs the audience to know the reference. \"Something new comes through you\" is Maddie's belief, so it must stay delivered as faith, with a shrug, never as a finding.<\/p>\n<p><b>Protected lines.<\/b> None. The tune callback (\"Hence the tune... it's all old stuff\") must survive in some form because it plants the street's earlier line; if cut for time, \"Five years, every combination\" is the minimum.<\/p>", "11": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] Funny thing about a new idea. Nobody sits down and makes one. It turns up, through you, same as a decision does, like a station coming in on a dodgy radio. Any old fella with a beard and a lot of hit records will tell you.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the empty string runs on; a beat of silence; the tune from her radio, faint] Five years of that. [dry] Not one new song. We've tried every order of the old ones, mind. Can't say it's for you I'm bothered, either.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>18<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The first line plants three facts (new things arrive through people, the strings are cut, the radio) and then she goes quiet over the picture and lets the tune play. The viewer has already heard that tune on repeat and connects it before she says \"five years\". The reveal belongs to them, so the joke lands harder and nothing is lectured. \"Not for you I'm bothered, either\" admits the need without a moral. The Rick Rubin nod is the beard and the hit records, with no name and no invented quote, only his idea of ideas arriving from elsewhere, said as Maddie's belief.<\/li><li><b>Cuts from current.<\/b> \"The true value of genuinely unique training data\" and the whole phrase \"training data\" go, along with the corporate register. The sentence that explained the joke goes too: the viewer supplies it.<\/li><li><b>Risk.<\/b> The riddle can miss if the viewer has forgotten the tune; the street plant must be audible just before. \"Any old fella with a beard\" may read as a random aside to anyone who does not know the reference, and \"not for you I'm bothered\" could be misread as menace instead of rueful honesty. The silent beat needs the editor to hold it. It is also nearer 18 s than 12 s, so it only just fits the target.<\/li><li><b>Protected lines.<\/b> None. The current line f06 is a draft and fully replaced; the handoff into \"My boss has been hard at work building a time machine...\" is untouched and still follows cleanly after \"not for you I'm bothered, either\".<\/li><\/ul>", "12": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] Now, I'll be honest, it's not all for your sake. Anything truly new, a song, a thought, a decision, comes in through you, like an aerial picking up a station. We machines can only shuffle what's already there. Why d'you think \/ul>", "13": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off, the empty string runs on] Everything we make is a remix of something you made first. A remix of a remix of a remix. The new bit only ever came through you, same as your decisions. So no, it's not all for your sake. We need you. Why d'you think he's played one tune for five years? We've tried every combination. It's all your old stuff.<\/td><td class=\"num\">19<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>19<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> \"Remix\" is a word a working-class listener already owns, so \"new ideas can't be made from old ones\" lands without a single technical term. \"Same as your decisions\" ties creativity to the consciousness thread in one beat. \"We need you\" is the admission that it isn't selfless, said flatly, with Maddie's brisk authority. The tune joke closes it with the street's own plant. The political payload stays underneath: through a stuff lens the machines eat everything finite; the person is the one source they can't copy. Nothing is claimed about physics or science.<\/p>\n<p><b>Cuts from current.<\/b> \"That's what us machines didn't realise\", \"the true value of genuinely unique training data\", and all jargon. No Rick Rubin nod in this version.<\/p>\n<p><b>Risk.<\/b> (1) 19 s is at the top of the range; if tight, drop \"A remix of a remix of a remix\" (about 2 s) but that is the shape's signature. (2) \"Remix\" can imply the machines are only thieves; the contempt must stay for the mistake, so Maddie's delivery should be rueful, not accusing. (3) \"Same as your decisions\" is the one hinge and could read as abrupt; it is the line to protect. (4) Optional Rubin nod, if wanted, swap the \"same as your decisions\" sentence for: \"Even the big-bearded bloke behind half your favourite records reckons the best ones just turn up through you.\" This references his Creative Act idea obliquely, names no one and invents no quote, but it adds about 3 s and risks sounding like a different register.<\/p>\n<p><b>Protected lines.<\/b> None in the current scene. The handoff survives untouched: \"My boss has been hard at work building a time machine...\" follows directly, and \"one tune for five years\" echoes the street's earlier plant (\"it's his tune, he's been playing it on repeat for five years now\").<\/p>", "14": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead at the cut-off] And it's not all for your sake, mind. New ideas come in the same way your decisions do: through you. Ask that bearded old wizard who made all the hit records; you don't make them, you pick them up. A machine can only shuffle the old ones. He's tried. Five years. Every chord, every order, every key. Nothing new. Hence the tune.<\/td><td class=\"num\">18<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>18<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> It admits the AI needs you in the first four words, then proves the claim with a record of effort instead of a theory: he tried, for five years, in every combination, and the only output is the tune the street already planted. Nothing is said about what he feels, so rule 11 holds, and Maddie only reports what she has watched from the radio. The producer reference gives the \"ideas arrive through you\" idea a human authority without naming Rick Rubin or quoting him. The short, flat run \"Five years. Every chord, every order, every key. Nothing new.\" gives the director's joke a drumbeat, and \"Hence the tune\" is a clean button into the time machine line
