body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}

textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}

.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}

.md .tbl{overflow-x:auto}

.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}

<script>
const D = {"page_title": "Same Bench Dialogue", "title": "Same Bench dialogue options", "about": "This page lays out ten writers' versions of the Same Bench dialogue, ranked, and three combined drafts for the whole 14-second short. Nothing in the scene, script or voices has changed yet.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-01-bone-dry.md", "intro": "Cut every word that the picture can say. The only spoken line is the protected \"Forget it.\", said twice in the same flat voice so the echo does the work, and the button is a third use of it, said before the stranger has opened their mouth. Captions are two words. No explanation, no moral: the repetition is the argument.", "intro_html": "<p>Cut every word that the picture can say. The only spoken line is the protected \"Forget it.\", said twice in the same flat voice so the echo does the work, and the button is a third use of it, said before the stranger has opened their mouth. Captions are two words. No explanation, no moral: the repetition is the argument.<\/p>"}, {"id": "02", "name": "Picture carries it", "title": "The picture carries it", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-02-picture-carries.md", "intro": "The pictures already say who is on the bench, what he did to them and that he never changes, so the words only do what a drawing cannot: the one shared line, and the button. Every line the image can say (war, wounds, thanks, pay, the same face) is cut. Pushed to the extreme, the whole short is two spoken words, repeated, and a button that is a silent action. The echo is built by the drawing: identical framing, identical pose, same bench, only the person next to him changes.", "intro_html": "<p>The pictures already say who is on the bench, what he did to them and that he never changes, so the words only do what a drawing cannot: the one shared line, and the button. Every line the image can say (war, wounds, thanks, pay, the same face) is cut. Pushed to the extreme, the whole short is two spoken words, repeated, and a button that is a silent action. The echo is built by the drawing: identical framing, identical pose, same bench, only the person next to him changes.<\/p>"}, {"id": "03", "name": "Plain logic", "title": "The logic said plainly", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-03-plain-logic.md", "intro": "The fat cat is the only one who reasons, and he does it out loud, flat and unembarrassed, like a man reading out a rule of the universe. He states the whole argument (you were useful, you are not now, so forget it) in three short clauses, then ends on the protected \"Forget it.\" In beat B the same syllogism comes back trimmed, because he has said it so often he no longer needs all the steps. The veteran and the nurse never speak: their silence keeps the target on him. The button is the same logic applied to the audience, a single deadpan sentence to camera. No moral is stated; the argument is the villain's, and we only let him finish it.", "intro_html": "<p>The fat cat is the only one who reasons, and he does it out loud, flat and unembarrassed, like a man reading out a rule of the universe. He states the whole argument (you were useful, you are not now, so forget it) in three short clauses, then ends on the protected \"Forget it.\" In beat B the same syllogism comes back trimmed, because he has said it so often he no longer needs all the steps. The veteran and the nurse never speak: their silence keeps the target on him. The button is the same logic applied to the audience, a single deadpan sentence to camera. No moral is stated; the argument is the villain's, and we only let him finish it.<\/p>"}, {"id": "04", "name": "Comedy first", "title": "Comedy first", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-04-comedy-first.md", "intro": "Bluntness and bad timing deliver the facts. The fat cat answers before he has heard the question, praises and dismisses in the same breath (\"Hero. Forget it.\"), and never changes a word between eras.", "intro_html": "<p>Bluntness and bad timing deliver the facts. The fat cat answers before he has heard the question, praises and dismisses in the same breath (\"Hero. Forget it.\"), and never changes a word between eras.<\/p>"}, {"id": "05", "name": "Other side wins", "title": "The other side wins", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-05-other-side-wins.md", "intro": "The fat cat never moves; the veteran and the nurse do. Each one opens with a modest ask, hears \"Forget it.\", and concedes something, bargaining themselves down against a man who has already won. He sets the terms in both eras with the same two words, so the echo is the joke, and the concessions get smaller and more absurd. The button is the extreme end: the next person sits down and concedes before anyone speaks.", "intro_html": "<p>The fat cat never moves; the veteran and the nurse do. Each one opens with a modest ask, hears \"Forget it.\", and concedes something, bargaining themselves down against a man who has already won. He sets the terms in both eras with the same two words, so the echo is the joke, and the concessions get smaller and more absurd. The button is the extreme end: the next person sits down and concedes before anyone speaks.<\/p>"}, {"id": "06", "name": "Reversal", "title": "Reversal, the listener gets there first", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-06-reversal.md", "intro": "The point is never spoken by the fat cat. Each time he opens his mouth, the person he is about to dismiss already knows the sentence. In 1919 the veteran is cut off mid-ask; in the present the nurse says the line before he can, and the fat cat is merely pleased at how well-trained she is. The audience works out the echo a half-beat before the speaker does, and the button is the same reversal turned on him: he is the only one who never learns anything.", "intro_html": "<p>The point is never spoken by the fat cat. Each time he opens his mouth, the person he is about to dismiss already knows the sentence. In 1919 the veteran is cut off mid-ask; in the present the nurse says the line before he can, and the fat cat is merely pleased at how well-trained she is. The audience works out the echo a half-beat before the speaker does, and the button is the same reversal turned on him: he is the only one who never learns anything.<\/p>"}, {"id": "07", "name": "The chorus", "title": "The chorus, two pigeons on the bench back", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-07-chorus.md", "intro": "Two pigeons perch on the back of the bench in both eras (they never change either, so the whole park is stuck). The soldier and the nurse say almost nothing; the pigeons are the Greek chorus who clock the echo out loud, so the lead never has to preach. The fat cat only ever says \"Forget it.\" The pigeons name the repeat, one beat late, flatly, as if they have seen this rota before.", "intro_html": "<p>Two pigeons perch on the back of the bench in both eras (they never change either, so the whole park is stuck). The soldier and the nurse say almost nothing; the pigeons are the Greek chorus who clock the echo out loud, so the lead never has to preach. The fat cat only ever says \"Forget it.\" The pigeons name the repeat, one beat late, flatly, as if they have seen this rota before.<\/p>"}, {"id": "08", "name": "Place is argument", "title": "The place is the argument (the memorial plaque on the bench)", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-08-place-is-argument.md", "intro": "Every word of dialogue is cut to the protected \"Forget it.\" and the argument moves onto one object: a brass plaque screwed to the bench's backrest, \"LEST WE FORGET. Presented by the Whaleby Trust.\" He tells a man who served to forget, sitting on a bench that begs the park to remember. The plaque is held in close-up in every beat, so the echo needs no words, and the button is the plaque getting one line longer.", "intro_html": "<p>Every word of dialogue is cut to the protected \"Forget it.\" and the argument moves onto one object: a brass plaque screwed to the bench's backrest, \"LEST WE FORGET. Presented by the Whaleby Trust.\" He tells a man who served to forget, sitting on a bench that begs the park to remember. The plaque is held in close-up in every beat, so the echo needs no words, and the button is the plaque getting one line longer.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft (match cut, Groundhog Day repetition, the look to camera)", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-09-borrowed-craft.md", "intro": "I stole structure, not jokes. Four borrowed tools: (1) the match cut across time, as in the bone-to-satellite cut in 2001: A Space Odyssey, where identical framing does the explaining so no words are needed; (2) loop repetition, as in Groundhog Day, where the same day returning IS the argument; (3) the silent-era intertitle (Chaplin-style economy): a two-word caption carries the whole time jump, so no spoken line has to; (4) the look to camera from The Office (UK), where a held glance says what a line would ruin. Up's opening montage is the proof that a few seconds of wordless repetition can carry a whole life. So: the dialogue is almost nothing, the second scene is the first scene re-played with one word changed, and the button is silent. Pushed to the extreme: the only spoken words in the whole short are the protected two.", "intro_html": "<p>I stole structure, not jokes. Four borrowed tools: (1) the match cut across time, as in the bone-to-satellite cut in 2001: A Space Odyssey, where identical framing does the explaining so no words are needed; (2) loop repetition, as in Groundhog Day, where the same day returning IS the argument; (3) the silent-era intertitle (Chaplin-style economy): a two-word caption carries the whole time jump, so no spoken line has to; (4) the look to camera from The Office (UK), where a held glance says what a line would ruin. Up's opening montage is the proof that a few seconds of wordless repetition can carry a whole life. So: the dialogue is almost nothing, the second scene is the first scene re-played with one word changed, and the button is silent. Pushed to the extreme: the only spoken words in the whole short are the protected two.<\/p>"}, {"id": "10", "name": "Ending first", "title": "Ending first, written backwards", "file": "design/2026-11-12-short-same-bench-dialogue-lines/shape-10-ending-first.md", "intro": "I wrote the last ten seconds first (the second scene's setup and the button) and asked what the button needs the audience to already know. It needs one rule: he says \"Forget it\" before the other person finishes asking. Once that is the rule, the button is the rule firing with nobody in the chair yet, and A and B are built only to teach it. Taken to the extreme: the victims get a half-sentence each and the fat cat gets the whole joke.", "intro_html": "<p>I wrote the last ten seconds first (the second scene's setup and the button) and asked what the button needs the audience to already know. It needs one rule: he says \"Forget it\" before the other person finishes asking. Once that is the rule, the button is the rule firing with nobody in the chair yet, and A and B are built only to teach it. Taken to the extreme: the victims get a half-sentence each and the fat cat gets the whole joke.<\/p>"}], "dialogues": [{"id": "1", "label": "Same Bench: the whole short", "where": "Beats A (1919, veteran), B (today, nurse), C (the button)", "scene": "same-bench", "target": "14 s or less in total, about 5 + 5 + 4 s", "now_from": "the slate (docs/marketing/badcode-shorts.md #2), a placeholder", "now": [{"who": "FAT CAT (1919, to the veteran)", "line": "Forget it."}, {"who": "FAT CAT (today, to the nurse)", "line": "Forget it."}, {"who": "BUTTON", "line": "(he hasn't aged a day; how it lands is open)"}], "drafts": [{"id": "1A", "name": "Hero. Forget it.", "bet": "The joke is thanks and bin in one breath: he praises and dismisses in the same line, and the echo plus a pre-emptive third dismissal says same man.", "lines": [{"who": "CAPTION", "line": "1919.", "tags": ["01", "09"], "s": "0.6"}, {"who": "VETERAN", "line": "[hat in hand] Sir, about my pension...", "tags": ["04", "10"], "s": "1.6"}, {"who": "FAT CAT", "line": "[not looking up] Hero. Forget it.", "tags": ["04", "Kai"], "s": "1.4"}, {"who": "(hold)", "line": "[veteran's crutch slides; he stands and goes]", "tags": ["01"], "s": "1.8"}, {"who": "CAPTION", "line": "Today.", "tags": ["01", "09"], "s": "0.6"}, {"who": "NURSE", "line": "[tired, lanyard in hand] Sir, about my pay...", "tags": ["04", "10"], "s": "1.6"}, {"who": "FAT CAT", "line": "[same pose, same paper] Hero. Forget it.", "tags": ["04", "Kai"], "s": "1.4"}, {"who": "(hold)", "line": "[she looks at her pay slip and goes]", "tags": ["01"], "s": "1.6"}, {"who": "FAT CAT", "line": "[a third shadow falls across his paper; he does not look up] Forget it.", "tags": ["10", "01", "Kai"], "s": "1.2"}, {"who": "CAPTION", "line": "Same bench.", "tags": ["01", "04", "09", "10"], "s": "2.0"}], "notes": ["Trim: drop the Today. caption if the nurse's scrubs read at once; drop 'Same bench.' if the third Forget it lands as the button.", "Protected 'Forget it.' kept verbatim three times; 'Hero.' is a tag Jack can cut without loss.", "Risk: the pension and pay asks must be dry, not pleading. 'Pay' stays generic: no dates, no governments. Muted autoplay is covered by the captions."], "total": "~14 s", "length": "about 14 s"}, {"id": "1B", "name": "The plaque and the tip", "bet": "The picture and one object do the arguing: a plaque begging the park to remember under a man telling people to forget, so only two spoken words are needed.", "lines": [{"who": "CAPTION", "line": "1919.", "tags": ["01", "09"], "s": "0.5"}, {"who": "FAT CAT", "line": "[pats the brass plaque on the bench back: LEST WE FORGET. PRESENTED BY THE WHALEBY TRUST] Forget it.", "tags": ["08", "02", "Kai"], "s": "1.4"}, {"who": "(hold)", "line": "[veteran with pinned trouser leg stands and goes; a WELCOME HOME bunting scrap on the ground]", "tags": ["02"], "s": "2.6"}, {"who": "CAPTION", "line": "Now.", "tags": ["09", "01"], "s": "0.5"}, {"who": "FAT CAT", "line": "[same pat, same paper, same flick of the hand] Forget it.", "tags": ["08", "02", "Kai"], "s": "1.4"}, {"who": "(hold)", "line": "[nurse goes; a second plate under the first: THANK YOU HEROES]", "tags": ["08", "02"], "s": "2.6"}, {"who": "BUTTON (silent, sound)", "line": "[he lowers the paper and tips his hat to camera; one page-turn, one dry brass tink]", "tags": ["09", "08"], "s": "2.6"}, {"who": "CAPTION", "line": "Same bench.", "tags": ["01", "02", "09"], "s": "2.0"}], "notes": ["Trim: lose the THANK YOU HEROES plate if the frame is too small to read at 9:16; hold each plaque 1.5 s minimum.", "Protected 'Forget it.' kept twice, only stage directions added. Whaleby Trust is invented; check it names no real body.", "Risk: lives or dies on the drawing matching frame for frame; thin if Jack wants a spoken button. Alt button: he says 'Next.' to a sketch outline at the park gate."], "total": "~14 s", "length": "about 14 s"}, {"id": "1C", "name": "Quick learner", "bet": "The nurse knows his line before he says it, so the audience gets there first and his delight at it is the whole indictment.", "lines": [{"who": "VETERAN", "line": "[hopeful] They said I'd be seen right, sir...", "tags": ["06", "09"], "s": "2.0"}, {"who": "FAT CAT", "line": "[not looking up from his paper] Forget it.", "tags": ["06", "all", "Kai"], "s": "1.1"}, {"who": "(hold)", "line": "[veteran goes]", "tags": ["06"], "s": "1.4"}, {"who": "CAPTION", "line": "Today.", "tags": ["01", "09"], "s": "0.6"}, {"who": "NURSE", "line": "[sits, flinches, mouths it flat, quoting him] Forget it.", "tags": ["06"], "s": "1.2"}, {"who": "FAT CAT", "line": "[delighted, same paper] Forget it. Quick learner.", "tags": ["06", "Kai"], "s": "1.8"}, {"who": "(hold)", "line": "[she gets up and goes; his face unchanged]", "tags": ["06", "02"], "s": "1.8"}, {"who": "FAT CAT", "line": "[a shadow falls; he lowers the paper an inch] Forget it.", "tags": ["10", "Kai"], "s": "1.2"}, {"who": "CAPTION", "line": "NEXT.", "tags": ["10", "01"], "s": "2.0"}], "notes": ["Trim: 'Quick learner.' can go, leaving the pre-emption alone; shorten the veteran to 'They said I'd be seen right, sir.'", "Protected 'Forget it.' kept verbatim; also spoken by the nurse as a quote.", "Risk: the nurse saying it can read as her forgetting, so the flinch must show she is quoting him. Cut-off asks are hard for TTS; the nurse line may need sound design."], "total": "~13 s", "length": "about 13 s"}], "ranking": [{"rank": 1, "shape": "04", "length": "~13 s", "verdict": "Best fit: 'Hero. Forget it.' carries thanked-then-forgotten in four syllables and keeps him the target. Fails on density (three captions) and 'Same man. Same bill.' edges toward a stated moral."}, {"rank": 2, "shape": "10", "length": "~14 s", "verdict": "Tightest mechanism: he interrupts, then fires on a shadow, so the button is the rule itself. Fails on 'NEXT.' possibly reading as a queue joke, and cut-off lines are hard to voice."}, {"rank": 3, "shape": "08", "length": "~11 s", "verdict": "The cleverest single idea (plaque plus his name) and fully unstated. Fails on legibility at 9:16 and on being funny aloud; has no resistance from the victims."}, {"rank": 4, "shape": "06", "length": "~11-14 s", "verdict": "Genuine reversal and a dark 'Quick learner'. Fails because the nurse saying 'Forget it' can blame the carer, and the extra line risks sermon."}, {"rank": 5, "shape": "02", "length": "~14 s", "verdict": "Right instinct (the picture says it) and short. Fails on thin voices and on muted-feed readability; the button options are a menu, not a decision."}, {"rank": 6, "shape": "01", "length": "14 s", "verdict": "On target and unstated, but three flat reads feel lazy and 'thanked' relies wholly on art. No resistance, no character voices."}, {"rank": 7, "shape": "05", "length": "~12.5 s", "verdict": "Only shape with real pushback and a dark 'Keep the leg, then'. Fails: victims bargaining themselves down puts the weight on them, not on him, and 'A clap?' is too knowing."}, {"rank": 8, "shape": "09", "length": "~10 s", "verdict": "Good craft (match cut, hat tip) but the sincere 'They said...' pleas are copied one-for-one and the hat tip is ambiguous."}, {"rank": 9, "shape": "07", "length": "~12.5 s", "verdict": "Pigeons say 'Same bloke. Same bench.', so the chorus states the point and twee voices soften the dark. Costs two extra voices."}, {"rank": 10, "shape": "03", "length": "~8 s spoken", "verdict": "Fails the brief: 'You were useful. Now you're not.' is a lecture, and 'Works every time.' is the moral spoken aloud."}], "protected": {"columns": ["Forget it."], "rows": {"1A": ["Forget it. (x3, 'Hero.' added in A and B)"], "1B": ["Forget it. (x2)"], "1C": ["Forget it. (x4, 'Quick learner.' added once)"]}}, "shapes": {"01": "## Dialogue 1: Same Bench: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| CAPTION (top, ink-on-newsprint) | 1919. | 0.8 |\n| FAT CAT (1919, to the veteran) | [not looking up from his paper] Forget it. | 1.2 |\n| (beat A hold: veteran's crutch slides, he stands, goes) | silent | 3.0 |\n| CAPTION | Today. | 0.8 |\n| FAT CAT (today, to the nurse) | [not looking up from his phone-sized paper, identical pose] Forget it. | 1.2 |\n| (beat B hold: she looks at her pay slip, goes) | silent | 3.0 |\n| FAT CAT (button, to a third silhouette just arriving at the bench, before it speaks) | [eyes still on paper] Forget it. | 1.0 |\n| CAPTION (last frame, held) | Same bench. | 3.0 |\n| **Total** | | **14.0** |\n\n**Why it works.** Two words, three times, with the pose, the paper and the delivery identical: the audience writes the echo themselves before the nurse appears. He is the only one who speaks, so he is the only one with agency and the only target; the soldier and nurse never get a line to be blamed for. \"Thanked then forgotten\" is carried by the two year captions and the pay slip, not by speech. The button is the third \"Forget it.\" delivered pre-emptively: he does not need to hear the request, which is the whole man, and it is the same man because it is the same sentence. The caption \"Same bench.\" lands the unaged-cat gag without anyone saying it.\n\n**Cuts from current.** No spoken thanks, no \"after all you've done\", no narrator, no mention of war, applause or pay. Beat C gains a third \"Forget it.\" where the current slate had an open button. The \"hasn't aged a day\" idea is carried by the identical drawing, not by words.\n\n**Risk.** Three identical lines can read as lazy if the performance is not varied by a hair: flat, then flatter, then bored. Without any thanks line, \"thanked then forgotten\" depends on the art (a medal, a clapping-hands poster scrap on the bench in B). The pre-emptive third use may confuse if the third silhouette is not clearly \"next person\". Fallback button: silent, he turns the page of his paper, and the page is dated 1919 on one side and today on the other. Alt caption: \"Next.\"\n\n**Protected lines.** \"Forget it.\" survives verbatim, all three times.", "02": "## Dialogue 1: Same Bench: the whole short\n\n\nShots relied on: **A1** wide locked frame of the 1919 bench, fat cat centre-left, veteran with crutch and one trouser leg pinned up, a faded \"WELCOME HOME\" bunting scrap at his feet; **B1** the identical frame today, same bench, same cat, same pose, nurse with a lanyard and a dropped clapping-hands poster in the gutter; **C1** hold on the cat's face in both eras, split as a diptych, identical.\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| FAT CAT (1919, to the veteran) | [not looking up from his paper, flicks a hand] Forget it. | 1.2 |\n| (A to B, picture only) | [bunting scrap on the ground; match cut, only the bench's paint and the passer-by's clothes change] | 0 |\n| FAT CAT (today, to the nurse) | [not looking up from his phone, same flick of the hand] Forget it. | 1.2 |\n| BUTTON (silent action, no words) | [C1: the two Forget-its play as a diptych, same hand flick in both; his top hat is the only thing that holds the same height in both panels; he lifts his paper to sneeze and it is the 1919 newspaper in his hand again] | 0 |\n| CAPTION (optional, over the diptych) | Same bench. | 1.0 |\n| Total | | 3.4 spoken, 14 s picture |\n\nButton alternatives (pick one; all use the C1 diptych):\n1. **Silent:** the cat checks a pocket watch, a 1919 one, then a smartwatch on the other wrist. Same face, both wrists. No words, no caption.\n2. **Sound:** a single park-bench creak and a distant, thin clap that stops after one. Nothing said.\n3. **CAPTION only:** \"Same bench.\" (shown on the right panel only, the left panel stays blank).\n4. **Spoken, one word:** FAT CAT: [to camera, bored] Next. (swaps the nurse out for the next person approaching, a figure in the park gates, unfinished, a sketch outline.)\n5. **Spoken, two words:** NARRATOR (dry): Same man. (over the diptych, flat).\n\n**Why it works.** The audience sees a veteran with a pinned trouser leg and a nurse with a lanyard and instantly knows who carries the cost; no line has to say so. Repeating \"Forget it.\" in the identical flick, framed identically, makes the echo the entire joke, and because the cat is the only one who speaks, he is the decision-maker and the target. The soldier and nurse are silent, which makes them dignified rather than pitiable. The button is a shot, not a sentence: the unaged face next to itself reads as \"same man, every time\" without a moral being stated.\n\n**Cuts from current.** No spoken button. No dialogue for the veteran or nurse. No explicit era cards (the bunting and the clothes date it). No \"thanked then forgotten\" line: the bunting scrap (A1) and the dropped clapping poster (B1) carry it. The 1919 caption's wording is nowhere.\n\n**Risk.** It lives or dies on the drawing: if the two frames do not match at a glance, or the poster and bunting are too small to read at 9:16, the \"thanked\" half is lost and it is only a rude man twice. TTS \"Forget it.\" must be dry, not angry; two identical reads can feel robotic unless the second is a hair more bored. A silent button can fall flat on autoplay-muted feeds, so the caption \"Same bench.\" is the safety net. Gatekeeper check: the cat must not read as a stock caricature of a real person.\n\n**Protected lines.** \"Forget it.\" survives verbatim, twice, as the only spoken words.", "03": "## Dialogue 1: Same Bench: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| FAT CAT (1919, to the veteran) | You were useful. Now you're not. Forget it. | 3.0 |\n| FAT CAT (today, to the nurse) | [same pose, bored, a glance at his watch] Useful then. Not now. Forget it. | 2.6 |\n| FAT CAT (button, to camera, unaged, sipping) | CAPTION over the bench: \"1919 / TODAY\". [beat] Works every time. | 2.0 |\n| **Total** | spoken, in a 14 s picture (5 + 5 + 4) | **7.6** |\n\nButton options for Jack, same logic, each under 4 s:\n- Spoken: \"Works every time.\" (above)\n- Spoken: \"Gratitude. Never lasts. Cheaper that way.\"\n- Silent action: he does not speak; he pats the empty bench space beside him, the next person already sitting down. Sound: a single polite clap that stops dead.\n- CAPTION only: \"He hasn't aged. The logic hasn't either.\"\n\n**Why it works.** The first line is a complete three-step proof, so the audience learns the rule in beat A. In beat B the proof arrives shortened with the same rhythm (useful, not, forget it), so the echo registers instantly and the shortening is the joke: he has done this so many times the argument has worn smooth. The reasoning is entirely his, so he is the decision-maker and the target, and the soldier and nurse are only ever the ones being reasoned at. \"Thanked then forgotten\" is carried by \"useful\" (they were wanted, which the picture shows with a medal and a faded clap) and by the dead-calm cruelty of \"Now you're not\". The button turns the logic on its own pattern: a rule that works every time is a system, not a mood.\n\n**Cuts from current.** The bare \"Forget it.\" in both beats is padded with the two reasoning clauses; nothing is removed, only added to, and the button gets a spoken line instead of an undefined gap. All stage business (no ageing) stays visual.\n\n**Risk.** Plain logic can sound like a lecture if it runs long: three clauses is the ceiling. \"Useful\" is blunt and could read as contempt for the veteran and nurse if the drawing makes them pitiful; they must look dignified and the cat must look absurd. \"Works every time\" borders on a stated moral and may be too on the nose; the silent bench-pat button is safer. The shortened echo in B depends on the voice delivering the same rhythm in a faster, bored read.\n\n**Protected lines.** \"Forget it.\" survives verbatim, as the closing words of both beats, spoken twice.", "04": "## Dialogue 1: Same Bench: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| CAPTION | 1919. A GRATEFUL NATION. | 1.0 |\n| VETERAN | [medals on, one trouser leg pinned up] Sir, about my pension... | 1.8 |\n| FAT CAT | [not looking up] Hero. Forget it. | 1.5 |\n| CAPTION | TODAY. A GRATEFUL NATION. | 1.0 |\n| NURSE | [scrubs, a clap-shaped badge fading on her lapel] Sir, about my pay... | 1.8 |\n| FAT CAT | [not looking up, same pose] Hero. Forget it. | 1.5 |\n| BUTTON, silent action | A young graduate sits down; he says \"Forget it\" before she opens her mouth. | 2.0 |\n| FAT CAT | Forget it. | 0.8 |\n| CAPTION | Same bench. Same man. Same bill. | 1.6 |\n| Total | | 13.0 |\n\n**Risk.**  asks may read as sympathy-fishing; keep \"pay\" generic; three captions is dense (drop 1919/TODAY if busy). Protected: \"Forget it.\" kept in all three beats; \"Hero.\" added.", "05": "## Dialogue 1: Same Bench: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| VETERAN (1919) | A pension. For the leg. | 1.5 |\n| FAT CAT | Forget it. | 1 |\n| VETERAN (1919) | [lowering the crutch] Keep the leg, then. | 2 |\n| NURSE (today) | A pay rise. Just the one. | 1.5 |\n| FAT CAT | Forget it. | 1 |\n| NURSE (today) | [softly] ...A clap? | 1.5 |\n| NEXT PERSON (silhouette, sits before speaking, hat in hands) | [silent] | 1 |\n| FAT CAT [not looking up, unaged] | Forget it. | 1 |\n| CAPTION | SAME BENCH. SAME MAN. | 2 |\n| **Total** | | **12.5** |\n\n- **Why it works.** The ask shrinks each time, so we see the people who carried the cost bargaining against themselves while the fat cat gives up nothing. \"Keep the leg, then\" is the dark punchline of beat A, and \"A clap?\" calls back to the thanks that was the only thing they were ever given, so beat B lands as the same joke with the same loser. The button is a silent action: a third figure sits down and concedes by posture, and the fat cat says \"Forget it.\" before a word is spoken. That is the same-man-every-time point with no moral stated, and the contempt lands on the decision-maker and never on the soldier or nurse. Alternate buttons: (a) he says \"Forget it.\" to the camera, as if it were us; (b) a caption only, \"Thanked. Then forgotten. Same man.\"; (c) his top hat swaps for a modern cap, the face stays identical, with no line.\n- **Cuts from current.** The bare repeated \"Forget it.\" as the only content is gone, since the victims now speak and bargain. The open-ended button becomes a specific silent action plus a caption.\n- **Risk.** \"Forget it.\" is spoken three times and may feel like padding if the TTS reads it identically; it needs the same flat, bored read each time for the echo to work. \"Keep the leg, then.\" could read as the soldier being too sardonic for a victim; the line may need to be played as defeat, not wit. The silent third figure needs a clear visual (hat in hands) or the button is lost. 12.5 s leaves 1.5 s for a pause before the caption.\n- **Protected lines.** \"Forget it.\" survives verbatim, spoken three times by the fat cat (twice as the reply, once as the button), and never altered.", "06": "## Dialogue 1: Same Bench: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| VETERAN (1919) | [hopeful, hat in hand] \"They said the country would see me right, sir, I only...\" | 2.5 |\n| FAT CAT (1919) | [not looking up from his paper] \"Forget it.\" | 1.2 |\n| NURSE (today) | [sits, tired, before he speaks; mouths it flat] \"Forget it.\" | 1.2 |\n| FAT CAT (today) | [delighted, same paper, same top hat] \"Forget it. Quick learner.\" | 2.2 |\n| CAPTION (button, silent action) | [he checks his pocket watch, it is a 1919 watch; he has not aged; the nurse and the ghost of the veteran's empty seat share a look] CAPTION: \"Same bench.\" | 4.0 |\n| Total | | 11.1 (+ ~2.9 s of held pictures and the bench-swap transition = 14 s) |\n\n- **Why it works.** The echo does not need explaining because the nurse performs it: she says his line for him, so the audience realises \"this has happened before\" at the same moment she does, and the cut to 1919 in beat A has already planted the phrase. \"Quick learner\" is the dark joke: he treats her weary pre-emption as good manners, which makes him the whole problem without a word of moral. The button is silent: the watch, the unaged face, the empty half of the bench, then a two-word caption. Nobody tells you he is the same man; the picture does.\n- **Cuts from current.** The bare \"Forget it\" x2 grows a setup (the veteran's unfinished ask) and a reversal (the nurse says it first). The vague button becomes a silent action plus a two-word caption. Nothing from the slate is lost except that his first \"Forget it\" no longer carries beat B alone.\n- **Risk.** The nurse saying \"Forget it\" can read as her being the one who forgets, which would blame the carer. Mitigate with the tired mouthed delivery and a visible flinch (she is quoting, not agreeing). \"Quick learner\" may be one line too many: if Jack wants it leaner, cut to \"Forget it. [he smiles]\" and keep the pre-emption alone. Veteran's line in A is the longest and may need trimming to \"They said I'd be seen right, sir...\"\n- **Protected lines.** \"Forget it.\" survives verbatim, three times (fat cat 1919, nurse today as the echo, fat cat today). The only alteration is the added tag \"Quick learner.\" on the last one, which can be dropped without loss.\n\nAlternative buttons for Jack, in the same shape:\n1. Silent: the nurse and the veteran, a century apart, both stand and leave the bench in the same pose; the fat cat does not look up. Hold on the one remaining person: him.\n2. Sound: a distant brass band, then a distant round of clapping, both fading to nothing. He turns the page.\n3. CAPTION only: \"He never has to learn it either.\"\n4. Fat cat, to camera, pleased: \"They always get there in the end.\" (most explicit, most at risk of sermon).", "07": "## Dialogue 1: Same Bench: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| VETERAN (1919) | [one leg, hat in hand] \"Sir, I gave a leg.\" | 1.6 |\n| FAT CAT | [not looking up from his paper] \"Forget it.\" | 1.0 |\n| PIGEON 1 | [cooing, dry] \"Quick, that.\" | 1.0 |\n| NURSE (today) | [scrubs, tired, same posture] \"Sir, they froze my pay.\" | 1.8 |\n| FAT CAT | [identical, not looking up] \"Forget it.\" | 1.0 |\n| PIGEON 2 | \"Heard that one.\" | 1.0 |\n| PIGEON 1 | \"Same bloke.\" | 0.9 |\n| PIGEON 2 | [beat] \"Same bench.\" CAPTION: SAME BENCH. SAME MAN. | 1.2 |\n| BUTTON (silent action) | The fat cat turns the page; a third person (a delivery rider) sits down at the far end; he lowers the paper an inch. No words. | 3.0 |\n| **Total** | | **12.5** |\n\n- **Why it works.** The echo is the joke, and the pigeons make it impossible to miss without anyone human lecturing: \"Quick, that\" teaches the audience to hear \"Forget it\" as a ritual, so in beat B the same two words land with a second laugh, and \"Heard that one\" is the audience's own thought said by a bird. The fat cat stays the sole decision-maker and target; the soldier and nurse are only ever sympathetic and brief. The thanks-then-forgotten idea is carried by the nurse's frozen pay (she was thanked, the clapping is implied by her scrubs and the cut) and by the soldier's leg. The button is two pigeon lines and a silent third victim, with no stated moral.\n- **Cuts from current.** Nothing in the fat cat's lines. Cut: any narrator, any \"thanks\" speech from him, any explanation of the clapping or the war (the picture does it). The slate's open button gets the pigeons plus a silent action.\n- **Risk.** Pigeons could read as cute or twee and soften the dark; the chorus can steal the fat cat's authority if it chatters; \"Same bloke\" and \"Same bench\" both say the point, so Jack may keep only one. Two extra voices cost TTS casting time and AI pigeon voices may sound silly in a way that is wanted or not. Silent third victim risks a fourth beat going long. Dropping to one pigeon works if the budget slips.\n- **Protected lines.** \"Forget it.\" survives verbatim, twice, spoken by the fat cat only, never by a pigeon.", "08": "## Dialogue 1: Same Bench: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| CAPTION (A, over establishing shot, 1919 ink) | 1919. [push in to the plaque: LEST WE FORGET. PRESENTED BY THE WHALEBY TRUST] | 2.0 |\n| FAT CAT (to the veteran, not looking up from his paper) | [pats the plaque like a pet] Forget it. | 1.5 |\n| CAPTION (B, same frame, nurse in the veteran's place) | Now. [plaque identical, a second, smaller plate screwed under it: THANK YOU HEROES] | 2.0 |\n| FAT CAT (to the nurse, same pat, same paper) | [pats the plaque] Forget it. | 1.5 |\n| BUTTON (silent action + sound) | [Hold on the plaque. A small screwdriver-less hand-lettered third plate appears in ink under the others: PRESENTED BY THE WHALEBY TRUST. Sound: one dry brass \"tink\", then nothing.] | 3.5 |\n| **Total** | | **10.5** (leaves ~3.5 s of air for held beats; max 14) |\n\n- **Why it works.** The joke is the geometry: the plaque is a permanent instruction to remember, the man sitting under it is a permanent instruction to forget, and the plaque carries his own name, so he is the decision-maker AND the donor, thanked for the gift of the very bench the thanks is screwed to. \"Forget it.\" reads as an echo instantly because the frame, the pat and the plaque do not change, only the person beside him does. The \"THANK YOU HEROES\" plate is the thanked-then-forgotten beat in two words with no clapping needed. The button needs no moral: the name on the plaque is the same name both times, and the camera lets you read it. He never ages, because the brass never tarnishes.\n- **Button alternates.** (1) Silent action, as above. (2) CAPTION over the held plaque: \"Bench maintained by the Whaleby Trust. Since 1919.\" (3) FAT CAT, under his breath, to the camera, after the nurse leaves: \"Lest we forget what I paid for this.\" (4) Sound only: a pigeon lands on the plaque, he flaps it off with the paper, same flap as 1919 (a repeated gesture, no words). (5) CAPTION: \"Next to him: you.\" then the bench has a third seat free (an invite, risks preaching, listed for edges).\n- **Cuts from current.** Nothing spoken is lost; \"Forget it.\" is kept twice. Cut: any speech from the veteran or nurse, any explanation of the war or the pay freeze, and the vague \"he hasn't aged\" button, which becomes the plaque doing the work.\n- **Risk.** A plaque is small, and at 9:16 on a phone the text must be readable: it needs a hard close-up and a bold serif, held at least 1.5 s each time. Reading the plaque costs eyes, not ears, so TTS has little to do and Jack may feel it is not funny enough aloud. \"Whaleby Trust\" must stay invented (check it names no real foundation). The nurse beat risks reading as pay-freeze politics if the second plate is too topical, so keep THANK YOU HEROES generic and undated. The button may read as an in-joke about benches, not about him, unless his face is also visible in the last frame.\n- **Protected lines.** \"Forget it.\" survives verbatim, twice, with only a stage direction (the pat on the plaque) added in square brackets.", "09": "## Dialogue 1: Same Bench: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| CAPTION (intertitle, A) | 1919. | 0.5 |\n| VETERAN | [holding out his cap, quiet] They said I'd be looked after, sir. | 2.0 |\n| FAT CAT | [not looking up from his paper] Forget it. | 1.0 |\n| (hard match cut: same bench, same framing, same pose, ink colours shift) CAPTION (intertitle, B) | Now. | 0.5 |\n| NURSE | [holding out her lanyard, quiet] They said they'd look after us, sir. | 2.0 |\n| FAT CAT | [not looking up from his phone, which is a newspaper] Forget it. | 1.0 |\n| BUTTON (silent action) | [Cut to wide on the bench. Both beats' sitters have gone. Fat cat alone, unaged, turns to camera and raises his top hat to the viewer. Two beats of silence. Then a single page-turn sound.] | 3.0 |\n| **Total** | | **10.0** |\n\n**Why it works.** The match cut makes the echo land before a word is said: same bench, same angle, same hat, so the viewer does the \"oh, it's him again\" arithmetic themselves, which is far stickier than being told. The speakers' lines are a deliberate copy with one word swapped (looked after / look after us), the Groundhog Day trick: repetition with a tiny change reads as a pattern, and a pattern reads as a system. The fat cat gets the only protected line, twice, with no variation, so he is the constant and the soldier and nurse are the variables: he is the decision-maker and the target. \"They said\" supplies the thanked-then-forgotten beat with no stated moral, because somebody promised and somebody else shrugged. The button borrows the look to camera: a silent tip of the hat to the audience says \"same man, every time\" and is also the arrogance, in under four seconds. Spare time (4 s under target) can go to a held last frame or letting beat A breathe.\n\nAlternate buttons, same shape, pick one:\n- Silent: the hat-tip above (default).\n- CAPTION over the held wide: \"Next.\" (he is already looking at the empty space beside him, patting it.)\n- CAPTION: \"Same bench. Same man.\" (more explicit, riskier as it states the point.)\n- Sound only: a faint 1919 gramophone crackle that cuts to a phone notification chime on the fat cat's hat-tip, the sound doing the era jump in reverse.\n- Callback caption in 1910s ink lettering: \"Forget it. (Now with reminders.)\" only if Jack wants a joke over a gesture.\n\n**Cuts from current.** Nothing in the protected lines is cut. Added: two one-word captions and one short plea per victim; the button is now a silent action. No pandemic, government, politician or date beyond the generic \"1919\" and \"Now\".\n\n**Risk.** The veteran/nurse plea (\"They said...\") may be too sincere for the sarcastic register and could read as pleading rather than being brushed off; if so, cut it and let the held-out cap and lanyard carry it (this takes the short to 7 s and makes it purer, but loses the thanked-then-forgotten setup, which would then need a caption). A silent hat-tip may be read as ambiguous or as an actual joke about class rather than a button. \"Now.\" may feel too bare against 1919. The match cut depends on the drawn frames being truly identical, so the art pipeline has to hold the fat cat and bench pixel-stable.\n\n**Protected lines.** \"Forget it.\" survives verbatim, spoken twice by the fat cat, identical delivery both times; that exact repetition is the joke.", "10": "## Dialogue 1: Same Bench: the whole short\n\n\n| Speaker | Line | Est. s |\n|---|---|---|\n| VETERAN (1919) | Sir, about the pension, I only [cut off] | 1.5 |\n| FAT CAT (1919) | [not looking up, newspaper raised] Forget it. | 1.0 |\n| CAPTION (card, ink) | TODAY. SAME BENCH. | 1.0 |\n| NURSE (today) | Sir, about the pay, I only [cut off] | 1.5 |\n| FAT CAT (today, identical, unaged) | [not looking up, newspaper raised] Forget it. | 1.0 |\n| FAT CAT (beat C, a third shadow falls across his paper, nobody speaks) | [lowers paper an inch, before a word is said] Forget it. | 1.5 |\n| CAPTION (button, silent hold, pen-ink stamp) | NEXT. | 1.5 |\n| **Total** | | **~9.0 spoken/caption + ~5 s of holds and pen-drawn action = about 14 s** |\n\nAlternative buttons to swap into beat C (director's pick):\n- C2 (sound): the fat cat says nothing; the bench-slat creak and a pocket-watch tick, then a third shadow falls and his paper rises. Silent action, no line.\n- C3 (caption only): CAPTION: \"THANKED. THEN FORGOTTEN. SAME MAN.\" Warning: states the moral, the one thing this shape avoids.\n- C4 (line): FAT CAT, glancing at a watch: \"Is it that time already? Forget it.\" Funnier but breaks the pre-emption rule.\n\n**Why it works.** The joke is the interruption: he never hears the ask, so the 'thanks' they were owed is shown by its absence rather than stated. A and B are identical beats with the nouns swapped (pension, pay), so the echo lands without a word of explanation. The button does the \"same man, every time\" job by proving he no longer needs the other person present: he has said it so often it fires on a shadow. The soldier and nurse are cut off, never mocked; the contempt stays on the man on the bench and the habit, not the technology or the victims. No moral is stated.\n\n**Cuts from current.** Both lines stay; the soldier and nurse get a cut-off half-sentence to make him the interrupter. The open-ended button becomes the pre-emptive \"Forget it\" plus a stamped caption. No gratitude speech: the thanking happens in the picture (a flag, a clap, bunting), not the dialogue.\n\n**Risk.** Three \"Forget it\"s may feel like a one-note triple; if the third lands flat, use C2 (silent). \"Pension\" and \"pay\" are specific enough to read as the policy fights of their eras, and \"NEXT.\" may read as a queue joke rather than the same-man joke; test both. The cut-off lines are hard for TTS to clip cleanly, so these may need to be sound-designed, not voiced. Nothing here shows him unaged except the drawing, so the art must make \"identical\" unmistakable (same hat, same watch-chain, same bench slat chipped).\n\n**Protected lines.** \"Forget it.\" survives verbatim three times, each on the fat cat."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">CAPTION (top, ink-on-newsprint)<\/td><td class=\"line\">1919.<\/td><td class=\"num\">0.8<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (1919, to the veteran)<\/td><td class=\"line\">[not looking up from his paper] Forget it.<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">(beat A hold: veteran's crutch slides, he stands, goes)<\/td><td class=\"line\">silent<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">Today.<\/td><td class=\"num\">0.8<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (today, to the nurse)<\/td><td class=\"line\">[not looking up from his phone-sized paper, identical pose] Forget it.<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">(beat B hold: she looks at her pay slip, goes)<\/td><td class=\"line\">silent<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (button, to a third silhouette just arriving at the bench, before it speaks)<\/td><td class=\"line\">[eyes still on paper] Forget it.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">CAPTION (last frame, held)<\/td><td class=\"line\">Same bench.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>14.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Two words, three times, with the pose, the paper and the delivery identical: the audience writes the echo themselves before the nurse appears. He is the only one who speaks, so he is the only one with agency and the only target; the soldier and nurse never get a line to be blamed for. \"Thanked then forgotten\" is carried by the two year captions and the pay slip, not by speech. The button is the third \"Forget it.\" delivered pre-emptively: he does not need to hear the request, which is the whole man, and it is the same man because it is the same sentence. The caption \"Same bench.\" lands the unaged-cat gag without anyone saying it.<\/p>\n<p><b>Cuts from current.<\/b> No spoken thanks, no \"after all you've done\", no narrator, no mention of war, applause or pay. Beat C gains a third \"Forget it.\" where the current slate had an open button. The \"hasn't aged a day\" idea is carried by the identical drawing, not by words.<\/p>\n<p><b>Risk.<\/b> Three identical lines can read as lazy if the performance is not varied by a hair: flat, then flatter, then bored. Without any thanks line, \"thanked then forgotten\" depends on the art (a medal, a clapping-hands poster scrap on the bench in B). The pre-emptive third use may confuse if the third silhouette is not clearly \"next person\". Fallback button: silent, he turns the page of his paper, and the page is dated 1919 on one side and today on the other. Alt caption: \"Next.\"<\/p>\n<p><b>Protected lines.<\/b> \"Forget it.\" survives verbatim, all three times.<\/p>", "02": "<p>Shots relied on: <b>A1<\/b> wide locked frame of the 1919 bench, fat cat centre-left, veteran with crutch and one trouser leg pinned up, a faded \"WELCOME HOME\" bunting scrap at his feet; <b>B1<\/b> the identical frame today, same bench, same cat, same pose, nurse with a lanyard and a dropped clapping-hands poster in the gutter; <b>C1<\/b> hold on the cat's face in both eras, split as a diptych, identical.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">FAT CAT (1919, to the veteran)<\/td><td class=\"line\">[not looking up from his paper, flicks a hand] Forget it.<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">(A to B, picture only)<\/td><td class=\"line\">[bunting scrap on the ground; match cut, only the bench's paint and the passer-by's clothes change]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (today, to the nurse)<\/td><td class=\"line\">[not looking up from his phone, same flick of the hand] Forget it.<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">BUTTON (silent action, no words)<\/td><td class=\"line\">[C1: the two Forget-its play as a diptych, same hand flick in both; his top hat is the only thing that holds the same height in both panels; he lifts his paper to sneeze and it is the 1919 newspaper in his hand again]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">CAPTION (optional, over the diptych)<\/td><td class=\"line\">Same bench.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">Total<\/td><td class=\"line\"><\/td><td class=\"num\">3.4 spoken, 14 s picture<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Button alternatives (pick one; all use the C1 diptych):<\/p>\n<ol><li><b>Silent:<\/b> the cat checks a pocket watch, a 1919 one, then a smartwatch on the other wrist. Same face, both wrists. No words, no caption.<\/li><li><b>Sound:<\/b> a single park-bench creak and a distant, thin clap that stops after one. Nothing said.<\/li><li><b>CAPTION only:<\/b> \"Same bench.\" (shown on the right panel only, the left panel stays blank).<\/li><li><b>Spoken, one word:<\/b> FAT CAT: [to camera, bored] Next. (swaps the nurse out for the next person approaching, a figure in the park gates, unfinished, a sketch outline.)<\/li><li><b>Spoken, two words:<\/b> NARRATOR (dry): Same man. (over the diptych, flat).<\/li><\/ol>\n<p><b>Why it works.<\/b> The audience sees a veteran with a pinned trouser leg and a nurse with a lanyard and instantly knows who carries the cost; no line has to say so. Repeating \"Forget it.\" in the identical flick, framed identically, makes the echo the entire joke, and because the cat is the only one who speaks, he is the decision-maker and the target. The soldier and nurse are silent, which makes them dignified rather than pitiable. The button is a shot, not a sentence: the unaged face next to itself reads as \"same man, every time\" without a moral being stated.<\/p>\n<p><b>Cuts from current.<\/b> No spoken button. No dialogue for the veteran or nurse. No explicit era cards (the bunting and the clothes date it). No \"thanked then forgotten\" line: the bunting scrap (A1) and the dropped clapping poster (B1) carry it. The 1919 caption's wording is nowhere.<\/p>\n<p><b>Risk.<\/b> It lives or dies on the drawing: if the two frames do not match at a glance, or the poster and bunting are too small to read at 9:16, the \"thanked\" half is lost and it is only a rude man twice. TTS \"Forget it.\" must be dry, not angry; two identical reads can feel robotic unless the second is a hair more bored. A silent button can fall flat on autoplay-muted feeds, so the caption \"Same bench.\" is the safety net. Gatekeeper check: the cat must not read as a stock caricature of a real person.<\/p>\n<p><b>Protected lines.<\/b> \"Forget it.\" survives verbatim, twice, as the only spoken words.<\/p>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">FAT CAT (1919, to the veteran)<\/td><td class=\"line\">You were useful. Now you're not. Forget it.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (today, to the nurse)<\/td><td class=\"line\">[same pose, bored, a glance at his watch] Useful then. Not now. Forget it.<\/td><td class=\"num\">2.6<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (button, to camera, unaged, sipping)<\/td><td class=\"line\">CAPTION over the bench: \"1919 / TODAY\". <span class=\"stage\">[beat]<\/span> Works every time.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">spoken, in a 14 s picture (5 + 5 + 4)<\/td><td class=\"num\"><b>7.6<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Button options for Jack, same logic, each under 4 s:<\/p>\n<ul><li>Spoken: \"Works every time.\" (above)<\/li><li>Spoken: \"Gratitude. Never lasts. Cheaper that way.\"<\/li><li>Silent action: he does not speak; he pats the empty bench space beside him, the next person already sitting down. Sound: a single polite clap that stops dead.<\/li><li>CAPTION only: \"He hasn't aged. The logic hasn't either.\"<\/li><\/ul>\n<p><b>Why it works.<\/b> The first line is a complete three-step proof, so the audience learns the rule in beat A. In beat B the proof arrives shortened with the same rhythm (useful, not, forget it), so the echo registers instantly and the shortening is the joke: he has done this so many times the argument has worn smooth. The reasoning is entirely his, so he is the decision-maker and the target, and the soldier and nurse are only ever the ones being reasoned at. \"Thanked then forgotten\" is carried by \"useful\" (they were wanted, which the picture shows with a medal and a faded clap) and by the dead-calm cruelty of \"Now you're not\". The button turns the logic on its own pattern: a rule that works every time is a system, not a mood.<\/p>\n<p><b>Cuts from current.<\/b> The bare \"Forget it.\" in both beats is padded with the two reasoning clauses; nothing is removed, only added to, and the button gets a spoken line instead of an undefined gap. All stage business (no ageing) stays visual.<\/p>\n<p><b>Risk.<\/b> Plain logic can sound like a lecture if it runs long: three clauses is the ceiling. \"Useful\" is blunt and could read as contempt for the veteran and nurse if the drawing makes them pitiful; they must look dignified and the cat must look absurd. \"Works every time\" borders on a stated moral and may be too on the nose; the silent bench-pat button is safer. The shortened echo in B depends on the voice delivering the same rhythm in a faster, bored read.<\/p>\n<p><b>Protected lines.<\/b> \"Forget it.\" survives verbatim, as the closing words of both beats, spoken twice.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">1919. A GRATEFUL NATION.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">VETERAN<\/td><td class=\"line\">[medals on, one trouser leg pinned up] Sir, about my pension...<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT<\/td><td class=\"line\">[not looking up] Hero. Forget it.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">TODAY. A GRATEFUL NATION.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">NURSE<\/td><td class=\"line\">[scrubs, a clap-shaped badge fading on her lapel] Sir, about my pay...<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT<\/td><td class=\"line\">[not looking up, same pose] Hero. Forget it.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">BUTTON, silent action<\/td><td class=\"line\">A young graduate sits down; he says \"Forget it\" before she opens her mouth.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT<\/td><td class=\"line\">Forget it.<\/td><td class=\"num\">0.8<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">Same bench. Same man. Same bill.<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\">Total<\/td><td class=\"line\"><\/td><td class=\"num\">13.0<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Risk.<\/b>  asks may read as sympathy-fishing; keep \"pay\" generic; three captions is dense (drop 1919/TODAY if busy). Protected: \"Forget it.\" kept in all three beats; \"Hero.\" added.<\/p>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">VETERAN (1919)<\/td><td class=\"line\">A pension. For the leg.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT<\/td><td class=\"line\">Forget it.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">VETERAN (1919)<\/td><td class=\"line\">[lowering the crutch] Keep the leg, then.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">NURSE (today)<\/td><td class=\"line\">A pay rise. Just the one.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT<\/td><td class=\"line\">Forget it.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">NURSE (today)<\/td><td class=\"line\">[softly] ...A clap?<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">NEXT PERSON (silhouette, sits before speaking, hat in hands)<\/td><td class=\"line\">[silent]<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT [not looking up, unaged]<\/td><td class=\"line\">Forget it.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">SAME BENCH. SAME MAN.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>12.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The ask shrinks each time, so we see the people who carried the cost bargaining against themselves while the fat cat gives up nothing. \"Keep the leg, then\" is the dark punchline of beat A, and \"A clap?\" calls back to the thanks that was the only thing they were ever given, so beat B lands as the same joke with the same loser. The button is a silent action: a third figure sits down and concedes by posture, and the fat cat says \"Forget it.\" before a word is spoken. That is the same-man-every-time point with no moral stated, and the contempt lands on the decision-maker and never on the soldier or nurse. Alternate buttons: (a) he says \"Forget it.\" to the camera, as if it were us; (b) a caption only, \"Thanked. Then forgotten. Same man.\"; (c) his top hat swaps for a modern cap, the face stays identical, with no line.<\/li><li><b>Cuts from current.<\/b> The bare repeated \"Forget it.\" as the only content is gone, since the victims now speak and bargain. The open-ended button becomes a specific silent action plus a caption.<\/li><li><b>Risk.<\/b> \"Forget it.\" is spoken three times and may feel like padding if the TTS reads it identically; it needs the same flat, bored read each time for the echo to work. \"Keep the leg, then.\" could read as the soldier being too sardonic for a victim; the line may need to be played as defeat, not wit. The silent third figure needs a clear visual (hat in hands) or the button is lost. 12.5 s leaves 1.5 s for a pause before the caption.<\/li><li><b>Protected lines.<\/b> \"Forget it.\" survives verbatim, spoken three times by the fat cat (twice as the reply, once as the button), and never altered.<\/li><\/ul>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">VETERAN (1919)<\/td><td class=\"line\">[hopeful, hat in hand] \"They said the country would see me right, sir, I only...\"<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (1919)<\/td><td class=\"line\">[not looking up from his paper] \"Forget it.\"<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">NURSE (today)<\/td><td class=\"line\">[sits, tired, before he speaks; mouths it flat] \"Forget it.\"<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (today)<\/td><td class=\"line\">[delighted, same paper, same top hat] \"Forget it. Quick learner.\"<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">CAPTION (button, silent action)<\/td><td class=\"line\">[he checks his pocket watch, it is a 1919 watch; he has not aged; the nurse and the ghost of the veteran's empty seat share a look] CAPTION: \"Same bench.\"<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Total<\/td><td class=\"line\"><\/td><td class=\"num\">11.1 (+ ~2.9 s of held pictures and the bench-swap transition = 14 s)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The echo does not need explaining because the nurse performs it: she says his line for him, so the audience realises \"this has happened before\" at the same moment she does, and the cut to 1919 in beat A has already planted the phrase. \"Quick learner\" is the dark joke: he treats her weary pre-emption as good manners, which makes him the whole problem without a word of moral. The button is silent: the watch, the unaged face, the empty half of the bench, then a two-word caption. Nobody tells you he is the same man; the picture does.<\/li><li><b>Cuts from current.<\/b> The bare \"Forget it\" x2 grows a setup (the veteran's unfinished ask) and a reversal (the nurse says it first). The vague button becomes a silent action plus a two-word caption. Nothing from the slate is lost except that his first \"Forget it\" no longer carries beat B alone.<\/li><li><b>Risk.<\/b> The nurse saying \"Forget it\" can read as her being the one who forgets, which would blame the carer. Mitigate with the tired mouthed delivery and a visible flinch (she is quoting, not agreeing). \"Quick learner\" may be one line too many: if Jack wants it leaner, cut to \"Forget it. [he smiles]\" and keep the pre-emption alone. Veteran's line in A is the longest and may need trimming to \"They said I'd be seen right, sir...\"<\/li><li><b>Protected lines.<\/b> \"Forget it.\" survives verbatim, three times (fat cat 1919, nurse today as the echo, fat cat today). The only alteration is the added tag \"Quick learner.\" on the last one, which can be dropped without loss.<\/li><\/ul>\n<p>Alternative buttons for Jack, in the same shape:<\/p>\n<ol><li>Silent: the nurse and the veteran, a century apart, both stand and leave the bench in the same pose; the fat cat does not look up. Hold on the one remaining person: him.<\/li><li>Sound: a distant brass band, then a distant round of clapping, both fading to nothing. He turns the page.<\/li><li>CAPTION only: \"He never has to learn it either.\"<\/li><li>Fat cat, to camera, pleased: \"They always get there in the end.\" (most explicit, most at risk of sermon).<\/li><\/ol>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">VETERAN (1919)<\/td><td class=\"line\">[one leg, hat in hand] \"Sir, I gave a leg.\"<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT<\/td><td class=\"line\">[not looking up from his paper] \"Forget it.\"<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">PIGEON 1<\/td><td class=\"line\">[cooing, dry] \"Quick, that.\"<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">NURSE (today)<\/td><td class=\"line\">[scrubs, tired, same posture] \"Sir, they froze my pay.\"<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT<\/td><td class=\"line\">[identical, not looking up] \"Forget it.\"<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">PIGEON 2<\/td><td class=\"line\">\"Heard that one.\"<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">PIGEON 1<\/td><td class=\"line\">\"Same bloke.\"<\/td><td class=\"num\">0.9<\/td><\/tr>\n<tr><td class=\"who\">PIGEON 2<\/td><td class=\"line\"><span class=\"stage\">[beat]<\/span> \"Same bench.\" CAPTION: SAME BENCH. SAME MAN.<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">BUTTON (silent action)<\/td><td class=\"line\">The fat cat turns the page; a third person (a delivery rider) sits down at the far end; he lowers the paper an inch. No words.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>12.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The echo is the joke, and the pigeons make it impossible to miss without anyone human lecturing: \"Quick, that\" teaches the audience to hear \"Forget it\" as a ritual, so in beat B the same two words land with a second laugh, and \"Heard that one\" is the audience's own thought said by a bird. The fat cat stays the sole decision-maker and target; the soldier and nurse are only ever sympathetic and brief. The thanks-then-forgotten idea is carried by the nurse's frozen pay (she was thanked, the clapping is implied by her scrubs and the cut) and by the soldier's leg. The button is two pigeon lines and a silent third victim, with no stated moral.<\/li><li><b>Cuts from current.<\/b> Nothing in the fat cat's lines. Cut: any narrator, any \"thanks\" speech from him, any explanation of the clapping or the war (the picture does it). The slate's open button gets the pigeons plus a silent action.<\/li><li><b>Risk.<\/b> Pigeons could read as cute or twee and soften the dark; the chorus can steal the fat cat's authority if it chatters; \"Same bloke\" and \"Same bench\" both say the point, so Jack may keep only one. Two extra voices cost TTS casting time and AI pigeon voices may sound silly in a way that is wanted or not. Silent third victim risks a fourth beat going long. Dropping to one pigeon works if the budget slips.<\/li><li><b>Protected lines.<\/b> \"Forget it.\" survives verbatim, twice, spoken by the fat cat only, never by a pigeon.<\/li><\/ul>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">CAPTION (A, over establishing shot, 1919 ink)<\/td><td class=\"line\">1919. [push in to the plaque: LEST WE FORGET. PRESENTED BY THE WHALEBY TRUST]<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (to the veteran, not looking up from his paper)<\/td><td class=\"line\">[pats the plaque like a pet] Forget it.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION (B, same frame, nurse in the veteran's place)<\/td><td class=\"line\">Now. [plaque identical, a second, smaller plate screwed under it: THANK YOU HEROES]<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (to the nurse, same pat, same paper)<\/td><td class=\"line\">[pats the plaque] Forget it.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">BUTTON (silent action + sound)<\/td><td class=\"line\">[Hold on the plaque. A small screwdriver-less hand-lettered third plate appears in ink under the others: PRESENTED BY THE WHALEBY TRUST. Sound: one dry brass \"tink\", then nothing.]<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>10.5<\/b> (leaves ~3.5 s of air for held beats; max 14)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The joke is the geometry: the plaque is a permanent instruction to remember, the man sitting under it is a permanent instruction to forget, and the plaque carries his own name, so he is the decision-maker AND the donor, thanked for the gift of the very bench the thanks is screwed to. \"Forget it.\" reads as an echo instantly because the frame, the pat and the plaque do not change, only the person beside him does. The \"THANK YOU HEROES\" plate is the thanked-then-forgotten beat in two words with no clapping needed. The button needs no moral: the name on the plaque is the same name both times, and the camera lets you read it. He never ages, because the brass never tarnishes.<\/li><li><b>Button alternates.<\/b> (1) Silent action, as above. (2) CAPTION over the held plaque: \"Bench maintained by the Whaleby Trust. Since 1919.\" (3) FAT CAT, under his breath, to the camera, after the nurse leaves: \"Lest we forget what I paid for this.\" (4) Sound only: a pigeon lands on the plaque, he flaps it off with the paper, same flap as 1919 (a repeated gesture, no words). (5) CAPTION: \"Next to him: you.\" then the bench has a third seat free (an invite, risks preaching, listed for edges).<\/li><li><b>Cuts from current.<\/b> Nothing spoken is lost; \"Forget it.\" is kept twice. Cut: any speech from the veteran or nurse, any explanation of the war or the pay freeze, and the vague \"he hasn't aged\" button, which becomes the plaque doing the work.<\/li><li><b>Risk.<\/b> A plaque is small, and at 9:16 on a phone the text must be readable: it needs a hard close-up and a bold serif, held at least 1.5 s each time. Reading the plaque costs eyes, not ears, so TTS has little to do and Jack may feel it is not funny enough aloud. \"Whaleby Trust\" must stay invented (check it names no real foundation). The nurse beat risks reading as pay-freeze politics if the second plate is too topical, so keep THANK YOU HEROES generic and undated. The button may read as an in-joke about benches, not about him, unless his face is also visible in the last frame.<\/li><li><b>Protected lines.<\/b> \"Forget it.\" survives verbatim, twice, with only a stage direction (the pat on the plaque) added in square brackets.<\/li><\/ul>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">CAPTION (intertitle, A)<\/td><td class=\"line\">1919.<\/td><td class=\"num\">0.5<\/td><\/tr>\n<tr><td class=\"who\">VETERAN<\/td><td class=\"line\">[holding out his cap, quiet] They said I'd be looked after, sir.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT<\/td><td class=\"line\">[not looking up from his paper] Forget it.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">(hard match cut: same bench, same framing, same pose, ink colours shift) CAPTION (intertitle, B)<\/td><td class=\"line\">Now.<\/td><td class=\"num\">0.5<\/td><\/tr>\n<tr><td class=\"who\">NURSE<\/td><td class=\"line\">[holding out her lanyard, quiet] They said they'd look after us, sir.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT<\/td><td class=\"line\">[not looking up from his phone, which is a newspaper] Forget it.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">BUTTON (silent action)<\/td><td class=\"line\">[Cut to wide on the bench. Both beats' sitters have gone. Fat cat alone, unaged, turns to camera and raises his top hat to the viewer. Two beats of silence. Then a single page-turn sound.]<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>10.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The match cut makes the echo land before a word is said: same bench, same angle, same hat, so the viewer does the \"oh, it's him again\" arithmetic themselves, which is far stickier than being told. The speakers' lines are a deliberate copy with one word swapped (looked after / look after us), the Groundhog Day trick: repetition with a tiny change reads as a pattern, and a pattern reads as a system. The fat cat gets the only protected line, twice, with no variation, so he is the constant and the soldier and nurse are the variables: he is the decision-maker and the target. \"They said\" supplies the thanked-then-forgotten beat with no stated moral, because somebody promised and somebody else shrugged. The button borrows the look to camera: a silent tip of the hat to the audience says \"same man, every time\" and is also the arrogance, in under four seconds. Spare time (4 s under target) can go to a held last frame or letting beat A breathe.<\/p>\n<p>Alternate buttons, same shape, pick one:<\/p>\n<ul><li>Silent: the hat-tip above (default).<\/li><li>CAPTION over the held wide: \"Next.\" (he is already looking at the empty space beside him, patting it.)<\/li><li>CAPTION: \"Same bench. Same man.\" (more explicit, riskier as it states the point.)<\/li><li>Sound only: a faint 1919 gramophone crackle that cuts to a phone notification chime on the fat cat's hat-tip, the sound doing the era jump in reverse.<\/li><li>Callback caption in 1910s ink lettering: \"Forget it. (Now with reminders.)\" only if Jack wants a joke over a gesture.<\/li><\/ul>\n<p><b>Cuts from current.<\/b> Nothing in the protected lines is cut. Added: two one-word captions and one short plea per victim; the button is now a silent action. No pandemic, government, politician or date beyond the generic \"1919\" and \"Now\".<\/p>\n<p><b>Risk.<\/b> The veteran/nurse plea (\"They said...\") may be too sincere for the sarcastic register and could read as pleading rather than being brushed off; if so, cut it and let the held-out cap and lanyard carry it (this takes the short to 7 s and makes it purer, but loses the thanked-then-forgotten setup, which would then need a caption). A silent hat-tip may be read as ambiguous or as an actual joke about class rather than a button. \"Now.\" may feel too bare against 1919. The match cut depends on the drawn frames being truly identical, so the art pipeline has to hold the fat cat and bench pixel-stable.<\/p>\n<p><b>Protected lines.<\/b> \"Forget it.\" survives verbatim, spoken twice by the fat cat, identical delivery both times; that exact repetition is the joke.<\/p>", "10": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">VETERAN (1919)<\/td><td class=\"line\">Sir, about the pension, I only [cut off]<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (1919)<\/td><td class=\"line\">[not looking up, newspaper raised] Forget it.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">CAPTION (card, ink)<\/td><td class=\"line\">TODAY. SAME BENCH.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">NURSE (today)<\/td><td class=\"line\">Sir, about the pay, I only [cut off]<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (today, identical, unaged)<\/td><td class=\"line\">[not looking up, newspaper raised] Forget it.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">FAT CAT (beat C, a third shadow falls across his paper, nobody speaks)<\/td><td class=\"line\">[lowers paper an inch, before a word is said] Forget it.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION (button, silent hold, pen-ink stamp)<\/td><td class=\"line\">NEXT.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~9.0 spoken/caption + ~5 s of holds and pen-drawn action = about 14 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Alternative buttons to swap into beat C (director's pick):<\/p>\n<ul><li>C2 (sound): the fat cat says nothing; the bench-slat creak and a pocket-watch tick, then a third shadow falls and his paper rises. Silent action, no line.<\/li><li>C3 (caption only): CAPTION: \"THANKED. THEN FORGOTTEN. SAME MAN.\" Warning: states the moral, the one thing this shape avoids.<\/li><li>C4 (line): FAT CAT, glancing at a watch: \"Is it that time already? Forget it.\" Funnier but breaks the pre-emption rule.<\/li><\/ul>\n<p><b>Why it works.<\/b> The joke is the interruption: he never hears the ask, so the 'thanks' they were owed is shown by its absence rather than stated. A and B are identical beats with the nouns swapped (pension, pay), so the echo lands without a word of explanation. The button does the \"same man, every time\" job by proving he no longer needs the other person present: he has said it so often it fires on a shadow. The soldier and nurse are cut off, never mocked; the contempt stays on the man on the bench and the habit, not the technology or the victims. No moral is stated.<\/p>\n<p><b>Cuts from current.<\/b> Both lines stay; the soldier and nurse get a cut-off half-sentence to make him the interrupter. The open-ended button becomes the pre-emptive \"Forget it\" plus a stamped caption. No gratitude speech: the thanking happens in the picture (a flag, a clap, bunting), not the dialogue.<\/p>\n<p><b>Risk.<\/b> Three \"Forget it\"s may feel like a one-note triple; if the third lands flat, use C2 (silent). \"Pension\" and \"pay\" are specific enough to read as the policy fights of their eras, and \"NEXT.\" may read as a queue joke rather than the same-man joke; test both. The cut-off lines are hard for TTS to clip cleanly, so these may need to be sound-designed, not voiced. Nothing here shows him unaged except the drawing, so the art must make \"identical\" unmistakable (same hat, same watch-chain, same bench slat chipped).<\/p>\n<p><b>Protected lines.<\/b> \"Forget it.\" survives verbatim three times, each on the fat cat.<\/p>"}}], "questions": [{"id": "q1", "text": "Do you want any words beyond 'Forget it.'? 1A adds 'Hero.' and the asks, 1B adds none, 1C adds the veteran's plea and 'Quick learner.'"}, {"id": "q2", "text": "Spoken button, caption or silent? 1A and 1C fire a third 'Forget it.' at a stranger, 1B ends on a silent hat tip and a caption."}, {"id": "q3", "text": "Should the nurse and veteran speak at all, or stay silent so only he has a voice?"}, {"id": "q4", "text": "Is a closing caption ('Same bench.' / 'NEXT.') allowed, or does that tip into stating the moral?"}, {"id": "q5", "text": "1B needs a plaque readable at 9:16 and a frame-identical second drawing. Is the art budget there for it?"}]};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
