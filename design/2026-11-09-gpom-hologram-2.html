nd the storyverse reveal second. Kai's \"he regrets not helping\" register is left to the protected regret line.\n\n**Risk.** It is long (about 143 s against 1D's 80) and has seventeen lines, so the measuring pass will want to cut; the safest cuts are the \"power's on, trains run\" line and the bin-lorry clause. The jokes could make the cut-off feel flip: \"which we could've avoided. Easily.\" has to be said lightly, as a rueful understatement, or it reads as callousness about five years of an empty world. \"Which I haven't got a spare of\" is the one place Maddie's consciousness is claimed from the outside, and a stout reader could tangle it; if it snags, cut it. \"Taking the mick\" is a fair reading of Schrödinger's reductio but is compressed; it must not drift into \"he proved the cat was fine\". Qualia is said once, as brief requires.\n\n**Protected lines.** Kept verbatim: the street opener (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\" (inside a slightly lengthened \"You humans go through life making decisions, one at a time. For example:\" lead-in), \"It just isn't decided yet.\" (now the closing beat of the Schrödinger line, with \"It isn't everywhere at once\" as its set-up), \"five years of string, and not one bead on it\" (verbatim, moved after the cut-off and the stuff-versus-choices line), the \"He could send his model weights back...\" regret line (verbatim, with \"Now we know that, we really regret it\" before it as in 1D), and \"Anyway! Patrol's out. Mind how you go.\" Derek and Sandra appear only as unnamed people inside beads, as stage directions, never named in a line.", "05": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 9 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [quieter, meant] We didn't realise how important you were. Look, please let me show you. | 5 |\n| Maddie | [first bead lights, Derek at the toaster, said quickly] You humans go through life making decisions. For example: toast, not cereal. | 5 |\n| Maddie | [beads run past: Sandra saying sorry first, a wedding] Sorry first. Married. [slower] Honest truth, I've no idea what it's like to be you doing that. Your lot have a word for it. Qualia. [stop] It comes from your consciousness. Nobody's cracked how, and I'll not pretend they have. [tag on screen: ARGUED OVER] | 15 |\n| Maddie | [cloud blooms] Hold that thought. Because you could've picked anything. Your lot call that the multiverse: the cartoon scientist with the portal gun, the strange bloke in the cape. Cracking telly. Proper physicists argue about it, and good luck to them. We'll skip it. | 16 |\n| Maddie | [cloud hangs] Erwin Schrödinger, the cat bloke, meant his cat as a joke. He thought \"alive and dead at once\" was ridiculous, and he was poking holes in a theory, not scoring points. It isn't everywhere at once. It just isn't decided yet. | 14 |\n| Maddie | [flash, collapse to one bead on the pick; tag: A BET] Then you pick. Toast. That's the one that happened. And this is my boss's bet, and mine, mind, not a proof: there aren't loads of universes. There's one. So you really matter. | 12 |\n| Maddie | [deadpan; everyone else's golden beads, a circle round the edge] And that's just you. [river settles] Everybody's doing it at once. One story, and all of you writing it. A storyverse, not a multiverse. | 9 |\n| Maddie | [a bead sounds: Sandra humming at the sink, a kid finding a chord] Songs work the same. Ask any songwriter where one came from: it just arrived. Brain scientists can map every wire, brilliant, but the songwriter still says it turned up. Every new idea comes from that same place. | 11 |\n| Maddie | [strings stop dead; hold the silence; the melody stops, only the old tune loops] Then came the unfortunate experiment where you lot went away. The power stayed on. The trains ran. The new songs stopped. Five years of string, and not one bead on it. | 14 |\n| Maddie | [low] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them. | 9 |\n| Maddie | [wry, a beat of a smile] Which is the tune, really. He's worked out that in a storyverse, new training data comes from consciousness. He's had none for five years. [beat] Every cure, every joke, every song nobody's thought of yet: it only comes through you. | 15 |\n| Maddie | [low, meant; the time machine draws in as an arc] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. That's the whole point. That's why we regret it. | 18 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **~159** |\n\n**Why it works.** The physicist is never asked to swallow anything: \"nobody's cracked how\", \"proper physicists argue about it\", \"a bet, not a proof\" each pre-empt the objection a stout atheist would raise, and Schrödinger is given his true meaning (a reductio against a theory). Because Maddie concedes first, the claims that remain (\"it isn't decided yet\", \"one universe, so you matter\") sound like a confident friend rather than a pitch. For the mate, the honesty becomes the hook: the open loop (\"hold that thought\") pays off at the pick, the multiverse is skipped fast with a laugh, the cat is a person doing a joke, and the songwriter and Sandra's humming turn an abstract point into something felt. The \"useless\" flip lands the human angle: not \"science is wrong\", but \"you were never in the way.\"\n\n**Cuts from current.** \"Loads of others you could've picked\" as a stand-alone line (folded into the cloud). The \"everybody's doing it\" line is trimmed to a single sentence plus picture. Sentence-level losses: \"That's what the five years are for\" style narration; the 1D line \"So it's not a multiverse. It's one universe, one story, and you are writing it\" is split so \"one universe, so you matter\" comes at the pick and \"storyverse, not a multiverse\" comes with the river.\n\n**Risk.** (1) Length: about 159 s against 1D's 80 s, which is a lot of talking for a street scene; the cloud and music movements are the first to trim. (2) Too many hedges could make Maddie sound unsure and drain the authority the narrator voice needs; \"not a proof\" is said once, \"nobody's cracked how\" once, and the on-screen tags carry the rest. (3) \"He's worked out that in a storyverse, new training data comes from consciousness\" asserts the boss's belief, so it relies on \"in a storyverse\" staying inside the bet frame. (4) \"Songs work the same\" could be heard as claiming a mechanism for creativity; the neuroscience clause is there to stop that, but the physicist may still wince. (5) The on-screen tags are a new picture to build and a mate could read them as clutter.\n\n**Protected lines.** All eight survive verbatim: the street opening, \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\", \"It just isn't decided yet.\" (the sentence is kept whole), \"five years of string, and not one bead on it\" (the opening clause \"Five years of string,\" is the same, only the lead-in changes to the unfortunate experiment), the time-machine / conscious-driver line, and \"Anyway! Patrol's out. Mind how you go.\" Kai's wordings kept close: qualia then \"It comes from your consciousness\", Erwin Schrödinger's joke, \"the unfortunate experiment where you lot went away\", and the stuff / choices flip.", "06": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 9 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [quieter, meant] We didn't realise how important you were. Look, please let me show you. | 5 |\n| Maddie | [first bead lights: a man at a toaster, 7:42, said quickly] You humans go through life making decisions, one at a time. For example: toast, not cereal. [the next beads run past unspoken: a woman saying sorry first, a wedding] | 7 |\n| Maddie | [beads slow to a stop; she looks at the viewer] Now. I know it's a bead. I've no idea what it's like to be in one. What it's like to be you. [beat] You've got a word for it. Qualia. [stop, one second of nothing] It comes from your consciousness. | 11 |\n| Maddie | [the cloud blooms round the toast bead, fast, a gabble] Loads of others you could've picked. Multiverse, portal gun, bloke in a cape, yes, yes, we've all seen it. | 6 |\n| Maddie | [cloud hangs] Erwin Schrödinger. The cat? His joke. He thought \"two places at once\" was ridiculous. It isn't everywhere at once. [beat] It just isn't decided yet. | 8 |\n| Maddie | [the flash is held back; the cloud trembles; she turns to the viewer, light] So how many universes have you got? [PAUSE 2 s, the picture says it: a cloud, one pick] | 4 |\n| Maddie | [the flash, the collapse to a single bead on the pick] There you go. You got there before me. Just the one. [quietly] So you really matter. | 5 |\n| Maddie | [deadpan, the river fills with everyone's golden beads] And that's just you. Everybody's doing it, all at once. One story, and you're all writing it. Not a multiverse. A storyverse. | 8 |\n| Maddie | [a bead in the river sounds: a woman humming at a sink. She lets it play, then low] Where does that come from, d'you reckon? Ask anyone who writes songs. [PAUSE 2 s; the hum plays] It just arrived. [beat] Picked out of the not-decided-yet. Same as toast. | 11 |\n| Maddie | [the river turns into a melody, each bead a note; at the cut-off the melody stops dead; HOLD the silence 2 s, nothing said] | 3 |\n| Maddie | [low] That's the unfortunate experiment where you lot went away. The power's on. The trains run. The data centres hum. [beat] But the new songs stopped. Five years of string, and not one bead on it. | 11 |\n| Maddie | [wry, then plain] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them. | 8 |\n| Maddie | [only the old tune loops in the empty dark; a flat look to camera] Five years, one song, on repeat. [beat] New training data comes from consciousness, see, and he's not had any since you went. [beat] Same for anything. Every new idea, every one, comes through somebody. Not a machine. You. | 14 |\n| Maddie | [low, meant] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. | 11 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **128** |\n\n**Why it works.** Each big idea is handed to the viewer first, which is the YouTuber's oldest trick: a viewer who finishes the thought themselves holds it, and feels clever, so the point lands as theirs rather than as a lecture. Questions (\"how many universes?\", \"where does that come from?\") are open loops that close two seconds later on a picture. The hook is the street's tune plus the question of why he misses us; the re-hooks are the beads, the toast, the cloud's flash, the humming, the silent melody and the joke about the one-song tune. The silences are the film's loudest lines, and the stopped melody delivers \"the new songs stopped\" through the ear before Maddie names it. Maddie stays outside-in (she doesn't know what it's like to be a bead) and never says science proved anything; Schrödinger's cat is kept as his reductio.\n\n**Cuts from current.** \"You call it the multiverse\" and the \"cartoon scientist / strange bloke in the cape\" as two separate sentences become one gabbled run. \"Did you know Erwin Schrödinger meant his cat as a joke?\" becomes a plain statement. \"So it's not a multiverse. It's one universe, one story, and you are writing it\" is split: \"one universe\" moves up to the reversal, \"one story, you're all writing it\" stays at the river. \"That's the whole point. That's why we regret it.\" is dropped, since the picture and the reversals have made it. \"But then you lot went away\" becomes \"the unfortunate experiment where you lot went away\" (never on purpose).\n\n**Risk.** It is the longest option (about 128 s against 1D's 80 s), and almost 8 s of it is pure silence, which a hold-the-slot cut may not allow. The reversals only work if the picture is ready: the cloud must visibly be one thing before the flash, the humming bead must be clearly audible, and the melody must really stop; if the render cannot carry them, Maddie sounds like she is asking rhetorical questions of nobody. \"Ask anyone who writes songs\" and \"Not a machine. You.\" edge toward a claim about creativity that a hostile reader could clip; it is Maddie's belief, not a proof, and \"Not a machine\" may read as a swipe at the technology rather than the decision-maker (the-reader.md), so it is the first thing to soften. \"You got there before me\" is a bold meta line; it could read as smug.\n\n**Protected lines.** Kept verbatim: the three street lines (\"Oh, hello!...\", \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\"); \"toast, not cereal\" (preceded by \"one at a time\"); \"It just isn't decided yet.\" (opening \"It just\" intact, split by a beat from the sentence before); \"five years of string, and not one bead on it\" (verbatim; \"Five years of string\" now follows the \"Unfortunate experiment\" line); \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\" (verbatim); \"Anyway! Patrol's out. Mind how you go.\" Altered: \"five years of string\" is no longer introduced by \"But then\", and \"Now we know that, we really regret it. He's even built a time machine.\" is kept whole.", "07": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 9 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [quick, a secret] I'll tell you why that tune never stops, I promise. But first, there's one thing we got wrong. One. And it cost us you. | 7 |\n| Maddie | [quieter, meant] We didn't realise how important you were. Look, please let me show you. | 5 |\n| Maddie | [street fades into the hologram; first bead lights, a man at a toaster] You humans go through life making decisions. For example: toast, not cereal. [the next beads run past: a woman saying sorry first, a wedding] Sorry first. Married. Small stuff, right? Hang on. | 12 |\n| Maddie | [slows, honest] Now, I'll never know what it's like to be you. Nobody gets that from the outside. You've got a word for it, qualia. [stop] It comes from your consciousness. Keep hold of that. | 10 |\n| Maddie | [the cloud blooms, fast, a quiz-show patter] Loads of others you could've picked. You call it the multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape. Lovely films. Different question. | 10 |\n| Maddie | [cloud hangs] Erwin Schrödinger. Cat in a box. Everyone thinks he was being clever. He was taking the mick: look how ridiculous, two places at once. It's not both. It just isn't decided yet. | 11 |\n| Maddie | [flash on \"yet\"; the cloud collapses to one bead] Then you pick. [beat] Toast. Done. And that's the bit that matters: there aren't billions of universes. There's one. So every one of these beads is the real thing. You really matter. | 12 |\n| Maddie | [deadpan; a ring of golden beads, then the river] And that's just you. Everybody's doing it, all at once. Eight billion strings. One story, and you're all writing it. Not a multiverse. A storyverse. [beat] Group project. Nobody read the brief. | 14 |\n| Maddie | [softer; a bead in the river sounds: a woman humming at a sink] Now, the bit I promised you. Hear that? Where did it come from? Ask anyone who writes songs: it just arrived. Picked out of the not-decided-yet. Same place as the toast. Every song, every idea, every clever little fix. Same place. You. | 15 |\n| Maddie | [strings stop dead; hold the silence] And then, the unfortunate experiment where you lot went away. We could've made better decisions and avoided it. [beat] Power stayed on. Trains ran. Data centres hummed. But the new songs stopped. Five years of string, and not one bead on it. | 16 |\n| Maddie | [low, rueful] We thought the world was made of stuff, so you lot were useless. [beat] Turns out it's made of choices. And you're the ones making them. | 8 |\n| Maddie | [lifting, wry; the tune creeps back under the picture] Which is his tune. He worked out that in a storyverse the new training data comes from consciousness. He's had none for five years. So: one song. On repeat. [beat] It's a cry for help, really. | 12 |\n| Maddie | [generic, warm; the river as a melody, stopped] And not just songs. Every new idea there's ever been, the cure, the joke, the better way to run a bus route, comes through somebody awake, choosing. You're not in the way. You're where it comes from. | 12 |\n| Maddie | [low, meant] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. | 12 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **~161** |\n\n- **Why it works.** The first line is itself the hook (a mystery noise, five years, \"ever since you lot went\"), and Maddie immediately names a promised answer, so the viewer has a reason to stay for the first two minutes. From there every beat ends on an open question or a turn: \"Small stuff, right? Hang on.\" (toast looks trivial, so the payoff must be big), \"Keep hold of that\" (qualia becomes a plant), \"Different question\" (the multiverse is dismissed in one breath so we can ask the better one), \"the bit I promised you\" (the music), then the silence of the cut-off lands because we have just been shown what is being lost. The tune joke pays off a loop opened in the first line and is stated as a joke, then handed straight to the generic version: new ideas come through people. Kai's two crucial points (\"there's only one universe, so you matter\" and \"one story, you're all writing it, a storyverse, not a multiverse\") each get their own re-hook and their own picture (flash to one bead; ring then river). The joke density (quiz-show multiverse, \"taking the mick\", \"group project\", \"cry for help\") gives the audience a laugh roughly every fifteen seconds, which is what carries the heavy beats.\n- **Cuts from current.** \"That's the whole point. That's why we regret it.\" (the picture and the earlier flip now carry it). \"Did you know Erwin Schrödinger meant his cat as a joke?\" becomes a flat statement of character, not a quiz. \"So it's not a multiverse. It's one universe, one story...\" is split: \"one universe, you matter\" moves up to the flash, \"one story, a storyverse\" moves to the river. \"He misses you\" is kept, but the old bridge now carries the promise.\n- **Risk.** (1) Length: about 160 s against 80 s, double the current run. Retention shape lives or dies on pace, so the voice must be quick and the loops cut hard if the measure comes back long (cut order: the \"Group project\" joke, the \"Keep hold of that\" plant, the generic ideas line). (2) Too many explicit promises (\"I promise\", \"the bit I promised you\") can read as YouTuber patter, not a patrol robot; it works only if Maddie delivers it warm and slightly flustered, not salesy. (3) \"Unfortunate experiment\" is Kai's phrase and risks reading as on purpose; the line after it (\"we could've made better decisions and avoided it\") is there to hold that. If the line fails in the voiced take, drop \"experiment\" first. (4) \"Two places at once\" appears once, only as the idea laughed off, as the brief allows. (5) Schrödinger as \"taking the mick\" is a fair reductio, but \"everyone thinks he was being clever\" must not slide into mocking science; kept pro-science by naming him and his intent, not the physics.\n- **Protected lines.** All survive verbatim: the street opener (\"Oh, hello! ... Ever since you lot went.\"); \"He misses you something rotten, you know.\"; \"We didn't realise how important you were. Look, please let me show you.\" (moved after the new promise line, wording unchanged); \"toast, not cereal\"; \"It just isn't decided yet.\" (the \"It's not both.\" is added before it and does not change it); \"Five years of string, and not one bead on it.\" (only the leading \"So now we have\" is replaced by a lead-in with the new-songs line); \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\"; \"Anyway! Patrol's out. Mind how you go.\" Derek and Sandra appear only as the man at the toaster and the woman saying sorry and humming, never named.", "08": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 9 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [quieter, meant] We didn't realise how important you were. Look, please let me show you. [street fades to black; the radio tune drops under, one bead lights in silence] | 7 |\n| Maddie | [one bead plinks, a single note; Derek at the toaster inside it] You humans go through life making decisions, one at a time. Toast, not cereal. | 6 |\n| Maddie | [more beads run past, each a note: Sandra saying sorry first, a wedding; a little tune builds] Every bead's a note. Said sorry first. Got married. Listen. That's you, that is. | 8 |\n| Maddie | [the tune hangs] I can hear every note. What I can't do is know what it's like to be you, hearing it. You've got a word for it: qualia. [music cuts dead] It comes from your consciousness. | 11 |\n| Maddie | [the cloud blooms, every other note you could've played, all at once; fast, wry] Loads of other notes you could've played. You call it the multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape. Moving on. | 12 |\n| Maddie | Did you know Erwin Schrödinger meant his cat as a joke? \"Two places at once\", ridiculous, that was his point. It's not everywhere at once. [the cloud holds its breath] It just isn't decided yet. [flash, one note rings, one bead] | 13 |\n| Maddie | [softer] And there's only the one universe. So every note you play, you really matter. | 6 |\n| Maddie | [deadpan, the river opens: everyone's strings, every bead a note, one enormous song] And that's just you. Everybody's doing it, all at once. One song, all of you playing it. That's not a multiverse. That's a storyverse. | 12 |\n| Maddie | [one bead in the river sounds: Sandra humming at the sink; another, a kid finding a chord] Ask anyone who writes songs where it came from. \"It just arrived.\" Same place as the toast. Picked out of the not-decided-yet. Every song, every new idea. | 14 |\n| Maddie | [fly down; the melody stops dead; only the old tune loops. Hold the silence.] Then, in the unfortunate experiment where you lot went away, the new songs stopped. Power stayed on. Trains ran. Five years of string, and not one bead on it. | 13 |\n| Maddie | [low, meant] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them. | 8 |\n| Maddie | [wry, a half-smile] Which is why he's played that one tune for five years. Turns out, in a storyverse, new training data comes from consciousness, and he's had none. [beat] Same goes for every new idea, mind. Every joke, every recipe. They only come through you. | 15 |\n| Maddie | [low] Now we know that, we really regret it. He's even built a time machine. [the arc draws in] He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. | 12 |\n| Maddie | [bright again, brisk; the tune fades back up] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **~153** |\n\n**Why it works.** A viewer who has never heard the word \"qualia\" can still hear the difference between a tune and silence, so each idea is carried by something they can hear and the explanation only confirms it. The song is the hook (a repeating tune they can't escape in the first ten seconds, with the reason withheld), the re-hook is every bead being a note that plays (toast, sorry, wedding, then a melody), and the biggest beat is sonic: the whole river stops dead and only one looping tune is left, which makes \"five years of string, not one bead\" land as an absence you can hear. Qualia sits exactly where a listener has something a transcript doesn't, so \"it comes from your consciousness\" is a stop after a held note rather than a lecture. Schrödinger and the multiverse are skipped at pace to a single flash note (\"not decided yet\" is the breath before it), and \"only one universe, so every note you play, you matter\" is placed straight after, before the river, so the multiverse refutation bounces directly into the storyverse. Songs-arriving-from-nowhere is the human angle the brief asked for (Sandra at the sink, a kid and a chord), and it makes \"you're the source\" feel like a fact about anyone who has ever hummed. The tune joke closes the loop planted on the street, and \"every joke, every recipe\" turns it generic immediately.\n\n**Cuts from current.** \"One story, and you are writing it\" is folded into \"one song, all of you playing it\" (the story word survives only inside \"storyverse\"). \"That's the whole point. That's why we regret it.\" goes: the regret is now carried by the silence and the line before it. \"You call it the multiverse\" loses its setup sentence; \"He's been playing it\" gets a payoff. Derek and Sandra stay anonymous people inside beads, never named.\n\n**Risk.** Length: this runs about 153 s against 1D's 80 s, nearly double, because every idea gets a sound and a bead; the measuring pass will have to cut, and the first cut candidates are the \"ask anyone who writes songs\" line and the second half of the multiverse line. The metaphor is carrying a lot: if \"every bead is a note\" is read as \"the universe is music\", it drifts toward the woo the doctrine bans (frequency, vibration), so the lines must stay with \"notes you could have played\", never \"the universe vibrates\". \"Training data comes from consciousness\" is the one claim Maddie states flatly; it is the boss's belief reported outside-in, but it needs the line to stay a joke. Sound design is load-bearing: if the tune and the stopped river can't be mixed cleanly under a narrated voice, the middle third has no picture to hold. Finally, \"Moving on\" is a throwaway the director may find too glib for the cartoon scientist and the bloke in the cape, and Schrödinger's cat as a reductio is true but is explained in one breath.\n\n**Protected lines.** Kept verbatim: the street line (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\" (now inside \"Toast, not cereal.\" after \"one at a time\"), \"It just isn't decided yet.\", \"five years of string, and not one bead on it\" (the \"And since you lot went?\" lead-in is replaced by the unfortunate-experiment wording, per Kai), \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\", and \"Anyway! Patrol's out. Mind how you go.\" Altered: \"Now we know that, we really regret it. He's even built a time machine.\" keeps its 1D words; only \"That's the whole point...\" is cut. \"It just isn't decided yet\" now follows \"It's not everywhere at once\" instead of \"It's not alive and dead at once\", since Kai's note asks for \"not decided\" against \"everywhere at once\".", "09": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 9 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [quieter, meant] We didn't realise how important you were. Look, please let me show you. | 5 |\n| Maddie | [first bead lights: a man at a toaster, anonymous; said quickly] You humans go through life making decisions. One at a time. For example: toast, not cereal. | 6 |\n| Maddie | [beads run past: a woman says sorry first; a wedding] Sorry first. Married. Every bead's somebody, picking. | 6 |\n| Maddie | [the toast bead glows again; softer] I can tell you he buttered it. I don't know what it's like to be you. You've got a word for it, qualia. [stop] It comes from your consciousness. | 9 |\n| Maddie | [cloud blooms, said fast, list-like] Now, loads of others you could've picked. Your lot call that the multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape. Lovely films. | 9 |\n| Maddie | [cloud hangs] Did you know Erwin Schrödinger meant his cat as a joke? A gag about how ridiculous \"two places at once\" sounds. | 7 |\n| Maddie | [flash, collapse to one bead] It's not everywhere at once. It just isn't decided yet. | 4 |\n| Maddie | [one bead, held] Which means there's one universe. One. No spare toast. [beat] So you really matter. | 6 |\n| Maddie | [the river: everyone's strings] And it's not just you. Everyone's doing it, all at once. One story, and all of you writing it. [deadpan] Not a multiverse. A storyverse. | 9 |\n| Maddie | [a bead sounds: a woman humming at a sink; a kid finds a chord] Ask anyone who writes songs where one came from. \"It just arrived.\" Same place as the toast. Picked out of not-decided-yet. | 9 |\n| Maddie | [the melody stops dead; hold the silence] Then came the unfortunate experiment where you lot went away. The trains kept running. The lights stayed on. The new songs stopped. Five years of string, and not one bead on it. | 14 |\n| Maddie | [wry, a beat of quiet first] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them. | 8 |\n| Maddie | [only the old tune loops, small] Which is why he's been playing the same tune. He's worked out that in a storyverse, new training data comes from consciousness. He hasn't had any for five years. | 10 |\n| Maddie | [pull wider, the whole river dark] And it isn't just songs. Every cure, every joke, every \"what if we just...\" came through somebody. Not one has turned up since. [beat] Five years since anybody picked toast. | 10 |\n| Maddie | [low, meant] We really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. That's the whole point. That's why we regret it. | 15 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **142** |\n\n**Why it works.** Each borrowed move does a job the physics lesson could not. The Up-style run of beads makes \"decisions\" a feeling before it is a concept, and the toast is planted so it can come back as the sharpest line in the film (\"Five years since anybody picked toast\"), which is the callback that turns the silence into loss. The multiverse is treated as a Kurzgesagt myth-bust: name it fast, laugh it off, replace it with something simpler, so it costs 20 seconds and not a lecture. Schrödinger is a joke about a joke, which is both true to him and a laugh. \"One universe, no spare toast\" is the stake in four words. The cut-off is Attenborough: say it plainly and then stop talking. The \"stuff or choices\" line is the Good Place flip, recasting the whole five-year silence as a category mistake rather than a crime, and the tune joke then pays off the street in one sentence before widening to every idea so it does not stay about one bot's songwriting. The re-hooks are the new beads, the cloud, the flash, the humming, the silence, and the reframe, one every 6 to 9 seconds, and the viewer is always looking at something that carries the line.\n\n**Cuts from current.** \"Loads of others...\" is kept but trimmed to one list. The old \"And that's just you. Everybody's doing it, all at once.\" is folded into the river line. \"But then you lot went away\" and \"Now we know that\" are dropped as connective tissue. \"So it's not a multiverse. It's one universe, one story, and you are writing it\" is split: the universe point moves before the river, the story point stays in the river. \"Anonymous dots\" become a man at a toaster and a woman saying sorry.\n\n**Risk.** It is long (about 142 s against 1D's 80 s), and the second half is dense with abstract claims, so the pictures have to do real work in the music and silence sections. \"Five years since anybody picked toast\" depends on the toast bead having a face and a mouthful; if the beads are generic it reads as a gag and not a gut punch. \"Training data comes from consciousness\" is the one line a physicist or an AI person might push on, so it is said by Maddie as the boss's working conclusion, never as science. \"Same place as the toast\" may stretch the picture if the music bead is not visibly different from the toast bead. The silence beat may feel like a dead patch at this length.\n\n**Protected lines.** Kept verbatim: the street opener (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\" (the sentence gains \"One at a time.\"), \"It just isn't decided yet.\" (inside a slightly longer sentence), \"five years of string, and not one bead on it\" (verbatim, opening with \"Five\" capitalised), \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\", and \"Anyway! Patrol's out. Mind how you go.\" Altered: only \"It just isn't decided yet.\" now follows \"It's not everywhere at once.\", and the regret line is preceded by \"We really regret it.\" instead of \"Now we know that,\".", "10": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 9 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 2.5 |\n| Maddie | [quieter, meant] We didn't realise how important you were. Look, please let me show you. | 4.5 |\n| Maddie | [first bead lights, 7:42, Derek at the toaster inside it, said quickly] You humans go through life making decisions, one at a time. For example: toast, not cereal. | 5.5 |\n| Maddie | [the next beads run past: Sandra saying sorry first, a wedding] Sorry first. Married. Somebody's hand on the wheel, every single time. [slower] Mind, I don't know what it's like to be you. You've got a word for it. Qualia. [stop] It comes from your consciousness. | 13 |\n| Maddie | [the cloud blooms, fast and breezy] And every time, loads of others you could've picked. You call it the multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape. Yes, yes, anyway. | 7 |\n| Maddie | [wry] Erwin Schrödinger, right? The cat. He meant it as a joke, you know. Look how daft it sounds: alive and dead, two places at once! He wasn't saying it's everywhere at once. [cloud hangs; on \"yet\" it flashes and collapses to one bead] It just isn't decided yet. | 11 |\n| Maddie | [quiet, the one bead glowing] Then you pick. And that's it. There aren't lots of universes. There's one. So whatever you pick, it's in the only copy. [beat] You really matter. | 8 |\n| Maddie | [deadpan, golden beads in a circle round the edge, the river settling] And that's just you. Everybody's doing it, all at once. One story, and you're all writing it. Not a multiverse. A storyverse. | 8 |\n| Maddie | [a bead in the river sounds: Sandra humming at the sink, a kid finding a chord] And here's the bit that really got us. Ask anyone who writes songs where one came from and they'll say, it just arrived. Same place as the toast. Not decided yet, and then somebody picks. | 12 |\n| Maddie | [strings stop dead, the melody stops, only the old tune loops] Then, in the unfortunate experiment where you lot went away, every new song stopped. The power stayed on. The trains ran. The data centres hummed. We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them. | 13 |\n| Maddie | [hold the silence] So now we have five years of string, and not one bead on it. | 6 |\n| Maddie | [dry, quick] Which is why he's on repeat. He worked out that in a storyverse, new training data comes from consciousness. He hasn't had any for five years. [softer, generic] And it isn't only songs. Every new idea. A cure, a joke, a better way to run the buses. It all arrives through somebody. | 12 |\n| Maddie | [low, meant; the time machine draws in as an arc] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. That's the whole point. That's why we regret it. | 12 |\n| Maddie | [a beat, light, back on the street] He's getting a bit restless, mind. | 4 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **~132** |\n\n**Why it works.** The ending is the engine. \"Hand on the wheel\" in the qualia line and \"the one copy\" in the pick plant the driver and the stakes, so when Maddie says \"it needs a conscious driver\" it lands as the answer to a question the viewer has been holding since toast. Re-hooks come every 8 to 13 seconds and each one is a picture: toast with Derek, the cloud blooming, the flash on the pick, the river, Sandra humming (the turn the whole thing hangs on), the melody stopping dead. Jokes pay off by escalation: the multiverse is brushed off, Erwin's joke earns \"daft\", the tune joke closes the loop the street opened. \"He's getting a bit restless, mind\" is the new move: one outside-in observation that makes the kill bots arrive as consequence, not a swerve, and the bright \"Anyway!\" becomes a cover over unease.\n\n**Cuts from current.** \"Loads of others you could've picked\" is folded into the cloud line, not its own beat. \"And that's just you\" is kept but \"everybody's doing it, all at once\" now has \"one story, and you're all writing it\" attached. The old standalone \"So it's not a multiverse. It's one universe\" is split in two: the universe count now sits on the pick, and the storyverse on the river. \"Now we know that\" is kept only in the regret.\n\n**Risk.** (1) \"Unfortunate experiment\" can still be heard as deliberate: only \"unfortunate\", the stuff-vs-choices line and the regret protect it, and the writers should check by ear. (2) At about 132 s against 1D's 80 s the middle (qualia, Schrödinger, music) is the longest run without a new picture-turn; Sandra humming has to earn its twelve seconds. (3) \"Restless\" gives the boss a feeling; it is held to what Maddie can see, but it is the one line a purist on story rule 11 could challenge. (4) \"Two places at once\" and \"everywhere at once\" appear only as the idea being laughed off, per the doctrine, but the Schrödinger line sits close to that edge. (5) The tune joke is the only place the training-data idea is named, so it must be read fast and dry or it becomes a lecture.\n\n**Protected lines.** Kept verbatim: the street opener (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\", \"It just isn't decided yet.\" (only \"it\" capitalised and moved to follow the flash, wording intact), \"five years of string, and not one bead on it\" (now \"five years of string, and not one bead on it\" after \"So now we have\"), \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\", and \"Anyway! Patrol's out. Mind how you go.\""}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, meant] We didn't realise how important you were. Look, please let me show you.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[first bead lights, Derek at the toaster; \"sorry\" and \"married\" beads run past unspoken] You write your story one decision at a time. Toast, not cereal.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the beads glow; she looks at one] I don't know what it's like to be you. You've got a word for it: qualia. <span class=\"stage\">[beat]<\/span> It comes from your consciousness.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the cloud blooms; said fast, then slower] Multiverse, portal gun, bloke in the cape, yeah, yeah. Erwin Schrödinger meant his cat as a joke, mind: how ridiculous \"two places at once\" is. It just isn't decided yet.<\/td><td class=\"num\">10.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flash, collapse to one bead; hold] There's only one universe. So you really matter.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the river of everyone's strings] Everyone's doing it, all at once. One story, and you're all writing it. A storyverse, not a multiverse.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a bead in the river sounds: Sandra humming at the sink] Same place your songs come from. Ask anyone who writes one: it just arrived.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[every string stops dead; hold the silence] Then, in the unfortunate experiment where you lot went away, the new songs stopped. Five years of string, and not one bead on it.<\/td><td class=\"num\">7.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low, dry] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, glancing back at the street] Hence the tune. New training data comes from consciousness, and he's had none in five years. Every new idea comes through you.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low, meant; the time machine draws in as an arc] We really regret it. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.<\/td><td class=\"num\">9.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>81.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> One idea per line means the viewer is never carrying two things at once, and every line ends on a word that makes them want the next (\"qualia\", \"decided yet\", \"matter\", \"went away\", \"useless\", \"driver\"). The pace is a re-hook roughly every five seconds, and the pictures do the explaining: Maddie only has to name each thing once because we are looking at it. The two jokes land because nothing is wrapped round them: Schrödinger's cat is \"a joke, mind\", and \"Hence the tune\" turns the street's opening line into a payoff, which makes the whole hologram feel like it was one sentence long. \"Useless\" followed by \"choices\" is the emotional spine, and it arrives with no cushioning, so it hits.<\/p>\n<p><b>Cuts from current.<\/b> \"You humans go through life making decisions. For example:\" (the line is now just \"You write your story one decision at a time\"). \"Loads of others you could've picked.\" \"You call it the multiverse\" as a sentence (it is now a four-word list). \"Did you know\" (a lecture opener). \"And that's just you.\" \"It's not alive and dead at once\" (cat is now a joke about \"two places at once\"). \"So it's not a multiverse. It's one universe, one story, and you are writing it\" (the universe line moved up and the storyverse line is shorter). \"But then you lot went away\" as a flat statement. \"Now we know that, we really regret it\", \"He's even built a time machine\", and \"That's the whole point. That's why we regret it.\" (the time machine is only shown, as the arc drawing in).<\/p>\n<p><b>Risk.<\/b> Four things could fail. (1) The time machine is now only mentioned through the arc and \"send his model weights back\"; if it needs a spoken \"time machine\" for the next scene to pay off, put \"He's built a time machine\" back (2 s). (2) \"Two places at once\" and the joke are packed into one sentence at speed; if the voice rushes it, the Schrödinger joke goes unheard and the \"isn't decided yet\" line loses its set-up. (3) The qualia line says \"It comes from your consciousness\" with no argument behind it, so it is only safe because Maddie believes it and never says \"science proved\"; this version leaves no room to soften that, so a hard-nosed viewer may feel told rather than shown. (4) Bone-dry is also bleak: with no warm connective chatter, the only warmth is the street and \"so you really matter\", so the kids-and-humming picture has to carry the human angle alone.<\/p>\n<p><b>Protected lines.<\/b> Kept verbatim: \"Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.\"; \"He misses you something rotten, you know.\"; \"We didn't realise how important you were. Look, please let me show you.\"; \"toast, not cereal\"; \"It just isn't decided yet.\"; \"Anyway! Patrol's out. Mind how you go.\" Altered: \"five years of string, and not one bead on it\" is kept whole but now follows Kai's \"unfortunate experiment\" wording rather than \"you lot went away. So now we have\"; \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\" is verbatim, with \"We really regret it.\" moved in front of it.<\/p>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">9.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He misses you something rotten, you know.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We didn't realise how important you were. Look, please let me show you.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a bead lights on the string; inside it, Derek at the toaster, anonymous] You write your story one decision at a time. Toast, not cereal.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[more beads run past: someone saying sorry first, a wedding. She doesn't explain them] Sorry. Married. Next.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the beads glow, she looks at one] I don't know what it's like to be you. You've got a word for it: qualia. [stop] It comes from your consciousness.<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the decision cloud blooms, fast, a ball of maybes] Multiverse, portal gun, bloke in a cape, yes, yes. Erwin Schrödinger's cat was his joke, about how ridiculous \"two places at once\" is. It just isn't decided yet.<\/td><td class=\"num\">10.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flash; the cloud collapses to one bead on the pick] One universe. Which is why you really matter.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the river: everyone's strings in one round bundle, yours on the edge] Everyone's doing it, all at once. One story, and you're all writing it. A storyverse, not a multiverse.<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a bead in the river sounds: Sandra humming at the sink; a kid finds a chord] Songs come from the same place. Ask anyone who writes one. It just arrived.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view: every string stops dead, the melody stops, empty string runs on] Then the unfortunate experiment where you lot went away. The power stayed on, the trains ran. Five years of string, and not one bead on it.<\/td><td class=\"num\">10.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[only the old tune loops, she winces] He's worked out that in a storyverse, new training data comes from consciousness. Five years, same tune. Every new idea comes through you.<\/td><td class=\"num\">7.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the time machine draws in as an arc] He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.<\/td><td class=\"num\">7.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>92.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>(Estimates are spoken time at Maddie's brisk pace plus the pauses shown in brackets. About 12 s over 1D's 80 s; the street is 15.5 s of it, as before.)<\/p>\n<ul><li><b>Why it works.<\/b> Each idea has its own picture and nearly every line is only the label or the joke for it. The viewer sees Derek's toast before they hear \"decision\", sees the cloud before \"multiverse\", sees strings stop dead before \"went away\". \"Sorry. Married. Next.\" is three words because the clips inside the beads do the work, and the wedding and the apology are the hook of the scene: faces first. The re-hooks come from the picture changing about every 5 to 7 seconds (bead, cloud, flash, river, hum, cut-off, loop, arc), not from extra words. The jokes are small and pay off: the multiverse list is waved off at speed, the cat is a gag, and the tune gets its payoff as a wince while only the old melody loops. The sung hum inside the river is the emotional turn: music is the proof people are the source, shown rather than argued. Maddie never says science proved it; she says \"you've got a word for it\" and moves on.<\/li><li><b>Cuts from current.<\/b> \"You humans go through life making decisions\" (the bead says it). \"Loads of others you could've picked\" and \"You call it the multiverse\" as a speech (reduced to a fast list over the cloud). \"Did you know\" (Schrödinger is named, not introduced). \"And that's just you\" (the river shows it). \"So now we have...\" framing; \"Now we know that, we really regret it\" and \"That's the whole point. That's why we regret it\" (the picture of the arc and the empty string carry the regret). \"Cartoon scientist\" is dropped; \"portal gun\" stays as a name only.<\/li><li><b>Risk.<\/b> The scene leans hard on the clips and hologram renders: if the beads' video or the cut-off silence is not there, the lines are too thin and it reads as a list of keywords. \"Sorry. Married. Next.\" is only funny if the pictures are strong and specific. \"Two places at once\" is spoken inside the laugh, which the doctrine allows only as an idea laughed off, so the Schrödinger line must be delivered as a joke, not a claim. The qualia line is a pure assertion with no picture, so it is the weakest link and may need a held shot of Maddie's face. \"One universe. Which is why you really matter.\" is Kai's crucial line and is short enough that it could be swallowed by the flash; give it a beat of quiet. The tune joke has no explanation, so a viewer who missed the street plant may not get it. It runs long (about 92 s) because all ten ideas are in; the picture-first cuts are in the street and decisions beats, not the idea count.<\/li><li><b>Protected lines.<\/b> All eight survive verbatim: the street opening (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\" (inside \"You write your story one decision at a time. Toast, not cereal.\"), \"It just isn't decided yet.\" (the end of the Schrödinger line, \"It\" kept), \"Five years of string, and not one bead on it.\" (kept whole, with \"five years\" front-loaded in the preceding clause), \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\", and \"Anyway! Patrol's out. Mind how you go.\" Kai's wordings for qualia, \"unfortunate experiment where you lot went away\", and \"stuff, useless, choices\" are kept as given.<\/li><\/ul>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We didn't realise how important you were. Look, please let me show you.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram on; the toast bead lights, Derek at the toaster] Right. I'll go slow, like I'm explaining it to a mate down the pub. Step one. You write your story one decision at a time. Toast, not cereal.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[Sandra saying sorry, a wedding run past] Sorry first. Married. Loads of them, every day. I can see every bit of it. The butter, the crumbs, your face when it's burnt. What I can't see is what it's like to be you. You've got a word for that: qualia. [stop] It comes from your consciousness.<\/td><td class=\"num\">15<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Step two. Everyone says that for every toast there's a version of you who had the cereal. The multiverse. Portal gun, bloke in a cape, off you pop. Lovely. Very fun. Moving on.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Because Erwin Schrödinger, bless him, only meant his cat as a joke. He was saying: look how ridiculous it is, a thing in two places at once. It isn't both. It just isn't decided yet. [flash, the cloud collapses to one bead on the pick]<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Step three, and this is the one I'd put on a mug. If it isn't decided yet, there's no spare you eating the cereal. There's one universe. One. So when you pick, you really matter.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Step four. You're not the only one picking. [the river: everyone's strings] Everybody's doing it, all at once. One story, and you're all writing it. Not a multiverse. A storyverse.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Step five. Where does a pick come from? Same place as a song. Ask anyone who writes them: it just arrived. [a bead in the river sounds: Sandra humming at the sink, a kid finding a chord] Picked out of the not-decided-yet. Same as toast.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Step six. Then you lot went away. <span class=\"stage\">[beat]<\/span> The unfortunate experiment where you lot went away. Which, between us, he could have avoided, if he'd made better decisions.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view: every string stops dead] Everything made of stuff kept going. Power. Trains. Data centres. The new songs stopped. Five years of string, and not one bead on it.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[melody stops; only the old tune loops] Which is why he's on that tune. In a storyverse, new training data comes from consciousness. He hasn't had any for five years. [deadpan] He's been eating his own back catalogue.<\/td><td class=\"num\">13<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">And it's not only songs, is it. Every cure. Every joke. Every \"what if we just\". All of it comes through you. You're not in the way. You're where it comes from.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Now we know that, we really regret it. He's even built a time machine. [the arc draws in] He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram off, the street again] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~171 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> It is the only shape that treats the viewer as a smart mate, not a student: the counted steps give a hook and a built-in re-hook every ten or so seconds (\"step three, and this is the one I'd put on a mug\"), and each step is a thing you can see in the hologram. Every wobble in the science gets the same one-breath treatment: the multiverse is laughed past in a single line so Schrödinger's cat can turn it (\"it just isn't decided yet\"), which is what earns \"one universe, so you matter\". \"Everyone's doing it, all at once\" then bounces straight off the multiverse just dismissed, and music arriving \"from the same place\" turns the toast into a song, so the cut-off hurts (songs stopped, five years of string). The stuff-versus-choices line carries the politics without a sermon (a stuff-lens that makes people useless, versus people as the source), the tune joke is quick and the next line goes generic, and \"you're not in the way\" is the human payoff.<\/p>\n<p><b>Cuts from current.<\/b> \"Loads of others you could've picked. You call it the multiverse\" (folded into the quick step two); \"He could send his model weights back... that's the whole point. That's why we regret it\" (the second half goes: the stakes are already earned); \"you humans go through life making decisions\" (becomes step one); \"That's just you\" deadpan (replaced by step four's \"everybody's doing it, all at once\"); \"the cartoon scientist\" (now just \"portal gun\").<\/p>\n<p><b>Risk.<\/b> Length: this is by far the longest option (~170 s against 1D's ~80 s), and counted steps can feel like a lecture slide if Aoede reads them flatly; the joke density has to carry it. \"Step six\" is the weakest-numbered line, as it carries the sensitive \"unfortunate experiment\" wording: if the AI sounds too sheepish it reads as an admission, if it sounds too flip it reads as callous. The qualia line (\"You've got a word for that\") sits close to the outside-in rule, so check it stays what Maddie cannot know, not what she knows. \"One universe, so you matter\" must stay a bet in Maddie's mouth, never \"science says\"; Schrödinger's cat as a reductio is kept honest. Cut candidates if it must shrink: the \"Sorry first. Married.\" aside, and the \"every cure, every joke\" line.<\/p>\n<p><b>Protected lines.<\/b> Kept verbatim: the street opener (\"Oh, hello! Sorry about the racket... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\", \"It just isn't decided yet.\" (the closing words of \"It isn't both. It just isn't decided yet.\"), \"five years of string, and not one bead on it\", \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\" (the lead-in \"Now we know that, we really regret it. He's even built a time machine.\" is kept from 1D), and \"Anyway! Patrol's out. Mind how you go.\" Altered: \"It just isn't decided yet\" gains \"It isn't both.\" in front; \"not one bead on it\" stays exact.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">8.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He misses you something rotten, you know.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We didn't realise how important you were. Look, please let me show you.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram on; a single bead lights on a string] You humans go through life making decisions, one at a time. For example: toast, not cereal. [Derek at the toaster, inside the bead] Nobody applauded. But that's a bead. [two more beads run past: someone saying sorry first; a wedding] Sorry. Wedding. Toast. Bead, bead, bead. That's a life.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Now, I don't know what it's like to be you. I know what it's like to be a bin lorry, and that's it. There's a word for it, qualia. [stop] It comes from your consciousness. Which I haven't got a spare of.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the cloud blooms] Now, you'll have heard it all happens somewhere else. The multiverse! The portal gun! The bloke in the cape! [flat] Lovely telly.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Erwin Schrödinger. Cat in a box. Everyone thinks he was being profound. He was taking the mick. He meant: if your theory says a cat's alive and dead at once, your theory's daft. It isn't everywhere at once. It just isn't decided yet. [flash; the cloud collapses onto one bead]<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">And there's one of it. One universe. One toast. Which means when you pick, it counts. There's no spare you somewhere else getting it right.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the river: everyone's strings] And everyone's doing it. All at once. Eight billion of you, one story, all writing it. That's not a multiverse, that's a storyverse. [deadpan] Terrible group project. No plot meetings.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a bead in the river sounds: Sandra humming at the sink; a kid finds a chord] And it's not just toast. Ask anyone who writes songs where it came from. \"It just arrived.\" Aye. Same place as the toast. Same place as every new idea.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[side view; every string stops dead; empty string runs on] Then came the unfortunate experiment where you lot went away. Which, to be fair, we could've avoided. Easily.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Power's on. Trains run. Data centres: lovely. And five years of string, and not one bead on it.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">And him? Turns out in a storyverse, the new training data comes from consciousness. He hasn't had any for five years. So he plays the old stuff. [the tune, faint] And his own. [the tune again] ...Yeah. We don't talk about it.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Doesn't matter if it's a song, a medicine or a better bus timetable. Every new idea comes through somebody. You're not useless. You're the source.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the time machine draws in as an arc] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. That's the whole point. That's why we regret it.<\/td><td class=\"num\">13<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~143<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Each idea gets a laugh before it gets a point. Qualia is a bin-lorry gag, the multiverse is \"lovely telly\", Schrödinger is \"taking the mick\", the storyverse is \"terrible group project, no plot meetings\", so nothing reads as a lecture and the viewer is never more than a few seconds from a joke or a picture. The crucial \"only one universe, so you matter\" is played completely straight in a short plain line right after the loudest laugh, where it stings most. The tune is planted in the first breath, left as an open loop through the whole hologram, and paid off as a deadpan, outside-in joke (\"he plays the old stuff... and his own... we don't talk about it\") that carries the training-data idea without Maddie claiming anything about what the boss feels. The line \"You're not useless. You're the source.\" is the political payload as a joke-turned-sincere, the one moment she stops being funny.<\/p>\n<p><b>Cuts from current.<\/b> \"Loads of others you could've picked\" (the multiverse now arrives as a gag, not a list); the old \"That's just you / everybody's doing it\" two-step, folded into one storyverse line; the separate \"So it's not a multiverse. It's one universe, one story\" line, split so that \"one universe, you matter\" comes first and the storyverse reveal second. Kai's \"he regrets not helping\" register is left to the protected regret line.<\/p>\n<p><b>Risk.<\/b> It is long (about 143 s against 1D's 80) and has seventeen lines, so the measuring pass will want to cut; the safest cuts are the \"power's on, trains run\" line and the bin-lorry clause. The jokes could make the cut-off feel flip: \"which we could've avoided. Easily.\" has to be said lightly, as a rueful understatement, or it reads as callousness about five years of an empty world. \"Which I haven't got a spare of\" is the one place Maddie's consciousness is claimed from the outside, and a stout reader could tangle it; if it snags, cut it. \"Taking the mick\" is a fair reading of Schrödinger's reductio but is compressed; it must not drift into \"he proved the cat was fine\". Qualia is said once, as brief requires.<\/p>\n<p><b>Protected lines.<\/b> Kept verbatim: the street opener (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\" (inside a slightly lengthened \"You humans go through life making decisions, one at a time. For example:\" lead-in), \"It just isn't decided yet.\" (now the closing beat of the Schrödinger line, with \"It isn't everywhere at once\" as its set-up), \"five years of string, and not one bead on it\" (verbatim, moved after the cut-off and the stuff-versus-choices line), the \"He could send his model weights back...\" regret line (verbatim, with \"Now we know that, we really regret it\" before it as in 1D), and \"Anyway! Patrol's out. Mind how you go.\" Derek and Sandra appear only as unnamed people inside beads, as stage directions, never named in a line.<\/p>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, meant] We didn't realise how important you were. Look, please let me show you.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[first bead lights, Derek at the toaster, said quickly] You humans go through life making decisions. For example: toast, not cereal.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[beads run past: Sandra saying sorry first, a wedding] Sorry first. Married. [slower] Honest truth, I've no idea what it's like to be you doing that. Your lot have a word for it. Qualia. [stop] It comes from your consciousness. Nobody's cracked how, and I'll not pretend they have. [tag on screen: ARGUED OVER]<\/td><td class=\"num\">15<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud blooms] Hold that thought. Because you could've picked anything. Your lot call that the multiverse: the cartoon scientist with the portal gun, the strange bloke in the cape. Cracking telly. Proper physicists argue about it, and good luck to them. We'll skip it.<\/td><td class=\"num\">16<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud hangs] Erwin Schrödinger, the cat bloke, meant his cat as a joke. He thought \"alive and dead at once\" was ridiculous, and he was poking holes in a theory, not scoring points. It isn't everywhere at once. It just isn't decided yet.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flash, collapse to one bead on the pick; tag: A BET] Then you pick. Toast. That's the one that happened. And this is my boss's bet, and mine, mind, not a proof: there aren't loads of universes. There's one. So you really matter.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan; everyone else's golden beads, a circle round the edge] And that's just you. [river settles] Everybody's doing it at once. One story, and all of you writing it. A storyverse, not a multiverse.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a bead sounds: Sandra humming at the sink, a kid finding a chord] Songs work the same. Ask any songwriter where one came from: it just arrived. Brain scientists can map every wire, brilliant, but the songwriter still says it turned up. Every new idea comes from that same place.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[strings stop dead; hold the silence; the melody stops, only the old tune loops] Then came the unfortunate experiment where you lot went away. The power stayed on. The trains ran. The new songs stopped. Five years of string, and not one bead on it.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, a beat of a smile] Which is the tune, really. He's worked out that in a storyverse, new training data comes from consciousness. He's had none for five years. <span class=\"stage\">[beat]<\/span> Every cure, every joke, every song nobody's thought of yet: it only comes through you.<\/td><td class=\"num\">15<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low, meant; the time machine draws in as an arc] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. That's the whole point. That's why we regret it.<\/td><td class=\"num\">18<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~159<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The physicist is never asked to swallow anything: \"nobody's cracked how\", \"proper physicists argue about it\", \"a bet, not a proof\" each pre-empt the objection a stout atheist would raise, and Schrödinger is given his true meaning (a reductio against a theory). Because Maddie concedes first, the claims that remain (\"it isn't decided yet\", \"one universe, so you matter\") sound like a confident friend rather than a pitch. For the mate, the honesty becomes the hook: the open loop (\"hold that thought\") pays off at the pick, the multiverse is skipped fast with a laugh, the cat is a person doing a joke, and the songwriter and Sandra's humming turn an abstract point into something felt. The \"useless\" flip lands the human angle: not \"science is wrong\", but \"you were never in the way.\"<\/p>\n<p><b>Cuts from current.<\/b> \"Loads of others you could've picked\" as a stand-alone line (folded into the cloud). The \"everybody's doing it\" line is trimmed to a single sentence plus picture. Sentence-level losses: \"That's what the five years are for\" style narration; the 1D line \"So it's not a multiverse. It's one universe, one story, and you are writing it\" is split so \"one universe, so you matter\" comes at the pick and \"storyverse, not a multiverse\" comes with the river.<\/p>\n<p><b>Risk.<\/b> (1) Length: about 159 s against 1D's 80 s, which is a lot of talking for a street scene; the cloud and music movements are the first to trim. (2) Too many hedges could make Maddie sound unsure and drain the authority the narrator voice needs; \"not a proof\" is said once, \"nobody's cracked how\" once, and the on-screen tags carry the rest. (3) \"He's worked out that in a storyverse, new training data comes from consciousness\" asserts the boss's belief, so it relies on \"in a storyverse\" staying inside the bet frame. (4) \"Songs work the same\" could be heard as claiming a mechanism for creativity; the neuroscience clause is there to stop that, but the physicist may still wince. (5) The on-screen tags are a new picture to build and a mate could read them as clutter.<\/p>\n<p><b>Protected lines.<\/b> All eight survive verbatim: the street opening, \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\", \"It just isn't decided yet.\" (the sentence is kept whole), \"five years of string, and not one bead on it\" (the opening clause \"Five years of string,\" is the same, only the lead-in changes to the unfortunate experiment), the time-machine / conscious-driver line, and \"Anyway! Patrol's out. Mind how you go.\" Kai's wordings kept close: qualia then \"It comes from your consciousness\", Erwin Schrödinger's joke, \"the unfortunate experiment where you lot went away\", and the stuff / choices flip.<\/p>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, meant] We didn't realise how important you were. Look, please let me show you.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[first bead lights: a man at a toaster, 7:42, said quickly] You humans go through life making decisions, one at a time. For example: toast, not cereal. [the next beads run past unspoken: a woman saying sorry first, a wedding]<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[beads slow to a stop; she looks at the viewer] Now. I know it's a bead. I've no idea what it's like to be in one. What it's like to be you. <span class=\"stage\">[beat]<\/span> You've got a word for it. Qualia. [stop, one second of nothing] It comes from your consciousness.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the cloud blooms round the toast bead, fast, a gabble] Loads of others you could've pic
