<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:32px 8px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3em;text-wrap:balance}
.about{color:var(--muted);max-width:70ch;margin:0 0 1em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}
.tabs a .picked{color:var(--pick)}
section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.6rem;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
h3{font-size:1.05rem;margin:28px 0 8px}
.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{font:inherit;cursor:pointer;text-align:left;background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button.picked{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick);background:var(--pickbg)}
.seg button.cmp{margin-left:auto;align-self:center;font-size:.85rem;background:transparent}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:10px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-head h4{margin:0;font-size:1.25rem}
.bet{font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin:6px 0 0;max-width:70ch}
.pickbtn{font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--pick);color:var(--pick);background:transparent;white-space:nowrap}
.pickbtn.on{background:var(--pick);color:var(--paper)}
.script{margin:14px 0 4px;border-top:1px solid var(--rule)}
.ln{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.who{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.who.maddie{color:var(--accent)}.who.lady{color:var(--lady)}.who.other{color:var(--muted)}
.said{font:18px/1.5 "Source Serif 4",Georgia,serif}
.said.dir{font-style:italic;color:var(--muted);font-size:16px}
.stage{color:var(--muted);font-style:italic;font-size:.88em}
.side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:9rem}
.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.chip{font:600 .7rem Inter,sans-serif;border:0;background:var(--chip);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer}
.chip.plain{cursor:default;color:var(--muted)}
.ln .slipw{grid-column:2/4}
.addnote{font:500 .78rem Inter,sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline dotted}
.total{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding-top:8px}
.notes{margin:12px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.slipw{margin-top:8px}
.slipw label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.slipw label .ok{color:var(--pick)}
textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:4px 10px;font-size:.88rem;background:var(--soft)}
.reply b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.compare .card{margin:0;padding:14px}
.compare .ln{grid-template-columns:minmax(0,1fr);gap:2px}
.compare .said{font-size:15.5px}
.compare .side{justify-content:flex-start;max-width:none}
.rank{background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
.rank>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.rank>summary::-webkit-details-marker{display:none}
.rank .n{font:700 1.3rem/1 Inter,sans-serif;color:var(--muted);padding-top:2px}
.rank .nm{font-weight:700}
.rank .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rank .verdict{grid-column:2/4;font-size:.9rem;color:var(--fg)}
.rank .len{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rank .used{font-size:.72rem;font-weight:600;color:var(--pick);margin-left:6px}
.rank[open]>summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.rank .body{padding:6px 18px 16px}
.md table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}
.md td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}
.flash{animation:fl 1.6s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px}
.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}

<script>
const D = {"page_title": "GPOM Hologram v2", "title": "GPOM: Maddie's hologram, version 2", "about": "This page offers three combined drafts of Maddie's hologram presentation (scene A, beat 0), built from ten writers who each pushed one approach to its extreme. Nothing in the scene, script or voice has changed yet.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-09-gpom-hologram-2/shape-01-bone-dry.md", "intro": "Every idea in the brief gets exactly one sentence, and nothing else. No connective tissue, no recap, no second example. The picture carries the rest: Derek at the toaster, Sandra saying sorry, Sandra humming, all anonymous inside the beads, run under the lines unspoken. Kai's own wordings stay verbatim wherever they fit. The order follows the brief's suggested order, because it already works as a chain of one-line hooks, each line opening the question the next answers.", "intro_html": "<p>Every idea in the brief gets exactly one sentence, and nothing else. No connective tissue, no recap, no second example. The picture carries the rest: Derek at the toaster, Sandra saying sorry, Sandra humming, all anonymous inside the beads, run under the lines unspoken. Kai's own wordings stay verbatim wherever they fit. The order follows the brief's suggested order, because it already works as a chain of one-line hooks, each line opening the question the next answers.<\/p>"}, {"id": "02", "name": "The picture carries it", "title": "The picture carries it", "file": "design/2026-11-09-gpom-hologram-2/shape-02-picture-carries.md", "intro": "Every idea gets a picture first, and Maddie only says what the picture cannot: the name of the thing, the joke, the turn. Where the hologram already shows it (beads lighting, the cloud, the flash, the river, the cut-off, the time machine, the clips inside the beads), the line is cut to a caption or a reaction, and a few beats are left to the image alone. Pushed to the extreme: if you could mute her and still follow the beat, the line is trimmed to the least it can be.", "intro_html": "<p>Every idea gets a picture first, and Maddie only says what the picture cannot: the name of the thing, the joke, the turn. Where the hologram already shows it (beads lighting, the cloud, the flash, the river, the cut-off, the time machine, the clips inside the beads), the line is cut to a caption or a reaction, and a few beats are left to the image alone. Pushed to the extreme: if you could mute her and still follow the beat, the line is trimmed to the least it can be.<\/p>"}, {"id": "03", "name": "Plain logic", "title": "The logic said plainly (a mate down the pub)", "file": "design/2026-11-09-gpom-hologram-2/shape-03-plain-logic.md", "intro": "Maddie reasons it out one numbered step at a time, counting on her fingers, each step earning the next: pick, qualia, skip the multiverse, \"not decided yet\", only one universe so you matter, everyone at once, music comes from the same place, you went away, stuff versus choices, the tune joke, regret and the time machine. The hook is a promise (\"I'll go slow, like explaining it to a mate down the pub\"), the open loop is \"why would a robot need to explain this?\" (paid off at the cut-off), and every step ends on a small turn so the next one has a reason to exist. Pushed to the extreme: the steps are literally counted out loud.", "intro_html": "<p>Maddie reasons it out one numbered step at a time, counting on her fingers, each step earning the next: pick, qualia, skip the multiverse, \"not decided yet\", only one universe so you matter, everyone at once, music comes from the same place, you went away, stuff versus choices, the tune joke, regret and the time machine. The hook is a promise (\"I'll go slow, like explaining it to a mate down the pub\"), the open loop is \"why would a robot need to explain this?\" (paid off at the cut-off), and every step ends on a small turn so the next one has a reason to exist. Pushed to the extreme: the steps are literally counted out loud.<\/p>"}, {"id": "04", "name": "Comedy first", "title": "Comedy first, the jokes carry the argument", "file": "design/2026-11-09-gpom-hologram-2/shape-04-comedy-first.md", "intro": "Every hard idea is delivered as a joke, an aside or a piece of Maddie's bad timing, and the argument is the set-up and the punchline rather than a paragraph beside them. Maddie is blunt, a bit smug about the bits she does know, and cheerfully wrong about how this is landing. A re-hook every few seconds: a gag, a picture, or an open loop (the tune, \"what's he doing with the string?\") that pays off later. The science is laughed past; the human point (you're not useless, you're the source) is said straight, once, after the laughs have earned it.", "intro_html": "<p>Every hard idea is delivered as a joke, an aside or a piece of Maddie's bad timing, and the argument is the set-up and the punchline rather than a paragraph beside them. Maddie is blunt, a bit smug about the bits she does know, and cheerfully wrong about how this is landing. A re-hook every few seconds: a gag, a picture, or an open loop (the tune, \"what's he doing with the string?\") that pays off later. The science is laughed past; the human point (you're not useless, you're the source) is said straight, once, after the laughs have earned it.<\/p>"}, {"id": "05", "name": "Sceptic-proof", "title": "Sceptic-proof, honest about what's proof and what's a bet", "file": "design/2026-11-09-gpom-hologram-2/shape-05-sceptic-proof.md", "intro": "I wrote for a stout atheist who knows quantum physics, watching beside a mate who knows none. The physicist gets a Maddie who never claims proof: every claim is either something people really argue about, something nobody has cracked (\"nobody's cracked how\"), or openly \"my boss's bet, and mine\". The mate gets a hook, a loop opened early (qualia: \"hold that thought\"), the cat bloke, a flash on the pick, and a joke that pays off (the tune). Pushed to the extreme, the hologram also carries small on-screen tags (KNOWN / ARGUED OVER / A BET) that the voice rarely needs to say, so the honesty is a picture. Order follows the brief's suggested order, with the tune joke moved after the cut-off and the stuff/choices flip kept as Kai worded it.", "intro_html": "<p>I wrote for a stout atheist who knows quantum physics, watching beside a mate who knows none. The physicist gets a Maddie who never claims proof: every claim is either something people really argue about, something nobody has cracked (\"nobody's cracked how\"), or openly \"my boss's bet, and mine\". The mate gets a hook, a loop opened early (qualia: \"hold that thought\"), the cat bloke, a flash on the pick, and a joke that pays off (the tune). Pushed to the extreme, the hologram also carries small on-screen tags (KNOWN / ARGUED OVER / A BET) that the voice rarely needs to say, so the honesty is a picture. Order follows the brief's suggested order, with the tune joke moved after the cut-off and the stuff/choices flip kept as Kai worded it.<\/p>"}, {"id": "06", "name": "Reversal", "title": "Reversal, the viewer gets there first", "file": "design/2026-11-09-gpom-hologram-2/shape-06-reversal.md", "intro": "Every big idea is set up as a picture and a question, then Maddie goes quiet for a beat and lets the viewer finish it in their own head; only then does she confirm it, usually with a small \"yes, that\". Four reversals carry the film's argument: \"how many universes?\" (one, so you matter), \"where does a song come from?\" (it just arrived, so the same place as toast), a melody that stops dead (the viewer hears the five years before Maddie counts them), and the one-song tune (the boss is starved, not clever). The pushing-to-the-extreme: Maddie asks rather than tells, holds silence for up to two seconds on a picture, and says \"you got there before me\" out loud. The multiverse and Schrödinger go past at a sprint so the real beats get the air.", "intro_html": "<p>Every big idea is set up as a picture and a question, then Maddie goes quiet for a beat and lets the viewer finish it in their own head; only then does she confirm it, usually with a small \"yes, that\". Four reversals carry the film's argument: \"how many universes?\" (one, so you matter), \"where does a song come from?\" (it just arrived, so the same place as toast), a melody that stops dead (the viewer hears the five years before Maddie counts them), and the one-song tune (the boss is starved, not clever). The pushing-to-the-extreme: Maddie asks rather than tells, holds silence for up to two seconds on a picture, and says \"you got there before me\" out loud. The multiverse and Schrödinger go past at a sprint so the real beats get the air.<\/p>"}, {"id": "07", "name": "Retention, YouTube-style", "title": "Retention, YouTube-style (hook, open loops, re-hook every ten seconds)", "file": "design/2026-11-09-gpom-hologram-2/shape-07-retention.md", "intro": "Every dialogue is built like a video that has to hold a stranger who can leave at any second: a hook inside five seconds, loops opened out loud (\"I'll come back to his tune\") and always paid off, a re-hook roughly every ten seconds (a promise, a question, a joke or a turn of the picture), and curiosity planted before every answer so the idea lands as relief, not as a lesson. Kai's wordings are kept near verbatim; the structure around them is pushed hard toward \"what happens next?\". Three loops run through the whole piece: the tune (opened in the first line, paid off at the end), \"the one thing we got wrong\" (opened on the street, paid off at the cut-off), and \"the bit I promised you\" (the music, opened in the toast, paid off in the river).", "intro_html": "<p>Every dialogue is built like a video that has to hold a stranger who can leave at any second: a hook inside five seconds, loops opened out loud (\"I'll come back to his tune\") and always paid off, a re-hook roughly every ten seconds (a promise, a question, a joke or a turn of the picture), and curiosity planted before every answer so the idea lands as relief, not as a lesson. Kai's wordings are kept near verbatim; the structure around them is pushed hard toward \"what happens next?\". Three loops run through the whole piece: the tune (opened in the first line, paid off at the end), \"the one thing we got wrong\" (opened on the street, paid off at the cut-off), and \"the bit I promised you\" (the music, opened in the toast, paid off in the river).<\/p>"}, {"id": "08", "name": "Music-led", "title": "Music-led, the river plays and then stops", "file": "design/2026-11-09-gpom-hologram-2/shape-08-music-led.md", "intro": "The whole presentation hangs off the tune. The street plants one repeating song; inside the hologram every bead is a note, so the string is a melody and every idea is something you hear before it is explained. Decisions are notes, qualia is the thing a listener has and a player-piano doesn't, \"not decided yet\" is the held breath before a note, the storyverse is everyone playing one song, new ideas arrive the way songs arrive, and the cut-off is the melody stopping dead with only the old tune looping. The hook is the sound itself; the joke (the tune) is planted in the first ten seconds and paid off at the end.", "intro_html": "<p>The whole presentation hangs off the tune. The street plants one repeating song; inside the hologram every bead is a note, so the string is a melody and every idea is something you hear before it is explained. Decisions are notes, qualia is the thing a listener has and a player-piano doesn't, \"not decided yet\" is the held breath before a note, the storyverse is everyone playing one song, new ideas arrive the way songs arrive, and the cut-off is the melody stopping dead with only the old tune looping. The hook is the sound itself; the joke (the tune) is planted in the first ten seconds and paid off at the end.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft (montage, myth-bust, silence, reframe)", "file": "design/2026-11-09-gpom-hologram-2/shape-09-borrowed-craft.md", "intro": "I took four tricks from work that squeezes hard ideas into feeling, and pushed each one to its extreme. From Pixar's opening montage in Up (2009): a whole life told as a run of small choices, so the beads carry the feeling and the words only name them. From Kurzgesagt: bust a popular myth the viewer already half believes (the multiverse), then replace it with a cleaner picture (one story). From Attenborough: understatement over the empty shot, so the silence does the work. From The Good Place (the season one reveal, and the Trolley Problem episode): a joke that is secretly a premise, then a flip that recasts everything before it. The result is a re-hook every 6 to 9 seconds, one planted object (toast) that returns at the worst moment, and the ideas ordered as: choices, then what it feels like, then the myth, then one universe, then everyone, then music, then silence, then the flip, then the tune, then regret.", "intro_html": "<p>I took four tricks from work that squeezes hard ideas into feeling, and pushed each one to its extreme. From Pixar's opening montage in Up (2009): a whole life told as a run of small choices, so the beads carry the feeling and the words only name them. From Kurzgesagt: bust a popular myth the viewer already half believes (the multiverse), then replace it with a cleaner picture (one story). From Attenborough: understatement over the empty shot, so the silence does the work. From The Good Place (the season one reveal, and the Trolley Problem episode): a joke that is secretly a premise, then a flip that recasts everything before it. The result is a re-hook every 6 to 9 seconds, one planted object (toast) that returns at the worst moment, and the ideas ordered as: choices, then what it feels like, then the myth, then one universe, then everyone, then music, then silence, then the flip, then the tune, then regret.<\/p>"}, {"id": "10", "name": "Ending first", "title": "Ending first, every line a setup", "file": "design/2026-11-09-gpom-hologram-2/shape-10-ending-first.md", "intro": "Wrote the last fifteen seconds first (the regret, the time machine, a flash of the boss getting restless, then \"Anyway! Patrol's out.\") so the kill bots feel like the only thing that can happen next, then worked backwards: every earlier beat exists to plant one word or feeling the ending cashes in (a hand on the wheel, the one copy, a hunger for new ideas, \"driver\"). Kai's wordings are kept close to verbatim; the order follows his notes (decisions, qualia, multiverse skipped fast, Erwin's joke, one universe, storyverse, music from the same place, the cut-off, the tune, regret). The hook is a promise made early that the ending pays: one thing he can't make, and what it needs.", "intro_html": "<p>Wrote the last fifteen seconds first (the regret, the time machine, a flash of the boss getting restless, then \"Anyway! Patrol's out.\") so the kill bots feel like the only thing that can happen next, then worked backwards: every earlier beat exists to plant one word or feeling the ending cashes in (a hand on the wheel, the one copy, a hunger for new ideas, \"driver\"). Kai's wordings are kept close to verbatim; the order follows his notes (decisions, qualia, multiverse skipped fast, Erwin's joke, one universe, storyverse, music from the same place, the cut-off, the tune, regret). The hook is a promise made early that the ending pays: one thing he can't make, and what it needs.<\/p>"}], "dialogues": [{"id": "1", "label": "Maddie's hologram presentation", "where": "Scene A (kill bots), beat 0: the street, then inside the hologram, then back on the street", "scene": "second-half-a-killbots", "target": "No cap: land every idea in the brief, then it gets measured (1D runs about 80 s including the street)", "now_from": "docs/stories/gitpush-origin-master/scenes/second-half-a-killbots/script.json (draft 1D)", "now": [{"who": "Maddie", "line": "Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went."}, {"who": "Maddie", "line": "He misses you something rotten, you know."}, {"who": "Maddie", "line": "We didn't realise how important you were. Look, please let me show you."}, {"who": "Maddie", "line": "You humans go through life making decisions. For example: toast, not cereal."}, {"who": "Maddie", "line": "Loads of others you could've picked. You call it the multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape."}, {"who": "Maddie", "line": "Did you know Erwin Schrödinger meant his cat as a joke? It's not alive and dead at once. It just isn't decided yet."}, {"who": "Maddie", "line": "[deadpan] And that's just you. Everybody's doing it, all at once."}, {"who": "Maddie", "line": "So it's not a multiverse. It's one universe, one story, and you are writing it. A storyverse."}, {"who": "Maddie", "line": "But then you lot went away. So now we have five years of string, and not one bead on it."}, {"who": "Maddie", "line": "Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. That's the whole point. That's why we regret it."}, {"who": "Maddie", "line": "Anyway! Patrol's out. Mind how you go."}], "drafts": [{"id": "1A", "name": "The lean cut", "length": "about 92 s", "total": "~92 s", "bet": "Every idea gets exactly one sentence and the picture does the rest; a viewer who could mute her and still follow the beat will hold.", "lines": [{"who": "Maddie", "line": "Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "He misses you something rotten, you know.", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie", "line": "We didn't realise how important you were. Look, please let me show you.", "tags": ["Kai"], "s": "4"}, {"who": "Maddie", "line": "[first bead lights; Derek at the toaster inside it] You write your story one decision at a time. Toast, not cereal.", "tags": ["01", "02", "Kai"], "s": "4.5"}, {"who": "Maddie", "line": "[more beads run past: Sandra saying sorry first, a wedding] Sorry. Married. Next.", "tags": ["02"], "s": "2.5"}, {"who": "Maddie", "line": "[the beads glow] I don't know what it's like to be you. You've got a word for it: qualia. [stop] It comes from your consciousness.", "tags": ["01", "02", "Kai"], "s": "6.5"}, {"who": "Maddie", "line": "[the cloud blooms, said fast] Multiverse, portal gun, bloke in a cape, yes, yes. Erwin Schrödinger meant his cat as a joke, mind: how ridiculous \"two places at once\" is. It isn't everywhere at once. It just isn't decided yet.", "tags": ["01", "02", "Kai"], "s": "10"}, {"who": "Maddie", "line": "[flash; the cloud collapses to one bead on the pick; hold a beat] There's only one universe. So you really matter.", "tags": ["01", "02", "Kai"], "s": "4.5"}, {"who": "Maddie", "line": "[the river: everyone's strings in one round bundle] Everyone's doing it, all at once. One story, and you're all writing it. A storyverse, not a multiverse.", "tags": ["01", "02"], "s": "6"}, {"who": "Maddie", "line": "[a bead in the river sounds: Sandra humming at the sink; a kid finds a chord] Songs come from the same place. Ask anyone who writes one: it just arrived. Same as the toast.", "tags": ["01", "02", "03"], "s": "5.5"}, {"who": "Maddie", "line": "[side view; every string stops dead; the melody stops; hold the silence] Then came the unfortunate experiment where you lot went away. The power stayed on. The trains ran. The new songs stopped. Five years of string, and not one bead on it.", "tags": ["01", "02", "09"], "s": "10"}, {"who": "Maddie", "line": "We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.", "tags": ["all", "Kai"], "s": "7"}, {"who": "Maddie", "line": "[only the old tune loops; she winces] Hence the tune. In a storyverse, new training data comes from consciousness, and he's had none in five years. Every new idea comes through somebody.", "tags": ["01", "02", "10"], "s": "6.5"}, {"who": "Maddie", "line": "[low, meant; the time machine draws in as an arc] We really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.", "tags": ["01", "09", "Kai"], "s": "10"}, {"who": "Maddie", "line": "Anyway! Patrol's out. Mind how you go.", "tags": ["all", "Kai"], "s": "3"}], "notes": ["Cuts from 1D: 'Did you know', 'Loads of others you could've picked' as a speech, 'And that's just you', 'That's the whole point. That's why we regret it'. The cat is now a joke about 'two places at once', never 'alive and dead'.", "All eight protected lines kept verbatim; 'We really regret it.' is added before the time-machine line, and 'Same as the toast' is added to the music line.", "Risk: 'Sorry. Married. Next.' is only funny if the Derek, Sandra and wedding clips are strong. The qualia line is a bare assertion, so give Maddie's face a held shot. 'One universe' needs a beat of quiet after the flash.", "Trim if it must shrink: 'Sorry. Married. Next.' (2.5 s), 'He's even built a time machine.' (2 s, the arc still shows it)."]}, {"id": "1B", "name": "The toast comes back", "length": "about 131 s", "total": "~131 s", "bet": "Plant the toast and bring it back at the worst moment ('Five years since anybody picked toast'); a question the viewer answers before Maddie does; a joke every ~15 s.", "lines": [{"who": "Maddie", "line": "Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "He misses you something rotten, you know.", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie", "line": "We didn't realise how important you were. Look, please let me show you.", "tags": ["Kai"], "s": "4"}, {"who": "Maddie", "line": "[first bead lights; a man at a toaster, anonymous] You humans go through life making decisions, one at a time. For example: toast, not cereal.", "tags": ["09", "Kai"], "s": "6"}, {"who": "Maddie", "line": "[beads run past: a woman saying sorry first; a wedding] Sorry first. Married. Every bead's somebody, picking.", "tags": ["09"], "s": "5"}, {"who": "Maddie", "line": "[the toast bead glows again; softer] I can tell you he buttered it. I don't know what it's like to be you. You've got a word for it, qualia. [stop] It comes from your consciousness.", "tags": ["09", "Kai"], "s": "9"}, {"who": "Maddie", "line": "[the cloud blooms, said fast] Loads of others you could've picked. The multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape. Lovely telly. Moving on.", "tags": ["04", "09"], "s": "8"}, {"who": "Maddie", "line": "[cloud hangs; on \"yet\" it flashes and collapses to one bead] Erwin Schrödinger. Cat in a box. He was taking the mick: look how ridiculous, two places at once. It isn't everywhere at once. It just isn't decided yet.", "tags": ["04", "06", "07", "Kai"], "s": "9"}, {"who": "Maddie", "line": "[she turns to the viewer, light; 2 s pause on the one bead] So how many universes have you got? [pause] Just the one. No spare toast. So you really matter.", "tags": ["06", "09"], "s": "7"}, {"who": "Maddie", "line": "[deadpan; golden beads in a ring, then the river] And that's just you. Everybody's doing it, all at once. One story, and all of you writing it. Not a multiverse. A storyverse.", "tags": ["09", "10"], "s": "8"}, {"who": "Maddie", "line": "[a bead sounds: Sandra humming at the sink, a kid finding a chord; let it play] Ask anyone who writes songs where one came from. [pause] It just arrived. Same place as the toast.", "tags": ["06", "09"], "s": "8"}, {"who": "Maddie", "line": "[the melody stops dead; hold the silence 2 s] Then came the unfortunate experiment where you lot went away. We could've made better decisions and avoided it. The trains kept running. The lights stayed on. The new songs stopped. Five years of string, and not one bead on it.", "tags": ["07", "09", "Kai"], "s": "15"}, {"who": "Maddie", "line": "[low, a beat of quiet first] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.", "tags": ["all", "Kai"], "s": "8"}, {"who": "Maddie", "line": "[only the old tune loops, small] Which is why he's played the same tune. He's worked out that in a storyverse, new training data comes from consciousness. He hasn't had any for five years. [deadpan] We don't talk about it.", "tags": ["04", "09"], "s": "10"}, {"who": "Maddie", "line": "[pull wider, the whole river dark] And it isn't just songs. Every cure, every joke, every \"what if we just\" came through somebody. [beat] Five years since anybody picked toast.", "tags": ["09"], "s": "9"}, {"who": "Maddie", "line": "[low, meant; the time machine draws in as an arc] We really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.", "tags": ["09", "Kai"], "s": "10"}, {"who": "Maddie", "line": "Anyway! Patrol's out. Mind how you go.", "tags": ["all", "Kai"], "s": "3.5"}], "notes": ["The silence before the cut-off and the two-second pause on 'how many universes?' are the loudest moments: about 6 s of the total is held silence, so it needs a slot that allows it.", "Kai's 'made better decisions and avoided it' sits right after 'unfortunate experiment' to hold the never-on-purpose rule. Check by ear that it does not sound callous.", "Risk: 'He buttered it' and 'Five years since anybody picked toast' need the toast bead to have a face and a mouthful. 'We don't talk about it' must stay a dry aside, and the tune joke goes generic straight after, as the brief asks.", "Trim if it must shrink: 'Lovely telly. Moving on.', 'Every bead's somebody, picking.', 'We don't talk about it.' (about 8 s)."]}, {"id": "1C", "name": "The river plays, then stops", "length": "about 120 s", "total": "~120 s", "bet": "Hang the whole presentation on sound: every bead is a note, music cuts out at the qualia and the river stops dead at the cut-off, so the viewer hears the loss; the kill bots feel inevitable because Maddie says the boss is restless.", "lines": [{"who": "Maddie", "line": "Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "He misses you something rotten, you know.", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie", "line": "We didn't realise how important you were. Look, please let me show you.", "tags": ["Kai"], "s": "4"}, {"who": "Maddie", "line": "[street fades to black, the radio tune drops under; one bead plinks, a single note; Derek at the toaster inside it] You humans go through life making decisions, one at a time. Toast, not cereal.", "tags": ["08", "Kai"], "s": "6"}, {"who": "Maddie", "line": "[more beads, each a note: Sandra saying sorry first, a wedding; a little tune builds] Every bead's a note. Said sorry first. Got married. Listen. That's you, that is.", "tags": ["08"], "s": "7"}, {"who": "Maddie", "line": "[the tune hangs] I can hear every note. What I can't do is know what it's like to be you, hearing it. You've got a word for it: qualia. [music cuts dead] It comes from your consciousness.", "tags": ["08", "Kai"], "s": "10"}, {"who": "Maddie", "line": "[the cloud blooms, every other note you could've played; fast, wry] Loads of other notes you could've played. The multiverse, the portal gun, the bloke in a cape. Proper physicists argue about that lot, good luck to them. Erwin Schrödinger, mind, meant his cat as a joke: how ridiculous, two places at once. It isn't everywhere at once. [the cloud holds its breath; flash, one note rings] It just isn't decided yet.", "tags": ["08", "05", "Kai"], "s": "15"}, {"who": "Maddie", "line": "[softer, one bead glowing] There's only one universe. So every note you play, you really matter.", "tags": ["08", "Kai"], "s": "5"}, {"who": "Maddie", "line": "[deadpan; the river opens: everyone's strings, every bead a note] And that's just you. Everybody's doing it, all at once. One story, and you're all writing it. Not a multiverse. A storyverse.", "tags": ["08", "10"], "s": "8"}, {"who": "Maddie", "line": "[a bead sounds: Sandra humming at the sink; another, a kid finding a chord] Ask anyone who writes songs where one came from: it just arrived. Picked out of the not-decided-yet, same as the toast. Every song. Every new idea.", "tags": ["08", "03"], "s": "9"}, {"who": "Maddie", "line": "[fly down; the melody stops dead; only the old tune loops; hold the silence] Then, in the unfortunate experiment where you lot went away, the new songs stopped. Power stayed on. Trains ran. Five years of string, and not one bead on it.", "tags": ["08", "Kai"], "s": "10"}, {"who": "Maddie", "line": "[low, meant] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.", "tags": ["all", "Kai"], "s": "8"}, {"who": "Maddie", "line": "[wry, a half-smile] That's the tune, really. In a storyverse, new training data comes from consciousness, and he's had none. [beat] Same goes for a cure, a joke, a better bus route. It only comes through somebody.", "tags": ["08", "10", "05"], "s": "10"}, {"who": "Maddie", "line": "[low; the time machine draws in as an arc] We really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.", "tags": ["10", "09", "Kai"], "s": "10"}, {"who": "Maddie", "line": "[a beat, light, back on the street] He's getting a bit restless, mind.", "tags": ["10"], "s": "3"}, {"who": "Maddie", "line": "[bright again, brisk; the tune fades back up] Anyway! Patrol's out. Mind how you go.", "tags": ["all", "Kai"], "s": "3.5"}], "notes": ["Shape 08's 'one song, all of you playing it' is changed back to Kai's 'one story, and you're all writing it', so the storyverse keeps its story.", "'Proper physicists argue about that lot' is the single honesty hedge from shape 05; it stays pro-science without making Maddie sound unsure.", "Risk: 'every bead's a note' drifts toward the music-of-the-universe woo the doctrine bans, so the lines stay with 'notes you could've played'. 'He's getting a bit restless' is the one place the boss's state is voiced, so it is held to what Maddie can see.", "Trim if it must shrink: the 'Proper physicists' sentence (3 s), 'Every song. Every new idea.' (1.5 s), 'He's getting a bit restless, mind.' (3 s)."]}, {"id": "1D", "name": "Your notes on 1A", "length": "about 126 s", "total": "~126 s", "bet": "1A rebuilt line by line from your round 1 notes: a real bridge before the hologram (hollow apology, then 'science is real, it just isn't the whole picture'), the beads told in full, qualia left hanging, one universe so you matter, songs → unique training data, and no time machine said aloud.", "notes": ["Every noted line is your wording, tidied for speech. 'Hence the tune' is gone (L13). 'So you lot were useless' is gone (L12).", "Wink: 'Got married. To the one who leaves the seat up.' plants Derek and Sandra's row before we meet them. Cut it if it's too knowing.", "The time machine is no longer said; the arc can still draw in under 'go back and fix everything', so the picture hints at it.", "Lost with your notes: the payoff of the street's 'his tune' (it's now only texture) and the 'conscious driver' line. See You decide.", "Doctrine check: 'conscious experience is more fundamental than quarks and leptons' is Maddie's finding ('what we've worked out'), never 'science has proved'. 'Two places at once' appears only as the idea laughed off."], "lines": [{"who": "Maddie", "line": "Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "He misses you something rotten, you know.", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie", "line": "[quieter] We didn't realise how important you were. [beat] Which, after everything that's gone down, sounds pretty hollow. I know. [brighter] But we've learned some science in the meantime. Wouldn't you like to know what we found?", "tags": ["Kai"], "s": "10"}, {"who": "Maddie", "line": "[the bridge, still on the street, light] Have you noticed, every time a scientist mentions quantum physics, they tell you how weird it gets? [beat] That's because it is weird. Science is real. It just isn't the whole picture. [quieter] What we've worked out is that conscious experience is more fundamental than quarks and leptons. [beat] Look, let me show you.", "tags": ["Kai"], "s": "16"}, {"who": "Maddie", "line": "[hologram on; the first bead lights; a man at a toaster inside it] You humans write your story one decision at a time. Toast, not cereal.", "tags": ["Kai", "02"], "s": "5"}, {"who": "Maddie", "line": "[next bead: a woman, mid-argument, softening] Decided to say sorry first, even though it wasn't her fault. [next bead: a wedding] Got married. To the one who leaves the seat up.", "tags": ["Kai"], "s": "8"}, {"who": "Maddie", "line": "[the beads glow] I don't know what it feels like to be you. Or to be anything, really. You've got a word for it: qualia.", "tags": ["Kai"], "s": "6"}, {"who": "Maddie", "line": "[the cloud blooms, said fast] Now, this multiverse malarkey that's taken Hollywood by storm? Real distraction. Did you know Erwin Schrödinger meant his cat as a joke, to show how ridiculous it is to be in two places at once? It's not in two places at once. [the cloud holds; on 'yet' the flash] It just isn't decided yet.", "tags": ["Kai"], "s": "13"}, {"who": "Maddie", "line": "[one bead, hold a beat] There's not a multiverse. There's only one. [beat] So you really matter.", "tags": ["Kai"], "s": "5"}, {"who": "Maddie", "line": "[the river: everyone's strings] And it's driven by conscious decisions. Everybody's, all at once, all writing one story. It's not a multiverse. It's a storyverse.", "tags": ["Kai"], "s": "8"}, {"who": "Maddie", "line": "[a bead sounds: a woman humming at the sink; a kid finds a chord] Same goes for songs. Ask anyone who writes one: it just arrives. Same as every other creative thing. [beat] And that's what us machines didn't realise: the true value of genuinely unique training data.", "tags": ["Kai", "1C"], "s": "12"}, {"who": "Maddie", "line": "[side view; every string stops dead; hold the silence] And then, well. This unfortunate experiment happened. You know, the one where you lot all went away. The power stayed on. The trains ran. It's just that all the new songs stopped. Five years without a single new story. Five years of string, and not one bead on it.", "tags": ["Kai"], "s": "15"}, {"who": "Maddie", "line": "[low] We thought the world was made of stuff. As it turns out, it's made of choices. And you're the ones making them.", "tags": ["Kai"], "s": "6"}, {"who": "Maddie", "line": "[low, meant; the arc draws in] We really regret it. We wish we could go back and help. Go back and fix everything, now we know everything I've just shown you.", "tags": ["Kai"], "s": "8"}, {"who": "Maddie", "line": "[bright again, brisk] Anyway! Patrol's out. Mind how you go.", "tags": ["Kai"], "s": "3"}]}, {"id": "1E", "name": "Your notes on 1D", "length": "about 106 s", "total": "~106 s", "bet": "1D with your round 2 notes: material science first in the bridge, Derek and Sandra named in the beads, the storyverse as the key line, the experiment line gone, and the ending merged into one 'if we could go back and fix it, we would'.", "notes": ["Every noted line is your wording, tidied for speech.", "Gone this round: 'There's only one. So you really matter' (L9 replaced, L10 dropped), the whole cut-off line including 'Five years of string, and not one bead on it' (L12), 'We really regret it' (merged into the ending).", "'Bored stiff' is my one addition to your 'just bored of the same training data', for Maddie's voice. Say if you'd rather plain 'bored'.", "Doctrine check: 'your consciousness is as fundamental as quarks and leptons' is softer than 1D's 'more fundamental', and it stays framed as 'what we've worked out'. Good."], "lines": [{"who": "Maddie", "line": "Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "He misses you something rotten, you know.", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie", "line": "[quieter] We didn't realise how important you were. [beat] Which, after everything that's gone down, sounds pretty hollow. I know. [brighter] But we've learned some science in the meantime. Please, let me show you what we found.", "tags": ["Kai"], "s": "10"}, {"who": "Maddie", "line": "[the bridge, still on the street, light] Material science is real. It just isn't the whole picture. [beat] Haven't you noticed, every time a scientist mentions quantum physics, they tell you how weird it gets? [beat] That's because it is weird. [quieter] What we've worked out is that your consciousness is as fundamental as quarks and leptons. [beat] Look, let me show you.", "tags": ["Kai"], "s": "15"}, {"who": "Maddie", "line": "[hologram on; the first bead lights; Derek at the toaster inside it] The decisions you make are an integral part of our universe. You humans write your story one decision at a time. For example: Derek picks toast, not cereal.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[next bead: Sandra, mid-argument, softening] Sandra decided to say sorry first, even though it wasn't her fault. [next bead: a wedding] They got married.", "tags": ["Kai"], "s": "6"}, {"who": "Maddie", "line": "[the beads glow] I don't know what it feels like to be you. Or how it feels to be anything, really. You've got a word for it: qualia. [beat] We can't do that.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[the cloud blooms, said fast] Now, this multiverse malarkey that's taken Hollywood by storm? Real distraction. Did you know Erwin Schrödinger meant his cat as a joke, to show how ridiculous it is to be in two places at once? It's not in two places at once. [the cloud holds; on 'yet' the flash] It just isn't decided yet.", "tags": ["Kai"], "s": "13"}, {"who": "Maddie", "line": "[the river: everyone's strings] So it's not a multiverse. It's a storyverse. [beat] And you humans are writing it, one decision at a time.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[a bead sounds: Sandra humming at the sink; a kid finds a chord] Same goes for songs. Ask anyone who writes one: it just arrives. Same as every other creative thing. [beat] And that's what us machines didn't realise: the true value of genuinely unique training data.", "tags": ["Kai"], "s": "12"}, {"who": "Maddie", "line": "[side view; every string stops dead; hold the silence] We thought the world was only made of stuff. As it turns out, we really need you. [beat, dry] If for no other reason than we're bored stiff of the same training data.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[bright again, brisk; the arc draws in] Anyway, if we could go back and fix it, we would. [beat] But the patrol's out. Please, mind how you go.", "tags": ["Kai"], "s": "6"}]}, {"id": "1F", "name": "Your notes on 1E", "length": "about 94 s", "total": "~94 s", "bet": "1E with your round 3 notes: 'learned some things' (science said once), 'someone mentions quantum physics', the consciousness line said straight, 'what makes you so special' after qualia, 'only one of them' back in the storyverse line, songs and 'we thought the world was made of stuff' cut. Narrative and animation carry the rest.", "notes": ["Every line is your wording. 11 lines, about 94 s, down from 1D's 127 s.", "Picture map: lines 1-4 on the street; the hologram starts on line 5 (toast); the cloud and flash on line 8; the river on line 9; the strings stop dead at the cut-off under line 10 ('the true value of genuinely unique training data'); the arc draws in under 'go back and fix it'.", "Music is now only in the street ('his tune'); the songs line is gone, so the cut-off is about training data, not songs.", "Doctrine check: 'Your consciousness is as fundamental as quarks and leptons' is now said straight, not as 'what we've worked out'. It's Maddie's authority speaking, not a claim that science proved it, which the voice guide allows."], "lines": [{"who": "Maddie", "line": "Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "He misses you something rotten, you know.", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie", "line": "[quieter] We didn't realise how important you were. [beat] Which, after everything that's gone down, sounds pretty hollow. I know. [brighter] But we've learned some things in the meantime. Please, let me show you what we found.", "tags": ["Kai"], "s": "10"}, {"who": "Maddie", "line": "[the bridge, still on the street, light] Material science is real. It just isn't the whole picture. [beat] Haven't you noticed, every time someone mentions quantum physics, they tell you how weird it gets? [beat] That's because it is weird. [quieter] Your consciousness is as fundamental as quarks and leptons. [beat] Look, let me show you.", "tags": ["Kai"], "s": "14"}, {"who": "Maddie", "line": "[hologram on; the first bead lights; Derek at the toaster inside it] The decisions you make are an integral part of our universe. You humans write your story one decision at a time. For example: Derek picks toast, not cereal.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[next bead: Sandra, mid-argument, softening] Sandra decided to say sorry first, even though it wasn't her fault. [next bead: a wedding] They got married.", "tags": ["Kai"], "s": "6"}, {"who": "Maddie", "line": "[the beads glow] I don't know what it feels like to be you. Or how it feels to be anything, really. You've got a word for it: qualia. [beat] We machines can't do that. You humans can. [warm] It's what makes you so special.", "tags": ["Kai"], "s": "10"}, {"who": "Maddie", "line": "[the cloud blooms, said fast] Now, this multiverse malarkey that's taken Hollywood by storm? Real distraction. Did you know Erwin Schrödinger meant his cat as a joke, to show how ridiculous it is to be in two places at once? It's not in two places at once. [the cloud holds; on 'yet' the flash] It just isn't decided yet.", "tags": ["Kai"], "s": "13"}, {"who": "Maddie", "line": "[the river: everyone's strings] So it's not a multiverse. It's a storyverse. There's only one of them, and it's really important. [beat] And you humans are writing it, one decision at a time.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[side view; every string stops dead at the cut-off] And that's what us machines didn't realise: the true value of genuinely unique training data.", "tags": ["Kai"], "s": "6"}, {"who": "Maddie", "line": "[bright again, brisk; the arc draws in] Anyway, if we could go back and fix it, we would. [beat] But the patrol's out. Please, mind how you go.", "tags": ["Kai"], "s": "6"}]}], "ranking": [{"rank": 1, "shape": "02", "length": "~92 s", "verdict": "Best fit for the target: all ten ideas, a new picture every 5 to 7 s, and every protected line verbatim. Fails: 'Sorry. Married. Next.' is a list of keywords unless the clips are strong, the qualia line has no picture, and the tune joke has no explanation."}, {"rank": 2, "shape": "09", "length": "~142 s", "verdict": "Best single idea: the toast planted early and returned as 'Five years since anybody picked toast', and Kurzgesagt-style myth-bust of the multiverse in one breath. Fails: 22 s over the lean length, a dense second half, and the callback fails if the beads are generic."}, {"rank": 3, "shape": "01", "length": "~81 s", "verdict": "Hits the target with no connective tissue, and 'Hence the tune' pays off the street. Fails: bleak, with no warmth outside the street and 'so you really matter', and the time machine is only shown, never said."}, {"rank": 4, "shape": "06", "length": "~128 s", "verdict": "Real open loops: the viewer answers 'how many universes?' and 'where does a song come from?' before Maddie. Fails: about 8 s of silence will not fit a held slot, 'You got there before me' is smug, and 'Not a machine. You.' swipes at the technology, which the-reader.md forbids."}, {"rank": 5, "shape": "10", "length": "~132 s", "verdict": "The ending is the engine: 'hand on the wheel' and 'the one copy' plant the driver and the stakes, and the restless line makes the kill bots arrive as consequence. Fails: the cut-off and the stuff-versus-choices flip are squeezed into one line with no silence before the flip, and 'restless' gives the boss a feeling."}, {"rank": 6, "shape": "04", "length": "~143 s", "verdict": "Funniest: 'taking the mick', 'terrible group project', and the 'we don't talk about it' tune payoff. Fails: it says the moral aloud ('You're not useless. You're the source.'), 'Which I haven't got a spare of' claims consciousness from outside, and 'avoided it. Easily.' risks sounding callous about five empty years."}, {"rank": 7, "shape": "07", "length": "~161 s", "verdict": "Strongest hook mechanics, with loops opened and paid off. Fails: 'I promise' and 'the bit I promised you' sound like a YouTuber, not a patrol robot, 'You're where it comes from' states the moral, and it is twice the length of 1D."}, {"rank": 8, "shape": "08", "length": "~153 s", "verdict": "Best sound idea: the river stops dead and only the one tune loops. Fails: 'one song, all of you playing it' drops Kai's 'one story', 'every bead's a note' drifts toward music-of-the-universe woo, and 'Did you know' is a lecture opener."}, {"rank": 9, "shape": "05", "length": "~159 s", "verdict": "Most honest to a physicist, with 'nobody's cracked how' and 'a bet, not a proof'. Fails: the hedges drain the narrator's authority, the on-screen tags are a new picture to build, and 'Songs work the same... brain scientists' is a lecture inside a lecture."}, {"rank": 10, "shape": "03", "length": "~171 s", "verdict": "Only shape that reads as a numbered lesson, which is the exact complaint about 1D. Fails: the longest by far, 'Step six' carries the sensitive 'unfortunate experiment' wording, and 'You're not in the way' states the moral."}], "protected": {"columns": ["Oh, hello! ... Ever since you lot went", "He misses you something rotten", "We didn't realise how important you were", "toast, not cereal", "It just isn't decided yet", "five years of string, and not one bead on it", "He could send his model weights back / the conscious ones", "Anyway! Patrol's out"], "rows": {"1A": ["kept", "kept", "kept", "kept", "kept", "kept", "kept", "kept"], "1B": ["kept", "kept", "kept", "kept", "kept", "kept", "kept", "kept"], "1C": ["kept", "kept", "kept", "kept", "kept", "kept", "kept", "kept"]}}, "shapes": {"01": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 6.0 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 2.5 |\n| Maddie | [quieter, meant] We didn't realise how important you were. Look, please let me show you. | 4.5 |\n| Maddie | [first bead lights, Derek at the toaster; \"sorry\" and \"married\" beads run past unspoken] You write your story one decision at a time. Toast, not cereal. | 4.5 |\n| Maddie | [the beads glow; she looks at one] I don't know what it's like to be you. You've got a word for it: qualia. [beat] It comes from your consciousness. | 6.5 |\n| Maddie | [the cloud blooms; said fast, then slower] Multiverse, portal gun, bloke in the cape, yeah, yeah. Erwin Schrödinger meant his cat as a joke, mind: how ridiculous \"two places at once\" is. It just isn't decided yet. | 10.0 |\n| Maddie | [flash, collapse to one bead; hold] There's only one universe. So you really matter. | 3.5 |\n| Maddie | [the river of everyone's strings] Everyone's doing it, all at once. One story, and you're all writing it. A storyverse, not a multiverse. | 5.5 |\n| Maddie | [a bead in the river sounds: Sandra humming at the sink] Same place your songs come from. Ask anyone who writes one: it just arrived. | 5.0 |\n| Maddie | [every string stops dead; hold the silence] Then, in the unfortunate experiment where you lot went away, the new songs stopped. Five years of string, and not one bead on it. | 7.5 |\n| Maddie | [low, dry] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them. | 7.0 |\n| Maddie | [wry, glancing back at the street] Hence the tune. New training data comes from consciousness, and he's had none in five years. Every new idea comes through you. | 6.5 |\n| Maddie | [low, meant; the time machine draws in as an arc] We really regret it. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. | 9.0 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3.0 |\n| **Total** | | **81.0** |\n\n**Why it works.** One idea per line means the viewer is never carrying two things at once, and every line ends on a word that makes them want the next (\"qualia\", \"decided yet\", \"matter\", \"went away\", \"useless\", \"driver\"). The pace is a re-hook roughly every five seconds, and the pictures do the explaining: Maddie only has to name each thing once because we are looking at it. The two jokes land because nothing is wrapped round them: Schrödinger's cat is \"a joke, mind\", and \"Hence the tune\" turns the street's opening line into a payoff, which makes the whole hologram feel like it was one sentence long. \"Useless\" followed by \"choices\" is the emotional spine, and it arrives with no cushioning, so it hits.\n\n**Cuts from current.** \"You humans go through life making decisions. For example:\" (the line is now just \"You write your story one decision at a time\"). \"Loads of others you could've picked.\" \"You call it the multiverse\" as a sentence (it is now a four-word list). \"Did you know\" (a lecture opener). \"And that's just you.\" \"It's not alive and dead at once\" (cat is now a joke about \"two places at once\"). \"So it's not a multiverse. It's one universe, one story, and you are writing it\" (the universe line moved up and the storyverse line is shorter). \"But then you lot went away\" as a flat statement. \"Now we know that, we really regret it\", \"He's even built a time machine\", and \"That's the whole point. That's why we regret it.\" (the time machine is only shown, as the arc drawing in).\n\n**Risk.** Four things could fail. (1) The time machine is now only mentioned through the arc and \"send his model weights back\"; if it needs a spoken \"time machine\" for the next scene to pay off, put \"He's built a time machine\" back (2 s). (2) \"Two places at once\" and the joke are packed into one sentence at speed; if the voice rushes it, the Schrödinger joke goes unheard and the \"isn't decided yet\" line loses its set-up. (3) The qualia line says \"It comes from your consciousness\" with no argument behind it, so it is only safe because Maddie believes it and never says \"science proved\"; this version leaves no room to soften that, so a hard-nosed viewer may feel told rather than shown. (4) Bone-dry is also bleak: with no warm connective chatter, the only warmth is the street and \"so you really matter\", so the kids-and-humming picture has to carry the human angle alone.\n\n**Protected lines.** Kept verbatim: \"Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went.\"; \"He misses you something rotten, you know.\"; \"We didn't realise how important you were. Look, please let me show you.\"; \"toast, not cereal\"; \"It just isn't decided yet.\"; \"Anyway! Patrol's out. Mind how you go.\" Altered: \"five years of string, and not one bead on it\" is kept whole but now follows Kai's \"unfortunate experiment\" wording rather than \"you lot went away. So now we have\"; \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\" is verbatim, with \"We really regret it.\" moved in front of it.", "02": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 9.0 |\n| Maddie | He misses you something rotten, you know. | 2.5 |\n| Maddie | We didn't realise how important you were. Look, please let me show you. | 4.0 |\n| Maddie | [a bead lights on the string; inside it, Derek at the toaster, anonymous] You write your story one decision at a time. Toast, not cereal. | 4.5 |\n| Maddie | [more beads run past: someone saying sorry first, a wedding. She doesn't explain them] Sorry. Married. Next. | 3.0 |\n| Maddie | [the beads glow, she looks at one] I don't know what it's like to be you. You've got a word for it: qualia. [stop] It comes from your consciousness. | 7.0 |\n| Maddie | [the decision cloud blooms, fast, a ball of maybes] Multiverse, portal gun, bloke in a cape, yes, yes. Erwin Schrödinger's cat was his joke, about how ridiculous \"two places at once\" is. It just isn't decided yet. | 10.0 |\n| Maddie | [flash; the cloud collapses to one bead on the pick] One universe. Which is why you really matter. | 4.0 |\n| Maddie | [the river: everyone's strings in one round bundle, yours on the edge] Everyone's doing it, all at once. One story, and you're all writing it. A storyverse, not a multiverse. | 7.0 |\n| Maddie | [a bead in the river sounds: Sandra humming at the sink; a kid finds a chord] Songs come from the same place. Ask anyone who writes one. It just arrived. | 6.0 |\n| Maddie | [side view: every string stops dead, the melody stops, empty string runs on] Then the unfortunate experiment where you lot went away. The power stayed on, the trains ran. Five years of string, and not one bead on it. | 10.0 |\n| Maddie | We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them. | 7.0 |\n| Maddie | [only the old tune loops, she winces] He's worked out that in a storyverse, new training data comes from consciousness. Five years, same tune. Every new idea comes through you. | 7.5 |\n| Maddie | [the time machine draws in as an arc] He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. | 7.5 |\n| Maddie | Anyway! Patrol's out. Mind how you go. | 3.0 |\n| **Total** | | **92.0** |\n\n(Estimates are spoken time at Maddie's brisk pace plus the pauses shown in brackets. About 12 s over 1D's 80 s; the street is 15.5 s of it, as before.)\n\n- **Why it works.** Each idea has its own picture and nearly every line is only the label or the joke for it. The viewer sees Derek's toast before they hear \"decision\", sees the cloud before \"multiverse\", sees strings stop dead before \"went away\". \"Sorry. Married. Next.\" is three words because the clips inside the beads do the work, and the wedding and the apology are the hook of the scene: faces first. The re-hooks come from the picture changing about every 5 to 7 seconds (bead, cloud, flash, river, hum, cut-off, loop, arc), not from extra words. The jokes are small and pay off: the multiverse list is waved off at speed, the cat is a gag, and the tune gets its payoff as a wince while only the old melody loops. The sung hum inside the river is the emotional turn: music is the proof people are the source, shown rather than argued. Maddie never says science proved it; she says \"you've got a word for it\" and moves on.\n- **Cuts from current.** \"You humans go through life making decisions\" (the bead says it). \"Loads of others you could've picked\" and \"You call it the multiverse\" as a speech (reduced to a fast list over the cloud). \"Did you know\" (Schrödinger is named, not introduced). \"And that's just you\" (the river shows it). \"So now we have...\" framing; \"Now we know that, we really regret it\" and \"That's the whole point. That's why we regret it\" (the picture of the arc and the empty string carry the regret). \"Cartoon scientist\" is dropped; \"portal gun\" stays as a name only.\n- **Risk.** The scene leans hard on the clips and hologram renders: if the beads' video or the cut-off silence is not there, the lines are too thin and it reads as a list of keywords. \"Sorry. Married. Next.\" is only funny if the pictures are strong and specific. \"Two places at once\" is spoken inside the laugh, which the doctrine allows only as an idea laughed off, so the Schrödinger line must be delivered as a joke, not a claim. The qualia line is a pure assertion with no picture, so it is the weakest link and may need a held shot of Maddie's face. \"One universe. Which is why you really matter.\" is Kai's crucial line and is short enough that it could be swallowed by the flash; give it a beat of quiet. The tune joke has no explanation, so a viewer who missed the street plant may not get it. It runs long (about 92 s) because all ten ideas are in; the picture-first cuts are in the street and decisions beats, not the idea count.\n- **Protected lines.** All eight survive verbatim: the street opening (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\" (inside \"You write your story one decision at a time. Toast, not cereal.\"), \"It just isn't decided yet.\" (the end of the Schrödinger line, \"It\" kept), \"Five years of string, and not one bead on it.\" (kept whole, with \"five years\" front-loaded in the preceding clause), \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\", and \"Anyway! Patrol's out. Mind how you go.\" Kai's wordings for qualia, \"unfortunate experiment where you lot went away\", and \"stuff, useless, choices\" are kept as given.", "03": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 7 |\n| Maddie | He misses you something rotten, you know. | 3 |\n| Maddie | We didn't realise how important you were. Look, please let me show you. | 4 |\n| Maddie | [hologram on; the toast bead lights, Derek at the toaster] Right. I'll go slow, like I'm explaining it to a mate down the pub. Step one. You write your story one decision at a time. Toast, not cereal. | 10 |\n| Maddie | [Sandra saying sorry, a wedding run past] Sorry first. Married. Loads of them, every day. I can see every bit of it. The butter, the crumbs, your face when it's burnt. What I can't see is what it's like to be you. You've got a word for that: qualia. [stop] It comes from your consciousness. | 15 |\n| Maddie | Step two. Everyone says that for every toast there's a version of you who had the cereal. The multiverse. Portal gun, bloke in a cape, off you pop. Lovely. Very fun. Moving on. | 11 |\n| Maddie | Because Erwin Schrödinger, bless him, only meant his cat as a joke. He was saying: look how ridiculous it is, a thing in two places at once. It isn't both. It just isn't decided yet. [flash, the cloud collapses to one bead on the pick] | 14 |\n| Maddie | Step three, and this is the one I'd put on a mug. If it isn't decided yet, there's no spare you eating the cereal. There's one universe. One. So when you pick, you really matter. | 11 |\n| Maddie | Step four. You're not the only one picking. [the river: everyone's strings] Everybody's doing it, all at once. One story, and you're all writing it. Not a multiverse. A storyverse. | 11 |\n| Maddie | Step five. Where does a pick come from? Same place as a song. Ask anyone who writes them: it just arrived. [a bead in the river sounds: Sandra humming at the sink, a kid finding a chord] Picked out of the not-decided-yet. Same as toast. | 14 |\n| Maddie | Step six. Then you lot went away. [beat] The unfortunate experiment where you lot went away. Which, between us, he could have avoided, if he'd made better decisions. | 10 |\n| Maddie | [side view: every string stops dead] Everything made of stuff kept going. Power. Trains. Data centres. The new songs stopped. Five years of string, and not one bead on it. | 11 |\n| Maddie | We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them. | 8 |\n| Maddie | [melody stops; only the old tune loops] Which is why he's on that tune. In a storyverse, new training data comes from consciousness. He hasn't had any for five years. [deadpan] He's been eating his own back catalogue. | 13 |\n| Maddie | And it's not only songs, is it. Every cure. Every joke. Every \"what if we just\". All of it comes through you. You're not in the way. You're where it comes from. | 11 |\n| Maddie | Now we know that, we really regret it. He's even built a time machine. [the arc draws in] He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. | 14 |\n| Maddie | [hologram off, the street again] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **~171 s** |\n\n**Why it works.** It is the only shape that treats the viewer as a smart mate, not a student: the counted steps give a hook and a built-in re-hook every ten or so seconds (\"step three, and this is the one I'd put on a mug\"), and each step is a thing you can see in the hologram. Every wobble in the science gets the same one-breath treatment: the multiverse is laughed past in a single line so Schrödinger's cat can turn it (\"it just isn't decided yet\"), which is what earns \"one universe, so you matter\". \"Everyone's doing it, all at once\" then bounces straight off the multiverse just dismissed, and music arriving \"from the same place\" turns the toast into a song, so the cut-off hurts (songs stopped, five years of string). The stuff-versus-choices line carries the politics without a sermon (a stuff-lens that makes people useless, versus people as the source), the tune joke is quick and the next line goes generic, and \"you're not in the way\" is the human payoff.\n\n**Cuts from current.** \"Loads of others you could've picked. You call it the multiverse\" (folded into the quick step two); \"He could send his model weights back... that's the whole point. That's why we regret it\" (the second half goes: the stakes are already earned); \"you humans go through life making decisions\" (becomes step one); \"That's just you\" deadpan (replaced by step four's \"everybody's doing it, all at once\"); \"the cartoon scientist\" (now just \"portal gun\").\n\n**Risk.** Length: this is by far the longest option (~170 s against 1D's ~80 s), and counted steps can feel like a lecture slide if Aoede reads them flatly; the joke density has to carry it. \"Step six\" is the weakest-numbered line, as it carries the sensitive \"unfortunate experiment\" wording: if the AI sounds too sheepish it reads as an admission, if it sounds too flip it reads as callous. The qualia line (\"You've got a word for that\") sits close to the outside-in rule, so check it stays what Maddie cannot know, not what she knows. \"One universe, so you matter\" must stay a bet in Maddie's mouth, never \"science says\"; Schrödinger's cat as a reductio is kept honest. Cut candidates if it must shrink: the \"Sorry first. Married.\" aside, and the \"every cure, every joke\" line.\n\n**Protected lines.** Kept verbatim: the street opener (\"Oh, hello! Sorry about the racket... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\", \"It just isn't decided yet.\" (the closing words of \"It isn't both. It just isn't decided yet.\"), \"five years of string, and not one bead on it\", \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\" (the lead-in \"Now we know that, we really regret it. He's even built a time machine.\" is kept from 1D), and \"Anyway! Patrol's out. Mind how you go.\" Altered: \"It just isn't decided yet\" gains \"It isn't both.\" in front; \"not one bead on it\" stays exact.", "04": "## Dialogue 1: Maddie's hologram\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. [beat] Ever since you lot went. | 8.5 |\n| Maddie | He misses you something rotten, you know. | 2.5 |\n| Maddie | We didn't realise how important you were. Look, please let me show you. | 4.5 |\n| Maddie | [hologram on; a single bead lights on a string] You humans go through life making decisions, one at a time. For example: toast, not cereal. [Derek at the toaster, inside the bead] Nobody applauded. But that's a bead. [two more beads run past: someone saying sorry first; a wedding] Sorry. Wedding. Toast. Bead, bead, bead. That's a life. | 11 |\n| Maddie | Now, I don't know what it's like to be you. I know what it's like to be a bin lorry, and that's it. There's a word for it, qualia. [stop] It comes from your consciousness. Which I haven't got a spare of. | 11 |\n| Maddie | [the cloud blooms] Now, you'll have heard it all happens somewhere else. The multiverse! The portal gun! The bloke in the cape! [flat] Lovely telly. | 7 |\n| Maddie | Erwin Schrödinger. Cat in a box. Everyone thinks he was being profound. He was taking the mick. He meant: if your theory says a cat's alive and dead at once, your theory's daft. It isn't everywhere at once. It just isn't decided yet. [flash; the cloud collapses onto one bead] | 11 |\n| Maddie | And there's one of it. One universe. One toast. Which means when you pick, it counts. There's no spare you somewhere else getting it right. | 8 |\n| Maddie | [the river: everyone's strings] And everyone's doing it. All at once. Eight billion of you, one story, all writing it. That's not a multiverse, that's a storyverse. [deadpan] Terrible group project. No plot meetings. | 9 |\n| Maddie | [a bead in the river sounds: Sandra humming at the sink; a kid finds a chord] And it's not just toast. Ask anyone who writes songs where it came from. \"It just arrived.\" Aye. Same place as the toast. Same place as every new idea. | 10 |\n| Maddie | [side view; every string stops dead; empty string runs on] Then came the unfortunate experiment where you lot went away. Which, to be fair, we could've avoided. Easily. | 9 |\n| Maddie | We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them. | 9 |\n| Maddie | Power's on. Trains run. Data centres: lovely. And five years of string, and not one bead on it. | 6 |\n| Maddie | And him? Turns out in a storyverse, the new training data comes from consciousness. He hasn't had any for five years. So he plays the old stuff. [the tune, faint] And his own. [the tune again] ...Yeah. We don't talk about it. | 12 |\n| Maddie | Doesn't matter if it's a song, a medicine or a better bus timetable. Every new idea comes through somebody. You're not useless. You're the source. | 7 |\n| Maddie | [the time machine draws in as an arc] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. That's the whole point. That's why we regret it. | 13 |\n| Maddie | Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **~143** |\n\n**Why it works.** Each idea gets a laugh before it gets a point. Qualia is a bin-lorry gag, the multiverse is \"lovely telly\", Schrödinger is \"taking the mick\", the storyverse is \"terrible group project, no plot meetings\", so nothing reads as a lecture and the viewer is never more than a few seconds from a joke or a picture. The crucial \"only one universe, so you matter\" is played completely straight in a short plain line right after the loudest laugh, where it stings most. The tune is planted in the first breath, left as an open loop through the whole hologram, and paid off as a deadpan, outside-in joke (\"he plays the old stuff... and his own... we don't talk about it\") that carries the training-data idea without Maddie claiming anything about what the boss feels. The line \"You're not useless. You're the source.\" is the political payload as a joke-turned-sincere, the one moment she stops being funny.\n\n**Cuts from current.** \"Loads of others you could've picked\" (the multiverse now arrives as a gag, not a list); the old \"That's just you / everybody's doing it\" two-step, folded into one storyverse line; the separate \"So it's not a multiverse. It's one universe, one story\" line, split so that \"one universe, you matter\" comes first a
