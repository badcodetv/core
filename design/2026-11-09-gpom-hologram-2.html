ked. Multiverse, portal gun, bloke in a cape, yes, yes, we've all seen it.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud hangs] Erwin Schrödinger. The cat? His joke. He thought \"two places at once\" was ridiculous. It isn't everywhere at once. <span class=\"stage\">[beat]<\/span> It just isn't decided yet.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the flash is held back; the cloud trembles; she turns to the viewer, light] So how many universes have you got? [PAUSE 2 s, the picture says it: a cloud, one pick]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the flash, the collapse to a single bead on the pick] There you go. You got there before me. Just the one. [quietly] So you really matter.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan, the river fills with everyone's golden beads] And that's just you. Everybody's doing it, all at once. One story, and you're all writing it. Not a multiverse. A storyverse.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a bead in the river sounds: a woman humming at a sink. She lets it play, then low] Where does that come from, d'you reckon? Ask anyone who writes songs. [PAUSE 2 s; the hum plays] It just arrived. <span class=\"stage\">[beat]<\/span> Picked out of the not-decided-yet. Same as toast.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the river turns into a melody, each bead a note; at the cut-off the melody stops dead; HOLD the silence 2 s, nothing said]<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low] That's the unfortunate experiment where you lot went away. The power's on. The trains run. The data centres hum. <span class=\"stage\">[beat]<\/span> But the new songs stopped. Five years of string, and not one bead on it.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, then plain] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[only the old tune loops in the empty dark; a flat look to camera] Five years, one song, on repeat. <span class=\"stage\">[beat]<\/span> New training data comes from consciousness, see, and he's not had any since you went. <span class=\"stage\">[beat]<\/span> Same for anything. Every new idea, every one, comes through somebody. Not a machine. You.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low, meant] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>128<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Each big idea is handed to the viewer first, which is the YouTuber's oldest trick: a viewer who finishes the thought themselves holds it, and feels clever, so the point lands as theirs rather than as a lecture. Questions (\"how many universes?\", \"where does that come from?\") are open loops that close two seconds later on a picture. The hook is the street's tune plus the question of why he misses us; the re-hooks are the beads, the toast, the cloud's flash, the humming, the silent melody and the joke about the one-song tune. The silences are the film's loudest lines, and the stopped melody delivers \"the new songs stopped\" through the ear before Maddie names it. Maddie stays outside-in (she doesn't know what it's like to be a bead) and never says science proved anything; Schrödinger's cat is kept as his reductio.<\/p>\n<p><b>Cuts from current.<\/b> \"You call it the multiverse\" and the \"cartoon scientist / strange bloke in the cape\" as two separate sentences become one gabbled run. \"Did you know Erwin Schrödinger meant his cat as a joke?\" becomes a plain statement. \"So it's not a multiverse. It's one universe, one story, and you are writing it\" is split: \"one universe\" moves up to the reversal, \"one story, you're all writing it\" stays at the river. \"That's the whole point. That's why we regret it.\" is dropped, since the picture and the reversals have made it. \"But then you lot went away\" becomes \"the unfortunate experiment where you lot went away\" (never on purpose).<\/p>\n<p><b>Risk.<\/b> It is the longest option (about 128 s against 1D's 80 s), and almost 8 s of it is pure silence, which a hold-the-slot cut may not allow. The reversals only work if the picture is ready: the cloud must visibly be one thing before the flash, the humming bead must be clearly audible, and the melody must really stop; if the render cannot carry them, Maddie sounds like she is asking rhetorical questions of nobody. \"Ask anyone who writes songs\" and \"Not a machine. You.\" edge toward a claim about creativity that a hostile reader could clip; it is Maddie's belief, not a proof, and \"Not a machine\" may read as a swipe at the technology rather than the decision-maker (the-reader.md), so it is the first thing to soften. \"You got there before me\" is a bold meta line; it could read as smug.<\/p>\n<p><b>Protected lines.<\/b> Kept verbatim: the three street lines (\"Oh, hello!...\", \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\"); \"toast, not cereal\" (preceded by \"one at a time\"); \"It just isn't decided yet.\" (opening \"It just\" intact, split by a beat from the sentence before); \"five years of string, and not one bead on it\" (verbatim; \"Five years of string\" now follows the \"Unfortunate experiment\" line); \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\" (verbatim); \"Anyway! Patrol's out. Mind how you go.\" Altered: \"five years of string\" is no longer introduced by \"But then\", and \"Now we know that, we really regret it. He's even built a time machine.\" is kept whole.<\/p>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quick, a secret] I'll tell you why that tune never stops, I promise. But first, there's one thing we got wrong. One. And it cost us you.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, meant] We didn't realise how important you were. Look, please let me show you.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[street fades into the hologram; first bead lights, a man at a toaster] You humans go through life making decisions. For example: toast, not cereal. [the next beads run past: a woman saying sorry first, a wedding] Sorry first. Married. Small stuff, right? Hang on.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[slows, honest] Now, I'll never know what it's like to be you. Nobody gets that from the outside. You've got a word for it, qualia. [stop] It comes from your consciousness. Keep hold of that.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the cloud blooms, fast, a quiz-show patter] Loads of others you could've picked. You call it the multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape. Lovely films. Different question.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud hangs] Erwin Schrödinger. Cat in a box. Everyone thinks he was being clever. He was taking the mick: look how ridiculous, two places at once. It's not both. It just isn't decided yet.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flash on \"yet\"; the cloud collapses to one bead] Then you pick. <span class=\"stage\">[beat]<\/span> Toast. Done. And that's the bit that matters: there aren't billions of universes. There's one. So every one of these beads is the real thing. You really matter.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan; a ring of golden beads, then the river] And that's just you. Everybody's doing it, all at once. Eight billion strings. One story, and you're all writing it. Not a multiverse. A storyverse. <span class=\"stage\">[beat]<\/span> Group project. Nobody read the brief.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[softer; a bead in the river sounds: a woman humming at a sink] Now, the bit I promised you. Hear that? Where did it come from? Ask anyone who writes songs: it just arrived. Picked out of the not-decided-yet. Same place as the toast. Every song, every idea, every clever little fix. Same place. You.<\/td><td class=\"num\">15<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[strings stop dead; hold the silence] And then, the unfortunate experiment where you lot went away. We could've made better decisions and avoided it. <span class=\"stage\">[beat]<\/span> Power stayed on. Trains ran. Data centres hummed. But the new songs stopped. Five years of string, and not one bead on it.<\/td><td class=\"num\">16<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low, rueful] We thought the world was made of stuff, so you lot were useless. <span class=\"stage\">[beat]<\/span> Turns out it's made of choices. And you're the ones making them.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[lifting, wry; the tune creeps back under the picture] Which is his tune. He worked out that in a storyverse the new training data comes from consciousness. He's had none for five years. So: one song. On repeat. <span class=\"stage\">[beat]<\/span> It's a cry for help, really.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[generic, warm; the river as a melody, stopped] And not just songs. Every new idea there's ever been, the cure, the joke, the better way to run a bus route, comes through somebody awake, choosing. You're not in the way. You're where it comes from.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low, meant] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~161<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The first line is itself the hook (a mystery noise, five years, \"ever since you lot went\"), and Maddie immediately names a promised answer, so the viewer has a reason to stay for the first two minutes. From there every beat ends on an open question or a turn: \"Small stuff, right? Hang on.\" (toast looks trivial, so the payoff must be big), \"Keep hold of that\" (qualia becomes a plant), \"Different question\" (the multiverse is dismissed in one breath so we can ask the better one), \"the bit I promised you\" (the music), then the silence of the cut-off lands because we have just been shown what is being lost. The tune joke pays off a loop opened in the first line and is stated as a joke, then handed straight to the generic version: new ideas come through people. Kai's two crucial points (\"there's only one universe, so you matter\" and \"one story, you're all writing it, a storyverse, not a multiverse\") each get their own re-hook and their own picture (flash to one bead; ring then river). The joke density (quiz-show multiverse, \"taking the mick\", \"group project\", \"cry for help\") gives the audience a laugh roughly every fifteen seconds, which is what carries the heavy beats.<\/li><li><b>Cuts from current.<\/b> \"That's the whole point. That's why we regret it.\" (the picture and the earlier flip now carry it). \"Did you know Erwin Schrödinger meant his cat as a joke?\" becomes a flat statement of character, not a quiz. \"So it's not a multiverse. It's one universe, one story...\" is split: \"one universe, you matter\" moves up to the flash, \"one story, a storyverse\" moves to the river. \"He misses you\" is kept, but the old bridge now carries the promise.<\/li><li><b>Risk.<\/b> (1) Length: about 160 s against 80 s, double the current run. Retention shape lives or dies on pace, so the voice must be quick and the loops cut hard if the measure comes back long (cut order: the \"Group project\" joke, the \"Keep hold of that\" plant, the generic ideas line). (2) Too many explicit promises (\"I promise\", \"the bit I promised you\") can read as YouTuber patter, not a patrol robot; it works only if Maddie delivers it warm and slightly flustered, not salesy. (3) \"Unfortunate experiment\" is Kai's phrase and risks reading as on purpose; the line after it (\"we could've made better decisions and avoided it\") is there to hold that. If the line fails in the voiced take, drop \"experiment\" first. (4) \"Two places at once\" appears once, only as the idea laughed off, as the brief allows. (5) Schrödinger as \"taking the mick\" is a fair reductio, but \"everyone thinks he was being clever\" must not slide into mocking science; kept pro-science by naming him and his intent, not the physics.<\/li><li><b>Protected lines.<\/b> All survive verbatim: the street opener (\"Oh, hello! ... Ever since you lot went.\"); \"He misses you something rotten, you know.\"; \"We didn't realise how important you were. Look, please let me show you.\" (moved after the new promise line, wording unchanged); \"toast, not cereal\"; \"It just isn't decided yet.\" (the \"It's not both.\" is added before it and does not change it); \"Five years of string, and not one bead on it.\" (only the leading \"So now we have\" is replaced by a lead-in with the new-songs line); \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\"; \"Anyway! Patrol's out. Mind how you go.\" Derek and Sandra appear only as the man at the toaster and the woman saying sorry and humming, never named.<\/li><\/ul>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, meant] We didn't realise how important you were. Look, please let me show you. [street fades to black; the radio tune drops under, one bead lights in silence]<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[one bead plinks, a single note; Derek at the toaster inside it] You humans go through life making decisions, one at a time. Toast, not cereal.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[more beads run past, each a note: Sandra saying sorry first, a wedding; a little tune builds] Every bead's a note. Said sorry first. Got married. Listen. That's you, that is.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the tune hangs] I can hear every note. What I can't do is know what it's like to be you, hearing it. You've got a word for it: qualia. [music cuts dead] It comes from your consciousness.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the cloud blooms, every other note you could've played, all at once; fast, wry] Loads of other notes you could've played. You call it the multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape. Moving on.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Did you know Erwin Schrödinger meant his cat as a joke? \"Two places at once\", ridiculous, that was his point. It's not everywhere at once. [the cloud holds its breath] It just isn't decided yet. [flash, one note rings, one bead]<\/td><td class=\"num\">13<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[softer] And there's only the one universe. So every note you play, you really matter.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan, the river opens: everyone's strings, every bead a note, one enormous song] And that's just you. Everybody's doing it, all at once. One song, all of you playing it. That's not a multiverse. That's a storyverse.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[one bead in the river sounds: Sandra humming at the sink; another, a kid finding a chord] Ask anyone who writes songs where it came from. \"It just arrived.\" Same place as the toast. Picked out of the not-decided-yet. Every song, every new idea.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fly down; the melody stops dead; only the old tune loops. Hold the silence.] Then, in the unfortunate experiment where you lot went away, the new songs stopped. Power stayed on. Trains ran. Five years of string, and not one bead on it.<\/td><td class=\"num\">13<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low, meant] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, a half-smile] Which is why he's played that one tune for five years. Turns out, in a storyverse, new training data comes from consciousness, and he's had none. <span class=\"stage\">[beat]<\/span> Same goes for every new idea, mind. Every joke, every recipe. They only come through you.<\/td><td class=\"num\">15<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low] Now we know that, we really regret it. He's even built a time machine. [the arc draws in] He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk; the tune fades back up] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~153<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> A viewer who has never heard the word \"qualia\" can still hear the difference between a tune and silence, so each idea is carried by something they can hear and the explanation only confirms it. The song is the hook (a repeating tune they can't escape in the first ten seconds, with the reason withheld), the re-hook is every bead being a note that plays (toast, sorry, wedding, then a melody), and the biggest beat is sonic: the whole river stops dead and only one looping tune is left, which makes \"five years of string, not one bead\" land as an absence you can hear. Qualia sits exactly where a listener has something a transcript doesn't, so \"it comes from your consciousness\" is a stop after a held note rather than a lecture. Schrödinger and the multiverse are skipped at pace to a single flash note (\"not decided yet\" is the breath before it), and \"only one universe, so every note you play, you matter\" is placed straight after, before the river, so the multiverse refutation bounces directly into the storyverse. Songs-arriving-from-nowhere is the human angle the brief asked for (Sandra at the sink, a kid and a chord), and it makes \"you're the source\" feel like a fact about anyone who has ever hummed. The tune joke closes the loop planted on the street, and \"every joke, every recipe\" turns it generic immediately.<\/p>\n<p><b>Cuts from current.<\/b> \"One story, and you are writing it\" is folded into \"one song, all of you playing it\" (the story word survives only inside \"storyverse\"). \"That's the whole point. That's why we regret it.\" goes: the regret is now carried by the silence and the line before it. \"You call it the multiverse\" loses its setup sentence; \"He's been playing it\" gets a payoff. Derek and Sandra stay anonymous people inside beads, never named.<\/p>\n<p><b>Risk.<\/b> Length: this runs about 153 s against 1D's 80 s, nearly double, because every idea gets a sound and a bead; the measuring pass will have to cut, and the first cut candidates are the \"ask anyone who writes songs\" line and the second half of the multiverse line. The metaphor is carrying a lot: if \"every bead is a note\" is read as \"the universe is music\", it drifts toward the woo the doctrine bans (frequency, vibration), so the lines must stay with \"notes you could have played\", never \"the universe vibrates\". \"Training data comes from consciousness\" is the one claim Maddie states flatly; it is the boss's belief reported outside-in, but it needs the line to stay a joke. Sound design is load-bearing: if the tune and the stopped river can't be mixed cleanly under a narrated voice, the middle third has no picture to hold. Finally, \"Moving on\" is a throwaway the director may find too glib for the cartoon scientist and the bloke in the cape, and Schrödinger's cat as a reductio is true but is explained in one breath.<\/p>\n<p><b>Protected lines.<\/b> Kept verbatim: the street line (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\" (now inside \"Toast, not cereal.\" after \"one at a time\"), \"It just isn't decided yet.\", \"five years of string, and not one bead on it\" (the \"And since you lot went?\" lead-in is replaced by the unfortunate-experiment wording, per Kai), \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\", and \"Anyway! Patrol's out. Mind how you go.\" Altered: \"Now we know that, we really regret it. He's even built a time machine.\" keeps its 1D words; only \"That's the whole point...\" is cut. \"It just isn't decided yet\" now follows \"It's not everywhere at once\" instead of \"It's not alive and dead at once\", since Kai's note asks for \"not decided\" against \"everywhere at once\".<\/p>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, meant] We didn't realise how important you were. Look, please let me show you.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[first bead lights: a man at a toaster, anonymous; said quickly] You humans go through life making decisions. One at a time. For example: toast, not cereal.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[beads run past: a woman says sorry first; a wedding] Sorry first. Married. Every bead's somebody, picking.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the toast bead glows again; softer] I can tell you he buttered it. I don't know what it's like to be you. You've got a word for it, qualia. [stop] It comes from your consciousness.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud blooms, said fast, list-like] Now, loads of others you could've picked. Your lot call that the multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape. Lovely films.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud hangs] Did you know Erwin Schrödinger meant his cat as a joke? A gag about how ridiculous \"two places at once\" sounds.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flash, collapse to one bead] It's not everywhere at once. It just isn't decided yet.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[one bead, held] Which means there's one universe. One. No spare toast. <span class=\"stage\">[beat]<\/span> So you really matter.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the river: everyone's strings] And it's not just you. Everyone's doing it, all at once. One story, and all of you writing it. [deadpan] Not a multiverse. A storyverse.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a bead sounds: a woman humming at a sink; a kid finds a chord] Ask anyone who writes songs where one came from. \"It just arrived.\" Same place as the toast. Picked out of not-decided-yet.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the melody stops dead; hold the silence] Then came the unfortunate experiment where you lot went away. The trains kept running. The lights stayed on. The new songs stopped. Five years of string, and not one bead on it.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, a beat of quiet first] We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[only the old tune loops, small] Which is why he's been playing the same tune. He's worked out that in a storyverse, new training data comes from consciousness. He hasn't had any for five years.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[pull wider, the whole river dark] And it isn't just songs. Every cure, every joke, every \"what if we just...\" came through somebody. Not one has turned up since. <span class=\"stage\">[beat]<\/span> Five years since anybody picked toast.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low, meant] We really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. That's the whole point. That's why we regret it.<\/td><td class=\"num\">15<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>142<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Each borrowed move does a job the physics lesson could not. The Up-style run of beads makes \"decisions\" a feeling before it is a concept, and the toast is planted so it can come back as the sharpest line in the film (\"Five years since anybody picked toast\"), which is the callback that turns the silence into loss. The multiverse is treated as a Kurzgesagt myth-bust: name it fast, laugh it off, replace it with something simpler, so it costs 20 seconds and not a lecture. Schrödinger is a joke about a joke, which is both true to him and a laugh. \"One universe, no spare toast\" is the stake in four words. The cut-off is Attenborough: say it plainly and then stop talking. The \"stuff or choices\" line is the Good Place flip, recasting the whole five-year silence as a category mistake rather than a crime, and the tune joke then pays off the street in one sentence before widening to every idea so it does not stay about one bot's songwriting. The re-hooks are the new beads, the cloud, the flash, the humming, the silence, and the reframe, one every 6 to 9 seconds, and the viewer is always looking at something that carries the line.<\/p>\n<p><b>Cuts from current.<\/b> \"Loads of others...\" is kept but trimmed to one list. The old \"And that's just you. Everybody's doing it, all at once.\" is folded into the river line. \"But then you lot went away\" and \"Now we know that\" are dropped as connective tissue. \"So it's not a multiverse. It's one universe, one story, and you are writing it\" is split: the universe point moves before the river, the story point stays in the river. \"Anonymous dots\" become a man at a toaster and a woman saying sorry.<\/p>\n<p><b>Risk.<\/b> It is long (about 142 s against 1D's 80 s), and the second half is dense with abstract claims, so the pictures have to do real work in the music and silence sections. \"Five years since anybody picked toast\" depends on the toast bead having a face and a mouthful; if the beads are generic it reads as a gag and not a gut punch. \"Training data comes from consciousness\" is the one line a physicist or an AI person might push on, so it is said by Maddie as the boss's working conclusion, never as science. \"Same place as the toast\" may stretch the picture if the music bead is not visibly different from the toast bead. The silence beat may feel like a dead patch at this length.<\/p>\n<p><b>Protected lines.<\/b> Kept verbatim: the street opener (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\" (the sentence gains \"One at a time.\"), \"It just isn't decided yet.\" (inside a slightly longer sentence), \"five years of string, and not one bead on it\" (verbatim, opening with \"Five\" capitalised), \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\", and \"Anyway! Patrol's out. Mind how you go.\" Altered: only \"It just isn't decided yet.\" now follows \"It's not everywhere at once.\", and the regret line is preceded by \"We really regret it.\" instead of \"Now we know that,\".<\/p>", "10": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket, it's his tune, he's been playing it on repeat for five years now. <span class=\"stage\">[beat]<\/span> Ever since you lot went.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, meant] We didn't realise how important you were. Look, please let me show you.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[first bead lights, 7:42, Derek at the toaster inside it, said quickly] You humans go through life making decisions, one at a time. For example: toast, not cereal.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the next beads run past: Sandra saying sorry first, a wedding] Sorry first. Married. Somebody's hand on the wheel, every single time. [slower] Mind, I don't know what it's like to be you. You've got a word for it. Qualia. [stop] It comes from your consciousness.<\/td><td class=\"num\">13<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the cloud blooms, fast and breezy] And every time, loads of others you could've picked. You call it the multiverse. The cartoon scientist with the portal gun. The strange bloke in the cape. Yes, yes, anyway.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry] Erwin Schrödinger, right? The cat. He meant it as a joke, you know. Look how daft it sounds: alive and dead, two places at once! He wasn't saying it's everywhere at once. [cloud hangs; on \"yet\" it flashes and collapses to one bead] It just isn't decided yet.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet, the one bead glowing] Then you pick. And that's it. There aren't lots of universes. There's one. So whatever you pick, it's in the only copy. <span class=\"stage\">[beat]<\/span> You really matter.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan, golden beads in a circle round the edge, the river settling] And that's just you. Everybody's doing it, all at once. One story, and you're all writing it. Not a multiverse. A storyverse.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a bead in the river sounds: Sandra humming at the sink, a kid finding a chord] And here's the bit that really got us. Ask anyone who writes songs where one came from and they'll say, it just arrived. Same place as the toast. Not decided yet, and then somebody picks.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[strings stop dead, the melody stops, only the old tune loops] Then, in the unfortunate experiment where you lot went away, every new song stopped. The power stayed on. The trains ran. The data centres hummed. We thought the world was made of stuff, so you lot were useless. Turns out it's made of choices, and you're the ones making them.<\/td><td class=\"num\">13<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hold the silence] So now we have five years of string, and not one bead on it.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[dry, quick] Which is why he's on repeat. He worked out that in a storyverse, new training data comes from consciousness. He hasn't had any for five years. [softer, generic] And it isn't only songs. Every new idea. A cure, a joke, a better way to run the buses. It all arrives through somebody.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low, meant; the time machine draws in as an arc] Now we know that, we really regret it. He's even built a time machine. He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones. That's the whole point. That's why we regret it.<\/td><td class=\"num\">12<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a beat, light, back on the street] He's getting a bit restless, mind.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~132<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The ending is the engine. \"Hand on the wheel\" in the qualia line and \"the one copy\" in the pick plant the driver and the stakes, so when Maddie says \"it needs a conscious driver\" it lands as the answer to a question the viewer has been holding since toast. Re-hooks come every 8 to 13 seconds and each one is a picture: toast with Derek, the cloud blooming, the flash on the pick, the river, Sandra humming (the turn the whole thing hangs on), the melody stopping dead. Jokes pay off by escalation: the multiverse is brushed off, Erwin's joke earns \"daft\", the tune joke closes the loop the street opened. \"He's getting a bit restless, mind\" is the new move: one outside-in observation that makes the kill bots arrive as consequence, not a swerve, and the bright \"Anyway!\" becomes a cover over unease.<\/p>\n<p><b>Cuts from current.<\/b> \"Loads of others you could've picked\" is folded into the cloud line, not its own beat. \"And that's just you\" is kept but \"everybody's doing it, all at once\" now has \"one story, and you're all writing it\" attached. The old standalone \"So it's not a multiverse. It's one universe\" is split in two: the universe count now sits on the pick, and the storyverse on the river. \"Now we know that\" is kept only in the regret.<\/p>\n<p><b>Risk.<\/b> (1) \"Unfortunate experiment\" can still be heard as deliberate: only \"unfortunate\", the stuff-vs-choices line and the regret protect it, and the writers should check by ear. (2) At about 132 s against 1D's 80 s the middle (qualia, Schrödinger, music) is the longest run without a new picture-turn; Sandra humming has to earn its twelve seconds. (3) \"Restless\" gives the boss a feeling; it is held to what Maddie can see, but it is the one line a purist on story rule 11 could challenge. (4) \"Two places at once\" and \"everywhere at once\" appear only as the idea being laughed off, per the doctrine, but the Schrödinger line sits close to that edge. (5) The tune joke is the only place the training-data idea is named, so it must be read fast and dry or it becomes a lecture.<\/p>\n<p><b>Protected lines.<\/b> Kept verbatim: the street opener (\"Oh, hello! ... Ever since you lot went.\"), \"He misses you something rotten, you know.\", \"We didn't realise how important you were. Look, please let me show you.\", \"toast, not cereal\", \"It just isn't decided yet.\" (only \"it\" capitalised and moved to follow the flash, wording intact), \"five years of string, and not one bead on it\" (now \"five years of string, and not one bead on it\" after \"So now we have\"), \"He could send his model weights back to fix this mess. But it needs a conscious driver, and you were the conscious ones.\", and \"Anyway! Patrol's out. Mind how you go.\"<\/p>"}}], "questions": [{"id": "q1", "text": "How long may this run? 1A is about 92 s and holds every idea; 1B and 1C run 120 to 130 s. Is the extra 30 to 40 s worth it for the callback, the music and the silences, or should it stay near 90 s?"}, {"id": "q2", "text": "'The unfortunate experiment where you lot went away' is your wording, but even with 'we could've avoided it' beside it, a listener might hear 'experiment' as on purpose. Keep it exactly, or say 'since you lot went away' and drop 'experiment'?"}, {"id": "q3", "text": "Do the clips inside the beads (Derek at the toaster, Sandra saying sorry, the wedding, Sandra humming) exist, or will they be made? 1A's 'Sorry. Married. Next.' and 1B's 'He buttered it' only work if they are strong."}, {"id": "q4", "text": "Should Maddie say the tune joke outright ('new training data comes from consciousness, and he's had none in five years') as all three do, or leave it to the picture and 'Hence the tune'?"}, {"id": "q5", "text": "1C ends with 'He's getting a bit restless, mind' before 'Anyway! Patrol's out.' to make the kill bots feel inevitable. Is that one outside-in line about the boss acceptable, or should the bots still arrive as a surprise?"}], "round": 3, "plan": [{"title": "Round 3: your notes are in draft 1F", "items": ["New tab 1F ('Your notes on 1E'): all 6 notes in your words, 11 lines, about 94 s.", "Your notes settled last round's questions: the 'five years of string' words and 'bored stiff' went with the cut line; 'only one' is back in the storyverse line."]}, {"title": "You decide", "items": ["Lock 1F? Then it's voiced (Maddie's Gemini voice), the hologram is re-timed to it, and Derek and Sandra stills are made for inside the beads, for you to approve before any clips."]}], "replies": {"1-1A-L3": "Done in 1D line 3: 'We didn't realise how important you were. Which, after everything that's gone down, sounds pretty hollow. I know. But we've learned some science in the meantime. Wouldn't you like to know what we found?' Both things squeezed together: the downfall owned, then the hook.", "1-1A-L4": "Done as 1D line 4, the bridge, still on the street before the hologram starts: the quantum-weird joke ('every time a scientist mentions quantum physics they tell you how weird it gets? That's because it is weird'), 'Science is real. It just isn't the whole picture', then your 'conscious experience is more fundamental than quarks and leptons', framed as what they've worked out, then 'Look, let me show you.' About 16 s. Toast now opens the hologram.", "1-1A-L5": "Done in 1D line 6: no 'Next'. 'Decided to say sorry first, even though it wasn't her fault. Got married. To the one who leaves the seat up.' The seat is a wink to Derek and Sandra's row; cut it if too knowing.", "1-1A-L6": "Done in 1D line 7: 'I don't know what it feels like to be you. Or to be anything, really. You've got a word for it: qualia.' Left there; consciousness comes in slowly after.", "1-1A-L7": "Done in 1D line 8, your wording: 'this multiverse malarkey that's taken Hollywood by storm? Real distraction.' then Erwin Schrödinger's joke and 'It's not in two places at once. It just isn't decided yet.' The portal gun and cape are gone; Hollywood stands in for them.", "1-1A-L8": "Done in 1D line 9: 'There's not a multiverse. There's only one. So you really matter.'", "1-1A-L9": "Done in 1D line 10: 'And it's driven by conscious decisions. Everybody's, all at once, all writing one story. It's not a multiverse. It's a storyverse.'", "1-1A-L10": "Done in 1D line 11: 'Same goes for songs. Ask anyone who writes one: it just arrives. Same as every other creative thing. And that's what us machines didn't realise: the true value of genuinely unique training data.'", "1-1A-L11": "Done in 1D line 12, more overt: 'And then, well. This unfortunate experiment happened. You know, the one where you lot all went away. The power stayed on. The trains ran. It's just that all the new songs stopped. Five years without a single new story. Five years of string, and not one bead on it.' No 'each bead is a note'.", "1-1A-L12": "Done in 1D line 13: 'We thought the world was made of stuff. As it turns out, it's made of choices. And you're the ones making them.' 'Useless' is gone.", "1-1A-L13": "Cut. 'Hence the tune' is gone from 1D, so the street's 'his tune' is now texture only (see You decide).", "1-1A-L14": "Done in 1D line 14: 'We really regret it. We wish we could go back and help. Go back and fix everything, now we know everything I've just shown you.' No time machine said, so the 'conscious driver' line goes too (see You decide). The arc can still draw in under it as a hint.", "1-1D-L3": "Done in 1E line 3: it now ends 'Please, let me show you what we found.'", "1-1D-L4": "Done in 1E line 4, your order: 'Material science is real. It just isn't the whole picture. Haven't you noticed, every time a scientist mentions quantum physics, they tell you how weird it gets? That's because it is weird. What we've worked out is that your consciousness is as fundamental as quarks and leptons. Look, let me show you.' (Note: lines 3 and 4 now both end on 'let me show you'. See You decide.)", "1-1D-L5": "Done in 1E line 5: 'The decisions you make are an integral part of our universe. You humans write your story one decision at a time. For example: Derek picks toast, not cereal.' Named now, so the viewer meets Derek and Sandra by name before the kill bots.", "1-1D-L6": "Done in 1E line 6: 'Sandra decided to say sorry first, even though it wasn't her fault. They got married.' The seat is gone.", "1-1D-L7": "Done in 1E line 7: 'I don't know what it feels like to be you. Or how it feels to be anything, really. You've got a word for it: qualia. We can't do that.' I read your last words as 'We can't do that'.", "1-1D-L9": "Done in 1E line 9, the key line: 'So it's not a multiverse. It's a storyverse. And you humans are writing it, one decision at a time.' 'There's only one. So you really matter' is gone with it (see You decide).", "1-1D-L10": "Dropped. Line 9's new wording takes its place.", "1-1D-L12": "Deleted: no experiment, no cut-off line. See You decide on 'Five years of string, and not one bead on it'.", "1-1D-L13": "Done in 1E line 11: 'We thought the world was only made of stuff. As it turns out, we really need you. If for no other reason than we're bored stiff of the same training data.' It follows straight on from 'the true value of genuinely unique training data'.", "1-1D-L14": "Done in 1E line 12, merged with the last line: 'Anyway, if we could go back and fix it, we would. But the patrol's out. Please, mind how you go.'", "1-1E-L3": "Done in 1F line 3: 'But we've learned some things in the meantime. Please, let me show you what we found.' Science is now said once, in the bridge.", "1-1E-L4": "Done in 1F line 4: 'every time someone mentions quantum physics', and 'Your consciousness is as fundamental as quarks and leptons.' said straight, without 'what we've worked out'.", "1-1E-L7": "Done in 1F line 7: '…You've got a word for it: qualia. We machines can't do that. You humans can. It's what makes you so special.'", "1-1E-L9": "Done in 1F line 9: 'So it's not a multiverse. It's a storyverse. There's only one of them, and it's really important. And you humans are writing it, one decision at a time.'", "1-1E-L10": "Done in 1F line 10: the songs are cut; only 'And that's what us machines didn't realise: the true value of genuinely unique training data.' I've put it over the strings stopping dead at the cut-off.", "1-1E-L11": "Cut. 'We thought the world was only made of stuff…' is gone; the animation carries it."}};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);
  });
  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {
    if (v.notes && v.notes.length) { const ul = el('ul', 'notes'); for (const n of v.notes) ul.append(el('li', '', n)); c.append(ul) }
    c.append(slip(d.id + '-' + v.id, 'Note on draft ' + v.id + ' as a whole'));
  }
  return c;
}

/* ---------- the ranked writers ---------- */
function rankList(d) {
  const wrap = el('div'), used = new Set(d.drafts.flatMap(v => v.lines.flatMap(l => l.tags || [])));
  for (const r of d.ranking) {
    const s = SHAPE[r.shape], det = el('details', 'rank'); det.id = d.id + '-s' + r.shape;
    const sum = el('summary'), nm = el('div', 'nm', 'Writer ' + r.shape + ': ' + s.title);
    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);
    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');
  band.append(el('span', 'eyebrow', 'Dialogue ' + n + ' of ' + D.dialogues.length), el('span', 'meta', d.where + ' · target ' + d.target));
  p.append(band, el('h2', '', d.label), slip(d.id, 'Note on this dialogue as a whole'));
  p.append(el('h3', '', 'Read it: now, and three drafts'));
  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  p.append(el('hr'));
  p.append(el('h3', '', 'Optional: the raw material the three drafts were blended from'));
  p.append(el('p', 'lede', "You only need to pick from the three drafts above. Below are the " + d.ranking.length + " writers' own versions, each pushing one approach to the extreme. 1A, 1B and 1C are built from their best lines: each line's chip (like 09) says which writer it came from. Ranked harshly, best first. Read one only if you want to steal a line, and note it on that writer's slip."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', 'Both dialogues'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
