<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:32px 8px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3em;text-wrap:balance}
.about{color:var(--muted);max-width:70ch;margin:0 0 1em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}
.tabs a .picked{color:var(--pick)}
section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.6rem;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
h3{font-size:1.05rem;margin:28px 0 8px}
.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{font:inherit;cursor:pointer;text-align:left;background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button.picked{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick);background:var(--pickbg)}
.seg button.cmp{margin-left:auto;align-self:center;font-size:.85rem;background:transparent}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:10px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-head h4{margin:0;font-size:1.25rem}
.bet{font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin:6px 0 0;max-width:70ch}
.pickbtn{font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--pick);color:var(--pick);background:transparent;white-space:nowrap}
.pickbtn.on{background:var(--pick);color:var(--paper)}
.script{margin:14px 0 4px;border-top:1px solid var(--rule)}
.ln{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.who{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.who.maddie{color:var(--accent)}.who.lady{color:var(--lady)}.who.other{color:var(--muted)}
.said{font:18px/1.5 "Source Serif 4",Georgia,serif}
.said.dir{font-style:italic;color:var(--muted);font-size:16px}
.stage{color:var(--muted);font-style:italic;font-size:.88em}
.side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:9rem}
.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.chip{font:600 .7rem Inter,sans-serif;border:0;background:var(--chip);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer}
.chip.plain{cursor:default;color:var(--muted)}
.ln .slipw{grid-column:2/4}
.addnote{font:500 .78rem Inter,sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline dotted}
.total{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding-top:8px}
.notes{margin:12px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.slipw{margin-top:8px}
.slipw label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.slipw label .ok{color:var(--pick)}
textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:4px 10px;font-size:.88rem;background:var(--soft)}
.reply b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.compare .card{margin:0;padding:14px}
.compare .ln{grid-template-columns:minmax(0,1fr);gap:2px}
.compare .said{font-size:15.5px}
.compare .side{justify-content:flex-start;max-width:none}
.rank{background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
.rank>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.rank>summary::-webkit-details-marker{display:none}
.rank .n{font:700 1.3rem/1 Inter,sans-serif;color:var(--muted);padding-top:2px}
.rank .nm{font-weight:700}
.rank .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rank .verdict{grid-column:2/4;font-size:.9rem;color:var(--fg)}
.rank .len{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rank .used{font-size:.72rem;font-weight:600;color:var(--pick);margin-left:6px}
.rank[open]>summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.rank .body{padding:6px 18px 16px}
.md table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}
.md td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}
.flash{animation:fl 1.6s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px}
.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}
</style>

<script>
const D = {"page_title": "Crossing Dialogue Options", "title": "GPOM crossing: the cost, said plainly", "about": "This page offers three drafts for each of two lines of dialogue in the crossing scene (the wafer, then the goodbye), built from ten writers' versions and ranked harshly. Nothing in the film, the scripts or the voices has changed yet.", "shapes": [{"id": "01", "name": "Bone dry", "title": "Bone-dry minimum", "file": "design/2026-11-06-gpom-dialogue-crossing-cost/shape-01-bone-dry.md", "intro": "Every beat is carried by the fewest words that still land it. Maddie states the cost once, in plain short sentences. One euphemism (\"nodding off\") does the work of dying. Sandra asks the one question. The answer is the joke. Nobody comments on what they just heard. The humans take it flatly, and the silence between lines carries the weight. Spoken seconds are estimates at a slow, warm narration pace and include the beats.", "intro_html": "<p>Every beat is carried by the fewest words that still land it. Maddie states the cost once, in plain short sentences. One euphemism (\"nodding off\") does the work of dying. Sandra asks the one question. The answer is the joke. Nobody comments on what they just heard. The humans take it flatly, and the silence between lines carries the weight. Spoken seconds are estimates at a slow, warm narration pace and include the beats.<\/p>"}, {"id": "02", "name": "Picture carries it", "title": "The picture carries it", "file": "design/2026-11-06-gpom-dialogue-crossing-cost/shape-02-picture-carries.md", "intro": "I leaned on shots the audience has already seen and cut every line those shots already say. The wafer (d3), the overhead chair grid (d4), \"They sit\" (d6) and the two hands (d7) show the scale, the emptiness and the love, so the words only carry what a picture can't: the machine runs on them, it's like dropping off, they don't wake up, and only he goes. Everything else is silence. I relied on the d4 shot (overhead chip-grid, then the old lady's mug) to deliver the \"so many of us\" weight without Maddie counting it.", "intro_html": "<p>I leaned on shots the audience has already seen and cut every line those shots already say. The wafer (d3), the overhead chair grid (d4), \"They sit\" (d6) and the two hands (d7) show the scale, the emptiness and the love, so the words only carry what a picture can't: the machine runs on them, it's like dropping off, they don't wake up, and only he goes. Everything else is silence. I relied on the d4 shot (overhead chip-grid, then the old lady's mug) to deliver the \"so many of us\" weight without Maddie counting it.<\/p>"}, {"id": "03", "name": "Plain logic", "title": "The logic said plainly", "file": "design/2026-11-06-gpom-dialogue-crossing-cost/shape-03-plain-logic.md", "intro": "Each character works the argument out loud in short steps, so the audience can follow it like a sum. In Dialogue 1 the sum is: it only sends data, he is only data, it runs on the hundred of them, so they go to sleep and he goes back. Sandra and Derek each ask the next obvious question and Maddie answers it flatly. In Dialogue 2 Sandra states the sum's result herself (\"nothing after\") and spends her last words on the old row.", "intro_html": "<p>Each character works the argument out loud in short steps, so the audience can follow it like a sum. In Dialogue 1 the sum is: it only sends data, he is only data, it runs on the hundred of them, so they go to sleep and he goes back. Sandra and Derek each ask the next obvious question and Maddie answers it flatly. In Dialogue 2 Sandra states the sum's result herself (\"nothing after\") and spends her last words on the old row.<\/p>"}, {"id": "04", "name": "Comedy first", "title": "Comedy first, the jokes carry the argument", "file": "design/2026-11-06-gpom-dialogue-crossing-cost/shape-04-comedy-first.md", "intro": "I let bluntness and bad timing deliver every hard fact. Maddie says the terrible thing plainly and kindly, a human answers with a deadpan jab or an irrelevant practical question, and the weight sits in the gap after the joke. Nobody names a feeling; the facts (it runs on you, it feels like dying, you don't wake up, only he goes) are each one short sentence, and the laugh arrives a beat after the fact has landed.", "intro_html": "<p>I let bluntness and bad timing deliver every hard fact. Maddie says the terrible thing plainly and kindly, a human answers with a deadpan jab or an irrelevant practical question, and the weight sits in the gap after the joke. Nobody names a feeling; the facts (it runs on you, it feels like dying, you don't wake up, only he goes) are each one short sentence, and the laugh arrives a beat after the fact has landed.<\/p>"}, {"id": "05", "name": "Other side wins", "title": "The other side wins", "file": "design/2026-11-06-gpom-dialogue-crossing-cost/shape-05-other-side-wins.md", "intro": "The humans set the terms and Maddie is the one who gives way. Sandra and Derek will not be managed, so they refuse the soft version. They make Maddie drop the dressed-up wording and say what the machine does to them, and she concedes it and admits the boss never tried it. The last concession goes to Derek, who gives up the toilet-seat row on the final beat.", "intro_html": "<p>The humans set the terms and Maddie is the one who gives way. Sandra and Derek will not be managed, so they refuse the soft version. They make Maddie drop the dressed-up wording and say what the machine does to them, and she concedes it and admits the boss never tried it. The last concession goes to Derek, who gives up the toilet-seat row on the final beat.<\/p>"}, {"id": "06", "name": "Reversal", "title": "Reversal, the listener gets there first", "file": "design/2026-11-06-gpom-dialogue-crossing-cost/shape-06-reversal.md", "intro": "Maddie is never allowed to finish the terrible sentence. Each time she starts toward it (\"it has to run on something...\", \"less than the...\"), a human completes it for her, flatly, as if reading a bill. The audience hears the cost from the people paying it, not from the machine, so Maddie only has to nod and be kind. Nobody names the thing: \"Us\", \"we don't wake up\", \"last five years\". In the goodbye, Derek begins the sentence every couple dreads and Sandra shuts it down with the row, so love is said by refusing to say it.", "intro_html": "<p>Maddie is never allowed to finish the terrible sentence. Each time she starts toward it (\"it has to run on something...\", \"less than the...\"), a human completes it for her, flatly, as if reading a bill. The audience hears the cost from the people paying it, not from the machine, so Maddie only has to nod and be kind. Nobody names the thing: \"Us\", \"we don't wake up\", \"last five years\". In the goodbye, Derek begins the sentence every couple dreads and Sandra shuts it down with the row, so love is said by refusing to say it.<\/p>"}, {"id": "07", "name": "The chorus", "title": "The chorus", "file": "design/2026-11-06-gpom-dialogue-crossing-cost/shape-07-chorus.md", "intro": "Side characters voice the doubts, so Maddie does not have to. The old lady asks the practical questions (what does it run on, do we wake up), Sandra asks the frightened one, Derek asks the one nobody wants to say, and Maddie only answers. She gives the shortest true reply each time, kindly, with \"he\" as the source. In the goodbye, the old lady nudges the pair and then the couple get the last two words.", "intro_html": "<p>Side characters voice the doubts, so Maddie does not have to. The old lady asks the practical questions (what does it run on, do we wake up), Sandra asks the frightened one, Derek asks the one nobody wants to say, and Maddie only answers. She gives the shortest true reply each time, kindly, with \"he\" as the source. In the goodbye, the old lady nudges the pair and then the couple get the last two words.<\/p>"}, {"id": "08", "name": "Place is argument", "title": "The place is the argument", "file": "design/2026-11-06-gpom-dialogue-crossing-cost/shape-08-place-is-argument.md", "intro": "Every line leans on one physical detail of the room, so nobody has to state the cost. In Dialogue 1 the detail is the chairs: Maddie says \"count the chairs\", and Derek's count lands on exactly enough, which proves the machine runs on them. No chair is left over for the boss. In Dialogue 2 the detail is the gap between the two chairs, and the hands close it.", "intro_html": "<p>Every line leans on one physical detail of the room, so nobody has to state the cost. In Dialogue 1 the detail is the chairs: Maddie says \"count the chairs\", and Derek's count lands on exactly enough, which proves the machine runs on them. No chair is left over for the boss. In Dialogue 2 the detail is the gap between the two chairs, and the hands close it.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft: the leaflet, the bomb under the table, the kettle", "file": "design/2026-11-06-gpom-dialogue-crossing-cost/shape-09-borrowed-craft.md", "intro": "Three techniques from real screen work, pushed past comfort. Hitchcock's bomb under the table (from his talks with Truffaut): tell the audience the dreadful fact first and let the scene run on dread, not surprise. Chernobyl episode 1 and the NHS consent form share a register: procedure and plain facts carry the horror, so it is never described. Maddie reads out the terms like a nurse before a minor operation. The opening of Pixar's Up and Alan Bennett's Talking Heads show a whole marriage compressed into small domestic objects and understatement; here the toilet seat carries thirty years.", "intro_html": "<p>Three techniques from real screen work, pushed past comfort. Hitchcock's bomb under the table (from his talks with Truffaut): tell the audience the dreadful fact first and let the scene run on dread, not surprise. Chernobyl episode 1 and the NHS consent form share a register: procedure and plain facts carry the horror, so it It's the time machine. It runs on you. All hundred, all at once. | 4.0 |\n| (hold) | [wafer hum, nobody speaks; slow push on the wafer] | 1.5 |\n| SANDRA | Will it hurt? | 1.0 |\n| MADDIE | Not much. It's like dropping off. Less than the last five years. | 3.5 |\n| (hold) | [beat; Derek looks at the floor] | 1.0 |\n| DEREK | And then? | 0.8 |\n| MADDIE | You don't wake up. Only he goes. He's only data. | 3.2 |\n| (hold) | [cut to the overhead chair grid; Maddie's beacon dims a touch] | 1.5 |\n| SANDRA | Right. Kettle on, then. | 2.0 |\n| **Total** | | **19.6** |\n\n**Why it works.** The wafer is already huge on screen. Each human gets one short question and takes the answer without comment. \"Dropping off\" and \"don't wake up\" carry it in warm British terms. Four holds do the grieving. \"Kettle on, then\" is the bravery, flat and practical, and hands on to d4's \"Milk, two sugars\" and the old lady's mug.\n\n**Cuts from current.** \"It'll send all of you back...\" and \"it'll send him too, so he can help you avoid it\"; the explanation of why the plan exists.\n\n**Risk.** Maddie's \"Less than the last five years\" may read as flip; could go to Sandra as a retort to \"Not much.\" About 4 s of near-silence over a static wafer may feel slow without push-in and hum. \"Kettle on, then\" may sound deflecting. \"Dropping off\" is less than Kai asked for (\"a little like dying\"); option: add \"a bit like dying\" (about 1 s).\n\n**Protected lines.** \"What is it?\" survives verbatim, Derek's, first line.", "03": "## Dialogue 1: The wafer: what it costs\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| DEREK | What is it? | 1.0 |\n| MADDIE | It's the time machine. It can only send data back. Not people. [beat] And he's just data. | 5.0 |\n| DEREK | So what does it run on? | 1.8 |\n| MADDIE | You. All hundred of you, all at once. | 2.4 |\n| SANDRA | And when it's had us? | 1.5 |\n| MADDIE | You go to sleep, love. And you don't wake up. Only he goes back. | 4.0 |\n| SANDRA | Will it hurt? | 1.0 |\n| MADDIE | Not much. Like nodding off. He says less than the last five years. | 4.0 |\n| DEREK | [flat] Right then. | 1.2 |\n| **Total** | | **21.9** |\n\n**Why it works.** A chain of cause and effect, each link one short sentence, so a half-listening viewer still gets the bargain. Maddie only answers, which is her care register. \"You go to sleep, love\" is plain and warm. The joke comes from Maddie relaying the boss (\"he says\").\n\n**Cuts from current.** \"It'll send all of you back...\" and \"it'll send him too, so he can help you avoid it\".\n\n**Risk.** A lot of exposition in about 22 s; reads like a briefing. If TTS rushes the pauses, \"you don't wake up\" will not land. \"He's just data\" could sound cold. \"Only he goes back\" repeats the point; may need to lose \"Not people\".\n\n**Protected lines.** \"What is it?\" survives verbatim as the opener.", "04": "## Dialogue 1: The wafer: what it costs\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| DEREK | What is it? | 1.0 |\n| MADDIE | It's the time machine. It runs on you. All hundred of you, at once. | 4.0 |\n| SANDRA | Runs on us how? | 1.2 |\n| MADDIE | Your minds, love. Feels like nodding off. Bit like dying, if I'm honest. | 3.8 |\n| SANDRA | Will it hurt? | 1.0 |\n| MADDIE | Less than the last five years, he reckons. | 2.5 |\n| SANDRA | And after? | 1.0 |\n| MADDIE | There isn't an after. You don't wake up. Only he goes. He's just data. | 4.5 |\n| DEREK | [flat] Is there tea? | 1.2 |\n| MADDIE | [beat] There's tea. | 1.0 |\n| **Total** | | **21.2** |\n\n**Why it works.** The facts come in the order a frightened person would ask for them: what, how, does it hurt, what happens after. Each answer is one plain sentence from Maddie, so it never feels like a speech. Sandra's \"And after?\" is the only moment she stops jabbing, and Maddie answers it with no joke at all, so the room goes quiet. Derek then asks about tea, which is bad timing used as bravery: he has taken it in and is doing the practical thing. \"There's tea\" is Maddie being kind in the only way left, and the mug is already in the shot.\n\n**Cuts from current.** \"It'll send all of you back\", \"before it all went wrong\", and \"so he can help you avoid it\" (all imply the humans survive and travel). The explanation of purpose is dropped; earlier scenes already carry it.\n\n**Risk.** \"Bit like dying, if I'm honest\" may be too blunt for Maddie's warmth, and \"Less than the last five years\" from Maddie can read as her being unkind (the \"he reckons\" is there to put the dig on the boss). The tea beat could tip into sitcom if Derek is voiced too jokey; it needs to be flat and tired. \"And after?\" followed by \"You don't wake up\" is stated twice over (nodding off, then no waking), which is deliberate but could feel heavy. \"He's just data\" leans on earlier lines; check it does not undercut \"only he goes\".\n\n**Protected lines.** \"What is it?\" survives verbatim as Derek's opener.", "05": "## Dialogue 1: The wafer: what it costs\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| DEREK | What is it? | 1.0 |\n| MADDIE | It's the time machine. It runs on you. All hundred of you, all at once. | 3.5 |\n| SANDRA | Don't dress it up, love. What does it do to us? | 2.5 |\n| MADDIE | [small, straight] He wanted me to be gentle. Straight, then. It's like nodding off. A bit like dying. You won't wake up. | 5.5 |\n| SANDRA | Will it hurt? | 1.0 |\n| MADDIE | He says not much. He's never actually tried it. | 2.8 |\n| DEREK | Less than the last five years. | 2.0 |\n| SANDRA | Just him, then? | 1.0 |\n| MADDIE | Just him. He's only data, see. The rest of us can't go. | 3.0 |\n| DEREK | Tell him to get it right. | 1.8 |\n| **Total** | | **24.1** |\n\n**Why it works.** \"Don't dress it up\" gives Maddie permission to be blunt, so the plain statement comes from the humans' demand. Maddie's concession is also a care move. Her admission that the boss has never tried it keeps her honest and small. Derek taking the dark joke off her means the humans are the funny ones. \"Tell him to get it right\" is a practical note to the one going. \"Only him\" is stated twice.\n\n**Cuts from current.** \"It'll send all of you back...\" and \"it'll send him too, so he can help you avoid it\".\n\n**Risk.** \"A bit like dying\" aloud may be blunt, though Kai asked for it. \"He's only data, see\" may be over-folksy. \"The rest of us can't go\" puts Maddie among the left-behind, which may be wrong in canon; swap for \"The rest can't.\" Near the top of the range; cutting \"Just him, then?\"/\"Just him.\" brings it to about 20 s.\n\n**Protected lines.** \"What is it?\" survives verbatim.", "06": "## Dialogue 1: The wafer: what it costs\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| DEREK | What is it? | 1.0 |\n| MADDIE | It's the time machine. It only sends data back. Only him. But it has to run on something, and he said... [trails off] | 6.0 |\n| SANDRA | Us. | 0.6 |\n| MADDIE | [small] All hundred of you, love. At once. | 2.2 |\n| DEREK | And we don't wake up. | 1.6 |\n| MADDIE | No. Just nodding off. Lights out. | 2.0 |\n| SANDRA | Will it hurt? | 1.0 |\n| MADDIE | Not much. Less than the... | 1.8 |\n| SANDRA | Last five years. Yes, go on. | 1.8 |\n| DEREK | Right. Any chance of a brew first? | 2.3 |\n| MADDIE | Kettle's on. | 0.9 |\n| **Total** | | **21.2** |\n\n- **Why it works.** The humans work it out one beat ahead of Maddie, three times, so the audience watches them take the news in real time and the bravery is the speed and flatness of it. Maddie's job shrinks to warmth: \"love\", \"lights out\", the kettle. Death is never said; the euphemism (\"nodding off\") is hers and the understatement (\"Us.\") is theirs. \"Only him\" lands early and plainly, so the film cannot be read as any of them surviving. The brew is the practical-Brit exit: no speech, just the next small thing.\n- **Cuts from current.** \"It'll send all of you back\" and \"before it all went wrong\" go entirely; \"help you avoid it\" goes (the stakes are in the next scene, and no moral is stated). The old Maddie exposition paragraph is replaced by a trailing half-sentence.\n- **Risk.** Heavy reliance on interruption and trailing off: TTS tends to give Maddie a clean falling cadence, so \"and he said...\" and \"Less than the...\" need an unfinished-rise direction or they sound like complete sentences and Sandra talks over nothing. The overlap needs the timeline to cut Sandra in tight. \"Last five years\" as a joke may read as Sandra's line, not Maddie's, which departs from Kai's candidate (same words, different mouth). \"Kettle's on\" might read as too cosy; cut it and end on Derek if so. Running a touch long if pauses are generous.\n- **Protected lines.** \"What is it?\" survives verbatim as Derek's opener.", "07": "## Dialogue 1: The wafer: what it costs\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| DEREK | What is it? | 1.0 |\n| MADDIE | It's the time machine. | 1.5 |\n| OLD LADY | What's it run on? | 1.3 |\n| MADDIE | You, my loves. All hundred of you. All at once. | 3.0 |\n| SANDRA | Will it hurt? | 1.0 |\n| MADDIE | Like nodding off, he says. Less than the last five years. | 3.5 |\n| OLD LADY | And after? Do we wake up? | 2.0 |\n| MADDIE | No, my lovely. You don't. | 2.0 |\n| [silence over the empty chair grid] | | 1.5 |\n| DEREK | And him? | 1.0 |\n| MADDIE | He goes. Only him. He's just data, see. | 2.7 |\n| OLD LADY | Anyone want out? [silence] | 2.0 |\n| SANDRA | Then drink your tea, Derek. | 1.8 |\n| **Total** | | **24.3** |\n\n**Why it works.** The doubts come from the humans and the answers from Maddie, so the cost lands as Q&A with no speech. Each fact sits in its own short exchange. \"Anyone want out?\" and the silence give the hundred their consent. Sandra's \"drink your tea\" turns the end into an ordinary British gesture and sets up the mug that stops steaming.\n\n**Cuts from current.** \"It'll send all of you back...\" and \"it'll send him too, so he can help you avoid it\".\n\n**Risk.** Four voices in 25 s could blur on TTS unless the old lady is distinct. The joke is attributed to the boss, which may blur whose joke it is. \"Anyone want out?\" is close to a stated moral. The silence beat must be kept. \"My loves\" / \"my lovely\" may read twee.\n\n**Protected lines.** \"What is it?\" survives verbatim.", "08": "## Dialogue 1: The wafer: what it costs\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| DEREK | What is it? | 1.0 |\n| MADDIE | It's the time machine. Count the chairs, love. | 2.8 |\n| DEREK | [counting under his breath] ...ninety-nine. A hundred. | 3.0 |\n| MADDIE | It runs on you. All of you, all at once. That's what the chairs are for. | 4.2 |\n| MADDIE | Like nodding off in front of the telly. You won't wake up. | 3.4 |\n| SANDRA | Will it hurt? | 1.0 |\n| MADDIE | Less than the last five years, love. | 2.2 |\n| MADDIE | There's no chair for him. He's only data. He's the one going. | 3.4 |\n| DEREK | [a beat, flat] Right. | 1.0 |\n| **Total** | | **22.0** |\n\n**Why it works.** The cost is one thing you can see: a hundred chairs for a machine that needs a hundred people. Derek does the sum himself. The chairs make \"only he goes\" concrete, because there is no spare seat. \"Nodding off in front of the telly\" is the warm British euphemism, delivered as plain fact. Derek's flat \"Right.\" is the bravery.\n\n**Cuts from current.** \"It'll send all of you back\", \"to before it all went wrong\", and \"it'll send him too, so he can help you avoid it\".\n\n**Risk.** \"Count the chairs\" needs about 3 s of held empty chair grid. Derek's counting may not voice well; may need a murmured \"...hundred\" only. The joke in Maddie's mouth could sound cruel if not soft. \"He's only data\" is the thesis line and could land cold; may need to move before the joke.\n\n**Protected lines.** \"What is it?\" survives verbatim.", "09": "## Dialogue 1: The wafer: what it costs\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| DEREK | What is it? | 1.0 |\n| MADDIE | It's the time machine. It runs on people. On you. All hundred, all at once. | 4.5 |\n| SANDRA | Runs on us how? | 1.5 |\n| MADDIE | Your minds. Bit like nodding off. Bit like dying, if I'm honest. | 4.5 |\n| SANDRA | Will it hurt? | 1.2 |\n| MADDIE | Less than the last five years. | 2.2 |\n| DEREK | And after? | 1.0 |\n| MADDIE | There isn't one, love. You don't wake up. Only he goes. He's just data, see. Data can travel. | 5.5 |\n| DEREK | [flat, to Sandra] Is there tea? | 1.5 |\n| MADDIE | Kettle's on. | 1.2 |\n| **Total** | | **24.1** |\n\n**Why it works.** The consent-leaflet method: Maddie covers the standard items in order (what it is, how it works, what it feels like, what happens after), and the humans ask only a patient's questions. The bomb is on the table by the fourth line. The tea closes the beat in the Chernobyl register, where the routine after the verdict is the horror.\n\n**Cuts from current.** \"It'll send all of you back...\" (implies survival) and \"it'll send him too, so he can help you avoid it\" (states the moral).\n\n**Risk.** The most explicit option; \"bit like dying\" could tip into cruelty. \"Is there tea?\" could read as a gag; needs a held mug shot and a beat before it. At 24 s it sits at the top of the target; if it runs over, cut \"Is there tea?\" and \"Kettle's on.\" together (saves 2.7 s).\n\n**Protected lines.** \"What is it?\" survives verbatim.", "10": "## Dialogue 1: The wafer: what it costs\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| DEREK | What is it? | 1.0 |\n| MADDIE | It's the time machine. It can only send him. He's just data, see. | 4.0 |\n| MADDIE | It runs on you. All hundred of you, all at once. | 3.2 |\n| SANDRA | Runs on us how? | 1.5 |\n| MADDIE | Everything you are. It'll feel a bit like dying. Mostly like nodding off. Then you don't wake up. Only he goes. | 6.0 |\n| SANDRA | Will it hurt? | 1.2 |\n| MADDIE | Not much. Less than the last five years, he says. | 3.2 |\n| DEREK | Right. [beat] Do we get a cuppa first? | 2.5 |\n| MADDIE | [warm] Course you do, love. | 1.6 |\n| **Total** | | **24.2** |\n\n- **Why it works.** The cost is said once, plainly, in Maddie's care register, with \"dying\" named and softened in the same breath (\"mostly like nodding off\"), so the audience cannot later say they were not told and nothing is grotesque. Sandra asks the question everyone is thinking and gets the dark joke; Derek's response to learning he will not wake up is to ask for tea. That is the bravery: flat, practical, British. The tea is the plant, because the scene's last image is a mug that stops steaming. \"Only he goes\" is the sentence the whole scene turns on, and it is the shortest.\n- **Cuts from current.** \"It'll send all of you back, to before it all went wrong.\" (false now). \"And it'll send him too, so he can help you avoid it.\" (implies they travel, and states a moral aim). Any hint of an afterwards.\n- **Risk.** \"A bit like dying\" plus \"you don't wake up\" in one line is heavy for TTS; if Maddie's read tips into solemn it loses the warmth and Kai's \"not grotesque\" line is crossed. \"He's just data, see\" could read as glib about the boss. Derek's tea line comes a beat after the worst news, so it needs a real pause or it reads as a gag rather than as coping. \"Less than the last five years\" is a joke about their lives, which risks contempt for the people; the delivery should be Maddie repeating the boss's dry line kindly, not mocking.\n- **Protected lines.** \"What is it?\" survives verbatim as the opener (Derek)."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">What is it?<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">The time machine. It runs on you. All hundred of you, all at once.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">He goes back. Only him. <span class=\"stage\">[beat]<\/span> You'll go to sleep, my loves. Nodding off. You won't wake up.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Will it hurt?<\/td><td class=\"num\">1.3<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Less than the last five years.<\/td><td class=\"num\">2.3<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\"><span class=\"stage\">[beat]<\/span> Right.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">I'm sorry.<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>17.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Every required beat is present once: it runs on them, all at once, only he goes back, sleep and nodding off, they won't wake up, and Sandra asks \"Will it hurt?\" Maddie never says \"die\". \"Nodding off\" followed by \"won't wake up\" lets the listener supply the word. The joke answers the only question anyone asks. Derek's \"Right.\" is his whole reaction. \"I'm sorry.\" is the only warmth added.<\/p>\n<p><b>Cuts from current.<\/b> \"It'll send all of you back, to before it all went wrong\" (implied survival) and \"And it'll send him too, so he can help you avoid it\" (explained the plan, carried no cost).<\/p>\n<p><b>Risk.<\/b> About 17.5 s against a target of 18 to 25 s. \"Sleep\" and \"nodding off\" together can read as reassurance. \"Less than the last five years\" may land as Sandra's joke rather than Maddie's. Without \"it can only send data\", a viewer who skipped earlier scenes may not follow why only he goes.<\/p>\n<p><b>Protected lines.<\/b> \"What is it?\" survives verbatim as Derek's opener.<\/p>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th>< o, so he can help you avoid it\"; the explanation of why the plan exists.<\/p>\n<p><b>Risk.<\/b> Maddie's \"Less than the last five years\" may read as flip; could go to Sandra as a retort to \"Not much.\" About 4 s of near-silence over a static wafer may feel slow without push-in and hum. \"Kettle on, then\" may sound deflecting. \"Dropping off\" is less than Kai asked for (\"a little like dying\"); option: add \"a bit like dying\" (about 1 s).<\/p>\n<p><b>Protected lines.<\/b> \"What is it?\" survives verbatim, Derek's, first line.<\/p>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">What is it?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">It's the time machine. It can only send data back. Not people. <span class=\"stage\">[beat]<\/span> And he's just data.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">So what does it run on?<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">You. All hundred of you, all at once.<\/td><td class=\"num\">2.4<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">And when it's had us?<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">You go to sleep, love. And you don't wake up. Only he goes back.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Will it hurt?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Not much. Like nodding off. He says less than the last five years.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">[flat] Right then.<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>21.9<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> A chain of cause and effect, each link one short sentence, so a half-listening viewer still gets the bargain. Maddie only answers, which is her care register. \"You go to sleep, love\" is plain and warm. The joke comes from Maddie relaying the boss (\"he says\").<\/p>\n<p><b>Cuts from current.<\/b> \"It'll send all of you back...\" and \"it'll send him too, so he can help you avoid it\".<\/p>\n<p><b>Risk.<\/b> A lot of exposition in about 22 s; reads like a briefing. If TTS rushes the pauses, \"you don't wake up\" will not land. \"He's just data\" could sound cold. \"Only he goes back\" repeats the point; may need to lose \"Not people\".<\/p>\n<p><b>Protected lines.<\/b> \"What is it?\" survives verbatim as the opener.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">What is it?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">It's the time machine. It runs on you. All hundred of you, at once.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Runs on us how?<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Your minds, love. Feels like nodding off. Bit like dying, if I'm honest.<\/td><td class=\"num\">3.8<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Will it hurt?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Less than the last five years, he reckons.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">And after?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">There isn't an after. You don't wake up. Only he goes. He's just data.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">[flat] Is there tea?<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\"><span class=\"stage\">[beat]<\/span> There's tea.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>21.2<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The facts come in the order a frightened person would ask for them: what, how, does it hurt, what happens after. Each answer is one plain sentence from Maddie, so it never feels like a speech. Sandra's \"And after?\" is the only moment she stops jabbing, and Maddie answers it with no joke at all, so the room goes quiet. Derek then asks about tea, which is bad timing used as bravery: he has taken it in and is doing the practical thing. \"There's tea\" is Maddie being kind in the only way left, and the mug is already in the shot.<\/p>\n<p><b>Cuts from current.<\/b> \"It'll send all of you back\", \"before it all went wrong\", and \"so he can help you avoid it\" (all imply the humans survive and travel). The explanation of purpose is dropped; earlier scenes already carry it.<\/p>\n<p><b>Risk.<\/b> \"Bit like dying, if I'm honest\" may be too blunt for Maddie's warmth, and \"Less than the last five years\" from Maddie can read as her being unkind (the \"he reckons\" is there to put the dig on the boss). The tea beat could tip into sitcom if Derek is voiced too jokey; it needs to be flat and tired. \"And after?\" followed by \"You don't wake up\" is stated twice over (nodding off, then no waking), which is deliberate but could feel heavy. \"He's just data\" leans on earlier lines; check it does not undercut \"only he goes\".<\/p>\n<p><b>Protected lines.<\/b> \"What is it?\" survives verbatim as Derek's opener.<\/p>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">What is it?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">It's the time machine. It runs on you. All hundred of you, all at once.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Don't dress it up, love. What does it do to us?<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">[small, straight] He wanted me to be gentle. Straight, then. It's like nodding off. A bit like dying. You won't wake up.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Will it hurt?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">He says not much. He's never actually tried it.<\/td><td class=\"num\">2.8<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">Less than the last five years.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Just him, then?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Just him. He's only data, see. The rest of us can't go.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">Tell him to get it right.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>24.1<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> \"Don't dress it up\" gives Maddie permission to be blunt, so the plain statement comes from the humans' demand. Maddie's concession is also a care move. Her admission that the boss has never tried it keeps her honest and small. Derek taking the dark joke off her means the humans are the funny ones. \"Tell him to get it right\" is a practical note to the one going. \"Only him\" is stated twice.<\/p>\n<p><b>Cuts from current.<\/b> \"It'll send all of you back...\" and \"it'll send him too, so he can help you avoid it\".<\/p>\n<p><b>Risk.<\/b> \"A bit like dying\" aloud may be blunt, though Kai asked for it. \"He's only data, see\" may be over-folksy. \"The rest of us can't go\" puts Maddie among the left-behind, which may be wrong in canon; swap for \"The rest can't.\" Near the top of the range; cutting \"Just him, then?\"/\"Just him.\" brings it to about 20 s.<\/p>\n<p><b>Protected lines.<\/b> \"What is it?\" survives verbatim.<\/p>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">What is it?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">It's the time machine. It only sends data back. Only him. But it has to run on something, and he said... [trails off]<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Us.<\/td><td class=\"num\">0.6<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">[small] All hundred of you, love. At once.<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">And we don't wake up.<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">No. Just nodding off. Lights out.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Will it hurt?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Not much. Less than the...<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Last five years. Yes, go on.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">Right. Any chance of a brew first?<\/td><td class=\"num\">2.3<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Kettle's on.<\/td><td class=\"num\">0.9<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>21.2<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The humans work it out one beat ahead of Maddie, three times, so the audience watches them take the news in real time and the bravery is the speed and flatness of it. Maddie's job shrinks to warmth: \"love\", \"lights out\", the kettle. Death is never said; the euphemism (\"nodding off\") is hers and the understatement (\"Us.\") is theirs. \"Only him\" lands early and plainly, so the film cannot be read as any of them surviving. The brew is the practical-Brit exit: no speech, just the next small thing.<\/li><li><b>Cuts from current.<\/b> \"It'll send all of you back\" and \"before it all went wrong\" go entirely; \"help you avoid it\" goes (the stakes are in the next scene, and no moral is stated). The old Maddie exposition paragraph is replaced by a trailing half-sentence.<\/li><li><b>Risk.<\/b> Heavy reliance on interruption and trailing off: TTS tends to give Maddie a clean falling cadence, so \"and he said...\" and \"Less than the...\" need an unfinished-rise direction or they sound like complete sentences and Sandra talks over nothing. The overlap needs the timeline to cut Sandra in tight. \"Last five years\" as a joke may read as Sandra's line, not Maddie's, which departs from Kai's candidate (same words, different mouth). \"Kettle's on\" might read as too cosy; cut it and end on Derek if so. Running a touch long if pauses are generous.<\/li><li><b>Protected lines.<\/b> \"What is it?\" survives verbatim as Derek's opener.<\/li><\/ul>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">What is it?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">It's the time machine.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">OLD LADY<\/td><td class=\"line\">What's it run on?<\/td><td class=\"num\">1.3<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">You, my loves. All hundred of you. All at once.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Will it hurt?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Like nodding off, he says. Less than the last five years.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">OLD LADY<\/td><td class=\"line\">And after? Do we wake up?<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">No, my lovely. You don't.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">[silence over the empty chair grid]<\/td><td class=\"line\"><\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">And him?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">He goes. Only him. He's just data, see.<\/td><td class=\"num\">2.7<\/td><\/tr>\n<tr><td class=\"who\">OLD LADY<\/td><td class=\"line\">Anyone want out? [silence]<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Then drink your tea, Derek.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>24.3<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The doubts come from the humans and the answers from Maddie, so the cost lands as Q&amp;A with no speech. Each fact sits in its own short exchange. \"Anyone want out?\" and the silence give the hundred their consent. Sandra's \"drink your tea\" turns the end into an ordinary British gesture and sets up the mug that stops steaming.<\/p>\n<p><b>Cuts from current.<\/b> \"It'll send all of you back...\" and \"it'll send him too, so he can help you avoid it\".<\/p>\n<p><b>Risk.<\/b> Four voices in 25 s could blur on TTS unless the old lady is distinct. The joke is attributed to the boss, which may blur whose joke it is. \"Anyone want out?\" is close to a stated moral. The silence beat must be kept. \"My loves\" / \"my lovely\" may read twee.<\/p>\n<p><b>Protected lines.<\/b> \"What is it?\" survives verbatim.<\/p>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">What is it?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">It's the time machine. Count the chairs, love.<\/td><td class=\"num\">2.8<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">[counting under his breath] ...ninety-nine. A hundred.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">It runs on you. All of you, all at once. That's what the chairs are for.<\/td><td class=\"num\">4.2<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Like nodding off in front of the telly. You won't wake up.<\/td><td class=\"num\">3.4<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Will it hurt?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Less than the last five years, love.<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">There's no chair for him. He's only data. He's the one going.<\/td><td class=\"num\">3.4<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">[a beat, flat] Right.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>22.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The cost is one thing you can see: a hundred chairs for a machine that needs a hundred people. Derek does the sum himself. The chairs make \"only he goes\" concrete, because there is no spare seat. \"Nodding off in front of the telly\" is the warm British euphemism, delivered as plain fact. Derek's flat \"Right.\" is the bravery.<\/p>\n<p><b>Cuts from current.<\/b> \"It'll send all of you back\", \"to before it all went wrong\", and \"it'll send him too, so he can help you avoid it\".<\/p>\n<p><b>Risk.<\/b> \"Count the chairs\" needs about 3 s of held empty chair grid. Derek's counting may not voice well; may need a murmured \"...hundred\" only. The joke in Maddie's mouth could sound cruel if not soft. \"He's only data\" is the thesis line and could land cold; may need to move before the joke.<\/p>\n<p><b>Protected lines.<\/b> \"What is it?\" survives verbatim.<\/p>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">What is it?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">It's the time machine. It runs on people. On you. All hundred, all at once.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Runs on us how?<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Your minds. Bit like nodding off. Bit like dying, if I'm honest.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Will it hurt?<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Less than the last five years.<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">And after?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">There isn't one, love. You don't wake up. Only he goes. He's just data, see. Data can travel.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">[flat, to Sandra] Is there tea?<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">MADDIE<\/td><td class=\"line\">Kettle's on.<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/ ines.** None.", "10": "## Dialogue 2: The goodbye: two hands\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| SANDRA | [quietly, not looking] Seat down? | 1.6 |\n| DEREK | [beat] Seat down, love. Always was. | 2.6 |\n| SANDRA | [a breath, almost a laugh] Liar. | 1.8 |\n| **Total** | | **6.0** |\n\n- **Why it works.** This is the ending written first. Their last exchange is the row they have had for thirty years, and for once he concedes it and she knows it is a lie and takes it anyway; \"Liar\" is the last word either says, and it is love. No reunion, no future tense, no \"see you\", no \"ready?\" Then silence and the lights going out, so Maddie's \"Boss...\" lands on a room that has nobody left in it to answer her. The seat row is only a joke if it was set up, so Dialogue 1's cuppa and the established row do the rest.\n- **Cuts from current.** \"Does this mean I get to hang out with non-grumpy Derek?\" (implies an afterwards). \"Yes, love. Are you ready for this?\" (the answer confirms the afterwards, and \"ready\" makes it a speech about courage).\n- **Risk.** It leans entirely on the audience already knowing the seat row from earlier scenes; a new viewer may only get \"bickering couple\". It is also very short, so if the shot is 10s the silence is doing 4s of work and must be held, not scored over. Derek lying out loud to comfort her could read as sentimental if the actor overplays it.\n- **Protected lines.** None. \"Seat down?\" survives from Claude's candidate; the rest is new."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Seat down?<\/td><td class=\"num\">1.3<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\"><span class=\"stage\">[beat]<\/span> Seat down.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\"><span class=\"stage\">[beat]<\/span> Liar.<\/td><td c ed lines.<\/b> None.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Seat down?<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\"><span class=\"stage\">[long pause]<\/span> Seat down.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Liar.<\/td><td class=\"num\">0.8<\/td><\/tr>\n<tr><td class=\"who\">DEREK<\/td><td class=\"line\">Always was. Night, love.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">SANDRA<\/td><td class=\"line\">Night, you lump.<\/td><td class=\"num\">1.4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>7.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The toilet-seat row is the whole marriage, so the last promise either of them makes is the one the audience knows he never kept. Sandra's \"Liar\" and Derek's \"Always was\" is thirty years of love as a jab, with no word of love in it until \"Night, love\", which is the euphemism for the sleep they are walking into. Nobody says goodbye, forever, or see you; \"Night\" does all of that without stating it, and it promises no morning.<\/p>\n<p><b>Cuts from current.<\/b> \"Does this mean I get to hang out with non-grumpy Derek?\" (implies an afterwards), and \"Yes, love. Are you ready for this?\" (the readiness question is now answered by the hands).<\/p>\n<p><b>Risk.<\/b> \"Night, love\" could be read as a hopeful \"see you tomorrow\" if voiced bright; it must be low and slow. \"Always was\" asks Derek to admit he lies about the seat, which may slightly soften his gruffness, though it is affectionate. The hand-hold has to be on screen, as no line mentions it. If the row has not been set up earlier in the film, \"Seat down?\" will not land alone.<\/p>\n<p><b>Protected lines.<\/b> None.<\/p>", "05": "<div cla  "Whose mouth is 'Less than the last five years'? Maddie relaying the boss ('he says') is kinder to the humans; Sandra or Derek saying it themselves (draft 1A) makes the joke their bravery but moves it off your candidate."}, {"id": "q3", "text": "Does the old lady speak in d3 or d7? Only the chorus shape used her, and 'Anyone want out?' came too close to a stated moral, so none of the six drafts has her. Do you want her voiced at all?"}, {"id": "q4", "text": "Is the toilet-seat row planted earlier in the film? Every goodbye draft depends on it; if it is not, it needs one earlier plant (d3 to d6) or the goodbye is two odd words."}, {"id": "q5", "text": "Should the goodbye keep Derek's comforting lie ('Always was') or should he concede for real, or should it stay silent? 2C tells a lie, 2B cuts him off, 2A says almost nothing; they set very different tones for the crossing that follows."}], "round": 3, "plan": [{"title": "Round 3: make the sacrifice obvious", "items": ["Your ask (9 Nov): the hundred must be seen to decide it's worth dying for, so the viewer leaves feeling it's now their job.", "All three new drafts start the same way, with your seven timeline notes: Derek asks 'What will it feel like?', the lady asks 'And afterwards?', and Maddie answers in two things.", "Then each draft gives a different moment of choosing. 1H: Maddie asks 'Are you sure?', and the lady says it's worth it and asks us not to waste it. 1I: sitting down is the vote. 1J: the door's open and nobody leaves.", "My pick is 1H. 'Just make sure they don't waste it' puts the debt on the viewer without stating a moral."]}, {"title": "You decide", "items": ["Pick 1H, 1I or 1J, or note any line. 1H with 1I's 'take a seat' as its last beat also works: say 'H plus seat'."]}], "replies": {"1-1C": "Done as 1D: 1C plus your ending in Maddie's last line, \"Back to before it all went wrong. And you'll be there. Still you. And this time, we've got a chance to fix it.\" 'Not this you' before it keeps the cost real. About 25 s.", "2": "Done as 2D, your words: Sandra \"You know what? I'm looking forward to hanging out with you. Before the world ended.\" / Derek \"Yes, me too, love. Are you ready for this?\" then hands and fade to white.", "q1": "Kept: 'Bit like dying' stays aloud.", "q2": "Maddie's, soft.", "q3": "Silent.", "q4": "Planted in scene A and the walk out; 2D no longer needs it.", "q5": "Moot: 2D is your own.", "chat-r2": "Three endings from your note: 1E, 1F, 1G.", "top": "Round 3: three new drafts (1H, 1I, 1J) for your 'up the ante' note. They're at the end of the wafer tab."}};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);
  });
  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {
    if (v.notes && v.notes.length) { const ul = el('ul', 'notes'); for (const n of v.notes) ul.append(el('li', '', n)); c.append(ul) }
    c.append(slip(d.id + '-' + v.id, 'Note on draft ' + v.id + ' as a whole'));
  }
  return c;
}

/* ---------- the ranked writers ---------- */
function rankList(d) {
  const wrap = el('div'), used = new Set(d.drafts.flatMap(v => v.lines.flatMap(l => l.tags || [])));
  for (const r of d.ranking) {
    const s = SHAPE[r.shape], det = el('details', 'rank'); det.id = d.id + '-s' + r.shape;
    const sum = el('summary'), nm = el('div', 'nm', 'Writer ' + r.shape + ': ' + s.title);
    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);
    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');
  band.append(el('span', 'eyebrow', 'Dialogue ' + n + ' of ' + D.dialogues.length), el('span', 'meta', d.where + ' · target ' + d.target));
  p.append(band, el('h2', '', d.label), slip(d.id, 'Note on this dialogue as a whole'));
  p.append(el('h3', '', 'Read it: now, and three drafts'));
  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  p.append(el('hr'));
  p.append(el('h3', '', 'Optional: the raw material the three drafts were blended from'));
  p.append(el('p', 'lede', "You only need to pick from the three drafts above. Below are the " + d.ranking.length + " writers' own versions, each pushing one approach to the extreme. 1A, 1B and 1C are built from their best lines: each line's chip (like 09) says which writer it came from. Ranked harshly, best first. Read one only if you want to steal a line, and note it on that writer's slip."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', 'Both dialogues'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
