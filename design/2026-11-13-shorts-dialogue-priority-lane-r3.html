<style>

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}

section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}

.meta{color:var(--muted);font-size:.9rem}

.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}

.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}

.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}

textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}

.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}

@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}

.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}

<script>
const D = {"page_title": "Priority Lane Dialogue", "title": "Priority Lane round 3: dialogue options", "about": "This page offers three dialogue drafts for the whole of Priority Lane round 3 (about 14 s, beats A to D), synthesised from ten independent writers. Nothing has changed yet: no scene file, script or voice has been touched.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-01-bone-dry.md", "intro": "Cut every line to the fewest words that still carry its beat: one clipped, shoutable phrase per beat, no two crew lines in one breath, and the only full sentence is the minister's. Medical language is reduced to the one number the audience already knows from hospital dramas (BP), and everything else is carried by siren, monitor and the red light. Spoken words are about 5 s, which leaves the flatline and the silence before it to do the work.", "intro_html": "<p>Cut every line to the fewest words that still carry its beat: one clipped, shoutable phrase per beat, no two crew lines in one breath, and the only full sentence is the minister's. Medical language is reduced to the one number the audience already knows from hospital dramas (BP), and everything else is carried by siren, monitor and the red light. Spoken words are about 5 s, which leaves the flatline and the silence before it to do the work.<\/p>"}, {"id": "02", "name": "Picture carries it", "title": "The picture carries it", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-02-picture-carries.md", "intro": "I treated every line as a cost and kept only what the camera cannot say. The crew's desperation is shown by the picture (the monitor tight, the masks, the hands, the siren), and the stop at the red light by the outrider's glove and the ambulance rocking to a halt, so no one needs to narrate either. The words that survive are the ones that give the viewer a number and an order (BP, \"move\") plus the minister's line. Where a line would repeat a shot, the shot wins and the line goes.", "intro_html": "<p>I treated every line as a cost and kept only what the camera cannot say. The crew's desperation is shown by the picture (the monitor tight, the masks, the hands, the siren), and the stop at the red light by the outrider's glove and the ambulance rocking to a halt, so no one needs to narrate either. The words that survive are the ones that give the viewer a number and an order (BP, \"move\") plus the minister's line. Where a line would repeat a shot, the shot wins and the line goes.<\/p>"}, {"id": "03", "name": "Logic said plainly", "title": "The logic said plainly, a character reasons it out loud", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-03-plain-logic.md", "intro": "I let the crew do the arithmetic aloud. A paramedic and the driver state the premises as shouted sums (the minutes he has, the minutes to hospital, so what the road owes us), so that when the ambulance is stopped, the viewer already holds the syllogism and the conclusion is outrage. Nobody states a moral; they state numbers, and the numbers are the argument. Every premise is a clinical or practical fact a crew would really shout, and the minister's line is left to land as the unspoken minor premise.", "intro_html": "<p>I let the crew do the arithmetic aloud. A paramedic and the driver state the premises as shouted sums (the minutes he has, the minutes to hospital, so what the road owes us), so that when the ambulance is stopped, the viewer already holds the syllogism and the conclusion is outrage. Nobody states a moral; they state numbers, and the numbers are the argument. Every premise is a clinical or practical fact a crew would really shout, and the minister's line is left to land as the unspoken minor premise.<\/p>"}, {"id": "04", "name": "Comedy first", "title": "Comedy first, bluntness and bad timing", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-04-comedy-first.md", "intro": "I let the jokes carry the argument. The crew say the hard fact flatly and at the worst moment, so the horror comes from how plain it is. The ambulance half stays dead serious so the crew are heroes. The comedy lives only in the collision: the minister's trivia lands exactly as the crew say something terminal, and one paramedic reacts with a stunned, blunt echo of the trivia. Nobody states a moral. Any new joke below is a proposal for Jack.", "intro_html": "<p>I let the jokes carry the argument. The crew say the hard fact flatly and at the worst moment, so the horror comes from how plain it is. The ambulance half stays dead serious so the crew are heroes. The comedy lives only in the collision: the minister's trivia lands exactly as the crew say something terminal, and one paramedic reacts with a stunned, blunt echo of the trivia. Nobody states a moral. Any new joke below is a proposal for Jack.<\/p>"}, {"id": "05", "name": "Other side wins", "title": "The other side wins", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-05-other-side-wins.md", "intro": "I flipped who sets the terms. The crew are the persuaders (they want through); the outrider and the minister are the resisters. Normally the crew would win or rage. Here the crew concede: the glove goes up and the heroes, who were shouting seconds ago, obey, and then they are polite to the man who is killing their patient. The outrage lands because the people we most want to see fight back do not. Pushed to the extreme: the driver ends by apologising to the minister's car.", "intro_html": "<p>I flipped who sets the terms. The crew are the persuaders (they want through); the outrider and the minister are the resisters. Normally the crew would win or rage. Here the crew concede: the glove goes up and the heroes, who were shouting seconds ago, obey, and then they are polite to the man who is killing their patient. The outrage lands because the people we most want to see fight back do not. Pushed to the extreme: the driver ends by apologising to the minister's car.<\/p>"}, {"id": "06", "name": "Reversal", "title": "Reversal, the listener gets there first", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-06-reversal.md", "intro": "Every crew line is cut off at the exact moment the viewer has already finished the sentence. The crew never says \"he's dying because of the minister\"; they start a question, the minister's trivia lands on top of it, and the audience supplies the answer. The speaker is always one step behind the viewer, so the outrage is the viewer's own and no moral is ever stated. Lines are short, shoutable and clinically real (BP, sats, \"peri-arrest\"); the hero lines come first and fast, then the sentences start breaking.", "intro_html": "<p>Every crew line is cut off at the exact moment the viewer has already finished the sentence. The crew never says \"he's dying because of the minister\"; they start a question, the minister's trivia lands on top of it, and the audience supplies the answer. The speaker is always one step behind the viewer, so the outrage is the viewer's own and no moral is ever stated. Lines are short, shoutable and clinically real (BP, sats, \"peri-arrest\"); the hero lines come first and fast, then the sentences start breaking.<\/p>"}, {"id": "07", "name": "The chorus", "title": "The chorus, side characters voice the doubts", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-07-chorus.md", "intro": "The lead never has to doubt anything out loud. Every question the viewer is about to ask (\"is he dying?\", \"why are we stopped?\", \"is he on the phone?\") is put in the mouth of a side character, in under a second, so the audience hears its own thought said by someone else and gets there first. The paramedic who owns the numbers never reacts to the injustice; the driver, the second medic and a bystander on the pavement do. Pushed to the extreme: nobody ever says the point, but three different voices each say one small piece of it, and the minister's line is the only one that is not a doubt.", "intro_html": "<p>The lead never has to doubt anything out loud. Every question the viewer is about to ask (\"is he dying?\", \"why are we stopped?\", \"is he on the phone?\") is put in the mouth of a side character, in under a second, so the audience hears its own thought said by someone else and gets there first. The paramedic who owns the numbers never reacts to the injustice; the driver, the second medic and a bystander on the pavement do. Pushed to the extreme: nobody ever says the point, but three different voices each say one small piece of it, and the minister's line is the only one that is not a doubt.<\/p>"}, {"id": "08", "name": "Place is argument", "title": "The place is the argument", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-08-place-is-argument.md", "intro": "Every line is anchored to one concrete detail of where they are: the hospital is in sight, at the end of the road, a hundred metres away, with its blue A&E sign lit through the rain. The crew say the distance out loud, so the viewer measures the delay in metres, not in speeches, and the stop at the red light is outrageous because the destination is visible through the windscreen. Nobody states a moral; the geography does it. The minister's line is untouched, and the monitor gets the last word in silence.", "intro_html": "<p>Every line is anchored to one concrete detail of where they are: the hospital is in sight, at the end of the road, a hundred metres away, with its blue A&amp;E sign lit through the rain. The crew say the distance out loud, so the viewer measures the delay in metres, not in speeches, and the stop at the red light is outrageous because the destination is visible through the windscreen. Nobody states a moral; the geography does it. The minister's line is untouched, and the monitor gets the last word in silence.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft, numbers as a countdown", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-09-borrowed-craft.md", "intro": "I stole four devices from things that already compress persuasion. From ER-style medical drama (the Crichton-era overlapping, jargon-and-numbers pace, which Casualty and Holby also run on) I took the idea that the viewer need not understand the words, only the urgency, so every crew line is a number or an order. From Hitchcock's bomb-under-the-table (suspense is the audience knowing what the characters do not) I made the minister the oblivious party while the viewer holds both rooms. From the Godfather baptism cross-cut (a sacrament set against killings, joined by sound) I let the minister's trivial line land over the dying monitor's beeping. From the Kuleshov effect (the cut gives the meaning) I put the flatline straight after his line with no word to explain it. The extreme: the crew's numbers fall each time they speak, so the dialogue is a countdown, and the swearing is rhythm in the way The Thick of It uses it, not decoration.", "intro_html": "<p>I stole four devices from things that already compress persuasion. From ER-style medical drama (the Crichton-era overlapping, jargon-and-numbers pace, which Casualty and Holby also run on) I took the idea that the viewer need not understand the words, only the urgency, so every crew line is a number or an order. From Hitchcock's bomb-under-the-table (suspense is the audience knowing what the characters do not) I made the minister the oblivious party while the viewer holds both rooms. From the Godfather baptism cross-cut (a sacrament set against killings, joined by sound) I let the minister's trivial line land over the dying monitor's beeping. From the Kuleshov effect (the cut gives the meaning) I put the flatline straight after his line with no word to explain it. The extreme: the crew's numbers fall each time they speak, so the dialogue is a countdown, and the swearing is rhythm in the way The Thick of It uses it, not decoration.<\/p>"}, {"id": "10", "name": "Ending first", "title": "Ending first, work backwards", "file": "design/2026-11-13-shorts-dialogue-priority-lane-r3/shape-10-ending-first.md", "intro": "I wrote the last ten seconds first and let each earlier beat exist only to make that ending inevitable. The ending is a sentence cut off mid-number by the flatline tone; silence from 11 s means the viewer finishes the sentence themselves. Working backwards, the minister's line arrives while the crew are still shouting numbers, and the red-light stop is the one moment the crew's words are about the stop, not the patient. The opening plants \"BP 60 over 30\" so the cut-off figure reads as a fall from it.", "intro_html": "<p>I wrote the last ten seconds first and let each earlier beat exist only to make that ending inevitable. The ending is a sentence cut off mid-number by the flatline tone; silence from 11 s means the viewer finishes the sentence themselves. Working backwards, the minister's line arrives while the crew are still shouting numbers, and the red-light stop is the one moment the crew's words are about the stop, not the patient. The opening plants \"BP 60 over 30\" so the cut-off figure reads as a fall from it.<\/p>"}], "dialogues": [{"id": "1", "label": "Priority Lane round 3", "where": "BadCode Short #1, beats A-D (whole short)", "scene": "docs/stories/shorts/priority-lane", "target": "about 14 s total; spoken words 7-9 s max; last 3 s flatline with no words", "now_from": "docs/misc/2026-11-13-meeting.md and docs/stories/shorts/priority-lane/brief.md", "now": [{"who": "PARAMEDIC 1", "line": "BP 60 over 30, we're gonna lose him!"}, {"who": "DRIVER", "line": "Come on, get out of the way!"}, {"who": "PARAMEDIC 2", "line": "What's he doing?!"}, {"who": "MINISTER", "line": "[on the phone, crossing in front of the ambulance] I said raspberry-shaped hors d'oeuvres!"}, {"who": "MONITOR", "line": "[flatline]"}], "drafts": [{"id": "1A", "name": "The quiet stop", "length": "about 14 s", "total": "~6.8 s spoken", "bet": "The picture and the silence do the outrage; fewer words make the minister's line the loudest thing in the short.", "lines": [{"who": "PARAMEDIC 1", "line": "BP 60 over 30, we're gonna lose him!", "tags": ["Kai", "01", "02", "07"], "s": "2.2"}, {"who": "PARAMEDIC 2", "line": "[overlapping] Oxygen dropping!", "tags": ["Kai", "05", "10"], "s": "0.9"}, {"who": "DRIVER", "line": "Get the f*** out of the way!", "tags": ["02", "04", "09"], "s": "1.5"}, {"who": "(beat B)", "line": "[no line: glove up, siren dies, rain, monitor beeping fast]", "tags": ["02"], "s": "0"}, {"who": "MINISTER", "line": "[on the phone, through the glass] I said raspberry-shaped hors d'oeuvres!", "tags": ["Kai", "all"], "s": "2.2"}, {"who": "MONITOR", "line": "[flatline, silence, black, logo]", "tags": ["all"], "s": "0"}], "notes": ["Shape 02 spine; Kai's 'oxygen dropping' added back so the crew do not feel under-voiced. 'What's he doing?!' is cut: the glove asks it.", "Protected lines kept verbatim. Risk: needs a tight monitor shot in A and the siren must drop out cleanly at the stop. Spare seconds are the breathing room."]}, {"id": "1B", "name": "The countdown", "length": "about 14 s", "total": "~8.3 s spoken", "bet": "Escalating real numbers and a stake ('two minutes out') make the stop cost something, and a cut-off figure lets the viewer finish the death themselves.", "lines": [{"who": "PARAMEDIC 1", "line": "BP 60 over 30! F***ing hurry up, we're gonna lose him!", "tags": ["Kai", "10", "04"], "s": "3.0"}, {"who": "PARAMEDIC 2", "line": "[overlapping] Sats dropping, he's peri-arrest!", "tags": ["04", "10", "06"], "s": "1.6"}, {"who": "DRIVER", "line": "Two minutes out! Get the f*** out of the way!", "tags": ["10", "03"], "s": "2.2"}, {"who": "PARAMEDIC 2", "line": "[the glove] Why have we stopped?!", "tags": ["10", "03", "01"], "s": "1.0"}, {"who": "MINISTER", "line": "[muffled through the glass] I said raspberry-shaped hors d'oeuvres!", "tags": ["Kai", "all"], "s": "2.2"}, {"who": "PARAMEDIC 1", "line": "[quiet, to the patient] Fifty over twen--", "tags": ["10"], "s": "0.8"}, {"who": "MONITOR", "line": "[flatline tone cuts the word; silence; black; logo]", "tags": ["10", "all"], "s": "0"}], "notes": ["Trim first if tight: 'Two minutes out!'. 'Fifty over twen--' is a proposal for Jack and its numbers need a medical eye; if Suno smooths it, cut it in the edit.", "Protected lines kept verbatim. Risk: heavy overlap may muddy the numbers; the last fragment may feel like one beat too many before the tone."]}, {"id": "1C", "name": "We can see it", "length": "about 14 s", "total": "~8.3 s spoken (overlaps)", "bet": "A visible destination makes the stop outrageous without any moral: the hospital is in the windscreen.", "lines": [{"who": "PARAMEDIC 1", "line": "BP 60 over 30, sats dropping, we're gonna lose him!", "tags": ["Kai", "08"], "s": "2.6"}, {"who": "PARAMEDIC 2", "line": "[bagging him, pointing forward] A&E's at the end of this road, go go go!", "tags": ["08"], "s": "1.8"}, {"who": "DRIVER", "line": "Get the f*** out of the way!", "tags": ["08", "02"], "s": "1.2"}, {"who": "PARAMEDIC 2", "line": "[the glove up] We can SEE it! It's right there!", "tags": ["08"], "s": "1.4"}, {"who": "MINISTER", "line": "[through the glass, crossing slowly] I said raspberry-shaped hors d'oeuvres!", "tags": ["Kai", "all"], "s": "2.2"}, {"who": "MONITOR", "line": "[flatline, silence, black, logo]", "tags": ["all"], "s": "0"}], "notes": ["Shape 08. Needs the lit A&E sign in the windscreen still, or the lines lie. 'We can SEE it' is a new line, a proposal for Jack.", "If Suno will not overlap lines 3 and 4, drop 'It's right there!'. 'Two minutes' was removed as unmeasured guesswork. Protected lines kept verbatim."]}], "ranking": [{"rank": 1, "shape": "02", "length": "~6 s", "verdict": "Best discipline. Trusts the picture, keeps the flatline silent, no invented medicine. Fails only by being thin: a crew who barely speak risk under-delivering Kai's ER drama."}, {"rank": 2, "shape": "08", "length": "~10 s raw", "verdict": "'We can SEE it' states the outrage through geography, not a moral. Fails: runs long, and depends on a still we have not made."}, {"rank": 3, "shape": "10", "length": "~8.3 s", "verdict": "Strongest ending (the viewer finishes the number). Fails: invented 'fifty over twenty', Suno may not cut mid-word, too much overlap under the minister."}, {"rank": 4, "shape": "09", "length": "~9 s", "verdict": "Real craft logic, numbers falling. Fails: too many lines, 'hurry up' twice reads as filler, mush risk."}, {"rank": 5, "shape": "04", "length": "~8 s", "verdict": "Good panic opening. Fails: '...Raspberry?' echo tells the joke and risks mocking the crew; arch delivery kills the heroes."}, {"rank": 6, "shape": "01", "length": "~5.8 s", "verdict": "Right length, clean. Fails: drops all swearing and escalation, so the crew read polite; the driver's 'Move!' is too thin."}, {"rank": 7, "shape": "06", "length": "~8 s", "verdict": "Cut-off sentences are real panic. Fails: invents 'ten minutes', relies on TTS honouring dashes, and the broken line states the point."}, {"rank": 8, "shape": "03", "length": "~8.7 s", "verdict": "Clear stakes. Fails: the shouted sum ('four minutes') is not how paramedics talk and it argues the point aloud, which is the lecture we avoid."}, {"rank": 9, "shape": "07", "length": "~7.8 s", "verdict": "Chorus idea is neat. Fails: five voices in one Suno track will blur, and the bystander and 'Is he on the phone?' hand-hold the joke."}, {"rank": 10, "shape": "05", "length": "~8.9 s", "verdict": "Fails hardest: a crew that says 'Yes, sir' and 'Take your time, sir' kills the desperate heroes Kai asked for and states the moral through sarcasm."}], "protected": {"columns": ["BP 60 over 30", "I said raspberry-shaped hors d'oeuvres!"], "rows": {"1A": ["BP 60 over 30", "I said raspberry-shaped hors d'oeuvres!"], "1B": ["BP 60 over 30", "I said raspberry-shaped hors d'oeuvres!"], "1C": ["BP 60 over 30", "I said raspberry-shaped hors d'oeuvres!"]}}, "shapes": {"01": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 | [shouting over siren] BP 60 over 30! We're losing him! | 2.0 |\n| DRIVER | Move! | 0.4 |\n| PARAMEDIC 2 | [at the windscreen, disbelieving] Why's he stopping us?! | 1.0 |\n| MINISTER | [on the phone, through the glass] I said raspberry-shaped hors d'oeuvres! | 2.4 |\n| MONITOR | [flatline tone, no words, 3 s of silence from the crew] | 0.0 |\n| **Total** | | **5.8** |\n\n**Why it works.** Five seconds is enough to believe a man is dying if the audience has seen a hundred ER scenes: \"BP 60 over 30\" is the number, \"losing him\" is the stake, and the monitor sells the rest. \"Move!\" is one syllable the driver can scream over a siren, so it reads as a reflex rather than a line. The crew never explain the red light; the raised glove is on screen and the paramedic's \"Why's he stopping us?!\" is a question, not an exposition, which lets the outrage belong to the viewer. The minister's line then arrives into a gap with nothing competing with it, so the triviality is louder than any amount of crew dialogue would have made it. The final three seconds contain no words at all, so the audience supplies \"he's going to die\" themselves, which is what Kai wants. No moral, no narrator.\n\n**Cuts from current.** \"we're gonna\" becomes \"we're\" (faster to shout); \"Come on, get out of the way!\" becomes \"Move!\"; \"What's he doing?!\" becomes \"Why's he stopping us?!\" (one more word, but it names the outrage: they are being stopped, not just delayed). No swearing in this version, which is the edge to test: Kai's swearing (\"get the f*** out of the way\", \"f***ing hurry up\") is dropped entirely to see whether the shorter, cleaner shout is stronger. Also cut: oxygen dropping, sats, \"look, we're gonna lose him, hurry up\".\n\n**Risk.** Kai asked for the swearing and for the crew to feel like heroes in trouble; a bone-dry cut may feel under-written and too polite, and \"Move!\" alone may not read as the driver's desperation without the sweary escalation. With so few words, the 0-5 s window might not establish \"dying\" if the Suno voices are not shouty enough, and the whole short rests on the monitor and the acting. Suno speech mode may also slur a 0.4 s line. \"Why's he stopping us?!\" may be read as the crew being angry at the outrider rather than at the system, which is fine. Fallback: restore \"get the f*** out of the way\" for the driver (about 1.3 s) and the total is still under 7 s.\n\n**Protected lines.** \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim. \"BP 60 over 30\" survives verbatim inside the first line.", "02": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 (A, 0-3 s, over the monitor close-up) | [shouted, hands pumping the bag] BP 60 over 30, we're gonna lose him! | 2.2 |\n| DRIVER (A, ~3-4.5 s, siren wailing) | [yelling at the windscreen] Get the f*** out of the way! | 1.5 |\n| (B, 5-7 s) | [no line. The glove comes up, the ambulance lurches to a stop, the siren dies mid-wail; only rain, the monitor beeping fast, a paramedic's breath] | 0 |\n| MINISTER (C, 7-10 s, heard through the windscreen glass, on the phone) | I said raspberry-shaped hors d'oeuvres! | 2.2 |\n| MONITOR (D, 11-14 s) | [beeping slows, then one long flatline tone; silence; black; logo] | 0 |\n| **Total spoken** | | **5.9** |\n\n**Why it works.** Three spoken lines in 14 seconds, and every one earns its place. The first gives the viewer the number and the verdict in two seconds, so \"dying\" is settled before the light changes. The driver's swear is the one human reaction the picture cannot show, and it makes the next beat hurt. Then we take the speech away. \"What's he doing?!\" is cut because the audience is already asking it, looking at the glove (relied-on shot: the OUT1-c outrider with the raised hand, beat B). Taking the siren out at the stop gives the held beat a silence of its own, so the minister's line arrives into a quiet room and sounds more absurd, and it needs no lip-sync because it comes through the glass (the bolder through-the-windscreen shot, beat C, with his car inches from the bonnet). The flatline lands on what the viewer has just watched: a man on the monitor, a minister outside, and nothing said that could tell them what to feel. Silence is the only edit that cannot be argued with. It also keeps us the sarcastic observer Kai asked for, with no one explaining the joke.\n\n**Cuts from current.** PARAMEDIC 2: \"What's he doing?!\" (the glove and the stop say it). The longer \"sats dropping\" and \"oxygen dropping\" expansions from Kai's wider note (the monitor tight in shot A carries oxygen and sats as numbers on screen). Any second paramedic speech at all: the second paramedic acts, never speaks. The \"look, we're gonna lose him, hurry up\" repeat (the first line already says it). About 3 s of speech overall against the 7-9 s allowed, which is deliberate: the spare seconds go to the held beat and the flatline.\n\n**Risk.** The picture has to be doing the work, and if shot A is a calm wide it fails. The monitor must be tight, the crew visibly frantic, and the BP numbers legible on the screen (60/30, falling). If the Suno siren will not drop out cleanly at the stop, beat B loses its silence and the minister's line has to fight it. Fewer lines also leave less room for Kai's \"ER-level drama\": he may feel the crew are under-voiced, and one more shout (Option: PARAMEDIC 2 \"Oxygen dropping!\" in A) is the obvious thing to add back. The driver's swear and the minister's silent entrance both rely on Suno speech mode landing in a gap, so the take needs checking for crosstalk. Medical plausibility is safe: BP readings and \"lose him\" are real paramedic talk and nothing is invented.\n\n**Protected lines.** \"BP 60 over 30\" survives verbatim inside the first line. \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim and unchanged; it is the only joke and it is Jack's. The only altered line is the driver's, trimmed to Kai's own words (\"get the f*** out of the way\"), and PARAMEDIC 1's \"we're gonna lose him\" is kept as in the current lines.", "03": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 | [over the patient, shouting over the siren] BP 60 over 30, he's got four minutes! | 2.4 |\n| DRIVER | [overlapping, eyes on the road] Six minutes out! Get the f*** out of the way! | 2.2 |\n| PARAMEDIC 2 | [as the ambulance jolts to a halt, red light, outrider's glove] We've stopped! Why have we stopped?! | 1.6 |\n| MINISTER | [on the phone, crossing in front of the ambulance] I said raspberry-shaped hors d'oeuvres! | 2.5 |\n| MONITOR | [flatline tone, silence, black, logo] | 0 (3 s silent hold) |\n| **Total spoken** | | **8.7** |\n\n- **Why it works.** In five seconds the viewer gets a sum they can do without thinking: four minutes of life, six minutes of road, so every second matters and the crew are plainly heroes racing a clock they are already losing. That makes the red light land as outrageous because the maths has just been put in the viewer's head, and \"We've stopped!\" is the answer to the sum. Then the minister's trivia arrives as the only other number in the scene: nothing. No moral is stated and nobody names the decision-maker; the viewer completes the logic themselves. Four-minutes-versus-six also gives Suno clear, shoutable beats, and the shortfall is built in before the stop, so the flatline feels earned rather than arbitrary.\n- **Cuts from current.** \"We're gonna lose him\" is replaced by the countdown (it says the same thing with a number). \"Come on\" is dropped from the driver for the swear in Kai's own words. \"What's he doing?!\" becomes \"Why have we stopped?!\", which asks about the stop rather than the outrider, so it reads as outrage at the delay and not confusion.\n- **Risk.** The sum is the whole device: \"four minutes\" and \"six minutes\" are invented numbers, and \"he's got four minutes\" is a bit blunt for a real paramedic (they would more likely say \"he's peri-arrest\"), so it may read as scripted. Overlapped lines two and three may smear in Suno and lose the numbers. The minutes are never confirmed, so a viewer could read the flatline as bad luck rather than the delay; if the red light is longer than the gap, it is arithmetically fine, but only if the picture holds the stop for a visible beat. A cleaner clinical swap is \"he's peri-arrest\" for \"he's got four minutes\", at the cost of the countdown.\n- **Protected lines.** \"BP 60 over 30\" survives verbatim. \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim, unaltered. Kai's \"get the f*** out of the way\" survives, with \"Six minutes out!\" added in front of it. Any new joke here is a proposal for Jack; none is proposed.", "04": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 | [shouting over siren, 0-3 s] BP 60 over 30, f***ing hurry up, we're gonna lose him! | 3.0 |\n| PARAMEDIC 2 | [overlapping, flat and fast] Sats seventy-eight and dropping. He's peri-arrest. | 2.0 |\n| DRIVER | [5 s, at the glove] Get the f*** out of the way! | 1.5 |\n| MINISTER | [on the phone, crossing in front] I said raspberry-shaped hors d'oeuvres! | 2.2 |\n| PARAMEDIC 2 | [stunned, quiet, under the minister's last word] ...Raspberry? | 0.8 |\n| MONITOR | [11-14 s: one long flatline tone, then silence, then the logo] | 0 |\n| **Total spoken** | (P2's sats line overlaps P1, so about 2.3 s of it is on the clock) | **about 8.0** |\n\n**Why it works.** The first five seconds are pure panic with real numbers, so the viewer believes he is dying. The driver's line makes the red light outrageous. Then the joke is a collision: a man dies on one side of the glass and on the other a man is furious about fruit-shaped canapes. Paramedic 2's quiet \"...Raspberry?\" is the bluntness beat: the crew, who have just said \"peri-arrest\", repeat the trivia back like it was the only thing they could not process. The audience supplies the rest. The flatline is bare and silent, so the laugh dies in their throat and they say \"what, he's going to die\". No moral, no narrator.\n\n**Cuts from current.** \"What's he doing?!\" is gone, replaced by the sharper echo \"...Raspberry?\" because reacting to the line is funnier than asking an open question. \"Come on, get out of the way!\" is now Kai's own sweary line. \"We're gonna lose him\" moves into the BP line. A clinical sats/peri-arrest line is added.\n\n**Risk.** The echo can read as mockery of the crew if it is played arch. It must be hushed and stunned, not a gag line. Overlap of P1 and P2 in a Suno speech track may turn to mush, and the minister's line must stay audible over the siren. If Jack finds the echo too cute, delete it and the short still works. Medical terms are real UK paramedic language (BP, sats, peri-arrest); none are invented.\n\n**Protected lines.** \"BP 60 over 30\" survives verbatim inside P1's line. \"I said raspberry-shaped hors d'oeuvres!\" is verbatim and untouched.", "05": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 | BP 60 over 30! Fucking hurry up, we're gonna lose him! | 2.0 |\n| PARAMEDIC 2 | [overlapping] Oxygen dropping, sats dropping! | 0.9 |\n| DRIVER | Get the fuck out of the way! | 1.2 |\n| OUTRIDER | [muffled through the rain, glove raised] Hold there. | 0.7 |\n| DRIVER | [deflating, the fight gone out of him] ...Yes, sir. | 0.8 |\n| MINISTER | [on the phone, crossing in front of the ambulance] I said raspberry-shaped hors d'oeuvres! | 2.2 |\n| DRIVER | [through the windscreen, small, polite] Take your time, sir. | 1.1 |\n| MONITOR | [flatline, no words, held to black and the logo] | 0 |\n| **Total spoken** | (P2 overlaps P1, so about 1.0 s is shared) | **8.9** |\n\n- **Why it works.** In five seconds the crew are heroes at full volume. Then a single raised glove makes the loudest man in the vehicle say \"Yes, sir,\" and that submission is the outrage: the viewer wants him to floor it and he cannot, because the other side holds the terms. The minister never even sees the crew; he is on the phone, so the resisting side wins without noticing it was a contest. The driver's last line is the only joke: it is sarcastic observation, not a moral, and it sits one second before the monitor goes flat, so the politeness curdles. \"What, he's going to die\" comes from the viewer, not from us.\n- **Cuts from current.** \"Come on, get out of the way!\" becomes Kai's harder \"Get the fuck out of the way!\". \"What's he doing?!\" is removed (the crew no longer question the stop; they accept it, which is the shape). The outrider gets a two-word line. New: \"Yes, sir.\" and \"Take your time, sir.\" Both are proposals for Jack, who writes the jokes.\n- **Risk.** A crew that obeys can read as the real-life crew being cowardly, and it works against Kai's wish for desperate heroes in beat B. A Suno speech track may make \"Take your time, sir.\" sound sincere rather than bitter, so the delivery tag matters. The outrider voice has to be audible over the siren in 0.7 s. The driver's politeness could blunt the flatline if it lands as a gag rather than a wound. Fallback: keep \"Yes, sir\" and cut \"Take your time, sir.\"\n- **Protected lines.** \"I said raspberry-shaped hors d'oeuvres!\" is verbatim and fixed. \"BP 60 over 30\" is verbatim inside Paramedic 1's line, with Kai's \"fucking hurry up, we're gonna lose him\" added back from the meeting. Medical terms (BP, sats, oxygen) are real UK paramedic language; nothing medical is invented.", "06": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 | [shouting over the siren, hands on the patient] BP 60 over 30 — we're gonna lose him! | 2.4 |\n| PARAMEDIC 2 | [overlapping, eyes on the monitor] Sats dropping — seventy-eight — he's peri-arrest! | 1.6 |\n| DRIVER | [A: pulling up at the red, outrider's glove raised] Oh you are fucking joking — get the fuck out of the way! | 2.0 |\n| PARAMEDIC 2 | [B: staring through the windscreen] They're not seriously gonna — he's got ten minutes, he's — | 1.6 |\n| MINISTER | [C: on the phone, crossing slowly in front] I said raspberry-shaped hors d'oeuvres! | 2.0 |\n| MONITOR | [D: flatline tone, no voices, siren cuts out; hold, black, logo] | 0.0 spoken |\n| **Total spoken** | (overlap of lines 1-2 not counted twice; flatline and silence 3 s follow) | **8.0** |\n\n- **Why it works.** The viewer is told he is dying in five seconds by two people who do not stop talking, and then the crew run into a wall: the driver's swear is the only complete thought, and Paramedic 2 starts two sentences (\"they're not seriously gonna\", \"he's got ten minutes, he's\") that the audience finishes in their own head before the minister's line arrives. The minister's trivia then lands as the answer nobody asked for, in the one gap the crew have left open. Cut-off sentences also read as real panic, since people under pressure abandon grammar, and they keep every crew line under three seconds for Suno. The flatline is silent so the audience, not the speaker, says \"he's going to die\".\n- **Cuts from current.** \"What's he doing?!\" becomes the longer broken sentence \"They're not seriously gonna — he's got ten minutes, he's —\". \"Come on, get out of the way!\" becomes \"Oh you are fucking joking — get the fuck out of the way!\" (Kai's own driver words). Added: a short overlapping oxygen line from Paramedic 2 (\"sats dropping\", Kai's \"oxygen dropping\" made clinical). Dropped: Kai's \"hurry up, we're gonna lose him guys\" second pass; the single \"we're gonna lose him\" carries it.\n- **Risk.** The cut-off sentences must be performed as interrupted by the scene, not as a TTS glitch: Suno may finish a trailing dash or read it as a flat stop, and the dash line at 1.6 s is the likeliest to be mangled. \"Ten minutes\" is a medical claim; it is plausible for a critical patient but is an invention, so Jack or Kai should confirm it or swap it for \"he's got no time\". The overlap in A needs the Suno track to layer, or the two lines will play in series and push the total to about 9.5 s. Swearing and shouting over a siren may reduce intelligibility of \"BP 60 over 30\"; keep it first, clear and slowest.\n- **Protected lines.** \"BP 60 over 30\" survives verbatim (written \"BP sixty over thirty\" for voicing only). \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim, untouched, as the last spoken words in the short; nothing is allowed to speak after it but the monitor.", "07": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 | BP 60 over 30, we're gonna lose him! | 2.2 |\n| PARAMEDIC 2 | [over, on the mask, urgent] Sats seventy-eight and dropping! | 1.2 |\n| DRIVER | [shouting forward, siren] Get out of the way! | 1.2 |\n| OUTRIDER | [outside, muffled by rain] Hold it there! | 0.7 |\n| PARAMEDIC 2 | What's he doing?! | 1.0 |\n| MINISTER | [on the phone, crossing in front of the ambulance] I said raspberry-shaped hors d'oeuvres! | 2.5 |\n| DRIVER | [low, to the windscreen] Is he on the phone? | 1.3 |\n| BYSTANDER | [under an umbrella at the kerb, to nobody] Oh, you're joking. | 1.0 |\n| MONITOR | [flatline, no words, 3 s of silence, black, logo] | 0 |\n| **Total** | Sum of lines 11.1 s; overlaps (P2 over P1, driver over P1, driver and bystander under the minister) take off about 3.3 s; **about 7.8 s of speech** on the timeline, flatline silent | **~7.8** |\n\n- **Why it works.** The crew do not editorialise, they work, so they stay heroes, and the doubt comes in small human reactions from people who are not the lead. The driver asking \"Is he on the phone?\" and the bystander's \"Oh, you're joking\" are the viewer's own thoughts spoken at the exact moment the minister crosses, which makes the audience complicit in the outrage without any narrator, caption or moral. Because the chorus has already said the outrage, the silence after it is free to carry only one thought: he is going to die. The \"what, he's going to die\" reaction Kai wants is left unsaid and unspoken by anyone.\n- **Cuts from current.** The driver's original \"Come on\" is shortened to the plain \"Get out of the way!\" (Kai's own wording). \"What's he doing?!\" moves from the driver slot to Paramedic 2 so the driver keeps one line for the phone doubt. Nothing from the monitor is spoken: \"oxygen dropping\" is dropped to keep the speech under 9 s.\n- **Risk.** Too many voices for one Suno speech track: five speakers (one outside the ambulance) may blur into the same voice, and the muffled outrider and bystander may not come out distinct, so they may need to be cut or become bare sound. The bystander is also a new invented character with a joke-adjacent line (\"Oh, you're joking\"), which is a proposal for Jack, not a decision. Chorus doubt also risks over-explaining: if the viewer already got the point at the red light, the driver's \"Is he on the phone?\" is a second nudge and could read as hand-holding. Medical terms used: BP and sats (oxygen saturation, normal UK paramedic shorthand); seventy-eight is a plausible low reading, nothing else is invented.\n- **Protected lines.** \"BP 60 over 30, we're gonna lose him!\" survives verbatim (Kai's \"f***ing hurry up\" is not added here; swear it in if Kai wants it, e.g. the driver's \"Get the f*** out of the way!\"). \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim, Jack's line, untouched.", "08": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 | [over the patient, shouting over the siren] BP 60 over 30, sats dropping, we're gonna lose him! | 2.8 |\n| PARAMEDIC 2 | [bagging him, pointing forward] A&E's at the end of this road, two minutes, go go go! | 2.2 |\n| DRIVER | [leaning on the horn] Get the f*** out of the way! | 1.2 |\n| PARAMEDIC 2 | [stunned, the glove up in the windscreen] We can SEE it! It's right there! | 1.6 |\n| MINISTER | [through the glass, on the phone, crossing slowly] I said raspberry-shaped hors d'oeuvres! | 2.4 |\n| MONITOR | [flatline tone, held; no words; black; logo] | 0 |\n| **Total** | | **10.2 spoken (overlap on lines 3 and 4 and the siren bed brings it to about 8.5 s of track time)** |\n\n**Why it works.** The place does the persuading. \"A&E's at the end of this road\" plants the destination in the first five seconds, so when the outrider's glove stops them the viewer already knows they are two minutes from help and can see the sign glowing in the rain. \"We can SEE it\" says the outrage in four words with no speech about fairness and no narrator, which is Kai's \"sarcastic observers, not the authority\". It names no decision-maker and no technology; the car crossing in front is the decision-maker, on screen. The minister's raspberry line then lands against that sign: the viewer compares the two distances, a hundred metres of road against a canapé order. The flatline stays silent, so the audience supplies \"he's going to die\" themselves.\n\n**Cuts from current.** \"Come on, get out of the way!\" becomes Kai's harder \"Get the f*** out of the way!\". \"What's he doing?!\" is replaced by \"We can SEE it!\" because the place detail is a stronger complaint than a question. \"We're gonna lose him\" survives only inside the first line. Nothing new is added to the minister.\n\n**Risk.** It runs about 1.5 s over the 7-9 s spoken target if nothing overlaps, so lines 3 and 4 must be shouted over each other and the siren; if Suno will not overlap, drop \"two minutes\" from line 2. The \"sign in sight\" claim needs the stills: the windscreen shot must show the lit A&E sign, or the lines lie. \"Two minutes\" is a plausible, not a measured, ambulance estimate, so keep it as shouted guesswork. The medical terms (BP, sats) are real UK paramedic language and I invented none. \"We can SEE it\" could read as comedic rather than desperate if delivered flat, so it needs a cracked, shouted take. Joke-wise the only new material is \"We can SEE it\", which is a proposal for Jack.\n\n**Protected lines.** \"BP 60 over 30\" survives verbatim. \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim, with only the stage direction (through the glass, crossing) added around it.", "09": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 | [shouting over the siren, bagging the patient] BP 60 over 30! | 1.1 |\n| PARAMEDIC 2 | [eyes on the monitor, overlapping] Sats seventy-six and dropping, oxygen dropping! | 1.5 |\n| PARAMEDIC 1 | Stay with me, mate. [to the driver] We're gonna lose him, hurry up! | 1.5 |\n| DRIVER | [leaning on the horn, up front] Get the fuck out of the way! | 1.0 |\n| PARAMEDIC 2 | [the ambulance lurches and stops, red light, outrider's glove] What's he doing?! | 0.8 |\n| PARAMEDIC 1 | [low, to the patient, pressure is no longer reading] Come on, come on, hurry up. | 0.9 |\n| MINISTER | [on the phone, heard through the windscreen as his car crosses] I said raspberry-shaped hors d'oeuvres! | 2.3 |\n| MONITOR | [flatline tone, then nothing, then black, then the logo] | 0 (3 s silent) |\n| **Total** | | **9.1 spoken, 3 s silent** |\n\nNote: lines overlap by design (ER style), so the speech runs about 8 s of clock time. If Suno needs it tighter, drop the second Paramedic 1 line at 5.5 s first.\n\n- **Why it works.** The viewer cannot check the medicine, so numbers and shouting do the persuasion: ER's trick is that urgency reads before comprehension. Each crew line is smaller and more desperate than the last (60 over 30, then sats, then \"pressure's gone\" in the last whisper), so the dialogue itself counts down before any screen does. The red-light stop is made outrageous by contrast: Paramedic 2's \"What's he doing?!\" is a question the audience answers for themselves as the minister's car crosses. The minister is Hitchcock's oblivious table, laughing over the bomb: he never knows, the audience knows everything. His line is delivered on top of the monitor's beeps, the baptism cross-cut done by ear: the sacred and the trivial in one soundscape. Then silence and black (Kuleshov): with nothing said, the audience writes the moral themselves, which is Kai's \"what, he's going to die\".\n- **Cuts from current.** \"Come on, get out of the way!\" becomes the Driver's sweary version (Kai's own words); Paramedic 1 gains a quiet \"come on\" after the stop so the crew stays heroic while held; no line explains the red light, and nothing is said after the minister.\n- **Risk.** Overlap can turn to mush in a single Suno speech track, so the numbers may not be intelligible; \"76\" is the first thing to go wrong, and it is fine if it does as long as the rhythm survives. The quiet \"pressure is no longer reading\" beat needs the monitor tone under it, or it vanishes. \"Hurry up\" appears twice, deliberately, but could read as filler. Clinical plausibility: sats and BP are real readouts and \"oxygen dropping\" is Kai's own; nothing invented beyond the numbers, which are for Kai or a clinician to confirm are plausible together.\n- **Protected lines.** \"BP 60 over 30\" survives verbatim as the opening line. \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim and is Jack's; only the stage direction (heard through the windscreen) is added. Neither has a new joke attached; the only new material is crew language, which is a proposal for Jack.", "10": "## Dialogue 1: Priority Lane round 3, the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| PARAMEDIC 1 (0.0) | BP 60 over 30! F***ing hurry up, we're gonna lose him! | 3.0 |\n| PARAMEDIC 2 (2.2, overlaps) | Sats are dropping! He's peri-arrest! | 1.8 |\n| DRIVER (4.0) | Two minutes out! Hold on! | 1.2 |\n| DRIVER (5.2, light red, glove up) | Get the f*** out of the way! | 1.5 |\n| PARAMEDIC 2 (5.8, overlaps) | Why have we stopped?! Why have we stopped?! | 1.3 |\n| MINISTER (7.2, muffled through glass) | I said raspberry-shaped hors d'oeuvres! | 2.3 |\n| PARAMEDIC 1 (8.0, under the minister) | Look, we're gonna lose him, hurry up! Oxygen dropping! | 2.2 |\n| PARAMEDIC 1 (10.2, cut by tone at 11.0) | [quiet, to the patient] Fifty over twen-- | 0.8 |\n| MONITOR (11.0-14.0) | [flatline, silence, black at 13, logo] | 0 |\n\nTotal about 8.3 s with overlaps. Risks: Suno may smooth the cut-off word (cut it in the edit); \"Fifty over twenty\" is invented and needs a medical eye; mix must keep the minister forward."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">[shouting over siren] BP 60 over 30! We're losing him!<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">Move!<\/td><td class=\"num\">0.4<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[at the windscreen, disbelieving] Why's he stopping us?!<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, through the glass] I said raspberry-shaped hors d'oeuvres!<\/td><td class=\"num\">2.4<\/td><\/tr>\n<tr><td class=\"who\">MONITOR<\/td><td class=\"line\">[flatline tone, no words, 3 s of silence from the crew]<\/td><td class=\"num\">0.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>5.8<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Five seconds is enough to believe a man is dying if the audience has seen a hundred ER scenes: \"BP 60 over 30\" is the number, \"losing him\" is the stake, and the monitor sells the rest. \"Move!\" is one syllable the driver can scream over a siren, so it reads as a reflex rather than a line. The crew never explain the red light; the raised glove is on screen and the paramedic's \"Why's he stopping us?!\" is a question, not an exposition, which lets the outrage belong to the viewer. The minister's line then arrives into a gap with nothing competing with it, so the triviality is louder than any amount of crew dialogue would have made it. The final three seconds contain no words at all, so the audience supplies \"he's going to die\" themselves, which is what Kai wants. No moral, no narrator.<\/p>\n<p><b>Cuts from current.<\/b> \"we're gonna\" becomes \"we're\" (faster to shout); \"Come on, get out of the way!\" becomes \"Move!\"; \"What's he doing?!\" becomes \"Why's he stopping us?!\" (one more word, but it names the outrage: they are being stopped, not just delayed). No swearing in this version, which is the edge to test: Kai's swearing (\"get the f<b>* out of the way\", \"f<\/b>*ing hurry up\") is dropped entirely to see whether the shorter, cleaner shout is stronger. Also cut: oxygen dropping, sats, \"look, we're gonna lose him, hurry up\".<\/p>\n<p><b>Risk.<\/b> Kai asked for the swearing and for the crew to feel like heroes in trouble; a bone-dry cut may feel under-written and too polite, and \"Move!\" alone may not read as the driver's desperation without the sweary escalation. With so few words, the 0-5 s window might not establish \"dying\" if the Suno voices are not shouty enough, and the whole short rests on the monitor and the acting. Suno speech mode may also slur a 0.4 s line. \"Why's he stopping us?!\" may be read as the crew being angry at the outrider rather than at the system, which is fine. Fallback: restore \"get the f*** out of the way\" for the driver (about 1.3 s) and the total is still under 7 s.<\/p>\n<p><b>Protected lines.<\/b> \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim. \"BP 60 over 30\" survives verbatim inside the first line.<\/p>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">PARAMEDIC 1 (A, 0-3 s, over the monitor close-up)<\/td><td class=\"line\">[shouted, hands pumping the bag] BP 60 over 30, we're gonna lose him!<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">DRIVER (A, ~3-4.5 s, siren wailing)<\/td><td class=\"line\">[yelling at the windscreen] Get the f*** out of the way!<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">(B, 5-7 s)<\/td><td class=\"line\">[no line. The glove comes up, the ambulance lurches to a stop, the siren dies mid-wail; only rain, the monitor beeping fast, a paramedic's breath]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER (C, 7-10 s, heard through the windscreen glass, on the phone)<\/td><td class=\"line\">I said raspberry-shaped hors d'oeuvres!<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">MONITOR (D, 11-14 s)<\/td><td class=\"line\">[beeping slows, then one long flatline tone; silence; black; logo]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total spoken<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>5.9<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Three spoken lines in 14 seconds, and every one earns its place. The first gives the viewer the number and the verdict in two seconds, so \"dying\" is settled before the light changes. The driver's swear is the one human reaction the picture cannot show, and it makes the next beat hurt. Then we take the speech away. \"What's he doing?!\" is cut because the audience is already asking it, looking at the glove (relied-on shot: the OUT1-c outrider with the raised hand, beat B). Taking the siren out at the stop gives the held beat a silence of its own, so the minister's line arrives into a quiet room and sounds more absurd, and it needs no lip-sync because it comes through the glass (the bolder through-the-windscreen shot, beat C, with his car inches from the bonnet). The flatline lands on what the viewer has just watched: a man on the monitor, a minister outside, and nothing said that could tell them what to feel. Silence is the only edit that cannot be argued with. It also keeps us the sarcastic observer Kai asked for, with no one explaining the joke.<\/p>\n<p><b>Cuts from current.<\/b> PARAMEDIC 2: \"What's he doing?!\" (the glove and the stop say it). The longer \"sats dropping\" and \"oxygen dropping\" expansions from Kai's wider note (the monitor tight in shot A carries oxygen and sats as numbers on screen). Any second paramedic speech at all: the second paramedic acts, never speaks. The \"look, we're gonna lose him, hurry up\" repeat (the first line already says it). About 3 s of speech overall against the 7-9 s allowed, which is deliberate: the spare seconds go to the held beat and the flatline.<\/p>\n<p><b>Risk.<\/b> The picture has to be doing the work, and if shot A is a calm wide it fails. The monitor must be tight, the crew visibly frantic, and the BP numbers legible on the screen (60/30, falling). If the Suno siren will not drop out cleanly at the stop, beat B loses its silence and the minister's line has to fight it. Fewer lines also leave less room for Kai's \"ER-level drama\": he may feel the crew are under-voiced, and one more shout (Option: PARAMEDIC 2 \"Oxygen dropping!\" in A) is the obvious thing to add back. The driver's swear and the minister's silent entrance both rely on Suno speech mode landing in a gap, so the take needs checking for crosstalk. Medical plausibility is safe: BP readings and \"lose him\" are real paramedic talk and nothing is invented.<\/p>\n<p><b>Protected lines.<\/b> \"BP 60 over 30\" survives verbatim inside the first line. \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim and unchanged; it is the only joke and it is Jack's. The only altered line is the driver's, trimmed to Kai's own words (\"get the f*** out of the way\"), and PARAMEDIC 1's \"we're gonna lose him\" is kept as in the current lines.<\/p>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">[over the patient, shouting over the siren] BP 60 over 30, he's got four minutes!<\/td><td class=\"num\">2.4<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">[overlapping, eyes on the road] Six minutes out! Get the f*** out of the way!<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[as the ambulance jolts to a halt, red light, outrider's glove] We've stopped! Why have we stopped?!<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, crossing in front of the ambulance] I said raspberry-shaped hors d'oeuvres!<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">MONITOR<\/td><td class=\"line\">[flatline tone, silence, black, logo]<\/td><td class=\"num\">0 (3 s silent hold)<\/td><\/tr>\n<tr><td class=\"who\"><b>Total spoken<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>8.7<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> In five seconds the viewer gets a sum they can do without thinking: four minutes of life, six minutes of road, so every second matters and the crew are plainly heroes racing a clock they are already losing. That makes the red light land as outrageous because the maths has just been put in the viewer's head, and \"We've stopped!\" is the answer to the sum. Then the minister's trivia arrives as the only other number in the scene: nothing. No moral is stated and nobody names the decision-maker; the viewer completes the logic themselves. Four-minutes-versus-six also gives Suno clear, shoutable beats, and the shortfall is built in before the stop, so the flatline feels earned rather than arbitrary.<\/li><li><b>Cuts from current.<\/b> \"We're gonna lose him\" is replaced by the countdown (it says the same thing with a number). \"Come on\" is dropped from the driver for the swear in Kai's own words. \"What's he doing?!\" becomes \"Why have we stopped?!\", which asks about the stop rather than the outrider, so it reads as outrage at the delay and not confusion.<\/li><li><b>Risk.<\/b> The sum is the whole device: \"four minutes\" and \"six minutes\" are invented numbers, and \"he's got four minutes\" is a bit blunt for a real paramedic (they would more likely say \"he's peri-arrest\"), so it may read as scripted. Overlapped lines two and three may smear in Suno and lose the numbers. The minutes are never confirmed, so a viewer could read the flatline as bad luck rather than the delay; if the red light is longer than the gap, it is arithmetically fine, but only if the picture holds the stop for a visible beat. A cleaner clinical swap is \"he's peri-arrest\" for \"he's got four minutes\", at the cost of the countdown.<\/li><li><b>Protected lines.<\/b> \"BP 60 over 30\" survives verbatim. \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim, unaltered. Kai's \"get the f*** out of the way\" survives, with \"Six minutes out!\" added in front of it. Any new joke here is a proposal for Jack; none is proposed.<\/li><\/ul>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">[shouting over siren, 0-3 s] BP 60 over 30, f***ing hurry up, we're gonna lose him!<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[overlapping, flat and fast] Sats seventy-eight and dropping. He's peri-arrest.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">[5 s, at the glove] Get the f*** out of the way!<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, crossing in front] I said raspberry-shaped hors d'oeuvres!<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[stunned, quiet, under the minister's last word] ...Raspberry?<\/td><td class=\"num\">0.8<\/td><\/tr>\n<tr><td class=\"who\">MONITOR<\/td><td class=\"line\">[11-14 s: one long flatline tone, then silence, then the logo]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total spoken<\/b><\/td><td class=\"line\">(P2's sats line overlaps P1, so about 2.3 s of it is on the clock)<\/td><td class=\"num\"><b>about 8.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The first five seconds are pure panic with real numbers, so the viewer believes he is dying. The driver's line makes the red light outrageous. Then the joke is a collision: a man dies on one side of the glass and on the other a man is furious about fruit-shaped canapes. Paramedic 2's quiet \"...Raspberry?\" is the bluntness beat: the crew, who have just said \"peri-arrest\", repeat the trivia back like it was the only thing they could not process. The audience supplies the rest. The flatline is bare and silent, so the laugh dies in their throat and they say \"what, he's going to die\". No moral, no narrator.<\/p>\n<p><b>Cuts from current.<\/b> \"What's he doing?!\" is gone, replaced by the sharper echo \"...Raspberry?\" because reacting to the line is funnier than asking an open question. \"Come on, get out of the way!\" is now Kai's own sweary line. \"We're gonna lose him\" moves into the BP line. A clinical sats/peri-arrest line is added.<\/p>\n<p><b>Risk.<\/b> The echo can read as mockery of the crew if it is played arch. It must be hushed and stunned, not a gag line. Overlap of P1 and P2 in a Suno speech track may turn to mush, and the minister's line must stay audible over the siren. If Jack finds the echo too cute, delete it and the short still works. Medical terms are real UK paramedic language (BP, sats, peri-arrest); none are invented.<\/p>\n<p><b>Protected lines.<\/b> \"BP 60 over 30\" survives verbatim inside P1's line. \"I said raspberry-shaped hors d'oeuvres!\" is verbatim and untouched.<\/p>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">BP 60 over 30! Fucking hurry up, we're gonna lose him!<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[overlapping] Oxygen dropping, sats dropping!<\/td><td class=\"num\">0.9<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">Get the fuck out of the way!<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">OUTRIDER<\/td><td class=\"line\">[muffled through the rain, glove raised] Hold there.<\/td><td class=\"num\">0.7<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">[deflating, the fight gone out of him] ...Yes, sir.<\/td><td class=\"num\">0.8<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, crossing in front of the ambulance] I said raspberry-shaped hors d'oeuvres!<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">[through the windscreen, small, polite] Take your time, sir.<\/td><td class=\"num\">1.1<\/td><\/tr>\n<tr><td class=\"who\">MONITOR<\/td><td class=\"line\">[flatline, no words, held to black and the logo]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total spoken<\/b><\/td><td class=\"line\">(P2 overlaps P1, so about 1.0 s is shared)<\/td><td class=\"num\"><b>8.9<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> In five seconds the crew are heroes at full volume. Then a single raised glove makes the loudest man in the vehicle say \"Yes, sir,\" and that submission is the outrage: the viewer wants him to floor it and he cannot, because the other side holds the terms. The minister never even sees the crew; he is on the phone, so the resisting side wins without noticing it was a contest. The driver's last line is the only joke: it is sarcastic observation, not a moral, and it sits one second before the monitor goes flat, so the politeness curdles. \"What, he's going to die\" comes from the viewer, not from us.<\/li><li><b>Cuts from current.<\/b> \"Come on, get out of the way!\" becomes Kai's harder \"Get the fuck out of the way!\". \"What's he doing?!\" is removed (the crew no longer question the stop; they accept it, which is the shape). The outrider gets a two-word line. New: \"Yes, sir.\" and \"Take your time, sir.\" Both are proposals for Jack, who writes the jokes.<\/li><li><b>Risk.<\/b> A crew that obeys can read as the real-life crew being cowardly, and it works against Kai's wish for desperate heroes in beat B. A Suno speech track may make \"Take your time, sir.\" sound sincere rather than bitter, so the delivery tag matters. The outrider voice has to be audible over the siren in 0.7 s. The driver's politeness could blunt the flatline if it lands as a gag rather than a wound. Fallback: keep \"Yes, sir\" and cut \"Take your time, sir.\"<\/li><li><b>Protected lines.<\/b> \"I said raspberry-shaped hors d'oeuvres!\" is verbatim and fixed. \"BP 60 over 30\" is verbatim inside Paramedic 1's line, with Kai's \"fucking hurry up, we're gonna lose him\" added back from the meeting. Medical terms (BP, sats, oxygen) are real UK paramedic language; nothing medical is invented.<\/li><\/ul>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">[shouting over the siren, hands on the patient] BP 60 over 30 — we're gonna lose him!<\/td><td class=\"num\">2.4<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[overlapping, eyes on the monitor] Sats dropping — seventy-eight — he's peri-arrest!<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">[A: pulling up at the red, outrider's glove raised] Oh you are fucking joking — get the fuck out of the way!<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[B: staring through the windscreen] They're not seriously gonna — he's got ten minutes, he's —<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[C: on the phone, crossing slowly in front] I said raspberry-shaped hors d'oeuvres!<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">MONITOR<\/td><td class=\"line\">[D: flatline tone, no voices, siren cuts out; hold, black, logo]<\/td><td class=\"num\">0.0 spoken<\/td><\/tr>\n<tr><td class=\"who\"><b>Total spoken<\/b><\/td><td class=\"line\">(overlap of lines 1-2 not counted twice; flatline and silence 3 s follow)<\/td><td class=\"num\"><b>8.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The viewer is told he is dying in five seconds by two people who do not stop talking, and then the crew run into a wall: the driver's swear is the only complete thought, and Paramedic 2 starts two sentences (\"they're not seriously gonna\", \"he's got ten minutes, he's\") that the audience finishes in their own head before the minister's line arrives. The minister's trivia then lands as the answer nobody asked for, in the one gap the crew have left open. Cut-off sentences also read as real panic, since people under pressure abandon grammar, and they keep every crew line under three seconds for Suno. The flatline is silent so the audience, not the speaker, says \"he's going to die\".<\/li><li><b>Cuts from current.<\/b> \"What's he doing?!\" becomes the longer broken sentence \"They're not seriously gonna — he's got ten minutes, he's —\". \"Come on, get out of the way!\" becomes \"Oh you are fucking joking — get the fuck out of the way!\" (Kai's own driver words). Added: a short overlapping oxygen line from Paramedic 2 (\"sats dropping\", Kai's \"oxygen dropping\" made clinical). Dropped: Kai's \"hurry up, we're gonna lose him guys\" second pass; the single \"we're gonna lose him\" carries it.<\/li><li><b>Risk.<\/b> The cut-off sentences must be performed as interrupted by the scene, not as a TTS glitch: Suno may finish a trailing dash or read it as a flat stop, and the dash line at 1.6 s is the likeliest to be mangled. \"Ten minutes\" is a medical claim; it is plausible for a critical patient but is an invention, so Jack or Kai should confirm it or swap it for \"he's got no time\". The overlap in A needs the Suno track to layer, or the two lines will play in series and push the total to about 9.5 s. Swearing and shouting over a siren may reduce intelligibility of \"BP 60 over 30\"; keep it first, clear and slowest.<\/li><li><b>Protected lines.<\/b> \"BP 60 over 30\" survives verbatim (written \"BP sixty over thirty\" for voicing only). \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim, untouched, as the last spoken words in the short; nothing is allowed to speak after it but the monitor.<\/li><\/ul>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">BP 60 over 30, we're gonna lose him!<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[over, on the mask, urgent] Sats seventy-eight and dropping!<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">[shouting forward, siren] Get out of the way!<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">OUTRIDER<\/td><td class=\"line\">[outside, muffled by rain] Hold it there!<\/td><td class=\"num\">0.7<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">What's he doing?!<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, crossing in front of the ambulance] I said raspberry-shaped hors d'oeuvres!<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">[low, to the windscreen] Is he on the phone?<\/td><td class=\"num\">1.3<\/td><\/tr>\n<tr><td class=\"who\">BYSTANDER<\/td><td class=\"line\">[under an umbrella at the kerb, to nobody] Oh, you're joking.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MONITOR<\/td><td class=\"line\">[flatline, no words, 3 s of silence, black, logo]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">Sum of lines 11.1 s; overlaps (P2 over P1, driver over P1, driver and bystander under the minister) take off about 3.3 s; <b>about 7.8 s of speech<\/b> on the timeline, flatline silent<\/td><td class=\"num\"><b>~7.8<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The crew do not editorialise, they work, so they stay heroes, and the doubt comes in small human reactions from people who are not the lead. The driver asking \"Is he on the phone?\" and the bystander's \"Oh, you're joking\" are the viewer's own thoughts spoken at the exact moment the minister crosses, which makes the audience complicit in the outrage without any narrator, caption or moral. Because the chorus has already said the outrage, the silence after it is free to carry only one thought: he is going to die. The \"what, he's going to die\" reaction Kai wants is left unsaid and unspoken by anyone.<\/li><li><b>Cuts from current.<\/b> The driver's original \"Come on\" is shortened to the plain \"Get out of the way!\" (Kai's own wording). \"What's he doing?!\" moves from the driver slot to Paramedic 2 so the driver keeps one line for the phone doubt. Nothing from the monitor is spoken: \"oxygen dropping\" is dropped to keep the speech under 9 s.<\/li><li><b>Risk.<\/b> Too many voices for one Suno speech track: five speakers (one outside the ambulance) may blur into the same voice, and the muffled outrider and bystander may not come out distinct, so they may need to be cut or become bare sound. The bystander is also a new invented character with a joke-adjacent line (\"Oh, you're joking\"), which is a proposal for Jack, not a decision. Chorus doubt also risks over-explaining: if the viewer already got the point at the red light, the driver's \"Is he on the phone?\" is a second nudge and could read as hand-holding. Medical terms used: BP and sats (oxygen saturation, normal UK paramedic shorthand); seventy-eight is a plausible low reading, nothing else is invented.<\/li><li><b>Protected lines.<\/b> \"BP 60 over 30, we're gonna lose him!\" survives verbatim (Kai's \"f<b><i>ing hurry up\" is not added here; swear it in if Kai wants it, e.g. the driver's \"Get the f<\/b><\/i> out of the way!\"). \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim, Jack's line, untouched.<\/li><\/ul>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">[over the patient, shouting over the siren] BP 60 over 30, sats dropping, we're gonna lose him!<\/td><td class=\"num\">2.8<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[bagging him, pointing forward] A&amp;E's at the end of this road, two minutes, go go go!<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">[leaning on the horn] Get the f*** out of the way!<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[stunned, the glove up in the windscreen] We can SEE it! It's right there!<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[through the glass, on the phone, crossing slowly] I said raspberry-shaped hors d'oeuvres!<\/td><td class=\"num\">2.4<\/td><\/tr>\n<tr><td class=\"who\">MONITOR<\/td><td class=\"line\">[flatline tone, held; no words; black; logo]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>10.2 spoken (overlap on lines 3 and 4 and the siren bed brings it to about 8.5 s of track time)<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The place does the persuading. \"A&amp;E's at the end of this road\" plants the destination in the first five seconds, so when the outrider's glove stops them the viewer already knows they are two minutes from help and can see the sign glowing in the rain. \"We can SEE it\" says the outrage in four words with no speech about fairness and no narrator, which is Kai's \"sarcastic observers, not the authority\". It names no decision-maker and no technology; the car crossing in front is the decision-maker, on screen. The minister's raspberry line then lands against that sign: the viewer compares the two distances, a hundred metres of road against a canapé order. The flatline stays silent, so the audience supplies \"he's going to die\" themselves.<\/p>\n<p><b>Cuts from current.<\/b> \"Come on, get out of the way!\" becomes Kai's harder \"Get the f*** out of the way!\". \"What's he doing?!\" is replaced by \"We can SEE it!\" because the place detail is a stronger complaint than a question. \"We're gonna lose him\" survives only inside the first line. Nothing new is added to the minister.<\/p>\n<p><b>Risk.<\/b> It runs about 1.5 s over the 7-9 s spoken target if nothing overlaps, so lines 3 and 4 must be shouted over each other and the siren; if Suno will not overlap, drop \"two minutes\" from line 2. The \"sign in sight\" claim needs the stills: the windscreen shot must show the lit A&amp;E sign, or the lines lie. \"Two minutes\" is a plausible, not a measured, ambulance estimate, so keep it as shouted guesswork. The medical terms (BP, sats) are real UK paramedic language and I invented none. \"We can SEE it\" could read as comedic rather than desperate if delivered flat, so it needs a cracked, shouted take. Joke-wise the only new material is \"We can SEE it\", which is a proposal for Jack.<\/p>\n<p><b>Protected lines.<\/b> \"BP 60 over 30\" survives verbatim. \"I said raspberry-shaped hors d'oeuvres!\" survives verbatim, with only the stage direction (through the glass, crossing) added around it.<\/p>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">[shouting over the siren, bagging the patient] BP 60 over 30!<\/td><td class=\"num\">1.1<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\"><span class=\"stage\">[eyes on the monitor, overlapping]<\/span> Sats seventy-six and dropping, oxygen dropping!<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">Stay with me, mate. [to the driver] We're gonna lose him, hurry up!<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">DRIVER<\/td><td class=\"line\">[leaning on the horn, up front] Get the fuck out of the way!<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 2<\/td><td class=\"line\">[the ambulance lurches and stops, red light, outrider's glove] What's he doing?!<\/td><td class=\"num\">0.8<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC 1<\/td><td class=\"line\">[low, to the patient, pressure is no longer reading] Come on, come on, hurry up.<\/td><td class=\"num\">0.9<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, heard through the windscreen as his car crosses] I said raspberry-shaped hors d'
