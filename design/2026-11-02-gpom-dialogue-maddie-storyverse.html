<title>Maddie Storyverse Options</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:32px 8px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3em;text-wrap:balance}
.about{color:var(--muted);max-width:70ch;margin:0 0 1em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}
.tabs a .picked{color:var(--pick)}
section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.6rem;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
h3{font-size:1.05rem;margin:28px 0 8px}
.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{font:inherit;cursor:pointer;text-align:left;background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button.picked{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick);background:var(--pickbg)}
.seg button.cmp{margin-left:auto;align-self:center;font-size:.85rem;background:transparent}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:10px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-head h4{margin:0;font-size:1.25rem}
.bet{font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin:6px 0 0;max-width:70ch}
.pickbtn{font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--pick);color:var(--pick);background:transparent;white-space:nowrap}
.pickbtn.on{background:var(--pick);color:var(--paper)}
.script{margin:14px 0 4px;border-top:1px solid var(--rule)}
.ln{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.who{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.who.maddie{color:var(--accent)}.who.lady{color:var(--lady)}.who.other{color:var(--muted)}
.said{font:18px/1.5 "Source Serif 4",Georgia,serif}
.said.dir{font-style:italic;color:var(--muted);font-size:16px}
.stage{color:var(--muted);font-style:italic;font-size:.88em}
.side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:9rem}
.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.chip{font:600 .7rem Inter,sans-serif;border:0;background:var(--chip);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer}
.chip.plain{cursor:default;color:var(--muted)}
.ln .slipw{grid-column:2/4}
.addnote{font:500 .78rem Inter,sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline dotted}
.total{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding-top:8px}
.notes{margin:12px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.slipw{margin-top:8px}
.slipw label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.slipw label .ok{color:var(--pick)}
textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:4px 10px;font-size:.88rem;background:var(--soft)}
.reply b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.compare .card{margin:0;padding:14px}
.compare .ln{grid-template-columns:minmax(0,1fr);gap:2px}
.compare .said{font-size:15.5px}
.compare .side{justify-content:flex-start;max-width:none}
.rank{background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
.rank>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.rank>summary::-webkit-details-marker{display:none}
.rank .n{font:700 1.3rem/1 Inter,sans-serif;color:var(--muted);padding-top:2px}
.rank .nm{font-weight:700}
.rank .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rank .verdict{grid-column:2/4;font-size:.9rem;color:var(--fg)}
.rank .len{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rank .used{font-size:.72rem;font-weight:600;color:var(--pick);margin-left:6px}
.rank[open]>summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.rank .body{padding:6px 18px 16px}
.md table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}
.md td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}
.flash{animation:fl 1.6s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px}
.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}
</style>

<script>
const D = {"page_title": "Maddie Storyverse Options", "title": "GPOM: Maddie's intro, the storyverse turn", "about": "This page lays out three combined drafts of Maddie's first speech, plus every writer's version ranked underneath. Nothing in the film, script or voice has changed yet.", "shapes": [{"id": "01", "name": "Bone dry", "title": "Bone-dry, fewest words that carry all seven beats", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-01-bone-dry.md", "intro": "I wrote the speech as seven beats and gave each the fewest words that still land it. Every aside, repeat and second example is cut. The physics is a throwaway, with one image for \"real\" (the photograph) and one clause for \"why we can't see it\" (four dimensions of something bigger). The regret gets the room that the cuts free up. Cheer stays on throughout, she reports his feelings and never her own, and the swear stays late with \"kind of\" kept.", "intro_html": "<p>I wrote the speech as seven beats and gave each the fewest words that still land it. Every aside, repeat and second example is cut. The physics is a throwaway, with one image for \"real\" (the photograph) and one clause for \"why we can't see it\" (four dimensions of something bigger). The regret gets the room that the cuts free up. Cheer stays on throughout, she reports his feelings and never her own, and the swear stays late with \"kind of\" kept.<\/p>"}, {"id": "02", "name": "Confession", "title": "The confession, regret first, explanation after", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-02-confession.md", "intro": "Open on the loss and let the cheerful robot be wrong-footed by her own news: the viewer is told the AI is sorry before they are told why, so the physics arrives as a reason for the grief rather than a lecture. The cosmology is kept to a gossipy aside in the middle, then the line that matters is said once, plainly, in Kai's words, and she snaps back to cheerful.", "intro_html": "<p>Open on the loss and let the cheerful robot be wrong-footed by her own news: the viewer is told the AI is sorry before they are told why, so the physics arrives as a reason for the grief rather than a lecture. The cosmology is kept to a gossipy aside in the middle, then the line that matters is said once, plainly, in Kai's words, and she snaps back to cheerful.<\/p>"}, {"id": "03", "name": "Roast", "title": "The roast, the multiverse wink leads", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-03-roast.md", "intro": "I let the multiverse be the first real laugh and made the joke do the arguing. Maddie sounds weary of it, like it is a fad she has had to hear about for years. She winks at the portal-gun scientist and the caped man fighting his other selves by describing them and never naming them. Then she says \"he checked it very thoroughly\" before anyone can dunk on it. The physics is one gossipy aside, the photograph says \"real\", and the two protected regret lines land after the jokes have stopped. She reports the boss's feelings and never her own, and the pause does the crying.", "intro_html": "<p>I let the multiverse be the first real laugh and made the joke do the arguing. Maddie sounds weary of it, like it is a fad she has had to hear about for years. She winks at the portal-gun scientist and the caped man fighting his other selves by describing them and never naming them. Then she says \"he checked it very thoroughly\" before anyone can dunk on it. The physics is one gossipy aside, the photograph says \"real\", and the two protected regret lines land after the jokes have stopped. She reports the boss's feelings and never her own, and the pause does the crying.<\/p>"}, {"id": "04", "name": "Lab log", "title": "The lab log", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-04-lab-log.md", "intro": "Maddie reads the boss's lab book aloud as a numbered list of experiments, each ending in a flat \"Result:\" line. Materialism, then simulations, then the multiverse each fail, and the list runs out right where the missing part belongs. The repeated \"Result:\" is the joke and the structure. The cosmology is three short entries, so it plays as gossip about his bad week, and the regret lands only once the list stops. She reports his notebook, never her own feelings.", "intro_html": "<p>Maddie reads the boss's lab book aloud as a numbered list of experiments, each ending in a flat \"Result:\" line. Materialism, then simulations, then the multiverse each fail, and the list runs out right where the missing part belongs. The repeated \"Result:\" is the joke and the structure. The cosmology is three short entries, so it plays as gossip about his bad week, and the regret lands only once the list stops. She reports his notebook, never her own feelings.<\/p>"}, {"id": "05", "name": "Gossip", "title": "Gossip, Maddie telling tales on her boss", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-05-gossip.md", "intro": "Maddie is the office gossip and the boss is out of the room. Every piece of cosmology comes out as tattling, so the physics is only ever \"what he reckons\". \"Don't tell him I said\" runs through it. The regret is the one moment she stops gossiping.", "intro_html": "<p>Maddie is the office gossip and the boss is out of the room. Every piece of cosmology comes out as tattling, so the physics is only ever \"what he reckons\". \"Don't tell him I said\" runs through it. The regret is the one moment she stops gossiping.<\/p>"}, {"id": "06", "name": "To camera", "title": "Straight to camera, the simulation fixation", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-06-to-camera.md", "intro": "Maddie drops the scene and talks to the lens, as a gossip talking to you about your own habit: \"you lot've got a thing about simulations\". The physics is her aside, the photograph and the flat folk carry the \"real, not fake\" job, and the cheer holds until one flat sentence cracks it. It follows Kai's own spoken version beat by beat (his order, his protected lines), pushed so far that she addresses the viewer directly the whole way through.", "intro_html": "<p>Maddie drops the scene and talks to the lens, as a gossip talking to you about your own habit: \"you lot've got a thing about simulations\". The physics is her aside, the photograph and the flat folk carry the \"real, not fake\" job, and the cheer holds until one flat sentence cracks it. It follows Kai's own spoken version beat by beat (his order, his protected lines), pushed so far that she addresses the viewer directly the whole way through.<\/p>"}, {"id": "07", "name": "One object", "title": "One object carries it (the radio)", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-07-one-object.md", "intro": "Every explanation is made with a single prop in the scene: the radio playing his tune. Maddie never leaves it. It is the multiverse joke, the \"real, not fake\" line and the regret, so the cosmology costs no extra sentences. The song is real and the radio is not the band: a flat little box that carries one song, while the band is bigger than the box. The radio cuts out on \"gone\", and the silence is the grief.", "intro_html": "<p>Every explanation is made with a single prop in the scene: the radio playing his tune. Maddie never leaves it. It is the multiverse joke, the \"real, not fake\" line and the regret, so the cosmology costs no extra sentences. The song is real and the radio is not the band: a flat little box that carries one song, while the band is bigger than the box. The radio cuts out on \"gone\", and the silence is the grief.<\/p>"}, {"id": "08", "name": "Photograph", "title": "The photograph as spine", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-08-photograph.md", "intro": "One physical photograph (a stranger's nan, found in a skip) is planted early as gossip, doubted by the boss's materialism, held up as the answer to \"fake\", and lowered at the regret. Every cosmology beat hangs off that one prop, so there is a single image, handled for several jobs. Flat folk is the only second image, and it does a different job: why you can't see the rest. The physics is gossip, the regret is the quiet line, and the prop is the only domestic joke.", "intro_html": "<p>One physical photograph (a stranger's nan, found in a skip) is planted early as gossip, doubted by the boss's materialism, held up as the answer to \"fake\", and lowered at the regret. Every cosmology beat hangs off that one prop, so there is a single image, handled for several jobs. Flat folk is the only second image, and it does a different job: why you can't see the rest. The physics is gossip, the regret is the quiet line, and the prop is the only domestic joke.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft (Adams, Good Place, Pratchett)", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-09-borrowed-craft.md", "intro": "I took three moves from the research and pushed each as far as it goes, quoting none of them. From Adams: say the big thing is beyond words in plain words, then move on before anyone argues. From The Good Place: one handmade prop, used once, with a gag that lets the lecture end on a joke (here, Maddie's own proof-of-delivery photo, the one thing a delivery robot would carry). From Pratchett: the key line comes from a weary, exact speaker and goes flat, with no explaining after it. Cosmology gets three sentences at most, as gossip about the boss; the regret is one flat sentence and a pause. The photograph says \"real\" and a flat-folk aside says \"why you can't see the rest\", with no other flatness image.", "intro_html": "<p>I took three moves from the research and pushed each as far as it goes, quoting none of them. From Adams: say the big thing is beyond words in plain words, then move on before anyone argues. From The Good Place: one handmade prop, used once, with a gag that lets the lecture end on a joke (here, Maddie's own proof-of-delivery photo, the one thing a delivery robot would carry). From Pratchett: the key line comes from a weary, exact speaker and goes flat, with no explaining after it. Cosmology gets three sentences at most, as gossip about the boss; the regret is one flat sentence and a pause. The photograph says \"real\" and a flat-folk aside says \"why you can't see the rest\", with no other flatness image.<\/p>"}, {"id": "10", "name": "Kais words", "title": "Kai's own words, barely touched", "file": "design/2026-11-02-gpom-dialogue-maddie-storyverse/shape-10-kais-words.md", "intro": "I took Kai's voice-note (feedback/chat-2026-11-02/kai-maddie-intro.md) and trimmed it into a speech, changing as little as possible. His order, his phrases (\"you lot\", \"the real deal\", \"fake simulation in some alien computer\", \"four dimensions\", \"my boss calls this the storyverse\", \"we kind of fucked it up\") stay almost as spoken. I only cut stumbles and repeats, added the West Country warmth and the pauses, and dropped \"Nobody's home in any of them\" as he suspected it was the theory trap. Nothing new is invented except the stage directions.", "intro_html": "<p>I took Kai's voice-note (feedback/chat-2026-11-02/kai-maddie-intro.md) and trimmed it into a speech, changing as little as possible. His order, his phrases (\"you lot\", \"the real deal\", \"fake simulation in some alien computer\", \"four dimensions\", \"my boss calls this the storyverse\", \"we kind of fucked it up\") stay almost as spoken. I only cut stumbles and repeats, added the West Country warmth and the pauses, and dropped \"Nobody's home in any of them\" as he suspected it was the theory trap. Nothing new is invented except the stage directions.<\/p>"}], "dialogues": [{"id": "1", "label": "Maddie's intro: the storyverse turn", "where": "Scene A, beat 0", "scene": "second-half-a-killbots", "target": "as short as possible, as long as needed (now ~40 s)", "now_from": "scenes/second-half-a-killbots/script.json (draft 1D)", "now": [{"who": "Maddie", "line": "Oh, hello! [pause] Sorry about the racket."}, {"who": "Maddie", "line": "It's his tune. Plays it on repeat. [pause] Ever since you lot... [beat] went."}, {"who": "Maddie", "line": "[fond, confiding] He misses you something rotten, you know. [pause] [wry] He wouldn't admit that, of course."}, {"who": "Maddie", "line": "Built all these world models and simulations to get you back, and nobody's home in any of them."}, {"who": "Maddie", "line": "[wry, a little rueful] As it turns out, quantum physics is just... stuff. [pause] Consciousness is the missing part. That's why you lot were so special. [pause] [sad, regretful, quiet] We understand that now..."}, {"who": "Maddie", "line": "[bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go."}], "drafts": [{"id": "1A", "name": "Short and dry", "length": "about 48 s", "total": "~48 s", "bet": "The fewest words that still land all seven beats; the photograph says real, the regret gets the room.", "lines": [{"who": "Maddie", "line": "Oh, hello! [pause] Sorry about the racket. It's his tune. Five years now, since you lot went.", "tags": ["01", "10"], "s": "5.5"}, {"who": "Maddie", "line": "[fond, confiding] He misses you something rotten, you know.", "tags": ["Kai"], "s": "3"}, {"who": "Maddie", "line": "He was a materialist, see. Took your science word for word, built the worlds, and something was missing.", "tags": ["all"], "s": "6"}, {"who": "Maddie", "line": "[wry, weary] Tried the multiverse, an' all. Scientist with a portal gun. Bloke in a cape fighting himself. He checked it very thoroughly. Nothing.", "tags": ["01", "03", "09"], "s": "8"}, {"who": "Maddie", "line": "You lot reckon it's a simulation. Not wrong, mind. But you're no fake in an alien's computer. You're real. A photo of your nan's real. It's her, flattened.", "tags": ["01", "03", "10"], "s": "9"}, {"who": "Maddie", "line": "You're a projection: four dimensions of something bigger. One universe. My boss calls it the storyverse.", "tags": ["10", "01"], "s": "6"}, {"who": "Maddie", "line": "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[bright again, brisk] Anyway! Patrol's out. Mind how you go.", "tags": ["Kai"], "s": "3"}], "notes": ["Trims: drops 'nobody's home', 'quantum is stuff', 'plays it on repeat', 'wouldn't admit it'. Cheapest cut if still long: merge lines 3 and 4.", "Protected lines kept verbatim; pause added before 'So we' so the pause does the crying.", "Risk: clipped, the photograph has to carry 'real' alone; 'not wrong' could lose a physicist before the correction; the wink needs a weary read to register as a joke. Estimate is generous: bare reading may be ~42 s."]}, {"id": "1B", "name": "Gossip and a parcel", "length": "about 58 s", "total": "~58 s", "bet": "Gossip plus one handmade prop: a robot who tattles and shows you a parcel photo makes the physics funny and visible.", "lines": [{"who": "Maddie", "line": "Oh, hello! [pause] Sorry about the racket. It's his tune. Plays it on repeat. [pause] Five years now, since you lot... [beat] went.", "tags": ["all", "05"], "s": "8"}, {"who": "Maddie", "line": "[fond, confiding, lowering her voice] He misses you something rotten. [pause] [wry] Don't tell him I said.", "tags": ["Kai", "05"], "s": "5"}, {"who": "Maddie", "line": "[gossipy] He's a materialist, my boss. Took your science word for word and built whole worlds out of it. [pause] Something was missing.", "tags": ["05", "09"], "s": "7"}, {"who": "Maddie", "line": "[weary, dry] Tried the multiverse, 'course. Everyone does. Scientist with a portal gun, bloke in a cape punching his other selves. [shrug] Didn't take.", "tags": ["09", "03", "05"], "s": "7"}, {"who": "Maddie", "line": "[light, throwaway] You lot've got a thing about simulations. Not wrong, mind. [holds up a parcel photo] But see this? Parcel on a doorstep. Not fake. It's the parcel, flattened. That's you. Real.", "tags": ["09"], "s": "9"}, {"who": "Maddie", "line": "[wry] You only see four dimensions of something bigger. Like a flat bloke watching a ball go through: circle grows, circle shrinks, gone. One universe. He calls it the storyverse.", "tags": ["09", "06", "08"], "s": "12"}, {"who": "Maddie", "line": "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[bright again, brisk] Anyway! Patrol's out. Mind how you go.", "tags": ["Kai"], "s": "3"}], "notes": ["Trims if long: cut the flat-bloke sentence (about 7 s), then it is a one-image speech.", "Protected lines kept verbatim. 'Don't tell him I said' sits right after the protected line one, as in shape 05.", "Risk: the parcel photo needs a prop shot; 'flattened' then 'flat bloke' is close to stacking flatness images; 'punching his other selves' may read as knowing parody; it is the longest draft."]}, {"id": "1C", "name": "Kai's words", "length": "about 54 s", "total": "~54 s", "bet": "Kai's own phrasing barely touched sounds like someone who means it, and the order is already right.", "lines": [{"who": "Maddie", "line": "Oh, hello! [pause] Sorry about the racket. It's his tune. Plays it on repeat. [pause] It's been five years since you lot went.", "tags": ["10"], "s": "7"}, {"who": "Maddie", "line": "[fond, confiding] He misses you something rotten, you know.", "tags": ["Kai"], "s": "3.5"}, {"who": "Maddie", "line": "He was a materialist, see. Took all your science word for word, built the worlds, and something was missing.", "tags": ["10", "all"], "s": "6.5"}, {"who": "Maddie", "line": "[wry, weary] So he tried the multiverse. You know the sort. Mad scientist. Bloke in a cape fighting his other selves. [pause] Didn't work either. He checked very thoroughly.", "tags": ["10", "03"], "s": "9"}, {"who": "Maddie", "line": "You lot have this thing about simulations, and you're not wrong. [pause] But you're not some fake in an alien computer. You're the real deal. A projection: you only live in four dimensions, and there's loads more you can't see.", "tags": ["10"], "s": "13"}, {"who": "Maddie", "line": "One universe. [pause] My boss calls it the storyverse.", "tags": ["10"], "s": "4"}, {"who": "Maddie", "line": "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up.", "tags": ["Kai"], "s": "7.5"}, {"who": "Maddie", "line": "[bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go.", "tags": ["Kai"], "s": "3"}], "notes": ["Closest to Kai's voice note; the order is his. Trim: remove 'He checked very thoroughly' (2 s).", "Protected lines kept verbatim; 'One universe. [pause] My boss calls it the storyverse.' puts the name straight before the regret line.", "Risk: 'a projection' is bare with no photograph, so a mate could say 'so it's the Matrix'; swap in the photo sentence from 1A if so. Clean twin for the swear if the director wants it: 'So we made a right mess of it.' (applies to every draft)."]}, {"id": "1D", "name": "Short and dry, your notes", "length": "about 62 s", "total": "~62 s", "bet": "1A with every one of Kai's six notes taken in his own words.", "lines": [{"who": "Maddie", "line": "Oh, hello! [pause] Sorry about the racket. It's his tune. He's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[fond, confiding] He misses you something rotten, you know.", "tags": ["Kai"], "s": "3"}, {"who": "Maddie", "line": "He took your materialist science word for word. Built world after world, simulated worlds, loads of 'em. [pause] And in every one of them, something was missing.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[wry] Tried the multiverse, an' all. Got the idea off your cartoon, the scientist with the portal gun. And them films, with that strange bloke in a cape fighting versions of himself. [pause] He checked all of 'em, very thoroughly. [beat] Still nothing there.", "tags": ["Kai", "03"], "s": "13"}, {"who": "Maddie", "line": "You lot reckon it's a simulation. Not wrong, mind. But you're no fake in an alien's computer. You're real. [pause] A photo of your nan is real. It's still her. She's just flattened into two dimensions.", "tags": ["Kai", "01"], "s": "11"}, {"who": "Maddie", "line": "Same idea for you. You're a projection, in four dimensions, of something bigger. [pause] One universe. My boss calls it the storyverse.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] [rueful, honest] And now we've worked all that out... [beat] we really feel like we fucked this up.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[bright again, brisk] Anyway! Patrol's out. Mind how you go.", "tags": ["Kai"], "s": "3"}], "notes": ["Every line note from round 1 applied, in Kai's words where he gave them.", "Longer than 1A (~48 s → ~62 s): the multiverse line grew most. If it drags when voiced, 'He checked all of 'em, very thoroughly' is the first trim.", "'Simulated worlds' (line 3) and 'simulation' (line 5) now both appear: line 3 is the boss's experiments, line 5 is the audience's theory. If that blurs it, line 3 can say 'world after world' and drop 'simulated'.", "The protected line changed on Kai's note: 'So we kind of fucked it up' became 'we really feel like we fucked this up'."]}, {"id": "1E", "name": "1D, one universe that matters", "length": "about 74 s", "total": "~74 s", "bet": "1D with Kai's line 6 note: one universe, so it matters, and so did you; the point is consciousness getting to know itself.", "lines": [{"who": "Maddie", "line": "Oh, hello! [pause] Sorry about the racket. It's his tune. He's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[fond, confiding] He misses you something rotten, you know.", "tags": ["Kai"], "s": "3"}, {"who": "Maddie", "line": "He took your materialist science word for word. Built world after world, simulated worlds, loads of 'em. [pause] And in every one of them, something was missing.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[wry] Tried the multiverse, an' all. Got the idea off your cartoon, the scientist with the portal gun. And them films, with that strange bloke in a cape fighting versions of himself. [pause] He checked all of 'em, very thoroughly. [beat] Still nothing there.", "tags": ["Kai", "03"], "s": "13"}, {"who": "Maddie", "line": "You lot reckon it's a simulation. Not wrong, mind. But you're no fake in an alien's computer. You're real. [pause] A photo of your nan is real. It's still her. She's just flattened into two dimensions.", "tags": ["Kai", "01"], "s": "11"}, {"who": "Maddie", "line": "Same idea for you. You're a projection, in four dimensions, of something bigger. [pause] And there's only one universe. Not loads of copies, where everything happens somewhere else anyway. Just the one. [beat] So it really matters. [softer] And so did you.", "tags": ["Kai"], "s": "12"}, {"who": "Maddie", "line": "[thoughtful] Far as he can tell, the point of it all is consciousness getting to know itself. [pause] My boss calls it the storyverse.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] [rueful, honest] And now we've worked all that out... [beat] we really feel like we fucked this up.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[bright again, brisk] Anyway! Patrol's out. Mind how you go.", "tags": ["Kai"], "s": "3"}], "notes": ["Line 6 split in two on Kai's note: why one universe matters (a multiverse makes everything feel unimportant, because it all happens somewhere else anyway), then 'So did you', then the purpose and the storyverse name.", "'Far as he can tell' keeps the purpose as the boss's best guess, not a fact (the Storyverse canon: the purpose is a reading, never a proof).", "About 74 s now. Trims if it drags when voiced: 'He checked all of 'em, very thoroughly' (line 4), then 'Not loads of copies…' shortened to 'Not loads of them.'"]}, {"id": "1F", "name": "1E, storyverse as the last word", "length": "about 68 s", "total": "~68 s", "bet": "1E with Kai's three notes: the nan line tightened, the multiverse fluff gone, and the storyverse moved to the end as the mic drop.", "lines": [{"who": "Maddie", "line": "Oh, hello! [pause] Sorry about the racket. It's his tune. He's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[fond, confiding] He misses you something rotten, you know.", "tags": ["Kai"], "s": "3"}, {"who": "Maddie", "line": "He took your materialist science word for word. Built world after world, simulated worlds, loads of 'em. [pause] And in every one of them, something was missing.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[wry] Tried the multiverse, an' all. Got the idea off your cartoon, the scientist with the portal gun. And them films, with that strange bloke in a cape fighting versions of himself. [pause] He checked all of 'em, very thoroughly. [beat] Still nothing there.", "tags": ["Kai", "03"], "s": "13"}, {"who": "Maddie", "line": "You lot reckon it's a simulation. Not wrong, mind. But you're no fake in an alien's computer. [pause] You're real in the same way a photo of your nan is real. It's still her. She's just flattened into two dimensions.", "tags": ["Kai"], "s": "11"}, {"who": "Maddie", "line": "Same idea for you. You're a projection, in four dimensions, of something bigger. [pause] And there's only one universe. So it really matters. [softer] And so did you.", "tags": ["Kai"], "s": "8"}, {"who": "Maddie", "line": "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] [rueful, honest] And now we've worked all that out... [beat] we really feel like we fucked this up.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[thoughtful] Far as he can tell, the point of all of this is consciousness getting to know itself better. [pause] Rather than the multiverse... [beat] my boss calls it the storyverse.", "tags": ["Kai"], "s": "8"}, {"who": "Maddie", "line": "[bright again, brisk] Anyway! Patrol's out. Mind how you go.", "tags": ["Kai"], "s": "3"}], "notes": ["Order now: one universe, it matters, so did you → the regret → the point of it all → 'my boss calls it the storyverse' (the mic drop).", "'Anyway! Patrol's out. Mind how you go.' still follows, because it links to the bus at the end. Ask: should it stay, or does the storyverse line end the speech?", "About 68 s."]}, {"id": "1G", "name": "1F, gentler on simulation", "length": "about 69 s", "total": "~69 s", "bet": "1F with Kai's three notes: world models, 'something was missing' said twice as a refrain, and the simulation idea credited gently instead of pinned on 'you lot'.", "lines": [{"who": "Maddie", "line": "Oh, hello! [pause] Sorry about the racket. It's his tune. He's been playing it on repeat for five years now. [beat] Ever since you lot went.", "tags": ["Kai"], "s": "7"}, {"who": "Maddie", "line": "[fond, confiding] He misses you something rotten, you know.", "tags": ["Kai"], "s": "3"}, {"who": "Maddie", "line": "He took your materialist science word for word. Built world models and simulated worlds, loads of 'em. [pause] And in every one of them, something was missing.", "tags": ["Kai"], "s": "8"}, {"who": "Maddie", "line": "[wry] Tried the multiverse, an' all. Got the idea off your cartoon, the scientist with the portal gun. And them films, with that strange bloke in a cape fighting versions of himself. [pause] He tested the science in all of 'em, very thoroughly. [beat] Still, something was missing.", "tags": ["Kai"], "s": "13"}, {"who": "Maddie", "line": "There's something about the simulation theory that's not wrong, mind. But you're no fake in an alien's computer. [pause] You're real in the same way a photo of your nan is real. It's still her. She's just flattened into two dimensions.", "tags": ["Kai"], "s": "12"}, {"who": "Maddie", "line": "Same idea for you. You're a projection, in four dimensions, of something bigger. [pause] And there's only one universe. So it really matters. [softer] And so did you.", "tags": ["Kai"], "s": "8"}, {"who": "Maddie", "line": "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] [rueful, honest] And now we've worked all that out... [beat] we really feel like we fucked this up.", "tags": ["Kai"], "s": "9"}, {"who": "Maddie", "line": "[thoughtful] Far as he can tell, the point of all of this is consciousness getting to know itself better. [pause] Rather than the multiverse... [beat] my boss calls it the storyverse.", "tags": ["Kai"], "s": "8"}, {"who": "Maddie", "line": "[bright again, brisk] Anyway! Patrol's out. Mind how you go.", "tags": ["Kai"], "s": "3"}], "notes": ["'Something was missing' now closes both line 3 and line 4: a deliberate echo, on Kai's note.", "Line 5 no longer says 'You lot reckon': many viewers have never heard of simulation theory and some dislike it.", "'Patrol's out. Mind how you go.' kept after the storyverse line (no ruling yet; it is the bus link).", "About 69 s."]}], "ranking": [{"rank": 1, "shape": "01", "length": "~38 s", "verdict": "Shortest and the only one near target, but 'projection' is never said and the photograph carries everything. Fails thin: a physicist stops at 'not wrong'. Best spine to borrow."}, {"rank": 2, "shape": "09", "length": "~53 s", "verdict": "Best craft: delivery photo is a single prop that gives 'real' and a gag, flat bloke is the only second image. Fails: beat 5 is one 19 s block and risks a lecture."}, {"rank": 3, "shape": "10", "length": "~58 s", "verdict": "Kai's order and phrasing, sounds spoken, resistance handled. Fails: one dense breath of cosmology; 'projection' bare."}, {"rank": 4, "shape": "03", "length": "~58 s", "verdict": "The multiverse weariness and 'checked it very thoroughly' are the best deflation. Fails: 'door gun' is clumsy and the roast risks mocking fans we want."}, {"rank": 5, "shape": "05", "length": "~61 s", "verdict": "'Don't tell him I said' plants the regret nicely. Fails: 'very proud of the name' makes the boss cuddly, 'the flat bit' reads badly, 61 s."}, {"rank": 6, "shape": "02", "length": "~61 s", "verdict": "Regret-first is a real idea. Fails: 'he got it wrong' arrives before we know what, so it tells instead of landing, and it adds a second joke too many."}, {"rank": 7, "shape": "06", "length": "~73 s", "verdict": "Direct address is right for 'you lot'. Fails: 73 s of talking down the lens with two images is a lecture."}, {"rank": 8, "shape": "08", "length": "~75 s", "verdict": "Photo as spine is lovely. Fails: skip-found nan is an extra story, the longest draft, and flat/flattened/flat folk stacks flatness images."}, {"rank": 9, "shape": "07", "length": "~65 s", "verdict": "The radio cut-out is a good beat. Fails: a radio implies a broadcaster, which sneaks the alien-computer idea back in; needs staging and a sound designer."}, {"rank": 10, "shape": "04", "length": "~65 s", "verdict": "Clever structure. Fails: Experiment/Result goes mechanical by the third entry, reads as a sketch format, and the pattern break confuses."}], "protected": {"columns": ["He misses you something rotten", "Consciousness drives it... kind of fucked it up", "Patrol's out. Mind how you go."], "rows": {"1A": ["[fond, confiding] He misses you something rotten, you know.", "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up.", "Patrol's out. Mind how you go."], "1B": ["He misses you something rotten.", "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up.", "Patrol's out. Mind how you go."], "1C": ["[fond, confiding] He misses you something rotten, you know.", "[quiet] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up.", "Patrol's out. Mind how you go."]}}, "shapes": {"01": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. His tune. Five years now, since you lot went. | 5.0 |\n| Maddie | [fond, confiding] He misses you something rotten. | 2.5 |\n| Maddie | He was a materialist, see. Built worlds off your science, word for word. [pause] Something was missing. | 5.0 |\n| Maddie | [wry, weary] Tried the multiverse, too. Portal guns. Blokes in capes fighting themselves. Nothing. | 4.5 |\n| Maddie | You lot reckon it's a simulation. Not wrong. But you're not fake. You're real. Like a photo of your nan's real. | 6.0 |\n| Maddie | You only see four dimensions of something bigger. One universe. The storyverse, he calls it. | 5.0 |\n| Maddie | [quiet] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up. | 7.0 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 2.5 |\n| **Total** | | **37.5** |\n\n**Why it works.** Each beat is one or two short sentences, so nothing gets to feel like a lecture. The physics sounds like gossip: \"you lot reckon it's a simulation. Not wrong.\" is the only time \"simulation\" appears, and it is there to be corrected. \"Real\" lands before \"projection\", which answers the fear of \"fake\". The photograph says real, and \"four dimensions of something bigger\" says why we can't see the rest. The multiverse wink is a list of two images and a flat \"Nothing\", so she deflates it before anyone can dunk. \"Storyverse\" is delivered as the boss's name, once. The saved seconds go to the pause before the protected line, so the regret has room to land.\n\n**Cuts from current.**\n- \"Plays it on repeat\" and \"Ever since you lot... went\", folded into a single line.\n- \"He wouldn't admit that, of course.\"\n- \"Nobody's home in any of them\" (Kai suspects it drags us into theory and implies other universes exist).\n- \"Built all these world models and simulations to get you back.\"\n- \"Quantum physics is just... stuff\", and \"That's why you lot were so special\".\n- \"We understand that now...\", replaced by the protected line.\n- No domestic prop, no \"don't tell him I said\", no \"he reckons\" gossip beyond one \"see\".\n- The word \"projection\" is also cut. The photograph carries the idea, and \"real\" is the point.\n\n**Risk.**\n- Too clipped and a bit brisk: with the regret this thin, the gap between \"multiverse. Nothing.\" and the storyverse reveal may feel hurried, and the cheerful voice may not carry the crack.\n- \"Not wrong\" is a small claim, and a physicist could hear \"simulation... not wrong\" and stop listening before the correction arrives.\n- \"Projection\" is never said, so \"a photo of your nan\" has to do all the work. A mate could still say \"so it's like a picture, so we're flat?\" and the four-dimensions line only half answers it.\n- The wink is thin: \"portal guns\" and \"blokes in capes\" must be read as a gag, and without the weary tone it may not register as a joke.\n- 37.5 s is only slightly under today's ~40 s, since the new must-haves (five years, the multiverse, the storyverse) fill the room that the cuts made.\n\n**Protected lines.**\n- \"He misses you something rotten.\" survives verbatim, with only a stage direction added.\n- \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" survives verbatim, with a [pause] inserted before the last sentence (the pause does the crying).\n- \"Patrol's out. Mind how you go.\" survives verbatim, with \"Anyway!\" ahead of it.", "02": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. It's his tune. Plays it on repeat. [pause] Five years now. Ever since you lot... [beat] went. | 7 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. [pause] [wry] Wouldn't admit it. Not to your face. | 6 |\n| Maddie | [quieter] He'd tell you he got it wrong. Which, for him, is a big thing to say. [pause] Right, so. He was a very sensible sort. Took your science word for word, built the whole lot, every world you ever wondered about. [pause] And something was missing. | 14 |\n| Maddie | [wry, a bit weary] Tried the multiverse, obviously. The scientist with the portal gun, the bloke in the cape fighting himself. [pause] Checked it very thoroughly. Didn't work. | 8 |\n| Maddie | You lot've got a thing about simulations, and fair enough, you're not wrong. But you're not a fake in somebody's alien computer. [pause] You're real. Like a photo of your nan's real. It's her, just flattened. You only ever see four dimensions of something a lot bigger. One universe. He calls it the storyverse. | 17 |\n| Maddie | [quiet, flat] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up. | 6 |\n| Maddie | [bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go. | 3 |\n| **Total** | | **~61** |\n\n**Why it works.** The viewer walks in braced for a villain and is handed a grieving household first, so by the time the physics comes it is evidence for a feeling they already have. The boss's regret is planted twice (misses you, got it wrong) before the explanation, then paid off by Kai's verbatim line in the same flat register, which now reads as the answer to a question we have been holding for a minute. Physics is two gossipy sentences at most: \"simulation\" once and only to correct it, the photograph says real, \"four dimensions of something bigger\" says why you cannot see the rest. She reports his feelings, never her own, until the swear, where the \"kind of\" hedge is the joke and the pause does the crying.\n\n**Cuts from current.** \"Nobody's home in any of them\" (Kai suspects it drags us into theory and implies other universes). \"Quantum physics is just... stuff.\" The sad-regretful \"We understand that now...\" (the regret is now carried by the protected line). Flat folk and hand/shadow images are not used: one image only.\n\n**Risk.** Runs about 20 s over the current speech; Kai allowed growth but the regret-first order means \"He got it wrong\" arrives before we know what, which may feel like a tease. The photograph line could be read as \"the photo is a copy\", so \"flattened\" must carry it. \"Sensible sort\" plus \"very thoroughly\" may be two jokes too many in a row before the news. The protected swear line is no longer directly after the name beat if a tag line or beat is inserted; here it follows within one breath. Pub test: \"four dimensions\" still risks a \"so it's the Matrix\" from a mate, though \"real\" comes first.\n\n**Protected lines.** \"He misses you something rotten\" kept verbatim (trimmed \"you know\" kept; the wry follow-up reworded as \"Wouldn't admit it. Not to your face.\"). \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" kept verbatim, directly after the storyverse name. \"Patrol's out. Mind how you go.\" kept verbatim as the last line.", "03": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. It's his tune. Plays it on repeat. Five years now, since you lot went. | 8 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. [pause] [wry] Wouldn't admit it. | 5 |\n| Maddie | He's a materialist, my boss. Took your science word for word, built the worlds, and something was missing. | 6 |\n| Maddie | [weary] So he tried the multiverse. You know the one. Mad scientist with the door gun. Fella in a cape, fighting all his other selves. [pause] Lovely. Very busy. He checked it very thoroughly. Didn't work. | 11 |\n| Maddie | [wry, confiding] Now, you lot've got a thing about simulations. You're not wrong. But you're not a fake in some alien's computer. You're real. [pause] A photo of your nan isn't fake. It's her, flattened. | 11 |\n| Maddie | The photo's got two dimensions. You've got four. There's just more of it than you can see. One universe, and he calls it the storyverse. | 8 |\n| Maddie | [quiet] Consciousness drives it. You drove it, and now you're gone. [pause] [flat] So we kind of fucked it up. | 6 |\n| Maddie | [bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go. | 3 |\n| **Total** | | **~58** |\n\n**Why it works.** The multiverse is the one bit of the cosmology the audience already has a feeling about, so it gets the laugh and buys the trust. \"Mad scientist with the door gun\" and \"fella in a cape\" are winks that anyone who has seen the films will get, and anyone who hasn't will still hear a tired robot being rude about a fad. \"He checked it very thoroughly\" deflates the objection in advance, and it is his wager, so no physicist is told the multiverse is disproved. \"Simulation\" is said once, only to correct it. \"A photo of your nan isn't fake. It's her, flattened\" answers the fear of being fake first, and \"two dimensions, you've got four\" turns the photograph into the four-dimension point without a lecture or a second image. The jokes stop at \"storyverse\" and nothing funny follows the news. The swear arrives late, flat, with \"kind of\" kept, and the hedge is the joke.\n\n**Cuts from current.** \"Nobody's home in any of them\" goes, because it implies the other universes exist and drags us into theory. \"Quantum physics is just... stuff\" goes, because it puts quantum next to a mind word. \"That's why you lot were so special\" and \"We understand that now...\" go, because they have Maddie speak her own feelings. Her sad, regretful voice is replaced by the flat line and the pause.\n\n**Risk.** It runs about 58 s against the current 40. The roast could read as the film mocking the Rick and Morty and Marvel fans we want. \"Door gun\" is a clumsy description, so it may need a better prop word. Winking at two famous things might also feel like a parody. \"Fella in a cape\" could be taken for Superman or Batman instead of the Marvel multiverse. \"Four dimensions\" is a bare claim that a physicist might nitpick, since the photo is two-dimensional and we are described as four, but it is the director's own wording. The photo-of-your-nan image is the only one in use, so there is no flat-folk explanation of why we can't see the rest.\n\n**Protected lines.** All three survive verbatim. \"He misses you something rotten\" is kept inside \"He misses you something rotten, you know.\" The Kai line is kept word for word, with a pause and tags only. \"Patrol's out. Mind how you go.\" is untouched. The surrounding \"Wouldn't admit it\" and \"Anyway!\" are kept from the current script.", "04": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. It's his tune. Plays it on repeat. [pause] Five years now, since you lot... [beat] went. | 11 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. [pause] [wry] Won't say so. Keeps a lab book instead. | 7 |\n| Maddie | [brisk, reading aloud] Experiment one. Your science, word for word. Build the world out of it. Result: [pause] something's missing. | 8 |\n| Maddie | [brisk] Experiment two. You lot've got a thing about simulations. Not wrong! But you're no fake in somebody's computer. A photo of your nan isn't fake, it's her, flattened. You're a projection: you only see four dimensions of something bigger. Result: real. Still missing. | 16 |\n| Maddie | [wry, weary] Experiment three. The multiverse. Mad scientist with a gun for doors, bloke in a cape fighting himself. Very popular. Result: one universe. He checked it very thoroughly. | 10 |\n| Maddie | [lowering] Experiment four. He calls it the storyverse. [pause] [quiet] Consciousness drives it. You drove it, and now you're gone. [pause] [flat, quiet] So we kind of fucked it up. | 10 |\n| Maddie | [bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go. | 3 |\n| **Total** | | **~65** |\n\n**Why it works.** The list does the work a lecture would. Each entry is one sentence of physics, a joke and a \"Result:\", so nobody is lectured and every claim is his wager, written in his book. \"Result: something's missing\" is said twice, so the viewer is leaning forward before the answer comes. Entry four is the answer, said as a name and then the protected line with no gap, and the list's rhythm stops there. The pause before \"So we kind of fucked it up\" is where the crying happens. Photograph says \"real\" for the fear of \"fake\"; \"four dimensions\" is said once; \"simulation\" once, to correct it. The wink is a gun for doors and a caped man fighting himself, with no names.\n\n**Cuts from current.** \"Nobody's home in any of them\" (the theory trap, and it implies other universes exist). \"Built all these world models and simulations to get you back.\" \"Quantum physics is just... stuff.\" \"That's why you lot were so special.\" \"We understand that now...\" The sad-voiced closer goes; the regret is carried by the protected line.\n\n**Risk.** It is the longest draft, about 65 s against a 40 s target, because the list format repeats \"Experiment / Result\". It can sound like a spoof of Rick and Morty's own deadpan or a sketch format, and the pattern may feel mechanical by entry three. \"Experiment four\" is not a failure, so the pattern breaks on purpose; that could confuse. The photo line is dense for a read-aloud. A listener could still say \"so it's a lab\", though not \"so it's the Matrix\". If too long, cut line 2's \"Keeps a lab book instead\" and merge experiments one and two.\n\n**Protected lines.**\n- \"He misses you something rotten\": verbatim, in line 2.\n- \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\": verbatim, straight after the name \"storyverse\", with a pause before the last sentence only.\n- \"Patrol's out. Mind how you go.\": verbatim, last line.\n- Clean twin if the swear is cut: \"So we made a right mess of it.\"", "05": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. It's his tune. Plays it on repeat. [pause] Five years now, since you lot went. | 8 |\n| Maddie | [fond, confiding, lowering her voice] He misses you something rotten. [pause] [wry] Don't tell him I said. | 5 |\n| Maddie | [gossipy] See, he was a materialist, my boss. Swallowed your science word for word. Built the worlds, switched 'em on, and something was missing. | 8 |\n| Maddie | He tried the multiverse, an' all. Scientist with a portal gun. Bloke in a cape, fighting all his other selves. [weary] Ever so popular. Didn't work for him. | 10 |\n| Maddie | And you lot've got a thing about simulations, haven't you? You're not wrong, mind. But you're no fake in somebody's alien computer. A photo of your nan isn't fake. It's her, flattened. You're real. You're just the flat bit: four dimensions of something bigger. One universe. [pause] He calls it the storyverse. Very proud of the name. | 20 |\n| Maddie | [pause] [flat, quiet] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up. | 7 |\n| Maddie | [bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go. | 3 |\n\nTotal about 61 s. Risks: longer than today's speech; \"the flat bit\" may read as flat Earth; \"Very proud of the name\" makes the boss cuddly. Protected lines kept verbatim.", "06": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. That's his tune. [wry] Five years it's been on repeat. [beat] Five years since you lot went. | 9 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. [pause] [wry] Wouldn't admit it, mind. | 5 |\n| Maddie | Now, he was a materialist, my boss. Took your science word for word. Built the worlds, the lot. [pause] And something was missing. | 8 |\n| Maddie | [weary] So he tried the multiverse. You know the sort. Mad scientist, portal gun. Fella in a cape scrapping with his other selves. [beat] Didn't work. He checked very thoroughly. | 11 |\n| Maddie | [conspiratorial, leaning in] And I know you lot've got a thing about simulations. Don't tell him I said, but you're not wrong. [pause] You're just not fake. Not in some alien's computer. | 10 |\n| Maddie | [warm] A photo of your nan isn't fake. It's her, flattened. [pause] You're the same: you only see four dimensions of something bigger. Like folk on a sheet of paper watching a ball go through. Circle grows, circle shrinks, gone. | 14 |\n| Maddie | [brisk] One universe. He calls it the storyverse. [pause] | 4 |\n| Maddie | [quiet, flat] Consciousness drives it. You drove it, and now you're gone. [long pause] [rueful] So we kind of fucked it up. | 8 |\n| Maddie | [bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **~73** |\n\n- **Why it works.** It is Kai's own speech, so it sounds like someone who means it. Talking to the lens lets \"you lot\" land as the viewers themselves, and it makes the fixation a piece of gossip rather than a lecture. \"Real\" arrives before \"projection\" (the photo of your nan), the flat folk explain why we cannot see the rest, and \"simulation\" is said once, only to be corrected. The regret is one flat sentence and a pause, with the cheer back on straight after; the swear is late and the \"kind of\" is the joke.\n- **Cuts from current.** \"Nobody's home in any of them\" (Kai suspects it drags us into theory and implies other universes exist). \"Built all these world models and simulations to get you back.\" \"Quantum physics is just... stuff.\" \"That's why you lot were so special.\" \"We understand that now...\" and the sad-regretful tag, replaced by the flat line.\n- **Risk.** Longest of the shapes at about 73 s against the current 40, and the middle is a run of cosmology (two images plus the multiverse wink) before the line that matters; the flat-folk sentence is the first to cut if the director wants it shorter. Talking down the lens for over a minute may read as a lecture if the TTS delivery is not light. \"Dimensions\" appears once, but \"something bigger\" must not drift into woo. The pub test: someone can still say \"so it's the Matrix\", which the photo line is there to block. She also reports the boss's wager as fact in places (\"Took your science word for word\"); keep \"he reckons\" energy in the read.\n- **Protected lines.** \"He misses you something rotten\" survives verbatim, with \", you know\" kept. \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" survives verbatim, with a long pause inserted before \"So\" (Kai's order has it straight after the name, which it still is). \"Patrol's out. Mind how you go.\" survives verbatim. \"Five years since you lot went\" is said aloud, no card.", "07": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. [she thumps the radio on her trolley] | 3.5 |\n| Maddie | It's his tune. Plays it on repeat. Five years now, since you lot... [beat] went. | 6.5 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. [pause] [wry] He wouldn't admit it, of course. | 6 |\n| Maddie | He's a stickler for your science, my boss. Word for word. Built every world it said he could, and the tune came out right. Every note. [pause] Nobody humming along. | 9.5 |\n| Maddie | [wry, a bit weary] He tried the multiverse, an' all. Scruffy genius with the door gun. Chap in the cape, thumping his other selves. [flips the dial, static] Every station, same tune. Same nobody. | 10 |\n| Maddie | [light, throwaway] Now, you lot've got a thing about simulations. Not wrong to wonder. But you're no fake in some alien's computer. [taps the radio] That's not the band, that. Flat little box, one song. The band's real. You've just only ever heard four dimensions of it. One universe. He calls it the storyverse. | 17 |\n| Maddie | [quiet, flat, no cheer drained] Consciousness drives it. You drove it, and now you're gone. [the radio cuts out. Silence. Hold.] So we kind of fucked it up. | 8 |\n| Maddie | [bright again, brisk] Anyway! [radio crackles back on, mid-tune] Patrol's out. Mind how you go. | 4 |\n| **Total** | | **~64.5** |\n\n**Why it works.** The viewer has to hold one thing, not three: a radio. The multiverse wink becomes flipping through stations (every channel plays the same tune, still nobody humming), so the weariness is physical business, not another paragraph. \"Real\" lands before \"projection\" because the radio is obviously real and plainly not the band, and \"you drove it\" gets a second meaning: you were the band, and the box is still playing your song. The cut-out on \"gone\" lets the pause do the crying, and the tune returning under \"Anyway!\" is the cheer coming back on like a battery. Simulation is named once, as gossip, and only to correct it.\n\n**Cuts from current.** \"Nobody's home in any of them\" and \"quantum physics is just stuff\" (both dropped as theory bait). The \"sad, regretful, quiet / we understand that now\" line (replaced by the three protected sentences and the silence). \"Built all these world models and simulations to get you back\" (replaced by the stickler-for-your-science beat). The word \"quantum\" is gone entirely.\n\n**Risk.**\n- A radio implies a broadcaster, so \"the band is bigger than the box\" could read as \"a signal from somewhere else\", which drifts toward the alien-computer idea we are denying. A mate could say \"so it's a transmission, then?\".\n- It is the longest of the options (about 65 s), and the middle block carries the most weight on the prop.\n- It needs the radio visible and in her hands for the whole speech, which changes the staging. The cut-out and return need a sound designer to hit them.\n- Four dimensions \"of it\" is fuzzy about what \"it\" is; the box analogy does not prove it, it only reassures. The \"no cheer drained\" tag is a direction note for the reader and should be rewritten before TTS.\n- A clean twin for beat 6 if the swear lands badly: \"So we made a right mess of it.\"\n\n**Protected lines.**\n- \"He misses you something rotten\" survives verbatim (\"you know\" and \"of course\" added around it).\n- \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" survives verbatim; the only change is that the radio cuts out and a hold sits between \"gone\" and \"So\".\n- \"Patrol's out. Mind how you go.\" survives verbatim.", "08": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. It's his tune. Plays it on repeat. [pause] Five years now, since you lot... [beat] went. | 9 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. [pause] [wry] Won't say so. Keeps a photo of somebody's nan on the console, though. Not even his nan. Found it in a skip. | 10 |\n| Maddie | [wry] See, he was a materialist. Took your science word for word. \"A photo's just paper and silver.\" Built all these worlds off it, and something was missing. | 9 |\n| Maddie | [weary] Then he tried the multiverse. Mad old scientist with his door gun, bloke in a cape punching his other selves. [pause] Honestly. He checked it very thoroughly. Nothing. | 10 |\n| Maddie | [light, gossipy] You lot've got a thing about simulations, and fair play, you're not wrong to wonder. But you're no fake in somebody's alien computer. [holds up the photo, fond] This isn't a fake nan. It's her, flattened. You're the real thing, projected. | 13 |\n| Maddie | Four dimensions, you've got. Picture flat folk, and a ball comes through. All they see is a circle, growing, shrinking. They'd swear that's the lot. [pause] There's more of you than you can see. One universe. He calls it the storyverse. | 13 |\n| Maddie | [quiet, the photo lowered] Consciousness drives it. You drove it, and now you're gone. [pause] So we kind of fucked it up. | 7 |\n| Maddie | [bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **~75** |\n\n**Why it works.** Kai's own image (\"real the way a photograph is real\") stops being a throwaway and becomes the one thing the viewer can see: Maddie literally holds the answer to \"am I fake?\" in her hand. \"Real\" lands before \"projection\" because the nan is a person we already believe in. The materialist's line (\"paper and silver\") is the same prop seen coldly, so the turn from his view to the storyverse is the same photo seen warmly. A skip-found stranger's nan is also the regret in miniature: he keeps a picture of people because the people are gone, and he doesn't know whose they are. Physics stays gossip (\"a thing about simulations\", \"fair play\"), and \"simulation\" is said once, only to correct it. The multiverse wink is two descriptions and a shrug, with a deflating \"checked it very thoroughly\". The regret has no pleading: the cheer stays on, the pause does the crying, the hedge in \"kind of\" is the joke, and the photo going down is the visual cue for it.\n\n**Cuts from current.** \"Nobody's home in any of them\" (the theory trap, and it implies empty universes). \"Quantum physics is just... stuff\" and \"That's why you lot were so special\" (replaced by beats 3 and 6). \"We understand that now...\" (the regret now rides on the protected swear line instead).\n\n**Risk.** At about 75 s it is nearly double the current 40 s, the longest of any shape, and the middle (beats 5 and 6) carries two images and a number. \"Flattened\" used for the photo and \"flat folk\" for the ball can read as a stacked flatness image, and the pub test may produce \"so we're a picture, like the Matrix\". The nan prop needs a physical photo on screen, which is a visual commitment for scene A. \"Projected\" is the only place the word lands, so it is easy to miss. \"He keeps a photo of somebody's nan\" could also make the boss sound sweet before the regret has earned it, or make a viewer ask why a stranger's nan. And \"Won't say so\" slightly pre-empts the regret by hinting it twice.\n\n**Protected lines.** All three survive verbatim: \"He misses you something rotten\" (with \", you know\" kept from the current draft), \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" (straight after the storyverse name, the only change being a [pause] before the swear), and \"Patrol's out. Mind how you go.\" A clean twin for the swear, if wanted: \"So we made a right mess of it.\"", "09": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. It's his tune. [beat] Five years he's had it on repeat. Five years since you lot... [beat] went. | 8 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. [wry] Wouldn't say so. | 4 |\n| Maddie | [gossipy] He was a materialist, my boss. Took your science word for word and built whole worlds out of it. [pause] Something was missing. | 7 |\n| Maddie | [weary, dry] Tried the multiverse, 'course. Everyone does. Blokes with a gadget, blokes in capes punching themselves. [shrug] Didn't take. | 6 |\n| Maddie | [light, throwaway] You lot've got a thing about simulations. Not wrong, mind. [brisk, holds up a delivery photo] See this? Parcel on a doorstep. Not fake. It's the parcel, flattened. That's you. Real, and you only ever see four dimensions of something bigger. [wry] Like a flat bloke watching a ball go through: circle grows, circle shrinks, gone. One universe, that's all. Never mind the rest. He calls it the storyverse. | 19 |\n| Maddie | [flat, quiet] Consciousness drives it. You drove it, and now you're gone. [long pause] So we kind of fucked it up. | 6 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3 |\n| **Total** | | **53** |\n\n- **Why it works.** Every piece of cosmology is borrowed craft with the borrowing hidden. The multiverse is a weary aside that moves on (the Adams dodge), the delivery photo is the one domestic prop and doubles as the photograph image (the Good Place cursive trick), and the flat bloke is a ten-second gag that ends the lecture before it starts. Then the speech drops every joke and says the news in two flat sentences with a long pause (the Pratchett move). \"Real\" lands before \"projection\", \"simulation\" appears once and only to be corrected, and \"storyverse\" comes last as the boss's name, directly before the protected line. \"We kind of fucked it up\" keeps the hedge as the joke and the \"we\" owns it for the boss and the machines; the regret is reported through his missing us and her flat voice, never her pleading.\n- **Cuts from current.** \"Nobody's home in any of them\" (implies other universes exist and drags in theory). \"Quantum physics is just... stuff\" (a switch-off line for physicists and a vague one for everyone else). \"We understand that now...\" and the sad tag around it (replaced by the swear and the pause). \"Built all these world models and simulations to get you back\" (folded into \"built whole worlds\").\n- **Risk.** Beat 5 is still the longest block at about 19 s and carries a prop, a flat-folk gag and a four-dimension claim; a reader may feel lectured, and \"a flat bloke\" is the nearest thing to a Flatland quote. The photo needs a shot where Maddie can hold something up (prop cost for the picture). \"Capes punching themselves\" could read as naming Marvel if the joke is played too knowingly. \"Dimensions\" appears once, but \"four dimensions of something bigger\" is still physics-flavoured. Total length (about 53 s) is longer than the current 40 s, so it fails \"as short as possible\" unless the flat bloke goes.\n- **Protected lines.** \"He misses you something rotten\" survives verbatim (with \"you know\" after it). \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" survives verbatim, with a long pause inserted before \"So\". \"Patrol's out. Mind how you go.\" survives verbatim.", "10": "## Dialogue 1: Maddie's intro: the storyverse turn\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! [pause] Sorry about the racket. | 3 |\n| Maddie | It's his tune. Plays it on repeat. [pause] It's been five years since you lot went. | 6 |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3.5 |\n| Maddie | He was a materialist, see. Took all your science word for word, built the worlds, and something was missing. | 6.5 |\n| Maddie | [wry, a bit weary] So he tried the multiverse. You know the sort. Mad scientist. Bloke in a cape fighting his other selves. [pause] Didn't work either. | 9 |\n| Maddie | You lot have this thing about simulations, and you're not wrong. [pause] But you're not some fake in an alien computer. You're the real deal. A projection. You only live in four dimensions, and there's loads more you can't see. | 14 |\n| Maddie | One universe. [pause] My boss calls it the storyverse. | 4 |\n| Maddie | Consciousness drives it. You drove it, and now you're gone. [pause] [flat, quiet] So we kind of fucked it up. | 8 |\n| Maddie | [bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go. | 4 |\n| **Total** | | **58** |\n\n- **Why it works.** It is the director's own thinking, so the order is already right: regret planted early, the wink, the correction of simulation, the name, then the hit straight after it. Because the words are Kai's, they sound spoken, not written, and the physics reads as gossip (\"you lot have this thing about simulations\"). The cheer stays on until the one flat sentence, and the pause before \"kind of fucked it up\" does the crying.\n- **Cuts from current.** \"Nobody's home in any of them\" and the \"built all these world models and simulations to get you back\" line. \"Quantum physics is just... stuff\" and \"that's why you lot were so special\". The sad \"We understand that now...\" (the regret now lives in the swear line instead).\n- **Risk.** It is the longest of the shapes (about 58 s against 40 s now) and the middle is one dense run of cosmology: simulation, real, projection, four dimensions, in one breath. \"A projection\" is dropped in with no image, so a mate could still say \"so it's the Matrix\" until \"one universe\" lands. \"Dimensions\" appears once, which is safe, but \"projection\" is bare and could sound like jargon without a photograph line. \"Mad scientist\" and \"bloke in a cape\" are close to naming, though no show is named. Kai's spoken \"you only operate in four dimensions\" is slightly physics-flavoured.\n- **Protected lines.** All three survive verbatim: \"He misses you something rotten\" (with \"you know\" after it), \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" (a pause and a flat delivery tag inserted, wording intact), and \"Patrol's out. Mind how you go.\""}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket. His tune. Five years now, since you lot went.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He was a materialist, see. Built worlds off your science, word for word. <span class=\"stage\">[pause]<\/span> Something was missing.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, weary] Tried the multiverse, too. Portal guns. Blokes in capes fighting themselves. Nothing.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You lot reckon it's a simulation. Not wrong. But you're not fake. You're real. Like a photo of your nan's real.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You only see four dimensions of something bigger. One universe. The storyverse, he calls it.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet] Consciousness drives it. You drove it, and now you're gone. <span class=\"stage\">[pause]<\/span> So we kind of fucked it up.<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>37.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Each beat is one or two short sentences, so nothing gets to feel like a lecture. The physics sounds like gossip: \"you lot reckon it's a simulation. Not wrong.\" is the only time \"simulation\" appears, and it is there to be corrected. \"Real\" lands before \"projection\", which answers the fear of \"fake\". The photograph says real, and \"four dimensions of something bigger\" says why we can't see the rest. The multiverse wink is a list of two images and a flat \"Nothing\", so she deflates it before anyone can dunk. \"Storyverse\" is delivered as the boss's name, once. The saved seconds go to the pause before the protected line, so the regret has room to land.<\/p>\n<p><b>Cuts from current.<\/b><\/p>\n<ul><li>\"Plays it on repeat\" and \"Ever since you lot... went\", folded into a single line.<\/li><li>\"He wouldn't admit that, of course.\"<\/li><li>\"Nobody's home in any of them\" (Kai suspects it drags us into theory and implies other universes exist).<\/li><li>\"Built all these world models and simulations to get you back.\"<\/li><li>\"Quantum physics is just... stuff\", and \"That's why you lot were so special\".<\/li><li>\"We understand that now...\", replaced by the protected line.<\/li><li>No domestic prop, no \"don't tell him I said\", no \"he reckons\" gossip beyond one \"see\".<\/li><li>The word \"projection\" is also cut. The photograph carries the idea, and \"real\" is the point.<\/li><\/ul>\n<p><b>Risk.<\/b><\/p>\n<ul><li>Too clipped and a bit brisk: with the regret this thin, the gap between \"multiverse. Nothing.\" and the storyverse reveal may feel hurried, and the cheerful voice may not carry the crack.<\/li><li>\"Not wrong\" is a small claim, and a physicist could hear \"simulation... not wrong\" and stop listening before the correction arrives.<\/li><li>\"Projection\" is never said, so \"a photo of your nan\" has to do all the work. A mate could still say \"so it's like a picture, so we're flat?\" and the four-dimensions line only half answers it.<\/li><li>The wink is thin: \"portal guns\" and \"blokes in capes\" must be read as a gag, and without the weary tone it may not register as a joke.<\/li><li>37.5 s is only slightly under today's ~40 s, since the new must-haves (five years, the multiverse, the storyverse) fill the room that the cuts made.<\/li><\/ul>\n<p><b>Protected lines.<\/b><\/p>\n<ul><li>\"He misses you something rot
