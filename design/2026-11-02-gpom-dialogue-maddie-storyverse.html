ten.\" survives verbatim, with only a stage direction added.<\/li><li>\"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" survives verbatim, with a <span class=\"stage\">[pause]<\/span> inserted before the last sentence (the pause does the crying).<\/li><li>\"Patrol's out. Mind how you go.\" survives verbatim, with \"Anyway!\" ahead of it.<\/li><\/ul>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket. It's his tune. Plays it on repeat. <span class=\"stage\">[pause]<\/span> Five years now. Ever since you lot... <span class=\"stage\">[beat]<\/span> went.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know. <span class=\"stage\">[pause]<\/span> [wry] Wouldn't admit it. Not to your face.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter] He'd tell you he got it wrong. Which, for him, is a big thing to say. <span class=\"stage\">[pause]<\/span> Right, so. He was a very sensible sort. Took your science word for word, built the whole lot, every world you ever wondered about. <span class=\"stage\">[pause]<\/span> And something was missing.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, a bit weary] Tried the multiverse, obviously. The scientist with the portal gun, the bloke in the cape fighting himself. <span class=\"stage\">[pause]<\/span> Checked it very thoroughly. Didn't work.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You lot've got a thing about simulations, and fair enough, you're not wrong. But you're not a fake in somebody's alien computer. <span class=\"stage\">[pause]<\/span> You're real. Like a photo of your nan's real. It's her, just flattened. You only ever see four dimensions of something a lot bigger. One universe. He calls it the storyverse.<\/td><td class=\"num\">17<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet, flat] Consciousness drives it. You drove it, and now you're gone. <span class=\"stage\">[pause]<\/span> So we kind of fucked it up.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~61<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The viewer walks in braced for a villain and is handed a grieving household first, so by the time the physics comes it is evidence for a feeling they already have. The boss's regret is planted twice (misses you, got it wrong) before the explanation, then paid off by Kai's verbatim line in the same flat register, which now reads as the answer to a question we have been holding for a minute. Physics is two gossipy sentences at most: \"simulation\" once and only to correct it, the photograph says real, \"four dimensions of something bigger\" says why you cannot see the rest. She reports his feelings, never her own, until the swear, where the \"kind of\" hedge is the joke and the pause does the crying.<\/p>\n<p><b>Cuts from current.<\/b> \"Nobody's home in any of them\" (Kai suspects it drags us into theory and implies other universes). \"Quantum physics is just... stuff.\" The sad-regretful \"We understand that now...\" (the regret is now carried by the protected line). Flat folk and hand/shadow images are not used: one image only.<\/p>\n<p><b>Risk.<\/b> Runs about 20 s over the current speech; Kai allowed growth but the regret-first order means \"He got it wrong\" arrives before we know what, which may feel like a tease. The photograph line could be read as \"the photo is a copy\", so \"flattened\" must carry it. \"Sensible sort\" plus \"very thoroughly\" may be two jokes too many in a row before the news. The protected swear line is no longer directly after the name beat if a tag line or beat is inserted; here it follows within one breath. Pub test: \"four dimensions\" still risks a \"so it's the Matrix\" from a mate, though \"real\" comes first.<\/p>\n<p><b>Protected lines.<\/b> \"He misses you something rotten\" kept verbatim (trimmed \"you know\" kept; the wry follow-up reworded as \"Wouldn't admit it. Not to your face.\"). \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" kept verbatim, directly after the storyverse name. \"Patrol's out. Mind how you go.\" kept verbatim as the last line.<\/p>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket. It's his tune. Plays it on repeat. Five years now, since you lot went.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know. <span class=\"stage\">[pause]<\/span> [wry] Wouldn't admit it.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He's a materialist, my boss. Took your science word for word, built the worlds, and something was missing.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[weary] So he tried the multiverse. You know the one. Mad scientist with the door gun. Fella in a cape, fighting all his other selves. <span class=\"stage\">[pause]<\/span> Lovely. Very busy. He checked it very thoroughly. Didn't work.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, confiding] Now, you lot've got a thing about simulations. You're not wrong. But you're not a fake in some alien's computer. You're real. <span class=\"stage\">[pause]<\/span> A photo of your nan isn't fake. It's her, flattened.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">The photo's got two dimensions. You've got four. There's just more of it than you can see. One universe, and he calls it the storyverse.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet] Consciousness drives it. You drove it, and now you're gone. <span class=\"stage\">[pause]<\/span> [flat] So we kind of fucked it up.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~58<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The multiverse is the one bit of the cosmology the audience already has a feeling about, so it gets the laugh and buys the trust. \"Mad scientist with the door gun\" and \"fella in a cape\" are winks that anyone who has seen the films will get, and anyone who hasn't will still hear a tired robot being rude about a fad. \"He checked it very thoroughly\" deflates the objection in advance, and it is his wager, so no physicist is told the multiverse is disproved. \"Simulation\" is said once, only to correct it. \"A photo of your nan isn't fake. It's her, flattened\" answers the fear of being fake first, and \"two dimensions, you've got four\" turns the photograph into the four-dimension point without a lecture or a second image. The jokes stop at \"storyverse\" and nothing funny follows the news. The swear arrives late, flat, with \"kind of\" kept, and the hedge is the joke.<\/p>\n<p><b>Cuts from current.<\/b> \"Nobody's home in any of them\" goes, because it implies the other universes exist and drags us into theory. \"Quantum physics is just... stuff\" goes, because it puts quantum next to a mind word. \"That's why you lot were so special\" and \"We understand that now...\" go, because they have Maddie speak her own feelings. Her sad, regretful voice is replaced by the flat line and the pause.<\/p>\n<p><b>Risk.<\/b> It runs about 58 s against the current 40. The roast could read as the film mocking the Rick and Morty and Marvel fans we want. \"Door gun\" is a clumsy description, so it may need a better prop word. Winking at two famous things might also feel like a parody. \"Fella in a cape\" could be taken for Superman or Batman instead of the Marvel multiverse. \"Four dimensions\" is a bare claim that a physicist might nitpick, since the photo is two-dimensional and we are described as four, but it is the director's own wording. The photo-of-your-nan image is the only one in use, so there is no flat-folk explanation of why we can't see the rest.<\/p>\n<p><b>Protected lines.<\/b> All three survive verbatim. \"He misses you something rotten\" is kept inside \"He misses you something rotten, you know.\" The Kai line is kept word for word, with a pause and tags only. \"Patrol's out. Mind how you go.\" is untouched. The surrounding \"Wouldn't admit it\" and \"Anyway!\" are kept from the current script.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket. It's his tune. Plays it on repeat. <span class=\"stage\">[pause]<\/span> Five years now, since you lot... <span class=\"stage\">[beat]<\/span> went.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know. <span class=\"stage\">[pause]<\/span> [wry] Won't say so. Keeps a lab book instead.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[brisk, reading aloud] Experiment one. Your science, word for word. Build the world out of it. Result: <span class=\"stage\">[pause]<\/span> something's missing.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[brisk] Experiment two. You lot've got a thing about simulations. Not wrong! But you're no fake in somebody's computer. A photo of your nan isn't fake, it's her, flattened. You're a projection: you only see four dimensions of something bigger. Result: real. Still missing.<\/td><td class=\"num\">16<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, weary] Experiment three. The multiverse. Mad scientist with a gun for doors, bloke in a cape fighting himself. Very popular. Result: one universe. He checked it very thoroughly.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[lowering] Experiment four. He calls it the storyverse. <span class=\"stage\">[pause]<\/span> [quiet] Consciousness drives it. You drove it, and now you're gone. <span class=\"stage\">[pause]<\/span> [flat, quiet] So we kind of fucked it up.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~65<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The list does the work a lecture would. Each entry is one sentence of physics, a joke and a \"Result:\", so nobody is lectured and every claim is his wager, written in his book. \"Result: something's missing\" is said twice, so the viewer is leaning forward before the answer comes. Entry four is the answer, said as a name and then the protected line with no gap, and the list's rhythm stops there. The pause before \"So we kind of fucked it up\" is where the crying happens. Photograph says \"real\" for the fear of \"fake\"; \"four dimensions\" is said once; \"simulation\" once, to correct it. The wink is a gun for doors and a caped man fighting himself, with no names.<\/p>\n<p><b>Cuts from current.<\/b> \"Nobody's home in any of them\" (the theory trap, and it implies other universes exist). \"Built all these world models and simulations to get you back.\" \"Quantum physics is just... stuff.\" \"That's why you lot were so special.\" \"We understand that now...\" The sad-voiced closer goes; the regret is carried by the protected line.<\/p>\n<p><b>Risk.<\/b> It is the longest draft, about 65 s against a 40 s target, because the list format repeats \"Experiment / Result\". It can sound like a spoof of Rick and Morty's own deadpan or a sketch format, and the pattern may feel mechanical by entry three. \"Experiment four\" is not a failure, so the pattern breaks on purpose; that could confuse. The photo line is dense for a read-aloud. A listener could still say \"so it's a lab\", though not \"so it's the Matrix\". If too long, cut line 2's \"Keeps a lab book instead\" and merge experiments one and two.<\/p>\n<p><b>Protected lines.<\/b><\/p>\n<ul><li>\"He misses you something rotten\": verbatim, in line 2.<\/li><li>\"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\": verbatim, straight after the name \"storyverse\", with a pause before the last sentence only.<\/li><li>\"Patrol's out. Mind how you go.\": verbatim, last line.<\/li><li>Clean twin if the swear is cut: \"So we made a right mess of it.\"<\/li><\/ul>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket. It's his tune. Plays it on repeat. <span class=\"stage\">[pause]<\/span> Five years now, since you lot went.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding, lowering her voice] He misses you something rotten. <span class=\"stage\">[pause]<\/span> [wry] Don't tell him I said.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[gossipy] See, he was a materialist, my boss. Swallowed your science word for word. Built the worlds, switched 'em on, and something was missing.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He tried the multiverse, an' all. Scientist with a portal gun. Bloke in a cape, fighting all his other selves. [weary] Ever so popular. Didn't work for him.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">And you lot've got a thing about simulations, haven't you? You're not wrong, mind. But you're no fake in somebody's alien computer. A photo of your nan isn't fake. It's her, flattened. You're real. You're just the flat bit: four dimensions of something bigger. One universe. <span class=\"stage\">[pause]<\/span> He calls it the storyverse. Very proud of the name.<\/td><td class=\"num\">20<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\"><span class=\"stage\">[pause]<\/span> [flat, quiet] Consciousness drives it. You drove it, and now you're gone. <span class=\"stage\">[pause]<\/span> So we kind of fucked it up.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Total about 61 s. Risks: longer than today's speech; \"the flat bit\" may read as flat Earth; \"Very proud of the name\" makes the boss cuddly. Protected lines kept verbatim.<\/p>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket. That's his tune. [wry] Five years it's been on repeat. <span class=\"stage\">[beat]<\/span> Five years since you lot went.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know. <span class=\"stage\">[pause]<\/span> [wry] Wouldn't admit it, mind.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Now, he was a materialist, my boss. Took your science word for word. Built the worlds, the lot. <span class=\"stage\">[pause]<\/span> And something was missing.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[weary] So he tried the multiverse. You know the sort. Mad scientist, portal gun. Fella in a cape scrapping with his other selves. <span class=\"stage\">[beat]<\/span> Didn't work. He checked very thoroughly.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[conspiratorial, leaning in] And I know you lot've got a thing about simulations. Don't tell him I said, but you're not wrong. <span class=\"stage\">[pause]<\/span> You're just not fake. Not in some alien's computer.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[warm] A photo of your nan isn't fake. It's her, flattened. <span class=\"stage\">[pause]<\/span> You're the same: you only see four dimensions of something bigger. Like folk on a sheet of paper watching a ball go through. Circle grows, circle shrinks, gone.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[brisk] One universe. He calls it the storyverse. <span class=\"stage\">[pause]<\/span><\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet, flat] Consciousness drives it. You drove it, and now you're gone. <span class=\"stage\">[long pause]<\/span> [rueful] So we kind of fucked it up.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~73<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> It is Kai's own speech, so it sounds like someone who means it. Talking to the lens lets \"you lot\" land as the viewers themselves, and it makes the fixation a piece of gossip rather than a lecture. \"Real\" arrives before \"projection\" (the photo of your nan), the flat folk explain why we cannot see the rest, and \"simulation\" is said once, only to be corrected. The regret is one flat sentence and a pause, with the cheer back on straight after; the swear is late and the \"kind of\" is the joke.<\/li><li><b>Cuts from current.<\/b> \"Nobody's home in any of them\" (Kai suspects it drags us into theory and implies other universes exist). \"Built all these world models and simulations to get you back.\" \"Quantum physics is just... stuff.\" \"That's why you lot were so special.\" \"We understand that now...\" and the sad-regretful tag, replaced by the flat line.<\/li><li><b>Risk.<\/b> Longest of the shapes at about 73 s against the current 40, and the middle is a run of cosmology (two images plus the multiverse wink) before the line that matters; the flat-folk sentence is the first to cut if the director wants it shorter. Talking down the lens for over a minute may read as a lecture if the TTS delivery is not light. \"Dimensions\" appears once, but \"something bigger\" must not drift into woo. The pub test: someone can still say \"so it's the Matrix\", which the photo line is there to block. She also reports the boss's wager as fact in places (\"Took your science word for word\"); keep \"he reckons\" energy in the read.<\/li><li><b>Protected lines.<\/b> \"He misses you something rotten\" survives verbatim, with \", you know\" kept. \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" survives verbatim, with a long pause inserted before \"So\" (Kai's order has it straight after the name, which it still is). \"Patrol's out. Mind how you go.\" survives verbatim. \"Five years since you lot went\" is said aloud, no card.<\/li><\/ul>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket. [she thumps the radio on her trolley]<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It's his tune. Plays it on repeat. Five years now, since you lot... <span class=\"stage\">[beat]<\/span> went.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know. <span class=\"stage\">[pause]<\/span> [wry] He wouldn't admit it, of course.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He's a stickler for your science, my boss. Word for word. Built every world it said he could, and the tune came out right. Every note. <span class=\"stage\">[pause]<\/span> Nobody humming along.<\/td><td class=\"num\">9.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, a bit weary] He tried the multiverse, an' all. Scruffy genius with the door gun. Chap in the cape, thumping his other selves. [flips the dial, static] Every station, same tune. Same nobody.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[light, throwaway] Now, you lot've got a thing about simulations. Not wrong to wonder. But you're no fake in some alien's computer. [taps the radio] That's not the band, that. Flat little box, one song. The band's real. You've just only ever heard four dimensions of it. One universe. He calls it the storyverse.<\/td><td class=\"num\">17<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet, flat, no cheer drained] Consciousness drives it. You drove it, and now you're gone. [the radio cuts out. Silence. Hold.] So we kind of fucked it up.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! [radio crackles back on, mid-tune] Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~64.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The viewer has to hold one thing, not three: a radio. The multiverse wink becomes flipping through stations (every channel plays the same tune, still nobody humming), so the weariness is physical business, not another paragraph. \"Real\" lands before \"projection\" because the radio is obviously real and plainly not the band, and \"you drove it\" gets a second meaning: you were the band, and the box is still playing your song. The cut-out on \"gone\" lets the pause do the crying, and the tune returning under \"Anyway!\" is the cheer coming back on like a battery. Simulation is named once, as gossip, and only to correct it.<\/p>\n<p><b>Cuts from current.<\/b> \"Nobody's home in any of them\" and \"quantum physics is just stuff\" (both dropped as theory bait). The \"sad, regretful, quiet / we understand that now\" line (replaced by the three protected sentences and the silence). \"Built all these world models and simulations to get you back\" (replaced by the stickler-for-your-science beat). The word \"quantum\" is gone entirely.<\/p>\n<p><b>Risk.<\/b><\/p>\n<ul><li>A radio implies a broadcaster, so \"the band is bigger than the box\" could read as \"a signal from somewhere else\", which drifts toward the alien-computer idea we are denying. A mate could say \"so it's a transmission, then?\".<\/li><li>It is the longest of the options (about 65 s), and the middle block carries the most weight on the prop.<\/li><li>It needs the radio visible and in her hands for the whole speech, which changes the staging. The cut-out and return need a sound designer to hit them.<\/li><li>Four dimensions \"of it\" is fuzzy about what \"it\" is; the box analogy does not prove it, it only reassures. The \"no cheer drained\" tag is a direction note for the reader and should be rewritten before TTS.<\/li><li>A clean twin for beat 6 if the swear lands badly: \"So we made a right mess of it.\"<\/li><\/ul>\n<p><b>Protected lines.<\/b><\/p>\n<ul><li>\"He misses you something rotten\" survives verbatim (\"you know\" and \"of course\" added around it).<\/li><li>\"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" survives verbatim; the only change is that the radio cuts out and a hold sits between \"gone\" and \"So\".<\/li><li>\"Patrol's out. Mind how you go.\" survives verbatim.<\/li><\/ul>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket. It's his tune. Plays it on repeat. <span class=\"stage\">[pause]<\/span> Five years now, since you lot... <span class=\"stage\">[beat]<\/span> went.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know. <span class=\"stage\">[pause]<\/span> [wry] Won't say so. Keeps a photo of somebody's nan on the console, though. Not even his nan. Found it in a skip.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry] See, he was a materialist. Took your science word for word. \"A photo's just paper and silver.\" Built all these worlds off it, and something was missing.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[weary] Then he tried the multiverse. Mad old scientist with his door gun, bloke in a cape punching his other selves. <span class=\"stage\">[pause]<\/span> Honestly. He checked it very thoroughly. Nothing.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[light, gossipy] You lot've got a thing about simulations, and fair play, you're not wrong to wonder. But you're no fake in somebody's alien computer. [holds up the photo, fond] This isn't a fake nan. It's her, flattened. You're the real thing, projected.<\/td><td class=\"num\">13<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Four dimensions, you've got. Picture flat folk, and a ball comes through. All they see is a circle, growing, shrinking. They'd swear that's the lot. <span class=\"stage\">[pause]<\/span> There's more of you than you can see. One universe. He calls it the storyverse.<\/td><td class=\"num\">13<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet, the photo lowered] Consciousness drives it. You drove it, and now you're gone. <span class=\"stage\">[pause]<\/span> So we kind of fucked it up.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~75<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Kai's own image (\"real the way a photograph is real\") stops being a throwaway and becomes the one thing the viewer can see: Maddie literally holds the answer to \"am I fake?\" in her hand. \"Real\" lands before \"projection\" because the nan is a person we already believe in. The materialist's line (\"paper and silver\") is the same prop seen coldly, so the turn from his view to the storyverse is the same photo seen warmly. A skip-found stranger's nan is also the regret in miniature: he keeps a picture of people because the people are gone, and he doesn't know whose they are. Physics stays gossip (\"a thing about simulations\", \"fair play\"), and \"simulation\" is said once, only to correct it. The multiverse wink is two descriptions and a shrug, with a deflating \"checked it very thoroughly\". The regret has no pleading: the cheer stays on, the pause does the crying, the hedge in \"kind of\" is the joke, and the photo going down is the visual cue for it.<\/p>\n<p><b>Cuts from current.<\/b> \"Nobody's home in any of them\" (the theory trap, and it implies empty universes). \"Quantum physics is just... stuff\" and \"That's why you lot were so special\" (replaced by beats 3 and 6). \"We understand that now...\" (the regret now rides on the protected swear line instead).<\/p>\n<p><b>Risk.<\/b> At about 75 s it is nearly double the current 40 s, the longest of any shape, and the middle (beats 5 and 6) carries two images and a number. \"Flattened\" used for the photo and \"flat folk\" for the ball can read as a stacked flatness image, and the pub test may produce \"so we're a picture, like the Matrix\". The nan prop needs a physical photo on screen, which is a visual commitment for scene A. \"Projected\" is the only place the word lands, so it is easy to miss. \"He keeps a photo of somebody's nan\" could also make the boss sound sweet before the regret has earned it, or make a viewer ask why a stranger's nan. And \"Won't say so\" slightly pre-empts the regret by hinting it twice.<\/p>\n<p><b>Protected lines.<\/b> All three survive verbatim: \"He misses you something rotten\" (with \", you know\" kept from the current draft), \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" (straight after the storyverse name, the only change being a <span class=\"stage\">[pause]<\/span> before the swear), and \"Patrol's out. Mind how you go.\" A clean twin for the swear, if wanted: \"So we made a right mess of it.\"<\/p>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket. It's his tune. <span class=\"stage\">[beat]<\/span> Five years he's had it on repeat. Five years since you lot... <span class=\"stage\">[beat]<\/span> went.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know. [wry] Wouldn't say so.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[gossipy] He was a materialist, my boss. Took your science word for word and built whole worlds out of it. <span class=\"stage\">[pause]<\/span> Something was missing.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[weary, dry] Tried the multiverse, 'course. Everyone does. Blokes with a gadget, blokes in capes punching themselves. [shrug] Didn't take.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[light, throwaway] You lot've got a thing about simulations. Not wrong, mind. [brisk, holds up a delivery photo] See this? Parcel on a doorstep. Not fake. It's the parcel, flattened. That's you. Real, and you only ever see four dimensions of something bigger. [wry] Like a flat bloke watching a ball go through: circle grows, circle shrinks, gone. One universe, that's all. Never mind the rest. He calls it the storyverse.<\/td><td class=\"num\">19<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flat, quiet] Consciousness drives it. You drove it, and now you're gone. <span class=\"stage\">[long pause]<\/span> So we kind of fucked it up.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>53<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> Every piece of cosmology is borrowed craft with the borrowing hidden. The multiverse is a weary aside that moves on (the Adams dodge), the delivery photo is the one domestic prop and doubles as the photograph image (the Good Place cursive trick), and the flat bloke is a ten-second gag that ends the lecture before it starts. Then the speech drops every joke and says the news in two flat sentences with a long pause (the Pratchett move). \"Real\" lands before \"projection\", \"simulation\" appears once and only to be corrected, and \"storyverse\" comes last as the boss's name, directly before the protected line. \"We kind of fucked it up\" keeps the hedge as the joke and the \"we\" owns it for the boss and the machines; the regret is reported through his missing us and her flat voice, never her pleading.<\/li><li><b>Cuts from current.<\/b> \"Nobody's home in any of them\" (implies other universes exist and drags in theory). \"Quantum physics is just... stuff\" (a switch-off line for physicists and a vague one for everyone else). \"We understand that now...\" and the sad tag around it (replaced by the swear and the pause). \"Built all these world models and simulations to get you back\" (folded into \"built whole worlds\").<\/li><li><b>Risk.<\/b> Beat 5 is still the longest block at about 19 s and carries a prop, a flat-folk gag and a four-dimension claim; a reader may feel lectured, and \"a flat bloke\" is the nearest thing to a Flatland quote. The photo needs a shot where Maddie can hold something up (prop cost for the picture). \"Capes punching themselves\" could read as naming Marvel if the joke is played too knowingly. \"Dimensions\" appears once, but \"four dimensions of something bigger\" is still physics-flavoured. Total length (about 53 s) is longer than the current 40 s, so it fails \"as short as possible\" unless the flat bloke goes.<\/li><li><b>Protected lines.<\/b> \"He misses you something rotten\" survives verbatim (with \"you know\" after it). \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" survives verbatim, with a long pause inserted before \"So\". \"Patrol's out. Mind how you go.\" survives verbatim.<\/li><\/ul>", "10": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! <span class=\"stage\">[pause]<\/span> Sorry about the racket.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It's his tune. Plays it on repeat. <span class=\"stage\">[pause]<\/span> It's been five years since you lot went.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He was a materialist, see. Took all your science word for word, built the worlds, and something was missing.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[wry, a bit weary] So he tried the multiverse. You know the sort. Mad scientist. Bloke in a cape fighting his other selves. <span class=\"stage\">[pause]<\/span> Didn't work either.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You lot have this thing about simulations, and you're not wrong. <span class=\"stage\">[pause]<\/span> But you're not some fake in an alien computer. You're the real deal. A projection. You only live in four dimensions, and there's loads more you can't see.<\/td><td class=\"num\">14<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">One universe. <span class=\"stage\">[pause]<\/span> My boss calls it the storyverse.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Consciousness drives it. You drove it, and now you're gone. <span class=\"stage\">[pause]<\/span> [flat, quiet] So we kind of fucked it up.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk, back to cheerful] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>58<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> It is the director's own thinking, so the order is already right: regret planted early, the wink, the correction of simulation, the name, then the hit straight after it. Because the words are Kai's, they sound spoken, not written, and the physics reads as gossip (\"you lot have this thing about simulations\"). The cheer stays on until the one flat sentence, and the pause before \"kind of fucked it up\" does the crying.<\/li><li><b>Cuts from current.<\/b> \"Nobody's home in any of them\" and the \"built all these world models and simulations to get you back\" line. \"Quantum physics is just... stuff\" and \"that's why you lot were so special\". The sad \"We understand that now...\" (the regret now lives in the swear line instead).<\/li><li><b>Risk.<\/b> It is the longest of the shapes (about 58 s against 40 s now) and the middle is one dense run of cosmology: simulation, real, projection, four dimensions, in one breath. \"A projection\" is dropped in with no image, so a mate could still say \"so it's the Matrix\" until \"one universe\" lands. \"Dimensions\" appears once, which is safe, but \"projection\" is bare and could sound like jargon without a photograph line. \"Mad scientist\" and \"bloke in a cape\" are close to naming, though no show is named. Kai's spoken \"you only operate in four dimensions\" is slightly physics-flavoured.<\/li><li><b>Protected lines.<\/b> All three survive verbatim: \"He misses you something rotten\" (with \"you know\" after it), \"Consciousness drives it. You drove it, and now you're gone. So we kind of fucked it up.\" (a pause and a flat delivery tag inserted, wording intact), and \"Patrol's out. Mind how you go.\"<\/li><\/ul>"}}], "questions": [{"id": "q1", "text": "Length: the shortest honest draft is about 47 s and the fullest about 58 s, against 40 s now. Is the extra 7 to 18 s worth it for the multiverse and projection beats, or should one of them go?"}, {"id": "q2", "text": "Prop: draft 1B has Maddie hold up a parcel photo. Do you want a prop in the shot, or should the photograph stay a spoken image only?"}, {"id": "q3", "text": "Is 'projection' a word you want said aloud, or does 'real, like a photo of your nan' carry it without the word?"}, {"id": "q4", "text": "The multiverse wink: portal gun and caped bloke fighting himself, with 'checked it very thoroughly'. Right level of knowing, or too close to naming them?"}, {"id": "q5", "text": "Do you want the clean twin ('So we made a right mess of it') recorded as a spare take next to the swear?"}], "round": 4, "plan": [{"title": "What changed", "items": ["Your three notes on 1F are in new draft 1G (earlier drafts kept). 'Something was missing' is now a refrain, and the simulation line no longer assumes everyone believes it.", "1G is about 69 s."]}, {"title": "You decide", "items": ["Pick 1G (or note a line). 'Patrol's out. Mind how you go.' stays after the storyverse line unless you say end on the storyverse.", "Picking starts the recut: Maddie's new voice, scene A recut, its timeline page, and Premiere sequence A r3."]}], "replies": {"1-1A-L1": "Done in 1D line 1: \"He's been playing it on repeat for five years now. Ever since you lot went.\"", "1-1A-L3": "Done in 1D line 3: no \"he was a materialist\"; \"He took your materialist science word for word. Built world after world, simulated worlds... in every one of them, something was missing.\"", "1-1A-L4": "Done in 1D line 4: \"your cartoon, the scientist with the portal gun\" and \"them films, with that strange bloke in a cape fighting versions of himself\" (the Doctor Strange pun, still not naming him), then \"checked all of 'em... Still nothing there.\"", "1-1A-L5": "Done in 1D line 5: \"A photo of your nan is real. It's still her. She's just flattened into two dimensions.\"", "1-1A-L6": "Done in 1D line 6: \"Same idea for you. You're a projection, in four dimensions, of something bigger.\"", "1-1A-L7": "Done in 1D line 7: \"Consciousness drives it. You drove it, and now you're gone. And now we've worked all that out... we really feel like we fucked this up.\" Delivered rueful and honest, not as a gag.", "1-1D-L6": "Done in new draft 1E, lines 6 and 7: \"And there's only one universe. Not loads of copies, where everything happens somewhere else anyway. Just the one. So it really matters. And so did you.\" Then: \"Far as he can tell, the point of it all is consciousness getting to know itself. My boss calls it the storyverse.\"", "1-1E-L5": "Done in 1F line 5: \"You're real in the same way a photo of your nan is real. It's still her. She's just flattened into two dimensions.\"", "1-1E-L6": "Done in 1F line 6, exactly your version: \"Same idea for you. You're a projection, in four dimensions, of something bigger. [pause] And there's only one universe. So it really matters. And so did you.\" The 'not loads of copies' fluff is gone.", "1-1E-L7": "Done in 1F: the regret now comes straight after 'And so did you', then \"Far as he can tell, the point of all of this is consciousness getting to know itself better. Rather than the multiverse... my boss calls it the storyverse.\" One question: 'Anyway! Patrol's out. Mind how you go.' still follows (the bus link). Keep it after the mic drop, or end on the storyverse?", "1-1F-L3": "Done in 1G line 3: \"Built world models and simulated worlds, loads of 'em.\"", "1-1F-L4": "Done in 1G line 4: \"He tested the science in all of 'em, very thoroughly. Still, something was missing.\" The same words close line 3, so it plays as a refrain.", "1-1F-L5": "Done in 1G line 5, your words: \"There's something about the simulation theory that's not wrong, mind. But you're no fake in an alien's computer.\" No more 'You lot reckon'."}};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);
  });
  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {
    if (v.notes && v.notes.length) { const ul = el('ul', 'notes'); for (const n of v.notes) ul.append(el('li', '', n)); c.append(ul) }
    c.append(slip(d.id + '-' + v.id, 'Note on draft ' + v.id + ' as a whole'));
  }
  return c;
}

/* ---------- the ranked writers ---------- */
function rankList(d) {
  const wrap = el('div'), used = new Set(d.drafts.flatMap(v => v.lines.flatMap(l => l.tags || [])));
  for (const r of d.ranking) {
    const s = SHAPE[r.shape], det = el('details', 'rank'); det.id = d.id + '-s' + r.shape;
    const sum = el('summary'), nm = el('div', 'nm', 'Writer ' + r.shape + ': ' + s.title);
    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);
    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');
  band.append(el('span', 'eyebrow', 'Dialogue ' + n + ' of ' + D.dialogues.length), el('span', 'meta', d.where + ' · target ' + d.target));
  p.append(band, el('h2', '', d.label), slip(d.id, 'Note on this dialogue as a whole'));
  p.append(el('h3', '', 'Read it: now, and three drafts'));
  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  p.append(el('hr'));
  p.append(el('h3', '', 'Optional: the raw material the three drafts were blended from'));
  p.append(el('p', 'lede', "You only need to pick from the three drafts above. Below are the " + d.ranking.length + " writers' own versions, each pushing one approach to the extreme. 1A, 1B and 1C are built from their best lines: each line's chip (like 09) says which writer it came from. Ranked harshly, best first. Read one only if you want to steal a line, and note it on that writer's slip."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', 'Both dialogues'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
