ss=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[to camera, rain, straight] Behind me, a junction. Above me, a sign. <span class=\"stage\">[beat]<\/span> The sign says emergency vehicles have right of way.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, seething] I said raspberry.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[back to camera, not turning] <b>The sign has been reminded of its position.<\/b><\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">[sign, lit by blue, small council font] \"GIVE WAY TO EMERGENCY VEHICLES (except)\"<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">about 24 words<\/td><td class=\"num\"><b>9.3 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Version B: the red light<\/b> (detail: the pedestrian-crossing style countdown, stuck, the ambulance waiting on it)<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[to camera] This light has been red for ninety seconds. It is not broken. It has been asked to stay red.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC<\/td><td class=\"line\">[through the windscreen, flat] Is that him?<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[phone, motorcade] I said raspberry.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[light turns green behind her] <b>And it's green. Lovely. It was only ever a question of who was coming.<\/b><\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">none<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">about 36 words<\/td><td class=\"num\"><b>11.5 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Version C: the queue<\/b> (detail: one ambulance, blue lights on, at the front of a line of ordinary cars, all of them waiting politely)<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[to camera] Tonight's queue is eleven cars long, and one ambulance. Nobody is hooting. Britain, ladies and gentlemen.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[phone] I said raspberry.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[flat, as the motorcade passes behind her] <b>Eleven cars, one ambulance, and a lemon curd emergency.<\/b><\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">\"LEMON CURD INCIDENT: 1 / PATIENT: PENDING\"<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">about 31 words<\/td><td class=\"num\"><b>9.5 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The joke is already in the junction; we only have to point the camera at it. A sign that says one thing while the street does another (A), a light that obeys the wrong person (B) and a polite British queue (C) each carry the whole argument without anyone saying whose time counts. The reporter treats the street as the news item and the minister's lemon curd as the only real emergency, so the gap between the two vehicles is felt, not stated. Lines are short and mouth-able, and the spoken total sits well inside 12-14 s, leaving room for the 5 s picture beats. Punchlines are in bold: A \"reminded of its position\", B \"only ever a question of who was coming\" (the closest to saying the point, cut it if Jack finds it too near), C \"a lemon curd emergency\".<\/p>\n<p><b>Cuts from current.<\/b> Any reporter line that characterises the minister or the police. No narration of the ambulance's cargo; the paramedic is used once at most. The caption in A and C is the street's own signage, not a meme text card, so it needs no punchline of its own.<\/p>\n<p><b>Risk.<\/b> B's last line leans on the moral and could tip into saying the point aloud; A depends on viewers reading a small sign in a night shot, so the reporter has to say \"sign\" first or it is lost. C's \"Britain, ladies and gentlemen\" is a mild sneer at the viewer and may need cutting. The captions need the image to be sharp enough to read. In all three the reporter has to stay straight; if she winks, it collapses.<\/p>\n<p><b>Protected lines.<\/b> \"I said raspberry.\" survives verbatim in all three versions, always as the minister's only line, after the reporter's setup and before her button.<\/p>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[straight to camera, ambulance idling red-lit behind, outrider's hand up] \"Traffic on the A40 is being managed this evening, to keep an important journey moving.\"<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, back seat, motorcade sweeping through] \"Lemon curd. I said raspberry.\" <b>(PUNCHLINE 1, protected line)<\/b><\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">[lower-third, news-ticker style, over the ambulance finally pulling away in the rain] \"RASPBERRY SHORTAGE: LATEST\" <b>(PUNCHLINE 2, the meme)<\/b><\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[back to camera, unmoved] \"We will bring you more on the jam as it develops.\" <b>(PUNCHLINE 3, the button)<\/b><\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">24 words spoken<\/td><td class=\"num\"><b>10.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Alternate buttons to swap in (same slot):<\/p>\n<ul><li>REPORTER [deadpan]: \"Our thoughts are with the toast.\" (Punchline: the toast; 2 s.)<\/li><li>CAPTION only, reporter silent, held on her face: \"MINISTER 'DEEPLY CONCERNED'\" over the ambulance's tail lights. (0 s spoken; the Day Today move of letting the graphic do the lying.)<\/li><li>REPORTER: \"Anyone with information on the lemon curd should contact the police.\" (Punchline: police as the jam's guardians; 3.5 s.)<\/li><\/ul>\n<p><b>Why it works.<\/b> The Day Today and Brass Eye ran on authority applied to the wrong object: the presenter sounds exactly as serious about nonsense as about a death, and the audience supplies the outrage. Here the reporter's opening line is Look Around You in miniature, a calm passive-voice description (\"is being managed\", \"an important journey\") that is technically true and never names who or what is held. The minister then spends the film's only emotion on a condiment. The caption is the second voice: it adopts the grammar of breaking news (\"LATEST\") for the jam, and the reporter's final promise of \"more on the jam as it develops\" lets the audience complete the comparison with the ambulance themselves. Nobody says whose time counts; the reporter simply gives all her gravitas to the wrong thing, in the voice of UK regional news.<\/p>\n<p><b>Cuts from current.<\/b> Any explanation of the ambulance (patient, urgency, paramedic line) goes: the picture carries it. No narrator knowing-how-it-ends line; the reporter stays inside the news voice for this one. The outrider and paramedic get no speech.<\/p>\n<p><b>Risk.<\/b> \"Important journey\" could read as the reporter endorsing the motorcade, so the delivery must be bland, not approving; a wink kills it. The caption has to be readable in under two seconds on a phone. \"Jam\" is a double meaning (traffic and lemon curd's neighbour) that may be too cute, with raspberry jam implied rather than stated; if it confuses, swap to \"We will bring you more as it develops.\" Total is about 10.5 s of speech, so there is spare room for a beat of silence on the ambulance, which is probably where the real laugh is.<\/p>\n<p><b>Protected lines.<\/b> \"I said raspberry.\" survives verbatim, the last three words of the minister's line; \"Lemon curd.\" is added in front as the set-up, since the line alone has nothing to answer.<\/p>", "10": "<p><b>Version A: the good-news caption (ending: the ambulance is still stuck)<\/b><\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[flat, regional, rain on the mic] Police have stopped this ambulance at a red light. A car is coming through.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, motorcade, seething] I said raspberry.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[to camera, same flat voice, ambulance still held behind him] We'll bring you more as we get it.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">[white meme text, freeze on the ambulance, blue lights still turning] <b>[PUNCHLINE]<\/b> BREAKING: THE RASPBERRY HAS BEEN FOUND<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">Total<\/td><td class=\"line\"><\/td><td class=\"num\">8.0 spoken, ~20 with picture<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The caption is good news delivered over bad news, and the viewer's eye does the sum: the freeze holds on the ambulance, still waiting, while the text celebrates a jam. Nobody says whose time counts; the picture is the only thing that disagrees with the caption. The reporter's lines are pure \"and now the local news\" dryness, so the gap between the tone and the scene is the joke.<\/li><li><b>Cuts from current.<\/b> Nothing spoken is lost except the unwritten reporter placeholder; the reporter now speaks 18 words in total.<\/li><li><b>Risk.<\/b> The caption is a sight gag, so if the ambulance is not visibly still held in frame 15-20 s it reads as a non-sequitur. \"Found\" may be too cute for a Jack who wants a sharper word (\"RESOLVED\", \"SORTED\").<\/li><li><b>Protected lines.<\/b> \"I said raspberry.\" kept verbatim, on its own beat.<\/li><\/ul>\n<p><b>Version B: the reporter who knows how this ends (ending: back to camera, no caption)<\/b><\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[straight to camera, blue light on the balaclava] Behind me, an ambulance. Ahead of it, a red light. Coming through it, a man in a hurry.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, furious] I said raspberry.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[same dead calm, ambulance finally pulling away behind] In my timeline, this is where the jam starts. <b>[PUNCHLINE]<\/b> Not on the road.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Total<\/td><td class=\"line\"><\/td><td class=\"num\">10.5 spoken, ~20 with picture<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The reporter is the future narrator in disguise: certainty without a moral. \"The jam starts\" and the cut to wet empty road tells you something is about to go wrong without telling you what. The twist (\"not on the road\") hints at the real jam without defining it.<\/li><li><b>Cuts from current.<\/b> Drops the caption entirely; the reporter carries the button.<\/li><li><b>Risk.<\/b> Close to a stated moral. If \"not on the road\" feels like it explains const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));

    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);

}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {

/* ---------- the ranked writers ---------- */
function rankList(d) {

    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);

function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');

  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
