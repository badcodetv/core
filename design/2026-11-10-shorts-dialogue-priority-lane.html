<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:32px 8px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3em;text-wrap:balance}
.about{color:var(--muted);max-width:70ch;margin:0 0 1em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}
.tabs a .picked{color:var(--pick)}
section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.6rem;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
h3{font-size:1.05rem;margin:28px 0 8px}
.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{font:inherit;cursor:pointer;text-align:left;background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button.picked{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick);background:var(--pickbg)}
.seg button.cmp{margin-left:auto;align-self:center;font-size:.85rem;background:transparent}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:10px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-head h4{margin:0;font-size:1.25rem}
.bet{font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin:6px 0 0;max-width:70ch}
.pickbtn{font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--pick);color:var(--pick);background:transparent;white-space:nowrap}
.pickbtn.on{background:var(--pick);color:var(--paper)}
.script{margin:14px 0 4px;border-top:1px solid var(--rule)}
.ln{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.who{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.who.maddie{color:var(--accent)}.who.lady{color:var(--lady)}.who.other{color:var(--muted)}
.said{font:18px/1.5 "Source Serif 4",Georgia,serif}
.said.dir{font-style:italic;color:var(--muted);font-size:16px}
.stage{color:var(--muted);font-style:italic;font-size:.88em}
.side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:9rem}
.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.chip{font:600 .7rem Inter,sans-serif;border:0;background:var(--chip);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer}
.chip.plain{cursor:default;color:var(--muted)}
.ln .slipw{grid-column:2/4}
.addnote{font:500 .78rem Inter,sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline dotted}
.total{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding-top:8px}
.notes{margin:12px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.slipw{margin-top:8px}
.slipw label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.slipw label .ok{color:var(--pick)}
textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:4px 10px;font-size:.88rem;background:var(--soft)}
.reply b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.compare .card{margin:0;padding:14px}
.compare .ln{grid-template-columns:minmax(0,1fr);gap:2px}
.compare .said{font-size:15.5px}
.compare .side{justify-content:flex-start;max-width:none}
.rank{background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
.rank>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.rank>summary::-webkit-details-marker{display:none}
.rank .n{font:700 1.3rem/1 Inter,sans-serif;color:var(--muted);padding-top:2px}
.rank .nm{font-weight:700}
.rank .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rank .verdict{grid-column:2/4;font-size:.9rem;color:var(--fg)}
.rank .len{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rank .used{font-size:.72rem;font-weight:600;color:var(--pick);margin-left:6px}
.rank[open]>summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.rank .body{padding:6px 18px 16px}
.md table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}
.md td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}
.flash{animation:fl 1.6s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px}
.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}

<script>
const D = {"page_title": "Priority Lane Dialogue", "title": "Priority Lane dialogue options", "about": "This page lays out ten writers' versions of the Priority Lane dialogue, ranked, with three combined drafts for the director to pick from. Nothing has been changed yet: no scene file, script or voice has been touched.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-01-bone-dry.md", "intro": "I cut to the fewest words that still carry every beat: one reporter line, the protected minister line, one caption, and nothing else. Beat 1 gets no words at all (the ambulance and the raised glove do it); the reporter says only what a regional bulletin would say, with the awful thing buried in a bureaucratic verb; the minister is untouched; the button is a caption in news-ticker voice that treats the trivial matter as the emergency, so the gap lands without a word of explanation. Every line is short enough to mouth in one breath, and the silences are doing as much work as the speech.", "intro_html": "<p>I cut to the fewest words that still carry every beat: one reporter line, the protected minister line, one caption, and nothing else. Beat 1 gets no words at all (the ambulance and the raised glove do it); the reporter says only what a regional bulletin would say, with the awful thing buried in a bureaucratic verb; the minister is untouched; the button is a caption in news-ticker voice that treats the trivial matter as the emergency, so the gap lands without a word of explanation. Every line is short enough to mouth in one breath, and the silences are doing as much work as the speech.<\/p>"}, {"id": "02", "name": "Picture carries it", "title": "The picture carries it", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-02-picture-carries.md", "intro": "Treated the four beats as a silent film and speak only where a gap needs filling. The reporter delivers standard regional-news filler, not a joke; the humour is what is behind him. The only joke written as speech is the protected minister line. The button is the same shot as beat 1 (the ambulance still waiting under blue lights) with a news ticker over it.", "intro_html": "<p>Treated the four beats as a silent film and speak only where a gap needs filling. The reporter delivers standard regional-news filler, not a joke; the humour is what is behind him. The only joke written as speech is the protected minister line. The button is the same shot as beat 1 (the ambulance still waiting under blue lights) with a news ticker over it.<\/p>"}, {"id": "03", "name": "Plain logic", "title": "The logic said plainly, like a traffic report", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-03-plain-logic.md", "intro": "Approach: the reporter does not comment, joke or judge. She reads the situation out as a regional TV traffic bulletin: two vehicles, two statuses, one flat reason, in the cadence of \"the M6 is closed northbound\". The absurdity is carried by the arithmetic of the sentences, never by an adjective. The minister's protected line sits in the middle as the only emotion in the piece, and the button is a delay report that measures the wrong thing with total authority. The point (whose time counts) is never said.", "intro_html": "<p>Approach: the reporter does not comment, joke or judge. She reads the situation out as a regional TV traffic bulletin: two vehicles, two statuses, one flat reason, in the cadence of \"the M6 is closed northbound\". The absurdity is carried by the arithmetic of the sentences, never by an adjective. The minister's protected line sits in the middle as the only emotion in the piece, and the button is a delay report that measures the wrong thing with total authority. The point (whose time counts) is never said.<\/p>"}, {"id": "04", "name": "From the future", "title": "Reporting from the future", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-04-from-the-future.md", "intro": "The BadCode reporter is a correspondent who has already seen how this ends, and treats a red light on a wet road as a historical landmark, in the flat, grave cadence of UK regional news. All the dread is in the reporter's certainty; the picture does the rest. The ambulance is never mentioned as the victim and nobody states a moral. The reporter's authority is the joke, and the minister's trivial fury is what the future turns out to be about.", "intro_html": "<p>The BadCode reporter is a correspondent who has already seen how this ends, and treats a red light on a wet road as a historical landmark, in the flat, grave cadence of UK regional news. All the dread is in the reporter's certainty; the picture does the rest. The ambulance is never mentioned as the victim and nobody states a moral. The reporter's authority is the joke, and the minister's trivial fury is what the future turns out to be about.<\/p>"}, {"id": "05", "name": "Other side wins", "title": "The other side wins", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-05-other-side-wins.md", "intro": "Every line is the winning side setting the terms and the reporter agreeing to them with total professional calm. The outrider names the rule in five words, the reporter (a straight regional newsreader) ratifies it as reasonable, the minister supplies the trivial fury, and the button is the reporter apologising to the wrong party. The reporter never objects, never wonders, never says whose time counts; the concession does all the work. Pushed to the extreme: the reporter is more deferential than the outrider.", "intro_html": "<p>Every line is the winning side setting the terms and the reporter agreeing to them with total professional calm. The outrider names the rule in five words, the reporter (a straight regional newsreader) ratifies it as reasonable, the minister supplies the trivial fury, and the button is the reporter apologising to the wrong party. The reporter never objects, never wonders, never says whose time counts; the concession does all the work. Pushed to the extreme: the reporter is more deferential than the outrider.<\/p>"}, {"id": "06", "name": "Reversal", "title": "Reversal, the viewer gets there first", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-06-reversal.md", "intro": "The reporter starts to explain and is never allowed to finish. Every line is built so the audience completes the sentence in their head a beat before the speaker could, and the speaker is then cut off, overtaken or flatly carries on. The point (whose time counts) is never said by anyone: the reporter sets out the facts like regional news, the sentence that would state the moral is interrupted by the motorcade, and the button treats the viewer's conclusion as already reached. Pushed to the extreme: the reporter says as little as possible and the film does the talking.", "intro_html": "<p>The reporter starts to explain and is never allowed to finish. Every line is built so the audience completes the sentence in their head a beat before the speaker could, and the speaker is then cut off, overtaken or flatly carries on. The point (whose time counts) is never said by anyone: the reporter sets out the facts like regional news, the sentence that would state the moral is interrupted by the motorcade, and the button treats the viewer's conclusion as already reached. Pushed to the extreme: the reporter says as little as possible and the film does the talking.<\/p>"}, {"id": "07", "name": "The chorus", "title": "The chorus, side characters voice it", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-07-chorus.md", "intro": "I took the reporter's mouth away. The reporter is a straight-faced professional who barely speaks; the paramedic, the outrider and a bystander say everything that needs saying, in the flat, practical register of people doing their job. Nobody states whose time counts. The paramedic's dry numbers do it by implication, and the button lands on the paramedic, not on a caption or the reporter. Extreme version: the reporter gets two words and a look.", "intro_html": "<p>I took the reporter's mouth away. The reporter is a straight-faced professional who barely speaks; the paramedic, the outrider and a bystander say everything that needs saying, in the flat, practical register of people doing their job. Nobody states whose time counts. The paramedic's dry numbers do it by implication, and the button lands on the paramedic, not on a caption or the reporter. Extreme version: the reporter gets two words and a look.<\/p>"}, {"id": "08", "name": "Place is argument", "title": "The place is the argument", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-08-place-is-argument.md", "intro": "I picked one physical detail of the junction and let it do the arguing, so the reporter never explains anything: she just reads the street out like regional news. Version A uses the blue-and-white sign on the pole (\"Give way to emergency vehicles\"), B uses the red light's own countdown, C uses the queue and the blue light on the wet road. The reporter describes the place with total deadpan, the minister supplies the trivial fury, and the caption is the street furniture itself replying.", "intro_html": "<p>I picked one physical detail of the junction and let it do the arguing, so the reporter never explains anything: she just reads the street out like regional news. Version A uses the blue-and-white sign on the pole (\"Give way to emergency vehicles\"), B uses the red light's own countdown, C uses the queue and the blue light on the wet road. The reporter describes the place with total deadpan, the minister supplies the trivial fury, and the caption is the street furniture itself replying.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft from UK TV satire", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-09-borrowed-craft.md", "intro": "I took the compression tricks of British broadcast satire and applied them as mechanics, not as imitation. The Day Today and Brass Eye: total gravitas applied to something trivial, and the on-screen graphic or ticker as a second voice that carries the joke the presenter will not. Look Around You: flat, instructional, passive-voice euphemism where the reporter describes the outrage as a logistics matter. Wipe: one sarcastic caption doing the work of a paragraph. Pushed to the extreme: the reporter never acknowledges the ambulance as a problem and treats the minister's jam as the only news story; the gap between the two vehicles is carried entirely by who gets the gravitas.", "intro_html": "<p>I took the compression tricks of British broadcast satire and applied them as mechanics, not as imitation. The Day Today and Brass Eye: total gravitas applied to something trivial, and the on-screen graphic or ticker as a second voice that carries the joke the presenter will not. Look Around You: flat, instructional, passive-voice euphemism where the reporter describes the outrage as a logistics matter. Wipe: one sarcastic caption doing the work of a paragraph. Pushed to the extreme: the reporter never acknowledges the ambulance as a problem and treats the minister's jam as the only news story; the gap between the two vehicles is carried entirely by who gets the gravitas.<\/p>"}, {"id": "10", "name": "Ending first", "title": "Ending first, the button that feels inevitable", "file": "design/2026-11-10-shorts-dialogue-priority-lane/shape-10-ending-first.md", "intro": "I wrote the last five seconds before anything else, asking for a button that lands the gap between the two vehicles without a word of explanation, then worked backwards so every earlier line is a setup for it and nothing else. Each version below has its own ending, pushed to an extreme (a caption over a still-stuck ambulance; a reporter who knows how this ends; silence). The punchline of each is marked **[PUNCHLINE]**.", "intro_html": "<p>I wrote the last five seconds before anything else, asking for a button that lands the gap between the two vehicles without a word of explanation, then worked backwards so every earlier line is a setup for it and nothing else. Each version below has its own ending, pushed to an extreme (a caption over a still-stuck ambulance; a reporter who knows how this ends; silence). The punchline of each is marked <b>[PUNCHLINE]<\/b>.<\/p>"}], "dialogues": [{"id": "1", "label": "Priority Lane", "where": "BadCode Short #1, all four beats", "scene": "docs/stories/shorts/priority-lane", "target": "about 20 s total, spoken words 12-14 s max", "now_from": "docs/marketing/badcode-shorts.md (20-second cut) and Kai in the meeting", "now": [{"who": "REPORTER", "line": "[Jack's line, not yet written]"}, {"who": "MINISTER", "line": "[on the phone] I said raspberry."}, {"who": "CAPTION", "line": "[the meme lands; not yet written]"}], "drafts": [{"id": "1D", "name": "1A with Jack's lines (round 2)", "length": "about 20 s (8 s speech)", "total": "~8 s speech, ~20 s with picture", "bet": "Jack's round 1 notes on 1A: the minister's line gets bigger and posher, and the button is the reporter's deadpan 'poetic, really'.", "lines": [{"who": "REPORTER", "line": "[straight to camera, rain on the mic, ambulance behind] Traffic is being managed, to keep an important journey moving.", "tags": ["09", "01", "03"], "s": "4.0"}, {"who": "MINISTER", "line": "[on the phone, back seat, furious] I said raspberry-shaped hors d'oeuvres!", "tags": ["Jack"], "s": "2.0"}, {"who": "REPORTER", "line": "[back to camera, flat, as the motorcade clears] A politician blocking the path of an ambulance. Poetic, really...  (PUNCHLINE)", "tags": ["Jack"], "s": "3.0"}], "notes": ["Jack's two notes on 1A, round 1, put in as written.", "I gave the 'poetic, really' line to the reporter as his closing line, in place of the LEMON CURD ticker and 'More as we get it'. If you meant it as the on-screen ticker, say so.", "'I said raspberry.' (Kai's line) is now Jack's longer version."]}, {"id": "1A", "name": "The wrong emergency", "length": "about 20 s (7 s speech)", "total": "~7 s speech, ~20 s with picture", "bet": "Bureaucratic calm plus a ticker that treats the lemon curd as the live story is enough: the viewer does the sum, so almost nothing is said.", "lines": [{"who": "REPORTER", "line": "[straight to camera, rain on the mic, ambulance behind] Traffic is being managed, to keep an important journey moving.", "tags": ["09", "01", "03"], "s": "4.0"}, {"who": "MINISTER", "line": "[on the phone, back seat, furious] I said raspberry.", "tags": ["Kai", "all"], "s": "1.5"}, {"who": "CAPTION", "line": "[news ticker over the still-waiting ambulance, hold 2.5 s] LEMON CURD INCIDENT: DEVELOPING  (PUNCHLINE)", "tags": ["01", "05", "09"], "s": "0"}, {"who": "REPORTER", "line": "[back to camera, not turning round] More as we get it.", "tags": ["01", "02", "10"], "s": "1.5"}], "notes": ["Lemon curd is never spoken: it is read, so the caption must hold 2.5 s minimum and be legible on a phone.", "'Important journey' must be read bland, not approving. If it sounds like endorsement, swap to 'Traffic is being managed.' (01).", "Trimmed 09's 'jam' double meaning and 'We will bring you more on the jam'.", "Protected line kept verbatim, no added words.", "Risk: very bare. If the short feels generic, add 04's future flavour back first."]}, {"id": "1B", "name": "The delay ledger", "length": "about 19 s (10 s speech)", "total": "~10.5 s speech, ~20 s with picture", "bet": "Traffic-report grammar does the sneering: two vehicles, two statuses, and a button that puts the wrong thing on the same ledger.", "lines": [{"who": "CAPTION", "line": "[lower third over beat 1] LIVE: A-ROAD, 11.47PM", "tags": ["03"], "s": "0"}, {"who": "REPORTER", "line": "[to camera, flat regional, beat 2] Traffic update. The ambulance is held at a red light. A car is coming through.", "tags": ["03", "10"], "s": "4.5"}, {"who": "MINISTER", "line": "[on the phone, motorcade passing] I said raspberry.", "tags": ["Kai", "all"], "s": "1.5"}, {"who": "REPORTER", "line": "[beat 4, same tone, not turning] Ambulance delay: four minutes. Raspberry delay: ongoing. Back to the studio.  (PUNCHLINE: 'Raspberry delay: ongoing.')", "tags": ["03", "02", "06"], "s": "4.5"}], "notes": ["Cut 03's 'Police confirm the minister is running late' and 'The minister is not': 'is not' edges toward stating the point. Swap it back in only if Jack wants more bite.", "'Four minutes' is an invented figure; keep it vague (or 'some minutes') if the short could be read as a real incident.", "Relies on the audience hearing the minister line over the motorcade: lift it in the mix.", "Alternate buttons: caption only, 'ESTIMATED DELAY: AMBULANCE 4 MIN / JAM: UNKNOWN'.", "Protected line kept verbatim."]}, {"id": "1C", "name": "Where was I?", "length": "about 20 s (9 s speech)", "total": "~9 s speech, ~20 s with picture", "bet": "Let the audience finish the reporter's sentence before the motorcade does, then let a deadpan reporter lose his place: the point is completed by the viewer, never spoken.", "lines": [{"who": "REPORTER", "line": "[straight to camera, ambulance and outrider behind, blue light on the balaclava] Behind me, an ambulance, held at a red light. The road ahead is empty. They're waiting for--", "tags": ["06", "04"], "s": "5.0"}, {"who": "MINISTER", "line": "[motorcade siren swallows the reporter; back seat, on the phone] I said raspberry.", "tags": ["Kai", "all"], "s": "1.5"}, {"who": "REPORTER", "line": "[back on camera, tail lights passing, not a flicker] Sorry. Where was I?  (PUNCHLINE)", "tags": ["06"], "s": "1.5"}, {"who": "CAPTION", "line": "[lower third, regional TV font, over the ambulance still waiting] LIVE: LEMON CURD SITUATION DEVELOPING", "tags": ["06", "01", "10"], "s": "0"}], "notes": ["The empty road must be visible in beat 1 or 'waiting for' has no target.", "Needs sound design: siren over his voice, or the cut-off looks like a mistake.", "Played with any wink it dies. Weak-joke risk is real; fallback button is 'Back to the studio.' (06 alt A).", "Optional future flavour (04): a 0 s lower third 'BADCODE NEWS. LIVE FROM 2041.' in beat 2.", "Left out 06's paramedic alt: it risks sympathy overshadowing the satire.", "Protected line kept verbatim."]}], "ranking": [{"rank": 1, "shape": "09", "length": "~10 s", "verdict": "Best mechanic: gravitas on the wrong object plus a ticker as second voice means the gap lands unspoken. Fails: 'important journey' risks sounding like endorsement; 'jam' pun is too cute; 'Lemon curd.' added before the protected line is unneeded because the caption can set it up."}, {"rank": 2, "shape": "03", "length": "~13 s", "verdict": "Strongest button ('Raspberry delay: ongoing') and flat voice. Fails: the 7 s opening reporter line is too long and 'The minister is not' sits one step from stating the point; invented delay figure."}, {"rank": 3, "shape": "06", "length": "~10 s", "verdict": "The viewer finishes the sentence, so the point is truly unsaid; 'Where was I?' is a clean deadpan button. Fails: depends on sound design and on a weak-ish joke not being winked at; 'waiting for--' needs a clearly empty road."}, {"rank": 4, "shape": "01", "length": "~5 s", "verdict": "Tightest and most disciplined; 'More as we get it' is a perfect sign-off. Fails: too bare, 5 s of speech leaves dead air and gives the BadCode reporter no character; the caption does all the lifting."}, {"rank": 5, "shape": "10", "length": "~8 s", "verdict": "Version A's good-news caption over a stuck ambulance is a clean sight gag. Fails: 'RASPBERRY HAS BEEN FOUND' is cute not sharp; B's 'In my timeline' line is a near-moral; C asks a paramedic for a possibly flippant line and adds a third voice."}, {"rank": 6, "shape": "02", "length": "~5 s", "verdict": "Fine plain version of 01 with the same button. Fails: 'We're at a red light' says too little for a reporter, 'Back to the studio' is filler, and it is largely duplicated by 01."}, {"rank": 7, "shape": "05", "length": "~11.5 s", "verdict": "The reporter apologising to the minister is a good deadpan idea and the only one with real concession. Fails: the outrider says 'Someone important's coming', which states the point; adds 'No.' to the protected line; four turns in 11 s; reads as endorsement."}, {"rank": 8, "shape": "04", "length": "~12.5 s", "verdict": "The only shape with the from-the-future authority the brand promises. Fails: 'Not for the ambulance' names the moral, 'He will chair the inquiry' is a stated prediction, 14 words in 4.5 s will not lip-sync."}, {"rank": 9, "shape": "08", "length": "~9-11 s", "verdict": "Good ideas (a sign, a light) that need small night-shot detail to read. Fails: B's last line says the point outright; C's 'Britain, ladies and gentlemen' sneers at the viewer; the sign is unreadable at night on a phone."}, {"rank": 10, "shape": "07", "length": "~10 s", "verdict": "Only shape where someone resists (paramedic, bystander). Fails: 'That was the four' is a death joke too hard for the brand's nurturing floor, four lip-syncs in 20 s, and the reporter is wasted; 'Every Tuesday' states the point."}], "protected": {"columns": ["I said raspberry."], "rows": {"1A": ["verbatim"], "1B": ["verbatim"], "1C": ["verbatim"]}}, "shapes": {"01": "## Dialogue 1: Priority Lane: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| (beat 1, 0-5 s) | [no speech: rain, siren held low, the outrider's glove] | 0 |\n| REPORTER | [straight to camera, rain on the mic] Traffic is being managed. | 2 |\n| MINISTER | [on the phone, back seat, furious] I said raspberry. **<- PUNCHLINE (protected)** | 1.5 |\n| CAPTION | [white block capitals, news ticker, 0 s] BREAKING: LEMON CURD INCIDENT. SERIOUS. | 0 |\n| REPORTER | [back to camera, not turning round, ambulance still behind him] More as we get it. | 1.5 |\n| **Total** | 14 words spoken, 3 lines | **~5 s speech, ~20 s picture** |\n\nAlternative reporter openers, same slot, pick one: \"Roads in the area are being cleared.\" (2.5 s) / \"Delays are expected.\" (1.5 s, driest) / \"Everything is under control.\" (2 s, a future-knower's lie).\n\n**Why it works.** Total spoken time is about 5 s in a 20 s short, so the picture carries the rest: the held ambulance, the balaclava reporter's blank authority, the motorcade. \"Traffic is being managed\" is true and monstrous at once, so nobody needs the moral; the viewer does the sum. \"I said raspberry\" is the punchline, because it arrives after the ambulance has been made to wait, and the caption twists the knife by using emergency language on the jam. \"More as we get it\" is a pure UK regional sign-off, and delivered while the ambulance is still stuck behind him it is the second laugh. Nobody names a party, a politician or the point, and nobody sneers at the viewer.\n\n**Cuts from current.** Any reporter exposition (who, where, why the road is shut); any paramedic or outrider line; any explicit contrast between the vehicles; any line from the minister beyond the protected one (no \"lemon curd\" spoken: it appears only in the caption, so the joke is read, not heard); any reporter commentary on the minister.\n\n**Risk.** It may be too bare: a viewer who does not clock that the motorcade is a politician's will lose the button, and 5 s of speech leaves long silent stretches that need strong picture, sound and ticker design to hold attention. \"Lemon curd\" never being spoken means the caption has to be on screen long enough to read (hold 2.5 s minimum). \"Serious\" in the caption comes close to editorialising; if Jack finds it too pointed, drop it to \"BREAKING: LEMON CURD INCIDENT.\" Reporter is not given a knowing-from-the-future flavour in this shape on purpose; that is the first thing to add back if the short feels like a generic satire.\n\n**Protected lines.** \"I said raspberry.\" survives verbatim, said on the phone by the minister in the back seat, and is the punchline of this version.", "02": "## Dialogue 1: Priority Lane: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER (beat 2, flat, to camera, ambulance pulsing blue behind him) | Evening. We're at a red light. | 2.2 |\n| MINISTER (beat 3, on the phone in the back seat) | [on the phone] I said raspberry. | 1.5 |\n| CAPTION (beat 4, ticker over the still-waiting ambulance) | BREAKING: LEMON CURD INCIDENT | 0 |\n| REPORTER (beat 4, back to camera, does not look round) | Back to the studio. | 1.3 |\n| **Total spoken** | | **5.0** |\n\nSwap options: opener \"Nothing to report. Yet.\" / sign-off \"Traffic is moving. Some of it.\" (riskier, points at the gap) / ticker \"DEVELOPING: RASPBERRY\".\n\nCuts: any line that describes the incident, names who is in the motorcade, or says what the delay means; all paramedic and outrider lines.\n\nRisk: may feel thin; relies on beat 1 reading clearly in 5 s (glove, ambulance, blue lights through rain). \"Back to the studio\" is filler unless the pause is held.\n\nProtected: \"I said raspberry.\" verbatim.\n\n(Recreated by the synthesis writer from the writer's returned text; the writer could not save the file.)", "03": "## Dialogue 1: Priority Lane: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| CAPTION | [lower-third, 0 s, over beat 1] LIVE: A-ROAD, 11.47PM | 0 |\n| REPORTER | [to camera, rain on the mic, beat 2] Traffic update. The ambulance is held at a red light. The minister is not. Police confirm the minister is running late. | 7.0 |\n| MINISTER | [on the phone, beat 3, motorcade passing behind glass] I said raspberry. | 1.5 |\n| REPORTER | [beat 4, straight back to camera, same tone] Ambulance delay: four minutes. Raspberry delay: ongoing. **[PUNCHLINE: \"Raspberry delay: ongoing.\"]** Back to the studio. | 4.5 |\n| **Total** | 36 words | **13.0** |\n\n**Why it works.** Traffic-report grammar does the sneering for her: \"held\" against \"is not\", then a reason that is a complete non-reason delivered as procedure (\"running late\"). The ambulance gets a status and the minister gets a status and the viewer does the sum. The raspberry line then arrives as a perfect, unexplained piece of evidence, and the button reuses the report format to put a four-minute medical delay and an \"ongoing\" jam shortage on the same ledger, so the gap between the vehicles lands without one word about priorities. \"Back to the studio\" keeps her utterly straight and gives the picture a beat to hold on the ambulance's blue lights. Alternative punchlines to swap in if Jack wants a different button: \"Motorists are advised to be patient. The minister is not.\" / \"The ambulance has been told to expect a priority lane. It is not the priority.\" / \"Normal service will resume. The minister's lemon curd has been escalated.\" / caption only, 15 s: ESTIMATED DELAY: AMBULANCE 4 MIN / JAM: UNKNOWN.\n\n**Cuts from current.** Nothing in the current script is lost: \"I said raspberry.\" stays verbatim. The empty reporter slot is filled with a bulletin rather than a rant; no outrider or paramedic line (the picture carries them), and the caption is a place-and-time strap only, so the meme space is left for Jack.\n\n**Risk.** Too dry: with no joke in the beat-2 line it depends on delivery, so the TTS voice must be flat regional-news, not comedic. \"Police confirm the minister is running late\" edges toward stating the moral by implication; if Jack finds it too pointed, cut to \"The minister is not.\" and let the raspberry do the work. The button's \"Raspberry delay\" assumes the audience heard the minister's line clearly over the motorcade. Four minutes of ambulance delay is an invented figure and should stay vague if the short is posted as a real incident (it is a fictional one: no real politician or party is named).\n\n**Protected lines.** \"I said raspberry.\" survives verbatim, delivered on the phone with no pause or trim.", "04": "## Dialogue 1: Priority Lane: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| CAPTION | [lower third, beat 2, regional-news style] BADCODE NEWS. LIVE FROM 2041. | 0 |\n| REPORTER | [grave, straight to camera, ambulance blue light flickering behind] This junction will be in the history books. Not for the ambulance. For what comes through next. | 6.0 |\n| MINISTER | [on the phone, seething, back seat] I said raspberry. | 2.0 |\n| REPORTER | [back to camera, not a flicker] He will chair the inquiry into this. It will be about the lemon curd. **(PUNCHLINE: \"It will be about the lemon curd.\")** | 4.5 |\n| **Total** | about 29 words | **12.5** |\n\n- **Why it works.** The future-correspondent device lets the reporter be certain without lecturing: knowing how it ends is the authority, so no moral is needed. \"Not for the ambulance\" tells the viewer where the weight is without saying whose time counts. The minister's raspberry line is pure bathos against that gravity, and the button pays it off by making the trivial grievance the thing history remembers, with the gap between the two vehicles left for the viewer to do the sums. Alternate buttons, same slot: \"[beat] He was right about the lemon curd, as it happens.\" / \"Lemon curd. Remember the lemon curd. Everything else is a footnote.\" / CAPTION only, after a held silent shot of the ambulance: \"AMBULANCE: DELAYED. LEMON CURD: PENDING.\"\n- **Cuts from current.** No paramedic or outrider line (beat 1 stays picture only, siren and rain). The reporter's opening is a single sentence plus one fragment. All explanation of the minister's job, party or the ambulance's cargo is gone. The caption exists only as the 0 s lower third.\n- **Risk.** \"Not for the ambulance\" is the closest line to naming the point; if Jack finds it too pointed, swap to \"Not for who was waiting. For who wasn't.\" or cut to just \"This junction will be in the history books.\" The minister's \"inquiry\" tag implies a future that is fictional, so it must read as the reporter's knowledge, not a claim of fact. Possible overlap with another shape's button. Lip-sync on the long second reporter line needs a late-not-early placement; 4.5 s is tight for 14 words.\n- **Protected lines.** \"I said raspberry.\" survives verbatim, unchanged, as the minister's only line (the \"[on the phone]\" direction is kept as a bracket).", "05": "## Dialogue 1: Priority Lane: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| OUTRIDER | [hand up, not looking at the ambulance] Hold there. Someone important's coming. | 2.5 |\n| REPORTER | [straight to camera, rain, ambulance behind] Police have asked the ambulance to wait. We think that's reasonable. | 4.0 |\n| MINISTER | [on the phone, back seat] No. I said raspberry. | 2.0 |\n| REPORTER | [same shot, same face] **We would like to apologise to the minister for the delay.** | 3.0 |\n| CAPTION | [meme text over the ambulance's blue lights] LEMON CURD INCIDENT: DEVELOPING | 0 |\n| **Total** | about 27 words | **11.5** |\n\n(Rest of the 20 s is picture: the hand, the wet road, the motorcade, the held beat on the reporter's face. Punchline is the bolded reporter line; the minister's \"I said raspberry\" is the setup it pays off, and the caption is the optional second sting.)\n\nAlternate punchlines, swap in for the bold line:\n- REPORTER: \"In fairness, he did say raspberry.\" (reporter sides with the minister's grievance)\n- REPORTER: \"The ambulance has been very understanding.\" (sarcasm-free, so the absurdity is entirely in the delivery)\n- OUTRIDER, as a final cut-in: \"Nobody told him they had lemon curd, did they, love?\" (outrider concedes nothing, reporter nods)\n\n**Why it works.** The gap between the two vehicles is never described: it lives in the distance between \"reasonable\" and \"raspberry\". Because the reporter agrees with everyone in authority, the viewer is left to do the disagreeing, which is the only way the point (whose time counts) gets made without being said. The regional-news register is the joke carrier: a deadpan \"we think that's reasonable\" is funnier and more dangerous than outrage, and it never sneers at the viewer or names a party. The apology flips the expected button (reporter finally criticises) into the maximum concession.\n\n**Cuts from current.** The reporter has no knowing-future-narrator line, no stated stakes and no moral; every explanation is gone. The caption is no longer the carrier of the meme, only a garnish. The paramedic never speaks.\n\n**Risk.** Too much deference can read as the BadCode reporter genuinely endorsing the motorcade, so the delivery must carry a hair of authority-from-the-future (a held beat before \"reasonable\") or the satire dies. The outrider line is a little on the nose (\"someone important\"); if Jack finds it explains too much, cut it and let the raised hand do it, which shifts the opening to picture only. Four speaker turns in 11 s is tight for lip-sync, though each line is short.\n\n**Protected lines.** \"I said raspberry.\" survives verbatim, with only \"No.\" added in front as a cue for the phone call; drop the \"No.\" if Jack wants it pure.", "06": "## Dialogue 1: Priority Lane: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER | [straight to camera, ambulance and outrider behind, blue light on his balaclava] Behind me, an ambulance, held at a red light by police. The road ahead is completely empty. They are waiting for-- | 7.0 |\n| MINISTER | [motorcade siren swallows the reporter; back seat, on the phone] I said raspberry. | 1.5 |\n| REPORTER | [back on camera, motorcade tail lights passing behind him, not a flicker] **Sorry. Where was I?** *(PUNCHLINE)* | 1.5 |\n| CAPTION | [lower third, regional TV font, 0 s spoken] LIVE: Lemon curd situation developing | 0 |\n| **Total** | spoken ~10 s; ~20 s with picture-only holds (outrider hand, siren sweep, the ambulance still waiting at the end) | **~10** |\n\nAlternate buttons (swap in for the last REPORTER line and caption):\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER | [to camera, ambulance still stopped behind him] **Back to the studio.** *(PUNCHLINE, ALT A)* | 1.0 |\n| PARAMEDIC | [through the window, to nobody, tired] **Do we have to turn the siren off, or...?** *(PUNCHLINE, ALT B, he asks the outrider if he may stop being urgent)* | 2.5 |\n| CAPTION | [meme caption over the still-waiting ambulance] **LEMON CURD: 1  PATIENT: STILL PENDING** *(PUNCHLINE, ALT C, silent)* | 0 |\n\n**Why it works.** The first line hands the viewer every fact (ambulance, red light, empty road) and then stops mid-clause on \"waiting for\", so the audience supplies the ending themselves, which is far stronger than being told. The motorcade arrives like the answer, and the minister's trivial fury proves it without a word of moral. The reporter's \"Sorry. Where was I?\" lands the reversal: the one person who knows how this ends acts as if he lost his place, and the audience is already ahead of him. Deadpan authority becomes the joke, not the explanation.\n\n**Cuts from current.** Any reporter line that names the minister, the gap or the cost of the delay. Any caption that explains. \"Whose time counts\" is never stated. The caption becomes a regional-news red herring rather than the meme explanation.\n\n**Risk.** If the viewer does not complete \"waiting for--\" the short reads as a gag with no target; the empty road must be clearly visible in beat 1. The cut-off needs sound design (siren over his voice) or it looks like a mistake. \"Where was I?\" can read as a weak joke if the reporter performs it with any wink; it only works played flat. Alt B is the most human but risks sympathy for the paramedic overshadowing the satire.\n\n**Protected lines.** \"I said raspberry.\" survives verbatim, delivered as the answer to the interrupted sentence.", "07": "## Dialogue 1: Priority Lane: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| OUTRIDER | [gloved hand up, bored] Hold there, love. Won't be a minute. | 2.2 |\n| PARAMEDIC | [leaning out of the cab, calm] Mine's got about four. | 1.8 |\n| REPORTER | [straight to camera, regional TV voice] Normal service. | 1.0 |\n| BYSTANDER | [umbrella, not looking up] Every Tuesday. | 1.0 |\n| MINISTER | [on the phone, seething] Lemon curd. LEMON CURD. I said raspberry. | 3.0 |\n| PARAMEDIC | [watching the tail lights go] **That was the four.** | 1.3 |\n| CAPTION | RASPBERRY SITUATION: ONGOING | 0 |\n| **Total** | about 31 words | **about 10.3 s** |\n\n**Why it works.** The reporter is the BadCode authority, and the funniest thing an authority can do is stay professionally blank while ordinary people say the quiet part in practical terms. The paramedic's \"about four\" gives the audience a number with no adjective on it, so they do the maths themselves; \"That was the four\" pays it off as the punchline (marked in bold) without any moral. The minister's trivial fury is the contrast, and \"I said raspberry\" is untouched. The caption is a deadpan news-style label that treats the jam as the live story, which is the real crime of the piece, said by no one. The bystander's \"Every Tuesday\" is a throwaway that tells the reader this is routine, not an exception, with no one sneering at the viewer.\n\n**Cuts from current.** The reporter's monologue goes entirely (Jack's line was never written, so nothing is lost except the idea that the reporter carries the joke). The caption becomes a label, not a lecture. Nothing explains the gap between the two vehicles.\n\n**Risk.** The reporter is the brand, so leaving the reporter with \"Normal service.\" may feel like a waste of the character and thin on the BadCode \"knows how this ends\" authority. \"That was the four\" could read as a death joke too bluntly for some platforms, or be missed without the preceding \"about four\" landing cleanly in 1.8 s. Four voices means four lip-syncs in 20 s, more than the others. Beat 2 is only 2 s of speech in a 5 s slot, so the shot needs a held look to camera.\n\n**Protected lines.** \"I said raspberry.\" survives verbatim, as the last sentence of the minister's line. Only \"Lemon curd. LEMON CURD.\" is added in front of it, for context.", "08": "## Dialogue 1: Priority Lane: the whole short\n\n\n**Version A: the sign** (detail: a council sign on the pole above the ambulance)\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER | [to camera, rain, straight] Behind me, a junction. Above me, a sign. [beat] The sign says emergency vehicles have right of way. | 5.0 |\n| MINISTER | [on the phone, seething] I said raspberry. | 1.8 |\n| REPORTER | [back to camera, not turning] **The sign has been reminded of its position.** | 2.5 |\n| CAPTION | [sign, lit by blue, small council font] \"GIVE WAY TO EMERGENCY VEHICLES (except)\" | 0 |\n| **Total** | about 24 words | **9.3 s** |\n\n**Version B: the red light** (detail: the pedestrian-crossing style countdown, stuck, the ambulance waiting on it)\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER | [to camera] This light has been red for ninety seconds. It is not broken. It has been asked to stay red. | 5.0 |\n| PARAMEDIC | [through the windscreen, flat] Is that him? | 1.2 |\n| MINISTER | [phone, motorcade] I said raspberry. | 1.8 |\n| REPORTER | [light turns green behind her] **And it's green. Lovely. It was only ever a question of who was coming.** | 3.5 |\n| CAPTION | none | 0 |\n| **Total** | about 36 words | **11.5 s** |\n\n**Version C: the queue** (detail: one ambulance, blue lights on, at the front of a line of ordinary cars, all of them waiting politely)\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER | [to camera] Tonight's queue is eleven cars long, and one ambulance. Nobody is hooting. Britain, ladies and gentlemen. | 5.0 |\n| MINISTER | [phone] I said raspberry. | 1.5 |\n| REPORTER | [flat, as the motorcade passes behind her] **Eleven cars, one ambulance, and a lemon curd emergency.** | 3.0 |\n| CAPTION | \"LEMON CURD INCIDENT: 1 / PATIENT: PENDING\" | 0 |\n| **Total** | about 31 words | **9.5 s** |\n\n**Why it works.** The joke is already in the junction; we only have to point the camera at it. A sign that says one thing while the street does another (A), a light that obeys the wrong person (B) and a polite British queue (C) each carry the whole argument without anyone saying whose time counts. The reporter treats the street as the news item and the minister's lemon curd as the only real emergency, so the gap between the two vehicles is felt, not stated. Lines are short and mouth-able, and the spoken total sits well inside 12-14 s, leaving room for the 5 s picture beats. Punchlines are in bold: A \"reminded of its position\", B \"only ever a question of who was coming\" (the closest to saying the point, cut it if Jack finds it too near), C \"a lemon curd emergency\".\n\n**Cuts from current.** Any reporter line that characterises the minister or the police. No narration of the ambulance's cargo; the paramedic is used once at most. The caption in A and C is the street's own signage, not a meme text card, so it needs no punchline of its own.\n\n**Risk.** B's last line leans on the moral and could tip into saying the point aloud; A depends on viewers reading a small sign in a night shot, so the reporter has to say \"sign\" first or it is lost. C's \"Britain, ladies and gentlemen\" is a mild sneer at the viewer and may need cutting. The captions need the image to be sharp enough to read. In all three the reporter has to stay straight; if she winks, it collapses.\n\n**Protected lines.** \"I said raspberry.\" survives verbatim in all three versions, always as the minister's only line, after the reporter's setup and before her button.", "09": "## Dialogue 1: Priority Lane: the whole short\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER | [straight to camera, ambulance idling red-lit behind, outrider's hand up] \"Traffic on the A40 is being managed this evening, to keep an important journey moving.\" | 5.0 |\n| MINISTER | [on the phone, back seat, motorcade sweeping through] \"Lemon curd. I said raspberry.\" **(PUNCHLINE 1, protected line)** | 2.5 |\n| CAPTION | [lower-third, news-ticker style, over the ambulance finally pulling away in the rain] \"RASPBERRY SHORTAGE: LATEST\" **(PUNCHLINE 2, the meme)** | 0 |\n| REPORTER | [back to camera, unmoved] \"We will bring you more on the jam as it develops.\" **(PUNCHLINE 3, the button)** | 3.0 |\n| **Total** | 24 words spoken | **10.5** |\n\nAlternate buttons to swap in (same slot):\n- REPORTER [deadpan]: \"Our thoughts are with the toast.\" (Punchline: the toast; 2 s.)\n- CAPTION only, reporter silent, held on her face: \"MINISTER 'DEEPLY CONCERNED'\" over the ambulance's tail lights. (0 s spoken; the Day Today move of letting the graphic do the lying.)\n- REPORTER: \"Anyone with information on the lemon curd should contact the police.\" (Punchline: police as the jam's guardians; 3.5 s.)\n\n**Why it works.** The Day Today and Brass Eye ran on authority applied to the wrong object: the presenter sounds exactly as serious about nonsense as about a death, and the audience supplies the outrage. Here the reporter's opening line is Look Around You in miniature, a calm passive-voice description (\"is being managed\", \"an important journey\") that is technically true and never names who or what is held. The minister then spends the film's only emotion on a condiment. The caption is the second voice: it adopts the grammar of breaking news (\"LATEST\") for the jam, and the reporter's final promise of \"more on the jam as it develops\" lets the audience complete the comparison with the ambulance themselves. Nobody says whose time counts; the reporter simply gives all her gravitas to the wrong thing, in the voice of UK regional news.\n\n**Cuts from current.** Any explanation of the ambulance (patient, urgency, paramedic line) goes: the picture carries it. No narrator knowing-how-it-ends line; the reporter stays inside the news voice for this one. The outrider and paramedic get no speech.\n\n**Risk.** \"Important journey\" could read as the reporter endorsing the motorcade, so the delivery must be bland, not approving; a wink kills it. The caption has to be readable in under two seconds on a phone. \"Jam\" is a double meaning (traffic and lemon curd's neighbour) that may be too cute, with raspberry jam implied rather than stated; if it confuses, swap to \"We will bring you more as it develops.\" Total is about 10.5 s of speech, so there is spare room for a beat of silence on the ambulance, which is probably where the real laugh is.\n\n**Protected lines.** \"I said raspberry.\" survives verbatim, the last three words of the minister's line; \"Lemon curd.\" is added in front as the set-up, since the line alone has nothing to answer.", "10": "## Dialogue 1: Priority Lane: the whole short\n\n\n**Version A: the good-news caption (ending: the ambulance is still stuck)**\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER | [flat, regional, rain on the mic] Police have stopped this ambulance at a red light. A car is coming through. | 4.0 |\n| MINISTER | [on the phone, motorcade, seething] I said raspberry. | 1.5 |\n| REPORTER | [to camera, same flat voice, ambulance still held behind him] We'll bring you more as we get it. | 2.5 |\n| CAPTION | [white meme text, freeze on the ambulance, blue lights still turning] **[PUNCHLINE]** BREAKING: THE RASPBERRY HAS BEEN FOUND | 0 |\n| Total |  | 8.0 spoken, ~20 with picture |\n\n- **Why it works.** The caption is good news delivered over bad news, and the viewer's eye does the sum: the freeze holds on the ambulance, still waiting, while the text celebrates a jam. Nobody says whose time counts; the picture is the only thing that disagrees with the caption. The reporter's lines are pure \"and now the local news\" dryness, so the gap between the tone and the scene is the joke.\n- **Cuts from current.** Nothing spoken is lost except the unwritten reporter placeholder; the reporter now speaks 18 words in total.\n- **Risk.** The caption is a sight gag, so if the ambulance is not visibly still held in frame 15-20 s it reads as a non-sequitur. \"Found\" may be too cute for a Jack who wants a sharper word (\"RESOLVED\", \"SORTED\").\n- **Protected lines.** \"I said raspberry.\" kept verbatim, on its own beat.\n\n**Version B: the reporter who knows how this ends (ending: back to camera, no caption)**\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER | [straight to camera, blue light on the balaclava] Behind me, an ambulance. Ahead of it, a red light. Coming through it, a man in a hurry. | 5.0 |\n| MINISTER | [on the phone, furious] I said raspberry. | 1.5 |\n| REPORTER | [same dead calm, ambulance finally pulling away behind] In my timeline, this is where the jam starts. **[PUNCHLINE]** Not on the road. | 4.0 |\n| Total |  | 10.5 spoken, ~20 with picture |\n\n- **Why it works.** The reporter is the future narrator in disguise: certainty without a moral. \"The jam starts\" and the cut to wet empty road tells you something is about to go wrong without telling you what. The twist (\"not on the road\") hints at the real jam without defining it.\n- **Cuts from current.** Drops the caption entirely; the reporter carries the button.\n- **Risk.** Close to a stated moral. If \"not on the road\" feels like it explains, cut to \"In my timeline, this is where the jam starts.\" and stop. Also over the 12-14 s limit if spoken slowly.\n- **Protected lines.** \"I said raspberry.\" verbatim.\n\n**Version C: the paramedic (ending: the smallest possible line, from the wrong person)**\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| REPORTER | [deadpan, regional] The road is closed to everyone but the most important person in the city. | 3.5 |\n| MINISTER | [on the phone] I said raspberry. | 1.5 |\n| PARAMEDIC | [leaning out of the window, to the outrider, mild, almost polite] **[PUNCHLINE]** Is it long? | 1.0 |\n| CAPTION | [lower third, regional-news style] LIVE: RASPBERRY | 0 |\n| Total |  | 6.0 spoken, ~20 with picture |\n\n- **Why it works.** The paramedic's tiny, polite question is the only human line in the film and it asks about the wrong thing, which lets the viewer fill in the stakes. The minister's trivial fury and the paramedic's patience are the two ends of the gap. \"Live: raspberry\" gives the regional-news register a last twist.\n- **Cuts from current.** The reporter's explanation is shortened to one sentence; the minister's line is untouched.\n- **Risk.** The paramedic asking \"Is it long?\" might be read as flippant about a patient; the delivery has to be weary and kind, never a joke at the paramedic's expense. Needs a third lip-synced voice.\n- **Protected lines.** \"I said raspberry.\" verbatim."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">(beat 1, 0-5 s)<\/td><td class=\"line\">[no speech: rain, siren held low, the outrider's glove]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[straight to camera, rain on the mic] Traffic is being managed.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, back seat, furious] I said raspberry. <b>&lt;- PUNCHLINE (protected)<\/b><\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">[white block capitals, news ticker, 0 s] BREAKING: LEMON CURD INCIDENT. SERIOUS.<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[back to camera, not turning round, ambulance still behind him] More as we get it.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">14 words spoken, 3 lines<\/td><td class=\"num\"><b>~5 s speech, ~20 s picture<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Alternative reporter openers, same slot, pick one: \"Roads in the area are being cleared.\" (2.5 s) / \"Delays are expected.\" (1.5 s, driest) / \"Everything is under control.\" (2 s, a future-knower's lie).<\/p>\n<p><b>Why it works.<\/b> Total spoken time is about 5 s in a 20 s short, so the picture carries the rest: the held ambulance, the balaclava reporter's blank authority, the motorcade. \"Traffic is being managed\" is true and monstrous at once, so nobody needs the moral; the viewer does the sum. \"I said raspberry\" is the punchline, because it arrives after the ambulance has been made to wait, and the caption twists the knife by using emergency language on the jam. \"More as we get it\" is a pure UK regional sign-off, and delivered while the ambulance is still stuck behind him it is the second laugh. Nobody names a party, a politician or the point, and nobody sneers at the viewer.<\/p>\n<p><b>Cuts from current.<\/b> Any reporter exposition (who, where, why the road is shut); any paramedic or outrider line; any explicit contrast between the vehicles; any line from the minister beyond the protected one (no \"lemon curd\" spoken: it appears only in the caption, so the joke is read, not heard); any reporter commentary on the minister.<\/p>\n<p><b>Risk.<\/b> It may be too bare: a viewer who does not clock that the motorcade is a politician's will lose the button, and 5 s of speech leaves long silent stretches that need strong picture, sound and ticker design to hold attention. \"Lemon curd\" never being spoken means the caption has to be on screen long enough to read (hold 2.5 s minimum). \"Serious\" in the caption comes close to editorialising; if Jack finds it too pointed, drop it to \"BREAKING: LEMON CURD INCIDENT.\" Reporter is not given a knowing-from-the-future flavour in this shape on purpose; that is the first thing to add back if the short feels like a generic satire.<\/p>\n<p><b>Protected lines.<\/b> \"I said raspberry.\" survives verbatim, said on the phone by the minister in the back seat, and is the punchline of this version.<\/p>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">REPORTER (beat 2, flat, to camera, ambulance pulsing blue behind him)<\/td><td class=\"line\">Evening. We're at a red light.<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">MINISTER (beat 3, on the phone in the back seat)<\/td><td class=\"line\">[on the phone] I said raspberry.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION (beat 4, ticker over the still-waiting ambulance)<\/td><td class=\"line\">BREAKING: LEMON CURD INCIDENT<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">REPORTER (beat 4, back to camera, does not look round)<\/td><td class=\"line\">Back to the studio.<\/td><td class=\"num\">1.3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total spoken<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>5.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Swap options: opener \"Nothing to report. Yet.\" / sign-off \"Traffic is moving. Some of it.\" (riskier, points at the gap) / ticker \"DEVELOPING: RASPBERRY\".<\/p>\n<p>Cuts: any line that describes the incident, names who is in the motorcade, or says what the delay means; all paramedic and outrider lines.<\/p>\n<p>Risk: may feel thin; relies on beat 1 reading clearly in 5 s (glove, ambulance, blue lights through rain). \"Back to the studio\" is filler unless the pause is held.<\/p>\n<p>Protected: \"I said raspberry.\" verbatim.<\/p>\n<p>(Recreated by the synthesis writer from the writer's returned text; the writer could not save the file.)<\/p>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">[lower-third, 0 s, over beat 1] LIVE: A-ROAD, 11.47PM<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[to camera, rain on the mic, beat 2] Traffic update. The ambulance is held at a red light. The minister is not. Police confirm the minister is running late.<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, beat 3, motorcade passing behind glass] I said raspberry.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\"><span class=\"stage\">[beat 4, straight back to camera, same tone]<\/span> Ambulance delay: four minutes. Raspberry delay: ongoing. <b>[PUNCHLINE: \"Raspberry delay: ongoing.\"]<\/b> Back to the studio.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">36 words<\/td><td class=\"num\"><b>13.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Traffic-report grammar does the sneering for her: \"held\" against \"is not\", then a reason that is a complete non-reason delivered as procedure (\"running late\"). The ambulance gets a status and the minister gets a status and the viewer does the sum. The raspberry line then arrives as a perfect, unexplained piece of evidence, and the button reuses the report format to put a four-minute medical delay and an \"ongoing\" jam shortage on the same ledger, so the gap between the vehicles lands without one word about priorities. \"Back to the studio\" keeps her utterly straight and gives the picture a beat to hold on the ambulance's blue lights. Alternative punchlines to swap in if Jack wants a different button: \"Motorists are advised to be patient. The minister is not.\" / \"The ambulance has been told to expect a priority lane. It is not the priority.\" / \"Normal service will resume. The minister's lemon curd has been escalated.\" / caption only, 15 s: ESTIMATED DELAY: AMBULANCE 4 MIN / JAM: UNKNOWN.<\/p>\n<p><b>Cuts from current.<\/b> Nothing in the current script is lost: \"I said raspberry.\" stays verbatim. The empty reporter slot is filled with a bulletin rather than a rant; no outrider or paramedic line (the picture carries them), and the caption is a place-and-time strap only, so the meme space is left for Jack.<\/p>\n<p><b>Risk.<\/b> Too dry: with no joke in the beat-2 line it depends on delivery, so the TTS voice must be flat regional-news, not comedic. \"Police confirm the minister is running late\" edges toward stating the moral by implication; if Jack finds it too pointed, cut to \"The minister is not.\" and let the raspberry do the work. The button's \"Raspberry delay\" assumes the audience heard the minister's line clearly over the motorcade. Four minutes of ambulance delay is an invented figure and should stay vague if the short is posted as a real incident (it is a fictional one: no real politician or party is named).<\/p>\n<p><b>Protected lines.<\/b> \"I said raspberry.\" survives verbatim, delivered on the phone with no pause or trim.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">[lower third, beat 2, regional-news style] BADCODE NEWS. LIVE FROM 2041.<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[grave, straight to camera, ambulance blue light flickering behind] This junction will be in the history books. Not for the ambulance. For what comes through next.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, seething, back seat] I said raspberry.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[back to camera, not a flicker] He will chair the inquiry into this. It will be about the lemon curd. <b>(PUNCHLINE: \"It will be about the lemon curd.\")<\/b><\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">about 29 words<\/td><td class=\"num\"><b>12.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The future-correspondent device lets the reporter be certain without lecturing: knowing how it ends is the authority, so no moral is needed. \"Not for the ambulance\" tells the viewer where the weight is without saying whose time counts. The minister's raspberry line is pure bathos against that gravity, and the button pays it off by making the trivial grievance the thing history remembers, with the gap between the two vehicles left for the viewer to do the sums. Alternate buttons, same slot: \"<span class=\"stage\">[beat]<\/span> He was right about the lemon curd, as it happens.\" / \"Lemon curd. Remember the lemon curd. Everything else is a footnote.\" / CAPTION only, after a held silent shot of the ambulance: \"AMBULANCE: DELAYED. LEMON CURD: PENDING.\"<\/li><li><b>Cuts from current.<\/b> No paramedic or outrider line (beat 1 stays picture only, siren and rain). The reporter's opening is a single sentence plus one fragment. All explanation of the minister's job, party or the ambulance's cargo is gone. The caption exists only as the 0 s lower third.<\/li><li><b>Risk.<\/b> \"Not for the ambulance\" is the closest line to naming the point; if Jack finds it too pointed, swap to \"Not for who was waiting. For who wasn't.\" or cut to just \"This junction will be in the history books.\" The minister's \"inquiry\" tag implies a future that is fictional, so it must read as the reporter's knowledge, not a claim of fact. Possible overlap with another shape's button. Lip-sync on the long second reporter line needs a late-not-early placement; 4.5 s is tight for 14 words.<\/li><li><b>Protected lines.<\/b> \"I said raspberry.\" survives verbatim, unchanged, as the minister's only line (the \"[on the phone]\" direction is kept as a bracket).<\/li><\/ul>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">OUTRIDER<\/td><td class=\"line\">[hand up, not looking at the ambulance] Hold there. Someone important's coming.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[straight to camera, rain, ambulance behind] Police have asked the ambulance to wait. We think that's reasonable.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, back seat] No. I said raspberry.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[same shot, same face] <b>We would like to apologise to the minister for the delay.<\/b><\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">[meme text over the ambulance's blue lights] LEMON CURD INCIDENT: DEVELOPING<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">about 27 words<\/td><td class=\"num\"><b>11.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>(Rest of the 20 s is picture: the hand, the wet road, the motorcade, the held beat on the reporter's face. Punchline is the bolded reporter line; the minister's \"I said raspberry\" is the setup it pays off, and the caption is the optional second sting.)<\/p>\n<p>Alternate punchlines, swap in for the bold line:<\/p>\n<ul><li>REPORTER: \"In fairness, he did say raspberry.\" (reporter sides with the minister's grievance)<\/li><li>REPORTER: \"The ambulance has been very understanding.\" (sarcasm-free, so the absurdity is entirely in the delivery)<\/li><li>OUTRIDER, as a final cut-in: \"Nobody told him they had lemon curd, did they, love?\" (outrider concedes nothing, reporter nods)<\/li><\/ul>\n<p><b>Why it works.<\/b> The gap between the two vehicles is never described: it lives in the distance between \"reasonable\" and \"raspberry\". Because the reporter agrees with everyone in authority, the viewer is left to do the disagreeing, which is the only way the point (whose time counts) gets made without being said. The regional-news register is the joke carrier: a deadpan \"we think that's reasonable\" is funnier and more dangerous than outrage, and it never sneers at the viewer or names a party. The apology flips the expected button (reporter finally criticises) into the maximum concession.<\/p>\n<p><b>Cuts from current.<\/b> The reporter has no knowing-future-narrator line, no stated stakes and no moral; every explanation is gone. The caption is no longer the carrier of the meme, only a garnish. The paramedic never speaks.<\/p>\n<p><b>Risk.<\/b> Too much deference can read as the BadCode reporter genuinely endorsing the motorcade, so the delivery must carry a hair of authority-from-the-future (a held beat before \"reasonable\") or the satire dies. The outrider line is a little on the nose (\"someone important\"); if Jack finds it explains too much, cut it and let the raised hand do it, which shifts the opening to picture only. Four speaker turns in 11 s is tight for lip-sync, though each line is short.<\/p>\n<p><b>Protected lines.<\/b> \"I said raspberry.\" survives verbatim, with only \"No.\" added in front as a cue for the phone call; drop the \"No.\" if Jack wants it pure.<\/p>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[straight to camera, ambulance and outrider behind, blue light on his balaclava] Behind me, an ambulance, held at a red light by police. The road ahead is completely empty. They are waiting for--<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[motorcade siren swallows the reporter; back seat, on the phone] I said raspberry.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[back on camera, motorcade tail lights passing behind him, not a flicker] <b>Sorry. Where was I?<\/b> <i>(PUNCHLINE)<\/i><\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">[lower third, regional TV font, 0 s spoken] LIVE: Lemon curd situation developing<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">spoken ~10 s; ~20 s with picture-only holds (outrider hand, siren sweep, the ambulance still waiting at the end)<\/td><td class=\"num\"><b>~10<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Alternate buttons (swap in for the last REPORTER line and caption):<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[to camera, ambulance still stopped behind him] <b>Back to the studio.<\/b> <i>(PUNCHLINE, ALT A)<\/i><\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC<\/td><td class=\"line\">[through the window, to nobody, tired] <b>Do we have to turn the siren off, or...?<\/b> <i>(PUNCHLINE, ALT B, he asks the outrider if he may stop being urgent)<\/i><\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">[meme caption over the still-waiting ambulance] <b>LEMON CURD: 1  PATIENT: STILL PENDING<\/b> <i>(PUNCHLINE, ALT C, silent)<\/i><\/td><td class=\"num\">0<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The first line hands the viewer every fact (ambulance, red light, empty road) and then stops mid-clause on \"waiting for\", so the audience supplies the ending themselves, which is far stronger than being told. The motorcade arrives like the answer, and the minister's trivial fury proves it without a word of moral. The reporter's \"Sorry. Where was I?\" lands the reversal: the one person who knows how this ends acts as if he lost his place, and the audience is already ahead of him. Deadpan authority becomes the joke, not the explanation.<\/p>\n<p><b>Cuts from current.<\/b> Any reporter line that names the minister, the gap or the cost of the delay. Any caption that explains. \"Whose time counts\" is never stated. The caption becomes a regional-news red herring rather than the meme explanation.<\/p>\n<p><b>Risk.<\/b> If the viewer does not complete \"waiting for--\" the short reads as a gag with no target; the empty road must be clearly visible in beat 1. The cut-off needs sound design (siren over his voice) or it looks like a mistake. \"Where was I?\" can read as a weak joke if the reporter performs it with any wink; it only works played flat. Alt B is the most human but risks sympathy for the paramedic overshadowing the satire.<\/p>\n<p><b>Protected lines.<\/b> \"I said raspberry.\" survives verbatim, delivered as the answer to the interrupted sentence.<\/p>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">OUTRIDER<\/td><td class=\"line\">[gloved hand up, bored] Hold there, love. Won't be a minute.<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC<\/td><td class=\"line\">[leaning out of the cab, calm] Mine's got about four.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">REPORTER<\/td><td class=\"line\">[straight to camera, regional TV voice] Normal service.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">BYSTANDER<\/td><td class=\"line\">[umbrella, not looking up] Every Tuesday.<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">MINISTER<\/td><td class=\"line\">[on the phone, seething] Lemon curd. LEMON CURD. I said raspberry.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">PARAMEDIC<\/td><td class=\"line\">[watching the tail lights go] <b>That was the four.<\/b><\/td><td class=\"num\">1.3<\/td><\/tr>\n<tr><td class=\"who\">CAPTION<\/td><td class=\"line\">RASPBERRY SITUATION: ONGOING<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">about 31 words<\/td><td class=\"num\"><b>about 10.3 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The reporter is the BadCode authority, and the funniest thing an authority can do is stay professionally blank while ordinary people say the quiet part in practical terms. The paramedic's \"about four\" gives the audience a number with no adjective on it, so they do the maths themselves; \"That was the four\" pays it off as the punchline (marked in bold) without any moral. The minister's trivial fury is the contrast, and \"I said raspberry\" is untouched. The caption is a deadpan news-style label that treats the jam as the live story, which is the real crime of the piece, said by no one. The bystander's \"Every Tuesday\" is a throwaway that tells the reader this is routine, not an exception, with no one sneering at the viewer.<\/p>\n<p><b>Cuts from current.<\/b> The reporter's monologue goes entirely (Jack's line was never written, so nothing is lost except the idea that the reporter carries the joke). The caption becomes a label, not a lecture. Nothing explains the gap between the two vehicles.<\/p>\n<p><b>Risk.<\/b> The reporter is the brand, so leaving the reporter with \"Normal service.\" may feel like a waste of the character and thin on the BadCode \"knows how this ends\" authority. \"That was the four\" could read as a death joke too bluntly for some platforms, or be missed without the preceding \"about four\" landing cleanly in 1.8 s. Four voices means four lip-syncs in 20 s, more than the others. Beat 2 is only 2 s of speech in a 5 s slot, so the shot needs a held look to camera.<\/p>\n<p><b>Protected lines.<\/b> \"I said raspberry.\" survives verbatim, as the last sentence of the minister's line. Only \"Lemon curd. LEMON CURD.\" is added in front of it, for context.<\/p>", "08": "<p><b>Version A: the sign<\/b> (detail: a council sign on the pole above the ambulance)<\/p>\n<div cla
