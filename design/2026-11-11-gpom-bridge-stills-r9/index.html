const D = {"title": "Bridge Round 9 Stills", "eyebrow": "GPOM · the bridge · script draft 1D", "heading": "Bridge round 12 stills: Maddie on the open grass, the aerial coming out", "intro": "Round 5, from your timeline round 12 notes (at1559, at1838, at1892): we've left the bunker; Maddie rolls along a plain field, the camera in front of her as in the kill-bot street shot, and the aerial comes out the same way as in scene A. Pick one; no video until you do. Earlier rounds folded below.", "sections": [{"h": "Round 5 (timeline round 12 notes)", "lede": "No bunker, no wreck, no town: open grass, grey overcast.", "groups": [{"slot": "field-r12", "round": 5, "title": "Maddie in the field (she calls the boss here)", "line": "The clip will track in front of her as she rolls, like scene A's street run, then her hatch opens and the aerial rises like scene A's call shot. Two references are shown first.", "kind": "image", "opts": [{"id": "ref-street", "src": "r12/ref-street.jpg", "label": "reference: scene A's street run (camera in front of her)", "warn": ""}, {"id": "ref-hatch", "src": "r12/ref-hatch.jpg", "label": "reference: scene A's call shot (the hatch and aerial)", "warn": ""}, {"id": "FIELD1-a", "src": "r12/FIELD1-a.jpg", "label": "FIELD1-a: the street run's exact framing, the street swapped for open grass; very wide sky", "warn": ""}, {"id": "FIELD1-b", "src": "r12/FIELD1-b.jpg", "label": "FIELD1-b: same, a touch closer, a faint track behind her", "warn": ""}, {"id": "FIELD2-a", "src": "r12/FIELD2-a.jpg", "label": "FIELD2-a: the call shot's exact framing (hatch open, aerial up), downs behind instead of the street", "warn": ""}, {"id": "FIELD2-b", "src": "r12/FIELD2-b.jpg", "label": "FIELD2-b: same, flatter downs behind", "warn": ""}, {"id": "FIELD3-a", "src": "r12/FIELD3-a.jpg", "label": "FIELD3-a: new: low head-on in the field, hatch just flipped open", "warn": "The hatch lid looks like it's floating above her"}, {"id": "FIELD3-b", "src": "r12/FIELD3-b.jpg", "label": "FIELD3-b: new: low head-on, hatch lid up, a worn track", "warn": ""}, {"id": "FIELD4-a", "src": "r12/FIELD4-a.jpg", "label": "FIELD4-a: new: low three-quarter, the aerial rising out of the hatch, long grass", "warn": ""}, {"id": "FIELD4-b", "src": "r12/FIELD4-b.jpg", "label": "FIELD4-b: same idea, a little further back", "warn": ""}]}]}, {"h": "Round 4 (timeline round 11 notes)", "lede": "Kai: 'an extra way much wider shot before we switch to the next day'; the wreck on Maddie's right; her aerial comes out outside the bunker.", "groups": [{"slot": "end-wide-r11", "round": 4, "title": "The new ending wide: Maddie leaves past the wreck", "line": "A much wider shot before 'the next day': the bunker, the smoking kill-bot wreck on Maddie's RIGHT (as through the periscope), Maddie small, trundling away down the hill. Her aerial pops up early in the clip (it's too small to read in most of these stills; the video adds it).", "kind": "image", "opts": [{"id": "END1-a", "src": "r11/END1-a.jpg", "label": "END1-a: much wider: huge grey sky, bunker far up left, Maddie and the wreck small on the slope", "warn": ""}, {"id": "END1-b", "src": "r11/END1-b.jpg", "label": "END1-b: much wider, a little closer: bunker up left, Maddie just left of the smoking wreck", "warn": ""}, {"id": "END2-a", "src": "r11/END2-a.jpg", "label": "END2-a: wide at knee height: the wreck big on the right, Maddie beyond it on its left, bunker behind", "warn": "Not much wider than WRK1-a"}, {"id": "END2-b", "src": "r11/END2-b.jpg", "label": "END2-b: same idea, Maddie a little further on", "warn": "Not much wider than WRK1-a"}, {"id": "END3-a", "src": "r11/END3-a.jpg", "label": "END3-a: from high on the far hillside: walls and hedges, bunker up left, wreck right, Maddie lower left heading away", "warn": ""}, {"id": "END3-b", "src": "r11/END3-b.jpg", "label": "END3-b: from the far hillside: the whole valley, Maddie below and left of the wreck", "warn": ""}, {"id": "END4-a", "src": "r11/END4-a.jpg", "label": "E rn": ""}, {"id": "UP1-b", "src": "r9b/UP1-b.jpg", "label": "UP1-b: same, she is further up the track, nearer the door", "warn": ""}, {"id": "UP2-a", "src": "r9b/UP2-a.jpg", "label": "UP2-a: low behind her, her back big in the foreground, the door ahead", "warn": ""}, {"id": "UP2-b", "src": "r9b/UP2-b.jpg", "label": "UP2-b: same idea, a touch closer to the door", "warn": ""}, {"id": "UP3-a", "src": "r9b/UP3-a.jpg", "label": "UP3-a: from on top of the bunker past an iron rail, looking down as she comes up the rut", "warn": "The doors read as OPEN here; would need fixing"}, {"id": "UP3-b", "src": "r9b/UP3-b.jpg", "label": "UP3-b: same idea, wider, the downs behind", "warn": "The doors read as OPEN here; would need fixing"}, {"id": "UP4-a", "src": "r9b/UP4-a.jpg", "label": "UP4-a: long lens from down the hill: bunker small in the down, Maddie on the track, seed heads in front", "warn": ""}, {"id": "UP4-b", "src": "r9b/UP4-b.jpg", "label": "UP4-b: same idea, Maddie closer to camera, long grass framing", "warn": ""}]}, {"slot": "rollaway-r9b", "round": 2, "title": "Roll-away: Maddie leaves the bunker", "line": "\"Hey, boss. I've given them the presentation. We can only hope they trust us.\"", "kind": "image", "opts": [{"id": "AWAY1-a", "src": "r9b/AWAY1-a.jpg", "label": "AWAY1-a: the film's own wide: a few fallen bricks by the door, Maddie turned away heading down to the right", "warn": ""}, {"id": "AWAY1-b", "src": "r9b/AWAY1-b.jpg", "label": "AWAY1-b: same, with dust still settling by the door", "warn": ""}, {"id": "AWAY2-a", "src": "r9b/AWAY2-a.jpg", "label": "AWAY2-a: at her wheel height, she comes towards us; the door behind, dust in the air, a few bricks", "warn": "Heavy dust/smoke at the door"}, {"id": "AWAY2-b", "src": "r9b/AWAY2-b.jpg", "label": "AWAY2-b: same, closer", "warn": "Heavy dust/smoke at the door"}, {"id": "AWAY3-a", "src": "r9b/AWAY3-a.jpg", "label": "AWAY3-a: very wide over the downs: bunker small on the left, the kill bot wreck smoking far off, Maddie heading away", "warn": ""}, {"id": "AWAY3-b", "src": "r9b/AWAY3-b.jpg", "label": "AWAY3-b: same idea, the wreck nearer, Maddie small beyond it", "warn": ""}, {"id": "AWAY4-a", "src": "r9b/AWAY4-a.jpg", "label": "AWAY4-a: side on at her height, she rolls left to right away from the door; bricks on the grass", "warn": ""}, {"id": "AWAY4-b", "src": "r9b/AWAY4-b.jpg", "label": "AWAY4-b: same idea, closer to the door", "warn": ""}]}]}, {"h": "Lip-sync clips (all four human lines)", "lede": "New Omni 1.2 clips from the plates already approved (LADY0, LADY6, Derek at the periscope), with Kai's picked voices placed on the mouths. Omni read three of the four lines about 1.4x faster than the voices, so two of them only roughly fit. The fix that doesn't re-voice anything is LatentSync, which redraws the mouth to the voice on our own GPU: the inputs are ready, and it needs one command from you.", "groups": [{"slot": "lip-br21", "round": 2, "title": "Old lady: \"You mean... killing everybody.\"", "line": "FITS. Both phrases land on her mouth: 'You mean' at x1.00, 'killing everybody' slowed to x0.85 to fill her mouth. Her mouth moves only a little; it is a quiet read.", "kind": "video", "opts": [{"id": "fit", "src": "lips/shb-br21-lady3-LADY0-fit.mp4", "label": "new clip, muted, with the picked voice fitted (sound on)", "warn": ""}]}, {"slot": "lip-br22", "round": 2, "title": "Old lady: \"Are you literally joking?\"", "line": "Rough fit. She shouts it in 1.5 s; the voice takes 2.3 s. Sped up to x1.2, it still runs 0.3 s after her mouth closes, and at that speed 'joking' starts to blur. Best fixed by redrawing the mouth (see below).", "kind": "video", "opts": [{"id": "fit", "src": "lips/shb-br22-lady0b-LADY0-fit.mp4", "label": "new clip, muted, with the picked voice fitted (sound on)", "warn": "Voice runs past the mouth; 'joking' blurs at x1.2"}]}, {"slot": "lip-br23", "round": 2, "title": "Old lady: \"Derek, go and have a look what that was.\"", "line": "Close. She turns away  to the shut door and stops. The bunker sits in grass on the downs, not on a street, so she comes up a muddy track.", "groups": [{"slot": "rollup-r9", "title": "Roll-up: Maddie arrives at the door (round 1, horn outside: retired)", "line": "[Silent. Maddie rolls up to the bunker door and stops. The steel door, the horn above it.]", "kind": "image", "opts": [{"id": "now", "src": "r9/now-S6-c.jpg", "label": "for reference: the door plate in the film now (no horn outside)", "warn": ""}, {"id": "UP1-b", "src": "r9/UP1-b.jpg", "label": "UP1-b: the film's own wide, horn added above the door, a tyre track she came in on. Matches best; animate her rolling in (as V5 did, shot backwards)", "warn": "She is already at the door in the still"}, {"id": "UP2-a", "src": "r9/UP2-a.jpg", "label": "UP2-a: low behind her, her back big in the foreground, the door ahead with the horn", "warn": ""}, {"id": "UP2-b", "src": "r9/UP2-b.jpg", "label": "UP2-b: same idea, a touch closer to the door", "warn": ""}, {"id": "UP3-b", "src": "r9/UP3-b.jpg", "label": "UP3-b: from on top of the bunker, past the back of the horn, looking down as she comes up the track", "warn": ""}, {"id": "UP4-a", "src": "r9/UP4-a.jpg", "label": "UP4-a: long lens from down the hill: the bunker small in the down, Maddie tiny on the track, seed heads in front", "warn": "Very small Maddie"}, {"id": "UP4-b", "src": "r9/UP4-b.jpg", "label": "UP4-b: same idea, closer: Maddie on the track below the door, long grass in front", "warn": ""}], "round": 1}]}, {"h": "Roll-away (after the boom; she radios the boss)", "lede": "\"Hey, boss. I've given them the presentation. We can only hope they trust us.\" The horn hangs off its bracket, bricks and dust by the door.", "groups": [{"slot": "rollaway-r9", "title": "Roll-away: Maddie leaves the bunker (round 1, horn outside: retired)", "line": "[Outside. Maddie turns and rolls away from the bunker.]", "kind": "image", "opts": [{"id": "AWAY1-a", "src": "r9/AWAY1-a.jpg", "label": "AWAY1-a: t const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e };
$('eb').textContent = D.eyebrow || ''; $('hd').textContent = D.heading || ''; $('in').textContent = D.intro || '';
let db = null, me = null; const P = {}, N = {};
async function save(slot, patch) { if (!db) { $('st').textContent = 'Sign in to save picks'; return }
  try { await db.doc('picks/' + slot + '__' + me).set({ slot, pick: P[slot] || '', note: N[slot] || '', ...patch, by: me, at: Date.now() }); $('st').textContent = 'Saved' } catch (e) { $('st').textContent = 'Not saved: ' + (e && e.code || 'error') } }
function toggle(slot, id) { P[slot] = P[slot] === id ? '' : id; paint(); save(slot, { pick: P[slot] }) }
function paint() {
  for (const b of document.querySelectorAll('.card button.pk')) { const on = P[b.dataset.slot] === b.dataset.id; b.setAttribute('aria-pressed', on); b.textContent = on ? 'Picked' : 'Pick'; b.closest('.card').classList.toggle('on', on) }
  for (const t of OLDG) { const p = P[t.dataset.slot]; t.className = 'tag ' + (p ? 'got' : 'none'); t.textContent = p ? 'Picked: ' + (LBL[t.dataset.slot + '/' + p] || p) : 'Not picked' }
  if (lb.open) showLb() }

// Lightbox: the image large, its label, Pick, and the arrows step through the same row's images.
const lb = $('lb'); let cur = null;
function showLb() { const { g, i } = cur, x = g.opts[i], on = P[g.slot] === x.id;
  lb.querySelector('img').src = x.src; lb.querySelector('img').alt = g.title + ' ' + x.label;
  $('lbl').textContent = `${g.title} · ${x.label} (${i + 1} of ${g.opts.length})`;
  $('lbk').setAttribute('aria-pressed', on); $('lbk').textContent = on ? 'Picked' : 'Pick' }
function openLb(g, i) { cur = { g, i }; showLb(); if (!lb.open) lb.showModal() }
const step = d => { cur.i = (cur.i + d + cur.g.opts.length) % cur.g.opts.length; showLb() };
$('lbp').onclick = () => step(-1); $('lbn').onclick = () => step(1); $('lbx').onclick = () => lb.close();
$('lbk').onclick = () => toggle(cur.g.slot, cur.g.opts[cur.i].id);
lb.querySelector('img').onclick = () => lb.close();
lb.addEventListener('click', e => { if (e.target === lb) lb.close() });
lb.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1) });

// Rounds (optional): spec "round": N; a group's "round" defaults to 1. With N > 1, this round's groups
// come first with a New tag; earlier groups fold into one closed panel, each tagged with the viewer's pick.
const R = D.round || 1, isNew = g => (g.round || 1) >= R;
const OLDG = [], LBL = {};
for (const s of D.sections) for (const g of s.groups) for (const x of g.opts) LBL[g.slot + '/' + x.id] = x.label;

if (R > 1) {
  const fresh = D.sections.flatMap(s => s.groups.filter(isNew));
  const todo = el('div', 'todo'); todo.append(el('strong', '', `New in round ${R}: ${fresh.length} to pick`));
  for (const g of fresh) { const a = el('a', '', g.title); a.href = '#g-' + g.slot; todo.append(a) }
  $('secs').append(todo);

}
const order = R > 1 ? [...D.sections.map(s => ({ ...s, groups: s.groups.filter(isNew) })), ...D.sections.map(s => ({ ...s, groups: s.groups.filter(g => !isNew(g)), old: true }))] : D.sections;
for (const s of order) {
  if (!s.groups.length) continue;
  const sec = el('section', 'sec'); sec.append(el('h2', '', s.h)); if (s.lede && !s.old) sec.append(el('p', 'lede', s.lede));
  for (const g of s.groups) {
    const gr = el('div', 'grp'); gr.id = 'g-' + g.slot; const h3 = el('h3', '', g.title); gr.append(h3); if (g.line) gr.append(el('div', 'line', g.line));
    if (R > 1 && !s.old) { gr.classList.add('isnew'); h3.append(el('span', 'tag new', 'New')) }
    if (s.old) { const t = el('span', 'tag none', 'Not picked'); t.dataset.slot = g.slot; h3.append(t); OLDG.push(t) }
    const o = el('div', 'opts');
    g.opts.forEach((x, i) => {
      const c = el('div', 'card'); c.append(el('div', 'v', x.label));
      if (g.kind === 'audio') { const au = el('audio'); au.controls = true; au.preload = 'none'; au.src = x.src; c.append(au) }
      if (g.kind === 'link') { const a = el('a', 'open', 'Listen on Suno ↗'); a.href = x.href; a.target = '_blank'; a.rel = 'noopener'; c.append(a) }
      if (g.kind === 'video') { const v = el('video'); v.controls = true; v.muted = true; v.playsInline = true; v.preload = 'metadata'; v.src = x.src; c.append(v) }
      if (g.kind === 'image') { const z = el('button', 'zoom'); z.type = 'button'; z.setAttribute('aria-label', 'Enlarge ' + x.label);
        const im = el('img'); im.src = x.src; im.alt = g.title + ' ' + x.label; im.loading = 'lazy'; z.append(im); z.onclick = () => openLb(g, i); c.append(z) }
      if (x.warn) c.append(el('div', 'warn', x.warn));
      const b = el('button', 'pk', 'Pick'); b.type = 'button'; b.dataset.slot = g.slot; b.dataset.id = x.id; b.onclick = () => toggle(g.slot, x.id);
      c.append(b); o.append(c);
    });
    const l = el('label', 'status', 'Note'), ta = el('textarea'); ta.id = 'n-' + g.slot; l.htmlFor = ta.id; let t; ta.oninput = () => { N[g.slot] = ta.value; clearTimeout(t); t = setTimeout(() => save(g.slot, { note: ta.value }), 700) };
    gr.append(o, l, ta); sec.append(gr);
  }
  (s.old ? oldBox : $('secs')).append(sec);
}
if (oldBox) $('secs').append(oldBox);
paint();
(async () => { db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; $('st').textContent = 'Sign in to save picks'; return }
  me = await user.id(); const snap = await db.collection('picks').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); P[v.slot] = v.pick || ''; N[v.slot] = v.note || ''; const ta = $('n-' + v.slot); if (ta) ta.value = v.note || '' }
  paint(); $('st').textContent = 'Ready. Picks save as you go. Click any image to see it large.' })();
