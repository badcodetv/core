 a way to ask.\" [CHECK: nothing factual claimed, tone only]<\/li><li>B3 \"Please give generously. He already has.\" (charity-ad voice, the cruellest and shortest, about 2.5 s)<\/li><li>B4 Silence: hold the freeze frame 3 s with the piano gone, then cut to the logo. No narrator at all.<\/li><li>Alt plea line, shorter (cut to about 12 s): \"It doesn't go far, a hundred thousand. Not with the wine fridge. Three pounds a month. That's all.\"<\/li><\/ul>\n<p><b>Cuts from current.<\/b> \"This is Jeremy\" and the third-person narrator opening go: the narrator no longer introduces him, the SCREEN caption does. \"You could help him afford a second wine fridge\" becomes his own wistful \"there's only the one\", so the fridge gag survives in his mouth. The median card is kept but moves from final beat to the turn, with a button after it.<\/p>\n<p><b>Risk.<\/b> (1) If the chancellor is played too knowingly it becomes a sketch rather than a parody; he must stay sincere. (2) \"Second house\" and \"wine fridge\" are invented specifics about a fictional man; fine, but any stat about real ministers' pay or homes must be [CHECK]. (3) Sincere pleading can read as sympathy if the card lands late; the freeze must come before the audience relaxes. (4) The voice is a character voice, so it needs a casting decision (AI Studio), not a narrator pass. (5) \"Rupert Aldersgate-Finch\" should be checked to ensure it matches no real politician.<\/p>\n<p><b>Protected lines.<\/b> None. From the slate draft, the median card survives intact (£39,039, ONS 2025, the only checked fact); the wine fridge survives as his line; \"£3 a month\" survives as his ask.<\/p>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[slow, soft, sad piano, black and white, a man alone in a vast kitchen] This is Crispin. Crispin earns a hundred thousand pounds a year.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[piano cuts dead, FREEZE on Crispin's face] Median UK full-time pay: £39,039 a year (ONS, April 2025)<\/td><td class=\"num\">2.0 (silence)<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[same voice, piano creeps back, entirely unbothered] For just three pounds a month, you could help Crispin afford a second wine fridge.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[tiny beat] Crispin says thank you.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[last frame, charity-style] SPONSOR A CHANCELLOR<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>13.5 (voice 10.5)<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The first line is already the whole premise: everyone knows this advert and everyone knows what a hundred thousand sounds like, so the viewer is ahead of the narrator by second three. Cutting to the median card there rewards that instinct instead of making them wait for permission. The piano dying is the hard edge. Then the narrator resuming the appeal as though nothing happened is the actual joke: the card is the fact, the carrying-on is the system. No stated moral, and the viewer's own £39,039 sits next to the ask. Alternate buttons for Jack to pick between: (a) \"Crispin says thank you.\" (cleanest, charity-advert cadence); (b) \"Crispin says thank you. He has already forgotten your name.\" (adds the contempt-for-distance note); (c) \"Please give. Crispin is counting on you, mostly for the fridge.\" (more explicit, less good); (d) no spoken button, only the SPONSOR A CHANCELLOR card with the piano resolving (the most silent and the most extreme version, voice drops to 9s).<\/li><li><b>Cuts from current.<\/b> \"only\" in \"Jeremy only earns\" (the card now does the \"only\" work, and the order does the irony); \"a month\" stays but \"you could help him\" shortens to the advert's own phrasing; the card moves from the end to the middle; the real name Jeremy goes.<\/li><li><b>Risk.<\/b> Putting the card at 4s may deflate the second half: if the viewer has already got it, \"second wine fridge\" has to be funny by itself (it is the absurd detail, but it is carrying more weight). Resuming the appeal could read as lazy if the voice does not stay perfectly warm, so the performance must not wink. \"Crispin\" could still feel like a posh-name stereotype aimed at a person rather than at the office; keep it a first name only, no surname, no party colours, no resemblance to any real chancellor. [CHECK] that no serving or recent chancellor is called Crispin, and that the ONS figure is quoted exactly as \"median full-time gross annual pay, April 2025\".<\/li><li><b>Protected lines.<\/b> None. The slate lines survive in spirit: \"earns £100,000 a year\" and \"second wine fridge\" are intact; \"Jeremy\" is replaced by the invented name; \"For just £3 a month\" is spoken as \"three pounds a month\".<\/li><\/ul>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[sad piano, slow motion, black and white] This is Rupert.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">BUTLER<\/td><td class=\"line\">[hands folded, looking at the floor] He hasn't been the same since the second wine fridge broke.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">ACCOUNTANT<\/td><td class=\"line\">[shaking her head] Rupert only earns £100,000 a year. We've tried everything.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">DONOR<\/td><td class=\"line\">[wiping an eye, kind, sincere] I give three pounds a month. It's not much. But to Rupert, it's... <span class=\"stage\">[beat]<\/span> a Chablis.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">For just £3 a month, you could help Rupert keep his wine at the correct temperature.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[freeze frame, piano stops] Median UK full-time pay: £39,039 a year (ONS, 2025)<\/td><td class=\"num\">0 (held 2 s, no voice)<\/td><\/tr>\n<tr><td class=\"who\">BUTLER<\/td><td class=\"line\">[into the silence, quietly] Sir will want the fridge by Friday.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>19.5<\/b> (about 20 s voice, 2 s held card)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Alternates, same slots (buttons for Jack to pick):<\/b><\/p>\n<ul><li>Donor, sharper: \"I'm on thirty-nine thousand myself, but somebody has to do something for Rupert.\" [CHECK: works only if we keep the donor as a median earner. It makes the donor the fool. Prefer the Chablis line.] (5 s)<\/li><li>Accountant: \"We've cut back. He's down to one car and a driver who also drives the car.\" (4 s)<\/li><li>Final button, narrator: \"Rupert thanks you. His butler thanks you. His butler's wine fridge thanks you.\" (4 s, replaces the butler button)<\/li><li>Final button, silent: hold the card; the butler's soft cough, then the sad piano restarts. (0 s)<\/li><li>Cold open, 1 s: the standard charity-ad title card \"RUPERT'S STORY\" over piano, then straight to the Butler.<\/li><\/ul>\n<p><b>Why it works.<\/b> The sad charity advert always runs on testimony: the carer, the neighbour, the one-line quote from the person who \"sees it every day\". Handing that to a butler, an accountant and a tearful donor makes the format recognisable inside two seconds without a word of explanation, and each witness is a different rung of the comfortable class defending the chancellor's comfort, so the target is the decision-maker and his circle, not working people. The donor is kind and sincere, so no one is mocked for caring; the joke is what they are being asked to care about. Because the chorus plays it dead straight, the median card lands as a silence the audience fills themselves, and the butler's last line stings by being the one voice that never noticed the card.<\/p>\n<p><b>Cuts from current.<\/b> The narrator's two long sentences are split among four voices; \"afford a second wine fridge\" becomes the butler's grief (the fridge breaking) and the narrator's tidied-up ask (keep his wine at the correct temperature). \"Jeremy\" becomes \"Rupert\". Nothing from the SCREEN card is cut.<\/p>\n<p><b>Risk.<\/b> Four voices in 20 seconds means four voice casts and four lip or caption treatments on a phone short, which is expensive and can sound like a sketch, not an advert. The butler and accountant are fiction-class stereotypes (a hair from \"posh people bad\"); keep them dignified, never sneering. \"Rupert Ashgrove-Vane\" must be checked against living MPs before locking [CHECK]. The sincere donor can read as mocking people who give to charity; keep her warm and don't make her a fool. The £100,000 figure comes from the source quote (\"£100k a year doesn't go far\"), not a verified chancellor salary, so we never say it is Rupert's real pay, only what he \"earns\" in the joke.<\/p>\n<p><b>Protected lines.<\/b> None protected. The slate draft survives in spirit: \"This is Jeremy. Jeremy only earns £100,000 a year.\" becomes the narrator opener plus the accountant's line (the invented name replaces Jeremy); \"For just £3 a month, you could help him afford a second wine fridge\" becomes the narrator's ask, with \"wine fridge\" moved into the butler's first line. The SCREEN card text is unchanged.<\/p>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[soft, sad piano, black and white, slow push in on a gate] This is Crispin.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[the house, then a kitchen the size of a bus depot] This is where Crispin lives.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">Crispin only earns a hundred thousand pounds a year.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[one wine fridge, humming, lit like a shrine] This is Crispin's wine fridge. It is full.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[pan to an empty patch of wall] This is the space where a second one should be. For three pounds a month, you can fill it.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[freeze frame, music cuts] Median UK full-time pay: £39,039 a year (ONS, April 2025)<\/td><td class=\"num\">0.0 (2 s held, no voice)<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[warm, flat, a beat late] Please. Give what you can. [BUTTON A] He'd do the same for you. <span class=\"stage\">[pause]<\/span> He wouldn't.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>17.5 voice (+2 s card)<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Button options for Jack (swap the last narrator line):<\/p>\n<ul><li>A (above): \"Please. Give what you can. He'd do the same for you. He wouldn't.\" Tone: sweet, then cold.<\/li><li>B: \"The fridge is full, Crispin. The rest of us are on the second shelf.\" Quiet and bitter, aims at the comfort gap.<\/li><li>C: \"Crispin's wall is empty. Your wall is somebody else's. Give generously.\" Sting about the landlord; keep only if the reader is left feeling seen, not blamed.<\/li><li>D: \"Sponsor a chancellor today. <span class=\"stage\">[beat]<\/span> Somebody has to.\" Shortest, driest.<\/li><\/ul>\n<p><b>Why it works.<\/b> The format is recognised in two seconds from the piano, the grey and \"This is Crispin\". Every line is a place: gate, kitchen, fridge, empty wall. The audience supplies the verdict while the narrator stays sincere, so the argument is carried by what is on screen and not by any stated moral. The £100,000 line gets a flat delivery, and the empty wall (hardship as a gap for a second fridge) is the absurd image. The median card then lands as a plain fact with no commentary, and the button is the only joke that speaks.<\/p>\n<p><b>Cuts from current.<\/b> \"Jeremy\" (points at a real chancellor) becomes Crispin. \"You could help him afford a second wine fridge\" becomes a space on a wall, so the fridge is shown, not said. The narrator is allowed one more line after the card than the draft had, because the sting needs a landing.<\/p>\n<p><b>Risk.<\/b> The visual does half the work, and the short fails if the kitchen shots read as ordinary stock; they need to be absurdly big. \"Crispin\" may still sound like a posh stereotype; the contempt must stay on the comfort, not on class. The £100,000 figure is the slate's quoted salary, so keep it as Crispin's invented pay and do not present it as any real office-holder's pay [CHECK before it is attributed to \"a chancellor\"]. Button A's \"He wouldn't\" is the sharpest and could read as a personal attack; B or D is safer. About 17.5 s of voice is near the 20 s ceiling, so trim \"It is full.\" if the cut runs long.<\/p>\n<p><b>Protected lines.<\/b> None. The only fact on screen, £39,039 (ONS, April 2025), is kept exactly as checked.<\/p>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[black and white, slow motion, one low piano note, a grey hallway, a man in a good coat standing very still]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[soft, slow, barely above a whisper] This is Crispin.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">Crispin is a Chancellor. <span class=\"stage\">[beat]<\/span> Crispin only earns a hundred thousand pounds a year.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[slow-mo: he opens a wine fridge, it is full, he stares into it] Every evening, he has to look at just one wine fridge.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">For just three pounds a month, you could give Crispin a second.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[freeze frame, piano stops dead, white text on black, held in silence] Median UK full-time pay: £39,039 a year (ONS, April 2025)<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[same soft voice, no change of tone] Sponsor a Chancellor. <span class=\"stage\">[beat]<\/span> Because somebody out there is struggling.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>17.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Buttons (pick one to replace the last line, all about 3s):<\/b><\/p>\n<ul><li><b>A, the sign-off, as written above.<\/b> \"Because somebody out there is struggling.\" The charity tagline pointed at the card the viewer has just read. It never says who. Cleanest, least lecture.<\/li><li><b>B, the future voice.<\/b> \"Where I'm from, we ran this advert for thirty years. Nobody noticed which way round it was.\" The BadCode narrator breaks the parody voice for one line. Adds our authority, risks a stated moral.<\/li><li><b>C, the nurturing flip.<\/b> [still soft] \"Crispin will be fine. He always is. Is anyone asking about you?\" Care register, but it leans on \"you\", watch the reader rules.<\/li><li><b>D, the dead-straight ask.<\/b> \"Lines are open until the Budget. Crispin thanks you. He has never had to thank anyone before.\" Pure format, no turn, the card carries everything.<\/li><li><b>E, the fine print, SCREEN only (voice ends on the card).<\/b> [tiny white text, bottom of the freeze] \"Crispin is not a real person. He is not hard to find.\" Silent button, saves 3 seconds, total voice falls to about 14.5s.<\/li><\/ul>\n<p><b>Why it works.<\/b> Every beat is a beat of a real appeal, so the viewer says \"oh, it's one of those\" inside two seconds, and then the format's own sad logic does the joke: a single named individual, one small domestic detail (one wine fridge, the \"just one\" is the cruelty), a price shrunk to £3. Nothing is winked at. The narrator plays it with total sincerity, which is the Brass Eye rule: the audience supplies the contempt, the voice never does. The £39,039 card cuts the music and the voice, which is the same trick real appeals use when they go to the silent statistic, only here the statistic indicts the subject of the appeal, not the viewer. The button is the charity's own tagline, so no moral is stated and nobody is told they were fooled. All the contempt sits on Crispin's comfort and the decision-maker's pay, none on a working person.<\/p>\n<p><b>Cuts from current.<\/b> \"Jeremy\" goes (it points at a real chancellor). \"You could help him afford\" becomes \"you could give Crispin\": shorter, and \"give\" is the charity verb. \"Second wine fridge\" is kept but split into a setup (one fridge, every evening) and the ask (a second), which is how appeals build the need before the price. The card is kept verbatim, with the month added because the ONS figure is April 2025, and it now sits in silence before the button instead of being the last thing on screen.<\/p>\n<p><b>Risk.<\/b> (1) \"Only earns a hundred thousand pounds\" is the fictional figure for a fictional man: fine, but it must not read as a claim about the real Chancellor's pay. Do not state any real chancellor's salary anywhere ([CHECK] if Jack wants one). (2) The real \"£100k doesn't go far\" quote is not used anywhere in these lines, so no attribution risk; if Jack wants it as SCREEN text, it needs a source check first. (3) A £3 fridge is not real arithmetic: that is the joke, but some viewers may read it as a sloppy fact, keep the narrator's tone so flat it is obviously the format talking. (4) At 17.5s there is no spare room, any added line must replace one. (5) Buttons B and C are the likeliest to tip into lecture. (6) The format is a UK-wide shared memory but it is a reference to a type of advert, never to a named charity, so no logos, no real charity name, no real shortcode or phone number on screen.<\/p>\n<p><b>Protected lines.<\/b> None. The only fixed content is the SCREEN median-pay card (£39,039, ONS, April 2025), which survives verbatim in every option; if the figure or date ever changes, the year in the card changes with it and nothing else in the script depends on the number.<\/p>", "10": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[soft, slow, wobbling piano, black and white] This is Rupert.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">Rupert only earns £100,000 a year.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\"><span class=\"stage\">[beat, Rupert gazes into an empty wine fridge]<\/span> Tonight, his second wine fridge stands empty.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">For just £3 a month, you can help.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[freeze frame, piano stops, 2s of silence] Median UK full-time pay: £39,039 a year (ONS, April 2025)<\/td><td class=\"num\">0 voice (2.5 hold)<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[gentler than before] Or keep your £3. You're going to need it.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>12.5 voice (about 15 with the hold)<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The button is the whole short. \"Or keep your £3\" flips the charity ask in the one place the format cannot survive, the donor is told to say no, and it is kind (the nurturing note under the snark) while the contempt stays on the decision-makers. The £3 is planted in line 4 so the last line pays it off. Silence before the card does the turning, so no moral is stated. Button options, strongest first: (1) \"Or keep your £3. You're going to need it.\" (2) \"Please give generously. He never has.\" (3) \"Rupert has been struggling for a long time. Mostly with the concept.\" (4) \"Please give generously. Somebody in this country has to.\" (5, no voice) the card holds and nothing is said. Dead line to cut if 20s is tight: \"Tonight, his second wine fridge stands empty.\"<\/p>\n<p><b>Cuts from current.<\/b> \"Jeremy\" becomes Rupert. \"you could help him afford\" is shortened to \"you can help\", and the wine fridge moves into a visual line so the ask stays short. The median card stays, with the month added to the source. The button is new.<\/p>\n<p><b>Risk.<\/b> \"You're going to need it\" could read as a lecture or as pity for the viewer, so deliver it warm, not smug. \"Second wine fridge\" is an invented detail, as is \"Rupert\", so it must read as satire and not a claim about a real person. £100,000 is the quote's figure, not a checked statistic, so if the on-screen quote is used, attribute it as the source quote. Nothing about the median should say who earns it, just the number.<\/p>\n<p><b>Protected lines.<\/b> None. The slate's \"only earns £100,000 a year\", the £3 a month, the wine fridge and the £39,039 card all survive in spirit; only the name and the order changed.<\/p>"}}], "questions": [{"id": "q1", "text": "The name. Drafts use Crispin (first name only, so the target is the office, not a person). Other candidates from the writers: Hugo, Rupert, Giles, Montague. Which one, and are you happy to have it checked against current and recent chancellors and ministers before it is voiced? ⚠️ Claude's check: Crispin Blunt was a real Conservative MP (Reigate, until 2024), so 'Crispin' alone may read as him. Better: a name no recent MP or minister has had; any pick gets checked before it is voiced."}, {"id": "q2", "text": "Does the narrator say 'Chancellor' out loud (1A) or leave it to the title of the short and the end card (1B, 1C)? Saying it makes the target unmistakable; leaving it out is drier."}, {"id": "q3", "text": "Which button: the polite sign-off (1A 'Please give generously'), the thank-you (1B 'Crispin says thank you'), or the kind flip (1C 'Or keep your £3. You're going to need it.')? Or do you want to write your own? The flip is the strongest but the only one that speaks to the viewer."}, {"id": "q4", "text": "Where does the median card land: at the end after the ask (1A, 1C) or early at about 4 s with the narrator carrying on (1B)? The early version risks deflating the second half but is the only structural twist."}, {"id": "q5", "text": "Length. Two of the drafts are about 10-12 s of voice. Is that the point (short, then loop), or do you want it nearer 20 s? If longer, the cheapest thing to restore is the 'second wine fridge' setup from shape 09 ('Every evening he has to look at just one wine fridge', about 3.5 s)."}], "round": 1, "plan": [{"h": "Round 2: what changed", "items": ["New draft 1D (shown first): 1C, plus your ending with the nan.", "Line 3's wine fridge is now a blank, with ten funnier hardships to pick from in 1D's notes (two nod at the 2009 expenses scandal: the duck house and the moat).", "Her line 'Poor bastard...' is in verbatim."]}, {"h": "You decide", "items": ["Which hardship (a-j), or your own.", "Keep 'Or keep your £3. You're going to need it.' before the nan, or cut it (the nan is now the button)?", "The name: Crispin clashes with a real ex-MP (Crispin Blunt). Pick another and I'll check it."]}], "replies": {"1-1C-L3": "Answered in draft 1D: the wine fridge is now a blank with ten options (duck house, last moat, one-towel towel rail, pony sharing a paddock, part-time butler, second home's second home, last thousand bottles, one-week ski trip, swans without scarves, or yours). My pick: the duck house or the moat, because the real 2009 expenses claims make them land harder with the reader."}};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);
  });
  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {
    if (v.notes && v.notes.length) { const ul = el('ul', 'notes'); for (const n of v.notes) ul.append(el('li', '', n)); c.append(ul) }
    c.append(slip(d.id + '-' + v.id, 'Note on draft ' + v.id + ' as a whole'));
  }
  return c;
}

/* ---------- the ranked writers ---------- */
function rankList(d) {
  const wrap = el('div'), used = new Set(d.drafts.flatMap(v => v.lines.flatMap(l => l.tags || [])));
  for (const r of d.ranking) {
    const s = SHAPE[r.shape], det = el('details', 'rank'); det.id = d.id + '-s' + r.shape;
    const sum = el('summary'), nm = el('div', 'nm', 'Writer ' + r.shape + ': ' + s.title);
    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);
    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');
  band.append(el('span', 'eyebrow', 'Dialogue ' + n + ' of ' + D.dialogues.length), el('span', 'meta', d.where + ' · target ' + d.target));
  p.append(band, el('h2', '', d.label), slip(d.id, 'Note on this dialogue as a whole'));
  p.append(el('h3', '', 'Read it: now, and three drafts'));
  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  p.append(el('hr'));
  p.append(el('h3', '', 'Optional: the raw material the three drafts were blended from'));
  p.append(el('p', 'lede', "You only need to pick from the three drafts above. Below are the " + d.ranking.length + " writers' own versions, each pushing one approach to the extreme. 1A, 1B and 1C are built from their best lines: each line's chip (like 09) says which writer it came from. Ranked harshly, best first. Read one only if you want to steal a line, and note it on that writer's slip."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', 'Both dialogues'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
