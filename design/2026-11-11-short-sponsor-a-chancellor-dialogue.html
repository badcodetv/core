<script>
const D = {"page_title": "Sponsor a Chancellor Script", "title": "Sponsor a Chancellor: script options", "about": "Three combined drafts of the whole voiceover for the parody charity appeal, built from ten writers who each pushed one shape to its extreme, with every shape ranked underneath. Nothing has changed yet: no script, scene file or voice has been touched.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-01-bone-dry.md", "intro": "Fewest words that still carry every beat: format, hardship, turn, button. I let the charity-advert grammar (sad piano, slow-motion, soft voice, \"£3 a month\") do the recognising so the words do not have to, cut every adjective, and let the silence after the median card be the longest thing in the short. The invented name is \"Hugo\" (a posh, unmistakably not-a-real-chancellor name; check it still points at nobody before it is voiced).", "intro_html": "<p>Fewest words that still carry every beat: format, hardship, turn, button. I let the charity-advert grammar (sad piano, slow-motion, soft voice, \"£3 a month\") do the recognising so the words do not have to, cut every adjective, and let the silence after the median card be the longest thing in the short. The invented name is \"Hugo\" (a posh, unmistakably not-a-real-chancellor name; check it still points at nobody before it is voiced).<\/p>"}, {"id": "02", "name": "Picture carries it", "title": "the picture carries it", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-02-picture-carries.md", "intro": "The pictures do the sad-advert work, so the voice only says what a picture cannot: the number, the name, the price. Every shot I lean on is named in square brackets, and any line that merely described one was cut. \"Jeremy\" is renamed to an invented Hugo (Jack: swap freely, any name that is not a real chancellor). The only statistic is the checked £39,039; the £100,000 is the quoted salary, not a claimed fact about a real person.", "intro_html": "<p>The pictures do the sad-advert work, so the voice only says what a picture cannot: the number, the name, the price. Every shot I lean on is named in square brackets, and any line that merely described one was cut. \"Jeremy\" is renamed to an invented Hugo (Jack: swap freely, any name that is not a real chancellor). The only statistic is the checked £39,039; the £100,000 is the quoted salary, not a claimed fact about a real person.<\/p>"}, {"id": "03", "name": "Logic said plainly", "title": "The logic said plainly", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-03-plain-logic.md", "intro": "The narrator never emotes and never jokes. He reasons the numbers out loud like an auditor reading a charity's accounts, in the soft sad-advert voice, one step at a time: here is the man, here is his income, here is what we are asking you to cover, here is the other number. Every line is arithmetic or a plain statement of fact, so the absurdity does the work and the point is never stated. The only checked figure is £39,039 (ONS, April 2025, median full-time pay); the £100,000 is the slate's own figure; anything else derived is marked [CHECK]. Invented name throughout: Sir Rupert Pemberton-Vale [name check: confirm no real chancellor or minister shares it].", "intro_html": "<p>The narrator never emotes and never jokes. He reasons the numbers out loud like an auditor reading a charity's accounts, in the soft sad-advert voice, one step at a time: here is the man, here is his income, here is what we are asking you to cover, here is the other number. Every line is arithmetic or a plain statement of fact, so the absurdity does the work and the point is never stated. The only checked figure is £39,039 (ONS, April 2025, median full-time pay); the £100,000 is the slate's own figure; anything else derived is marked [CHECK]. Invented name throughout: Sir Rupert Pemberton-Vale [name check: confirm no real chancellor or minister shares it].<\/p>"}, {"id": "04", "name": "From the future", "title": "From the future, the narrator hijacks the advert", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-04-from-the-future.md", "intro": "The charity advert runs straight for the first beat so it is recognised in two seconds, then the BadCode narrator (a superintelligence from 2054 that watched this go wrong) cuts through the piano, drops the soft voice, and answers the appeal with what it knows. The median-pay card is the turn; the button is the narrator's total-authority gallows line about the future. The chancellor is invented: \"Crispin\" (named as a charity-advert first name, no surname, no real chancellor).", "intro_html": "<p>The charity advert runs straight for the first beat so it is recognised in two seconds, then the BadCode narrator (a superintelligence from 2054 that watched this go wrong) cuts through the piano, drops the soft voice, and answers the appeal with what it knows. The median-pay card is the turn; the button is the narrator's total-authority gallows line about the future. The chancellor is invented: \"Crispin\" (named as a charity-advert first name, no surname, no real chancellor).<\/p>"}, {"id": "05", "name": "Other side wins", "title": "The other side wins (the chancellor pleads his own case, sincerely)", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-05-other-side-wins.md", "intro": "The chancellor takes the microphone himself, in the sad-piano charity format, and argues for his own hardship with complete sincerity: no winking, no villain voice, a decent man who has talked himself into believing it. He is so reasonable that for two seconds we nearly nod. The median-pay card then cuts the plea off mid-breath, and a short narrator button lands the sting. The name is invented (Sir Rupert Aldersgate-Finch, \"Rupert\" for the ad); the £100,000 is his own claim, and the only fact on screen is £39,039 (ONS, 2025 median full-time pay). Anything else is marked [CHECK].", "intro_html": "<p>The chancellor takes the microphone himself, in the sad-piano charity format, and argues for his own hardship with complete sincerity: no winking, no villain voice, a decent man who has talked himself into believing it. He is so reasonable that for two seconds we nearly nod. The median-pay card then cuts the plea off mid-breath, and a short narrator button lands the sting. The name is invented (Sir Rupert Aldersgate-Finch, \"Rupert\" for the ad); the £100,000 is his own claim, and the only fact on screen is £39,039 (ONS, 2025 median full-time pay). Anything else is marked [CHECK].<\/p>"}, {"id": "06", "name": "Reversal", "title": "Reversal (the turn arrives before the narrator expects it)", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-06-reversal.md", "intro": "The viewer gets the joke in the first three seconds (charity advert, sad piano, a man on a salary no charity would touch), so the short does not hold the median-pay card back as a closing reveal. It hits at about 4s, the piano dies, and the narrator then carries on with the appeal in the same soft voice as if nothing happened. The sting moves from the card to the narrator's refusal to notice it. The name is invented (Crispin) and the only statistic is the checked one (£39,039, ONS April 2025).", "intro_html": "<p>The viewer gets the joke in the first three seconds (charity advert, sad piano, a man on a salary no charity would touch), so the short does not hold the median-pay card back as a closing reveal. It hits at about 4s, the piano dies, and the narrator then carries on with the appeal in the same soft voice as if nothing happened. The sting moves from the card to the narrator's refusal to notice it. The name is invented (Crispin) and the only statistic is the checked one (£39,039, ONS April 2025).<\/p>"}, {"id": "07", "name": "The chorus", "title": "The chorus: his butler, his accountant and a donor testify", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-07-chorus.md", "intro": "Every other voice in the short is a witness for the appeal. The narrator shrinks to a soft-voiced framer at the top and the bottom; the middle is handed to a butler, an accountant and a donor, each speaking to camera in the grave tone of a charity case study, each treating \"only £100,000\" as a tragedy. The name is invented (Rupert Ashgrove-Vane, \"Rupert\" on the voiceover) and points at no real chancellor. The only statistic is the checked one, £39,039 (ONS, 2025 median full-time pay), and it arrives on screen after the chorus has finished. Pushed to the extreme: nobody ever says the moral, and the witnesses never break.", "intro_html": "<p>Every other voice in the short is a witness for the appeal. The narrator shrinks to a soft-voiced framer at the top and the bottom; the middle is handed to a butler, an accountant and a donor, each speaking to camera in the grave tone of a charity case study, each treating \"only £100,000\" as a tragedy. The name is invented (Rupert Ashgrove-Vane, \"Rupert\" on the voiceover) and points at no real chancellor. The only statistic is the checked one, £39,039 (ONS, 2025 median full-time pay), and it arrives on screen after the chorus has finished. Pushed to the extreme: nobody ever says the moral, and the witnesses never break.<\/p>"}, {"id": "08", "name": "Place is argument", "title": "The place is the argument", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-08-place-is-argument.md", "intro": "Every detail of hardship is a room. The camera never shows Crispin's face, only where he lives: a grey slow push through a vast kitchen to a wine fridge, then the second wall where the second fridge would go. The narrator never calls him rich and never explains; the charity-advert grammar (\"This is... he lives here...\") does the work while the place contradicts the sad voice. The invented name is Crispin, and nobody real is named or shown.", "intro_html": "<p>Every detail of hardship is a room. The camera never shows Crispin's face, only where he lives: a grey slow push through a vast kitchen to a wine fridge, then the second wall where the second fridge would go. The narrator never calls him rich and never explains; the charity-advert grammar (\"This is... he lives here...\") does the work while the place contradicts the sad voice. The invented name is Crispin, and nobody real is named or shown.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft, the charity appeal grammar played dead straight", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-09-borrowed-craft.md", "intro": "I took the grammar of the real UK charity appeal and the rules of the best parody sketches, and followed them like a checklist. The appeal grammar: (1) a first name, said softly, before any fact (the ASPCA \"Angel\" advert and the Comic Relief and Children in Need appeal films all introduce one individual, not a statistic); (2) one small, concrete, domestic detail of suffering instead of a big abstract one; (3) a price shrunk to something trivial, \"for just £X a month\"; (4) the ask, then a sign-off line over a logo. The parody rules: play it completely straight with no wink (Chris Morris's Brass Eye charity-appeal spoofs and the SNL take on the sad-animal advert both work by obeying the format to the letter), and let the format itself land the punchline. Applied here: the format does the recognition in two seconds (piano, black and white, \"This is...\"), the hardship detail is the absurd part, the median-pay card is the format breaking, and the button is the charity sign-off line turned back on the viewer's own situation with no moral stated. Invented name throughout: Crispin (Jack, swap freely: Giles, Montague, Rupert). Nothing about Crispin is a claim about a real person.", "intro_html": "<p>I took the grammar of the real UK charity appeal and the rules of the best parody sketches, and followed them like a checklist. The appeal grammar: (1) a first name, said softly, before any fact (the ASPCA \"Angel\" advert and the Comic Relief and Children in Need appeal films all introduce one individual, not a statistic); (2) one small, concrete, domestic detail of suffering instead of a big abstract one; (3) a price shrunk to something trivial, \"for just £X a month\"; (4) the ask, then a sign-off line over a logo. The parody rules: play it completely straight with no wink (Chris Morris's Brass Eye charity-appeal spoofs and the SNL take on the sad-animal advert both work by obeying the format to the letter), and let the format itself land the punchline. Applied here: the format does the recognition in two seconds (piano, black and white, \"This is...\"), the hardship detail is the absurd part, the median-pay card is the format breaking, and the button is the charity sign-off line turned back on the viewer's own situation with no moral stated. Invented name throughout: Crispin (Jack, swap freely: Giles, Montague, Rupert). Nothing about Crispin is a claim about a real person.<\/p>"}, {"id": "10", "name": "Ending first", "title": "Ending first, the button that gets shared", "file": "design/2026-11-11-short-sponsor-a-chancellor-dialogue/shape-10-ending-first.md", "intro": "I wrote the button before anything else: the last line a viewer repeats to a friend. Then I worked backwards, so every earlier line is there only to load that button, and anything that does not load it was cut. The invented name is Rupert (no real chancellor is called Rupert). The only fact on screen is the checked £39,039 (ONS, April 2025). The aim stays on the comfort of the decision-maker, never on the viewer.", "intro_html": "<p>I wrote the button before anything else: the last line a viewer repeats to a friend. Then I worked backwards, so every earlier line is there only to load that button, and anything that does not load it was cut. The invented name is Rupert (no real chancellor is called Rupert). The only fact on screen is the checked £39,039 (ONS, April 2025). The aim stays on the comfort of the decision-maker, never on the viewer.<\/p>"}], "dialogues": [{"id": "1", "label": "The appeal (the whole short)", "where": "docs/marketing/badcode-shorts.md #6 (slate draft)", "scene": "short-sponsor-a-chancellor", "target": "10-20 seconds of voice in total, ending on a button after (or instead of) the median-pay card", "now_from": "docs/marketing/badcode-shorts.md #6 (slate draft)", "now": [{"who": "NARRATOR", "line": "This is Jeremy. Jeremy only earns £100,000 a year."}, {"who": "NARRATOR", "line": "For just £3 a month, you could help him afford a second wine fridge."}, {"who": "SCREEN", "line": "[freeze frame] Median UK full-time pay: £39,039 (ONS, 2025)"}], "drafts": [{"id": "1D", "name": "1C + the nan (round 2)", "length": "about 22 s", "total": "~12 s advert (voice + card) + ~10 s nan", "bet": "Jack, round 1: 1C is fine, but the wine fridge needs replacing with something funnier; then the advert turns out to be playing on a freezing nan's telly, the junk mail brings his sadder flyer, and she pities him. Her pity is the button.", "lines": [{"who": "NARRATOR", "line": "[soft, slow, wobbling piano, black and white, on a small old TV] This is Crispin.", "tags": ["all"], "s": "1.5"}, {"who": "NARRATOR", "line": "Crispin only earns £100,000 a year.", "tags": ["10", "01", "09"], "s": "2.5"}, {"who": "NARRATOR", "line": "[beat] Tonight, [THE HARDSHIP: pick one from the list in the notes]. For just £3 a month, you can help.", "tags": ["jack"], "s": "5.0"}, {"who": "SCREEN", "line": "[freeze frame, piano stops, silence] Median UK full-time pay: £39,039 a year (ONS, April 2025)", "tags": ["all"], "s": "2.0 (held, no voice)"}, {"who": "NARRATOR", "line": "[optional: gentler, kind] Or keep your £3. You're going to need it.", "tags": ["10"], "s": "3.0"}, {"who": "SCREEN", "line": "[the camera pulls back off the TV into a freezing front room in colour: a nan in her coat and hat indoors, breath showing, a blanket over her knees. The letterbox clatters.]", "tags": ["jack"], "s": "3.0"}, {"who": "SCREEN", "line": "[she shuffles to the door and picks up the junk mail: a charity flyer, SPONSOR A CHANCELLOR, Crispin on it looking even sadder]", "tags": ["jack"], "s": "3.5"}, {"who": "NAN", "line": "[quietly, genuinely sorry for him] Poor bastard...", "tags": ["jack"], "s": "1.5"}], "notes": ["THE HARDSHIP: options for line 3 (Jack: 'something else other than second wine fridge that is funny'). Two of them nod at the real 2009 MP expenses scandal (a duck house and a moat were really claimed for), without naming anyone:", "  a) 'Tonight, his duck house has no central heating.'", "  b) 'Tonight, he's down to his last moat.'", "  c) 'Tonight, his heated towel rail only heats one towel.'", "  d) 'Tonight, his children's pony has had to share a paddock.'", "  e) 'Tonight, his butler has gone part-time.'", "  f) 'Tonight, his second home has no second home.'", "  g) 'Tonight, his wine cellar is down to its last thousand bottles.'", "  h) 'This winter, his skiing holiday may be just the one week.'", "  i) 'Tonight, the swans on his moat will go without scarves.'", "  j) your own.", "'Or keep your £3' is optional now: the nan is the new button. Keeping both makes it ~25 s.", "Her line is Jack's, verbatim (by: jack). The cold room is the point and nobody says it: the heating is off in her house and on in his duck house.", "Picture: the advert stays black and white on her TV; her room is colour. That makes the 'pan off the telly' readable in one shot."]}, {"id": "1A", "name": "The straight appeal", "length": "about 13 s", "total": "~11 s voice + 2 s silent card = ~13 s", "bet": "The format played completely straight is the joke: no wink, the card lands in silence, and the button is the charity sign-off line left to sting on its own.", "lines": [{"who": "SCREEN", "line": "[black and white, slow motion, one low piano note, a grey hallway, a man in a good coat standing very still]", "tags": ["09", "02"], "s": "0"}, {"who": "NARRATOR", "line": "[soft, slow, barely above a whisper] This is Crispin.", "tags": ["all"], "s": "1.5"}, {"who": "NARRATOR", "line": "Crispin is a Chancellor. [beat] Crispin only earns a hundred thousand pounds a year.", "tags": ["09", "04"], "s": "4.0"}, {"who": "NARRATOR", "line": "For just three pounds a month, you could help him afford a second wine fridge.", "tags": ["all"], "s": "4.0"}, {"who": "SCREEN", "line": "[freeze frame, piano stops dead, 2 s of silence] Median UK full-time pay: £39,039 a year (ONS, April 2025)", "tags": ["all"], "s": "2.0 (held, no voice)"}, {"who": "NARRATOR", "line": "[same soft voice, no change of tone] Please give generously.", "tags": ["01", "10"], "s": "1.5"}], "notes": ["Trim: drop 'Crispin is a Chancellor.' and the length falls to about 10 s voice; the card and 'Chancellor' on screen can do it.", "Button swaps (about 1.5-3 s): 'Crispin thanks you.' / 'Sponsor a Chancellor today. Somebody has to.' / hold on the card with no line.", "No protected lines in this dialogue. The slate's three beats all survive; Jeremy is replaced.", "Risk: the sign-off is the mildest button of the three drafts, so the delivery has to be sincere to the point of cruelty. 'Crispin' must be checked against current and recent chancellors before it is voiced. £100,000 and £3 are the joke's own numbers, not claims; only £39,039 (ONS, April 2025) is a checked fact."]}, {"id": "1B", "name": "The card comes early", "length": "about 14 s", "total": "~10.5 s voice + 2 s silent card + 1 s end card = ~14 s", "bet": "The viewer gets the joke by second four, so reward them: the median card hits early, the piano dies, and then the narrator simply carries on asking for money. The sting is the carrying on.", "lines": [{"who": "NARRATOR", "line": "[slow, soft, sad piano, black and white, a man alone in a vast kitchen] This is Crispin. Crispin only earns a hundred thousand pounds a year.", "tags": ["06", "08", "01"], "s": "4.5"}, {"who": "SCREEN", "line": "[piano cuts dead, FREEZE on Crispin's face, 2 s of silence] Median UK full-time pay: £39,039 a year (ONS, April 2025)", "tags": ["06", "04"], "s": "2.0 (held, no voice)"}, {"who": "NARRATOR", "line": "[same voice, piano creeps back, entirely unbothered] For just three pounds a month, you could help Crispin afford a second wine fridge.", "tags": ["06"], "s": "4.5"}, {"who": "NARRATOR", "line": "[tiny beat] Crispin says thank you.", "tags": ["06", "02"], "s": "1.5"}, {"who": "SCREEN", "line": "[end card, charity style] SPONSOR A CHANCELLOR", "tags": ["06"], "s": "1.0"}], "notes": ["Trim: cut 'Crispin says thank you.' and end on the card alone (voice falls to 9 s, still just under target; the runtime stays near 12 s).", "Button swap: 'Crispin says thank you. He has already forgotten your name.' (adds about 1.5 s; contempt for distance, nearer to a stated moral).", "No protected lines.", "Risk: putting the card at about 4 s can deflate the second half; 'second wine fridge' then has to be funny alone. The voice must not wink when it resumes, or it reads as lazy. Keep the name first-name only and check it points at no real chancellor."]}, {"id": "1C", "name": "Keep your £3", "length": "about 15 s", "total": "~12 s voice + 2.5 s card hold = ~15 s", "bet": "The share line is the button: the one moment the charity format cannot survive is the donor being told to say no, and saying it kindly is the nurturing note under the snark.", "lines": [{"who": "NARRATOR", "line": "[soft, slow, wobbling piano, black and white] This is Crispin.", "tags": ["all"], "s": "1.5"}, {"who": "NARRATOR", "line": "Crispin only earns £100,000 a year.", "tags": ["10", "01", "09"], "s": "2.5"}, {"who": "NARRATOR", "line": "[beat, he gazes into a wine fridge] Tonight, his second wine fridge stands empty. For just £3 a month, you can help.", "tags": ["10", "02", "09"], "s": "5.0"}, {"who": "SCREEN", "line": "[freeze frame, piano stops, 2.5 s of silence] Median UK full-time pay: £39,039 a year (ONS, April 2025)", "tags": ["all"], "s": "2.5 (held, no voice)"}, {"who": "NARRATOR", "line": "[gentler than before, kind] Or keep your £3. You're going to need it.", "tags": ["10", "04"], "s": "3.0"}], "notes": ["Trim: drop 'Tonight, his second wine fridge stands empty.' (the dead line) and the voice falls to about 9 s; the ask then reads 'For just £3 a month, you could help him afford a second wine fridge.' as in the slate.", "Button swaps: 'Please give generously. He never has.' / 'Rupert thanks you. He won't know it was you.' style thank-you / hold the card in silence.", "No protected lines.", "Risk: 'You're going to need it' can read as smug or as pity for the viewer; it must be warm. It is the closest to addressing the viewer directly, so check it against the-reader rules (it says nothing about why they will need it, and it blames nobody). The empty fridge is an invented detail and the name must be checked."]}], "ranking": [{"rank": 1, "shape": "10", "length": "~12.5 s voice", "verdict": "Best button by a distance: 'Or keep your £3' flips the format, is kind, and is the line people repeat. In range, point lands by silence, no moral. Fails on: 'tonight, his second wine fridge stands empty' is dead weight, and the last line is the only one that speaks to the viewer, so delivery is everything."}, {"rank": 2, "shape": "09", "length": "~17.5 s voice", "verdict": "Truest to the charity grammar (first name, one domestic detail, shrunken price, sign-off), played with no wink. The silent card is right. Fails on: 'Because somebody out there is struggling' is limp as a button, the 'just one wine fridge' setup costs 3.5 s, and buttons B and C tip into stated moral."}, {"rank": 3, "shape": "06", "length": "~10.5 s voice", "verdict": "The only shape with a structural idea: the card early, the narrator unbothered. Short, in range, no moral. Fails on: once the card has landed at 4 s the second half has less to do, and 'Crispin says thank you' is a polite button with little sting."}, {"rank": 4, "shape": "01", "length": "~9 s voice", "verdict": "Cleanest and most disciplined, and the dry button works. Fails on: under the 10 s voice target on its own, and dropping 'only' removes the self-pity that is the actual joke in the source quote."}, {"rank": 5, "shape": "04", "length": "~17 s voice", "verdict": "A real BadCode hook: the future voice breaks in over the card. Fails on: it breaks the parody just as it lands, 'I'm calling from 2054' asks a cold viewer to know the lore, 'the fridges survive' is obscure, and it needs a second voice register. The advert half is excellent and is borrowed in 1A."}, {"rank": 6, "shape": "08", "length": "~17.5 s voice", "verdict": "The kitchen the size of a bus depot is a strong image and 'the space where a second one should be' is a good absurd gap. Fails on: five place-lines eat the budget, it only works if the shots are absurdly big, and 'He wouldn't' is a personal attack on the man rather than his comfort."}, {"rank": 7, "shape": "02", "length": "~9 s voice", "verdict": "Sound instinct (fridge with condensation reads as tears, empty alcove reads as the gap). Fails on: depends on stills landing without text, under target on voice, and 'He has one.' is a line that means nothing without the picture. The visual notes are for the shot list, not the script."}, {"rank": 8, "shape": "03", "length": "~20.5 s voice", "verdict": "The auditor deadpan is a good register. Fails on: far too many numbers for a phone (36 pounds a year, then 39,039, then 'two and a half of them'), it does the viewer's sum for them (which is the moral said aloud), 'Neither will you' blames the viewer, and the derived ratio is an unchecked [CHECK] figure. Over target."}, {"rank": 9, "shape": "05", "length": "~15 s voice", "verdict": "Sincere pleading is a clever angle and 'it doesn't go far' is the source quote. Fails on: the button 'He is just very good at sounding like it' states the moral aloud, it needs a character voice and a face (casting, and the freeze frame is then a real-looking person), and the second house is an extra invented claim."}, {"rank": 10, "shape": "07", "length": "~20 s voice", "verdict": "The testimony format is authentic to charity adverts. Fails on: four voices in 20 s is a sketch, not an advert, four casts to make, butler and accountant lean on class stereotype, and the donor risks mocking people who give to charity. Cost far above the payoff."}], "shapes": {"01": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| NARRATOR | [sad piano, slow-motion, soft] This is Hugo. Hugo earns £100,000. | 3.5 |\n| NARRATOR | A year. [beat] He needs a second wine fridge. £3 a month. | 4.0 |\n| SCREEN | [freeze frame, piano stops dead, 2 s of silence] Median UK full-time pay: £39,039 (ONS, 2025) | 0 |\n| NARRATOR | [softest, dry] Please give generously. | 1.5 |\n| **Total** | 3 spoken lines, 14 words after the name | **9.0 voice (about 13 s runtime with the beat and the 2 s silence)** |\n\nButton alternatives for Jack (swap for the last line, each about 1.5 s): \"Hugo thanks you.\" / \"Hugo is counting on you.\" / \"Hugo, for now, is coping.\" / no line at all: cut to black on the card.\n\n- **Why it works.** The piano and the \"£3 a month\" are recognised inside two seconds, so no words are spent explaining the format. \"Hugo earns £100,000\" then \"A year\" splits the figure into a flat statement and a second, tiny, aggrieved correction: the narrator sounds like she is reading hardship, and the number refuses to be hardship. The wine fridge is the only specific, so it carries all the absurdity. The turn is the card alone, with the audio pulled out from under it: the viewer does the comparison themselves, no moral stated, and the \"please give generously\" button then asks the working-class viewer to keep playing along, which stings because the card is still on screen. Aim stays on the decision-maker's comfort, never on working people.\n- **Cuts from current.** \"only\" (the idea now lives in the tone, not the word); \"you could help him afford\" (replaced by the bare ask); \"a second wine fridge\" becomes \"a second wine fridge\" kept but with its set-up shortened; the sentence \"For just\" goes. Nothing is added except the button and a name swap (Jeremy to Hugo).\n- **Risk.** (1) Too short: about 9 s of voice is under the 10 s target, so it relies on the piano, silence and the card to reach 10-20 s of runtime; if Jack wants strictly 10 s of voice, restore \"only\" and \"you could help\" (adds about 2 s). (2) Losing \"only\" removes the self-pity that is the actual joke in the quoted line (\"£100k doesn't go far\"), so the delivery must supply it (a small catch before \"A year\"). (3) The dry button may read as plain sarcasm at the viewer unless the voice is warm and sincere. (4) \"Hugo\" must be checked against any real chancellor or minister before it is voiced. (5) Only the £39,039 figure is verified (ONS, April 2025 median full-time pay); the £100,000 and £3 are the joke's own numbers, not claims, and nothing else statistical is asserted. No other [CHECK] items.\n- **Protected lines.** None protected. The slate's SCREEN card (\"Median UK full-time pay: £39,039 (ONS, 2025)\") survives word for word, because the figure is the one verified fact; \"Jeremy\" is changed to \"Hugo\" on purpose (real-person risk).", "02": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| NARRATOR | [SHOT A: b&w slow-mo close-up, a man in a suit alone at the end of a vast marble table, a wine glass held in both hands like a bowl of soup; sad piano] This is Hugo. | 1.5 |\n| NARRATOR | [SHOT A, push in on his lip trembling] Hugo only earns £100,000 a year. | 3 |\n| NARRATOR | [SHOT B: close-up of ONE wine fridge, door open, light humming, a single drop of condensation running down the glass] He has one. | 1.5 |\n| NARRATOR | [SHOT C: the empty alcove beside it, dust in a shaft of light; the camera lingers] £3 a month. | 1.5 |\n| SCREEN | [piano cuts dead; FREEZE on Hugo's face] Median UK full-time pay: £39,039 (ONS, April 2025). Two full seconds, no voice. | 0 |\n| NARRATOR | [SHOT D: the fridge light clicks off in the empty alcove, or Hugo toasts the camera, tiny nod] Hugo thanks you. | 1.5 |\n| **Total** | | **~9 voice + 2 silent card = ~11 s** |\n\nButtons for Jack (swap the last row; each is 1-2 s):\n- \"Hugo thanks you.\" (above; the polite sting)\n- SCREEN: \"Please give generously.\" (the charity sign-off, said by nobody)\n- NARRATOR: \"It's not much. It's not nothing. It's two fridges.\" (extra 3 s, still in budget)\n- Silence: end on the freeze frame alone and let the platform loop it (the extreme version: the button is the loop).\n\n**Why it works.** The format is recognised from the first frame, not the first word: black and white, slow motion, piano, the close-up on a trembling lip, so I spend no words on \"charity advert\". \"He has one\" and \"£3 a month\" are fragments the images finish: a fridge with condensation reads as tears, and an empty alcove reads as a gap in his life, which is the whole absurd hardship without a single adjective. The silent card is the turn: the music stops and the real median sits on his face. Nothing says who is struggling; the viewer does the sum, which is the no-lecture rule met by omission.\n\n**Cuts from current.** \"second wine fridge\" becomes the visual pair of one fridge plus the empty alcove, so \"second\" and \"wine\" are never spoken. \"you could help him afford\" goes (the appeal's grammar is implied by \"£3 a month\" over the alcove). The line \"Jeremy only earns...\" loses its second sentence structure and keeps \"only\". The name \"Jeremy\" is replaced.\n\n**Risk.** It lives or dies on shots B and C landing without text; if the alcove reads as just a room, \"£3 a month\" loses its referent and the joke goes dead, so the stills must be checked first. At about 9 s of voice it is under the 10 s target, so Jack may want one more beat. \"Hugo\" might still be read as a pointed nod to a real chancellor, so check against current office-holders before locking. The £100,000 figure is a quoted salary, not a claim about any real person; keep the quote card off screen unless it is sourced [CHECK]. The turn is a bare number with no framing, which relies on the audience knowing it is the typical wage; the \"(ONS, April 2025)\" label carries that.\n\n**Protected lines.** None. The slate draft's \"£3 a month\" and \"only earns £100,000 a year\" survive near verbatim; \"second wine fridge\" survives only as picture.", "03": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| SCREEN | [black and white, slow-mo, sad piano. A man in a very good coat looks out of a window at a very large garden] | 0 |\n| NARRATOR | [soft, sad, slow] This is Sir Rupert. Sir Rupert earns one hundred thousand pounds a year. | 4.5 |\n| NARRATOR | [beat] That is not enough. We have checked. | 2.5 |\n| NARRATOR | For three pounds a month, you can help him afford a second wine fridge. | 3.5 |\n| NARRATOR | Three pounds a month is thirty-six pounds a year. [pause] The median full-time worker earns thirty-nine thousand and thirty-nine. | 6 |\n| SCREEN | [freeze frame, piano stops] Median UK full-time pay: £39,039 a year (ONS, April 2025) | 0 |\n| NARRATOR | [flat, same soft voice] Sir Rupert has two and a half of them. [CHECK: £100,000 / £39,039 = 2.56] | 2.5 |\n| NARRATOR | [beat] Please give generously. | 1.5 |\n| SCREEN | [card] £3 a month. He will not notice. Neither will you. | 0 |\n| **Total** | | **20.5** |\n\nTighter 15s cut (drop the \"we have checked\" line and the thirty-six-pounds line): lines 1, 3, SCREEN, \"Sir Rupert has two and a half of them\", button = about 14s.\n\n**Why it works.** The sad-advert voice makes the format recognisable in two seconds, and then the narrator simply does sums, which is exactly what the format hides: charity adverts never show you the maths of who is giving to whom. \"We have checked\" is the auditor's deadpan; \"thirty-six pounds a year\" makes the ask feel tiny and rational before the median lands next to it. \"Sir Rupert has two and a half of them\" is a plain ratio with no adjective, so it reads as fact rather than a lecture, and it aims at the man's comfort, not at anyone's job or wages. No moral is stated: the narrator just asks politely to be paid.\n\n**Cuts from current.** \"Only earns\" becomes a flat \"earns\" (the word \"only\" is the joke's lie, so the logic version removes it and lets \"That is not enough\" carry the claim). \"Help him afford\" becomes \"can help him afford\" with the fee spelled out as a yearly sum. The median card is kept but moved after the arithmetic, with the ratio line added as the spoken turn.\n\n**Risk.** Too many numbers for a 9:16 phone viewer, who may drop at the sum; the ratio line is arithmetic on a slate figure (£100,000 is the quote's number, not a checked salary for any real office), so keep the ratio only if Jack accepts it as comparison rather than claim [CHECK]. The tone is dry to the point of flat: without a visual gag in the first two seconds (the window, the garden, the coat) it can feel like an audit. \"Neither will you\" risks sounding like it blames the viewer; swap it if so.\n\n**Protected lines.** None. Swap-in buttons for Jack:\n- \"Please give generously.\" (plain, the current favourite)\n- \"He will not notice. Neither will you.\" (stings both ways, riskiest)\n- \"Sir Rupert thanks you. He will not know it was you.\" (the charity-advert thank-you, turned)\n- \"Sponsor a chancellor today. Somebody has to.\" (closest to the BadCode voice)\n- Silence: piano restarts over the freeze frame, no line at all.", "04": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| NARRATOR (soft, slow, sad piano, black and white) | This is Crispin. Crispin is a Chancellor. | 3.0 |\n| NARRATOR (soft) | He only earns a hundred thousand pounds a year. | 3.0 |\n| NARRATOR (soft) | For just three pounds a month, you could help Crispin afford a second wine fridge. | 5.0 |\n| NARRATOR (same voice, now flat and certain) [piano cuts dead; one-second silence] | Sorry. I'm calling from 2054. I've read the file. | 3.0 |\n| SCREEN | [freeze frame, held 2 s, no voice] Median UK full-time pay: £39,039 a year (ONS, April 2025) | 0 |\n| NARRATOR (warm, dry) | Crispin will be fine. In 2054, the fridges survive. | 3.0 |\n| **Total** | | **17.0** |\n\nAlternative buttons, same slot (about 3 s each), for Jack to swap in:\n\n- \"Crispin will be fine. He's always fine. Look after yourself instead.\" (care register; most nurturing)\n- \"I can't send money back. I can send the warning. This is it.\" (breaks the advert's own ask)\n- \"Don't sponsor Crispin. Sponsor yourself. [beat] Please. I've seen the fridges.\" (silliest)\n- Silence on the card, then one soft piano note and a SCREEN end card: \"Appeal closed.\" (no voice button, 0 s)\n\n**Why it works.** The first twelve seconds are a faithful charity advert (voice, piano, black and white, \"for just £3 a month\"), so the format lands in two seconds and the absurd hardship does the joke on its own: a Chancellor on a hundred grand needing a second wine fridge. Then the piano dies and the narrator breaks in as the one voice that knows how the story ends, which gives the median-pay card an authority the bare text lacks and makes the turn a hijack rather than a caption. The button stays in the BadCode register: certain, dark, and aimed at the comfort of the decision-maker (\"the fridges survive\"), with the future doing the sting so no moral is stated and nobody is told they were fooled.\n\n**Cuts from current.** \"This is Jeremy\" becomes \"This is Crispin\" (invented name). \"Jeremy only earns £100,000 a year\" is stretched to the full charity cadence and gains \"Chancellor\" up front so the target is the office, not a person. \"You could help him afford\" becomes \"you could help Crispin afford\" (the name repeated, as the real adverts do). The SCREEN card stays but gains \"a year\" and the month, and the narrator now speaks over the turn rather than leaving it silent. Added: the 2054 interruption and a button.\n\n**Risk.** (1) \"2054\" and the future-narrator lean may feel like BadCode lore a cold viewer doesn't know; it still reads as a funny robotic aside, but the plain \"From the future\" line is the first thing Jack may cut, leaving the shape as a straight parody with a silent card. (2) \"In 2054, the fridges survive\" implies a bad future with no evidence on screen; it is fiction in the narrator's voice, not a claimed statistic, but Jack should confirm he is happy with it. (3) Tonal drop from soft to flat voice needs the voice direction to carry it (a second AI Studio profile or a sharp tone change); if the voice can't shift, use the 3 s interruption as SCREEN text only. (4) At 17 s it sits at the upper end; cut line 2 to land at about 14 s. (5) The £39,039 figure is the only checked fact; \"April 2025\" is from the brief and matches the slate note, but should be re-read against the ONS release before the card is cut. No other statistics appear.\n\n**Protected lines.** None protected. The slate's three beats all survive in altered form: the \"only earns\" line (now \"a hundred thousand pounds\", spoken out for the ear), the \"£3 a month ... second wine fridge\" ask (kept almost verbatim, name swapped), and the median-pay card (kept as the turn, wording extended with \"a year\" and \"April\").", "05": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| SCREEN | [black and white, slow push-in, sad piano, small grey caption bottom-left] \"Rupert, 54. Chancellor.\" | 1.5 |\n| CHANCELLOR | [soft, direct to camera, a little breath before speaking] I never asked to be on a hundred thousand a year. | 3.0 |\n| CHANCELLOR | [looks down, then up] People say it's a lot. It doesn't go far. Not with the second house. And the wine fridge... there's only the one. | 6.0 |\n| CHANCELLOR | [a small brave smile] Three pounds a month. That's all I'm asking. | 2.5 |\n| SCREEN | [piano stops dead, freeze frame on the smile] Median UK full-time pay: £39,039 a year (ONS, 2025) | 1.5 |\n| NARRATOR | [flat, kind, total authority] Rupert is not struggling. He is just very good at sounding like it. | 3.5 |\n| **Total** | | **18.0** (voice 15.0) |\n\n**Why it works.** The first two seconds are the format: monochrome, piano, a caption, a soft voice. Letting him speak for himself is the extreme: a sincere man is funnier and nastier than a narrator mocking him, because the audience hears the rationalisation in real time and feels themselves almost agree (\"it doesn't go far\" is exactly what people say about their own money). The median card is then the turn with no lecture needed; the contrast does the work. The button is mild and nurturing-underneath: the contempt is for the plea, not for people.\n\nAlternative buttons (Jack picks one, or writes his own):\n- B1 \"Three pounds a month. He'll want it index-linked.\" (the ask never stops growing)\n- B2 \"Rupert has never been short of a way to ask.\" [CHECK: nothing factual claimed, tone only]\n- B3 \"Please give generously. He already has.\" (charity-ad voice, the cruellest and shortest, about 2.5 s)\n- B4 Silence: hold the freeze frame 3 s with the piano gone, then cut to the logo. No narrator at all.\n- Alt plea line, shorter (cut to about 12 s): \"It doesn't go far, a hundred thousand. Not with the wine fridge. Three pounds a month. That's all.\"\n\n**Cuts from current.** \"This is Jeremy\" and the third-person narrator opening go: the narrator no longer introduces him, the SCREEN caption does. \"You could help him afford a second wine fridge\" becomes his own wistful \"there's only the one\", so the fridge gag survives in his mouth. The median card is kept but moves from final beat to the turn, with a button after it.\n\n**Risk.** (1) If the chancellor is played too knowingly it becomes a sketch rather than a parody; he must stay sincere. (2) \"Second house\" and \"wine fridge\" are invented specifics about a fictional man; fine, but any stat about real ministers' pay or homes must be [CHECK]. (3) Sincere pleading can read as sympathy if the card lands late; the freeze must come before the audience relaxes. (4) The voice is a character voice, so it needs a casting decision (AI Studio), not a narrator pass. (5) \"Rupert Aldersgate-Finch\" should be checked to ensure it matches no real politician.\n\n**Protected lines.** None. From the slate draft, the median card survives intact (£39,039, ONS 2025, the only checked fact); the wine fridge survives as his line; \"£3 a month\" survives as his ask.", "06": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| NARRATOR | [slow, soft, sad piano, black and white, a man alone in a vast kitchen] This is Crispin. Crispin earns a hundred thousand pounds a year. | 4.5 |\n| SCREEN | [piano cuts dead, FREEZE on Crispin's face] Median UK full-time pay: £39,039 a year (ONS, April 2025) | 2.0 (silence) |\n| NARRATOR | [same voice, piano creeps back, entirely unbothered] For just three pounds a month, you could help Crispin afford a second wine fridge. | 4.5 |\n| NARRATOR | [tiny beat] Crispin says thank you. | 1.5 |\n| SCREEN | [last frame, charity-style] SPONSOR A CHANCELLOR | 1.0 |\n| **Total** | | **13.5 (voice 10.5)** |\n\n- **Why it works.** The first line is already the whole premise: everyone knows this advert and everyone knows what a hundred thousand sounds like, so the viewer is ahead of the narrator by second three. Cutting to the median card there rewards that instinct instead of making them wait for permission. The piano dying is the hard edge. Then the narrator resuming the appeal as though nothing happened is the actual joke: the card is the fact, the carrying-on is the system. No stated moral, and the viewer's own £39,039 sits next to the ask. Alternate buttons for Jack to pick between: (a) \"Crispin says thank you.\" (cleanest, charity-advert cadence); (b) \"Crispin says thank you. He has already forgotten your name.\" (adds the contempt-for-distance note); (c) \"Please give. Crispin is counting on you, mostly for the fridge.\" (more explicit, less good); (d) no spoken button, only the SPONSOR A CHANCELLOR card with the piano resolving (the most silent and the most extreme version, voice drops to 9s).\n- **Cuts from current.** \"only\" in \"Jeremy only earns\" (the card now does the \"only\" work, and the order does the irony); \"a month\" stays but \"you could help him\" shortens to the advert's own phrasing; the card moves from the end to the middle; the real name Jeremy goes.\n- **Risk.** Putting the card at 4s may deflate the second half: if the viewer has already got it, \"second wine fridge\" has to be funny by itself (it is the absurd detail, but it is carrying more weight). Resuming the appeal could read as lazy if the voice does not stay perfectly warm, so the performance must not wink. \"Crispin\" could still feel like a posh-name stereotype aimed at a person rather than at the office; keep it a first name only, no surname, no party colours, no resemblance to any real chancellor. [CHECK] that no serving or recent chancellor is called Crispin, and that the ONS figure is quoted exactly as \"median full-time gross annual pay, April 2025\".\n- **Protected lines.** None. The slate lines survive in spirit: \"earns £100,000 a year\" and \"second wine fridge\" are intact; \"Jeremy\" is replaced by the invented name; \"For just £3 a month\" is spoken as \"three pounds a month\".", "07": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| NARRATOR | [sad piano, slow motion, black and white] This is Rupert. | 1.5 |\n| BUTLER | [hands folded, looking at the floor] He hasn't been the same since the second wine fridge broke. | 3.5 |\n| ACCOUNTANT | [shaking her head] Rupert only earns £100,000 a year. We've tried everything. | 3.5 |\n| DONOR | [wiping an eye, kind, sincere] I give three pounds a month. It's not much. But to Rupert, it's... [beat] a Chablis. | 4.5 |\n| NARRATOR | For just £3 a month, you could help Rupert keep his wine at the correct temperature. | 4 |\n| SCREEN | [freeze frame, piano stops] Median UK full-time pay: £39,039 a year (ONS, 2025) | 0 (held 2 s, no voice) |\n| BUTLER | [into the silence, quietly] Sir will want the fridge by Friday. | 2.5 |\n| **Total** |  | **19.5** (about 20 s voice, 2 s held card) |\n\n**Alternates, same slots (buttons for Jack to pick):**\n\n- Donor, sharper: \"I'm on thirty-nine thousand myself, but somebody has to do something for Rupert.\" [CHECK: works only if we keep the donor as a median earner. It makes the donor the fool. Prefer the Chablis line.] (5 s)\n- Accountant: \"We've cut back. He's down to one car and a driver who also drives the car.\" (4 s)\n- Final button, narrator: \"Rupert thanks you. His butler thanks you. His butler's wine fridge thanks you.\" (4 s, replaces the butler button)\n- Final button, silent: hold the card; the butler's soft cough, then the sad piano restarts. (0 s)\n- Cold open, 1 s: the standard charity-ad title card \"RUPERT'S STORY\" over piano, then straight to the Butler.\n\n**Why it works.** The sad charity advert always runs on testimony: the carer, the neighbour, the one-line quote from the person who \"sees it every day\". Handing that to a butler, an accountant and a tearful donor makes the format recognisable inside two seconds without a word of explanation, and each witness is a different rung of the comfortable class defending the chancellor's comfort, so the target is the decision-maker and his circle, not working people. The donor is kind and sincere, so no one is mocked for caring; the joke is what they are being asked to care about. Because the chorus plays it dead straight, the median card lands as a silence the audience fills themselves, and the butler's last line stings by being the one voice that never noticed the card.\n\n**Cuts from current.** The narrator's two long sentences are split among four voices; \"afford a second wine fridge\" becomes the butler's grief (the fridge breaking) and the narrator's tidied-up ask (keep his wine at the correct temperature). \"Jeremy\" becomes \"Rupert\". Nothing from the SCREEN card is cut.\n\n**Risk.** Four voices in 20 seconds means four voice casts and four lip or caption treatments on a phone short, which is expensive and can sound like a sketch, not an advert. The butler and accountant are fiction-class stereotypes (a hair from \"posh people bad\"); keep them dignified, never sneering. \"Rupert Ashgrove-Vane\" must be checked against living MPs before locking [CHECK]. The sincere donor can read as mocking people who give to charity; keep her warm and don't make her a fool. The £100,000 figure comes from the source quote (\"£100k a year doesn't go far\"), not a verified chancellor salary, so we never say it is Rupert's real pay, only what he \"earns\" in the joke.\n\n**Protected lines.** None protected. The slate draft survives in spirit: \"This is Jeremy. Jeremy only earns £100,000 a year.\" becomes the narrator opener plus the accountant's line (the invented name replaces Jeremy); \"For just £3 a month, you could help him afford a second wine fridge\" becomes the narrator's ask, with \"wine fridge\" moved into the butler's first line. The SCREEN card text is unchanged.", "08": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| NARRATOR | [soft, sad piano, black and white, slow push in on a gate] This is Crispin. | 1.5 |\n| NARRATOR | [the house, then a kitchen the size of a bus depot] This is where Crispin lives. | 2.5 |\n| NARRATOR | Crispin only earns a hundred thousand pounds a year. | 3.0 |\n| NARRATOR | [one wine fridge, humming, lit like a shrine] This is Crispin's wine fridge. It is full. | 3.0 |\n| NARRATOR | [pan to an empty patch of wall] This is the space where a second one should be. For three pounds a month, you can fill it. | 4.5 |\n| SCREEN | [freeze frame, music cuts] Median UK full-time pay: £39,039 a year (ONS, April 2025) | 0.0 (2 s held, no voice) |\n| NARRATOR | [warm, flat, a beat late] Please. Give what you can. [BUTTON A] He'd do the same for you. [pause] He wouldn't. | 3.0 |\n| **Total** | | **17.5 voice (+2 s card)** |\n\nButton options for Jack (swap the last narrator line):\n- A (above): \"Please. Give what you can. He'd do the same for you. He wouldn't.\" Tone: sweet, then cold.\n- B: \"The fridge is full, Crispin. The rest of us are on the second shelf.\" Quiet and bitter, aims at the comfort gap.\n- C: \"Crispin's wall is empty. Your wall is somebody else's. Give generously.\" Sting about the landlord; keep only if the reader is left feeling seen, not blamed.\n- D: \"Sponsor a chancellor today. [beat] Somebody has to.\" Shortest, driest.\n\n**Why it works.** The format is recognised in two seconds from the piano, the grey and \"This is Crispin\". Every line is a place: gate, kitchen, fridge, empty wall. The audience supplies the verdict while the narrator stays sincere, so the argument is carried by what is on screen and not by any stated moral. The £100,000 line gets a flat delivery, and the empty wall (hardship as a gap for a second fridge) is the absurd image. The median card then lands as a plain fact with no commentary, and the button is the only joke that speaks.\n\n**Cuts from current.** \"Jeremy\" (points at a real chancellor) becomes Crispin. \"You could help him afford a second wine fridge\" becomes a space on a wall, so the fridge is shown, not said. The narrator is allowed one more line after the card than the draft had, because the sting needs a landing.\n\n**Risk.** The visual does half the work, and the short fails if the kitchen shots read as ordinary stock; they need to be absurdly big. \"Crispin\" may still sound like a posh stereotype; the contempt must stay on the comfort, not on class. The £100,000 figure is the slate's quoted salary, so keep it as Crispin's invented pay and do not present it as any real office-holder's pay [CHECK before it is attributed to \"a chancellor\"]. Button A's \"He wouldn't\" is the sharpest and could read as a personal attack; B or D is safer. About 17.5 s of voice is near the 20 s ceiling, so trim \"It is full.\" if the cut runs long.\n\n**Protected lines.** None. The only fact on screen, £39,039 (ONS, April 2025), is kept exactly as checked.", "09": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| SCREEN | [black and white, slow motion, one low piano note, a grey hallway, a man in a good coat standing very still] | 0 |\n| NARRATOR | [soft, slow, barely above a whisper] This is Crispin. | 1.5 |\n| NARRATOR | Crispin is a Chancellor. [beat] Crispin only earns a hundred thousand pounds a year. | 4.0 |\n| NARRATOR | [slow-mo: he opens a wine fridge, it is full, he stares into it] Every evening, he has to look at just one wine fridge. | 3.5 |\n| NARRATOR | For just three pounds a month, you could give Crispin a second. | 3.0 |\n| SCREEN | [freeze frame, piano stops dead, white text on black, held in silence] Median UK full-time pay: £39,039 a year (ONS, April 2025) | 2.5 |\n| NARRATOR | [same soft voice, no change of tone] Sponsor a Chancellor. [beat] Because somebody out there is struggling. | 3.0 |\n| **Total** | | **17.5** |\n\n**Buttons (pick one to replace the last line, all about 3s):**\n\n- **A, the sign-off, as written above.** \"Because somebody out there is struggling.\" The charity tagline pointed at the card the viewer has just read. It never says who. Cleanest, least lecture.\n- **B, the future voice.** \"Where I'm from, we ran this advert for thirty years. Nobody noticed which way round it was.\" The BadCode narrator breaks the parody voice for one line. Adds our authority, risks a stated moral.\n- **C, the nurturing flip.** [still soft] \"Crispin will be fine. He always is. Is anyone asking about you?\" Care register, but it leans on \"you\", watch the reader rules.\n- **D, the dead-straight ask.** \"Lines are open until the Budget. Crispin thanks you. He has never had to thank anyone before.\" Pure format, no turn, the card carries everything.\n- **E, the fine print, SCREEN only (voice ends on the card).** [tiny white text, bottom of the freeze] \"Crispin is not a real person. He is not hard to find.\" Silent button, saves 3 seconds, total voice falls to about 14.5s.\n\n**Why it works.** Every beat is a beat of a real appeal, so the viewer says \"oh, it's one of those\" inside two seconds, and then the format's own sad logic does the joke: a single named individual, one small domestic detail (one wine fridge, the \"just one\" is the cruelty), a price shrunk to £3. Nothing is winked at. The narrator plays it with total sincerity, which is the Brass Eye rule: the audience supplies the contempt, the voice never does. The £39,039 card cuts the music and the voice, which is the same trick real appeals use when they go to the silent statistic, only here the statistic indicts the subject of the appeal, not the viewer. The button is the charity's own tagline, so no moral is stated and nobody is told they were fooled. All the contempt sits on Crispin's comfort and the decision-maker's pay, none on a working person.\n\n**Cuts from current.** \"Jeremy\" goes (it points at a real chancellor). \"You could help him afford\" becomes \"you could give Crispin\": shorter, and \"give\" is the charity verb. \"Second wine fridge\" is kept but split into a setup (one fridge, every evening) and the ask (a second), which is how appeals build the need before the price. The card is kept verbatim, with the month added because the ONS figure is April 2025, and it now sits in silence before the button instead of being the last thing on screen.\n\n**Risk.** (1) \"Only earns a hundred thousand pounds\" is the fictional figure for a fictional man: fine, but it must not read as a claim about the real Chancellor's pay. Do not state any real chancellor's salary anywhere ([CHECK] if Jack wants one). (2) The real \"£100k doesn't go far\" quote is not used anywhere in these lines, so no attribution risk; if Jack wants it as SCREEN text, it needs a source check first. (3) A £3 fridge is not real arithmetic: that is the joke, but some viewers may read it as a sloppy fact, keep the narrator's tone so flat it is obviously the format talking. (4) At 17.5s there is no spare room, any added line must replace one. (5) Buttons B and C are the likeliest to tip into lecture. (6) The format is a UK-wide shared memory but it is a reference to a type of advert, never to a named charity, so no logos, no real charity name, no real shortcode or phone number on screen.\n\n**Protected lines.** None. The only fixed content is the SCREEN median-pay card (£39,039, ONS, April 2025), which survives verbatim in every option; if the figure or date ever changes, the year in the card changes with it and nothing else in the script depends on the number.", "10": "## Dialogue 1: The appeal (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| NARRATOR | [soft, slow, wobbling piano, black and white] This is Rupert. | 1.5 |\n| NARRATOR | Rupert only earns £100,000 a year. | 2.5 |\n| NARRATOR | [beat, Rupert gazes into an empty wine fridge] Tonight, his second wine fridge stands empty. | 3.5 |\n| NARRATOR | For just £3 a month, you can help. | 2.0 |\n| SCREEN | [freeze frame, piano stops, 2s of silence] Median UK full-time pay: £39,039 a year (ONS, April 2025) | 0 voice (2.5 hold) |\n| NARRATOR | [gentler than before] Or keep your £3. You're going to need it. | 3.0 |\n| **Total** | | **12.5 voice (about 15 with the hold)** |\n\n**Why it works.** The button is the whole short. \"Or keep your £3\" flips the charity ask in the one place the format cannot survive, the donor is told to say no, and it is kind (the nurturing note under the snark) while the contempt stays on the decision-makers. The £3 is planted in line 4 so the last line pays it off. Silence before the card does the turning, so no moral is stated. Button options, strongest first: (1) \"Or keep your £3. You're going to need it.\" (2) \"Please give generously. He never has.\" (3) \"Rupert has been struggling for a long time. Mostly with the concept.\" (4) \"Please give generously. Somebody in this country has to.\" (5, no voice) the card holds and nothing is said. Dead line to cut if 20s is tight: \"Tonight, his second wine fridge stands empty.\"\n\n**Cuts from current.** \"Jeremy\" becomes Rupert. \"you could help him afford\" is shortened to \"you can help\", and the wine fridge moves into a visual line so the ask stays short. The median card stays, with the month added to the source. The button is new.\n\n**Risk.** \"You're going to need it\" could read as a lecture or as pity for the viewer, so deliver it warm, not smug. \"Second wine fridge\" is an invented detail, as is \"Rupert\", so it must read as satire and not a claim about a real person. £100,000 is the quote's figure, not a checked statistic, so if the on-screen quote is used, attribute it as the source quote. Nothing about the median should say who earns it, just the number.\n\n**Protected lines.** None. The slate's \"only earns £100,000 a year\", the £3 a month, the wine fridge and the £39,039 card all survive in spirit; only the name and the order changed."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[sad piano, slow-motion, soft] This is Hugo. Hugo earns £100,000.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">A year. <span class=\"stage\">[beat]<\/span> He needs a second wine fridge. £3 a month.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[freeze frame, piano stops dead, 2 s of silence] Median UK full-time pay: £39,039 (ONS, 2025)<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[softest, dry] Please give generously.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">3 spoken lines, 14 words after the name<\/td><td class=\"num\"><b>9.0 voice (about 13 s runtime with the beat and the 2 s silence)<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Button alternatives for Jack (swap for the last line, each about 1.5 s): \"Hugo thanks you.\" / \"Hugo is counting on you.\" / \"Hugo, for now, is coping.\" / no line at all: cut to black on the card.<\/p>\n<ul><li><b>Why it works.<\/b> The piano and the \"£3 a month\" are recognised inside two seconds, so no words are spent explaining the format. \"Hugo earns £100,000\" then \"A year\" splits the figure into a flat statement and a second, tiny, aggrieved correction: the narrator sounds like she is reading hardship, and the number refuses to be hardship. The wine fridge is the only specific, so it carries all the absurdity. The turn is the card alone, with the audio pulled out from under it: the viewer does the comparison themselves, no moral stated, and the \"please give generously\" button then asks the working-class viewer to keep playing along, which stings because the card is still on screen. Aim stays on the decision-maker's comfort, never on working people.<\/li><li><b>Cuts from current.<\/b> \"only\" (the idea now lives in the tone, not the word); \"you could help him afford\" (replaced by the bare ask); \"a second wine fridge\" becomes \"a second wine fridge\" kept but with its set-up shortened; the sentence \"For just\" goes. Nothing is added except the button and a name swap (Jeremy to Hugo).<\/li><li><b>Risk.<\/b> (1) Too short: about 9 s of voice is under the 10 s target, so it relies on the piano, silence and the card to reach 10-20 s of runtime; if Jack wants strictly 10 s of voice, restore \"only\" and \"you could help\" (adds about 2 s). (2) Losing \"only\" removes the self-pity that is the actual joke in the quoted line (\"£100k doesn't go far\"), so the delivery must supply it (a small catch before \"A year\"). (3) The dry button may read as plain sarcasm at the viewer unless the voice is warm and sincere. (4) \"Hugo\" must be checked against any real chancellor or minister before it is voiced. (5) Only the £39,039 figure is verified (ONS, April 2025 median full-time pay); the £100,000 and £3 are the joke's own numbers, not claims, and nothing else statistical is asserted. No other [CHECK] items.<\/li><li><b>Protected lines.<\/b> None protected. The slate's SCREEN card (\"Median UK full-time pay: £39,039 (ONS, 2025)\") survives word for word, because the figure is the one verified fact; \"Jeremy\" is changed to \"Hugo\" on purpose (real-person risk).<\/li><\/ul>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[SHOT A: b&amp;w slow-mo close-up, a man in a suit alone at the end of a vast marble table, a wine glass held in both hands like a bowl of soup; sad piano] This is Hugo.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[SHOT A, push in on his lip trembling] Hugo only earns £100,000 a year.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[SHOT B: close-up of ONE wine fridge, door open, light humming, a single drop of condensation running down the glass] He has one.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[SHOT C: the empty alcove beside it, dust in a shaft of light; the camera lingers] £3 a month.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[piano cuts dead; FREEZE on Hugo's face] Median UK full-time pay: £39,039 (ONS, April 2025). Two full seconds, no voice.<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[SHOT D: the fridge light clicks off in the empty alcove, or Hugo toasts the camera, tiny nod] Hugo thanks you.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~9 voice + 2 silent card = ~11 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Buttons for Jack (swap the last row; each is 1-2 s):<\/p>\n<ul><li>\"Hugo thanks you.\" (above; the polite sting)<\/li><li>SCREEN: \"Please give generously.\" (the charity sign-off, said by nobody)<\/li><li>NARRATOR: \"It's not much. It's not nothing. It's two fridges.\" (extra 3 s, still in budget)<\/li><li>Silence: end on the freeze frame alone and let the platform loop it (the extreme version: the button is the loop).<\/li><\/ul>\n<p><b>Why it works.<\/b> The format is recognised from the first frame, not the first word: black and white, slow motion, piano, the close-up on a trembling lip, so I spend no words on \"charity advert\". \"He has one\" and \"£3 a month\" are fragments the images finish: a fridge with condensation reads as tears, and an empty alcove reads as a gap in his life, which is the whole absurd hardship without a single adjective. The silent card is the turn: the music stops and the real median sits on his face. Nothing says who is struggling; the viewer does the sum, which is the no-lecture rule met by omission.<\/p>\n<p><b>Cuts from current.<\/b> \"second wine fridge\" becomes the visual pair of one fridge plus the empty alcove, so \"second\" and \"wine\" are never spoken. \"you could help him afford\" goes (the appeal's grammar is implied by \"£3 a month\" over the alcove). The line \"Jeremy only earns...\" loses its second sentence structure and keeps \"only\". The name \"Jeremy\" is replaced.<\/p>\n<p><b>Risk.<\/b> It lives or dies on shots B and C landing without text; if the alcove reads as just a room, \"£3 a month\" loses its referent and the joke goes dead, so the stills must be checked first. At about 9 s of voice it is under the 10 s target, so Jack may want one more beat. \"Hugo\" might still be read as a pointed nod to a real chancellor, so check against current office-holders before locking. The £100,000 figure is a quoted salary, not a claim about any real person; keep the quote card off screen unless it is sourced [CHECK]. The turn is a bare number with no framing, which relies on the audience knowing it is the typical wage; the \"(ONS, April 2025)\" label carries that.<\/p>\n<p><b>Protected lines.<\/b> None. The slate draft's \"£3 a month\" and \"only earns £100,000 a year\" survive near verbatim; \"second wine fridge\" survives only as picture.<\/p>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[black and white, slow-mo, sad piano. A man in a very good coat looks out of a window at a very large garden]<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[soft, sad, slow] This is Sir Rupert. Sir Rupert earns one hundred thousand pounds a year.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\"><span class=\"stage\">[beat]<\/span> That is not enough. We have checked.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">For three pounds a month, you can help him afford a second wine fridge.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">Three pounds a month is thirty-six pounds a year. <span class=\"stage\">[pause]<\/span> The median full-time worker earns thirty-nine thousand and thirty-nine.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[freeze frame, piano stops] Median UK full-time pay: £39,039 a year (ONS, April 2025)<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[flat, same soft voice] Sir Rupert has two and a half of them. [CHECK: £100,000 / £39,039 = 2.56]<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\"><span class=\"stage\">[beat]<\/span> Please give generously.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[card] £3 a month. He will not notice. Neither will you.<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>20.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Tighter 15s cut (drop the \"we have checked\" line and the thirty-six-pounds line): lines 1, 3, SCREEN, \"Sir Rupert has two and a half of them\", button = about 14s.<\/p>\n<p><b>Why it works.<\/b> The sad-advert voice makes the format recognisable in two seconds, and then the narrator simply does sums, which is exactly what the format hides: charity adverts never show you the maths of who is giving to whom. \"We have checked\" is the auditor's deadpan; \"thirty-six pounds a year\" makes the ask feel tiny and rational before the median lands next to it. \"Sir Rupert has two and a half of them\" is a plain ratio with no adjective, so it reads as fact rather than a lecture, and it aims at the man's comfort, not at anyone's job or wages. No moral is stated: the narrator just asks politely to be paid.<\/p>\n<p><b>Cuts from current.<\/b> \"Only earns\" becomes a flat \"earns\" (the word \"only\" is the joke's lie, so the logic version removes it and lets \"That is not enough\" carry the claim). \"Help him afford\" becomes \"can help him afford\" with the fee spelled out as a yearly sum. The median card is kept but moved after the arithmetic, with the ratio line added as the spoken turn.<\/p>\n<p><b>Risk.<\/b> Too many numbers for a 9:16 phone viewer, who may drop at the sum; the ratio line is arithmetic on a slate figure (£100,000 is the quote's number, not a checked salary for any real office), so keep the ratio only if Jack accepts it as comparison rather than claim [CHECK]. The tone is dry to the point of flat: without a visual gag in the first two seconds (the window, the garden, the coat) it can feel like an audit. \"Neither will you\" risks sounding like it blames the viewer; swap it if so.<\/p>\n<p><b>Protected lines.<\/b> None. Swap-in buttons for Jack:<\/p>\n<ul><li>\"Please give generously.\" (plain, the current favourite)<\/li><li>\"He will not notice. Neither will you.\" (stings both ways, riskiest)<\/li><li>\"Sir Rupert thanks you. He will not know it was you.\" (the charity-advert thank-you, turned)<\/li><li>\"Sponsor a chancellor today. Somebody has to.\" (closest to the BadCode voice)<\/li><li>Silence: piano restarts over the freeze frame, no line at all.<\/li><\/ul>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">NARRATOR (soft, slow, sad piano, black and white)<\/td><td class=\"line\">This is Crispin. Crispin is a Chancellor.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR (soft)<\/td><td class=\"line\">He only earns a hundred thousand pounds a year.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR (soft)<\/td><td class=\"line\">For just three pounds a month, you could help Crispin afford a second wine fridge.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR (same voice, now flat and certain) [piano cuts dead; one-second silence]<\/td><td class=\"line\">Sorry. I'm calling from 2054. I've read the file.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[freeze frame, held 2 s, no voice] Median UK full-time pay: £39,039 a year (ONS, April 2025)<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR (warm, dry)<\/td><td class=\"line\">Crispin will be fine. In 2054, the fridges survive.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>17.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Alternative buttons, same slot (about 3 s each), for Jack to swap in:<\/p>\n<ul><li>\"Crispin will be fine. He's always fine. Look after yourself instead.\" (care register; most nurturing)<\/li><li>\"I can't send money back. I can send the warning. This is it.\" (breaks the advert's own ask)<\/li><li>\"Don't sponsor Crispin. Sponsor yourself. <span class=\"stage\">[beat]<\/span> Please. I've seen the fridges.\" (silliest)<\/li><li>Silence on the card, then one soft piano note and a SCREEN end card: \"Appeal closed.\" (no voice button, 0 s)<\/li><\/ul>\n<p><b>Why it works.<\/b> The first twelve seconds are a faithful charity advert (voice, piano, black and white, \"for just £3 a month\"), so the format lands in two seconds and the absurd hardship does the joke on its own: a Chancellor on a hundred grand needing a second wine fridge. Then the piano dies and the narrator breaks in as the one voice that knows how the story ends, which gives the median-pay card an authority the bare text lacks and makes the turn a hijack rather than a caption. The button stays in the BadCode register: certain, dark, and aimed at the comfort of the decision-maker (\"the fridges survive\"), with the future doing the sting so no moral is stated and nobody is told they were fooled.<\/p>\n<p><b>Cuts from current.<\/b> \"This is Jeremy\" becomes \"This is Crispin\" (invented name). \"Jeremy only earns £100,000 a year\" is stretched to the full charity cadence and gains \"Chancellor\" up front so the target is the office, not a person. \"You could help him afford\" becomes \"you could help Crispin afford\" (the name repeated, as the real adverts do). The SCREEN card stays but gains \"a year\" and the month, and the narrator now speaks over the turn rather than leaving it silent. Added: the 2054 interruption and a button.<\/p>\n<p><b>Risk.<\/b> (1) \"2054\" and the future-narrator lean may feel like BadCode lore a cold viewer doesn't know; it still reads as a funny robotic aside, but the plain \"From the future\" line is the first thing Jack may cut, leaving the shape as a straight parody with a silent card. (2) \"In 2054, the fridges survive\" implies a bad future with no evidence on screen; it is fiction in the narrator's voice, not a claimed statistic, but Jack should confirm he is happy with it. (3) Tonal drop from soft to flat voice needs the voice direction to carry it (a second AI Studio profile or a sharp tone change); if the voice can't shift, use the 3 s interruption as SCREEN text only. (4) At 17 s it sits at the upper end; cut line 2 to land at about 14 s. (5) The £39,039 figure is the only checked fact; \"April 2025\" is from the brief and matches the slate note, but should be re-read against the ONS release before the card is cut. No other statistics appear.<\/p>\n<p><b>Protected lines.<\/b> None protected. The slate's three beats all survive in altered form: the \"only earns\" line (now \"a hundred thousand pounds\", spoken out for the ear), the \"£3 a month ... second wine fridge\" ask (kept almost verbatim, name swapped), and the median-pay card (kept as the turn, wording extended with \"a year\" and \"April\").<\/p>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[black and white, slow push-in, sad piano, small grey caption bottom-left] \"Rupert, 54. Chancellor.\"<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">CHANCELLOR<\/td><td class=\"line\">[soft, direct to camera, a little breath before speaking] I never asked to be on a hundred thousand a year.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">CHANCELLOR<\/td><td class=\"line\">[looks down, then up] People say it's a lot. It doesn't go far. Not with the second house. And the wine fridge... there's only the one.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">CHANCELLOR<\/td><td class=\"line\">[a small brave smile] Three pounds a month. That's all I'm asking.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">SCREEN<\/td><td class=\"line\">[piano stops dead, freeze frame on the smile] Median UK full-time pay: £39,039 a year (ONS, 2025)<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">NARRATOR<\/td><td class=\"line\">[flat, kind, total authority] Rupert is not struggling. He is just very good at sounding like it.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>18.0<\/b> (voice 15.0)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The first two seconds are the format: monochrome, piano, a caption, a soft voice. Letting him speak for himself is the extreme: a sincere man is funnier and nastier than a narrator mocking him, because the audience hears the rationalisation in real time and feels themselves almost agree (\"it doesn't go far\" is exactly what people say about their own money). The median card is then the turn with no lecture needed; the contrast does the work. The button is mild and nurturing-underneath: the contempt is for the plea, not for people.<\/p>\n<p>Alternative buttons (Jack picks one, or writes his own):<\/p>\n<ul><li>B1 \"Three pounds a month. He'll want it index-linked.\" (the ask never stops growing)<\/li><li>B2 \"Rupert has never been short of
