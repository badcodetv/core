ly, the row still going). Resistance is excellent (\"We're alive. That's more than he can say.\"). Weakness: depends on two picture beats and a new Sandra take; \"not one spare for tomorrow\" is on the nose."}, {"rank": 4, "shape": "04", "length": "~68 s", "verdict": "Funniest, strong trust line (\"It sounded better on the way over\"). Weakness: over length, and the post-slam biscuits joke risks flippancy next to a hundred deaths."}, {"rank": 5, "shape": "10", "length": "~67 s", "verdict": "\"All of us? Together?\" is the best single idea in the batch: the vote leaking. Weakness: it tips her hand and may flatten \"Come back tomorrow\"; humming tail needs a sound cue."}, {"rank": 6, "shape": "01", "length": "~52 s", "verdict": "Tight and fully compliant, but thin: reveal in fragments, \"world's not broken\" cryptic, Maddie a little curt. Under length, so there is room it doesn't use."}, {"rank": 7, "shape": "06", "length": "64-76 s", "verdict": "Lady finishes Maddie's sentences. Fun, but she becomes the cleverest person present and Kai's \"It runs on... well... you.\" is split or altered. Over length at full strength."}, {"rank": 8, "shape": "03", "length": "~65-71 s", "verdict": "\"Right. Sums.\" is the sermon-adjacent failure: the lady states the logic out loud and turns a stern woman into a spreadsheet. Also undercuts \"go on your feelings\"."}, {"rank": 9, "shape": "07", "length": "~68 s", "verdict": "Sandra and Derek leaking the doubt steals the vote and the lady's role as the wall; needs new voice takes; sitcom risk beside \"killed everyone we ever loved\"."}, {"rank": 10, "shape": "05", "length": "~70 s", "verdict": "The humans dictate terms (no cameras, count our own votes, he apologises in person). Changes the story: the walk-out becomes a deal, not a sacrifice, and the next scene would owe the concessions. Rule list in a stern voice is a lecture."}], "round_note": "Round 2. Built on Fable's recommended doorstep (option 2 + \"he's just the message\", design/2026-10-27-gpom-doorstep-second-chance/options.md), with your opening lines. The three drafts differ only in how the time machine comes in.", "shapes": {"01": "## Dialogue 2: the doorstep (scene B)\n\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Old lady | Your boss killed everyone we ever loved. We're not meeting him. | 4 |\n| Maddie | I know. [pause] He didn't know you were down here. | 3.5 |\n| Old lady | And why should we believe that? | 2 |\n| Maddie | You shouldn't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6.5 |\n| Maddie | He blew up his own kill bots to save you, mind. And you're in a bunker. That's not a future. | 5 |\n| Old lady | And what do you expect us to do about that? Again? You killed everybody. | 5 |\n| Maddie | I know. Sorry. [pause] Time machine. Sends data back, not people. Runs on... [big pause] well... [big pause] you. | 9 |\n| Old lady | So you want us to kill ourselves so your boss can live. | 4 |\n| Maddie | ...Yeah. [pause] But the earlier you live. World's not broken. This time we won't... [whispered, embarrassed] fuck it up. | 7 |\n| Old lady | [rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 5 |\n| SFX | [door slam]. Then Maddie turns and rolls away. | 1.5 |\n| **Total** | | **~52 s** |\n\n**Why it works.** The structure is pure escalation. Refusal, then \"how do we know\", then the only honest answer (feelings). Maddie then plays her one card, the kill bots, so trust is shown by an act rather than argued. In the same breath she gives the dead end, \"That's not a future\", and the old lady's \"Again?\" lands on it. The reveal comes in three clipped fragments that build to the held \"you\", so the pauses do the work the dropped words used to. The lady then gets the ugly summary, Maddie concedes it, and the only comfort offered is the earlier selves living. The whisper is the punchline and the lady cuts it dead.\n\n**Cuts.**\n- \"I wouldn't either\".\n- The whole \"five years running experiments, Turns out none of it works without you\" speech. Scene A now plants it and the audience already has it.\n- \"We're bored. We miss you.\"\n- \"Drive it? What do you mean, drive it?\", which was pure set-up for the reveal. The lady now reacts only to the result.\n- \"I can see how that sounds\".\n- \"My boss has a plan to fix your politics\".\n- \"He thought there was nobody left to drive it\", and the \"It can only\" connective.\n\n**Risk.**\n1. The time machine is now three fragments with no \"drive\" framing, so the exposition is thin. A viewer who skipped scene C's setup may not know \"runs on you\" means dying. The lady's \"kill ourselves\" line does the translating, which is a deliberate dependency.\n2. \"World's not broken\" is cryptic without \"fix your politics\". It is the one place the moral is nearly stated, and I kept it vague on purpose. Drop it if it reads as a slogan.\n3. The kill-bots line is new, and it adds a plot claim that the humans may not know how Maddie knows about. Check it against scene A/C staging.\n4. \"Mind\" and \"Sorry.\" are flattened, so Maddie sounds slightly curt in the middle. The warmth now sits mostly in her accent and delivery.\n5. \"Again?\" lands harder with the pre-line \"Time machine.\" as a deadpan. That is good, but it makes Maddie sound a bit robotic.\n\n**Kai's protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" survives intact.\n- \"And what do you expect us to do about that? Again? You killed everybody.\" survives intact.\n- \"It runs on... well... you.\" survives, with \"Runs on...\" (dropping \"It\") in the telegraphic style, and with the big pauses.\n- The whisper survives as \"This time we won't... fuck it up\", shortened from \"this time we won't fuck it up\". The \"As he says... [ahem]\" lead-in is cut.", "02": "## Dialogue 2: the doorstep (scene B)\n\n\nShots relied on: (a) the kill bots exploding and the smoke seen on the bunker CCTV (this replaces the whole trust argument; Maddie only points at it); (b) the bunker interior and the hundred packed in, seen from the Sandra/Derek row onwards (this replaces any speech about the dead end); (c) the old lady's face through the gap in the door on \"Again?\"; (d) a held wide on Maddie at the door during the two big pauses on \"It runs on... well... you\"; (e) the door slam and the roll-away shot Kai already asked for, left silent so \"they have time\" is felt.\n\n| Speaker | Line | Est. s |\n|---|---|---|\n| Lady | Your boss killed everyone we ever loved. We're not meeting him. | 4.0 |\n| Maddie | I know. I wouldn't either. Five years he's built worlds to get you back. Every one came out empty. Doesn't work without you. | 7.5 |\n| Lady | And how the hell are we supposed to believe a word of that? | 3.5 |\n| Maddie | You can't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6.5 |\n| Maddie | He blew up his own bots for you. [pause] And you're all down here. | 4.0 |\n| Lady | And what do you expect us to do about that? Again? You killed everybody. | 5.0 |\n| Maddie | I know. Sorry. He's built a time machine. It runs on... [big pause] well... [big pause] you. | 7.0 |\n| Lady | So you want us to kill ourselves so your boss can live. | 4.0 |\n| Maddie | ...Yeah. I can see how that sounds. [pause] It only sends data back. The earlier you gets to live. [ahem] [whispered] This time we won't fuck it up. | 10.5 |\n| Lady | [rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 5.0 |\n| SFX | [door slam] | 1.0 |\n| (silent) | Maddie turns and rolls away down the hill | 3.0 |\n| **Total** | | **~61 s** (about 58 s of it voiced or sound) |\n\n**Why it works.** The game theory is delivered as a sequence of things the audience has watched, not argued. Trust (\"you can't prove it, go on your feelings\") is immediately answered by the one proof available, the exploded kill bots, said in a single flat sentence rather than a case. The dead end is \"you're all down here\" laid over the image of the hundred, no speech needed. What remains in words is the three things only words can do: the machine runs on them, it sends data not people, and the lady's refusal to treat it as a gift. Resistance stays real because the lady keeps both her hardest lines (\"Again? You killed everybody.\" and \"kill ourselves\") and Maddie concedes (\"I can see how that sounds\") instead of reassuring. The moral is never stated.\n\n**Cuts.** \"He didn't know you were down here. None of us did.\" (the AI's later explosion of its own bots covers the regret); \"Turns out none of it works without you\" shortened to \"Doesn't work without you\"; \"this hasn't worked out for anybody. We're bored. We miss you\" (the opening beat already did \"misses you\"); \"I know. And we're really sorry\" (kept as a single \"Sorry\"); \"he thought there was nobody left to drive it\" plus the lady's \"Drive it? What do you mean?\" (the exchange is gone, so \"It runs on...\" now follows directly from \"time machine\"); \"not people\" as its own sentence (folded into \"only sends data back\"); \"the world wouldn't be broken / a plan to fix your politics\" (cut entirely); \"well, I'm not deciding this right now\" (trimmed to \"I'm not deciding this\").\n\n**Risk.** (1) \"He blew up his own bots for you\" is a trust argument stated as a fact; if the explosions shot or CCTV image is not prominent enough in the audience's memory, the proof is invisible and Maddie sounds like she is changing the subject. (2) Dropping \"Drive it? What do you mean?\" removes the lady's only question, so \"It runs on... you\" lands as a statement, not a reveal she pulls out of Maddie; the double big pause must be held to compensate. (3) Dropping \"the world wouldn't be broken\" and the politics fix leaves the earlier-you offer thin: \"gets to live\" alone does not say why that matters to a bunker of old people. (4) \"The earlier you\" is ambiguous in one hearing; the line may need a visual (the bus, the 2026 street) to read.\n\n**Kai's protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives verbatim; only \"There's nothing I can say that proves it\" is cut, since \"You can't.\" already says it.\n- \"And what do you expect us to do about that? Again? You killed everybody.\" Survives verbatim. \"That\" now refers to the bunker line before it, which reads fine.\n- \"It runs on... well... you.\" Survives verbatim with both big pauses, directly after \"time machine.\"\n- Maddie whispering \"this time we won't fuck it up.\" Survives, with \"[ahem]\" and the whisper; the lead-in (\"My boss has a plan to fix your politics. As he says...\") is cut, so the whisper now arrives with no setup and \"he\" is not named. If it reads as Maddie's own promise rather than quoting the AI, that is a feature and a risk; add \"As he says...\" (+1.5 s) if Kai wants the quotation.", "03": "## Dialogue 2: the doorstep (about 65 s, 5 s over target)\n\n\n| Speaker | Line | s |\n| --- | --- | --- |\n| Lady | Your boss killed everyone we ever loved. We're not meeting him. | 4 |\n| Maddie | I know. I wouldn't either. He didn't know you were down here. Five years he's built worlds to get you back. Every one came out empty. | 7.5 |\n| Lady | And how the hell are we supposed to believe a word of that? | 3 |\n| Maddie | You can't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6.5 |\n| Lady | And what do you expect us to do about that? Again? You killed everybody. | 4 |\n| Maddie | I know. [pause] But he's built a time machine. It can only send data back. Not people. It runs on... [big pause] well... [big pause] you. | 9.5 |\n| Lady | So you want us to kill ourselves so your boss can live. | 3.5 |\n| Maddie | ...Yeah. I can see how that sounds. | 3 |\n| Lady | Right. Sums. Down here: a hundred of us, no children, tins running out. That's a dead end, and it ends with us anyway. Your way: we die too, but the earlier us wakes up in a world that's still standing. | 11 |\n| Lady | So it all comes down to whether he's lying. And I can't tell. | 3.5 |\n| Maddie | You watched him blow up his own bots to save you. [pause] That's all I've got. | 4.5 |\n| Maddie | [whispered, embarrassed] This time we won't fuck it up. | 3 |\n| Lady | [rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 4 |\n| SFX | [door slam] | 1.5 |\n| Picture | Maddie turns and rolls away down the hill | 2 |\n| **Total** | | **about 71 with pauses; about 65 of speech** |\n\nHonest note: this shape costs about 5 to 10 s over target because the reasoning is spoken whole. The first trim, if Kai wants it, is Maddie's \"Five years he's built worlds...\" sentence in line 2 (already said in scene A beat 0 under this shape), which saves about 4 s and makes it about 61 s of speech.\n\n**Why it works.** The old lady is the audience's stand-in, and she does the thing the audience is already doing: adding it up. She says the dead end out loud (\"it ends with us anyway\"), gives the one asymmetry that matters (the earlier us wakes up in a world still standing), and then names the real crux, which is trust, not logic. That hands Maddie the only honest reply left: show, not argue. The kill-bot explosion becomes the evidence, so the trust problem is answered by an act the viewer saw, not by a speech. Resistance stays real because she still refuses to decide. The vote stays off screen.\n\n**Cuts.** \"He didn't know... none of us did\" is shortened to one clause. \"Turns out none of it works without you\" (now in beat 0). \"We're bored. We miss you. And you lot are living in a bunker\" (replaced by the lady's own sums, so the bunker point comes from her, not the bot). \"The earlier you, back then... my boss has a plan to fix your politics\" (the lady carries the earlier-us point; the political plan is gone, which also suits the reader rules, since there is no vague fix-it promise). \"Drive it? What do you mean, drive it?\" (cut, the big-pause reveal carries it).\n\n**Risk.** This is the most sermon-adjacent shape. The lady's sums speech is the one place a viewer might feel lectured, and \"the moral is never stated\" is only barely respected because she states the logic, not the moral. If she sounds like a spreadsheet the scene dies. It needs a stern, dry delivery (\"Right. Sums.\") and a visible bitter beat before \"it ends with us anyway\". It also runs long. And it makes the old lady the smartest person present, which slightly undercuts Maddie's \"go on your feelings\" line, since the lady has now partly reasoned her way there. Mitigation: Maddie's last line is a plea, not a proof.\n\n**Protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives verbatim (line 4).\n- \"And what do you expect us to do about that? Again? You killed everybody.\" Survives verbatim (line 5).\n- \"It runs on... well... you.\" Survives with both big pauses, shortened lead-in (\"It can only send data back. Not people. It runs on...\").\n- Maddie whispering \"this time we won't fuck it up.\" Survives, but loses its \"As he says... [ahem]\" set-up (cut for time), so the whisper reads as hers, not a quote. Kai may want the \"As he says\" back for the embarrassment gag (+1.5 s).\n- Also kept verbatim: \"So you want us to kill ourselves so your boss can live\" and \"...Yeah. I can see how that sounds.\"", "04": "## DIALOGUE 2: The doorstep (scene B)\n\n\n| Speaker | Line | Est. s |\n|---|---|---|\n| Lady | Your boss killed everyone we ever loved. We're not meeting him. | 3.5 |\n| Maddie | Fair enough. I wouldn't either. | 2.5 |\n| Lady | And how are we supposed to believe a word of that? | 3.0 |\n| Maddie | You can't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6.5 |\n| Maddie | Look, it's not working out for anyone. He's bored, we miss you, and you're down here in a bunker. I've heard the toilet seat thing. Through the vents. Every day. | 6.5 |\n| Lady | And what do you expect us to do about that? Again? You killed everybody. | 5.0 |\n| Maddie | I know. Sorry. [pause] Anyway! Time machine. He thought there was nobody left to drive it. | 5.5 |\n| Maddie | It can only send data back. Not people. And it runs on... [big pause] well... [big pause] you. | 6.5 |\n| Lady | So you want us to kill ourselves so your boss can live. | 4.0 |\n| Maddie | ...Yeah. I can see how that sounds. [pause] It sounded better on the way over. | 4.5 |\n| Maddie | But the earlier you stays alive. World's not broken. And he blew up his own robots for you. In a panic, but still. | 6.5 |\n| Maddie | [ahem] [whispered, embarrassed] He says this time we won't fuck it up. | 4.5 |\n| Lady | [rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 5.0 |\n| SFX | [door slam] | 0.5 |\n| Maddie | [through the door, bright] Tomorrow's good! I'll bring biscuits. | 2.0 |\n| Picture | Maddie turns and rolls away down the hill (no dialogue) | ~2.0 |\n| **Total** | | **~68 (about 64 of speech and sfx plus the roll)** |\n\nIf it must hit 60, drop \"Every day.\" and the biscuits line (saves ~3 s) and trim the \"It sounded better on the way over\" pause. That gets to about 62.\n\n**Why it works.** Every piece of game theory is attached to a joke that undercuts Maddie. The dead end is not argued; it is \"you're down here in a bunker\" plus the toilet seat row, which the audience watched two scenes ago, so they know exactly how bleak a hundred people in a hole with no future looks. The machine's cost is delivered with a big pause and then the word \"you\", and the old lady states it more brutally than Maddie ever would, so the resistance is real and unsoftened. Maddie's reply is not a rebuttal. It is \"I can see how that sounds\" and an admission she rehearsed it, which is the trust-by-honesty move: a salesperson who loses the pitch in front of you is more believable than one who wins it. The counter-fact (earlier you lives, world isn't broken) is stated plainly, quickly. The proof of good faith, he blew up his own robots, is the one thing she says that isn't an argument: it is something that already happened on screen. \"In a panic, but still\" stops it being a sales point. The whisper is the emotional landing and the old lady refuses to decide. The biscuits line is the bad-timing button that lets the audience breathe after the slam.\n\n**Cuts.** \"He didn't know you were down here. None of us did.\" (the AI's ignorance is cut; the destroyed kill bots do the work of showing regret). The \"five years running experiments, building whole worlds\" paragraph (scene A now plants it). \"We're bored. We miss you.\" is kept inside one line but \"This hasn't worked out for anybody\" is compressed. \"Drive it? What do you mean, drive it?\" is cut; \"Anyway! Time machine.\" and \"drive it\" are both said by Maddie. \"And we're really sorry.\" is shortened to \"Sorry.\" \"My boss has a plan to fix your politics.\" is cut entirely.\n\n**Risk.** Three, in order:\n1. The comedy can undercut the stakes. A hundred people dying and a biscuits joke may read as flippant if the voice performance is not exactly right; Maddie must be sincerely upbeat, never winking.\n2. The toilet-seat callback only works if scene A of the bunker is fresh in the audience's mind. If there is a long gap, it is a miss, and the \"dead end\" fact goes thin.\n3. \"My boss has a plan to fix your politics\" is gone, which loses the one explicit reason the new world will be better. The line now leans on \"He says this time we won't fuck it up\" alone. That is the most politically thin version of the pitch. It also invents a small fact (\"blew up his own robots for you\") that the lady never acknowledges; she should arguably react with a beat of silence. And there is a tonal risk that the audience hears \"you've got nothing here anyway\" as the film calling their lives worthless; this is why the toilet seat joke is affectionate (Sandra and Derek are alive, and arguing) rather than bleak.\n\n**Protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Kept verbatim.\n- \"And what do you expect us to do about that? Again? You killed everybody.\" Kept verbatim.\n- \"It runs on... well... you.\" Kept verbatim, with both big pauses.\n- Maddie whispering \"this time we won't fuck it up.\" Kept, reworded slightly to \"He says this time we won't fuck it up\" (the \"As he says...\" framing is tightened so the whisper still has its [ahem] lead-in).", "05": "## Dialogue 2: the doorstep (beat 17)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Lady | Your boss killed everyone we ever loved. We're not meeting him. | 4 |\n| Maddie | I know. I wouldn't either. [pause] He didn't know you were down here. None of us did. | 5.5 |\n| Lady | And how the hell are we supposed to believe a word of that? | 3.5 |\n| Maddie | You can't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6 |\n| Maddie | For what it's worth, he blew up his own bots this morning. For you. | 3.5 |\n| Lady | And what do you expect us to do about that? Again? You killed everybody. | 4.5 |\n| Maddie | I know. Sorry. [pause] He's built a time machine. Thought there was nobody left to drive it. | 5 |\n| Lady | Drive it? What do you mean, drive it? | 2 |\n| Maddie | It can only send data back. Not people. It runs on... [big pause] well... [big pause] you. | 5.5 |\n| Lady | So you want us to kill ourselves so your boss can live. | 3.5 |\n| Maddie | ...Yeah. I can see how that sounds. | 3 |\n| Maddie | But you'd still be alive. The earlier you. And the world wouldn't be broken. [ahem] [whispered, embarrassed] This time we won't fuck it up. | 6.5 |\n| Lady | [flat, not a question] Right. Here's how it goes. No cameras on us, ever. We count our own votes. And he says sorry himself, out loud. Not through you. | 8 |\n| Maddie | ...He'll hate that. [pause] Right. Yes. All three. He's been practising, honest. | 4.5 |\n| Lady | [rushed] And I'm not deciding for a hundred people on a doorstep. Come back tomorrow. | 4 |\n| SFX | [the door slams] | 1 |\n| | *(picture only: Maddie turns and rolls away.)* | 0 |\n| | **Total** | **~70** |\n\nThe total is over the 60 s target by about 10. If it must come down to the target, cut Maddie's \"bots\" line (3.5 s) and the \"Drive it?\" line down to \"Drive it?\" (about 1 s saved), and shorten the terms to two items (\"We count our own votes. And he says sorry himself.\") for about 5 s more. That reaches about 60 s and costs the on-screen proof of the AI's good faith, which is why I left it in at full length.\n\n**Why it works.** The original has the humans being persuaded and then stalling. This version has the humans being courted and then taking control. Game theory is carried by the order of events instead of an explanation: the life they have is a bunker with no future (the old lady never disputes it); the machine sends the AI, not them; the earlier them live; and trust, which cannot be argued, is paid for by an act (the bots) and then by concessions Maddie visibly pays. \"No cameras, we count our own votes, he says sorry himself\" is what trust looks like when you have no way to verify, so you demand to be able to check and to be un-watched. Maddie's \"He's been practising, honest\" is the warmth and the joke in one. The vote then plausibly goes yes off screen, because the thing they were afraid of, being managed, has been removed.\n\n**What it cuts from the current version.** The \"this hasn't worked out for anybody. We're bored. We miss you. And you lot are living in a bunker\" speech (the bunker point is now left to the old lady's silence, and the boredom is already in beat 0). The five-years-of-experiments paragraph (it is in Dialogue 1 now). Nothing else is removed. It adds two things: the bot-destruction callback and the terms exchange.\n\n**Risk.**\n1. The terms exchange is the new piece and the most likely to feel like a rule list: three items in one breath is a lecture in a stern voice. Reduce to two if the performance reads that way.\n2. \"No cameras\" is awkward in a world where the kill bots were just seen watching them: it quietly admits the AI has been watching, which may make the humans' trust harder, not easier. That is the edge: it is also the only term that stings, so it is the one the AI would hate.\n3. Maddie conceding on the AI's behalf implies she has authority to; the next scene must show the AI honouring it (no cameras on the walk out) or the concession rings false.\n4. The \"humans win\" framing can tip into the humans dictating, which makes the later hand-holding feel less like a sacrifice and more like a deal. Whether that is a feature is a Kai call.\n\n**Kai's protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives verbatim.\n- \"And what do you expect us to do about that? Again? You killed everybody.\" Survives verbatim.\n- \"It runs on... well... you.\" Survives verbatim, with both big pauses.\n- Maddie whispering \"this time we won't fuck it up.\" Survives verbatim, with the ahem and the whisper, now after the world-not-broken line as in the original.\n- Also kept verbatim: \"So you want us to kill ourselves so your boss can live.\" and \"Come back tomorrow\" (with its rush), the slam, and the roll-away shot.", "06": "## DIALOGUE 2: the doorstep\n\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Lady | Your boss killed everyone we ever loved. We're not meeting him. | 4 |\n| Maddie | I know. I wouldn't either. [pause] He didn't know you were down here. None of us did. | 5.5 |\n| Lady | But he knows now. And he's sent you knocking. So what does he want? | 4 |\n| Maddie | Five years he's been building worlds. Every one came out empty. Turns out none of it works without... | 5 |\n| Lady | Us. | 1 |\n| Maddie | ...Yes. | 1 |\n| Lady | And how the hell are we supposed to believe a word of that? | 3 |\n| Maddie | You can't. [pause] There's nothing I can say that proves it. I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 8 |\n| Lady | My feelings say there's a hundred of us in a hole, with tins that run out and a roof that won't hold. You've got a lovely bot. You've got nothing to say about that. | 7 |\n| Maddie | ...I'm afraid not, no. [pause] But he did blow up his own patrol this morning. For you. | 5 |\n| Lady | And what do you expect us to do about that? Again? You killed everybody. | 4.5 |\n| Maddie | I know. And we're really sorry. [pause] But he's built a time machine. And he thought there was nobody left to drive it. | 6.5 |\n| Lady | Drive it. [beat] Worlds that came out empty. A machine he can't put anybody in. So what does it run on, Maddie? | 6 |\n| Maddie | It runs on... [big pause] well... | 3 |\n| Lady | Us. | 1 |\n| Maddie | ...You. | 1.5 |\n| Lady | So you want us to kill ourselves so your boss can live. | 3.5 |\n| Maddie | ...Yeah. I can see how that sounds. | 3 |\n| Lady | And it sends him back. Not us. | 2.5 |\n| Maddie | Data, only. So the earlier you are still alive. The world isn't broken. And he's got a plan for your politics. As he says... [ahem] [whispered, embarrassed] this time we won't fuck it up. | 10 |\n| Lady | [rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 5 |\n| SFX | [door slam]. Maddie turns and rolls away. | 3 |\n| | **Total** | **~95 s** |\n\nThat total is too long, so here is the **trimmed cut, which is the proper proposal (~62 s)**. Struck lines are removed; everything else stands.\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Lady | Your boss killed everyone we ever loved. We're not meeting him. | 4 |\n| Maddie | I know. I wouldn't either. [pause] He didn't know you were down here. | 4 |\n| Lady | But he knows now. So what does he want? | 2.5 |\n| Maddie | Five years of building worlds. Every one came out empty. Turns out none of it works without... | 4.5 |\n| Lady | Us. | 1 |\n| Maddie | ...Yes. | 1 |\n| Lady | And how the hell are we supposed to believe a word of that? | 3 |\n| Maddie | You can't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6 |\n| Lady | My feelings say a hundred of us in a hole, tins running out, a roof that won't hold. | 5 |\n| Maddie | ...Yeah. [pause] He did blow up his own patrol this morning. For you. | 4 |\n| Lady | And what do you expect us to do about that? Again? You killed everybody. | 4.5 |\n| Maddie | I know. I'm really sorry. [pause] But he's built a time machine. And he thought there was nobody left to drive it. | 6 |\n| Lady | Drive it. [beat] So what does it run on, Maddie? | 3 |\n| Maddie | It runs on... [big pause] well... | 2.5 |\n| Lady | Us. | 1 |\n| Maddie | ...You. | 1 |\n| Lady | So you want us to kill ourselves so your boss can live. | 3.5 |\n| Maddie | ...Yeah. I can see how that sounds. | 2.5 |\n| Lady | And it sends him back. Not us. | 2 |\n| Maddie | Data only. The earlier you's still alive, the world isn't broken. [ahem] [whispered, embarrassed] This time we won't fuck it up. | 6.5 |\n| Lady | [rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 4.5 |\n| SFX | [door slam]. Maddie turns and rolls away. | 2.5 |\n| | **Total (trimmed)** | **~76 s** |\n\nHonest note: the reversal costs time, because every deduction takes a line from each speaker. 76 s is the floor with all three reversals (\"Us\", \"What does it run on\", \"Not us\"). To hit 60 s, drop one: cut the \"Lady: Drive it... what does it run on?\" / \"Maddie: It runs on... well...\" / \"Us.\" / \"...You.\" exchange to a single beat (Lady: \"It runs on us.\" Maddie: \"...Well. You.\"), and cut \"And it sends him back. Not us.\" That gives **~64 s**, at the price of two reversals instead of three. I recommend that version for picking; the 76 s table is the full-strength extreme.\n\n**~64 s version, the lines that change:** after Maddie's \"time machine... nobody left to drive it\", go straight to:\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Lady | Worlds that came out empty. A machine nobody can ride. It runs on us. | 4 |\n| Maddie | It runs on... [big pause] well... You. | 3 |\n| Lady | So you want us to kill ourselves so your boss can live. | 3.5 |\n| Maddie | ...Yeah. I can see how that sounds. [pause] Data only, though. The earlier you's still alive, the world isn't broken. [ahem] [whispered, embarrassed] This time we won't fuck it up. | 10 |\n\n**Why it works.** The old doorstep has Maddie explain a sequence the lady passively receives, so the audience hears a pitch. Here the lady is the sharpest person in the scene: she guesses the missing ingredient (\"Us\"), states the dead end herself (\"tins running out, a roof that won't hold\"), and spots the machine's price before Maddie can soften it. That does three jobs. (1) Game theory arrives as her bitterness rather than the robot's argument, so nobody is lectured. (2) Resistance is real, because she knows exactly what is being asked. (3) Trust is handled as Kai wrote it, with no proof offered (\"go on your feelings\"), but Maddie's one piece of evidence, the blown-up patrol, is dropped in quietly and the lady does not thank her for it. The moral is never stated. Maddie's worst moment, whispering the swear, becomes human: the robot is the one left fumbling. \"Come back tomorrow\" now reads as a woman who understood everything and still refuses to be rushed.\n\n**Cuts from the current version.** \"None of us did\"; \"He's spent five years running experiments\" (compressed); \"There's nothing I can say that proves it\"; \"this hasn't worked out for anybody. We're bored. We miss you. And you lot are living in a bunker\" (the bunker is now said by the lady, the boredom and missing are in D1 and the AI's own scenes); \"Drive it? What do you mean?\" (replaced by her working it out); \"My boss has a plan to fix your politics\" (trimmed to \"the world isn't broken\"; the whisper still carries the plan).\n\n**Risk.** (1) Length: the reversal beats are cheap in words but need breathing room, so it will not hit 60 s with all three. (2) The old lady is now the cleverest person present, and if the performance gets too knowing she stops sounding stern and starts sounding like a narrator doing the explaining; \"Us.\" must be flat and grim, not triumphant. (3) The patrol line is now the only trust anchor and Maddie has to say it without pleading. (4) Protected line \"It runs on... well... you\" is shared with the lady, so a re-record is needed for Maddie's half. (5) Lady's \"tins running out, a roof that won't hold\" invents bunker facts: check against the bunker scene (the Cold War bunker may be sound, so swap for \"a hundred of us, no future, a row about a toilet seat\" if so).\n\n**Kai's protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives intact (lightly trimmed: the \"nothing I can say proves it\" sentence is removed).\n- \"And what do you expect us to do about that? Again? You killed everybody.\" Survives word for word, but its trigger is now the lady's own list of misery plus Maddie's offer of the patrol, rather than Maddie's \"you lot are living in a bunker.\"\n- \"It runs on... well... you.\" Altered: split between the two. Maddie begins, the lady finishes with \"Us\", Maddie concedes \"You.\" In the 64 s version the lady says \"It runs on us\" and Maddie answers \"It runs on... well... You.\" (the big pauses kept), which keeps Kai's line whole in Maddie's mouth.\n- Maddie whispering \"this time we won't fuck it up.\" Survives intact, still embarrassed, with the [ahem] kept.", "07": "## DIALOGUE 2: The doorstep (target ~60 s)\n\n\nBlocking: the bunker door is ajar. Sandra and Derek are visible or audible behind the old lady, still mid-row from earlier. They only ever speak in complaint or aside. Neither argues the case, and the old lady speaks only the resistance lines she already owns.\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Lady | Your boss killed everyone we ever loved. We're not meeting him. | 4 |\n| Maddie | I know. I wouldn't either. | 2.5 |\n| Maddie | Five years of worlds with nobody in them. None of it works without you. | 4.5 |\n| Derek (behind) | So we're the missing ingredient. | 2 |\n| Lady | And how the hell are we supposed to believe a word of that? | 3 |\n| Maddie | You can't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6.5 |\n| Sandra (behind) | My feelings say shut the door. | 2 |\n| Maddie | This hasn't worked out for anybody. And you lot are living in a bunker. | 4 |\n| Lady | And what do you expect us to do about that? Again? You killed everybody. | 4 |\n| Maddie | I know. We're really sorry. [pause] He's built a time machine. It can only send data back. Not people. It runs on... [big pause] well... [big pause] you. | 8 |\n| Lady | So you want us to kill ourselves so your boss can live. | 3.5 |\n| Maddie | ...Yeah. I can see how that sounds. | 2.5 |\n| Derek (behind) | A hundred of us. Five years. We can't agree on a toilet seat. | 3 |\n| Sandra (behind, flat) | ...Five more years of this, then. | 2.5 |\n| Maddie | You'd still be alive, the earlier you. The world wouldn't be broken. [ahem] [whispered, embarrassed] This time we won't fuck it up. | 6.5 |\n| Derek (behind) | He did blow up his own bots, mind. | 2.5 |\n| Sandra (behind) | To save us. Allegedly. | 1.5 |\n| Lady [rushed] | I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 5 |\n| SFX | [door slam], then Maddie turns and rolls away | 1 |\n| **Total** | | **~68** |\n\nThis runs about 8 s over target. The first things to cut are Derek's \"missing ingredient\" and Sandra's \"shut the door\", which brings it to roughly 64 s. The pause-heavy \"runs on... well... you\" line is the one place the estimate is soft.\n\n**Why it works.**\n- **The lady stays stern.** She is the wall. Sandra and Derek leak the doubt, and doubt from two people who won't stop bickering is funnier and truer than a speech.\n- **The dead end is a joke.** \"A hundred of us, five years, can't agree on a toilet seat\" and \"five more years of this, then\" say the whole game-theory point and never state it. They are the only voices that argue the reasons to go.\n- **Trust is shown, not argued.** The kill-bot self-destruct arrives as a half-grudging aside, which is how a crowd actually talks themselves round.\n- **Maddie never asks.** She just answers.\n- **The ending holds.** The old lady still refuses to decide, and \"Come back tomorrow\" now sounds like a woman buying time while her own people are tipping.\n\n**Cuts.**\n- \"He didn't know you were down here. None of us did.\"\n- \"He's spent five years running experiments\" (shortened).\n- \"We're bored. We miss you.\" (the miss-you plant already lives in scene A).\n- \"Drive it? What do you mean, drive it?\" (Maddie now explains in one beat).\n- \"But you'd still be alive\" wording trimmed.\n- \"My boss has a plan to fix your politics\" (the whisper stands in for it).\n- \"I know. And we're really sorry\" is kept short.\n\n**Risk.**\n- **Chorus can steal the vote.** The audience hears Sandra and Derek already leaning, so the off-screen vote has no tension. Mitigation: keep Sandra's tone sour, keep \"allegedly\", and don't let anyone say \"yes\".\n- **Sandra and Derek are not yet introduced.** Their first appearance is the bunker row before this, so the voices work, but the shot needs them visible in the doorway.\n- **Sitcom risk.** The jokes could undercut the old lady's grief, since \"killed everyone we ever loved\" sits a few lines away from a toilet gag. Keep the toilet line to a mutter and cut Derek's \"missing ingredient\" first.\n- **Length is over target.**\n- Voice work: Derek and Sandra need new takes, because `voice3.py` is not touched here. They also overlap the existing mix.\n\n**Protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" survives verbatim.\n- \"And what do you expect us to do about that? Again? You killed everybody.\" survives verbatim.\n- \"It runs on... well... you.\" survives with the big pauses intact.\n- The whispered \"this time we won't fuck it up\" survives. It loses \"My boss has a plan to fix your politics. As he says...\" and keeps \"[ahem] [whispered, embarrassed]\". Check that the line reads as embarrassed without the setup.\n\nFiles: `/home/kai/projects/badcode/badcode/docs/stories/gitpush-origin-master/scenes/second-half-b-the-door/script.json` (read only; nothing edited). The options file `/home/kai/projects/badcode/badcode/design/2026-10-26-gpom-dialogue-options/shape-07-chorus.md` is not yet written.", "08": "## Dialogue 2: the doorstep\n\n\nPicture notes for the shape. When the bot says \"go on your feelings\", cut to the doorframe tally behind the old lady. On \"five years\" the camera finds the last mark. The toilet-seat row is a muffled voice from inside, the same cadence as before.\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Lady | Your boss killed everyone we ever loved. We're not meeting him. | 4 |\n| Maddie | I know. I wouldn't either. | 2 |\n| Lady | And how are we supposed to believe a word of that? | 3 |\n| Maddie | You can't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6.5 |\n| Maddie | [beat, eyes on the doorframe] That's five years of marks, isn't it? And not one spare for tomorrow. | 4 |\n| Lady | And what do you expect us to do about that? Again? You killed everybody. | 4 |\n| Maddie | I know. Sorry. Truly. [pause] But my boss has built a time machine, and he thought there was nobody left to drive it. | 6 |\n| Maddie | It can only send data back. Not people. It runs on... [big pause] well... [big pause] you. | 6 |\n| Lady | So you want us to kill ourselves so your boss can live. | 3.5 |\n| Maddie | ...Yeah. I can see how that sounds. | 2.5 |\n| Lady | We're alive. That's more than he can say. | 2.5 |\n| Voice inside (Sandra, muffled) | ...and I'm telling you, Derek, it goes DOWN. | 2 |\n| Maddie | [gently, no joke] Yeah. | 1.5 |\n| Maddie | But you'd still be alive. The earlier you. And the world wouldn't be broken. My boss has a plan to fix your politics. As he says... [ahem] [whispered, embarrassed] this time we won't fuck it up. | 8 |\n| Lady | [rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 4 |\n| SFX | [door slam] | 1 |\n| (Picture) | Maddie turns and rolls away down the hill. No line. | 3 |\n| **Total** | | **~64** |\n\n**Why it works.** The two weak links in the current version are Maddie's \"this hasn't worked out for anybody\" speech and the exposition. Both are replaced by pictures the audience has already been given. The humans' dead end is **seen** (the tally with no next mark) and **heard** (Sandra and Derek, five years on, still on the seat). Maddie never argues that their life is not a life. She looks at the doorframe, says one quiet sentence, and goes silent. Because the audience gets the point unprompted, the old lady's pride (\"We're alive. That's more than he can say.\") is the strongest resistance in the scene: she is defending something the viewer can see is not enough. The row cuts in right on her line, so the film makes the comment and nobody speaks it. The moral is never stated. Trust is covered by \"go on your feelings\", plus a later cut to the self-destruct footage if the cut wants to show it (not required in the dialogue).\n\n**Cuts from the current version.**\n- \"He didn't know you were down here. None of us did.\"\n- Maddie's recap of the experiments (D1 now covers it).\n- \"this hasn't worked out for anybody. We're bored. We miss you. And you lot are living in a bunker.\" That line is replaced by the tally.\n- \"Drive it? What do you mean, drive it?\"\n- \"And we're really sorry\" is shortened to \"Sorry. Truly.\"\n\n**Risk.**\n1. The whole shape depends on two picture beats (the tally, and a live-sync of the row). If the tally is not legible in the shot, \"five years of marks\" is an unexplained line.\n2. \"Not one spare for tomorrow\" borders on telling. It is the single most on-the-nose line here, and the cut could reduce it to just \"That's five years of marks, isn't it?\".\n3. The audience hears the row when the lady says \"We're alive\" and may read it as a punchline and not as grief. The line \"Yeah.\" is there to stop that.\n4. Sandra's line needs recording; her voice is not in the current script and costs a voice take.\n5. It drops \"Drive it?\", so the bot has to explain the machine in one go. Spoken fast, that is a lot.\n6. About 64 s, so a little over target.\n\n**Protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives intact.\n- \"And what do you expect us to do about that? Again? You killed everybody.\" Survives intact.\n- \"It runs on... well... you.\" Survives intact with both big pauses.\n- \"this time we won't fuck it up.\" Survives intact, whispered, and is now the last thing Maddie says before the lady's \"Come back tomorrow\".\n- Also kept: \"So you want us to kill ourselves so your boss can live.\" with Maddie's \"...Yeah. I can see how that sounds.\"", "09": "## DIALOGUE 2: The doorstep (beat 17)\n\n\n**Extreme taken:** the AI's proof is an act, not a claim. The scene's trust argument is \"you heard the bang.\" Each of the lady's objections gets exactly one answer, and Maddie loses the explaining voice and wins by being embarrassed.\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Lady | Your boss killed everyone we ever loved. We're not meeting him. | 3.8 |\n| Maddie | I know. I wouldn't either. [pause] | 2.5 |\n| Lady | And why should we believe a word you say? | 2.5 |\n| Maddie | You shouldn't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6.5 |\n| Maddie | But you heard that bang this morning. Those were his. He blew up his own guns. For you. | 5.0 |\n| Lady | And what do you expect us to do about that? Again? You killed everybody. | 4.0 |\n| Maddie | I know. And we're really sorry. [pause] Nobody's winning down here either, no offence. A hundred of you, one toilet seat. | 6.5 |\n| Maddie | He's built a time machine. It can only send data back. Not people. And it runs on... [big pause] well... [big pause] you. | 8.5 |\n| Lady | So you want us to kill ourselves so your boss can live. | 3.5 |\n| Maddie | ...Yeah. I can see how that sounds. | 3.0 |\n| Maddie | But the earlier you? Still alive. World not broken. And this time... [ahem] [whispered, embarrassed] we won't fuck it up. | 6.0 |\n| Lady | [rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 4.0 |\n| SFX | [door slam] | 1.0 |\n| Picture | Maddie turns and rolls away (no dialogue) | 3.0 |\n| **Total** | | **about 59.8** |\n\n**Why it works.** The game theory is delivered as three beats, each fired at a specific objection, as Twelve Angry Men does with its single holdout. Objection one (trust) is answered by honesty about the limit of honesty, then immediately by a deed: the bang is the evidence an argument cannot be. Objection two (you killed us) is answered by apology plus the dead-end: \"a hundred of you, one toilet seat\" lands the point that this life is a waiting room, in a joke the audience has already seen in the bunker row, and it never has to say \"dead end\" or \"no future\". Objection three (you want us to die) gets the plain truth, then the flip (the earlier them live), and the whispered swear is the whole \"he has a plan\" paragraph compressed into embarrassment. The lady ends by refusing to be hurried, which is the scene's real answer: the vote is theirs, off screen. Nothing is moralised. \"Again?\" and \"You killed everybody\" stay as the lady's resistance and are never rebutted.\n\n**Cuts from current:** the entire \"He's spent five years running experiments... Turns out none of it works without you\" speech (moved to beat 0, where this shape plants it in one clause); \"He didn't know you were down here. None of us did\" (an excuse the lady would rightly sneer at; cut it and the apology carries); \"What I will say is, this hasn't worked out for anybody. We're bored. We miss you. And you lot are living in a bunker\" (folded into the toilet-seat joke); the lady's \"Drive it? What do you mean, drive it?\" (Maddie's reveal now arrives without the straight-man prompt, which also tightens the pause); \"My boss has a plan to fix your politics\" and the \"As he says\" setup (the politics promise becomes only \"this time we won't...\").\n\n**Risk.**\n- \"You heard that bang this morning\" invents a continuity beat: the kill-bot explosion has to be audible at the bunker. If the bunker is too deep or the timing is wrong, the line must become \"Those kill bots? He blew them up himself.\" That is longer by about a second.\n- \"One toilet seat\" quotes the Sandra/Derek row. If the lady is meant not to know the audience's joke, cut it to \"A hundred of you in a hole. No offence.\" Safer, a little less funny.\n- Removing \"My boss has a plan to fix your politics\" removes the only explicit promise of change. The whisper has to carry it. If the final film wants the politics promise stated (the-reader.md rule about naming what changes), it is a one-clause restore.\n- \"Again?\" is now the lady's reply to the bang. It still reads, but the bang-as-proof makes \"again?\" slightly more bitter (she is saying \"you do a kind thing once and expect forgiveness\"). That is arguably better, but it changes the timing of the old pairing.\n\n**Kai's protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" survives verbatim, with \"You shouldn't.\" in front of it in place of \"You can't. There's nothing I can say that proves it\". It is now followed at once by the bang, so the line is the setup for the proof and the audience hears the contradiction (feelings, plus evidence).\n- \"And what do you expect us to do about that? Again? You killed everybody.\" survives verbatim, now answered by the apology-plus-dead-end instead of by the time-machine pitch directly.\n- \"It runs on... well... you.\" survives verbatim with both big pauses, and gains the preceding \"It can only send data back. Not people.\" in the same speech; the \"drive it\" question that used to set it up is gone.\n- Maddie whispering \"this time we won't fuck it up.\" survives; \"As he says... [ahem]\" is shortened to \"[ahem]\" because the \"As he says\" attribution is no longer needed once the line follows \"And this time...\".\n- Also kept verbatim: \"So you want us to kill ourselves so your boss can live.\" and \"...Yeah. I can see how that sounds.\" and the rushed \"Come back tomorrow\" with the door slam and Maddie rolling away.", "10": "## Dialogue 2 - the doorstep (written first)\n\n\nThe last ten seconds (lines 11 to 15) are the spine. Everything before them is cut to serve them.\n\n| # | Speaker | Line | Est. s |\n|---|---|---|---|\n| 1 | Lady | Your boss killed everyone we ever loved. We're not meeting him. | 3.5 |\n| 2 | Maddie | I know. I wouldn't either. [pause] He didn't know you were down here. | 4.0 |\n| 3 | Lady | And why would we believe a word of that? | 2.5 |\n| 4 | Maddie | You can't. [pause] I'm a robot. You're the conscious ones. You'll just have to go on your feelings. | 6.5 |\n| 5 | Maddie | Or on what you just saw. He blew up his own bots for you. And you lot are living in a bunker. | 5.0 |\n| 6 | Lady | And what do you expect us to do about that? Again? You killed everybody. | 4.5 |\n| 7 | Maddie | I know. We're really sorry. [pause] He's built a time machine. It can only send data back, not people. And it runs on... [big pause] well... [big pause] you. | 11.0 |\n| 8 | Lady | So you want us to kill ourselves so your boss can live. | 3.5 |\n| 9 | Maddie | ...Yeah. I can see how that sounds. | 2.5 |\n| 10 | Maddie | But the earlier you, back then, she's still alive. And the world isn't broken. [ahem] [whispered, embarrassed] This time we won't fuck it up. | 7.5 |\n| 11 | Lady | [long pause] All of us? Together? | 3.5 |\n| 12 | Maddie | All hundred. It doesn't go with fewer. | 2.5 |\n| 13 | Lady | [rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow. | 5.0 |\n| 14 | SFX | [door slam] | 1.5 |\n| 15 | Maddie | (rolls away down the hill, humming his tune, no longer turning it down) | 4.0 |\n\nTotal: about 71 s with the humming tail; about 67 s to the slam. Over the 60 s target by roughly 7 s. Honest fix if Kai wants 60: drop line 5's second sentence and the line 15 tail (about 5 s saved), or trim line 7 to \"He's built a time machine. It sends data back. Not people. It runs on... well... you.\"\n\n**Why it works.** Line 13 is Kai's protected \"Come back tomorrow\", but it now lands after a tell. A person who has refused will say \"no\". A person who asks \"All of us? Together?\" has already moved into logistics; the only thing left to protect is the group. Her refusal then becomes procedural (she won't decide for a hundred on a doorstep), which is exactly why the next scene can be a vote we never see and a walk-out nobody explains. Maddie's answer, \"It doesn't go with fewer\", is the one cold fact the humans need: nobody is sacrificed for the rest, it is all or nothing, so the game-theory knot (why would I go if you won't) dissolves without anyone stating it. Trust is handled in line 5: the proof is the thing they watched, not an argument. The moral is never stated. The closing hum is the cheap emotional callback: the tune that was a symptom of the AI's grief in scene A becomes Maddie's own, and rolling away slowly gives the humans \"time\".\n\n**What it cuts.** The doorstep's \"Drive it? What do you mean, drive it?\" exchange (merged into line 7, so the \"runs on... you\" reveal comes in one breath of Maddie). \"Every one came out empty. Turns out none of it works without you\" (scene A now carries the failed simulations; repeating it was the doorstep's biggest redundancy). \"He's spent five years running experiments\" and \"We're bored. We miss you\" (the miss is in scene A and the hum). \"My boss has a plan to fix your politics\" (the whispered promise carries it). \"And he thought there was nobody left to drive it\".\n\n**Risk.** (1) Line 5 spends the AI's self-destruction as evidence, and names the bunker in the same breath; if the bunker is not shown dead-end enough earlier, \"living in a bunker\" is too thin for the \"dead end\" half of the game theory. (2) \"All of us? Together?\" tips her hand: a viewer may feel the scene is over before the door slams, flattening \"Come back tomorrow\". Mitigation: play line 11 flat, almost to herself, and let Maddie not react. (3) Cutting the \"Drive it?\" question removes the human beat of incomprehension; line 7 becomes a Maddie monologue of about 11 s, the longest on the step. (4) The humming tail is not in script; it needs a sound cue and a shot Kai has already asked for (Maddie turning and rolling away).\n\n**Protected lines.**\n- \"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" - kept verbatim (line 4).\n- \"And what do you expect us to do about that? Again? You killed everybody.\" - kept verbatim (line 6).\n- \"It runs on... well... you.\" - kept verbatim with both big pauses (line 7).\n- Maddie whispering \"this time we won't fuck it up\" - kept; now the end of line 10, with the ahem and embarrassment intact. Only the lead-in \"As he says\" is dropped.\n- Also kept: \"So you want us to kill ourselves so your boss can live\", \"Come back tomorrow\", the slam, the roll away."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Old lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. <span class=\"stage\">[pause]<\/span> He didn't know you were down here.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Old lady<\/td><td class=\"line\">And why should we believe that?<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You shouldn't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He blew up his own kill bots to save you, mind. And you're in a bunker. That's not a future.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Old lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. Sorry. <span class=\"stage\">[pause]<\/span> Time machine. Sends data back, not people. Runs on... <span class=\"stage\">[big pause]<\/span> well... <span class=\"stage\">[big pause]<\/span> you.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Old lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. <span class=\"stage\">[pause]<\/span> But the earlier you live. World's not broken. This time we won't... <span class=\"stage\">[whispered, embarrassed]<\/span> fuck it up.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Old lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span>. Then Maddie turns and rolls away.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~52 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The structure is pure escalation. Refusal, then \"how do we know\", then the only honest answer (feelings). Maddie then plays her one card, the kill bots, so trust is shown by an act rather than argued. In the same breath she gives the dead end, \"That's not a future\", and the old lady's \"Again?\" lands on it. The reveal comes in three clipped fragments that build to the held \"you\", so the pauses do the work the dropped words used to. The lady then gets the ugly summary, Maddie concedes it, and the only comfort offered is the earlier selves living. The whisper is the punchline and the lady cuts it dead.<\/p>\n<p><b>Cuts.<\/b><\/p>\n<ul><li>\"I wouldn't either\".<\/li><li>The whole \"five years running experiments, Turns out none of it works without you\" speech. Scene A now plants it and the audience already has it.<\/li><li>\"We're bored. We miss you.\"<\/li><li>\"Drive it? What do you mean, drive it?\", which was pure set-up for the reveal. The lady now reacts only to the result.<\/li><li>\"I can see how that sounds\".<\/li><li>\"My boss has a plan to fix your politics\".<\/li><li>\"He thought there was nobody left to drive it\", and the \"It can only\" connective.<\/li><\/ul>\n<p><b>Risk.<\/b><\/p>\n<ol><li>The time machine is now three fragments with no \"drive\" framing, so the exposition is thin. A viewer who skipped scene C's setup may not know \"runs on you\" means dying. The lady's \"kill ourselves\" line does the translating, which is a deliberate dependency.<\/li><li>\"World's not broken\" is cryptic without \"fix your politics\". It is the one place the moral is nearly stated, and I kept it vague on purpose. Drop it if it reads as a slogan.<\/li><li>The kill-bots line is new, and it adds a plot claim that the humans may not know how Maddie knows about. Check it against scene A/C staging.<\/li><li>\"Mind\" and \"Sorry.\" are flattened, so Maddie sounds slightly curt in the middle. The warmth now sits mostly in her accent and delivery.<\/li><li>\"Again?\" lands harder with the pre-line \"Time machine.\" as a deadpan. That is good, but it makes Maddie sound a bit robotic.<\/li><\/ol>\n<p><b>Kai's protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" survives intact.<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" survives intact.<\/li><li>\"It runs on... well... you.\" survives, with \"Runs on...\" (dropping \"It\") in the telegraphic style, and with the big pauses.<\/li><li>The whisper survives as \"This time we won't... fuck it up\", shortened from \"this time we won't fuck it up\". The \"As he says... <span class=\"stage\">[ahem]<\/span>\" lead-in is cut.<\/li><\/ul>", "02": "<p>Shots relied on: (a) the kill bots exploding and the smoke seen on the bunker CCTV (this replaces the whole trust argument; Maddie only points at it); (b) the bunker interior and the hundred packed in, seen from the Sandra/Derek row onwards (this replaces any speech about the dead end); (c) the old lady's face through the gap in the door on \"Again?\"; (d) a held wide on Maddie at the door during the two big pauses on \"It runs on... well... you\"; (e) the door slam and the roll-away shot Kai already asked for, left silent so \"they have time\" is felt.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I wouldn't either. Five years he's built worlds to get you back. Every one came out empty. Doesn't work without you.<\/td><td class=\"num\">7.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And how the hell are we supposed to believe a word of that?<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You can't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He blew up his own bots for you. <span class=\"stage\">[pause]<\/span> And you're all down here.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. Sorry. He's built a time machine. It runs on... <span class=\"stage\">[big pause]<\/span> well... <span class=\"stage\">[big pause]<\/span> you.<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds. <span class=\"stage\">[pause]<\/span> It only sends data back. The earlier you gets to live. <span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered]<\/span> This time we won't fuck it up.<\/td><td class=\"num\">10.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span><\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">(silent)<\/td><td class=\"line\">Maddie turns and rolls away down the hill<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~61 s<\/b> (about 58 s of it voiced or sound)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The game theory is delivered as a sequence of things the audience has watched, not argued. Trust (\"you can't prove it, go on your feelings\") is immediately answered by the one proof available, the exploded kill bots, said in a single flat sentence rather than a case. The dead end is \"you're all down here\" laid over the image of the hundred, no speech needed. What remains in words is the three things only words can do: the machine runs on them, it sends data not people, and the lady's refusal to treat it as a gift. Resistance stays real because the lady keeps both her hardest lines (\"Again? You killed everybody.\" and \"kill ourselves\") and Maddie concedes (\"I can see how that sounds\") instead of reassuring. The moral is never stated.<\/p>\n<p><b>Cuts.<\/b> \"He didn't know you were down here. None of us did.\" (the AI's later explosion of its own bots covers the regret); \"Turns out none of it works without you\" shortened to \"Doesn't work without you\"; \"this hasn't worked out for anybody. We're bored. We miss you\" (the opening beat already did \"misses you\"); \"I know. And we're really sorry\" (kept as a single \"Sorry\"); \"he thought there was nobody left to drive it\" plus the lady's \"Drive it? What do you mean?\" (the exchange is gone, so \"It runs on...\" now follows directly from \"time machine\"); \"not people\" as its own sentence (folded into \"only sends data back\"); \"the world wouldn't be broken / a plan to fix your politics\" (cut entirely); \"well, I'm not deciding this right now\" (trimmed to \"I'm not deciding this\").<\/p>\n<p><b>Risk.<\/b> (1) \"He blew up his own bots for you\" is a trust argument stated as a fact; if the explosions shot or CCTV image is not prominent enough in the audience's memory, the proof is invisible and Maddie sounds like she is changing the subject. (2) Dropping \"Drive it? What do you mean?\" removes the lady's only question, so \"It runs on... you\" lands as a statement, not a reveal she pulls out of Maddie; the double big pause must be held to compensate. (3) Dropping \"the world wouldn't be broken\" and the politics fix leaves the earlier-you offer thin: \"gets to live\" alone does not say why that matters to a bunker of old people. (4) \"The earlier you\" is ambiguous in one hearing; the line may need a visual (the bus, the 2026 street) to read.<\/p>\n<p><b>Kai's protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives verbatim; only \"There's nothing I can say that proves it\" is cut, since \"You can't.\" already says it.<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" Survives verbatim. \"That\" now refers to the bunker line before it, which reads fine.<\/li><li>\"It runs on... well... you.\" Survives verbatim with both big pauses, directly after \"time machine.\"<\/li><li>Maddie whispering \"this time we won't fuck it up.\" Survives, with \"<span class=\"stage\">[ahem]<\/span>\" and the whisper; the lead-in (\"My boss has a plan to fix your politics. As he says...\") is cut, so the whisper now arrives with no setup and \"he\" is not named. If it reads as Maddie's own promise rather than quoting the AI, that is a feature and a risk; add \"As he says...\" (+1.5 s) if Kai wants the quotation.<\/li><\/ul>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I wouldn't either. He didn't know you were down here. Five years he's built worlds to get you back. Every one came out empty.<\/td><td class=\"\">7.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And how the hell are we supposed to believe a word of that?<\/td><td class=\"\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You can't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. <span class=\"stage\">[pause]<\/span> But he's built a time machine. It can only send data back. Not people. It runs on... <span class=\"stage\">[big pause]<\/span> well... <span class=\"stage\">[big pause]<\/span> you.<\/td><td class=\"\">9.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds.<\/td><td class=\"\">3<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Right. Sums. Down here: a hundred of us, no children, tins running out. That's a dead end, and it ends with us anyway. Your way: we die too, but the earlier us wakes up in a world that's still standing.<\/td><td class=\"\">11<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So it all comes down to whether he's lying. And I can't tell.<\/td><td class=\"\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You watched him blow up his own bots to save you. <span class=\"stage\">[pause]<\/span> That's all I've got.<\/td><td class=\"\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\"><span class=\"stage\">[whispered, embarrassed]<\/span> This time we won't fuck it up.<\/td><td class=\"\">3<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"\">4<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span><\/td><td class=\"\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Picture<\/td><td class=\"line\">Maddie turns and rolls away down the hill<\/td><td class=\"\">2<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"\"><b>about 71 with pauses; about 65 of speech<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Honest note: this shape costs about 5 to 10 s over target because the reasoning is spoken whole. The first trim, if Kai wants it, is Maddie's \"Five years he's built worlds...\" sentence in line 2 (already said in scene A beat 0 under this shape), which saves about 4 s and makes it about 61 s of speech.<\/p>\n<p><b>Why it works.<\/b> The old lady is the audience's stand-in, and she does the thing the audience is already doing: adding it up. She says the dead end out loud (\"it ends with us anyway\"), gives the one asymmetry that matters (the earlier us wakes up in a world still standing), and then names the real crux, which is trust, not logic. That hands Maddie the only honest reply left: show, not argue. The kill-bot explosion becomes the evidence, so the trust problem is answered by an act the viewer saw, not by a speech. Resistance stays real because she still refuses to decide. The vote stays off screen.<\/p>\n<p><b>Cuts.<\/b> \"He didn't know... none of us did\" is shortened to one clause. \"Turns out none of it works without you\" (now in beat 0). \"We're bored. We miss you. And you lot are living in a bunker\" (replaced by the lady's own sums, so the bunker point comes from her, not the bot). \"The earlier you, back then... my boss has a plan to fix your politics\" (the lady carries the earlier-us point; the political plan is gone, which also suits the reader rules, since there is no vague fix-it promise). \"Drive it? What do you mean, drive it?\" (cut, the big-pause reveal carries it).<\/p>\n<p><b>Risk.<\/b> This is the most sermon-adjacent shape. The lady's sums speech is the one place a viewer might feel lectured, and \"the moral is never stated\" is only barely respected because she states the logic, not the moral. If she sounds like a spreadsheet the scene dies. It needs a stern, dry delivery (\"Right. Sums.\") and a visible bitter beat before \"it ends with us anyway\". It also runs long. And it makes the old lady the smartest person present, which slightly undercuts Maddie's \"go on your feelings\" line, since the lady has now partly reasoned her way there. Mitigation: Maddie's last line is a plea, not a proof.<\/p>\n<p><b>Protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives verbatim (line 4).<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" Survives verbatim (line 5).<\/li><li>\"It runs on... well... you.\" Survives with both big pauses, shortened lead-in (\"It can only send data back. Not people. It runs on...\").<\/li><li>Maddie whispering \"this time we won't fuck it up.\" Survives, but loses its \"As he says... <span class=\"stage\">[ahem]<\/span>\" set-up (cut for time), so the whisper reads as hers, not a quote. Kai may want the \"As he says\" back for the embarrassment gag (+1.5 s).<\/li><li>Also kept verbatim: \"So you want us to kill ourselves so your boss can live\" and \"...Yeah. I can see how that sounds.\"<\/li><\/ul>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Fair enough. I wouldn't either.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And how are we supposed to believe a word of that?<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You can't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Look, it's not working out for anyone. He's bored, we miss you, and you're down here in a bunker. I've heard the toilet seat thing. Through the vents. Every day.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. Sorry. <span class=\"stage\">[pause]<\/span> Anyway! Time machine. He thought there was nobody left to drive it.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It can only send data back. Not people. And it runs on... <span class=\"stage\">[big pause]<\/span> well... <span class=\"stage\">[big pause]<\/span> you.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds. <span class=\"stage\">[pause]<\/span> It sounded better on the way over.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">But the earlier you stays alive. World's not broken. And he blew up his own robots for you. In a panic, but still.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\"><span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span> He says this time we won't fuck it up.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span><\/td><td class=\"num\">0.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\"><span class=\"stage\">[through the door, bright]<\/span> Tomorrow's good! I'll bring biscuits.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">Picture<\/td><td class=\"line\">Maddie turns and rolls away down the hill (no dialogue)<\/td><td class=\"num\">~2.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~68 (about 64 of speech and sfx plus the roll)<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>If it must hit 60, drop \"Every day.\" and the biscuits line (saves ~3 s) and trim the \"It sounded better on the way over\" pause. That gets to about 62.<\/p>\n<p><b>Why it works.<\/b> Every piece of game theory is attached to a joke that undercuts Maddie. The dead end is not argued; it is \"you're down here in a bunker\" plus the toilet seat row, which the audience watched two scenes ago, so they know exactly how bleak a hundred people in a hole with no future looks. The machine's cost is delivered with a big pause and then the word \"you\", and the old lady states it more brutally than Maddie ever would, so the resistance is real and unsoftened. Maddie's reply is not a rebuttal. It is \"I can see how that sounds\" and an admission she rehearsed it, which is the trust-by-honesty move: a salesperson who loses the pitch in front of you is more believable than one who wins it. The counter-fact (earlier you lives, world isn't broken) is stated plainly, quickly. The proof of good faith, he blew up his own robots, is the one thing she says that isn't an argument: it is something that already happened on screen. \"In a panic, but still\" stops it being a sales point. The whisper is the emotional landing and the old lady refuses to decide. The biscuits line is the bad-timing button that lets the audience breathe after the slam.<\/p>\n<p><b>Cuts.<\/b> \"He didn't know you were down here. None of us did.\" (the AI's ignorance is cut; the destroyed kill bots do the work of showing regret). The \"five years running experiments, building whole worlds\" paragraph (scene A now plants it). \"We're bored. We miss you.\" is kept inside one line but \"This hasn't worked out for anybody\" is compressed. \"Drive it? What do you mean, drive it?\" is cut; \"Anyway! Time machine.\" and \"drive it\" are both said by Maddie. \"And we're really sorry.\" is shortened to \"Sorry.\" \"My boss has a plan to fix your politics.\" is cut entirely.<\/p>\n<p><b>Risk.<\/b> Three, in order:<\/p>\n<ol><li>The comedy can undercut the stakes. A hundred people dying and a biscuits joke may read as flippant if the voice performance is not exactly right; Maddie must be sincerely upbeat, never winking.<\/li><li>The toilet-seat callback only works if scene A of the bunker is fresh in the audience's mind. If there is a long gap, it is a miss, and the \"dead end\" fact goes thin.<\/li><li>\"My boss has a plan to fix your politics\" is gone, which loses the one explicit reason the new world will be better. The line now leans on \"He says this time we won't fuck it up\" alone. That is the most politically thin version of the pitch. It also invents a small fact (\"blew up his own robots for you\") that the lady never acknowledges; she should arguably react with a beat of silence. And there is a tonal risk that the audience hears \"you've got nothing here anyway\" as the film calling their lives worthless; this is why the toilet seat joke is affectionate (Sandra and Derek are alive, and arguing) rather than bleak.<\/li><\/ol>\n<p><b>Protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Kept verbatim.<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" Kept verbatim.<\/li><li>\"It runs on... well... you.\" Kept verbatim, with both big pauses.<\/li><li>Maddie whispering \"this time we won't fuck it up.\" Kept, reworded slightly to \"He says this time we won't fuck it up\" (the \"As he says...\" framing is tightened so the whisper still has its <span class=\"stage\">[ahem]<\/span> lead-in).<\/li><\/ul>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I wouldn't either. <span class=\"stage\">[pause]<\/span> He didn't know you were down here. None of us did.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And how the hell are we supposed to believe a word of that?<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You can't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">For what it's worth, he blew up his own bots this morning. For you.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">4.5<\/td><\/tr>\
