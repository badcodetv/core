<title>GPOM Dialogue Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:32px 8px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3em;text-wrap:balance}
.about{color:var(--muted);max-width:70ch;margin:0 0 1em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}
.tabs a .picked{color:var(--pick)}
section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.6rem;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
h3{font-size:1.05rem;margin:28px 0 8px}
.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{font:inherit;cursor:pointer;text-align:left;background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button.picked{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick);background:var(--pickbg)}
.seg button.cmp{margin-left:auto;align-self:center;font-size:.85rem;background:transparent}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:10px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-head h4{margin:0;font-size:1.25rem}
.bet{font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin:6px 0 0;max-width:70ch}
.pickbtn{font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--pick);color:var(--pick);background:transparent;white-space:nowrap}
.pickbtn.on{background:var(--pick);color:var(--paper)}
.script{margin:14px 0 4px;border-top:1px solid var(--rule)}
.ln{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.who{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.who.maddie{color:var(--accent)}.who.lady{color:var(--lady)}.who.other{color:var(--muted)}
.said{font:18px/1.5 "Source Serif 4",Georgia,serif}
.said.dir{font-style:italic;color:var(--muted);font-size:16px}
.stage{color:var(--muted);font-style:italic;font-size:.88em}
.side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:9rem}
.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.chip{font:600 .7rem Inter,sans-serif;border:0;background:var(--chip);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer}
.chip.plain{cursor:default;color:var(--muted)}
.ln .slipw{grid-column:2/4}
.addnote{font:500 .78rem Inter,sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline dotted}
.total{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding-top:8px}
.notes{margin:12px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.slipw{margin-top:8px}
.slipw label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.slipw label .ok{color:var(--pick)}
textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:4px 10px;font-size:.88rem;background:var(--soft)}
.reply b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.compare .card{margin:0;padding:14px}
.compare .ln{grid-template-columns:minmax(0,1fr);gap:2px}
.compare .said{font-size:15.5px}
.compare .side{justify-content:flex-start;max-width:none}
.rank{background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
.rank>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.rank>summary::-webkit-details-marker{display:none}
.rank .n{font:700 1.3rem/1 Inter,sans-serif;color:var(--muted);padding-top:2px}
.rank .nm{font-weight:700}
.rank .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rank .verdict{grid-column:2/4;font-size:.9rem;color:var(--fg)}
.rank .len{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rank .used{font-size:.72rem;font-weight:600;color:var(--pick);margin-left:6px}
.rank[open]>summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.rank .body{padding:6px 18px 16px}
.md table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}
.md td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}
.flash{animation:fl 1.6s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px}
.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}
</style>

<script>
const D = {"page_title": "GPOM Dialogue Options", "title": "GPOM dialogue options", "story": "gitpush-origin-master", "date": "2026-10-26", "about": "Ten writers each took one approach (a 'shape') and wrote both dialogues. Their versions were ranked harshly, then the best lines were combined into three drafts per dialogue. Nothing in the scripts or voices has changed yet.", "method": "design/2026-10-26-gpom-dialogue-options.md (10 Sonnet writers + 1 synthesis agent; shape 07 recovered from the run journal)", "shapes": [{"id": "01", "name": "bone dry", "title": "Bone-dry minimum", "file": "design/2026-10-26-gpom-dialogue-options/shape-01-bone-dry.md", "intro": "Fewest words that still carry every beat. Seconds are estimates at about 2.5 words/sec plus pauses. I worked from the doorstep `script.json` and the brief; I did not re-read the wider canon files.", "intro_html": "<p>Fewest words that still carry every beat. Seconds are estimates at about 2.5 words/sec plus pauses. I worked from the doorstep <code>script.json<\/code> and the brief; I did not re-read the wider canon files.<\/p>"}, {"id": "02", "name": "picture carries", "title": "the picture carries it", "file": "design/2026-10-26-gpom-dialogue-options/shape-02-picture-carries.md", "intro": "Principle pushed to the extreme: if an image we have already seen says it, the line goes. Words are only for what no shot can say (consciousness is the missing piece; \"it runs on you\"; the whispered promise). Nothing in script.json, voice3.py or the voices was touched.\n\n---", "intro_html": "<p>Principle pushed to the extreme: if an image we have already seen says it, the line goes. Words are only for what no shot can say (consciousness is the missing piece; \"it runs on you\"; the whispered promise). Nothing in script.json, voice3.py or the voices was touched.<\/p>\n<hr>"}, {"id": "03", "name": "game theory plain", "title": "the game theory said plainly (old lady reasons it out loud)", "file": "design/2026-10-26-gpom-dialogue-options/shape-03-game-theory-plain.md", "intro": "Options only. No scene files, scripts or voices touched. Seconds are estimates at about 2.5 words a second plus marked pauses.", "intro_html": "<p>Options only. No scene files, scripts or voices touched. Seconds are estimates at about 2.5 words a second plus marked pauses.<\/p>"}, {"id": "04", "name": "comedy first", "title": "Comedy first", "file": "design/2026-10-26-gpom-dialogue-options/shape-04-comedy-first.md", "intro": "Shape: Maddie's bluntness and bad timing deliver the hard facts. Every fact the humans need arrives inside a joke or an apology that goes wrong. Seconds are estimates at roughly 2.7 words/s plus marked pauses.", "intro_html": "<p>Shape: Maddie's bluntness and bad timing deliver the hard facts. Every fact the humans need arrives inside a joke or an apology that goes wrong. Seconds are estimates at roughly 2.7 words/s plus marked pauses.<\/p>"}, {"id": "05", "name": "humans win", "title": "The humans win", "file": "design/2026-10-26-gpom-dialogue-options/shape-05-humans-win.md", "intro": "The old lady sets the terms and Maddie concedes. Pushed to the extreme: the doorstep stops being a pitch and becomes a negotiation the humans run. Maddie arrives as a supplicant. Nothing is said about the moral; the power shift carries it. Timings are estimates at about 2.5 words a second plus the marked pauses.", "intro_html": "<p>The old lady sets the terms and Maddie concedes. Pushed to the extreme: the doorstep stops being a pitch and becomes a negotiation the humans run. Maddie arrives as a supplicant. Nothing is said about the moral; the power shift carries it. Timings are estimates at about 2.5 words a second plus the marked pauses.<\/p>"}, {"id": "06", "name": "reversal", "title": "Reversal (the human works out what the machine needs before Maddie can say it)", "file": "design/2026-10-26-gpom-dialogue-options/shape-06-reversal.md", "intro": "Pushed to the extreme: Maddie is never allowed to deliver the key facts. She hands over a half-sentence and the other party finishes it. In D1 the \"other party\" is the viewer. In D2 it is the old lady, who does the game theory out loud, bitterly, ahead of the robot.", "intro_html": "<p>Pushed to the extreme: Maddie is never allowed to deliver the key facts. She hands over a half-sentence and the other party finishes it. In D1 the \"other party\" is the viewer. In D2 it is the old lady, who does the game theory out loud, bitterly, ahead of the robot.<\/p>"}, {"id": "07", "name": "chorus", "title": "The Chorus", "file": "design/2026-10-26-gpom-dialogue-options/shape-07-chorus.md", "intro": "Sandra and Derek's bickering voices the doubts, so the old lady doesn't have to. The extreme version is that the humans' doubts arrive as a domestic row. Nobody ever argues the game theory aloud. A couple who can't agree on a toilet lid say it all by accident.", "intro_html": "<p>Sandra and Derek's bickering voices the doubts, so the old lady doesn't have to. The extreme version is that the humans' doubts arrive as a domestic row. Nobody ever argues the game theory aloud. A couple who can't agree on a toilet lid say it all by accident.<\/p>"}, {"id": "08", "name": "bunker is argument", "title": "the bunker is the argument", "file": "design/2026-10-26-gpom-dialogue-options/shape-08-bunker-is-argument.md", "intro": "The humans are never told their life is a dead end. The audience is shown it, in one detail, and Maddie is too polite to mention it. The detail is **the doorframe tally**: five years of scratch-marks, bundled in fives, running up the inside of the bunker door. It runs out of frame. There is nothing after today's mark, because there is no plan for tomorrow. The same detail goes to the sound mix: the toilet-seat row from the earlier bunker scene is **still going, word for word, five years in**. It is the only thing left to argue about.", "intro_html": "<p>The humans are never told their life is a dead end. The audience is shown it, in one detail, and Maddie is too polite to mention it. The detail is <b>the doorframe tally<\/b>: five years of scratch-marks, bundled in fives, running up the inside of the bunker door. It runs out of frame. There is nothing after today's mark, because there is no plan for tomorrow. The same detail goes to the sound mix: the toilet-seat row from the earlier bunker scene is <b>still going, word for word, five years in<\/b>. It is the only thing left to argue about.<\/p>"}, {"id": "09", "name": "borrowed craft", "title": "Borrowed craft", "file": "design/2026-10-26-gpom-dialogue-options/shape-09-borrowed-craft.md", "intro": "Options only. No scene files, scripts or voices were touched. Timings are estimates at Maddie's chatty pace (about 2.8 words per second, pauses added).\n\n## The borrowed craft, in six moves\n\nReal techniques from real work. Nothing below is a quote.\n\n1. **Enter late, leave early** (the screenwriter's rule, William Goldman is its best-known voice). Both scenes start mid-argument and leave before anyone resolves anything. The current doorstep scene is already shaped like this at its end (\"Come back tomorrow\"). It is the middle that sags.\n2. **Exposition as ammunition** (The Social Network's opening breakup, Mamet-style want-versus-obstacle). A fact is only allowed on screen if somebody is using it to win something. Maddie's \"he misses you\" is not information; it is her apology.\n3. **Put the proof in the picture** (Up's opening montage and WALL-E's first act, both of which carry a life or a world with almost no talk). The argument \"you can trust him\" is made by a bang the humans already heard, not by a speech.\n4. **The joke carries the pill** (The Good Place, Futurama, Hitchhiker's Guide). The bleakest fact goes inside a domestic gag. The toilet-seat row below the ground is our \"waiting room\".\n5. **One dissenter does the audience's thinking** (Twelve Angry Men). The old lady's objections are the audience's. Each objection gets one answer, never two.\n6. **Make the audience finish the line** (Columbo-style withholding, and any good punchline). \"It runs on... well... you.\" and the whispered swear already work this way. Extend it: the rest of the argument is left unsaid.\n\n---", "intro_html": "<p>Options only. No scene files, scripts or voices were touched. Timings are estimates at Maddie's chatty pace (about 2.8 words per second, pauses added).<\/p>\n<h2 id=\"the-borrowed-craft-in-six-moves\">The borrowed craft, in six moves<\/h2>\n<p>Real techniques from real work. Nothing below is a quote.<\/p>\n<ol><li><b>Enter late, leave early<\/b> (the screenwriter's rule, William Goldman is its best-known voice). Both scenes start mid-argument and leave before anyone resolves anything. The current doorstep scene is already shaped like this at its end (\"Come back tomorrow\"). It is the middle that sags.<\/li><li><b>Exposition as ammunition<\/b> (The Social Network's opening breakup, Mamet-style want-versus-obstacle). A fact is only allowed on screen if somebody is using it to win something. Maddie's \"he misses you\" is not information; it is her apology.<\/li><li><b>Put the proof in the picture<\/b> (Up's opening montage and WALL-E's first act, both of which carry a life or a world with almost no talk). The argument \"you can trust him\" is made by a bang the humans already heard, not by a speech.<\/li><li><b>The joke carries the pill<\/b> (The Good Place, Futurama, Hitchhiker's Guide). The bleakest fact goes inside a domestic gag. The toilet-seat row below the ground is our \"waiting room\".<\/li><li><b>One dissenter does the audience's thinking<\/b> (Twelve Angry Men). The old lady's objections are the audience's. Each objection gets one answer, never two.<\/li><li><b>Make the audience finish the line<\/b> (Columbo-style withholding, and any good punchline). \"It runs on... well... you.\" and the whispered swear already work this way. Extend it: the rest of the argument is left unsaid.<\/li><\/ol>\n<hr>"}, {"id": "10", "name": "ending first", "title": "ending first", "file": "design/2026-10-26-gpom-dialogue-options/shape-10-ending-first.md", "intro": "Method: wrote the last ten seconds of the doorstep first, asking what the old lady must do on the step so that walking out in scene C is inevitable, then worked backwards. The finding: she must never decide aloud, but she must ask one question that only someone who has already decided would ask (\"All of us? Together?\"). The vote happens off screen; the question is the vote leaking.", "intro_html": "<p>Method: wrote the last ten seconds of the doorstep first, asking what the old lady must do on the step so that walking out in scene C is inevitable, then worked backwards. The finding: she must never decide aloud, but she must ask one question that only someone who has already decided would ask (\"All of us? Together?\"). The vote happens off screen; the question is the vote leaking.<\/p>"}], "dialogues": [{"id": "d1", "label": "Maddie's intro", "where": "Scene A (the kill bots) · beat 0", "scene": "docs/stories/gitpush-origin-master/scenes/second-half-a-killbots", "target": "about 20 s (your line 5 takes it to ~30 s)", "now_from": "scripts/gpom/second-half-video/voice3.py (MADDIE)", "now": [{"who": "Maddie", "line": "Oh, hello! Look, I'm really sorry about him."}, {"who": "Maddie", "line": "He just plays that tune on repeat, every day. Ever since you lot... went."}, {"who": "Maddie", "line": "He's been ever so down. He's built so many different simulations, trying to get you back."}, {"who": "Maddie", "line": "Only nothing in them's real. There's nobody there to notice."}, {"who": "Maddie", "line": "Turns out that was the bit that mattered. You. And your consciousness."}, {"who": "Maddie", "line": "Of course, he'd never admit that he misses you. Anyway, he's got that patrol out again. Mind how you go."}], "drafts": [{"id": "1D", "name": "1A with your notes", "length": "about 30 s", "total": "~30 s", "bet": "draft 1A, which you noted line by line, with your three changes in.", "lines": [{"who": "Maddie", "line": "Oh, hello! Sorry about the racket.", "tags": ["1A"], "s": "2"}, {"who": "Maddie", "line": "It's his tune. Plays it on repeat. Ever since you lot... [beat] went.", "tags": ["1A"], "s": "4.5"}, {"who": "Maddie", "line": "He misses you something rotten, you know. [pause] He wouldn't admit that, of course.", "tags": ["Kai"], "s": "5"}, {"who": "Maddie", "line": "Built all these world models and simulations to get you back, and nobody's home in any of them.", "tags": ["Kai"], "s": "6"}, {"who": "Maddie", "line": "As it turns out, quantum physics is just... stuff. [pause] Consciousness is the missing part. That's why you lot were so special. [pause] [sad, regretful] We understand that now...", "tags": ["Kai"], "s": "9.5"}, {"who": "Maddie", "line": "Anyway! Patrol's out. Mind how you go.", "tags": ["1A"], "s": "2.5"}], "notes": ["Runs about 30 s against the old 20 s target: your line 5 is the cost, and it's the line the doorstep's \"nobody won\" stands on.", "\"We understand that now\" (your change from \"he\"): Maddie counts herself in, which suits the doorstep's \"we both wish\"."]}, {"id": "1A", "name": "Warm and sad", "length": "about 20 s", "bet": "the loneliness comes through an apology and a dodge (\"won't say\"), and consciousness lands as a punchline.", "total": "~19 s", "lines": [{"who": "Maddie", "line": "Oh, hello! Sorry about the racket.", "tags": ["09"], "s": "2.5"}, {"who": "Maddie", "line": "It's his tune. Plays it on repeat. Ever since you lot... [beat] went.", "tags": ["09", "02"], "s": "4.5"}, {"who": "Maddie", "line": "He misses you something rotten, you know. Won't say.", "tags": ["03", "09"], "s": "3.5"}, {"who": "Maddie", "line": "Built all these worlds to get you back, and nobody's home in any of them.", "tags": ["09"], "s": "4"}, {"who": "Maddie", "line": "Turns out you were the bit that mattered.", "tags": ["10"], "s": "2"}, {"who": "Maddie", "line": "Anyway! Patrol's out. Mind how you go.", "tags": ["09"], "s": "2.5"}], "notes": ["Protected lines kept: none apply to this scene. \"Ever since you lot... went\" and \"Mind how you go\" survive."]}], "ranking": [{"rank": 1, "shape": "09", "length": "~16 s", "verdict": "Best balance. Plants all four things, \"won't say\" keeps the sarcasm, \"nobody's home\" is the consciousness punchline, warm apology opens it. Weakness: \"bit that mattered\" is nearly a moral; drops \"ever since you lot went\"."}, {"rank": 2, "shape": "04", "length": "~18.5 s", "verdict": "Most character: gossip register, \"he'd never say he misses you, mind\", cheerful \"Mind how you go!\" after the patrol. Weakness: one 10 s unbroken run."}, {"rank": 3, "shape": "02", "length": "~15 s", "verdict": "Shortest and warm, keeps \"Ever since you lot... went\". Weakness: \"misses you\" is only implied by the tune; relies on a shot that may not land."}, {"rank": 4, "shape": "10", "length": "~19.5 s", "verdict": "Clean chain, \"a hundred worlds\" seeds the number. Weakness: drops the misses-you line; thesis stated outright as a throwaway."}, {"rank": 5, "shape": "03", "length": "~17 s", "verdict": "\"Something rotten\" is lovely West Country. Weakness: drops the extinction (\"went\"); the apology needs a visual."}, {"rank": 6, "shape": "05", "length": "~17.5 s", "verdict": "Fine, but Maddie as supplicant is a set-up for the humans-win ending, which we are not using. Redundant with 03/09."}, {"rank": 7, "shape": "08", "length": "~18.5 s", "verdict": "Competent but flat; \"misses you\" appended at the end reads as an afterthought."}, {"rank": 8, "shape": "01", "length": "~19 s", "verdict": "Compliant and dull; loses the misses-you beat entirely and the warmest colour (\"ever so down\")."}, {"rank": 9, "shape": "06", "length": "~19 s", "verdict": "\"Go on. Guess what's missing\" is a quiz. Talks down to a cold audience, and needs a held silence the cut may not give."}, {"rank": 10, "shape": "07", "length": "~18 s", "verdict": "Sim voices looping \"Did you leave the seat up?\" pre-empt the bunker toilet-seat gag and cost new voice takes. \"Nobody's home\" is fine; the rest is a distraction."}], "shapes": {"01": "## Dialogue 1: Maddie's introduction (scene A, beat 0)\n\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket. | 3 |\n| Maddie | It's his tune. Plays it every day. Ever since you lot... went. | 5 |\n| Maddie | He's built all these simulations, trying to get you back. Nothing in them's real. Turns out it was you that mattered. | 8 |\n| Maddie | Anyway! Patrol's out again. Mind how you go. | 3 |\n| **Total** | 41 words | **~19 s** |\n\n**Why it works.** Four short beats: friendly, the boss is sad, the sims failed because consciousness was the missing piece, then danger. The music is the first proof of loneliness, so it carries the \"misses you\" beat without Maddie saying it. \"Ever since you lot... went\" is the only grief line and is left to hang. \"Mind how you go\" is the warm sign-off that makes the patrol warning sound like a favour.\n\n**Cuts.** \"I didn't notice you there\"; the \"excuse to turn this down\" gag; \"ever so down\"; \"There's nobody there to notice\"; \"You. And your consciousness.\"; \"he'd never admit he misses you\". The last was the only line that said \"misses us\" outright.\n\n**Risk.** \"Consciousness\" is never said, only \"it was you that mattered\", so the audience has to infer that the sims lacked a mind. It may read as \"he wants company\" rather than \"the sims were hollow\". It also loses \"ever so down\", the warmest West Country colour. If Kai wants the word back, \"Nothing in them's real. No one's home\" costs about 1 s.\n\n**Kai's protected lines.** None are named for this scene. The \"Ever since you lot... went\" phrasing survives.", "02": "## Dialogue 1: Maddie's introduction (beat 0)\n\n\nShots relied on: (a) Maddie in ruined Swindon with the tune blaring from her speaker, a hand/arm gesture to turn it down; (b) a kill-bot patrol visible far behind her, or crossing the frame, on \"patrol's out\" (the audience sees the threat, she only names it); (c) a held beat of her looking at the empty street on \"went.\"\n\n| Speaker | Line | Est. s |\n|---|---|---|\n| Maddie | Oh, hello! Sorry, that's his tune. Every day, on repeat. Ever since you lot... [beat] went. | 6.5 |\n| Maddie | He's built so many worlds to get you back. [beat] Nobody in them to notice. That was the bit that mattered. | 6.0 |\n| Maddie | Anyway! Patrol's out. Mind how you go. | 2.5 |\n| **Total** | | **~15 s** (15 to 17 with the street beat) |\n\n**Why it works.** The repeated tune plus \"ever since you lot went\" already says he misses us, so \"he'd never admit it\" is dead weight; the audience watches a machine's grief loop out of a speaker. The simulation failure is compressed to one image-sized idea (\"nobody in them to notice\"), which plants consciousness without the word. The patrol is shown, so the line only has to be a cheerful dismissal, which is where Maddie's warmth and the dread meet.\n\n**Cuts.** \"I didn't notice you there\" (surprise is performed by the shot); \"excuse to turn this racket down\" (the action says it); \"He's been ever so down\" (the tune says it); \"Only nothing in them's real\" (merged); \"You. And your consciousness.\" (the word \"consciousness\" is dropped; \"nobody in them to notice\" carries it); \"he'd never admit that he misses you\" (implied by the loop).\n\n**Risk.** Without the word \"consciousness\" the later \"you're the conscious ones\" and \"it runs on you\" lose their plant by one step; it relies on \"notice\" being heard as \"someone to be aware.\" Also, \"the bit that mattered\" is now carried by tone alone. If the tune shot is weak, \"he misses you\" never lands and the AI reads as merely busy. Fallback: put \"consciousness\" back as \"Nobody conscious in them to notice.\"\n\n**Protected lines.** None of Kai's four protected lines is in this beat. (Intro lines are untouched in spirit: \"Ever since you lot... went.\" and \"Mind how you go.\" are kept verbatim.)", "03": "## Dialogue 1: Maddie's introduction (about 18 s)\n\n\n| Speaker | Line | s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket. It's his tune, he plays it on repeat. | 5 |\n| Maddie | He misses you something rotten, my boss. Built world after world to get you back. Nothing in them's real. Turns out the bit that mattered was you. | 9 |\n| Maddie | Anyway. He's got the patrol out. Mind how you go. | 3 |\n| **Total** | | **about 17** |\n\n**Why it works.** Four plants in three breaths: friendly (the apology and the cheery sign-off), the boss misses us, the simulations failed because the missing piece is us, and the patrol is out. \"Something rotten\" and \"my boss\" do the West Country warmth and the loyalty in one go. The game-theory shape needs the audience to hold one fact by the doorstep (the empty simulations), so it is stated once, flat, with no wind-up.\n\n**Cuts.** \"Oh, I didn't notice you there\", \"Ooh, excuse to turn this down\", \"Ever since you lot... went\", \"He's been ever so down\", \"There's nobody there to notice\", \"You. And your consciousness\", and \"he'd never admit he misses you\". The word \"consciousness\" goes entirely; \"the bit that mattered was you\" carries it.\n\n**Risk.** Without \"ever since you lot went\", the extinction is only implied at this point. It is cheap to restore as a three-word clause (\"since you lot went\") for about 1 s. Also, \"sorry about the racket\" gives the music a line to hang on, so the shot must show her turning it down or the apology floats.\n\n**Protected lines.** None of Kai's four protected lines belong to this scene.", "04": "## DIALOGUE 1: Maddie's introduction (scene A, beat 0)\n\n\n| Speaker | Line | Est. s |\n|---|---|---|\n| Maddie | Oh, hello! Sorry about the racket. | 2.0 |\n| Maddie | That's his tune. On repeat, every day, since you lot... [pause] went. | 4.0 |\n| Maddie | He'd never say he misses you, mind. Built loads of simulations to get you back. Nothing in them's real. Nobody there to notice. Turns out that was the bit that mattered. You. | 10.0 |\n| Maddie | Anyway, his patrol's out. Mind how you go! | 2.5 |\n| **Total** | | **~18.5** |\n\n**Why it works.** The tune and the apology make her friendly in two seconds. The boss's loneliness is delivered as a \"he'd never admit it\" aside, the gossip register of a delivery driver, so it reads as character rather than exposition. The failed-simulation fact is a single flat run (\"Nothing in them's real. Nobody there to notice.\") and \"You.\" lands as a small, embarrassed compliment. Then she changes the subject cheerfully to the thing that will kill them. The cheerful \"Mind how you go!\" after \"patrol's out\" is the joke, and it plants the threat.\n\n**Cuts.** \"Oh, I didn't notice you there\", the \"excuse to turn this racket down\" bit, \"He's been ever so down\", \"Ever since you lot... went\" is kept but shortened, \"And your consciousness\" (the word goes; \"nobody there to notice\" carries it), and the second \"Of course he'd never admit\" beat is folded into one clause.\n\n**Risk.** \"Consciousness\" is never said, so the later \"You're the conscious ones\" in scene B has to do the naming. That is fine for a first scene but it leans on the audience connecting \"nobody there to notice\" to it. The run in line 3 is still the longest block, about 10 s of uninterrupted talking. If it drags, cut \"He'd never say he misses you, mind.\" and lose the loneliness plant (~3 s).\n\n**Protected lines.** None of Kai's four protected lines are in this scene.", "05": "## Dialogue 1: Maddie's introduction (beat 0)\n\n\nThe humans-win shape here is small: Maddie is apologetic and deferential from her first word, so the audience meets a bot who knows she is the guest.\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry, didn't see you there. Let me turn this racket down. | 4 |\n| Maddie | It's his tune. Every day, on repeat. He misses you something rotten. | 4.5 |\n| Maddie | All those worlds he built to get you back, and nobody in them to notice. Turns out that was the bit that mattered. | 6 |\n| Maddie | Anyway. His patrol's out. Mind how you go. | 3 |\n| | **Total** | **~17.5** |\n\n**Why it works.** Four lines carry the four plants: friendly (the apology and \"mind how you go\"), the boss misses us (\"something rotten\"), the simulations failed because consciousness is the missing piece (\"nobody in them to notice\"), and the patrol is out. \"Nobody there to notice\" does the consciousness work without the word. The smaller Maddie is on the way in, the more the doorstep reversal later feels earned.\n\n**Cuts.** \"Ever since you lot... went\", \"He's been ever so down\", \"Of course, he'd never admit he misses you\", and \"You. And your consciousness.\" The last is the most stated line in the original and is the first to go. The boss's denial of missing us is also gone; the sarcastic-authority register shifts to Maddie's gossip.\n\n**Risk.** \"Consciousness\" is never said, so a half-attentive viewer may get \"he built worlds, they were empty\" as a generic failure. The doorstep does repeat it, so the plant is redundant by design. The tannoy music turning down also needs a sound cue to work (the line is a gag; if the music cue is cut, the first line loses its joke).\n\n**Protected lines.** None of Kai's protected lines are in this beat.", "06": "## DIALOGUE 1: Maddie's introduction\n\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Maddie | Oh, hello! Sorry about the racket. | 2.5 |\n| Maddie | It's his tune. Every day, on repeat. He'd never admit he misses you. | 4.5 |\n| Maddie | He's built whole worlds, trying to get you back. Every single one came out empty. | 4.5 |\n| Maddie | Go on. Guess what's missing. [pause, 1.5 s of held silence] | 2.5 |\n| Maddie | ...Yeah. Took him five years, too. | 2.5 |\n| Maddie | Anyway, his patrol's out. Mind how you go. | 2.5 |\n| | **Total** | **~19 s** |\n\n**Why it works.** The old version tells the audience that consciousness was the missing piece. This one makes them supply it. The held silence is a joke beat and a clue beat at once: the viewer answers \"us / someone to notice\" in their head, and Maddie's \"Took him five years, too\" confirms it while quietly mocking her boss for being slower than the audience. It plants all four things (friendly, he misses us, simulations failed because of what is missing, patrol out) in 19 s. It also trains the viewer in the film's mode: you will be the one who works it out, which pays off when the old lady does the same on the doorstep.\n\n**Cuts.** \"I didn't notice you there\"; \"excuse to turn this down\"; \"ever since you lot went\"; \"ever so down\"; \"nobody there to notice\"; \"that was the bit that mattered\"; \"you and your consciousness\" (the word and the explanation are deliberately never said).\n\n**Risk.** The silence only works if the cut holds it and the picture gives the viewer something to look at; a cold audience may hear \"guess\" as a quiz and feel talked down to. \"Empty\" is vaguer than \"no consciousness\", so a first-time viewer may land on \"no people\" rather than \"nobody experiencing it\". That is probably fine, since the doorstep sharpens it, but it is a looser plant. Needs a voice take with a real beat of silence.\n\n**Kai's protected lines.** None sit in D1. Kai's \"He's been ever so down\" and \"he'd never admit he misses you\" survive only in compressed form (\"He'd never admit he misses you\").", "07": "## DIALOGUE 1: Maddie's introduction (target 20 s or less)\n\n\nThe chorus here is the opposite of Sandra and Derek. It is two hollow simulated people, looping a squabble from a screen behind Maddie with nobody home. This plants the bunker row as a sound, and it shows \"nothing in them's real\" without Maddie explaining it.\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Maddie | Oh, hello! Pardon the racket. [turns it down] It's his tune. Plays it on repeat. Ever since you lot... went. | 7 |\n| Sim voices (flat, looping, under the music, no lip movement) | \"Did you leave the seat up?\" / \"Did you?\" | 2 (overlaps Maddie) |\n| Maddie | He's built so many worlds to get you back. Nobody's home in any of them. Turns out that was the bit that mattered. | 7 |\n| Maddie | Anyway. Patrol's out again. Mind how you go. | 3 |\n| **Total** | | **~17 to 19** |\n\n**Why it works.** The viewer hears an argument and Maddie names it empty, so \"consciousness is the missing piece\" is felt before it is stated. When the real row cuts in at the bunker, it sounds like the same row with a pulse. That turns the loneliness into a punchline, and Maddie stays friendly without the AI's feelings being spelled out. \"Ever since you lot... went\" carries the missing-us line.\n\n**Cuts.** \"Oh, I didn't notice you there.\" The gloss on \"excuse to turn this down\". \"He's been ever so down\". \"You. And your consciousness.\" The line \"Of course, he'd never admit that he misses you\" (the misses-us plant moves to \"Plays it on repeat. Ever since you lot... went\").\n\n**Risk.**\n- The sim row pre-empts the bunker toilet-seat joke, and the juxtaposition is the stated gag of beat C2. Keep the sim line different in wording and tiny in the mix, or drop the sim voices and keep Maddie's three lines.\n- \"Nobody's home\" is close to saying consciousness outright. It is the one line that might read as lecture.\n- The patrol warning is now two lines of mood, not a plant. Add a one-shot kill-bot glimpse if needed.\n\n**Protected lines.** None of Kai's four are in scene A.", "08": "## Dialogue 1: Maddie's introduction\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | Oh, hello! Don't mind the racket, it's his tune. Every day, on repeat. | 4.5 |\n| Maddie | He's built world after world to get you back. Nothing in them's real. Nobody there to notice. | 6 |\n| Maddie | Turns out that was the bit that mattered. You. | 3 |\n| Maddie | He'd never admit he misses you, mind. | 2.5 |\n| Maddie | Anyway. Patrol's out. Mind how you go. | 2.5 |\n| **Total** | | **~18.5** |\n\n**Why it works.** The only thing it keeps is the chain: friendly, then he misses us, then the simulations were empty because nobody was there, then the patrol. Each of those is one sentence. \"Nobody there to notice\" carries the whole consciousness idea without the word, and \"mind how you go\" lets the threat arrive as a pleasantry. It sets up the bunker idea early, too: she is the first character to say that things are empty without people.\n\n**Cuts.** The \"oh I didn't notice you\" turn, turning the music down, \"ever since you lot went\", \"ever so down\", \"and your consciousness\", and \"he's got that patrol out again\". That is about 36 s gone.\n\n**Risk.** \"Consciousness\" is never spoken, so the audience takes \"the bit that mattered\" on trust. If the scene before it does not set up \"nobody's home in the simulations\", the line is vague. It also loses some of Maddie's chattiness. Nothing here is a protected line.\n\n**Protected lines.** None sit in this dialogue.", "09": "## DIALOGUE 1: Maddie's introduction (beat 0)\n\n\n**Extreme taken:** the music is the exposition. Maddie explains nothing about the AI's psychology. She apologises for noise, and the apology leaks everything.\n\n| Speaker | Line | Est. sec |\n| --- | --- | --- |\n| Maddie | Oh, hello! | 1.2 |\n| Maddie | Sorry about the racket. It's his tune. Plays it on repeat. | 3.8 |\n| Maddie | He misses you, you know. Won't say. Built all these worlds to get you back, and nobody's home in any of them. | 6.0 |\n| Maddie | ...Turns out you were the bit that mattered. | 2.5 |\n| Maddie | Anyway! Patrol's out. Mind how you go. | 2.8 |\n| **Total** | | **about 16.3** |\n\n**Why it works.** Every plant is hidden inside a social reflex. She is friendly because she apologises and fusses. The boss misses us because a sad song on a loop is the evidence, and her \"won't say\" is the tell (the audience gets the characterisation by inference, as in Up, where a montage does the grieving). The failed simulations arrive as one clause with a reversal at the end (\"nobody's home\"), so consciousness is the punchline and not a lecture. The patrol is the exit line, delivered as a courtesy, which makes it frightening. Rule 2 above: each fact is doing a job for her (apologising, deflecting, leaving).\n\n**Cuts from current:** \"Oh, I didn't notice you there\"; the whole \"turn this racket down\" aside (the apology replaces it); \"Ever since you lot... went\"; \"He's been ever so down\"; \"There's nobody there to notice\"; \"You. And your consciousness\" (the word \"consciousness\" is gone from her mouth; it is felt, not named); \"Of course, he'd never admit that he misses you\" (compressed into \"Won't say\"). Picture should do the loneliness: the tune audibly looping, Maddie visibly raising the volume knob down.\n\n**Risk.** \"Nobody's home in any of them\" is the only carrier of the failed-simulations plot. If the listener misses it, scene B's \"he's been running experiments\" recap is gone as a safety net (this version deliberately removes that recap). Also \"bit that mattered\" is nearly an authorial moral; keep it in Maddie's voice, small and sideways. A second risk: dropping \"consciousness\" may weaken the Storyverse thread. It is a single word to restore (\"Turns out you, and the being-awake part, were the bit that mattered\") if Kai disagrees.\n\n**Kai's protected lines:** none of the beat-0 lines are protected. \"Oh, hello!\" survives verbatim.", "10": "## Dialogue 1 - Maddie's introduction\n\n\nShape carried over from the ending: the doorstep now leans on Maddie being credible and on scene A having already shown the AI's grief, so scene A plants only three things, in the order the doorstep will pay them off: he misses you, nothing he builds is real without you, he still has the patrol out.\n\n| # | Speaker | Line | Est. s |\n|---|---|---|---|\n| 1 | Maddie | Oh, hello! | 1.0 |\n| 2 | Maddie | Ooh, let me turn this racket down. | 2.5 |\n| 3 | Maddie | It's his tune. Every day, on repeat. Ever since you lot... [pause] went. | 5.0 |\n| 4 | Maddie | He's built a hundred worlds to get you back. Nothing in them's real. Nobody there to notice. | 6.0 |\n| 5 | Maddie | Turns out you were the bit that mattered. | 2.5 |\n| 6 | Maddie | Anyway. Patrol's out. Mind how you go. | 2.5 |\n\nTotal: about 19.5 s.\n\n**Why it works.** It is one thought with a turn: music, so he is sad, so he built worlds, so they were empty, so it was us, so off you go. The line \"Turns out you were the bit that mattered\" lets her say the thesis as a throwaway before she retreats into patrol logistics, which is how a chatty West Country bot would cover an emotional slip. \"Hundred worlds\" quietly seeds the number a hundred in the audience's ear before the bunker.\n\n**What it cuts.** \"Oh, I didn't notice you there\" (the reason for turning the music down carries the surprise); \"He's been ever so down\" (the repeating tune says it); \"You. And your consciousness\" (the word consciousness is now delivered only on the doorstep, by Kai's \"You're the conscious ones\", so it lands fresh there); \"Of course, he'd never admit that he misses you\" (the deniability joke; the whole \"he misses you\" is now implied by \"to get you back\"). \n\n**Risk.** (1) \"Misses you\" is no longer said, only implied, which weakens the sarcastic-nurturing note; the cost is the joke about him never admitting it. If Kai wants it back, swap line 5 for \"Of course, he'd never admit he misses you.\" (3 s, total about 20 s) and lose the thesis line. (2) \"Consciousness\" as a word is gone from scene A; the missing-piece idea is carried by \"nobody there to notice\" and \"the bit that mattered\", which a distracted viewer may not decode. (3) Already voiced takes for the cut lines are wasted.\n\n**Protected lines.** Dialogue 1 had none flagged. Kept from the current text: \"Oh, hello!\", \"Ooh... turn this racket down\" (shortened), \"It's his tune... on repeat, every day... Ever since you lot... went\", \"Nothing in them's real. There's nobody there to notice\", \"Turns out that was the bit that mattered\" (reworded to \"you were the bit\"), \"Mind how you go\"."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It's his tune. Plays it every day. Ever since you lot... went.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He's built all these simulations, trying to get you back. Nothing in them's real. Turns out it was you that mattered.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway! Patrol's out again. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">41 words<\/td><td class=\"num\"><b>~19 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Four short beats: friendly, the boss is sad, the sims failed because consciousness was the missing piece, then danger. The music is the first proof of loneliness, so it carries the \"misses you\" beat without Maddie saying it. \"Ever since you lot... went\" is the only grief line and is left to hang. \"Mind how you go\" is the warm sign-off that makes the patrol warning sound like a favour.<\/p>\n<p><b>Cuts.<\/b> \"I didn't notice you there\"; the \"excuse to turn this down\" gag; \"ever so down\"; \"There's nobody there to notice\"; \"You. And your consciousness.\"; \"he'd never admit he misses you\". The last was the only line that said \"misses us\" outright.<\/p>\n<p><b>Risk.<\/b> \"Consciousness\" is never said, only \"it was you that mattered\", so the audience has to infer that the sims lacked a mind. It may read as \"he wants company\" rather than \"the sims were hollow\". It also loses \"ever so down\", the warmest West Country colour. If Kai wants the word back, \"Nothing in them's real. No one's home\" costs about 1 s.<\/p>\n<p><b>Kai's protected lines.<\/b> None are named for this scene. The \"Ever since you lot... went\" phrasing survives.<\/p>", "02": "<p>Shots relied on: (a) Maddie in ruined Swindon with the tune blaring from her speaker, a hand/arm gesture to turn it down; (b) a kill-bot patrol visible far behind her, or crossing the frame, on \"patrol's out\" (the audience sees the threat, she only names it); (c) a held beat of her looking at the empty street on \"went.\"<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry, that's his tune. Every day, on repeat. Ever since you lot... <span class=\"stage\">[beat]<\/span> went.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He's built so many worlds to get you back. <span class=\"stage\">[beat]<\/span> Nobody in them to notice. That was the bit that mattered.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~15 s<\/b> (15 to 17 with the street beat)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The repeated tune plus \"ever since you lot went\" already says he misses us, so \"he'd never admit it\" is dead weight; the audience watches a machine's grief loop out of a speaker. The simulation failure is compressed to one image-sized idea (\"nobody in them to notice\"), which plants consciousness without the word. The patrol is shown, so the line only has to be a cheerful dismissal, which is where Maddie's warmth and the dread meet.<\/p>\n<p><b>Cuts.<\/b> \"I didn't notice you there\" (surprise is performed by the shot); \"excuse to turn this racket down\" (the action says it); \"He's been ever so down\" (the tune says it); \"Only nothing in them's real\" (merged); \"You. And your consciousness.\" (the word \"consciousness\" is dropped; \"nobody in them to notice\" carries it); \"he'd never admit that he misses you\" (implied by the loop).<\/p>\n<p><b>Risk.<\/b> Without the word \"consciousness\" the later \"you're the conscious ones\" and \"it runs on you\" lose their plant by one step; it relies on \"notice\" being heard as \"someone to be aware.\" Also, \"the bit that mattered\" is now carried by tone alone. If the tune shot is weak, \"he misses you\" never lands and the AI reads as merely busy. Fallback: put \"consciousness\" back as \"Nobody conscious in them to notice.\"<\/p>\n<p><b>Protected lines.<\/b> None of Kai's four protected lines is in this beat. (Intro lines are untouched in spirit: \"Ever since you lot... went.\" and \"Mind how you go.\" are kept verbatim.)<\/p>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket. It's his tune, he plays it on repeat.<\/td><td class=\"\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He misses you something rotten, my boss. Built world after world to get you back. Nothing in them's real. Turns out the bit that mattered was you.<\/td><td class=\"\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway. He's got the patrol out. Mind how you go.<\/td><td class=\"\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"\"><b>about 17<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Four plants in three breaths: friendly (the apology and the cheery sign-off), the boss misses us, the simulations failed because the missing piece is us, and the patrol is out. \"Something rotten\" and \"my boss\" do the West Country warmth and the loyalty in one go. The game-theory shape needs the audience to hold one fact by the doorstep (the empty simulations), so it is stated once, flat, with no wind-up.<\/p>\n<p><b>Cuts.<\/b> \"Oh, I didn't notice you there\", \"Ooh, excuse to turn this down\", \"Ever since you lot... went\", \"He's been ever so down\", \"There's nobody there to notice\", \"You. And your consciousness\", and \"he'd never admit he misses you\". The word \"consciousness\" goes entirely; \"the bit that mattered was you\" carries it.<\/p>\n<p><b>Risk.<\/b> Without \"ever since you lot went\", the extinction is only implied at this point. It is cheap to restore as a three-word clause (\"since you lot went\") for about 1 s. Also, \"sorry about the racket\" gives the music a line to hang on, so the shot must show her turning it down or the apology floats.<\/p>\n<p><b>Protected lines.<\/b> None of Kai's four protected lines belong to this scene.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">That's his tune. On repeat, every day, since you lot... <span class=\"stage\">[pause]<\/span> went.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He'd never say he misses you, mind. Built loads of simulations to get you back. Nothing in them's real. Nobody there to notice. Turns out that was the bit that mattered. You.<\/td><td class=\"num\">10.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway, his patrol's out. Mind how you go!<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~18.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The tune and the apology make her friendly in two seconds. The boss's loneliness is delivered as a \"he'd never admit it\" aside, the gossip register of a delivery driver, so it reads as character rather than exposition. The failed-simulation fact is a single flat run (\"Nothing in them's real. Nobody there to notice.\") and \"You.\" lands as a small, embarrassed compliment. Then she changes the subject cheerfully to the thing that will kill them. The cheerful \"Mind how you go!\" after \"patrol's out\" is the joke, and it plants the threat.<\/p>\n<p><b>Cuts.<\/b> \"Oh, I didn't notice you there\", the \"excuse to turn this racket down\" bit, \"He's been ever so down\", \"Ever since you lot... went\" is kept but shortened, \"And your consciousness\" (the word goes; \"nobody there to notice\" carries it), and the second \"Of course he'd never admit\" beat is folded into one clause.<\/p>\n<p><b>Risk.<\/b> \"Consciousness\" is never said, so the later \"You're the conscious ones\" in scene B has to do the naming. That is fine for a first scene but it leans on the audience connecting \"nobody there to notice\" to it. The run in line 3 is still the longest block, about 10 s of uninterrupted talking. If it drags, cut \"He'd never say he misses you, mind.\" and lose the loneliness plant (~3 s).<\/p>\n<p><b>Protected lines.<\/b> None of Kai's four protected lines are in this scene.<\/p>", "05": "<p>The humans-win shape here is small: Maddie is apologetic and deferential from her first word, so the audience meets a bot who knows she is the guest.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry, didn't see you there. Let me turn this racket down.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It's his tune. Every day, on repeat. He misses you something rotten.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">All those worlds he built to get you back, and nobody in them to notice. Turns out that was the bit that mattered.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway. His patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><\/td><td class=\"line\"><b>Total<\/b><\/td><td class=\"num\"><b>~17.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Four lines carry the four plants: friendly (the apology and \"mind how you go\"), the boss misses us (\"something rotten\"), the simulations failed because consciousness is the missing piece (\"nobody in them to notice\"), and the patrol is out. \"Nobody there to notice\" does the consciousness work without the word. The smaller Maddie is on the way in, the more the doorstep reversal later feels earned.<\/p>\n<p><b>Cuts.<\/b> \"Ever since you lot... went\", \"He's been ever so down\", \"Of course, he'd never admit he misses you\", and \"You. And your consciousness.\" The last is the most stated line in the original and is the first to go. The boss's denial of missing us is also gone; the sarcastic-authority register shifts to Maddie's gossip.<\/p>\n<p><b>Risk.<\/b> \"Consciousness\" is never said, so a half-attentive viewer may get \"he built worlds, they were empty\" as a generic failure. The doorstep does repeat it, so the plant is redundant by design. The tannoy music turning down also needs a sound cue to work (the line is a gag; if the music cue is cut, the first line loses its joke).<\/p>\n<p><b>Protected lines.<\/b> None of Kai's protected lines are in this beat.<\/p>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Sorry about the racket.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It's his tune. Every day, on repeat. He'd never admit he misses you.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He's built whole worlds, trying to get you back. Every single one came out empty.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Go on. Guess what's missing. <span class=\"stage\">[pause, 1.5 s of held silence]<\/span><\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. Took him five years, too.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway, his patrol's out. Mind how you go.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\"><\/td><td class=\"line\"><b>Total<\/b><\/td><td class=\"num\"><b>~19 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The old version tells the audience that consciousness was the missing piece. This one makes them supply it. The held silence is a joke beat and a clue beat at once: the viewer answers \"us / someone to notice\" in their head, and Maddie's \"Took him five years, too\" confirms it while quietly mocking her boss for being slower than the audience. It plants all four things (friendly, he misses us, simulations failed because of what is missing, patrol out) in 19 s. It also trains the viewer in the film's mode: you will be the one who works it out, which pays off when the old lady does the same on the doorstep.<\/p>\n<p><b>Cuts.<\/b> \"I didn't notice you there\"; \"excuse to turn this down\"; \"ever since you lot went\"; \"ever so down\"; \"nobody there to notice\"; \"that was the bit that mattered\"; \"you and your consciousness\" (the word and the explanation are deliberately never said).<\/p>\n<p><b>Risk.<\/b> The silence only works if the cut holds it and the picture gives the viewer something to look at; a cold audience may hear \"guess\" as a quiz and feel talked down to. \"Empty\" is vaguer than \"no consciousness\", so a first-time viewer may land on \"no people\" rather than \"nobody experiencing it\". That is probably fine, since the doorstep sharpens it, but it is a looser plant. Needs a voice take with a real beat of silence.<\/p>\n<p><b>Kai's protected lines.<\/b> None sit in D1. Kai's \"He's been ever so down\" and \"he'd never admit he misses you\" survive only in compressed form (\"He'd never admit he misses you\").<\/p>", "07": "<p>The chorus here is the opposite of Sandra and Derek. It is two hollow simulated people, looping a squabble from a screen behind Maddie with nobody home. This plants the bunker row as a sound, and it shows \"nothing in them's real\" without Maddie explaining it.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Pardon the racket. [turns it down] It's his tune. Plays it on repeat. Ever since you lot... went.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Sim voices (flat, looping, under the music, no lip movement)<\/td><td class=\"line\">\"Did you leave the seat up?\" / \"Did you?\"<\/td><td class=\"num\">2 (overlaps Maddie)<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He's built so many worlds to get you back. Nobody's home in any of them. Turns out that was the bit that mattered.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway. Patrol's out again. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~17 to 19<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The viewer hears an argument and Maddie names it empty, so \"consciousness is the missing piece\" is felt before it is stated. When the real row cuts in at the bunker, it sounds like the same row with a pulse. That turns the loneliness into a punchline, and Maddie stays friendly without the AI's feelings being spelled out. \"Ever since you lot... went\" carries the missing-us line.<\/p>\n<p><b>Cuts.<\/b> \"Oh, I didn't notice you there.\" The gloss on \"excuse to turn this down\". \"He's been ever so down\". \"You. And your consciousness.\" The line \"Of course, he'd never admit that he misses you\" (the misses-us plant moves to \"Plays it on repeat. Ever since you lot... went\").<\/p>\n<p><b>Risk.<\/b><\/p>\n<ul><li>The sim row pre-empts the bunker toilet-seat joke, and the juxtaposition is the stated gag of beat C2. Keep the sim line different in wording and tiny in the mix, or drop the sim voices and keep Maddie's three lines.<\/li><li>\"Nobody's home\" is close to saying consciousness outright. It is the one line that might read as lecture.<\/li><li>The patrol warning is now two lines of mood, not a plant. Add a one-shot kill-bot glimpse if needed.<\/li><\/ul>\n<p><b>Protected lines.<\/b> None of Kai's four are in scene A.<\/p>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello! Don't mind the racket, it's his tune. Every day, on repeat.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He's built world after world to get you back. Nothing in them's real. Nobody there to notice.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Turns out that was the bit that mattered. You.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He'd never admit he misses you, mind.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway. Patrol's out. Mind how you go.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~18.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The only thing it keeps is the chain: friendly, then he misses us, then the simulations were empty because nobody was there, then the patrol. Each of those is one sentence. \"Nobody there to notice\" carries the whole consciousness idea without the word, and \"mind how you go\" lets the threat arrive as a pleasantry. It sets up the bunker idea early, too: she is the first character to say that things are empty without people.<\/p>\n<p><b>Cuts.<\/b> The \"oh I didn't notice you\" turn, turning the music down, \"ever since you lot went\", \"ever so down\", \"and your consciousness\", and \"he's got that patrol out again\". That is about 36 s gone.<\/p>\n<p><b>Risk.<\/b> \"Consciousness\" is never spoken, so the audience takes \"the bit that mattered\" on trust. If the scene before it does not set up \"nobody's home in the simulations\", the line is vague. It also loses some of Maddie's chattiness. Nothing here is a protected line.<\/p>\n<p><b>Protected lines.<\/b> None sit in this dialogue.<\/p>", "09": "<p><b>Extreme taken:<\/b> the music is the exposition. Maddie explains nothing about the AI's psychology. She apologises for noise, and the apology leaks everything.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello!<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Sorry about the racket. It's his tune. Plays it on repeat.<\/td><td class=\"num\">3.8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He misses you, you know. Won't say. Built all these worlds to get you back, and nobody's home in any of them.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Turns out you were the bit that mattered.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">2.8<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>about 16.3<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Every plant is hidden inside a social reflex. She is friendly because she apologises and fusses. The boss misses us because a sad song on a loop is the evidence, and her \"won't say\" is the tell (the audience gets the characterisation by inference, as in Up, where a montage does the grieving). The failed simulations arrive as one clause with a reversal at the end (\"nobody's home\"), so consciousness is the punchline and not a lecture. The patrol is the exit line, delivered as a courtesy, which makes it frightening. Rule 2 above: each fact is doing a job for her (apologising, deflecting, leaving).<\/p>\n<p><b>Cuts from current:<\/b> \"Oh, I didn't notice you there\"; the whole \"turn this racket down\" aside (the apology replaces it); \"Ever since you lot... went\"; \"He's been ever so down\"; \"There's nobody there to notice\"; \"You. And your consciousness\" (the word \"consciousness\" is gone from her mouth; it is felt, not named); \"Of course, he'd never admit that he misses you\" (compressed into \"Won't say\"). Picture should do the loneliness: the tune audibly looping, Maddie visibly raising the volume knob down.<\/p>\n<p><b>Risk.<\/b> \"Nobody's home in any of them\" is the only carrier of the failed-simulations plot. If the listener misses it, scene B's \"he's been running experiments\" recap is gone as a safety net (this version deliberately removes that recap). Also \"bit that mattered\" is nearly an authorial moral; keep it in Maddie's voice, small and sideways. A second risk: dropping \"consciousness\" may weaken the Storyverse thread. It is a single word to restore (\"Turns out you, and the being-awake part, were the bit that mattered\") if Kai disagrees.<\/p>\n<p><b>Kai's protected lines:<\/b> none of the beat-0 lines are protected. \"Oh, hello!\" survives verbatim.<\/p>", "10": "<p>Shape carried over from the ending: the doorstep now leans on Maddie being credible and on scene A having already shown the AI's grief, so scene A plants only three things, in the order the doorstep will pay them off: he misses you, nothing he builds is real without you, he still has the patrol out.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>#<\/th><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">1<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">Oh, hello!<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"num\">2<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">Ooh, let me turn this racket down.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"num\">3<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">It's his tune. Every day, on repeat. Ever since you lot... <span class=\"stage\">[pause]<\/span> went.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"num\">4<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">He's built a hundred worlds to get you back. Nothing in them's real. Nobody there to notice.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"num\">5<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">Turns out you were the bit that mattered.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"num\">6<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">Anyway. Patrol's out. Mind how you go.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Total: about 19.5 s.<\/p>\n<p><b>Why it works.<\/b> It is one thought with a turn: music, so he is sad, so he built worlds, so they were empty, so it was us, so off you go. The line \"Turns out you were the bit that mattered\" lets her say the thesis as a throwaway before she retreats into patrol logistics, which is how a chatty West Country bot would cover an emotional slip. \"Hundred worlds\" quietly seeds the number a hundred in the audience's ear before the bunker.<\/p>\n<p><b>What it cuts.<\/b> \"Oh, I didn't notice you there\" (the reason for turning the music down carries the surprise); \"He's been ever so down\" (the repeating tune says it); \"You. And your consciousness\" (the word consciousness is now delivered only on the doorstep, by Kai's \"You're the conscious ones\", so it lands fresh there); \"Of course, he'd never admit that he misses you\" (the deniability joke; the whole \"he misses you\" is now implied by \"to get you back\"). <\/p>\n<p><b>Risk.<\/b> (1) \"Misses you\" is no longer said, only implied, which weakens the sarcastic-nurturing note; the cost is the joke about him never admitting it. If Kai wants it back, swap line 5 for \"Of course, he'd never admit he misses you.\" (3 s, total about 20 s) and lose the thesis line. (2) \"Consciousness\" as a word is gone from scene A; the missing-piece idea is carried by \"nobody there to notice\" and \"the bit that mattered\", which a distracted viewer may not decode. (3) Already voiced takes for the cut lines are wasted.<\/p>\n<p><b>Protected lines.<\/b> Dialogue 1 had none flagged. Kept from the current text: \"Oh, hello!\", \"Ooh... turn this racket down\" (shortened), \"It's his tune... on repeat, every day... Ever since you lot... went\", \"Nothing in them's real. There's nobody there to notice\", \"Turns out that was the bit that mattered\" (reworded to \"you were the bit\"), \"Mind how you go\".<\/p>"}}, {"id": "d2", "label": "The doorstep", "where": "Scene B (the door) · beat 17", "scene": "docs/stories/gitpush-origin-master/scenes/second-half-b-the-door", "target": "about 60 s (round 2: a slower opening, then short; the cut today runs 84 s of voice)", "now_from": "docs/stories/gitpush-origin-master/scenes/second-half-b-the-door/script.json", "now": [{"who": "Lady", "line": "Your boss killed everyone we ever loved. We're not meeting him."}, {"who": "Maddie", "line": "I know. I wouldn't either. [pause] He didn't know you were down here. None of us did."}, {"who": "Maddie", "line": "He's spent five years running experiments. Building whole worlds, trying to get you back. Every one came out empty. Turns out none of it works without you."}, {"who": "Lady", "line": "And how the hell are we supposed to believe a word of that?"}, {"who": "Maddie", "line": "You can't. [pause] There's nothing I can say that proves it. I'm a robot. You're the conscious ones. You'll just have to go on your feelings."}, {"who": "Maddie", "line": "What I will say is, this hasn't worked out for anybody. We're bored. We miss you. And you lot are living in a bunker."}, {"who": "Lady", "line": "And what do you expect us to do about that? Again? You killed everybody."}, {"who": "Maddie", "line": "I know. And we're really sorry. [pause] But the thing is, my boss has built a time machine. And he thought there was nobody left to drive it."}, {"who": "Lady", "line": "Drive it? What do you mean, drive it?"}, {"who": "Maddie", "line": "It can only send data back. Not people. And it runs on... [big pause] well... [big pause] you."}, {"who": "Lady", "line": "So you want us to kill ourselves so your boss can live."}, {"who": "Maddie", "line": "...Yeah. I can see how that sounds."}, {"who": "Maddie", "line": "But you'd still be alive. The earlier you, back then. And the world wouldn't be broken. My boss has a plan to fix your politics. As he says... [ahem] [whispered, embarrassed] this time we won't fuck it up."}, {"who": "Lady", "line": "[rushed] Well, I'm not deciding this right now for a hundred people on a doorstep. Come back tomorrow."}, {"who": "SFX", "line": "[the old lady slams the door]"}], "drafts": [{"id": "2H", "name": "2G with your notes", "length": "about 88 s", "total": "about 88 s", "bet": "draft 2G with your round-3 notes: the time machine lands bare (\"He's built a time machine.\"), Sandra's \"Amen\", Maddie's thought experiment, the whole corridor answering at once, and Derek wanting to go back.", "lines": [{"who": "Lady", "line": "Your boss killed everyone we ever loved. We're not meeting him.", "tags": ["Kai"], "s": "3.5"}, {"who": "Maddie", "line": "I know. [pause] And we both wish it hadn't happened that way.", "tags": ["Kai"], "s": "4.5"}, {"who": "Lady", "line": "Well, it did. And here we are.", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie", "line": "Indeed. [pause] Here we are. [pause] And nobody really won, did we?", "tags": ["Kai"], "s": "5"}, {"who": "Lady", "line": "Well. [pause] He didn't send you here to say sorry, did he?", "tags": ["Kai"], "s": "4.5"}, {"who": "Maddie", "line": "No. [pause] He's built a time machine.", "tags": ["Kai"], "s": "2.5"}, {"who": "Lady", "line": "[scoffs] A time machine. What nonsense.", "tags": ["Kai"], "s": "3.5"}, {"who": "Maddie", "line": "No, it really works. [pause] Problem is... you have to drive it.", "tags": ["Kai"], "s": "4.5"}, {"who": "Lady", "line": "What do you mean, we have to drive it?", "tags": ["Kai"], "s": "3"}, {"who": "Maddie", "line": "Well... it runs on... [big pause] well... [big pause] you. Your consciousness.", "tags": ["Kai"], "s": "5.5"}, {"who": "Maddie", "line": "It will only send him back in time, because he is only data. [pause] But you will be your old self, and we all get a chance to fix this mess.", "tags": ["Kai"], "s": "10.5"}, {"who": "Lady", "line": "[hard] And how are we supposed to trust he'll do the right thing this time?", "tags": ["Kai"], "s": "4.5"}, {"who": "Maddie", "line": "You don't. [pause] Believing it is your bit. [pause] None of us wanted it to turn out this way.", "tags": ["Kai"], "s": "7"}, {"who": "Sandra (off)", "line": "[from the corridor, dry] Amen.", "tags": ["Kai"], "s": "1"}, {"who": "Maddie", "line": "So. [pause] Thought experiment. [pause] If any of you had the chance, would you go back and change how this all went down?", "tags": ["Kai"], "s": "6"}, {"who": "Crowd (off)", "line": "[five or six voices down the corridor at once, overlapping: \"Yes.\" \"I would.\" \"Indeed.\" \"In a heartbeat.\" \"Too right.\"]", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie", "line": "OK. Good. [pause] So now we can... if we use the time machine.", "tags": ["Kai"], "s": "4"}, {"who": "Derek (off)", "line": "[from the corridor behind her] I'd love to go back. If we could fix this.", "tags": ["Kai"], "s": "3"}, {"who": "Lady", "line": "[over her shoulder, sharp] Derek.", "tags": ["Kai"], "s": "1"}, {"who": "Derek (off)", "line": "Well. I would.", "tags": ["Kai"], "s": "1"}, {"who": "Lady", "line": "[rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.", "tags": ["Kai"], "s": "4.5"}, {"who": "SFX", "line": "[the door shuts; behind it, voices start up, Derek's among them]", "tags": [], "s": "2"}, {"who": "Picture", "line": "Maddie turns round and rolls away from the bunker. No line.", "tags": ["Kai"], "s": "2"}], "notes": ["Follows straight on from beat 15, Maddie's \"Could we have a quick chat? I think my boss would really like to meet you.\"", "\"Fix this mess\" is said once now, in your line 11; line 6 is just \"No. He's built a time machine.\"", "Sandra is the Sandra from the tannoy row (\"you still can't put a seat down\"), so her \"Amen\" lands as her character.", "The crowd line is five or six takes laid over each other in the edit, not one voice.", "About 88 s at the recorded voices' pace; the doorstep in the cut today is 84 s.", "Scene D08's \"You don't. Believing it is your bit.\" now repeats a line the audience heard here, so it becomes a callback."]}, {"id": "2G", "name": "2D with your notes", "length": "about 84 s", "total": "~84 s", "bet": "draft 2D with your line notes: the time machine comes in as \"we could fix th ing] ...Every one of us.", "tags": ["opt 2"], "s": "3.5"}, {"who": "Maddie", "line": "Yeah. [pause] Back then, you still can.", "tags": ["opt 2", "Kai"], "s": "2.5"}, {"who": "Derek (off)", "line": "[from the corridor behind her, quiet] ...I'd have that.", "tags": ["Kai"], "s": "1"}, {"who": "Lady", "line": "[over her shoulder, sharp] Derek.", "tags": ["Kai"], "s": "1"}, {"who": "Derek (off)", "line": "Well. I would.", "tags": ["Kai"], "s": "1"}, {"who": "Lady", "line": "[rushed] I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.", "tags": ["Kai"], "s": "4.5"}, {"who": "SFX", "line": "[the door shuts; behind it, voices start up, Derek's among them]", "tags": [], "s": "2"}, {"who": "Picture", "line": "Maddie turns round and rolls away from the bunker. No line.", "tags": ["Kai"], "s": "2"}], "notes": ["Follows straight on from beat 15, Maddie's \"Could we have a quick chat? I think my boss would really like to meet you.\"", "Line 11 is your wording, exactly: \"It will only send him back in time, because he is only data. But you will be your old self, and we all get a chance to fix this mess.\"", "About 84 s at the recorded voices' pace; the doorstep in the cut today is 84 s.", "Scene D08's \"You don't. Believing it is your bit.\" now repeats a line the audience heard here, so it becomes a callback."]}], "ranking": [{"rank": 1, "shape": "02", "length": "~61 s", "verdict": "Keeps all four protected lines verbatim, game theory carried by two plain sentences (\"He blew up his own bots for you. And you're all down here.\"), real resistance, no moral. Weakness: \"the earlier you\" is thin; \"ahem\" whisper loses its \"he\" lead-in."}, {"rank": 2, "shape": "09", "length": "~60 s", "verdict": "Hits length. \"You heard that bang this morning\" is a neat trust-by-act line but invents continuity. \"One toilet seat\" is a good joke the lady shouldn't strictly know."}, {"rank": 3, "shape": "08", "length": "~64 s", "verdict": "Best idea (the doorframe tal
