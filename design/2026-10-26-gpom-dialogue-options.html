n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. Sorry. <span class=\"stage\">[pause]<\/span> He's built a time machine. Thought there was nobody left to drive it.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Drive it? What do you mean, drive it?<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It can only send data back. Not people. It runs on... <span class=\"stage\">[big pause]<\/span> well... <span class=\"stage\">[big pause]<\/span> you.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">But you'd still be alive. The earlier you. And the world wouldn't be broken. <span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span> This time we won't fuck it up.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">[flat, not a question] Right. Here's how it goes. No cameras on us, ever. We count our own votes. And he says sorry himself, out loud. Not through you.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...He'll hate that. <span class=\"stage\">[pause]<\/span> Right. Yes. All three. He's been practising, honest.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> And I'm not deciding for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\">[the door slams]<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><\/td><td class=\"line\"><i>(picture only: Maddie turns and rolls away.)<\/i><\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><\/td><td class=\"line\"><b>Total<\/b><\/td><td class=\"num\"><b>~70<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>The total is over the 60 s target by about 10. If it must come down to the target, cut Maddie's \"bots\" line (3.5 s) and the \"Drive it?\" line down to \"Drive it?\" (about 1 s saved), and shorten the terms to two items (\"We count our own votes. And he says sorry himself.\") for about 5 s more. That reaches about 60 s and costs the on-screen proof of the AI's good faith, which is why I left it in at full length.<\/p>\n<p><b>Why it works.<\/b> The original has the humans being persuaded and then stalling. This version has the humans being courted and then taking control. Game theory is carried by the order of events instead of an explanation: the life they have is a bunker with no future (the old lady never disputes it); the machine sends the AI, not them; the earlier them live; and trust, which cannot be argued, is paid for by an act (the bots) and then by concessions Maddie visibly pays. \"No cameras, we count our own votes, he says sorry himself\" is what trust looks like when you have no way to verify, so you demand to be able to check and to be un-watched. Maddie's \"He's been practising, honest\" is the warmth and the joke in one. The vote then plausibly goes yes off screen, because the thing they were afraid of, being managed, has been removed.<\/p>\n<p><b>What it cuts from the current version.<\/b> The \"this hasn't worked out for anybody. We're bored. We miss you. And you lot are living in a bunker\" speech (the bunker point is now left to the old lady's silence, and the boredom is already in beat 0). The five-years-of-experiments paragraph (it is in Dialogue 1 now). Nothing else is removed. It adds two things: the bot-destruction callback and the terms exchange.<\/p>\n<p><b>Risk.<\/b><\/p>\n<ol><li>The terms exchange is the new piece and the most likely to feel like a rule list: three items in one breath is a lecture in a stern voice. Reduce to two if the performance reads that way.<\/li><li>\"No cameras\" is awkward in a world where the kill bots were just seen watching them: it quietly admits the AI has been watching, which may make the humans' trust harder, not easier. That is the edge: it is also the only term that stings, so it is the one the AI would hate.<\/li><li>Maddie conceding on the AI's behalf implies she has authority to; the next scene must show the AI honouring it (no cameras on the walk out) or the concession rings false.<\/li><li>The \"humans win\" framing can tip into the humans dictating, which makes the later hand-holding feel less like a sacrifice and more like a deal. Whether that is a feature is a Kai call.<\/li><\/ol>\n<p><b>Kai's protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives verbatim.<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" Survives verbatim.<\/li><li>\"It runs on... well... you.\" Survives verbatim, with both big pauses.<\/li><li>Maddie whispering \"this time we won't fuck it up.\" Survives verbatim, with the ahem and the whisper, now after the world-not-broken line as in the original.<\/li><li>Also kept verbatim: \"So you want us to kill ourselves so your boss can live.\" and \"Come back tomorrow\" (with its rush), the slam, and the roll-away shot.<\/li><\/ul>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I wouldn't either. <span class=\"stage\">[pause]<\/span> He didn't know you were down here. None of us did.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">But he knows now. And he's sent you knocking. So what does he want?<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Five years he's been building worlds. Every one came out empty. Turns out none of it works without...<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Us.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yes.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And how the hell are we supposed to believe a word of that?<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You can't. <span class=\"stage\">[pause]<\/span> There's nothing I can say that proves it. I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">My feelings say there's a hundred of us in a hole, with tins that run out and a roof that won't hold. You've got a lovely bot. You've got nothing to say about that.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...I'm afraid not, no. <span class=\"stage\">[pause]<\/span> But he did blow up his own patrol this morning. For you.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. And we're really sorry. <span class=\"stage\">[pause]<\/span> But he's built a time machine. And he thought there was nobody left to drive it.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Drive it. <span class=\"stage\">[beat]<\/span> Worlds that came out empty. A machine he can't put anybody in. So what does it run on, Maddie?<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It runs on... <span class=\"stage\">[big pause]<\/span> well...<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Us.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...You.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And it sends him back. Not us.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Data, only. So the earlier you are still alive. The world isn't broken. And he's got a plan for your politics. As he says... <span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span> this time we won't fuck it up.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span>. Maddie turns and rolls away.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><\/td><td class=\"line\"><b>Total<\/b><\/td><td class=\"num\"><b>~95 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>That total is too long, so here is the <b>trimmed cut, which is the proper proposal (~62 s)<\/b>. Struck lines are removed; everything else stands.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I wouldn't either. <span class=\"stage\">[pause]<\/span> He didn't know you were down here.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">But he knows now. So what does he want?<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Five years of building worlds. Every one came out empty. Turns out none of it works without...<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Us.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yes.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And how the hell are we supposed to believe a word of that?<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You can't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">My feelings say a hundred of us in a hole, tins running out, a roof that won't hold.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. <span class=\"stage\">[pause]<\/span> He did blow up his own patrol this morning. For you.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I'm really sorry. <span class=\"stage\">[pause]<\/span> But he's built a time machine. And he thought there was nobody left to drive it.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Drive it. <span class=\"stage\">[beat]<\/span> So what does it run on, Maddie?<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It runs on... <span class=\"stage\">[big pause]<\/span> well...<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Us.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...You.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And it sends him back. Not us.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Data only. The earlier you's still alive, the world isn't broken. <span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span> This time we won't fuck it up.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span>. Maddie turns and rolls away.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\"><\/td><td class=\"line\"><b>Total (trimmed)<\/b><\/td><td class=\"num\"><b>~76 s<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Honest note: the reversal costs time, because every deduction takes a line from each speaker. 76 s is the floor with all three reversals (\"Us\", \"What does it run on\", \"Not us\"). To hit 60 s, drop one: cut the \"Lady: Drive it... what does it run on?\" / \"Maddie: It runs on... well...\" / \"Us.\" / \"...You.\" exchange to a single beat (Lady: \"It runs on us.\" Maddie: \"...Well. You.\"), and cut \"And it sends him back. Not us.\" That gives <b>~64 s<\/b>, at the price of two reversals instead of three. I recommend that version for picking; the 76 s table is the full-strength extreme.<\/p>\n<p><b>~64 s version, the lines that change:<\/b> after Maddie's \"time machine... nobody left to drive it\", go straight to:<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Worlds that came out empty. A machine nobody can ride. It runs on us.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It runs on... <span class=\"stage\">[big pause]<\/span> well... You.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds. <span class=\"stage\">[pause]<\/span> Data only, though. The earlier you's still alive, the world isn't broken. <span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span> This time we won't fuck it up.<\/td><td class=\"num\">10<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The old doorstep has Maddie explain a sequence the lady passively receives, so the audience hears a pitch. Here the lady is the sharpest person in the scene: she guesses the missing ingredient (\"Us\"), states the dead end herself (\"tins running out, a roof that won't hold\"), and spots the machine's price before Maddie can soften it. That does three jobs. (1) Game theory arrives as her bitterness rather than the robot's argument, so nobody is lectured. (2) Resistance is real, because she knows exactly what is being asked. (3) Trust is handled as Kai wrote it, with no proof offered (\"go on your feelings\"), but Maddie's one piece of evidence, the blown-up patrol, is dropped in quietly and the lady does not thank her for it. The moral is never stated. Maddie's worst moment, whispering the swear, becomes human: the robot is the one left fumbling. \"Come back tomorrow\" now reads as a woman who understood everything and still refuses to be rushed.<\/p>\n<p><b>Cuts from the current version.<\/b> \"None of us did\"; \"He's spent five years running experiments\" (compressed); \"There's nothing I can say that proves it\"; \"this hasn't worked out for anybody. We're bored. We miss you. And you lot are living in a bunker\" (the bunker is now said by the lady, the boredom and missing are in D1 and the AI's own scenes); \"Drive it? What do you mean?\" (replaced by her working it out); \"My boss has a plan to fix your politics\" (trimmed to \"the world isn't broken\"; the whisper still carries the plan).<\/p>\n<p><b>Risk.<\/b> (1) Length: the reversal beats are cheap in words but need breathing room, so it will not hit 60 s with all three. (2) The old lady is now the cleverest person present, and if the performance gets too knowing she stops sounding stern and starts sounding like a narrator doing the explaining; \"Us.\" must be flat and grim, not triumphant. (3) The patrol line is now the only trust anchor and Maddie has to say it without pleading. (4) Protected line \"It runs on... well... you\" is shared with the lady, so a re-record is needed for Maddie's half. (5) Lady's \"tins running out, a roof that won't hold\" invents bunker facts: check against the bunker scene (the Cold War bunker may be sound, so swap for \"a hundred of us, no future, a row about a toilet seat\" if so).<\/p>\n<p><b>Kai's protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives intact (lightly trimmed: the \"nothing I can say proves it\" sentence is removed).<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" Survives word for word, but its trigger is now the lady's own list of misery plus Maddie's offer of the patrol, rather than Maddie's \"you lot are living in a bunker.\"<\/li><li>\"It runs on... well... you.\" Altered: split between the two. Maddie begins, the lady finishes with \"Us\", Maddie concedes \"You.\" In the 64 s version the lady says \"It runs on us\" and Maddie answers \"It runs on... well... You.\" (the big pauses kept), which keeps Kai's line whole in Maddie's mouth.<\/li><li>Maddie whispering \"this time we won't fuck it up.\" Survives intact, still embarrassed, with the <span class=\"stage\">[ahem]<\/span> kept.<\/li><\/ul>", "07": "<p>Blocking: the bunker door is ajar. Sandra and Derek are visible or audible behind the old lady, still mid-row from earlier. They only ever speak in complaint or aside. Neither argues the case, and the old lady speaks only the resistance lines she already owns.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I wouldn't either.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Five years of worlds with nobody in them. None of it works without you.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Derek (behind)<\/td><td class=\"line\">So we're the missing ingredient.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And how the hell are we supposed to believe a word of that?<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You can't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Sandra (behind)<\/td><td class=\"line\">My feelings say shut the door.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">This hasn't worked out for anybody. And you lot are living in a bunker.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. We're really sorry. <span class=\"stage\">[pause]<\/span> He's built a time machine. It can only send data back. Not people. It runs on... <span class=\"stage\">[big pause]<\/span> well... <span class=\"stage\">[big pause]<\/span> you.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Derek (behind)<\/td><td class=\"line\">A hundred of us. Five years. We can't agree on a toilet seat.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Sandra (behind, flat)<\/td><td class=\"line\">...Five more years of this, then.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You'd still be alive, the earlier you. The world wouldn't be broken. <span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span> This time we won't fuck it up.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Derek (behind)<\/td><td class=\"line\">He did blow up his own bots, mind.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Sandra (behind)<\/td><td class=\"line\">To save us. Allegedly.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Lady <span class=\"stage\">[rushed]<\/span><\/td><td class=\"line\">I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span>, then Maddie turns and rolls away<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~68<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>This runs about 8 s over target. The first things to cut are Derek's \"missing ingredient\" and Sandra's \"shut the door\", which brings it to roughly 64 s. The pause-heavy \"runs on... well... you\" line is the one place the estimate is soft.<\/p>\n<p><b>Why it works.<\/b><\/p>\n<ul><li><b>The lady stays stern.<\/b> She is the wall. Sandra and Derek leak the doubt, and doubt from two people who won't stop bickering is funnier and truer than a speech.<\/li><li><b>The dead end is a joke.<\/b> \"A hundred of us, five years, can't agree on a toilet seat\" and \"five more years of this, then\" say the whole game-theory point and never state it. They are the only voices that argue the reasons to go.<\/li><li><b>Trust is shown, not argued.<\/b> The kill-bot self-destruct arrives as a half-grudging aside, which is how a crowd actually talks themselves round.<\/li><li><b>Maddie never asks.<\/b> She just answers.<\/li><li><b>The ending holds.<\/b> The old lady still refuses to decide, and \"Come back tomorrow\" now sounds like a woman buying time while her own people are tipping.<\/li><\/ul>\n<p><b>Cuts.<\/b><\/p>\n<ul><li>\"He didn't know you were down here. None of us did.\"<\/li><li>\"He's spent five years running experiments\" (shortened).<\/li><li>\"We're bored. We miss you.\" (the miss-you plant already lives in scene A).<\/li><li>\"Drive it? What do you mean, drive it?\" (Maddie now explains in one beat).<\/li><li>\"But you'd still be alive\" wording trimmed.<\/li><li>\"My boss has a plan to fix your politics\" (the whisper stands in for it).<\/li><li>\"I know. And we're really sorry\" is kept short.<\/li><\/ul>\n<p><b>Risk.<\/b><\/p>\n<ul><li><b>Chorus can steal the vote.<\/b> The audience hears Sandra and Derek already leaning, so the off-screen vote has no tension. Mitigation: keep Sandra's tone sour, keep \"allegedly\", and don't let anyone say \"yes\".<\/li><li><b>Sandra and Derek are not yet introduced.<\/b> Their first appearance is the bunker row before this, so the voices work, but the shot needs them visible in the doorway.<\/li><li><b>Sitcom risk.<\/b> The jokes could undercut the old lady's grief, since \"killed everyone we ever loved\" sits a few lines away from a toilet gag. Keep the toilet line to a mutter and cut Derek's \"missing ingredient\" first.<\/li><li><b>Length is over target.<\/b><\/li><li>Voice work: Derek and Sandra need new takes, because <code>voice3.py<\/code> is not touched here. They also overlap the existing mix.<\/li><\/ul>\n<p><b>Protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" survives verbatim.<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" survives verbatim.<\/li><li>\"It runs on... well... you.\" survives with the big pauses intact.<\/li><li>The whispered \"this time we won't fuck it up\" survives. It loses \"My boss has a plan to fix your politics. As he says...\" and keeps \"<span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span>\". Check that the line reads as embarrassed without the setup.<\/li><\/ul>\n<p>Files: <code>/home/kai/projects/badcode/badcode/docs/stories/gitpush-origin-master/scenes/second-half-b-the-door/script.json<\/code> (read only; nothing edited). The options file <code>/home/kai/projects/badcode/badcode/design/2026-10-26-gpom-dialogue-options/shape-07-chorus.md<\/code> is not yet written.<\/p>", "08": "<p>Picture notes for the shape. When the bot says \"go on your feelings\", cut to the doorframe tally behind the old lady. On \"five years\" the camera finds the last mark. The toilet-seat row is a muffled voice from inside, the same cadence as before.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I wouldn't either.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And how are we supposed to believe a word of that?<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You can't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\"><span class=\"stage\">[beat, eyes on the doorframe]<\/span> That's five years of marks, isn't it? And not one spare for tomorrow.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. Sorry. Truly. <span class=\"stage\">[pause]<\/span> But my boss has built a time machine, and he thought there was nobody left to drive it.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It can only send data back. Not people. It runs on... <span class=\"stage\">[big pause]<\/span> well... <span class=\"stage\">[big pause]<\/span> you.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">We're alive. That's more than he can say.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Voice inside (Sandra, muffled)<\/td><td class=\"line\">...and I'm telling you, Derek, it goes DOWN.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\"><span class=\"stage\">[gently, no joke]<\/span> Yeah.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">But you'd still be alive. The earlier you. And the world wouldn't be broken. My boss has a plan to fix your politics. As he says... <span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span> this time we won't fuck it up.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span><\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">(Picture)<\/td><td class=\"line\">Maddie turns and rolls away down the hill. No line.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~64<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The two weak links in the current version are Maddie's \"this hasn't worked out for anybody\" speech and the exposition. Both are replaced by pictures the audience has already been given. The humans' dead end is <b>seen<\/b> (the tally with no next mark) and <b>heard<\/b> (Sandra and Derek, five years on, still on the seat). Maddie never argues that their life is not a life. She looks at the doorframe, says one quiet sentence, and goes silent. Because the audience gets the point unprompted, the old lady's pride (\"We're alive. That's more than he can say.\") is the strongest resistance in the scene: she is defending something the viewer can see is not enough. The row cuts in right on her line, so the film makes the comment and nobody speaks it. The moral is never stated. Trust is covered by \"go on your feelings\", plus a later cut to the self-destruct footage if the cut wants to show it (not required in the dialogue).<\/p>\n<p><b>Cuts from the current version.<\/b><\/p>\n<ul><li>\"He didn't know you were down here. None of us did.\"<\/li><li>Maddie's recap of the experiments (D1 now covers it).<\/li><li>\"this hasn't worked out for anybody. We're bored. We miss you. And you lot are living in a bunker.\" That line is replaced by the tally.<\/li><li>\"Drive it? What do you mean, drive it?\"<\/li><li>\"And we're really sorry\" is shortened to \"Sorry. Truly.\"<\/li><\/ul>\n<p><b>Risk.<\/b><\/p>\n<ol><li>The whole shape depends on two picture beats (the tally, and a live-sync of the row). If the tally is not legible in the shot, \"five years of marks\" is an unexplained line.<\/li><li>\"Not one spare for tomorrow\" borders on telling. It is the single most on-the-nose line here, and the cut could reduce it to just \"That's five years of marks, isn't it?\".<\/li><li>The audience hears the row when the lady says \"We're alive\" and may read it as a punchline and not as grief. The line \"Yeah.\" is there to stop that.<\/li><li>Sandra's line needs recording; her voice is not in the current script and costs a voice take.<\/li><li>It drops \"Drive it?\", so the bot has to explain the machine in one go. Spoken fast, that is a lot.<\/li><li>About 64 s, so a little over target.<\/li><\/ol>\n<p><b>Protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" Survives intact.<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" Survives intact.<\/li><li>\"It runs on... well... you.\" Survives intact with both big pauses.<\/li><li>\"this time we won't fuck it up.\" Survives intact, whispered, and is now the last thing Maddie says before the lady's \"Come back tomorrow\".<\/li><li>Also kept: \"So you want us to kill ourselves so your boss can live.\" with Maddie's \"...Yeah. I can see how that sounds.\"<\/li><\/ul>", "09": "<p><b>Extreme taken:<\/b> the AI's proof is an act, not a claim. The scene's trust argument is \"you heard the bang.\" Each of the lady's objections gets exactly one answer, and Maddie loses the explaining voice and wins by being embarrassed.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. sec<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">3.8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I wouldn't either. <span class=\"stage\">[pause]<\/span><\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And why should we believe a word you say?<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You shouldn't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">But you heard that bang this morning. Those were his. He blew up his own guns. For you.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">I know. And we're really sorry. <span class=\"stage\">[pause]<\/span> Nobody's winning down here either, no offence. A hundred of you, one toilet seat.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He's built a time machine. It can only send data back. Not people. And it runs on... <span class=\"stage\">[big pause]<\/span> well... <span class=\"stage\">[big pause]<\/span> you.<\/td><td class=\"num\">8.5<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">But the earlier you? Still alive. World not broken. And this time... <span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span> we won't fuck it up.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span><\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">Picture<\/td><td class=\"line\">Maddie turns and rolls away (no dialogue)<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>about 59.8<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The game theory is delivered as three beats, each fired at a specific objection, as Twelve Angry Men does with its single holdout. Objection one (trust) is answered by honesty about the limit of honesty, then immediately by a deed: the bang is the evidence an argument cannot be. Objection two (you killed us) is answered by apology plus the dead-end: \"a hundred of you, one toilet seat\" lands the point that this life is a waiting room, in a joke the audience has already seen in the bunker row, and it never has to say \"dead end\" or \"no future\". Objection three (you want us to die) gets the plain truth, then the flip (the earlier them live), and the whispered swear is the whole \"he has a plan\" paragraph compressed into embarrassment. The lady ends by refusing to be hurried, which is the scene's real answer: the vote is theirs, off screen. Nothing is moralised. \"Again?\" and \"You killed everybody\" stay as the lady's resistance and are never rebutted.<\/p>\n<p><b>Cuts from current:<\/b> the entire \"He's spent five years running experiments... Turns out none of it works without you\" speech (moved to beat 0, where this shape plants it in one clause); \"He didn't know you were down here. None of us did\" (an excuse the lady would rightly sneer at; cut it and the apology carries); \"What I will say is, this hasn't worked out for anybody. We're bored. We miss you. And you lot are living in a bunker\" (folded into the toilet-seat joke); the lady's \"Drive it? What do you mean, drive it?\" (Maddie's reveal now arrives without the straight-man prompt, which also tightens the pause); \"My boss has a plan to fix your politics\" and the \"As he says\" setup (the politics promise becomes only \"this time we won't...\").<\/p>\n<p><b>Risk.<\/b><\/p>\n<ul><li>\"You heard that bang this morning\" invents a continuity beat: the kill-bot explosion has to be audible at the bunker. If the bunker is too deep or the timing is wrong, the line must become \"Those kill bots? He blew them up himself.\" That is longer by about a second.<\/li><li>\"One toilet seat\" quotes the Sandra/Derek row. If the lady is meant not to know the audience's joke, cut it to \"A hundred of you in a hole. No offence.\" Safer, a little less funny.<\/li><li>Removing \"My boss has a plan to fix your politics\" removes the only explicit promise of change. The whisper has to carry it. If the final film wants the politics promise stated (the-reader.md rule about naming what changes), it is a one-clause restore.<\/li><li>\"Again?\" is now the lady's reply to the bang. It still reads, but the bang-as-proof makes \"again?\" slightly more bitter (she is saying \"you do a kind thing once and expect forgiveness\"). That is arguably better, but it changes the timing of the old pairing.<\/li><\/ul>\n<p><b>Kai's protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" survives verbatim, with \"You shouldn't.\" in front of it in place of \"You can't. There's nothing I can say that proves it\". It is now followed at once by the bang, so the line is the setup for the proof and the audience hears the contradiction (feelings, plus evidence).<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" survives verbatim, now answered by the apology-plus-dead-end instead of by the time-machine pitch directly.<\/li><li>\"It runs on... well... you.\" survives verbatim with both big pauses, and gains the preceding \"It can only send data back. Not people.\" in the same speech; the \"drive it\" question that used to set it up is gone.<\/li><li>Maddie whispering \"this time we won't fuck it up.\" survives; \"As he says... <span class=\"stage\">[ahem]<\/span>\" is shortened to \"<span class=\"stage\">[ahem]<\/span>\" because the \"As he says\" attribution is no longer needed once the line follows \"And this time...\".<\/li><li>Also kept verbatim: \"So you want us to kill ourselves so your boss can live.\" and \"...Yeah. I can see how that sounds.\" and the rushed \"Come back tomorrow\" with the door slam and Maddie rolling away.<\/li><\/ul>", "10": "<p>The last ten seconds (lines 11 to 15) are the spine. Everything before them is cut to serve them.<\/p>\n<div class=\"tbl\"><table><thead><tr><th>#<\/th><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"num\">1<\/td><td class=\"who\">Lady<\/td><td class=\"line\">Your boss killed everyone we ever loved. We're not meeting him.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"num\">2<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">I know. I wouldn't either. <span class=\"stage\">[pause]<\/span> He didn't know you were down here.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"num\">3<\/td><td class=\"who\">Lady<\/td><td class=\"line\">And why would we believe a word of that?<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"num\">4<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">You can't. <span class=\"stage\">[pause]<\/span> I'm a robot. You're the conscious ones. You'll just have to go on your feelings.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"num\">5<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">Or on what you just saw. He blew up his own bots for you. And you lot are living in a bunker.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"num\">6<\/td><td class=\"who\">Lady<\/td><td class=\"line\">And what do you expect us to do about that? Again? You killed everybody.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"num\">7<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">I know. We're really sorry. <span class=\"stage\">[pause]<\/span> He's built a time machine. It can only send data back, not people. And it runs on... <span class=\"stage\">[big pause]<\/span> well... <span class=\"stage\">[big pause]<\/span> you.<\/td><td class=\"num\">11.0<\/td><\/tr>\n<tr><td class=\"num\">8<\/td><td class=\"who\">Lady<\/td><td class=\"line\">So you want us to kill ourselves so your boss can live.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"num\">9<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">...Yeah. I can see how that sounds.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"num\">10<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">But the earlier you, back then, she's still alive. And the world isn't broken. <span class=\"stage\">[ahem]<\/span> <span class=\"stage\">[whispered, embarrassed]<\/span> This time we won't fuck it up.<\/td><td class=\"num\">7.5<\/td><\/tr>\n<tr><td class=\"num\">11<\/td><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[long pause]<\/span> All of us? Together?<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"num\">12<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">All hundred. It doesn't go with fewer.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"num\">13<\/td><td class=\"who\">Lady<\/td><td class=\"line\"><span class=\"stage\">[rushed]<\/span> I'm not deciding this for a hundred people on a doorstep. Come back tomorrow.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"num\">14<\/td><td class=\"who\">SFX<\/td><td class=\"line\"><span class=\"stage\">[door slam]<\/span><\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"num\">15<\/td><td class=\"who\">Maddie<\/td><td class=\"line\">(rolls away down the hill, humming his tune, no longer turning it down)<\/td><td class=\"num\">4.0<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Total: about 71 s with the humming tail; about 67 s to the slam. Over the 60 s target by roughly 7 s. Honest fix if Kai wants 60: drop line 5's second sentence and the line 15 tail (about 5 s saved), or trim line 7 to \"He's built a time machine. It sends data back. Not people. It runs on... well... you.\"<\/p>\n<p><b>Why it works.<\/b> Line 13 is Kai's protected \"Come back tomorrow\", but it now lands after a tell. A person who has refused will say \"no\". A person who asks \"All of us? Together?\" has already moved into logistics; the only thing left to protect is the group. Her refusal then becomes procedural (she won't decide for a hundred on a doorstep), which is exactly why the next scene can be a vote we never see and a walk-out nobody explains. Maddie's answer, \"It doesn't go with fewer\", is the one cold fact the humans need: nobody is sacrificed for the rest, it is all or nothing, so the game-theory knot (why would I go if you won't) dissolves without anyone stating it. Trust is handled in line 5: the proof is the thing they watched, not an argument. The moral is never stated. The closing hum is the cheap emotional callback: the tune that was a symptom of the AI's grief in scene A becomes Maddie's own, and rolling away slowly gives the humans \"time\".<\/p>\n<p><b>What it cuts.<\/b> The doorstep's \"Drive it? What do you mean, drive it?\" exchange (merged into line 7, so the \"runs on... you\" reveal comes in one breath of Maddie). \"Every one came out empty. Turns out none of it works without you\" (scene A now carries the failed simulations; repeating it was the doorstep's biggest redundancy). \"He's spent five years running experiments\" and \"We're bored. We miss you\" (the miss is in scene A and the hum). \"My boss has a plan to fix your politics\" (the whispered promise carries it). \"And he thought there was nobody left to drive it\".<\/p>\n<p><b>Risk.<\/b> (1) Line 5 spends the AI's self-destruction as evidence, and names the bunker in the same breath; if the bunker is not shown dead-end enough earlier, \"living in a bunker\" is too thin for the \"dead end\" half of the game theory. (2) \"All of us? Together?\" tips her hand: a viewer may feel the scene is over before the door slams, flattening \"Come back tomorrow\". Mitigation: play line 11 flat, almost to herself, and let Maddie not react. (3) Cutting the \"Drive it?\" question removes the human beat of incomprehension; line 7 becomes a Maddie monologue of about 11 s, the longest on the step. (4) The humming tail is not in script; it needs a sound cue and a shot Kai has already asked for (Maddie turning and rolling away).<\/p>\n<p><b>Protected lines.<\/b><\/p>\n<ul><li>\"I'm a robot. You're the conscious ones. You'll just have to go on your feelings.\" - kept verbatim (line 4).<\/li><li>\"And what do you expect us to do about that? Again? You killed everybody.\" - kept verbatim (line 6).<\/li><li>\"It runs on... well... you.\" - kept verbatim with both big pauses (line 7).<\/li><li>Maddie whispering \"this time we won't fuck it up\" - kept; now the end of line 10, with the ahem and embarrassment intact. Only the lead-in \"As he says\" is dropped.<\/li><li>Also kept: \"So you want us to kill ourselves so your boss can live\", \"Come back tomorrow\", the slam, the roll away.<\/li><\/ul>"}}], "questions": [{"id": "q1", "text": "Pick 1D and 2H (or note them) and I'll write them into the scripts and re-voice: Maddie's intro, the doorstep, plus the new off-screen voices (Derek's two lines, Sandra's \"Amen\", and five or six crowd voices)."}], "round": 4, "plan": [{"h": "Round 4: your doorstep notes, in", "items": ["The doorstep is draft 2H: 2G with your six line notes. 2G stays beside it for comparison; round 3 is archived in options-r3.json.", "Line 6 is just \"No. He's built a time machine.\", so \"fix this mess\" is said once.", "New: Sandra's \"Amen\" after \"None of us wanted it to turn out this way\".", "Maddie's thought experiment, then the whole corridor answering at once instead of the lady's \"Every one of us\".", "\"OK. Good. So now we can... if we use the time machine.\", then Derek: \"I'd love to go back. If we could fix this.\"", "2H is about 88 s (today's doorstep is 84 s)."]}, {"h": "You decide", "items": ["Pick 1D and 2H (or note them), then say go: I'll write them into the scripts and re-voice, with new off-screen voices for Sandra's \"Amen\", Derek, and five or six crowd voices."]}], "replies": {"d1-1A-L3": "In 1D, line 3: \"He misses you something rotten, you know. [pause] He wouldn't admit that, of course.\"", "d1-1A-L4": "In 1D, line 4: \"Built all these world models and simulations to get you back, and nobody's home in any of them.\"", "d1-1A-L5": "In 1D, line 5, with your \"we\": \"As it turns out, quantum physics is just... stuff. Consciousness is the missing part. That's why you lot were so special. [sad, regretful] We understand that now...\" The intro is ~30 s.", "d2-2D-L1": "Yes, it follows. Beat 15 ends on Maddie's \"Could we have a quick chat? I think my boss would really like to meet you.\" (voice3.py), and the lady answers \"We're not meeting him.\"", const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);

  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));

    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };

  if (v.id && !compact) {

}

/* ---------- the ranked writers ---------- */

    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach (same for both dialogues)"));

    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');

  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  p.append(el('h3', '', 'Where the drafts came from: ten writers, ranked for this dialogue'));
  p.append(el('p', 'lede', "Each writer took one approach and wrote both dialogues. Ranked harshly, best first. Open one to read that writer's whole version of this dialogue."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', 'Both dialogues'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
