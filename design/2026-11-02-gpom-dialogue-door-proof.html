glasses. Derek's mouth open. Sandra's hand on his arm. Nobody speaks. The kill bots filing away, heard only.] | (wordless replay) | 8.0 |\n| (nobody) [The bolts go, one at a time. The blast door grinds. Daylight lands on the nearest faces. Maddie on the step, tiny, tannoy hanging from her hand. Cut to C.] | (wordless door) | 3.0 |\n| **Total** | Spoken 18.7 s. Whole bridge about 36 s with the room tone and pauses between lines. | 18.7 spoken / ~36 bridge |\n\n- **Why it works.** The humans do not say yes, and Maddie does not win a debate. The question \"How could I win your trust?\" is answered by eight seconds in which a hundred people watch the thing that nearly killed them lose its nerve, and we watch them watch. Showing only the light keeps it cheap (no extra shot of the footage beyond what scene A already shot, run through a CRT glow and a red-to-green grade), keeps it from being explained, and puts the audience in the humans' seat: we are the ones reading faces to see what they decide. The half-and-half split makes the refusal a one-two: the grief is seen once, the stubbornness is heard through steel, which also lets it be longer and rougher without a second lip-sync shot.\n- **Cuts from current.** The black card \"Some negotiation later.\" goes entirely, along with any doorstep explaining of who the boss is, why he is sorry, or what the plan is. Maddie never says \"my boss\" in this bridge at all: the old lady does it for her, so the word first arrives as an accusation and the proof answers it. No Sandra and Derek banter, no murmur of the hundred.\n- **Risk.** Eight wordless seconds on faces is long, and if the faces are not distinct and well lit it just reads as a pause. It depends on the reflected-light shot being gorgeous: the lady's glasses, three or four named faces, the red-to-green change landing on cue. Also, \"And, you know. Everything.\" is the one added line; if the apology feels thin it may need a beat more, but adding words is what grows the box. And because nobody inside speaks after the refusal, a viewer could read the opening as the humans being overpowered rather than choosing; the lady's glasses going green and one held breath have to carry the choice.\n- **Protected lines.** All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" / \"There's no way we're going anywhere with you. You killed everybody.\" / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\" Only addition is \"And, you know. Everything.\" as the apology for how things have gone, and \"How could I win your trust?\" joins the previous sentence in one breath."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie (tannoy, outside, doors shut)<\/td><td class=\"line\">[chirpy, a squeal of feedback first] Oh, hello, humans. Sorry about the intrusion. And, well. Everything.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady (INSIDE, on camera, lip-synced; existing take)<\/td><td class=\"line\">Your boss killed everyone we ever loved.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady (OUTSIDE shot of Maddie, voice muffled through the door; same breath, cut mid-line)<\/td><td class=\"line\">[muffled] ...There's no way we're going anywhere with you. You killed everybody.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie (no tannoy now, close, quiet)<\/td><td class=\"line\">I don't blame you. I can see how it looks. We've got a way we might be able to fix this. How could I win your trust?<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">(wordless)<\/td><td class=\"line\">[Beat of nothing, 1.5 s. Old CCTV monitors flicker on across the bunker wall: the door camera's own recording. Red KILL MODE racing at the camera, braking, flipping to green STAND DOWN, filing away. A hundred faces lit by it, nobody speaking. Hold on the old lady's face.]<\/td><td class=\"num\">8.0<\/td><\/tr>\n<tr><td class=\"who\">(wordless)<\/td><td class=\"line\">[Bolts. Chain. The blast door grinds open on daylight. Cut to Scene C, Maddie on the step.]<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">Spoken 19.5 s. Whole bridge about 35 s with the room tone, the card gone, the cutaways and the door.<\/td><td class=\"num\"><b>~35<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The only argument in the scene is the picture. The lady refuses twice in ten seconds (seen, then heard through steel), Maddie concedes in one breath and asks the question, and the answer is not a line but eight seconds of the thing they missed. Nobody says \"we trust you\" or \"we'll come\": the doors opening is the decision. The muffled half also hides that the lady never gets a second speech to hold. Maddie's \"And, well. Everything.\" is the whole apology: dry, small, and exactly in her gossipy cheer, so the sincerity comes from how little she dresses it. Showing the replay on the bunker's own old CCTV monitors means the humans watch themselves be spared, on their own screens, with no gadget for Maddie to explain; the faces lit by it are the payoff Kai asked for.<\/p>\n<p><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes, and the whole off-screen negotiation it papers over. Cut from Kai's version: any second line of apology, any lady rebuttal after \"How could I win your trust?\", any Derek or Sandra gag, any explanation of what the footage is. Maddie says nothing during or after the replay.<\/p>\n<p><b>Risk.<\/b> Seven seconds of Maddie in a row (\"I don't blame you... win your trust?\") is the closest this shape comes to a speech and could read as a run-up. The apology is thin: \"Everything.\" may feel flip rather than sincere unless the tannoy performance sells a half-second crack. With no word from anyone after the replay, a viewer could ask why the lady folds; the held face and the bolts must carry it, so the replay cut needs to land on her specifically. Muffling the second refusal means \"You killed everybody\" must still be legible; test it on the mix. And it leaves no comic relief, so the tannoy feedback squeal has to earn the laugh.<\/p>\n<p><b>Protected lines.<\/b> All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" / \"There's no way we're going anywhere with you. You killed everybody.\" / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\" The only addition is the four-word apology tail \"And, well. Everything.\"; if the director wants even less, drop it and the spoken total is 17.5 s.<\/p>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie (tannoy, outside, doors shut)<\/td><td class=\"line\">[tannoy clicks on, a squeal of feedback, the row inside stops dead] \"Oh, hello, humans. Sorry about the intrusion.\"<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie (tannoy)<\/td><td class=\"line\">\"My boss is ever so sorry. About all of it.\"<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady (seen, inside, CU, existing lip-synced take)<\/td><td class=\"line\">[not raising her voice] \"Your boss killed everyone we ever loved.\"<\/td><td class=\"num\">2.8<\/td><\/tr>\n<tr><td class=\"who\">Old lady (heard, muffled through the door; cut to outside, Maddie's back to us, lens on the shut door)<\/td><td class=\"line\">[the words arrive thick and thin, bass and no top end] \"There's no way we're going anywhere with you. You killed everybody.\"<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie (outside, no tannoy, small, close)<\/td><td class=\"line\">[a beat, her beacon dips] \"I don't blame you. I can see how it looks.\"<\/td><td class=\"num\">2.6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">\"We've got a way we might be able to fix this.\"<\/td><td class=\"num\">2.4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[lifts the tannoy again] \"How could I win your trust?\"<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\">(pauses between lines, tannoy hiss left open)<\/td><td class=\"line\">[no one answers; the fan; the hiss]<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">(wordless) Silence beat, then the dead CCTV monitors on the bunker wall flicker on by themselves<\/td><td class=\"line\">[no line]<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">(wordless) THE REPLAY on the monitors<\/td><td class=\"line\">[no line: red KILL MODE racing at the door, brakes, flips to green STAND DOWN, they file away]<\/td><td class=\"num\">8.0<\/td><\/tr>\n<tr><td class=\"who\">(wordless) Faces lit by it, the decision<\/td><td class=\"line\">[no line: a hundred faces going red then green; Sandra and Derek stop mid-bicker; the old lady's hand goes to the wheel]<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">(wordless) The doors open on daylight; cut to C<\/td><td class=\"line\">[no line: the wheel turns, bolts, light across the floor; hands straight on to Maddie on the step: \"Go on.\"]<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><b>Spoken 18.9 s; whole bridge<\/b><\/td><td class=\"num\"><b>~34.9<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Shots relied on:<\/p>\n<ul><li><b>S1<\/b> (new) bunker blast door, exterior, shut, Maddie small in frame with a tannoy;<\/li><li><b>S2<\/b> (existing lip-synced take) the old lady, CU, \"Your boss killed everyone we ever loved\";<\/li><li><b>S3<\/b> (new) over Maddie's shoulder onto the shut door, held static for the muffled line;<\/li><li><b>S4<\/b> (new) Maddie CU for her three lines;<\/li><li><b>S5<\/b> (new) interior wide: the old bunker CCTV bank flickering to life, a hundred silhouettes in front of it;<\/li><li><b>S6<\/b> (reused from scene A) the stand-down footage, recut to ~8 s and shown on the monitors (3 s red race, 2 s brake, 1.5 s flip to green STAND DOWN, 1.5 s file away);<\/li><li><b>S7<\/b> (new) face CUs lit red then green: old lady, Derek, Sandra, a kid, a man with his eyes shut;<\/li><li><b>S8<\/b> (new) the old lady's hand on the door wheel;<\/li><li><b>S9<\/b> (new) the doors parting onto daylight, which is the hand-off to scene C.<\/li><\/ul>\n<p>How the replay is shown: the bunker's own old CCTV, dead for five years, comes up on its own. Maddie never says she did it and never narrates it. The footage is seen mostly as light on faces (S7) and reflected in the old lady's glasses, with S6 for the money shot only.<\/p>\n<p><b>Why it works.<\/b> Kai's worry is that opening the dialogue box makes it huge; here the box is one exchange wide because every line is either an apology, a refusal, a concession or a question, and the answer is not a line at all. The refusal is protected from rebuttal by the half-and-half trick (the muffled half can't be argued with, so Maddie concedes instead of persuading), which keeps her warm and not pleading. The proof asks nothing of the audience to decode: red to green is the whole argument, and the faces turning from red to green carry the decision so nobody has to say \"we trust you\". It proves only that the boss had them dead and chose not to; Maddie never claims more, so scene D keeps its doubt. The \"my boss is ever so sorry\" line reports his feelings, not hers, and the old lady's \"your boss\" picks the word straight up, which gives the refusal a hook with no extra words.<\/p>\n<p><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes. So do Kai's \"Yeah,\" and \"The thing is,\" connective tissue, any second line from the lady, any line from Sandra, Derek or the hundred (they appear as faces and a murmur only), any Maddie narration over the replay (\"look, here's what happened\"), and any spoken answer to \"How could I win your trust?\"<\/p>\n<p><b>Risk.<\/b> (1) Sudden: from refusal to open in about 15 s may feel like the humans caved without a turn, so the 8 s replay and the 3 s of faces have to do real persuading, and the sound (tannoy hiss, the row going silent, the fan) has to sell the shift. (2) Replay fatigue: the audience watched this same stand-down minutes ago in scene A; it only works if S5/S7 show it from a new angle (the humans' side, light on faces) and S6 is cut tighter than scene A. (3) Reading: with no word from Maddie, a viewer may think the feed is a fake or that the monitors came on by chance; one visible beat of her beacon pulsing outside, or a cable, would fix it. (4) Kai said \"a bit of dialogue\"; this has less than any other likely shape and may feel too silent for him. (5) Perhaps the biggest: the old lady's hand on the wheel is the whole decision, and if the performance is weak the bridge fails.<\/p>\n<p><b>Protected lines.<\/b> All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" / \"There's no way we're going anywhere with you. You killed everybody.\" / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\" Only change: \"Yeah,\" dropped from the front of \"I don't blame you\", which is not in the protected string.<\/p>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie (tannoy, outside, chirpy, a squeal of feedback first)<\/td><td class=\"line\">Oh, hello, humans. Sorry about the intrusion. <span class=\"stage\">[beat, the cheer slips]<\/span> And, you know. All of it.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady (INSIDE, seen, close on her face, clear)<\/td><td class=\"line\">Your boss killed everyone we ever loved.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">[CUT OUTSIDE: Maddie at the door, audio now muffled through steel and earth] Old lady (muffled)<\/td><td class=\"line\">There's no way we're going anywhere with you. You killed everybody.<\/td><td class=\"num\">3.2<\/td><\/tr>\n<tr><td class=\"who\">Maddie (tannoy)<\/td><td class=\"line\">I don't blame you. I can see how it looks.<\/td><td class=\"num\">2.3<\/td><\/tr>\n<tr><td class=\"who\">Maddie (tannoy)<\/td><td class=\"line\">We've got a way we might be able to fix this. How could I win your trust?<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">[CUT INSIDE: long pause, a hundred faces turned to the old lady. She steps right up to the spyhole, audio clear again] Old lady<\/td><td class=\"line\">Something came to our door. Show me.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie (tannoy, small)<\/td><td class=\"line\">Hang on.<\/td><td class=\"num\">0.7<\/td><\/tr>\n<tr><td class=\"who\">[THE REPLAY, wordless, about 8 s: the bunker's dead CCTV monitors flicker on one by one and the feed comes up. Red KILL MODE racing at this very door, braking on the step, flipping to green STAND DOWN, filing away. Cut between the footage and the faces: a hundred of them, the green light on their skin, Sandra's hand over her mouth, Derek not saying anything for once.]<\/td><td class=\"line\">(no words)<\/td><td class=\"num\">8.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady (quiet, to the room, not the door)<\/td><td class=\"line\">Derek. The bolts.<\/td><td class=\"num\">1.3<\/td><\/tr>\n<tr><td class=\"who\">[Bolts, the door groans open on daylight. Hand straight on to scene C: Maddie on the step.]<\/td><td class=\"line\">(no words)<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">Spoken 20.0 s; whole bridge about 38 s<\/td><td class=\"num\"><b>20.0 spoken<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The humans are never persuaded by anything Maddie says; they are persuaded by something they themselves insisted on seeing, which is the only way a grieving woman in charge of a hundred people could believably budge in 35 seconds. \"Show me\" is also the push-back the old doorstep talk never had: she turns Maddie's open question into a condition, so the scene has a single decision and the replay is its answer, not a lecture. The lady's \"Derek. The bolts.\" gives the decision without anyone saying \"we trust you\", and Derek, handed the job, supplies the comic release that the stand-down needs after the dread. Half and half does its work: the seen line is the bare protected grievance, the muffled line is the refusal, and the clear \"Show me\" is the only moment the door seems to open, which is what the audience feels before it physically does.<\/p>\n<p><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes entirely; the negotiation is now the bridge. Nothing about the AI's feelings, the time machine or why it happened is added; Maddie's whole case is five protected-ish sentences and one obedient \"Hang on.\"<\/p>\n<p><b>Risk.<\/b> (1) \"Show me\" can read as Maddie being led by the nose; play her \"Hang on.\" as relieved, not defeated. (2) The lady knowing something \"came to our door\" depends on the humans having heard the kill bots arrive through the earth; scene A must keep the rumble audible (or add a single low thump on the door). (3) The monitors-come-alive method needs one new plate of a dead CCTV bank and a footage insert that matches scene A's stand-down angle. (4) The tannoy \"And, you know. All of it.\" is the only apology and it must carry the sincerity from her high-street intro; if it lands as flippant, the lady's second line loses its sting. (5) Roughly 38 s with the replay; if it runs long, drop \"Hang on.\" first, then shave the final door beat.<\/p>\n<p><b>Protected lines.<\/b> All six survive verbatim. \"Oh, hello, humans. Sorry about the intrusion.\" opens the scene, followed by a short new apology tail. \"Your boss killed everyone we ever loved.\" is the seen, clear take (existing lip-sync reused). \"There's no way we're going anywhere with you. You killed everybody.\" is the muffled take, unchanged. \"I don't blame you. I can see how it looks.\" and \"We've got a way we might be able to fix this.\" and \"How could I win your trust?\" run in Maddie's order, with the \"Yeah,\" from Kai's note dropped for time; restore it as a one-word lead-in if the budget allows.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">[Inside, dim. Sandra and Derek mid-row, hushed, at full pelt. A tannoy SQUEAL cuts them dead. A hundred heads turn to the door.]<\/td><td class=\"line\">(sfx only)<\/td><td class=\"num\">2.0 (unspoken)<\/td><\/tr>\n<tr><td class=\"who\">Maddie [tannoy, chirpy, mic too close]<\/td><td class=\"line\">\"Oh, hello, humans. Sorry about the intrusion.\"<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Derek [whisper, to Sandra]<\/td><td class=\"line\">\"Is that about the seat?\"<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie [tannoy, a little softer, the cheer slipping]<\/td><td class=\"line\">\"And the rest of it. Sorry.\"<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady [SEEN, inside, not whispering, existing lip-synced take]<\/td><td class=\"line\">\"Your boss killed everyone we ever loved.\"<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">[Cut outside: Maddie on the step, head tilted at the blast door. Audio muffled through steel.]<\/td><td class=\"line\">(beat)<\/td><td class=\"num\">0.5 (unspoken)<\/td><\/tr>\n<tr><td class=\"who\">Old lady [MUFFLED through the door, low-passed, the room a murmur behind her]<\/td><td class=\"line\">\"There's no way we're going anywhere with you. You killed everybody.\"<\/td><td class=\"num\">2.8<\/td><\/tr>\n<tr><td class=\"who\">Maddie [no tannoy now, lowered, to the door]<\/td><td class=\"line\">\"I don't blame you. I can see how it looks.\"<\/td><td class=\"num\">2.4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">\"We've got a way we might be able to fix this.\"<\/td><td class=\"num\">2.4<\/td><\/tr>\n<tr><td class=\"who\">Maddie [the tannoy back up, out of habit, then she winces and lowers it]<\/td><td class=\"line\">\"How could I win your trust?\"<\/td><td class=\"num\">1.7<\/td><\/tr>\n<tr><td class=\"who\">[THE PROOF, wordless. The bunker's dead CCTV monitors flicker up, one by one, the old green-grey feed taking Maddie's signal: red KILL MODE racing at this very door, brakes, flips to green STAND DOWN, the bots file away. A hundred faces lit by it. Sandra's mouth open mid-row. Derek has stopped chewing.]<\/td><td class=\"line\">(no words, low hum, no music sting)<\/td><td class=\"num\">8.0 (unspoken)<\/td><\/tr>\n<tr><td class=\"who\">Sandra [not looking away from the screen]<\/td><td class=\"line\">\"Derek. Door.\"<\/td><td class=\"num\">1.2<\/td><\/tr>\n<tr><td class=\"who\">[Wheel lock turns, doors grind open onto daylight. Cut to C.]<\/td><td class=\"line\">(sfx)<\/td><td class=\"num\">3.0 (unspoken)<\/td><\/tr>\n<tr><td class=\"who\"><b>Total spoken<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>20.0<\/b><\/td><\/tr>\n<tr><td class=\"who\"><b>Whole bridge (spoken + unspoken)<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~35<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The comedy is the tension valve: the audience laughs at Sandra and Derek, then the old lady drops the temperature to zero with a line nobody can joke over, and the laugh dies in the room the way it would in life. Because the humour ends where the grief begins, the refusal reads as real resistance instead of a speed bump. The tannoy and \"Derek. Door.\" bracket the scene: a chirpy voice interrupting a petty row, and a petty-row voice ending the standoff. Nobody says \"we trust you\"; the decision is a married woman telling her husband to open a door. The proof does the persuading, so no one has to talk themselves round, and the stand-down is shown in the bunker's own CCTV so the humans see it with the kit they already own.<\/li><li><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes entirely. No time machine, no cost, no explaining, no second round of argument, no Maddie pleading.<\/li><li><b>Risk.<\/b> Derek's seat joke could sour the apology before it lands (the audience may be laughing when \"Sorry about the intrusion\" should be sincere): mitigated by Maddie's cheer slipping on \"And the rest of it. Sorry.\" The row may also read as filler if the audience does not remember the seat from scene A. \"Derek. Door.\" could feel like the humans caved too easily (Sandra instead of the old lady deciding): if so, give the last word to the old lady, a single nod, no line. The \"half and half\" cut needs the seen shot and the muffled audio to be clearly the same speaker.<\/li><li><b>Protected lines.<\/b> All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" / \"There's no way we're going anywhere with you. You killed everybody.\" / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\" Only the stage direction and the apology's tail (\"And the rest of it. Sorry.\") are new.<\/li><\/ul>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[outside, on the step, tannoy squealing with feedback, chirpy] Oh, hello, humans. Sorry about the intrusion.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[tannoy, brighter, a fraction too long] Sorry about all of it, really.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady<\/td><td class=\"line\">[INSIDE, close-up, clear, not looking at the door, the hundred silent behind her] Your boss killed everyone we ever loved.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Old lady<\/td><td class=\"line\">[CUT OUTSIDE to Maddie; the voice is muffled through the steel, mostly consonants, \"killed\" the only clean word] There's no way we're going anywhere with you. You killed everybody.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[lowers the tannoy, speaks to the door unamplified, small] I don't blame you. I can see how it looks.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We've got a way we might be able to fix this.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">How could I win your trust?<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[two seconds of nothing from inside. Then a hatch clicks on her chassis, to herself] Right. Have a look at this, then.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">(wordless)<\/td><td class=\"line\">[INSIDE: the dead door-camera monitor flickers on. The replay is heard THROUGH the door, a tinny alarm and the roar of the kill bots, and seen mainly as light moving across a hundred faces: red, red, a brake squeal, green. One full-frame glimpse of STAND DOWN in the last two seconds, reflected in the old lady's glasses.]<\/td><td class=\"num\">8.0<\/td><\/tr>\n<tr><td class=\"who\">(wordless)<\/td><td class=\"line\">[Bolts draw back, one at a time. The door opens on daylight. Cut to scene C: Maddie on the step.]<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">Spoken words 19.0 s; whole bridge about 35 s with the replay, the silence and the bolts<\/td><td class=\"num\">19.0 / ~35<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The door does the compression. The refusal is split in two, so the old lady needs one clear line to be seen as stern and grieving, and the second, longer line can be buried under steel and still land because we already know what she means. The tannoy turns the apology into a joke at Maddie's expense (cheerful volume, wrong register) and then she switches it off and the sincerity arrives at human size, which is the whole turn of the scene: she is heard as a machine, then as a visitor. Nobody argues; the question \"how could I win your trust?\" is met with silence, so the humans' decision is shown as the monitor coming on and the door opening, never said. The replay is the answer, and it is delivered as sound through a wall and light on faces, which keeps it wordless, short and about them, not about her.<\/li><li><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes entirely. No Sandra and Derek, no crowd murmur lines, no explanation of what the boss is or why. Maddie does not describe the replay, and the old lady never concedes.<\/li><li><b>Risk.<\/b> Muffled audio can read as a sound-mix mistake rather than a device if the first tannoy line (clipped, squealing inside) does not establish the rule; the cut to outside needs a visible door in frame. The old lady's second line may be unintelligible on purpose, so if a reader cannot tell she refused, the first clear line must carry the whole refusal. \"Right. Have a look at this, then.\" makes Maddie the one who triggers the monitor, which is slightly less mysterious than the monitor coming on by itself; if that feels like explaining, cut it and let the question hang for four seconds. The existing lip-synced take covers only \"Your boss killed everyone we ever loved.\"; the muffled second line needs no lip-sync because we are outside.<\/li><li><b>Protected lines.<\/b> All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" (line 1), \"Your boss killed everyone we ever loved.\" (line 3, reuses the existing take), \"There's no way we're going anywhere with you. You killed everybody.\" (line 4, verbatim but muffled), \"I don't blame you. I can see how it looks.\" (line 5), \"We've got a way we might be able to fix this.\" (line 6), \"How could I win your trust?\" (line 7). Kai's \"yeah\" and \"The thing is,\" were dropped from lines 5 and 6 for time.<\/li><\/ul>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie (tannoy, outside, doors shut)<\/td><td class=\"line\">Oh, hello, humans. Sorry about the intrusion. [tannoy squeal] Sorry about all of it.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Old lady (SEEN, inside, lip-synced)<\/td><td class=\"line\">Your boss killed everyone we ever loved.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Old lady (HEARD, muffled through the door, cut to Maddie on the step)<\/td><td class=\"line\">[muffled] ...no way we're going anywhere with you. You killed everybody.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie (tannoy, quiet, tannoy hiss left on)<\/td><td class=\"line\">I don't blame you. I can see how it looks. We've got a way we might be able to fix this. How could I win your trust?<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">[Silence. Inside: a hundred faces. Derek, squinting at a dead grey monitor in the corner.]<\/td><td class=\"line\"><\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\">Derek (inside, to Sandra)<\/td><td class=\"line\">Sandra. That door camera's still taping.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Old lady (inside, not looking at him)<\/td><td class=\"line\">Play it.<\/td><td class=\"num\">0.8<\/td><\/tr>\n<tr><td class=\"who\">[THE REPLAY, wordless: monitor warms up, tape-grain feed of the door, red KILL MODE racing in, braking, flipping green STAND DOWN, filing away. Cut between the screen and the faces it lights. Outside: Maddie waiting, tannoy off, saying nothing. The bolts go. The doors open.]<\/td><td class=\"line\"><\/td><td class=\"num\">8 + 2<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~20 spoken (19.3), ~30 to 35 whole bridge<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The humans make the decision, so the bridge never has to argue it: nobody says \"we trust you\" because nobody has to, Derek simply goes and checks. It keeps Kai's mechanism (the replay, the hundred lit faces) but turns it from Maddie's evidence into the humans' own detective work, which is more convincing than anything she could say and is faster than any explanation. Maddie's silence after the question is her best moment: she does not plead. Derek gets a grumpy, comic hinge line that has real work to do, and the old lady's \"Play it.\" is her whole concession, stern and unpersuaded about the plan, only about the fact. Because the humans find the footage, it proves exactly one thing: the machine had them and chose not to. Scene D keeps all of its doubt.<\/li><li><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes, along with any explanatory doorstep talk. Maddie's side of the proof (her beacon, her hatch screen) goes. The old lady's long refusal is cut to the two protected lines.<\/li><li><b>Risk.<\/b> (1) It rests on a new fact, a door camera still recording to tape, which has to be planted visually in the bunker establishing shots or it reads as convenient; it also slightly contradicts \"she replays the footage\" in Kai's note, since Maddie no longer does. Kai may want her hand in it (fix: Maddie's tannoy hiss cuts out and the monitor only then flickers, so her arrival \"woke\" it). (2) Derek solving it risks making the humans too quick: the line \"Play it.\" must land as reluctant, not won over. (3) Cutting between a screen and a hundred faces in 8 s is tight, and the muffled line must still be intelligible. (4) If the camera has been taping for five years, someone should have looked; Derek's \"still taping\" needs a shrug of a reason.<\/li><li><b>Protected lines.<\/b> All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" / \"There's no way we're going anywhere with you. You killed everybody.\" (fragment audible muffled, the head of the sentence lost behind the door, which is the half-and-half) / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\"<\/li><\/ul>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie (tannoy, outside, chirpy, feedback squeal first)<\/td><td class=\"line\">\"Oh, hello, humans. Sorry about the intrusion. And the <span class=\"stage\">[beat, the tannoy hum fills it]<\/span> ... everything.\"<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Chorus (inside, whispered, overlapping, over the tannoy tail)<\/td><td class=\"line\">\"That's her.\" / \"It's talking.\" / \"Don't answer.\"<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady (SEEN, inside, close on face, flat)<\/td><td class=\"line\">\"Your boss killed everyone we ever loved.\"<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Chorus (overlaps her last word, three voices, not in sync)<\/td><td class=\"line\">\"Mine.\" / \"Mine.\" / \"Both of mine.\"<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady (HEARD, cut outside to Maddie, muffled through the door; the chorus murmurs \"...everybody... everybody...\" under, passed hand to hand)<\/td><td class=\"line\">\"There's no way we're going anywhere with you. You killed everybody.\"<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Sandra (muffled, to Derek, the only joke)<\/td><td class=\"line\">\"Derek, shush.\"<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie (outside, tannoy off, now just her voice, small)<\/td><td class=\"line\">\"I don't blame you. I can see how it looks.\"<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">\"We've got a way we might be able to fix this. How could I win your trust?\"<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">[REPLAY, wordless] Bunker CCTV monitors flicker on, then the feed: red KILL MODE racing at this very door, brake, flip to green STAND DOWN, file away. A hundred faces lit by it, the chorus's whisper dying face by face until only breathing and the feed's hiss. Hold on the old lady's eyes. Bolts draw. Door opens on daylight.<\/td><td class=\"line\">(no speech)<\/td><td class=\"num\">8.0<\/td><\/tr>\n<tr><td class=\"who\">[Hand to scene C] Door swings, Maddie on the step.<\/td><td class=\"line\">(no speech)<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">spoken about 20 s; whole bridge about 35 s with replay and door<\/td><td class=\"num\"><b>~35<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The chorus carries the length of the argument without anyone arguing: one old woman's line is a verdict, and a hundred fragments under it make it a room. Overlap lets a lot of doubt fit in a second of clock, since three people saying \"Mine.\" takes one beat. The muffled half and half hides the old lady's second line behind the door, so it is felt rather than followed, and the crowd echoing \"everybody\" does the repetition for her. Nobody says \"we trust you\"; the chorus simply goes silent for the replay, which is the whole decision, and the opening door is the only reply. Sandra's \"Derek, shush.\" keeps one human, comic breath in the grief.<\/li><li><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes, along with any explanation of why they open the door. No Maddie pleading, no second round of objections, no old-lady speech beyond the two protected lines.<\/li><li><b>Risk.<\/b> Overlapping whispers can turn to mush and cost intelligibility; the lead lines must sit clear and the chorus needs a low mix with at most three distinct voices, not a hundred. Eight bodies of murmur can also read as a crowd of extras mumbling, and the 1 s chorus beats could be cut by an editor and nothing would show, so they have to be cast as specific voices (a man, a girl, an old man). The \"Derek, shush.\" joke could undercut the grief; it can be dropped for 1 s. The tannoy \"everything\" beat may feel too soft before the old lady's hit. And the chorus gives the humans a collective mind that scene C may not carry through (they follow her out as individuals).<\/li><li><b>Protected lines.<\/b> All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" (opens the tannoy line, \"And the... everything.\" is an addition after it); \"Your boss killed everyone we ever loved.\"; \"There's no way we're going anywhere with you. You killed everybody.\"; \"I don't blame you. I can see how it looks.\"; \"We've got a way we might be able to fix this.\"; \"How could I win your trust?\" Only the old lady's second line is treated (muffled through the door), not altered.<\/li><\/ul>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie (tannoy, chirpy, crackling off the door speaker)<\/td><td class=\"line\">\"Oh, hello, humans. Sorry about the intrusion.\"<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">\"Sorry about everything, actually.\" <span class=\"stage\">[beat; nothing back but the speaker hiss]<\/span><\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Old lady (INSIDE, lit grey by the dead CCTV wall, mouth seen clearly)<\/td><td class=\"line\">\"Your boss killed everyone we ever loved.\"<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Old lady (CUT OUTSIDE: Maddie on the step, tannoy hanging; voice muffled through the steel, low-passed, room-booming)<\/td><td class=\"line\">\"There's no way we're going anywhere with you. You killed everybody.\"<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie [looks at the scorched tread marks stopping a foot from her wheels; smaller voice, still West Country]<\/td><td class=\"line\">\"I don't blame you. I can see how it looks.\"<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">\"We've got a way we might be able to fix this. How could I win your trust?\"<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie [silence inside; then, brightly, nodding at the little camera over the door]<\/td><td class=\"line\">\"Your door's got a camera. Give it a thump.\"<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">(wordless, about 8 s)<\/td><td class=\"line\">INSIDE: a hand thumps the monitor; snow rolls; the door-cam fisheye comes up, black and white, timestamp running. Red KILL MODE shapes race at the lens, brake, the grey screen flips to the only green in the room, STAND DOWN, they file away. Cut across a hundred faces going green. Nobody speaks. Sandra and Derek, for once, say nothing.<\/td><td class=\"num\">0 (8 on screen)<\/td><\/tr>\n<tr><td class=\"who\">(wordless, about 4 s)<\/td><td class=\"line\">The old lady's hand on the blast-door wheel. It turns. Clunk. Daylight. Straight into scene C, \"Go on. I promise you'll be okay.\"<\/td><td class=\"num\">0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>20.0 spoken, about 35 on screen<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The bunker's own equipment makes the case, so there is no argument to lose: the camera was recording the whole time, the humans just never looked. The humans are never talked round. Maddie asks, and the room answers with a screen. The half-and-half cut does real work: the first half of the refusal is seen (a grieving face), the second is muffled through steel so it can be short and can't be rebutted. The scorched track marks that stop a foot from Maddie's wheels are the outside proof she's looking at while she concedes, a silent echo of the replay. Nobody says \"we trust you\"; the wheel turning is the verdict.<\/li><li><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes, along with any spoken explanation of what the footage means. No second apology, no recap of the boss's regret (the intro already did that), no \"you're safe\".<\/li><li><b>Risk.<\/b> The door camera conveniently still working after five years is a plausibility stretch (one thump covers it as a joke, and a thump on dead tech is a very British gag, but some will see the cheat). The scene needs the CCTV wall, a fisheye door-cam look and the replay re-rendered as monochrome with green, which is a new asset, not a reuse of the colour stand-down clips. \"Give it a thump\" could read as flippant right after the grief line. If it does, swap to \"Your door's got a camera. Look at it.\" The old lady never speaks after the refusal, so her turn to yes must live entirely in her face and hand; if that performance isn't in the footage, the ending is mute but unconvincing.<\/li><li><b>Protected lines.<\/b> All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" (the existing lip-synced take, seen inside) / \"There's no way we're going anywhere with you. You killed everybody.\" (muffled outside) / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\" Only the leading \"Yeah,\" from Kai's version is dropped for time. The apology is the new, short \"Sorry about everything, actually.\"<\/li><\/ul>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">(picture)<\/td><td class=\"line\">[Hold on the shut blast doors, daylight edge. Tannoy squeal of feedback, then a click.]<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[Through a battered tannoy, far too loud for the street, cheerful] \"Oh, hello, humans. Sorry about the intrusion.\"<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[Click; she turns it down, the cheer slipping a notch] \"Sorry about the rest, as well. He's in bits about it, my boss.\"<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady<\/td><td class=\"line\">[INSIDE, seen: close on her face by the dead CCTV monitors, the murmur of the hundred dying round her; the existing lip-synced take] \"Your boss killed everyone we ever loved.\"<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">(picture)<\/td><td class=\"line\">[Hold on her face. Nobody else speaks. Derek opens his mouth and Sandra's hand closes on his arm.]<\/td><td class=\"num\">1.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady<\/td><td class=\"line\">[OUTSIDE: cut to Maddie on the step, tannoy lowered. The lady's voice arrives through the steel, muffled, low end only] \"There's no way we're going anywhere with you. You killed everybody.\"<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[A beat; she doesn't defend him. Tannoy at her side now, she is just speaking] \"I don't blame you. I can see how it looks.\"<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[Lifts the tannoy again, quieter than before] \"We've got a way we might be able to fix this.\"<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[Small, no cheer] \"How could I win your trust?\"<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">(picture)<\/td><td class=\"line\">[Silence, tannoy hiss. Maddie waits. Cut inside: the lady looks at the dark monitors.]<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">(wordless)<\/td><td class=\"line\">[THE PROOF, 8 s. The bunker's own CCTV monitors, dead for five years, flicker up on the old intercom line Maddie has plugged her tannoy lead into. The kill bots' own footage, burned-in with their timestamp: red KILL MODE racing at this very door, braking, flipping to green STAND DOWN, filing away. Sound is the bots' clatter only, and a hundred people breathing. Cut across the faces; the red washes them, then the green washes them. End on the old lady's glasses holding two small green rectangles.]<\/td><td class=\"num\">8.0<\/td><\/tr>\n<tr><td class=\"who\">(picture)<\/td><td class=\"line\">[No word. A heavy bolt thunks back. Her hand on the wheel.]<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">(picture)<\/td><td class=\"line\">[The doors grind open on white daylight; Maddie a small silhouette on the step. Hand-off to scene C: \"Go on. I promise you'll be okay.\"]<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">Spoken 19.5 s; whole bridge about 36 s<\/td><td class=\"num\"><b>~36<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> Each lesson is borrowed and compressed: Maddie concedes the objection before the lady has finished making it (so there is no argument to drag on), then hands her the question, \"How could I win your trust?\" (so the lady, not Maddie, owns the decision), and the answer is restraint shown, not claimed: the machine had them dead and stood down. The decision itself is wordless: red light turns to green on a hundred faces and a bolt moves, nobody says \"we trust you\". The lady is the whole hundred, seen once and then heard through steel, which halves her talk and lets her grief stay hard without a debate. Using the bunker's own dead monitors means the evidence comes through their kit, not from the visitor, so it reads as theirs. \"My boss\" in Maddie's second line is the match that sets off the lady's protected line, so the resistance has a cause on screen.<\/li><li><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes entirely. Cut also: any explanation of what the boss is doing, any \"I promise\" before the doors open (scene C owns it), Sandra and Derek's bickering beyond the held arm, and every line after the replay.<\/li><li><b>Risk.<\/b> (1) The lady's two refusal lines (3 and 4) say nearly the same thing; if it reads as repetition, the muffled line is the one to shave (see below). (2) The apology is short and carries the sincerity by sound (the volume drop) rather than words; if the earlier intro does not carry it, it may feel thin. (3) The replay is only as good as the footage being recognisable as the same stand-down; it needs the red-to-green flip to read at a glance, and 8 s of near-silence can feel long if the faces are not strong. (4) Nothing is said about whether the plan works, which is right for scene D but means this bridge leans on the audience granting that restraint is enough.<\/li><li><b>Protected lines.<\/b> All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" (line 2); \"Your boss killed everyone we ever loved.\" (line 4, existing lip-sync take, seen); \"There's no way we're going anywhere with you. You killed everybody.\" (line 6, muffled; if it needs to be shorter, keep it whole in the take but cut the audible mix so only \"...no way we're going anywhere with you. You killed everybody.\" is clear, and drop \"There's\" under the door thud); \"I don't blame you. I can see how it looks.\"; \"We've got a way we might be able to fix this.\"; \"How could I win your trust?\" (split across two takes to leave a beat, but unaltered).<\/li><\/ul>", "10": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie (tannoy, outside, doors shut; crackle, a feedback squeal on \"hello\")<\/td><td class=\"line\">Oh, hello, humans. Sorry about the intrusion. [A tinny beat of nothing, then, a bit smaller:] And, you know. Everything.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Old lady (INSIDE, seen, lip-synced take, lit by one bulb, the hundred behind her not moving)<\/td><td class=\"line\">Your boss killed everyone we ever loved.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Old lady (OUTSIDE, heard, muffled through the steel, low-passed, Maddie's face in the shot, the tannoy still held up)<\/td><td class=\"line\">There's no way we're going anywhere with you. You killed everybody.<\/td><td class=\"num\">4.2<\/td><\/tr>\n<tr><td class=\"who\">Maddie (tannoy off, no megaphone now, her own voice, a small hand lowered)<\/td><td class=\"line\">I don't blame you. I can see how it looks.<\/td><td class=\"num\">2.8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We've got a way we might be able to fix this. How could I win your trust?<\/td><td class=\"num\">4.2<\/td><\/tr>\n<tr><td class=\"who\">(nobody) [INSIDE. The old CRT beside the blast door crackles on by itself. We never see the screen. We see the light on faces: red, a hundred faces lit red, engine whine small and tinny, red racing. A brake squeal. The light snaps GREEN. Green on the old lady's glasses. Derek's mouth open. Sandra's hand on his arm. Nobody speaks. The kill bots filing away, heard only.]<\/td><td class=\"line\">(wordless replay)<\/td><td class=\"num\">8.0<\/td><\/tr>\n<tr><td class=\"who\">(nobody) [The bolts go, one at a time. The blast door grinds. Daylight lands on the nearest faces. Maddie on the step, tiny, tannoy hanging from her hand. Cut to C.]<\/td><td class=\"line\">(wordless door)<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\">Spoken 18.7 s. Whole bridge about 36 s with the room tone and pauses between lines.<\/td><td class=\"num\">18.7 spoken / ~36 bridge<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The humans do not say yes, and Maddie does not win a debate. The question \"How could I win your trust?\" is answered by eight seconds in which a hundred people watch the thing that nearly killed them lose its nerve, and we watch them watch. Showing only the light keeps it cheap (no extra shot of the footage beyond what scene A already shot, run through a CRT glow and a red-to-green grade), keeps it from being explained, and puts the audience in the humans' seat: we are the ones reading faces to see what they decide. The half-and-half split makes the refusal a one-two: the grief is seen once, the stubbornness is heard through steel, which also lets it be longer and rougher without a second lip-sync shot.<\/li><li><b>Cuts from current.<\/b> The black card \"Some negotiation later.\" goes entirely, along with any doorstep explaining of who the boss is, why he is sorry, or what the plan is. Maddie never says \"my boss\" in this bridge at all: the old lady does it for her, so the word first arrives as an accusation and the proof answers it. No Sandra and Derek banter, no murmur of the hundred.<\/li><li><b>Risk.<\/b> Eight wordless seconds on faces is long, and if the faces are not distinct and well lit it just reads as a pause. It depends on the reflected-light shot being gorgeous: the lady's glasses, three or four named faces, the red-to-green change landing on cue. Also, \"And, you know. Everything.\" is the one added line; if the apology feels thin it may need a beat more, but adding words is what grows the on't know. We do have the dwindling food supply problem. Perhaps we should vote.'", "1-1D-L13": "Done in 1F: no hands, nothing about the vote; 'Perhaps we should vote.' cuts straight to 'The next day.' and Maddie leading them out.", "q1": "Done: F1 then F2, then F3 after the film. Written into 1F's film line.", "q2": "Done: NEW OBJECTIVE: SUSTAIN ORGANIC LIFE. I'll show it as KILL MODE flipping to that line on the same HUD (no strike-through) unless you say otherwise.", "q3": "Done: 'The next day.'"}};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);
  });
  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {
    if (v.notes && v.notes.length) { const ul = el('ul', 'notes'); for (const n of v.notes) ul.append(el('li', '', n)); c.append(ul) }
    c.append(slip(d.id + '-' + v.id, 'Note on draft ' + v.id + ' as a whole'));
  }
  return c;
}

/* ---------- the ranked writers ---------- */
function rankList(d) {
  const wrap = el('div'), used = new Set(d.drafts.flatMap(v => v.lines.flatMap(l => l.tags || [])));
  for (const r of d.ranking) {
    const s = SHAPE[r.shape], det = el('details', 'rank'); det.id = d.id + '-s' + r.shape;
    const sum = el('summary'), nm = el('div', 'nm', 'Writer ' + r.shape + ': ' + s.title);
    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);
    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');
  band.append(el('span', 'eyebrow', 'Dialogue ' + n + ' of ' + D.dialogues.length), el('span', 'meta', d.where + ' · target ' + d.target));
  p.append(band, el('h2', '', d.label), slip(d.id, 'Note on this dialogue as a whole'));
  p.append(el('h3', '', 'Read it: now, and three drafts'));
  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  p.append(el('hr'));
  p.append(el('h3', '', 'Optional: the raw material the three drafts were blended from'));
  p.append(el('p', 'lede', "You only need to pick from the three drafts above. Below are the " + d.ranking.length + " writers' own versions, each pushing one approach to the extreme. 1A, 1B and 1C are built from their best lines: each line's chip (like 09) says which writer it came from. Ranked harshly, best first. Read one only if you want to steal a line, and note it on that writer's slip."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', 'Both dialogues'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
