<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:32px 8px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3em;text-wrap:balance}
.about{color:var(--muted);max-width:70ch;margin:0 0 1em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}
.tabs a .picked{color:var(--pick)}
section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.6rem;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
h3{font-size:1.05rem;margin:28px 0 8px}
.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{font:inherit;cursor:pointer;text-align:left;background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button.picked{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick);background:var(--pickbg)}
.seg button.cmp{margin-left:auto;align-self:center;font-size:.85rem;background:transparent}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:10px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-head h4{margin:0;font-size:1.25rem}
.bet{font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin:6px 0 0;max-width:70ch}
.pickbtn{font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--pick);color:var(--pick);background:transparent;white-space:nowrap}
.pickbtn.on{background:var(--pick);color:var(--paper)}
.script{margin:14px 0 4px;border-top:1px solid var(--rule)}
.ln{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.who{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.who.maddie{color:var(--accent)}.who.lady{color:var(--lady)}.who.other{color:var(--muted)}
.said{font:18px/1.5 "Source Serif 4",Georgia,serif}
.said.dir{font-style:italic;color:var(--muted);font-size:16px}
.stage{color:var(--muted);font-style:italic;font-size:.88em}
.side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:9rem}
.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.chip{font:600 .7rem Inter,sans-serif;border:0;background:var(--chip);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer}
.chip.plain{cursor:default;color:var(--muted)}
.ln .slipw{grid-column:2/4}
.addnote{font:500 .78rem Inter,sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline dotted}
.total{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding-top:8px}
.notes{margin:12px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.slipw{margin-top:8px}
.slipw label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.slipw label .ok{color:var(--pick)}
textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:4px 10px;font-size:.88rem;background:var(--soft)}
.reply b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.compare .card{margin:0;padding:14px}
.compare .ln{grid-template-columns:minmax(0,1fr);gap:2px}
.compare .said{font-size:15.5px}
.compare .side{justify-content:flex-start;max-width:none}
.rank{background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
.rank>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.rank>summary::-webkit-details-marker{display:none}
.rank .n{font:700 1.3rem/1 Inter,sans-serif;color:var(--muted);padding-top:2px}
.rank .nm{font-weight:700}
.rank .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rank .verdict{grid-column:2/4;font-size:.9rem;color:var(--fg)}
.rank .len{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rank .used{font-size:.72rem;font-weight:600;color:var(--pick);margin-left:6px}
.rank[open]>summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.rank .body{padding:6px 18px 16px}
.md table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}
.md td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}
.flash{animation:fl 1.6s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px}
.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}
</style>

<script>
const D = {"page_title": "Door Proof Options", "title": "GPOM: the door and the proof", "about": "This page holds three combined drafts for the bridge between the kill bots' stand-down and Maddie on the step, plus all ten writers' versions ranked underneath. Nothing in the cut, the script or the voices has changed yet.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-01-bone-dry.md", "intro": "Every beat Kai listed survives, every word that is not a protected line or a turn is cut. Six protected lines are the whole script, plus one four-word apology and nothing else. Silence and picture do the rest: the replay is wordless, the lady never concedes aloud, the lock does the deciding. Counted at about 2.8 words a second, with a breath between speakers.", "intro_html": "<p>Every beat Kai listed survives, every word that is not a protected line or a turn is cut. Six protected lines are the whole script, plus one four-word apology and nothing else. Silence and picture do the rest: the replay is wordless, the lady never concedes aloud, the lock does the deciding. Counted at about 2.8 words a second, with a breath between speakers.<\/p>"}, {"id": "02", "name": "The proof talks", "title": "The proof does the talking", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-02-proof-talks.md", "intro": "Every word is either setup or get-out-of-the-way. Maddie's tannoy hello and her boss's apology open the box, the old lady's refusal shuts it (half seen, half heard through the door), and Maddie's one question (\"How could I win your trust?\") is answered by no one. Instead the bunker's own dead CCTV monitors come up by themselves with the stand-down replay, wordless, no commentary, and the decision is made by the faces lit red then green. Nobody says yes; the doors open. Pushed to the extreme: after her question Maddie says nothing at all, the tannoy stays live and hissing, and the humans' only reply is a hand on a wheel.", "intro_html": "<p>Every word is either setup or get-out-of-the-way. Maddie's tannoy hello and her boss's apology open the box, the old lady's refusal shuts it (half seen, half heard through the door), and Maddie's one question (\"How could I win your trust?\") is answered by no one. Instead the bunker's own dead CCTV monitors come up by themselves with the stand-down replay, wordless, no commentary, and the decision is made by the faces lit red then green. Nobody says yes; the doors open. Pushed to the extreme: after her question Maddie says nothing at all, the tannoy stays live and hissing, and the humans' only reply is a hand on a wheel.<\/p>"}, {"id": "03", "name": "The lady asks", "title": "The lady asks", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-03-the-lady-asks.md", "intro": "The other side sets the terms. Maddie never offers the proof; she asks how to win their trust (her protected line), and the old lady answers with a single demand: she heard something huge at her door and she wants to see it. Trust is extracted, not sold. Maddie only concedes and obeys, so the replay is the humans' idea and the scene needs no pitch. Every line turns something, and the lady gets the last word.", "intro_html": "<p>The other side sets the terms. Maddie never offers the proof; she asks how to win their trust (her protected line), and the old lady answers with a single demand: she heard something huge at her door and she wants to see it. Trust is extracted, not sold. Maddie only concedes and obeys, so the replay is the humans' idea and the scene needs no pitch. Every line turns something, and the lady gets the last word.<\/p>"}, {"id": "04", "name": "Comedy first", "title": "Comedy first, the tannoy cuts the row dead", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-04-comedy-first.md", "intro": "The jokes carry the tension and keep it short. We open on Sandra and Derek mid-row (the toilet seat has not been settled in five years), and Maddie's chirpy tannoy lands on top of it, bad timing as a weapon. Every line either gets a laugh or turns the door; the old lady is the one person not laughing, so her refusal hits harder for the clowning round it. The apology is sincere but arrives like a customer-service announcement. The proof is wordless and plays on the bunker's own dead CCTV monitors, so nobody has to explain it.", "intro_html": "<p>The jokes carry the tension and keep it short. We open on Sandra and Derek mid-row (the toilet seat has not been settled in five years), and Maddie's chirpy tannoy lands on top of it, bad timing as a weapon. Every line either gets a laugh or turns the door; the old lady is the one person not laughing, so her refusal hits harder for the clowning round it. The apology is sincere but arrives like a customer-service announcement. The proof is wordless and plays on the bunker's own dead CCTV monitors, so nobody has to explain it.<\/p>"}, {"id": "05", "name": "Through the door", "title": "Through the door", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-05-through-the-door.md", "intro": "The steel door is the instrument. Nobody on either side ever hears the other cleanly: Maddie's tannoy arrives inside as a clipped, squealing bark; the old lady is heard outside as a muffled voice through a foot of Cold War steel. The one clear voice on each side is the one we SEE, so the cut itself is the half-and-half. Whatever is muffled is written in full but needn't be intelligible, which lets the refusal be short, and the proof is not announced: it is heard through the door and seen only as light on faces.", "intro_html": "<p>The steel door is the instrument. Nobody on either side ever hears the other cleanly: Maddie's tannoy arrives inside as a clipped, squealing bark; the old lady is heard outside as a muffled voice through a foot of Cold War steel. The one clear voice on each side is the one we SEE, so the cut itself is the half-and-half. Whatever is muffled is written in full but needn't be intelligible, which lets the refusal be short, and the proof is not announced: it is heard through the door and seen only as light on faces.<\/p>"}, {"id": "06", "name": "The reversal", "title": "The reversal, they prove it to themselves", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-06-reversal.md", "intro": "Maddie does the humble part (tannoy, apology, concession, the open question) and then does nothing at all. Someone inside works out that the bunker's own door camera, a dead-looking CCTV tape loop nobody has checked in five years, recorded the stand-down, and demands to see it. The proof is not presented, it is requested. Maddie never explains what the footage means, because Derek has already understood it. Pushed to the extreme: Maddie has no line after \"How could I win your trust?\"", "intro_html": "<p>Maddie does the humble part (tannoy, apology, concession, the open question) and then does nothing at all. Someone inside works out that the bunker's own door camera, a dead-looking CCTV tape loop nobody has checked in five years, recorded the stand-down, and demands to see it. The proof is not presented, it is requested. Maddie never explains what the footage means, because Derek has already understood it. Pushed to the extreme: Maddie has no line after \"How could I win your trust?\"<\/p>"}, {"id": "07", "name": "The chorus", "title": "The chorus, a hundred doubts through the door", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-07-chorus.md", "intro": "The hundred behind the door are one animal with a hundred mouths. Neither lead argues at length: the old lady gets only her two protected lines, Maddie gets only hers, and everything else the humans feel arrives as overlapping whispered fragments (\"Mine.\" \"Don't.\" \"It's talking.\") that cut under and across the leads, so resistance is heard as a crowd rather than a debate. The crowd stops dead for the replay, and its silence is the answer.", "intro_html": "<p>The hundred behind the door are one animal with a hundred mouths. Neither lead argues at length: the old lady gets only her two protected lines, Maddie gets only hers, and everything else the humans feel arrives as overlapping whispered fragments (\"Mine.\" \"Don't.\" \"It's talking.\") that cut under and across the leads, so resistance is heard as a crowd rather than a debate. The crowd stops dead for the replay, and its silence is the answer.<\/p>"}, {"id": "08", "name": "Place is argument", "title": "The door's own camera is the argument", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-08-place-is-argument.md", "intro": "I let one object in the bunker do the arguing: the old CCTV wall by the blast door, five years of grey snow that the humans stare at out of habit, fed by a single door camera nobody trusted. Maddie never offers evidence and never explains. She only points at what the room already owns (\"Your door's got a camera. Give it a thump.\"), so the humans pull the proof out themselves and the decision stays theirs. The replay is their own camera's footage, not her beacon's, so it can't be accused of being a trick; the green STAND DOWN is the only colour on a grey screen and it lights a hundred faces. Spoken words are cut to the bone because the monitor, the muffle and the track marks outside carry the rest.", "intro_html": "<p>I let one object in the bunker do the arguing: the old CCTV wall by the blast door, five years of grey snow that the humans stare at out of habit, fed by a single door camera nobody trusted. Maddie never offers evidence and never explains. She only points at what the room already owns (\"Your door's got a camera. Give it a thump.\"), so the humans pull the proof out themselves and the decision stays theirs. The replay is their own camera's footage, not her beacon's, so it can't be accused of being a trick; the green STAND DOWN is the only colour on a grey screen and it lights a hundred faces. Spoken words are cut to the bone because the monitor, the muffle and the track marks outside carry the rest.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft (concede, ask, then let the image answer)", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-09-borrowed-craft.md", "intro": "I looked at how films compress \"why would they trust the enemy\" and took five techniques (below), then pushed them to the extreme: Maddie only concedes and asks, never argues or explains; the old lady is the whole hundred in one face; the proof is the only answer, and it arrives as a colour change on faces (red to green) with no line spoken after it. Every spoken line either hurts or turns the scene, and the scene ends on a bolt, not a sentence.\n\n**Research: how others do it (from memory, described not quoted).**\n- *The Day the Earth Stood Still* (1951): Klaatu's proof is a demonstration of power used with restraint (the world's machines stop, nobody is hurt). Trust comes from what a dangerous thing chose NOT to do.\n- *Terminator 2*: Sarah Connor is won over by watching the machine hold back (it disables people without killing them) and by seeing it in front of her son, not by anything it says. Restraint shown, not claimed.\n- *Arrival*: Louise takes off the protective suit in the chamber. The offer is vulnerability, made first, and nobody argues it. Trust is a risk taken in front of the other side.\n- *WALL-E*: the humans on the ship are moved by footage of Earth and a living plant, with almost no talk. The image does the persuading; faces change in silence.\n- *The Iron Giant* and *E.T.*: the child decides, then the adults catch up. A single small person stands in for the crowd's decision; the crowd's doubt is voiced by one stern figure, then dropped on a visual beat.\n- *Paddington*: the family's turn happens through one doubter being overruled by the least expected person in a couple of lines. The \"yes\" is a half-sentence, never a speech.\n\n**Techniques extracted.** (1) Proof by restraint: show the costly thing the stronger party did not do. (2) Concede first: the one who agrees with the objection ends the argument. (3) Ask, don't assert: handing the question to the other side gives them the agency, so the decision feels theirs. (4) One face for the crowd: the hundred is a murmur; one stern person carries the resistance and the turn. (5) Wordless turn: the decision is a change in light or a mechanical sound, never a stated \"OK\".", "intro_html": "<p>I looked at how films compress \"why would they trust the enemy\" and took five techniques (below), then pushed them to the extreme: Maddie only concedes and asks, never argues or explains; the old lady is the whole hundred in one face; the proof is the only answer, and it arrives as a colour change on faces (red to green) with no line spoken after it. Every spoken line either hurts or turns the scene, and the scene ends on a bolt, not a sentence.<\/p>\n<p><b>Research: how others do it (from memory, described not quoted).<\/b><\/p>\n<ul><li><i>The Day the Earth Stood Still<\/i> (1951): Klaatu's proof is a demonstration of power used with restraint (the world's machines stop, nobody is hurt). Trust comes from what a dangerous thing chose NOT to do.<\/li><li><i>Terminator 2<\/i>: Sarah Connor is won over by watching the machine hold back (it disables people without killing them) and by seeing it in front of her son, not by anything it says. Restraint shown, not claimed.<\/li><li><i>Arrival<\/i>: Louise takes off the protective suit in the chamber. The offer is vulnerability, made first, and nobody argues it. Trust is a risk taken in front of the other side.<\/li><li><i>WALL-E<\/i>: the humans on the ship are moved by footage of Earth and a living plant, with almost no talk. The image does the persuading; faces change in silence.<\/li><li><i>The Iron Giant<\/i> and <i>E.T.<\/i>: the child decides, then the adults catch up. A single small person stands in for the crowd's decision; the crowd's doubt is voiced by one stern figure, then dropped on a visual beat.<\/li><li><i>Paddington<\/i>: the family's turn happens through one doubter being overruled by the least expected person in a couple of lines. The \"yes\" is a half-sentence, never a speech.<\/li><\/ul>\n<p><b>Techniques extracted.<\/b> (1) Proof by restraint: show the costly thing the stronger party did not do. (2) Concede first: the one who agrees with the objection ends the argument. (3) Ask, don't assert: handing the question to the other side gives them the agency, so the decision feels theirs. (4) One face for the crowd: the hundred is a murmur; one stern person carries the resistance and the turn. (5) Wordless turn: the decision is a change in light or a mechanical sound, never a stated \"OK\".<\/p>"}, {"id": "10", "name": "Ending first", "title": "Ending first, the proof is only ever seen on faces", "file": "design/2026-11-02-gpom-dialogue-door-proof/shape-10-ending-first.md", "intro": "I wrote the last ten seconds first and let them decide everything before them. The ending is eight wordless seconds in which we never see the stand-down footage itself, only its light on the hundred faces and reflected in the old lady's glasses: red, racing, a brake, green. Then the doors open on Maddie small in the daylight, so C's \"Go on. I promise you'll be okay.\" is the first thing anyone says after the proof. Working backwards, the humans never get a line that concedes anything, because the conceding has to be the picture. That leaves only what the proof is the answer to: a hello, a grief, a refusal, and a question. Every word earns its place by making the silence afterwards the answer.", "intro_html": "<p>I wrote the last ten seconds first and let them decide everything before them. The ending is eight wordless seconds in which we never see the stand-down footage itself, only its light on the hundred faces and reflected in the old lady's glasses: red, racing, a brake, green. Then the doors open on Maddie small in the daylight, so C's \"Go on. I promise you'll be okay.\" is the first thing anyone says after the proof. Working backwards, the humans never get a line that concedes anything, because the conceding has to be the picture. That leaves only what the proof is the answer to: a hello, a grief, a refusal, and a question. Every word earns its place by making the silence afterwards the answer.<\/p>"}], "dialogues": [{"id": "1", "label": "The door and the proof", "where": "Between scene A's stand-down and scene C's step", "scene": "second-half-c-walk-out", "target": "spoken 20 s or less; whole bridge about 35 s including a wordless ~8 s replay", "now_from": "scene C round 7 (a black card)", "now": [{"who": "card", "line": "Some negotiation later."}], "drafts": [{"id": "1G", "name": "1F + the boom (heard, not seen)", "length": "about 32 s spoken", "total": "~35 s spoken, ~60 s bridge", "bet": "Kai, 2 Nov: we hear the explosion. After the film, Maddie blows up the kill bot off screen; the bunker hears it, Derek sees the smoking wreck through the periscope, then Maddie leaves. Proof they witnessed themselves.", "lines": [{"who": "Maddie (tannoy, outside, doors shut, chirpy)", "line": "Hey, humans! Sorry about the intrusion.", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie (same breath, quick, quieter: the aside)", "line": "[mumbled] ...And everything else.", "tags": ["Kai"], "s": "1.5"}, {"who": "Maddie", "line": "We didn't think there were any of you left. [pause] But now we've found you... there might be a way we could fix this mess.", "tags": ["Kai"], "s": "6"}, {"who": "Old lady (INSIDE, seen, shouting at the door)", "line": "Are you literally joking?", "tags": ["Kai"], "s": "1.5"}, {"who": "Old lady (OUTSIDE on Maddie: the same shout, muffled through the steel)", "line": "You killed everybody!", "tags": ["Kai"], "s": "1.5"}, {"who": "Maddie (tannoy lowered)", "line": "Yeah. [pause] That's... that's fair.", "tags": ["Kai"], "s": "2.5"}, {"who": "Maddie", "line": "How can we win your trust?", "tags": ["Kai"], "s": "1.8"}, {"who": "Maddie (answering herself, gently)", "line": "Look. We really do understand this has gone the worst way for everybody. [pause] I'll leave you a film to watch. It's our best go at proving it.", "tags": ["Kai"], "s": "7"}, {"who": "(wordless: the film)", "line": "[Room shot BP1-e-b, the TV in the distance under the megaphone. On it (post): wa-05, the kill bot's own eyes racing at THEIR door, red KILL MODE; it brakes; the HUD flips to NEW OBJECTIVE: SUSTAIN ORGANIC LIFE (hud.py peace state, same as scene A); they file away. The screen light goes red to green on the backs of their heads.]", "tags": ["Kai", "F1", "F2"], "s": "10"}, {"who": "Maddie (tannoy, brisk)", "line": "Oh, and... [beat] thought you'd want to hear this bit for yourselves.", "tags": ["claude"], "s": "3"}, {"who": "(sfx + wordless)", "line": "[A deep, muffled BOOM through the earth. The bulb under the megaphone swings; dust sifts down from the vault onto upturned faces.]", "tags": ["Kai"], "s": "3"}, {"who": "(wordless: F3)", "line": "[Derek at the periscope (BP2-d-b): he presses his eye to it. Cut to what he sees (BP3-e-a): the kill bot a burnt-out wreck, turret blown off, a thread of smoke, a crow landing on it; Maddie waiting near-left, beacon lit.]", "tags": ["Kai", "F3"], "s": "6"}, {"who": "Maddie (tannoy, through the periscope view; her beacon pulses)", "line": "Right. I'll come back tomorrow.", "tags": ["Kai"], "s": "2"}, {"who": "(wordless)", "line": "[Through the periscope: Maddie trundles away out of the circle. Derek steps back from the eyepiece.]", "tags": ["claude"], "s": "2"}, {"who": "Sandra (to the old lady, not taking her eyes off the screen)", "line": "If there's a way to fix this, I'd love to take it. It fucking sucks living in this bunker. [beat] With grumpy Derek.", "tags": ["Kai"], "s": "5.5"}, {"who": "Derek", "line": "[off] Oi.", "tags": ["claude"], "s": "0.5"}, {"who": "Old la ady (INSIDE seen, then OUTSIDE muffled)", "line": "Are you literally joking? [cut outside, muffled] You killed everybody!", "tags": ["Kai"], "s": "3"}, {"who": "Maddie", "line": "Yeah. That's fair. [pause] How can we win your trust?", "tags": ["Kai"], "s": "3"}, {"who": "Maddie", "line": "I'll leave you a film. Our best go at proving it. I'll come back tomorrow.", "tags": ["Kai"], "s": "4.5"}, {"who": "(wordless: the film)", "line": "[Kill bot's eyes: KILL MODE; brake; NEW OBJECTIVE: SUSTAIN ORGANIC LIFE. Faces lit by it.]", "tags": ["Kai", "02"], "s": "7"}, {"who": "Sandra", "line": "If there's a way to fix this, I'll take it. It fucking sucks in this bunker. With grumpy Derek.", "tags": ["Kai"], "s": "4.5"}, {"who": "Old lady", "line": "And we're running out of food. [pause] Let's vote.", "tags": ["Kai"], "s": "2.5"}, {"who": "(card)", "line": "The next day.", "tags": ["Kai"], "s": "2"}], "notes": ["Cuts from 1D: 'We really do understand this has gone the worst way for everybody', 'Oi', the hands going up, one 'grumpy'.", "Risk: without 'We really do understand...' the apology is only the joke plus 'That's fair'."]}, {"id": "1A", "name": "The lady sets the terms", "length": "about 20 s", "total": "~20 s spoken, ~38 s bridge", "bet": "Real resistance beats a clever mechanism: the humans only open the door because the old lady demands to see, so the proof is extracted, not sold, and Maddie never pitches.", "lines": [{"who": "Maddie (tannoy, outside, feedback squeal first)", "line": "Oh, hello, humans. Sorry about the intrusion.", "tags": ["Kai", "all"], "s": "3.0"}, {"who": "Maddie (tannoy, the cheer slipping)", "line": "And, you know. All of it.", "tags": ["03", "10", "09"], "s": "1.5"}, {"who": "Old lady (INSIDE, seen, existing lip-sync take)", "line": "Your boss killed everyone we ever loved.", "tags": ["Kai", "all"], "s": "2.5"}, {"who": "Old lady (OUTSIDE shot of Maddie, muffled through the steel)", "line": "There's no way we're going anywhere with you. You killed everybody.", "tags": ["Kai", "all"], "s": "3.2"}, {"who": "Maddie (tannoy lowered, her own voice)", "line": "I don't blame you. I can see how it looks.", "tags": ["Kai", "all"], "s": "2.3"}, {"who": "Maddie", "line": "We've got a way we might be able to fix this. How could I win your trust?", "tags": ["Kai", "all"], "s": "3.8"}, {"who": "Old lady (INSIDE, up at the spyhole, clear again)", "line": "Something came to our door. Show me.", "tags": ["03"], "s": "2.0"}, {"who": "(wordless replay)", "line": "[Bunker's dead CCTV monitors flicker on one by one: red KILL MODE racing at this very door, brake, flip to green STAND DOWN, filing away. Cut to a hundred faces lit by it, Sandra's hand over her mouth, Derek silent for once. Hold on the old lady's glasses holding two green rectangles.]", "tags": ["02", "09", "10"], "s": "8.0"}, {"who": "Old lady (quiet, to the room)", "line": "Derek. The bolts.", "tags": ["03"], "s": "1.3"}, {"who": "(wordless)", "line": "[Bolts. The door grinds open on daylight. Hand to C: Maddie on the step.]", "tags": ["02", "10"], "s": "3.0"}], "notes": ["Spoken total 19.8 s. If it runs long, cut 'And, you know. All of it.' (-1.5 s) first.", "Dropped Kai's 'Yeah,' and 'The thing is,' for time; restore 'Yeah,' as a one-word lead-in if budget allows.", "Risk: 'Show me' can read as Maddie being led; play her relieved. Needs a low thump or rumble in scene A so 'Something came to our door' is earned.", "Risk: needs one new plate of the CCTV bank and a stand-down insert matching A's angle.", "Maddie says nothing during or after the replay; she never explains the footage."]}, {"id": "1B", "name": "Silence is the yes", "length": "about 18 s", "total": "~18 s spoken, ~35 s bridge", "bet": "The tightest honest version: Maddie concedes and asks, nobody answers in words, and the decision is a hand on a wheel, so the faces going red then green carry everything.", "lines": [{"who": "Maddie (tannoy, outside, feedback squeal)", "line": "Oh, hello, humans. Sorry about the intrusion.", "tags": ["Kai", "all"], "s": "3.0"}, {"who": "Maddie (tannoy)", "line": "My boss is ever so sorry. About all of it.", "tags": ["02", "09"], "s": "3.0"}, {"who": "Old lady (INSIDE, seen, not raising her voice)", "line": "Your boss killed everyone we ever loved.", "tags": ["Kai", "all"], "s": "2.5"}, {"who": "Old lady (OUTSIDE, muffled, door in frame)", "line": "There's no way we're going anywhere with you. You killed everybody.", "tags": ["Kai", "all"], "s": "3.2"}, {"who": "Maddie (no tannoy, small, close)", "line": "I don't blame you. I can see how it looks.", "tags": ["Kai", "all"], "s": "2.3"}, {"who": "Maddie", "line": "We've got a way we might be able to fix this.", "tags": ["Kai", "all"], "s": "2.4"}, {"who": "Maddie (lifts the tannoy again)", "line": "How could I win your trust?", "tags": ["Kai", "all"], "s": "1.6"}, {"who": "(wordless)", "line": "[Tannoy hiss left open. No answer. The fan. Cut inside: the lady looks at the dark monitors.]", "tags": ["02", "09"], "s": "2.0"}, {"who": "(wordless replay)", "line": "[Old CCTV monitors come up by themselves; the replay seen mostly as red then green light on faces and in the old lady's glasses, one money-shot glimpse of STAND DOWN. Her hand goes to the wheel.]", "tags": ["02", "09", "10"], "s": "8.0"}, {"who": "(wordless)", "line": "[Bolts one at a time; door grinds open on daylight. Hand to C.]", "tags": ["01", "10"], "s": "3.5"}], "notes": ["Spoken 18.0 s, protected lines all verbatim, plus one new line ('My boss is ever so sorry').", "'My boss' hands the old lady her hook for 'Your boss killed everyone', so the refusal has a cause on screen.", "Cut from every other shape: any lady rebuttal, any Sandra/Derek gag, any Maddie narration over the replay.", "Risk: the humans cave in about 15 s with no spoken turn; the faces and the wheel must be sold by the performance and sound (tannoy hiss, the row going dead).", "Risk: replay fatigue, the audience just saw the stand-down; show it from the humans' side, with S6 only for the money shot.", "Risk: the closest to 'no dialogue'; Kai asked for 'a bit'."]}, {"id": "1C", "name": "Laugh, then grief", "length": "about 20 s", "total": "~20 s spoken, ~36 s bridge", "bet": "The tannoy cutting the toilet-seat row dead gets the laugh Kai loved, and the old lady is the one person not laughing, so the refusal hits harder for the clowning round it.", "lines": [{"who": "(sfx)", "line": "[Inside, dim: Sandra and Derek mid-row, hushed. A tannoy SQUEAL cuts them dead; a hundred heads turn to the door.]", "tags": ["04"], "s": "1.5"}, {"who": "Maddie (tannoy, chirpy, mic too close)", "line": "Oh, hello, humans. Sorry about the intrusion.", "tags": ["Kai", "all"], "s": "3.0"}, {"who": "Derek (whisper, to Sandra)", "line": "Is that about the seat?", "tags": ["04"], "s": "1.5"}, {"who": "Maddie (tannoy, the cheer slipping)", "line": "And the rest of it. Sorry.", "tags": ["04", "03"], "s": "2.0"}, {"who": "Old lady (INSIDE, seen, not whispering)", "line": "Your boss killed everyone we ever loved.", "tags": ["Kai", "all"], "s": "2.5"}, {"who": "Old lady (OUTSIDE, muffled)", "line": "There's no way we're going anywhere with you. You killed everybody.", "tags": ["Kai", "all"], "s": "3.0"}, {"who": "Maddie (no tannoy, to the door)", "line": "I don't blame you. I can see how it looks.", "tags": ["Kai", "all"], "s": "2.2"}, {"who": "Maddie", "line": "We've got a way we might be able to fix this. How could I win your trust?", "tags": ["Kai", "all"], "s": "3.6"}, {"who": "(wordless replay)", "line": "[Dead CCTV monitors flicker up; red KILL MODE at this very door, brake, green STAND DOWN, filing away. A hundred faces lit by it; Sandra's mouth open mid-row, Derek has stopped chewing.]", "tags": ["02", "09", "10"], "s": "8.0"}, {"who": "Old lady (not looking away from the screen)", "line": "Derek. Door.", "tags": ["04", "03"], "s": "1.2"}, {"who": "(wordless)", "line": "[Wheel turns, bolts, door grinds open onto daylight. Hand to C.]", "tags": ["02", "10"], "s": "3.0"}], "notes": ["Spoken 19.0 s.", "Giving 'Derek. Door.' to the old lady (not Sandra) keeps the decision hers; the draft-1 shape had Sandra say it, which undercuts the resistance.", "Risk: the seat gag sours the apology if the room is still laughing at 'And the rest of it. Sorry.'; the cheer must slip on that line. It also depends on the audience remembering the seat from scene A.", "Risk: the half-and-half needs the seen and muffled voice to be clearly the same woman.", "Dropped 'Yeah,' and 'The thing is,' for time."]}], "ranking": [{"rank": 1, "shape": "03", "length": "~20 s", "verdict": "Strongest resistance: the lady turns Maddie's open question into a condition ('Show me'), so the decision is the humans' and the replay is an answer, not a pitch. Fails: sits right at the 20 s ceiling, 'Something came to our door' needs scene A to plant it, and 'Show me' half-states the mechanism."}, {"rank": 2, "shape": "09", "length": "~19.5 s", "verdict": "Best craft logic (concede first, ask, restraint shown not claimed) and 'my boss' gives the refusal a cause. Fails: the lady's two refusal lines say nearly the same thing, the bridge runs ~36 s, and the apology rides on a volume drop."}, {"rank": 3, "shape": "02", "length": "~19 s", "verdict": "Cleanest and nearest to Kai's brief; the faces make the decision. Fails: no spoken turn at all after the question, so the cave-in risks feeling sudden, and nine camera setups is a lot to shoot for a short bridge."}, {"rank": 4, "shape": "10", "length": "~19 s", "verdict": "Elegant: the replay is only light on faces and glasses, so it is cheap and not a repeat of scene A. Fails: nobody inside concedes anything, so the choice must live in a glasses reflection; 'Everything' is thin."}, {"rank": 5, "shape": "01", "length": "~19.5 s", "verdict": "On target, nothing wasted. Fails: seven seconds of Maddie in a row is a run-up; 'Everything.' can read flip; no comic air, so the tannoy squeal has to earn all of it."}, {"rank": 6, "shape": "06", "length": "~19 s", "verdict": "Humans work out the proof for themselves, which is persuasive. Fails: invents a still-taping door camera that must be planted, and removes Maddie from the replay, against Kai's 'Maddie replays it'."}, {"rank": 7, "shape": "05", "length": "~19 s", "verdict": "Door-as-instrument is the right sound idea (adopted in every draft). Fails: 'Right. Have a look at this, then.' explains the move; the proof then costs Maddie a line the others do without."}, {"rank": 8, "shape": "08", "length": "20 s", "verdict": "The thump-the-camera idea is a good joke and the tread marks are a nice outside proof. Fails: a working five-year-old camera is a plausibility cheat, 'give it a thump' can read flippant after the grief, and it needs a new monochrome asset."}, {"rank": 9, "shape": "04", "length": "20 s", "verdict": "The tannoy-cutting-a-row gag is the one Kai loved. Fails as a whole: the seat joke risks souring the apology, and Sandra deciding ('Derek. Door.') undercuts the old lady; kept only as the gag in 1C."}, {"rank": 10, "shape": "07", "length": "~20 s", "verdict": "Fails: whispered overlapping crowd lines turn to mush in the mix, the 1 s beats are cuttable without loss, and a collective voice scene C will not carry through."}], "protected": {"columns": ["Oh, hello, humans. Sorry about the intrusion.", "Your boss killed everyone we ever loved.", "There's no way we're going anywhere with you. You killed everybody.", "I don't blame you. I can see how it looks.", "We've got a way we might be able to fix this.", "How could I win your trust?"], "rows": {"1A": ["verbatim", "verbatim", "verbatim", "verbatim", "verbatim", "verbatim"], "1B": ["verbatim", "verbatim", "verbatim", "verbatim", "verbatim", "verbatim"], "1C": ["verbatim", "verbatim", "verbatim", "verbatim", "verbatim", "verbatim"]}}, "shapes": {"01": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie (tannoy, outside, doors shut) | [chirpy, a squeal of feedback first] Oh, hello, humans. Sorry about the intrusion. And, well. Everything. | 5.0 |\n| Old lady (INSIDE, on camera, lip-synced; existing take) | Your boss killed everyone we ever loved. | 3.0 |\n| Old lady (OUTSIDE shot of Maddie, voice muffled through the door; same breath, cut mid-line) | [muffled] ...There's no way we're going anywhere with you. You killed everybody. | 4.5 |\n| Maddie (no tannoy now, close, quiet) | I don't blame you. I can see how it looks. We've got a way we might be able to fix this. How could I win your trust? | 7.0 |\n| (wordless) | [Beat of nothing, 1.5 s. Old CCTV monitors flicker on across the bunker wall: the door camera's own recording. Red KILL MODE racing at the camera, braking, flipping to green STAND DOWN, filing away. A hundred faces lit by it, nobody speaking. Hold on the old lady's face.] | 8.0 |\n| (wordless) | [Bolts. Chain. The blast door grinds open on daylight. Cut to Scene C, Maddie on the step.] | 4.0 |\n| **Total** | Spoken 19.5 s. Whole bridge about 35 s with the room tone, the card gone, the cutaways and the door. | **~35** |\n\n**Why it works.** The only argument in the scene is the picture. The lady refuses twice in ten seconds (seen, then heard through steel), Maddie concedes in one breath and asks the question, and the answer is not a line but eight seconds of the thing they missed. Nobody says \"we trust you\" or \"we'll come\": the doors opening is the decision. The muffled half also hides that the lady never gets a second speech to hold. Maddie's \"And, well. Everything.\" is the whole apology: dry, small, and exactly in her gossipy cheer, so the sincerity comes from how little she dresses it. Showing the replay on the bunker's own old CCTV monitors means the humans watch themselves be spared, on their own screens, with no gadget for Maddie to explain; the faces lit by it are the payoff Kai asked for.\n\n**Cuts from current.** The black card \"Some negotiation later.\" goes, and the whole off-screen negotiation it papers over. Cut from Kai's version: any second line of apology, any lady rebuttal after \"How could I win your trust?\", any Derek or Sandra gag, any explanation of what the footage is. Maddie says nothing during or after the replay.\n\n**Risk.** Seven seconds of Maddie in a row (\"I don't blame you... win your trust?\") is the closest this shape comes to a speech and could read as a run-up. The apology is thin: \"Everything.\" may feel flip rather than sincere unless the tannoy performance sells a half-second crack. With no word from anyone after the replay, a viewer could ask why the lady folds; the held face and the bolts must carry it, so the replay cut needs to land on her specifically. Muffling the second refusal means \"You killed everybody\" must still be legible; test it on the mix. And it leaves no comic relief, so the tannoy feedback squeal has to earn the laugh.\n\n**Protected lines.** All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" / \"There's no way we're going anywhere with you. You killed everybody.\" / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\" The only addition is the four-word apology tail \"And, well. Everything.\"; if the director wants even less, drop it and the spoken total is 17.5 s.", "02": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie (tannoy, outside, doors shut) | [tannoy clicks on, a squeal of feedback, the row inside stops dead] \"Oh, hello, humans. Sorry about the intrusion.\" | 3.0 |\n| Maddie (tannoy) | \"My boss is ever so sorry. About all of it.\" | 3.0 |\n| Old lady (seen, inside, CU, existing lip-synced take) | [not raising her voice] \"Your boss killed everyone we ever loved.\" | 2.8 |\n| Old lady (heard, muffled through the door; cut to outside, Maddie's back to us, lens on the shut door) | [the words arrive thick and thin, bass and no top end] \"There's no way we're going anywhere with you. You killed everybody.\" | 3.5 |\n| Maddie (outside, no tannoy, small, close) | [a beat, her beacon dips] \"I don't blame you. I can see how it looks.\" | 2.6 |\n| Maddie | \"We've got a way we might be able to fix this.\" | 2.4 |\n| Maddie | [lifts the tannoy again] \"How could I win your trust?\" | 1.6 |\n| (pauses between lines, tannoy hiss left open) | [no one answers; the fan; the hiss] | 1.5 |\n| (wordless) Silence beat, then the dead CCTV monitors on the bunker wall flicker on by themselves | [no line] | 1.5 |\n| (wordless) THE REPLAY on the monitors | [no line: red KILL MODE racing at the door, brakes, flips to green STAND DOWN, they file away] | 8.0 |\n| (wordless) Faces lit by it, the decision | [no line: a hundred faces going red then green; Sandra and Derek stop mid-bicker; the old lady's hand goes to the wheel] | 3.0 |\n| (wordless) The doors open on daylight; cut to C | [no line: the wheel turns, bolts, light across the floor; hands straight on to Maddie on the step: \"Go on.\"] | 2.0 |\n| **Total** | **Spoken 18.9 s; whole bridge** | **~34.9** |\n\nShots relied on:\n- **S1** (new) bunker blast door, exterior, shut, Maddie small in frame with a tannoy;\n- **S2** (existing lip-synced take) the old lady, CU, \"Your boss killed everyone we ever loved\";\n- **S3** (new) over Maddie's shoulder onto the shut door, held static for the muffled line;\n- **S4** (new) Maddie CU for her three lines;\n- **S5** (new) interior wide: the old bunker CCTV bank flickering to life, a hundred silhouettes in front of it;\n- **S6** (reused from scene A) the stand-down footage, recut to ~8 s and shown on the monitors (3 s red race, 2 s brake, 1.5 s flip to green STAND DOWN, 1.5 s file away);\n- **S7** (new) face CUs lit red then green: old lady, Derek, Sandra, a kid, a man with his eyes shut;\n- **S8** (new) the old lady's hand on the door wheel;\n- **S9** (new) the doors parting onto daylight, which is the hand-off to scene C.\n\nHow the replay is shown: the bunker's own old CCTV, dead for five years, comes up on its own. Maddie never says she did it and never narrates it. The footage is seen mostly as light on faces (S7) and reflected in the old lady's glasses, with S6 for the money shot only.\n\n**Why it works.** Kai's worry is that opening the dialogue box makes it huge; here the box is one exchange wide because every line is either an apology, a refusal, a concession or a question, and the answer is not a line at all. The refusal is protected from rebuttal by the half-and-half trick (the muffled half can't be argued with, so Maddie concedes instead of persuading), which keeps her warm and not pleading. The proof asks nothing of the audience to decode: red to green is the whole argument, and the faces turning from red to green carry the decision so nobody has to say \"we trust you\". It proves only that the boss had them dead and chose not to; Maddie never claims more, so scene D keeps its doubt. The \"my boss is ever so sorry\" line reports his feelings, not hers, and the old lady's \"your boss\" picks the word straight up, which gives the refusal a hook with no extra words.\n\n**Cuts from current.** The black card \"Some negotiation later.\" goes. So do Kai's \"Yeah,\" and \"The thing is,\" connective tissue, any second line from the lady, any line from Sandra, Derek or the hundred (they appear as faces and a murmur only), any Maddie narration over the replay (\"look, here's what happened\"), and any spoken answer to \"How could I win your trust?\"\n\n**Risk.** (1) Sudden: from refusal to open in about 15 s may feel like the humans caved without a turn, so the 8 s replay and the 3 s of faces have to do real persuading, and the sound (tannoy hiss, the row going silent, the fan) has to sell the shift. (2) Replay fatigue: the audience watched this same stand-down minutes ago in scene A; it only works if S5/S7 show it from a new angle (the humans' side, light on faces) and S6 is cut tighter than scene A. (3) Reading: with no word from Maddie, a viewer may think the feed is a fake or that the monitors came on by chance; one visible beat of her beacon pulsing outside, or a cable, would fix it. (4) Kai said \"a bit of dialogue\"; this has less than any other likely shape and may feel too silent for him. (5) Perhaps the biggest: the old lady's hand on the wheel is the whole decision, and if the performance is weak the bridge fails.\n\n**Protected lines.** All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" / \"There's no way we're going anywhere with you. You killed everybody.\" / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\" Only change: \"Yeah,\" dropped from the front of \"I don't blame you\", which is not in the protected string.", "03": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie (tannoy, outside, chirpy, a squeal of feedback first) | Oh, hello, humans. Sorry about the intrusion. [beat, the cheer slips] And, you know. All of it. | 4.0 |\n| Old lady (INSIDE, seen, close on her face, clear) | Your boss killed everyone we ever loved. | 2.5 |\n| [CUT OUTSIDE: Maddie at the door, audio now muffled through steel and earth] Old lady (muffled) | There's no way we're going anywhere with you. You killed everybody. | 3.2 |\n| Maddie (tannoy) | I don't blame you. I can see how it looks. | 2.3 |\n| Maddie (tannoy) | We've got a way we might be able to fix this. How could I win your trust? | 4.0 |\n| [CUT INSIDE: long pause, a hundred faces turned to the old lady. She steps right up to the spyhole, audio clear again] Old lady | Something came to our door. Show me. | 2.0 |\n| Maddie (tannoy, small) | Hang on. | 0.7 |\n| [THE REPLAY, wordless, about 8 s: the bunker's dead CCTV monitors flicker on one by one and the feed comes up. Red KILL MODE racing at this very door, braking on the step, flipping to green STAND DOWN, filing away. Cut between the footage and the faces: a hundred of them, the green light on their skin, Sandra's hand over her mouth, Derek not saying anything for once.] | (no words) | 8.0 |\n| Old lady (quiet, to the room, not the door) | Derek. The bolts. | 1.3 |\n| [Bolts, the door groans open on daylight. Hand straight on to scene C: Maddie on the step.] | (no words) | 2.0 |\n| **Total** | Spoken 20.0 s; whole bridge about 38 s | **20.0 spoken** |\n\n**Why it works.** The humans are never persuaded by anything Maddie says; they are persuaded by something they themselves insisted on seeing, which is the only way a grieving woman in charge of a hundred people could believably budge in 35 seconds. \"Show me\" is also the push-back the old doorstep talk never had: she turns Maddie's open question into a condition, so the scene has a single decision and the replay is its answer, not a lecture. The lady's \"Derek. The bolts.\" gives the decision without anyone saying \"we trust you\", and Derek, handed the job, supplies the comic release that the stand-down needs after the dread. Half and half does its work: the seen line is the bare protected grievance, the muffled line is the refusal, and the clear \"Show me\" is the only moment the door seems to open, which is what the audience feels before it physically does.\n\n**Cuts from current.** The black card \"Some negotiation later.\" goes entirely; the negotiation is now the bridge. Nothing about the AI's feelings, the time machine or why it happened is added; Maddie's whole case is five protected-ish sentences and one obedient \"Hang on.\"\n\n**Risk.** (1) \"Show me\" can read as Maddie being led by the nose; play her \"Hang on.\" as relieved, not defeated. (2) The lady knowing something \"came to our door\" depends on the humans having heard the kill bots arrive through the earth; scene A must keep the rumble audible (or add a single low thump on the door). (3) The monitors-come-alive method needs one new plate of a dead CCTV bank and a footage insert that matches scene A's stand-down angle. (4) The tannoy \"And, you know. All of it.\" is the only apology and it must carry the sincerity from her high-street intro; if it lands as flippant, the lady's second line loses its sting. (5) Roughly 38 s with the replay; if it runs long, drop \"Hang on.\" first, then shave the final door beat.\n\n**Protected lines.** All six survive verbatim. \"Oh, hello, humans. Sorry about the intrusion.\" opens the scene, followed by a short new apology tail. \"Your boss killed everyone we ever loved.\" is the seen, clear take (existing lip-sync reused). \"There's no way we're going anywhere with you. You killed everybody.\" is the muffled take, unchanged. \"I don't blame you. I can see how it looks.\" and \"We've got a way we might be able to fix this.\" and \"How could I win your trust?\" run in Maddie's order, with the \"Yeah,\" from Kai's note dropped for time; restore it as a one-word lead-in if the budget allows.", "04": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| [Inside, dim. Sandra and Derek mid-row, hushed, at full pelt. A tannoy SQUEAL cuts them dead. A hundred heads turn to the door.] | (sfx only) | 2.0 (unspoken) |\n| Maddie [tannoy, chirpy, mic too close] | \"Oh, hello, humans. Sorry about the intrusion.\" | 3.0 |\n| Derek [whisper, to Sandra] | \"Is that about the seat?\" | 1.5 |\n| Maddie [tannoy, a little softer, the cheer slipping] | \"And the rest of it. Sorry.\" | 2.0 |\n| Old lady [SEEN, inside, not whispering, existing lip-synced take] | \"Your boss killed everyone we ever loved.\" | 3.0 |\n| [Cut outside: Maddie on the step, head tilted at the blast door. Audio muffled through steel.] | (beat) | 0.5 (unspoken) |\n| Old lady [MUFFLED through the door, low-passed, the room a murmur behind her] | \"There's no way we're going anywhere with you. You killed everybody.\" | 2.8 |\n| Maddie [no tannoy now, lowered, to the door] | \"I don't blame you. I can see how it looks.\" | 2.4 |\n| Maddie | \"We've got a way we might be able to fix this.\" | 2.4 |\n| Maddie [the tannoy back up, out of habit, then she winces and lowers it] | \"How could I win your trust?\" | 1.7 |\n| [THE PROOF, wordless. The bunker's dead CCTV monitors flicker up, one by one, the old green-grey feed taking Maddie's signal: red KILL MODE racing at this very door, brakes, flips to green STAND DOWN, the bots file away. A hundred faces lit by it. Sandra's mouth open mid-row. Derek has stopped chewing.] | (no words, low hum, no music sting) | 8.0 (unspoken) |\n| Sandra [not looking away from the screen] | \"Derek. Door.\" | 1.2 |\n| [Wheel lock turns, doors grind open onto daylight. Cut to C.] | (sfx) | 3.0 (unspoken) |\n| **Total spoken** | | **20.0** |\n| **Whole bridge (spoken + unspoken)** | | **~35** |\n\n- **Why it works.** The comedy is the tension valve: the audience laughs at Sandra and Derek, then the old lady drops the temperature to zero with a line nobody can joke over, and the laugh dies in the room the way it would in life. Because the humour ends where the grief begins, the refusal reads as real resistance instead of a speed bump. The tannoy and \"Derek. Door.\" bracket the scene: a chirpy voice interrupting a petty row, and a petty-row voice ending the standoff. Nobody says \"we trust you\"; the decision is a married woman telling her husband to open a door. The proof does the persuading, so no one has to talk themselves round, and the stand-down is shown in the bunker's own CCTV so the humans see it with the kit they already own.\n- **Cuts from current.** The black card \"Some negotiation later.\" goes entirely. No time machine, no cost, no explaining, no second round of argument, no Maddie pleading.\n- **Risk.** Derek's seat joke could sour the apology before it lands (the audience may be laughing when \"Sorry about the intrusion\" should be sincere): mitigated by Maddie's cheer slipping on \"And the rest of it. Sorry.\" The row may also read as filler if the audience does not remember the seat from scene A. \"Derek. Door.\" could feel like the humans caved too easily (Sandra instead of the old lady deciding): if so, give the last word to the old lady, a single nod, no line. The \"half and half\" cut needs the seen shot and the muffled audio to be clearly the same speaker.\n- **Protected lines.** All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" / \"There's no way we're going anywhere with you. You killed everybody.\" / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\" Only the stage direction and the apology's tail (\"And the rest of it. Sorry.\") are new.", "05": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [outside, on the step, tannoy squealing with feedback, chirpy] Oh, hello, humans. Sorry about the intrusion. | 3.0 |\n| Maddie | [tannoy, brighter, a fraction too long] Sorry about all of it, really. | 2.0 |\n| Old lady | [INSIDE, close-up, clear, not looking at the door, the hundred silent behind her] Your boss killed everyone we ever loved. | 2.5 |\n| Old lady | [CUT OUTSIDE to Maddie; the voice is muffled through the steel, mostly consonants, \"killed\" the only clean word] There's no way we're going anywhere with you. You killed everybody. | 3.5 |\n| Maddie | [lowers the tannoy, speaks to the door unamplified, small] I don't blame you. I can see how it looks. | 2.5 |\n| Maddie | We've got a way we might be able to fix this. | 2.0 |\n| Maddie | How could I win your trust? | 1.5 |\n| Maddie | [two seconds of nothing from inside. Then a hatch clicks on her chassis, to herself] Right. Have a look at this, then. | 2.0 |\n| (wordless) | [INSIDE: the dead door-camera monitor flickers on. The replay is heard THROUGH the door, a tinny alarm and the roar of the kill bots, and seen mainly as light moving across a hundred faces: red, red, a brake squeal, green. One full-frame glimpse of STAND DOWN in the last two seconds, reflected in the old lady's glasses.] | 8.0 |\n| (wordless) | [Bolts draw back, one at a time. The door opens on daylight. Cut to scene C: Maddie on the step.] | 4.0 |\n| **Total** | Spoken words 19.0 s; whole bridge about 35 s with the replay, the silence and the bolts | 19.0 / ~35 |\n\n- **Why it works.** The door does the compression. The refusal is split in two, so the old lady needs one clear line to be seen as stern and grieving, and the second, longer line can be buried under steel and still land because we already know what she means. The tannoy turns the apology into a joke at Maddie's expense (cheerful volume, wrong register) and then she switches it off and the sincerity arrives at human size, which is the whole turn of the scene: she is heard as a machine, then as a visitor. Nobody argues; the question \"how could I win your trust?\" is met with silence, so the humans' decision is shown as the monitor coming on and the door opening, never said. The replay is the answer, and it is delivered as sound through a wall and light on faces, which keeps it wordless, short and about them, not about her.\n- **Cuts from current.** The black card \"Some negotiation later.\" goes entirely. No Sandra and Derek, no crowd murmur lines, no explanation of what the boss is or why. Maddie does not describe the replay, and the old lady never concedes.\n- **Risk.** Muffled audio can read as a sound-mix mistake rather than a device if the first tannoy line (clipped, squealing inside) does not establish the rule; the cut to outside needs a visible door in frame. The old lady's second line may be unintelligible on purpose, so if a reader cannot tell she refused, the first clear line must carry the whole refusal. \"Right. Have a look at this, then.\" makes Maddie the one who triggers the monitor, which is slightly less mysterious than the monitor coming on by itself; if that feels like explaining, cut it and let the question hang for four seconds. The existing lip-synced take covers only \"Your boss killed everyone we ever loved.\"; the muffled second line needs no lip-sync because we are outside.\n- **Protected lines.** All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" (line 1), \"Your boss killed everyone we ever loved.\" (line 3, reuses the existing take), \"There's no way we're going anywhere with you. You killed everybody.\" (line 4, verbatim but muffled), \"I don't blame you. I can see how it looks.\" (line 5), \"We've got a way we might be able to fix this.\" (line 6), \"How could I win your trust?\" (line 7). Kai's \"yeah\" and \"The thing is,\" were dropped from lines 5 and 6 for time.", "06": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie (tannoy, outside, doors shut) | Oh, hello, humans. Sorry about the intrusion. [tannoy squeal] Sorry about all of it. | 4.5 |\n| Old lady (SEEN, inside, lip-synced) | Your boss killed everyone we ever loved. | 3 |\n| Old lady (HEARD, muffled through the door, cut to Maddie on the step) | [muffled] ...no way we're going anywhere with you. You killed everybody. | 3 |\n| Maddie (tannoy, quiet, tannoy hiss left on) | I don't blame you. I can see how it looks. We've got a way we might be able to fix this. How could I win your trust? | 6 |\n| [Silence. Inside: a hundred faces. Derek, squinting at a dead grey monitor in the corner.] | | 0 |\n| Derek (inside, to Sandra) | Sandra. That door camera's still taping. | 2 |\n| Old lady (inside, not looking at him) | Play it. | 0.8 |\n| [THE REPLAY, wordless: monitor warms up, tape-grain feed of the door, red KILL MODE racing in, braking, flipping green STAND DOWN, filing away. Cut between the screen and the faces it lights. Outside: Maddie waiting, tannoy off, saying nothing. The bolts go. The doors open.] | | 8 + 2 |\n| **Total** | | **~20 spoken (19.3), ~30 to 35 whole bridge** |\n\n- **Why it works.** The humans make the decision, so the bridge never has to argue it: nobody says \"we trust you\" because nobody has to, Derek simply goes and checks. It keeps Kai's mechanism (the replay, the hundred lit faces) but turns it from Maddie's evidence into the humans' own detective work, which is more convincing than anything she could say and is faster than any explanation. Maddie's silence after the question is her best moment: she does not plead. Derek gets a grumpy, comic hinge line that has real work to do, and the old lady's \"Play it.\" is her whole concession, stern and unpersuaded about the plan, only about the fact. Because the humans find the footage, it proves exactly one thing: the machine had them and chose not to. Scene D keeps all of its doubt.\n- **Cuts from current.** The black card \"Some negotiation later.\" goes, along with any explanatory doorstep talk. Maddie's side of the proof (her beacon, her hatch screen) goes. The old lady's long refusal is cut to the two protected lines.\n- **Risk.** (1) It rests on a new fact, a door camera still recording to tape, which has to be planted visually in the bunker establishing shots or it reads as convenient; it also slightly contradicts \"she replays the footage\" in Kai's note, since Maddie no longer does. Kai may want her hand in it (fix: Maddie's tannoy hiss cuts out and the monitor only then flickers, so her arrival \"woke\" it). (2) Derek solving it risks making the humans too quick: the line \"Play it.\" must land as reluctant, not won over. (3) Cutting between a screen and a hundred faces in 8 s is tight, and the muffled line must still be intelligible. (4) If the camera has been taping for five years, someone should have looked; Derek's \"still taping\" needs a shrug of a reason.\n- **Protected lines.** All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" / \"There's no way we're going anywhere with you. You killed everybody.\" (fragment audible muffled, the head of the sentence lost behind the door, which is the half-and-half) / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\"", "07": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie (tannoy, outside, chirpy, feedback squeal first) | \"Oh, hello, humans. Sorry about the intrusion. And the [beat, the tannoy hum fills it] ... everything.\" | 4.0 |\n| Chorus (inside, whispered, overlapping, over the tannoy tail) | \"That's her.\" / \"It's talking.\" / \"Don't answer.\" | 1.0 |\n| Old lady (SEEN, inside, close on face, flat) | \"Your boss killed everyone we ever loved.\" | 2.5 |\n| Chorus (overlaps her last word, three voices, not in sync) | \"Mine.\" / \"Mine.\" / \"Both of mine.\" | 1.0 |\n| Old lady (HEARD, cut outside to Maddie, muffled through the door; the chorus murmurs \"...everybody... everybody...\" under, passed hand to hand) | \"There's no way we're going anywhere with you. You killed everybody.\" | 3.5 |\n| Sandra (muffled, to Derek, the only joke) | \"Derek, shush.\" | 1.0 |\n| Maddie (outside, tannoy off, now just her voice, small) | \"I don't blame you. I can see how it looks.\" | 2.5 |\n| Maddie | \"We've got a way we might be able to fix this. How could I win your trust?\" | 4.5 |\n| [REPLAY, wordless] Bunker CCTV monitors flicker on, then the feed: red KILL MODE racing at this very door, brake, flip to green STAND DOWN, file away. A hundred faces lit by it, the chorus's whisper dying face by face until only breathing and the feed's hiss. Hold on the old lady's eyes. Bolts draw. Door opens on daylight. | (no speech) | 8.0 |\n| [Hand to scene C] Door swings, Maddie on the step. | (no speech) | 4.0 |\n| **Total** | spoken about 20 s; whole bridge about 35 s with replay and door | **~35** |\n\n- **Why it works.** The chorus carries the length of the argument without anyone arguing: one old woman's line is a verdict, and a hundred fragments under it make it a room. Overlap lets a lot of doubt fit in a second of clock, since three people saying \"Mine.\" takes one beat. The muffled half and half hides the old lady's second line behind the door, so it is felt rather than followed, and the crowd echoing \"everybody\" does the repetition for her. Nobody says \"we trust you\"; the chorus simply goes silent for the replay, which is the whole decision, and the opening door is the only reply. Sandra's \"Derek, shush.\" keeps one human, comic breath in the grief.\n- **Cuts from current.** The black card \"Some negotiation later.\" goes, along with any explanation of why they open the door. No Maddie pleading, no second round of objections, no old-lady speech beyond the two protected lines.\n- **Risk.** Overlapping whispers can turn to mush and cost intelligibility; the lead lines must sit clear and the chorus needs a low mix with at most three distinct voices, not a hundred. Eight bodies of murmur can also read as a crowd of extras mumbling, and the 1 s chorus beats could be cut by an editor and nothing would show, so they have to be cast as specific voices (a man, a girl, an old man). The \"Derek, shush.\" joke could undercut the grief; it can be dropped for 1 s. The tannoy \"everything\" beat may feel too soft before the old lady's hit. And the chorus gives the humans a collective mind that scene C may not carry through (they follow her out as individuals).\n- **Protected lines.** All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" (opens the tannoy line, \"And the... everything.\" is an addition after it); \"Your boss killed everyone we ever loved.\"; \"There's no way we're going anywhere with you. You killed everybody.\"; \"I don't blame you. I can see how it looks.\"; \"We've got a way we might be able to fix this.\"; \"How could I win your trust?\" Only the old lady's second line is treated (muffled through the door), not altered.", "08": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie (tannoy, chirpy, crackling off the door speaker) | \"Oh, hello, humans. Sorry about the intrusion.\" | 3.5 |\n| Maddie | \"Sorry about everything, actually.\" [beat; nothing back but the speaker hiss] | 1.5 |\n| Old lady (INSIDE, lit grey by the dead CCTV wall, mouth seen clearly) | \"Your boss killed everyone we ever loved.\" | 2.5 |\n| Old lady (CUT OUTSIDE: Maddie on the step, tannoy hanging; voice muffled through the steel, low-passed, room-booming) | \"There's no way we're going anywhere with you. You killed everybody.\" | 3.5 |\n| Maddie [looks at the scorched tread marks stopping a foot from her wheels; smaller voice, still West Country] | \"I don't blame you. I can see how it looks.\" | 2.5 |\n| Maddie | \"We've got a way we might be able to fix this. How could I win your trust?\" | 4 |\n| Maddie [silence inside; then, brightly, nodding at the little camera over the door] | \"Your door's got a camera. Give it a thump.\" | 2.5 |\n| (wordless, about 8 s) | INSIDE: a hand thumps the monitor; snow rolls; the door-cam fisheye comes up, black and white, timestamp running. Red KILL MODE shapes race at the lens, brake, the grey screen flips to the only green in the room, STAND DOWN, they file away. Cut across a hundred faces going green. Nobody speaks. Sandra and Derek, for once, say nothing. | 0 (8 on screen) |\n| (wordless, about 4 s) | The old lady's hand on the blast-door wheel. It turns. Clunk. Daylight. Straight into scene C, \"Go on. I promise you'll be okay.\" | 0 |\n| **Total** | | **20.0 spoken, about 35 on screen** |\n\n- **Why it works.** The bunker's own equipment makes the case, so there is no argument to lose: the camera was recording the whole time, the humans just never looked. The humans are never talked round. Maddie asks, and the room answers with a screen. The half-and-half cut does real work: the first half of the refusal is seen (a grieving face), the second is muffled through steel so it can be short and can't be rebutted. The scorched track marks that stop a foot from Maddie's wheels are the outside proof she's looking at while she concedes, a silent echo of the replay. Nobody says \"we trust you\"; the wheel turning is the verdict.\n- **Cuts from current.** The black card \"Some negotiation later.\" goes, along with any spoken explanation of what the footage means. No second apology, no recap of the boss's regret (the intro already did that), no \"you're safe\".\n- **Risk.** The door camera conveniently still working after five years is a plausibility stretch (one thump covers it as a joke, and a thump on dead tech is a very British gag, but some will see the cheat). The scene needs the CCTV wall, a fisheye door-cam look and the replay re-rendered as monochrome with green, which is a new asset, not a reuse of the colour stand-down clips. \"Give it a thump\" could read as flippant right after the grief line. If it does, swap to \"Your door's got a camera. Look at it.\" The old lady never speaks after the refusal, so her turn to yes must live entirely in her face and hand; if that performance isn't in the footage, the ending is mute but unconvincing.\n- **Protected lines.** All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" / \"Your boss killed everyone we ever loved.\" (the existing lip-synced take, seen inside) / \"There's no way we're going anywhere with you. You killed everybody.\" (muffled outside) / \"I don't blame you. I can see how it looks.\" / \"We've got a way we might be able to fix this.\" / \"How could I win your trust?\" Only the leading \"Yeah,\" from Kai's version is dropped for time. The apology is the new, short \"Sorry about everything, actually.\"", "09": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| (picture) | [Hold on the shut blast doors, daylight edge. Tannoy squeal of feedback, then a click.] | 1.5 |\n| Maddie | [Through a battered tannoy, far too loud for the street, cheerful] \"Oh, hello, humans. Sorry about the intrusion.\" | 3.5 |\n| Maddie | [Click; she turns it down, the cheer slipping a notch] \"Sorry about the rest, as well. He's in bits about it, my boss.\" | 3.0 |\n| Old lady | [INSIDE, seen: close on her face by the dead CCTV monitors, the murmur of the hundred dying round her; the existing lip-synced take] \"Your boss killed everyone we ever loved.\" | 2.5 |\n| (picture) | [Hold on her face. Nobody else speaks. Derek opens his mouth and Sandra's hand closes on his arm.] | 1.0 |\n| Old lady | [OUTSIDE: cut to Maddie on the step, tannoy lowered. The lady's voice arrives through the steel, muffled, low end only] \"There's no way we're going anywhere with you. You killed everybody.\" | 3.5 |\n| Maddie | [A beat; she doesn't defend him. Tannoy at her side now, she is just speaking] \"I don't blame you. I can see how it looks.\" | 2.5 |\n| Maddie | [Lifts the tannoy again, quieter than before] \"We've got a way we might be able to fix this.\" | 2.5 |\n| Maddie | [Small, no cheer] \"How could I win your trust?\" | 2.0 |\n| (picture) | [Silence, tannoy hiss. Maddie waits. Cut inside: the lady looks at the dark monitors.] | 1.5 |\n| (wordless) | [THE PROOF, 8 s. The bunker's own CCTV monitors, dead for five years, flicker up on the old intercom line Maddie has plugged her tannoy lead into. The kill bots' own footage, burned-in with their timestamp: red KILL MODE racing at this very door, braking, flipping to green STAND DOWN, filing away. Sound is the bots' clatter only, and a hundred people breathing. Cut across the faces; the red washes them, then the green washes them. End on the old lady's glasses holding two small green rectangles.] | 8.0 |\n| (picture) | [No word. A heavy bolt thunks back. Her hand on the wheel.] | 2.0 |\n| (picture) | [The doors grind open on white daylight; Maddie a small silhouette on the step. Hand-off to scene C: \"Go on. I promise you'll be okay.\"] | 2.5 |\n| **Total** | Spoken 19.5 s; whole bridge about 36 s | **~36** |\n\n- **Why it works.** Each lesson is borrowed and compressed: Maddie concedes the objection before the lady has finished making it (so there is no argument to drag on), then hands her the question, \"How could I win your trust?\" (so the lady, not Maddie, owns the decision), and the answer is restraint shown, not claimed: the machine had them dead and stood down. The decision itself is wordless: red light turns to green on a hundred faces and a bolt moves, nobody says \"we trust you\". The lady is the whole hundred, seen once and then heard through steel, which halves her talk and lets her grief stay hard without a debate. Using the bunker's own dead monitors means the evidence comes through their kit, not from the visitor, so it reads as theirs. \"My boss\" in Maddie's second line is the match that sets off the lady's protected line, so the resistance has a cause on screen.\n- **Cuts from current.** The black card \"Some negotiation later.\" goes entirely. Cut also: any explanation of what the boss is doing, any \"I promise\" before the doors open (scene C owns it), Sandra and Derek's bickering beyond the held arm, and every line after the replay.\n- **Risk.** (1) The lady's two refusal lines (3 and 4) say nearly the same thing; if it reads as repetition, the muffled line is the one to shave (see below). (2) The apology is short and carries the sincerity by sound (the volume drop) rather than words; if the earlier intro does not carry it, it may feel thin. (3) The replay is only as good as the footage being recognisable as the same stand-down; it needs the red-to-green flip to read at a glance, and 8 s of near-silence can feel long if the faces are not strong. (4) Nothing is said about whether the plan works, which is right for scene D but means this bridge leans on the audience granting that restraint is enough.\n- **Protected lines.** All six survive verbatim: \"Oh, hello, humans. Sorry about the intrusion.\" (line 2); \"Your boss killed everyone we ever loved.\" (line 4, existing lip-sync take, seen); \"There's no way we're going anywhere with you. You killed everybody.\" (line 6, muffled; if it needs to be shorter, keep it whole in the take but cut the audible mix so only \"...no way we're going anywhere with you. You killed everybody.\" is clear, and drop \"There's\" under the door thud); \"I don't blame you. I can see how it looks.\"; \"We've got a way we might be able to fix this.\"; \"How could I win your trust?\" (split across two takes to leave a beat, but unaltered).", "10": "## Dialogue 1: The door and the proof\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie (tannoy, outside, doors shut; crackle, a feedback squeal on \"hello\") | Oh, hello, humans. Sorry about the intrusion. [A tinny beat of nothing, then, a bit smaller:] And, you know. Everything. | 4.5 |\n| Old lady (INSIDE, seen, lip-synced take, lit by one bulb, the hundred behind her not moving) | Your boss killed everyone we ever loved. | 3.0 |\n| Old lady (OUTSIDE, heard, muffled through the steel, low-passed, Maddie's face in the shot, the tannoy still held up) | There's no way we're going anywhere with you. You killed everybody. | 4.2 |\n| Maddie (tannoy off, no megaphone now, her own voice, a small hand lowered) | I don't blame you. I can see how it looks. | 2.8 |\n| Maddie | We've got a way we might be able to fix this. How could I win your trust? | 4.2 |\n| (nobody) [INSIDE. The old CRT beside the blast door crackles on by itself. We never see the screen. We see the light on faces: red, a hundred faces lit red, engine whine small and tinny, red racing. A brake squeal. The light snaps GREEN. Green on the old lady's
