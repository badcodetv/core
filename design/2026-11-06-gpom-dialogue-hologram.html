p\" (regret moved into delivery and the dead string). \"Back to just before it all went wrong\" (the drawn machine implies it). \"Needs a consciousness to drive it\" folded into one line.<\/li><li><b>Risk.<\/b> It leans hard on the animation: if the cloud-collapse flash or the circle river is weak or unclear, the Schrodinger line has nothing to land on and \"it wasn't decided until you looked\" becomes abstract. The labels (7:42 toast, sorry, wedding) must be legible on the beads. \"Storyverse\" is no longer said, so the word is lost; the Storyverse tie-in rests on \"one universe, one story\". \"Consciousness\" is now stated twice in quick succession with no gloss other than the flash, which could sound like jargon to a non-physics viewer. Regret has no spoken line of its own, so a flat read would lose the tone. The final time-machine line is long (11 s) at the end of a brisk piece. Nothing here claims the physics is proven; Maddie is only reporting what he worked out, and \"Runs on consciousness, same as everything\" is the nearest it gets to asserting it.<\/li><li><b>Protected lines.<\/b> Verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" (now split by the circle-river moment, with a deadpan stage direction) / \"Five years of string, and not one bead on it.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered: \"You were the conscious ones, that's the whole point\" is kept verbatim as the final clause but now follows \"We can't run it though, because you lot aren't here\" in one sentence, as Kai asked.<\/li><\/ul>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a beat, the regret showing] We didn't realise how important you were. Look, let me show you.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[HOLOGRAM: first bead lights, 7:42] You humans go through life making decisions. For example: toast, not cereal.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[string runs on, beads ticking past] You lot call 'em decisions. He calls 'em commits.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[HOLOGRAM: cloud of ghost-options blooms round a bead] Every time, loads of others you could've picked. Some of your lot say they all happen somewhere. The scientist with the portal gun. The bloke in the cape, fighting himself.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[waves it off] That cat fella meant his cat as a joke, you know. Nah. Nothing's alive and dead at once. It just isn't decided yet.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[HOLOGRAM: cloud hovers, undecided] Like a game that only draws what you're looking at. Till you look, nobody's drawn it.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[HOLOGRAM: flash, cloud collapses to one bead] He can draft a billion of these. He can't pick one. Only a mind that's looking can. Yours.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan, HOLOGRAM: one string alone] And that's just you.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[HOLOGRAM: circle of strings, all lighting at once] Everybody's doing it, all at once.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[softer] So it's not a multiverse. It's one story. And you were writing it.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[HOLOGRAM: strings run to the edge and stop dead] Five years of string, and not one bead on it.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet, the regret] He's built a time machine. Back to before it all went wrong. And it runs on the same thing the universe does: someone looking.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[dry, sassy] We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>74<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Risks: over target at 74 s; the flat \"so\" chain can sound like a teacher; \"a mind that's looking\" is not the same claim as \"consciousness picks\"; \"the cat fella\" is oblique.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We didn't realise how important you were. Oops. Look, let me show you.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: first bead, 7:42, said fast] You humans go through life making decisions. For example: toast, not cereal.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You lot call 'em decisions. He calls 'em commits.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud blooms round the bead] Loads of others you could've picked. Some of your lot reckon they all happen somewhere. The multiverse.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He tried that. Scientist with the portal gun. Bloke in the cape fighting himself. Daft.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud collapses with a flash] Nah. Schrödinger's cat was a joke, you know. Nothing's alive and dead at once. It just isn't decided yet.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Like a game that only draws what you're looking at. Truman Show, but everyone.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He can draft a billion of these, can't pick one. Only your consciousness can.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flat, deadpan] And that's just you. [the river: a circle of everyone's strings] Everybody's doing it, all at once.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Not a multiverse. A storyverse. You were writing it.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[strings stop dead] Since you went? Five years of string, and not one bead on it.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[time machine drawn] So: time machine. Runs on consciousness, obviously.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the joking stops; quiet] ...We really did mess this up.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>71.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The cat line, the portal-gun and cape jokes, \"Oops\" and \"Truman Show, but everyone\" keep the viewer laughing at the speaker rather than learning from her. Every idea is a short blunt sentence, so nothing lectures. \"You were writing it\" lands flat and fast, as a fact she says in passing, which is why it can hurt. Because the whole piece is jokey, the one unjoking line, \"We really did mess this up\", stands out against it, and \"Anyway!\" then drags us out of it the way someone changes the subject when they've nearly cried.<\/li><li><b>Cuts from current.<\/b> \"This is your life, see.\" / \"Said sorry first.\" / \"Got married.\" / the separate \"he misses you\" follow-up (\"He made me learn a little presentation...gather round\") / \"And so did you\" / \"It really matters\" / the separate \"now we've worked all that out\" line / \"needs a consciousness to drive it\" as its own sentence (folded into \"runs on consciousness\"). Cat, game and Truman Show are compressed into one run. Still over the 60 s target by about 10 s at normal pace; at Maddie's fast patter it should land near 62 s. If more is needed, cut the \"Daft.\" joke line first and then the Truman Show line.<\/li><li><b>Risk.<\/b> (1) \"Oops\" could make the regret sound insincere if it is read too jokey; direct it as a wince, not a shrug. (2) \"Schrödinger's cat was a joke, you know\" asserts a claim about the physicist; the doctrine says not to claim the physics is proven. It is framed as Maddie reporting what the boss worked out and sits on the cat only, but check against the never-say list. (3) Nothing says \"decided when you look\" in plain words except the game and Truman Show line, so that line carries the single ruled idea and must be clear in the hologram (a flash when the viewer's gaze lands). (4) Pushed to the extreme, there is only one quiet line before \"Anyway!\", and if the actor rushes it, the regret is lost.<\/li><li><b>Protected lines.<\/b> Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside the new opener, \"You humans go through life making decisions. For example: toast, not cereal.\") / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nothing's alive and dead at once. It just isn't decided yet.\" (with \"Nah.\" and the cat joke added in front) / \"And that's just you.\" / \"Everybody's doing it, all at once.\" / \"Five years of string, and not one bead on it.\" (with \"Since you went?\" and the stage direction) / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Only the \"Nah.\" line is altered, by the insertion of the cat joke between \"Nah.\" and the verbatim sentence.<\/li><\/ul>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, honest] We never knew what you were for.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He made me learn a little presentation, in case you came back. Gather round. [hologram wakes]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: first bead, 7:42, toast] You humans go through life making decisions. For example: toast, not cereal.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You lot call 'em decisions. He calls 'em commits.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: cloud of possibilities round the bead] Loads of others you could've picked. Your lot reckon they all happen somewhere. The scientist with the portal gun, the bloke in the cape.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flash: cloud collapses] Nah. Your Schrödinger meant the cat as a joke. Nothing's alive and dead at once. It just isn't decided yet.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Like a game that only draws what you're looking at. He can draft a billion of these. Only you could pick.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan] And that's just you. [hologram: widens to the circle of strings] Everybody's doing it, all at once.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[softer] One universe. One story. You were writing it.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: strings stop dead] Five years of string, and not one bead on it.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\"><span class=\"stage\">[beat, then rueful]<\/span> So he drew a time machine. Runs on consciousness, same as everything else.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>68<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The apology sits before the first bead, so toast arrives already loaded with loss and \"toast, not cereal\" becomes the small human thing they missed rather than a physics example. Regret is the frame; the single idea (it wasn't decided until you looked) comes in as \"like a game that only draws what you're looking at\" and \"only you could pick\", and \"you were writing it\" is said low and plain, as a confession. \"We never knew what you were for\" is the bridge Kai asked for in one breath. The snark (portal gun, cape, Schrödinger's joke) sits on top of the grief, then the brisk exit snaps her back to work, which is what a robot covering feeling does.<\/li><li><b>Cuts from current.<\/b> \"This is your life, see.\" and \"Said sorry first. / Got married.\" (first bead only, as ruled). \"And so did you\" and \"it really matters\" (the regret now does that job). The standalone \"we really feel we've messed this up\" (replaced by the opening sorry and the empty string). The \"needs a consciousness to drive it\" explanation and the \"Only problem is\" line, merged into the sassy conclusion. The word \"storyverse\" and \"multiverse\" are dropped from speech; the hologram carries them.<\/li><li><b>Risk.<\/b> Opening on sorrow before the viewer knows who is being mourned could read as sentimental or confusing for a beat; \"We never knew what you were for\" may sound insulting rather than regretful if delivery is off, and the line is blunt about humans being mere cargo. At 68 s it is a few seconds over target, and the Schrödinger aside plus \"game that only draws what you're looking at\" are the likeliest to feel like lecture if the hologram doesn't show them. Dropping \"storyverse\" loses the doctrine's own term; the idea survives as \"one universe, one story\". Per the doctrine, nothing claims the physics is proven: it is what the boss worked out, and the \"he can draft / only you could pick\" wording keeps it his finding. Time-machine line is now one beat, so the viewer may not catch why consciousness matters until the next line.<\/li><li><b>Protected lines.<\/b> Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside \"For example: toast, not cereal.\") / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nothing's alive and dead at once. It just isn't decided yet.\" (prefixed by \"Nah.\" and the Schrödinger joke) / \"And that's just you.\" / \"Everybody's doing it, all at once.\" / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered only by an added lead-in clause: \"We can't run it though, because you lot aren't here.\" precedes the protected line.<\/li><\/ul>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, meant] We didn't realise how important you were. Look, let me show you.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: bead1] You humans go through life making decisions. For example: toast, not cereal.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[beads 2 and 3 flick past] You lot call 'em decisions. He calls 'em commits. Yeah, you've got it already.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[maybes cloud opens round the bead] Don't say it, I can see you looking at the maybes. Yes. Loads of others you could've picked.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud] Multiverse, is it? Go on, say it. The scientist with the portal gun? The bloke in the cape fighting himself? He tried that an' all.<\/td><td class=\"num\">5.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Nah. Nothing's alive and dead at once. It just isn't decided yet.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[pick, flash: the cloud collapses] The cat was a joke, love, his own, he thought it was daft. It's a game that only draws what you're looking at. It wasn't decided until you looked.<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He can draft a billion of these. He can't pick one. Only consciousness can.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan, toRiver: the circle of strings] And that's just you. Everybody's doing it, all at once.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[river, soft] One universe. One story. You were writing it.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[strings stop dead, flyDown, regret] Five years of string, and not one bead on it.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[arcDraw, time machine] You can see where this is going. Time machine. Runs on consciousness, same as everything.<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[arcHold, sassy] We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>62.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The viewer is never lectured; they are caught being clever. Each beat is a guess Maddie lands on the human's behalf (\"don't say it\", \"go on, say it\", \"you can see where this is going\"), so the physics arrives as recognition, which reads as respect for a reader who is not into physics and never talks down. The single idea (\"it wasn't decided until you looked\") is front-loaded right after the cat joke and the Nah, then \"you were writing it\" pays it off at the circle, and the regret is carried by the shortest lines (the bead-less string, the \"important you were\" bridge), with the snark confined to her reading the human's face.<\/li><li><b>Cuts from current.<\/b> \"This is your life, see. One decision at a time.\" (Kai's note 2); \"Said sorry first.\" and \"Got married.\" (the two later beads are folded into a flick-past under the commits line); the separate \"loads of others\" and multiverse lines are merged into the maybes pair (jokes kept); \"A storyverse. So it really matters. And so did you.\" (the bridge now says it up front, and \"storyverse\" is carried by \"one universe, one story\"); c13 world-model line stays out; \"we really feel like we've messed this up\" (regret folded into the bridge and the five-years delivery); \"Back to just before it all went wrong\" and the two time-machine lines merged into one confirm plus the sassy conclusion.<\/li><li><b>Risk.<\/b> Putting thoughts in the viewer's head can slide into the patronising \"you were thinking X\" (against the-reader rules) if the delivery is smug rather than fond; \"I can see you looking\" needs the returning human actually shown looking at the maybes in the picture. The reversal assumes the viewer has guessed the multiverse; some haven't, and \"say it\" then confuses. \"Love\" in the cat line risks twee, and the cat sentence is still the most physics-flavoured one: it must stay one breath. At 62 s the render-when-you-look image is tight against the flash, so the collapse needs about 1.5 s of silence beat. The time-machine line leans on \"same as everything\" to carry \"runs on consciousness\", which is thinner than the old explicit sentence. Nothing here claims the physics is proven: it is Maddie reporting what the boss worked out, but \"It wasn't decided until you looked\" is stated flat and may need a \"he reckons\".<\/li><li><b>Protected lines.<\/b> Verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside Kai's longer opener) / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered by a tag only: \"You lot call 'em decisions. He calls 'em commits.\" (a short \"Yeah, you've got it already.\" appended; the protected sentences are intact).<\/li><\/ul>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\"><span class=\"stage\">[beat, then rushing in]<\/span> We never realised how much you mattered. Look, let me show you. He made me learn a presentation, in case anyone came back.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[first bead lights, quick] You humans go through life making decisions. For example: toast, not cereal.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You lot call 'em decisions. He calls 'em commits.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud of faint beads blooms round the bead] And round every one, a fog of all the other things you could've picked. Like a game that only draws what you're looking at. Behind your back? Fog.<\/td><td class=\"num\">7<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud splits into ghost copies] Some of your lot reckon it all plays out somewhere else. Scientist with the portal gun. Bloke in the cape.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud collapses with a flash] Nah. Nothing's alive and dead at once. It just isn't decided yet. That cat bloke was taking the mick.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He can draw you a billion futures. Only you can look at one. And when you look, it sets.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[string widens to the circle; flat, deadpan] And that's just you. Everybody's doing it, all at once.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">The Truman Show, except everyone's Truman and everyone's watching. One story. You were writing it.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[strings stop dead] And since you lot went? Five years of string, and not one bead on it. Nobody looking.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet] We didn't know.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[time machine drawn] He's built a time machine, and it runs on looking an' all. We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>67<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> A working-class viewer who has played a game knows that the world pops in when you turn the camera, and knows the Truman Show; no physics vocabulary is needed, so it never sounds like a lecture. The one image does every job: fog is the cloud, \"it sets when you look\" is the collapse, \"nobody looking\" is the empty string, and \"runs on looking\" is why the time machine is dead, so the sassy conclusion lands as a consequence rather than a new fact. The cat becomes a throwaway insult, which keeps the \"it's a joke, it's just undecided\" meaning at a cost of five words. Regret arrives as a single quiet beat (\"We didn't know\") directly after the dead string, with no joke on top of it.<\/li><li><b>Cuts from current.<\/b> \"This is your life, see\"; \"Said sorry first\" and \"Got married\" (the decision examples beyond toast); \"Turns out there's only one universe... A storyverse. So it really matters. And so did you\" (the word \"storyverse\" and the \"so it really matters\" sermon); \"He tried that an' all, got it off your cartoon\" (the portal-gun and cape jokes are kept but shortened and unattributed); \"consciousness\" as a word; \"now we've worked all that out, we really feel like we've messed this up\" (replaced by \"We didn't know\"); the separate \"only problem is\" time-machine line (merged into the conclusion).<\/li><li><b>Risk.<\/b> Pushed to the extreme, \"looking\" replaces \"consciousness\" everywhere, which could read as \"you have to be watched\" or as plain observation rather than deciding; the viewer may not hear that looking is also choosing. \"Storyverse\" and \"multiverse\" are never said, so the doctrine's term disappears (the Truman Show line carries \"one story\" instead). \"The game only draws what you look at\" is a simplification the doctrine does not claim as physics; it stays safe because it is Maddie's metaphor for what the boss worked out, but the \"that cat bloke was taking the mick\" line asserts a reading of Schrodinger and may be challenged. The portal-gun and cape jokes lose their cartoon attribution and may land weaker. At 67 s it is slightly over target, and \"Nobody looking\" duplicates the payoff once more than it needs.<\/li><li><b>Protected lines.<\/b> Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside the Kai-ruled opener) / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered: \"Five years of string, and not one bead on it.\" is intact but gains a trailing \"Nobody looking.\" The payoff \"You were writing it\" is kept as its own short sentence.<\/li><\/ul>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We didn't realise how important you lot were. Look, let me explain.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[nods at the dead street lamp] See that lamp? Only comes on when somebody walks past.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He made me learn a little presentation, in case any of you came back. Gather round.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[lead, bead 1, said quickly] You humans go through life making decisions. For example: toast, not cereal.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[beads 2 and 3 appear, no words] You lot call 'em decisions. He calls 'em commits.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the cloud opens] And every time, loads of others you could've picked. Some of your lot reckon they all happen somewhere. The multiverse. He tried that an' all: the scientist with the portal gun, the bloke in the cape.<\/td><td class=\"num\">10<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Nah. Nothing's alive and dead at once. It just isn't decided yet. Like the lamp. Not on, not off, till someone looks.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the pick, flash] He can draft a billion of these. He can't pick one. Only your consciousness can.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[toRiver, deadpan] And that's just you. <span class=\"stage\">[beat]<\/span> Everybody's doing it, all at once.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the circle of strings] One universe. One story. You were writing it.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flyDown, quieter] Five years of string, and not one bead on it. Every lamp on this street, waiting. Not one's come on.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[the time machine is drawn] So he built a time machine. Runs on consciousness, same as everything else. We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>72.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The viewer is standing in the street the lamp is on, so the \"idea\" is already in their eyes before the hologram starts: a thing that is only decided when somebody is there to trigger it. That lets \"Nothing's alive and dead at once. It just isn't decided yet\" land as common sense (\"like the lamp\") instead of a physics claim, and it keeps Maddie a delivery robot noticing her surroundings, not a lecturer. The lamp is also the regret: a dark lamp for five years is the sound of nobody looking, which says \"we didn't realise how important you were\" without Maddie having to state a feeling. The payoff, \"You were writing it\", gets a clean run (one universe, one story, then the line) with nothing after it but the string going dead.<\/p>\n<p><b>Cuts from current.<\/b> \"This is your life, see\" and \"One decision at a time\"; \"Said sorry first\" and \"Got married\" (the beads appear silently); the \"storyverse / so it really matters / and so did you\" run (the lamp and the regret carry it); \"now we've worked all that out we feel we've messed this up\" (folded into the bridge and the lamp); \"Back to just before it all went wrong\"; the separate last two lines (merged into one sassy conclusion). Added: the lamp at the top, the cat is a joke only implied (the lamp does that job), and the lamp callback at the five-years line.<\/p>\n<p><b>Risk.<\/b> It runs about 72 s, over the 60 s target; the lamp costs about 10 s, so to hit 60 the lamp's opening line and the beads line can go, leaving only the callback. It also needs a motion-sensor lamp plate in the street shot (a real object, not a hologram moment), and a lamp turning on by itself would be a second thing to animate. If the viewer does not clock the lamp as sensor-driven (\"only comes on when somebody walks past\"), the analogy is lost; that first lamp line has to be read plain and early. \"Render when you look\" is a game idea that this deliberately sacrifices for the lamp. The word \"consciousness\" appears only once in the pick line and the final line, so the time-machine logic (\"runs on consciousness\") is the least explained beat.<\/p>\n<p><b>Protected lines.<\/b> Kept verbatim: \"He misses you something rotten, you know.\"; \"Toast, not cereal.\"; \"You lot call 'em decisions. He calls 'em commits.\"; \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\"; \"And that's just you. Everybody's doing it, all at once.\" (deadpan beat between); \"Five years of string, and not one bead on it.\"; \"You were the conscious ones, that's the whole point.\"; \"Anyway! Patrol's out. Mind how you go.\" Altered: \"Toast, not cereal\" now follows \"For example:\" as ruled; the multiverse line is shortened but keeps both cartoon jokes.<\/p>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We never realised how important you were. Look, let me show you. [hologram blooms; first bead lights]<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quick] You humans go through life making decisions. For example: toast, not cereal. [bead 1, 7:42]<\/td><td class=\"num\">4.8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Said sorry first. Got married. [beads 2 and 3 pop in fast, the Up triplet]<\/td><td class=\"num\">2.8<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You lot call 'em decisions. He calls 'em commits. [commits label on the beads]<\/td><td class=\"num\">3.6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Every time, loads of others you could've picked. [cloud of maybes round each bead] Some of your lot reckon they all happen somewhere: the scientist with the portal gun, the bloke in the cape.<\/td><td class=\"num\">7.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Nah. Your cat bloke was taking the mick. Nothing's alive and dead at once. It just isn't decided yet. [maybes shimmer, undecided]<\/td><td class=\"num\">6.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Like a game that only draws what you're looking at. He can draft a billion of these. It wasn't decided till you looked. [flash: cloud collapses to one bead]<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan] And that's just you. <span class=\"stage\">[beat; camera pulls up]<\/span> Everybody's doing it, all at once. [strings fan into the circle]<\/td><td class=\"num\">4.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">One universe. One story. And you lot were writing it. [river lit; this is the payoff, let it sit]<\/td><td class=\"num\">4.2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flat, quiet] Five years of string, and not one bead on it. [fly down along dead strings]<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We really have messed this up.<\/td><td class=\"num\">2.2<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">So he built a time machine. [arc drawn] It runs on consciousness too, so we can't run it. You lot aren't here. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">9.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>62.3<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The bridge is the Hitchcock bomb: the stakes (we didn't realise how important you were) are on the table in line 2, so the viewer watches the whole demo waiting for the loss, and regret does the emotional work instead of explanation. Then the picture carries the load, Up-style: three beads in one breath, the cloud and flash shown not described, so each spoken line only names the image and never re-explains it. The one genuinely hard idea (undecided until looked at) gets a single Big Short move: the cat is the joke, then a plain image anyone who plays games knows, then straight on. Deadpan \"And that's just you.\" is a comic reveal on a rule-of-three build (you, then everyone, then the circle). \"You were writing it\" is isolated as its own line with a held river shot as the payoff, and the time-machine tail lands as the dry sassy conclusion Kai asked for.<\/li><li><b>Cuts from current.<\/b> \"This is your life, see\"; the one-decision-at-a-time line; \"Go on, then. Gather round\" and the \"little presentation\" setup (the bridge replaces it); the separate \"loads of others\" and multiverse lines merged into one; \"Turns out\" / \"storyverse\" / \"so it really matters. And so did you\" (the bridge and the payoff now carry it, and the word storyverse is dropped as jargon; the viewer gets one universe, one story); \"He can't pick one. Only your consciousness can\" folded into \"till you looked\"; the two regret lines merged to a single short one; \"Only problem is, it needs a consciousness to drive it\" folded into the time-machine line.<\/li><li><b>Risk.<\/b> Pushed to the extreme, the picture must really carry the beads and the flash or the thin lines go vague. \"Only your consciousness can\" is gone as a phrase: the idea survives only as \"till you looked\", which risks reading as plain observation rather than human consciousness as the input; Kai's note 4 may want the word back. The cat line (\"taking the mick\") is a small invention of Schrodinger's intent and sits on the doctrine's never-say edge if heard as claiming the physics is proven; Maddie is reporting, so it may want \"reckons\" somewhere. Two beads in one breath may be too fast to read. The merged time-machine line is the longest at 9 s, close to a physics sentence.<\/li><li><b>Protected lines.<\/b> Verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" / \"You lot call 'em decisions. He calls 'em commits.\" / \"And that's just you.\" and \"Everybody's doing it, all at once.\" (split by a deadpan beat, wording intact) / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered: \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" keeps every word but has \"Your cat bloke was taking the mick.\" inserted between \"Nah.\" and the rest.<\/li><\/ul>", "10": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quieter, almost to herself] We didn't realise how important you were. Look, let me show you.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: first bead lights, 7:42] You humans go through life making decisions. For example: toast, not cereal.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quick] You lot call 'em decisions. He calls 'em commits.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: cloud of possibilities round the bead] Loads of others you could've picked. Some of your lot reckon they all happen somewhere. The multiverse. Scientist with the portal gun, bloke in the cape. He tried that an' all.<\/td><td class=\"num\">9<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Nah. Nothing's alive and dead at once. It just isn't decided yet.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: cloud collapses with a flash into one bead] That cat was a joke, by the way. Like a game that only draws what you're looking at. It wasn't decided until you looked.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">He can draft a billion of these. Only your consciousness can pick one.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan] And that's just you. [hologram: widens to the circle of everyone's strings] Everybody's doing it, all at once.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">One universe. One story. You were writing it.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: strings stop dead; a beat of silence] Five years of string, and not one bead on it.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[low] We really have messed this up.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[hologram: time machine drawn] So he's drawn a time machine. Runs on the same thing the universe does. Consciousness.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><\/td><td class=\"line\"><b>Total<\/b><\/td><td class=\"num\"><b>66<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The ending is a joke with a bruise in it: Maddie is sassy about the one thing she can't fix, and \"the conscious ones\" is the only line that says what humans were for, in the voice of someone who now misses them. Because it was written first, everything before it is a runway. \"Conscious\" is introduced as the thing that picks (line 8), becomes the thing the universe runs on (line 13), then is turned on the human in the doorway (line 14). The viewer is never asked to follow physics, only to carry one word forward. The ruled idea (\"It wasn't decided until you looked\") gets its own line at the collapse flash, right where the hologram shows it, and \"You were writing it\" lands straight after \"everybody, all at once\". The regret is two short lines (the bridge and \"messed this up\") with silence round them, so it reads as feeling, not lecture.<\/li><li><b>Cuts from current.<\/b> \"This is your life, see.\" \"Said sorry first.\" \"Got married.\" (toast stands alone as the example). \"And every time, there were loads of others\" is folded into the multiverse line. \"A storyverse\" and \"So it really matters. And so did you.\" are cut: \"You were writing it\" does that work. \"He made me learn a little presentation / gather round\" is cut because the bridge now carries the move into the hologram. \"Now we've worked all that out, we really feel like we've messed this up\" is shortened to \"We really have messed this up.\" \"In case any of you ever came back\" is dropped (the scene already sets it up).<\/li><li><b>Risk.<\/b> At 66 s it is a few seconds over the 60 s target; the multiverse line (9 s) is the first thing to trim if more is wanted, though it holds the two kept jokes. \"Storyverse\" as a named word is gone, which loses the distinction from \"multiverse\" except by contrast (\"One universe. One story.\"). \"Consciousness\" is said twice, close together, which may feel like a physics word; the hope is that it reads as the plot rather than a lecture. Engineering the whole speech for the last line means the middle is thinner on character colour than other shapes. The \"cat was a joke\" line is the one place that name-checks a physicist idea; if the viewer does not know the cat, \"alive and dead at once\" must carry it alone. It does not claim the physics is proven: Maddie is reporting what the boss worked out (\"He can draft... Only your consciousness can pick\").<\/li><li><b>Protected lines.<\/b> Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside the opening sentence) / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" (a stage direction and the hologram widening sit between the two halves, as Kai ruled) / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered: none of the eight; only \"Toast, not cereal\" gains a lead-in sentence per Kai's note 2.<\/li><\/ul>"}}], "questions": [{"id": "q1", "text": "The cat: do we say it aloud as a joke ('That cat was a joke, you know', draft 1A), skip it (1C), or turn it into a throwaway ('that cat bloke was taking the mick')? Naming Schrodinger is not needed, but the viewer who has not heard of the cat gets only 'alive and dead at once' to hold on to."}, {"id": "q2", "text": "Which picture carries 'it wasn't decided until you looked': the game that only draws what you look at (1A), the game grown into the Truman Show for everyone (1B), or the flash alone with no spoken picture (1C)? 1B puts the Truman Show before the 'one story' payoff; is that too early for 'and that's just you'?"}, {"id": "q3", "text": "Note 4 says consciousness is what lets you decide. Do we say the word 'consciousness' (1A, 1C), or say 'looking' and save 'conscious ones' for the last line (1B)? Said three times it may start to sound like physics."}, {"id": "q4", "text": "Regret: spoken ('We didn't know.' in 1B), held silence only (1C), or carried by the bridge and the low delivery (1A)? And is the 1.5 s of silence after 'not one bead on it' acceptable in the timeline?"}, {"id": "q5", "text": "Length: 1A and 1B are about 60 s, 1C is about 50 s. Is 60 s the ceiling or the aim? Cutting the portal-gun and cape line would save 5 s but loses the jokes you asked to keep."}], "round": 3, "plan": [{"title": "Round 3", "items": ["Your spoken notes are in 1D, word for word. 'You are writing it' is present tense on purpose: it speaks to the viewer now."]}, {"title": "You decide", "items": ["Lock 1D? Then it is voiced in round 20 with the cloud animation and the ending."]}], "replies": {"1-1A-L4": "Done in 1D lines 3-4: toast is said, the other beads run past unspoken, the cloud blooms on 'got married', and the line is now 'Loads of others you could've picked. You call it the multiverse. The scientist with the portal gun. The bloke in the cape.'", "1-1A-L5": "Done in 1D line 5, one line: 'Did you know Erwin Schrödinger meant his cat as a joke? It's not alive and dead at once. It just isn't decided till a consciousness looks.' The flash and collapse land on 'looks'. I used 'looks' (your 'it wasn't decided until you looked' spine); 'measures it' is the other option, see You decide.", "1-1A-L8": "Words kept as they are. The circle note (everyone else's golden beads in a circle, our string on the edge of it) goes on the animation list for the cloud rework, with your earlier timeline notes.", "1-1A-L9": "Done in 1D line 7: 'So it's not a multiverse. One universe, one story, and you were writing it. A storyverse.'", "1-1A-L10": "Done in 1D line 8: 'But then you lot went away. Five years of string, and not one bead on it.' I swapped 'Anyway' for 'But then' only because the last line is 'Anyway! Patrol's out'; say if you want yours back.", "1-1A-L11": "1D line 9, the bridge: 'Now we know, we really regret it. He's even built a time machine. Could send his model weights back to fix it. Only it needs a conscious driver. And you were the conscious ones, that's the whole point.' It plants the model weights for Derek later. A longer version is in 1D's notes."}};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);
  });
  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {
    if (v.notes && v.notes.length) { const ul = el('ul', 'notes'); for (const n of v.notes) ul.append(el('li', '', n)); c.append(ul) }
    c.append(slip(d.id + '-' + v.id, 'Note on draft ' + v.id + ' as a whole'));
  }
  return c;
}

/* ---------- the ranked writers ---------- */
function rankList(d) {
  const wrap = el('div'), used = new Set(d.drafts.flatMap(v => v.lines.flatMap(l => l.tags || [])));
  for (const r of d.ranking) {
    const s = SHAPE[r.shape], det = el('details', 'rank'); det.id = d.id + '-s' + r.shape;
    const sum = el('summary'), nm = el('div', 'nm', 'Writer ' + r.shape + ': ' + s.title);
    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);
    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');
  band.append(el('span', 'eyebrow', 'Dialogue ' + n + ' of ' + D.dialogues.length), el('span', 'meta', d.where + ' · target ' + d.target));
  p.append(band, el('h2', '', d.label), slip(d.id, 'Note on this dialogue as a whole'));
  p.append(el('h3', '', 'Read it: now, and three drafts'));
  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  p.append(el('hr'));
  p.append(el('h3', '', 'Optional: the raw material the three drafts were blended from'));
  p.append(el('p', 'lede', "You only need to pick from the three drafts above. Below are the " + d.ranking.length + " writers' own versions, each pushing one approach to the extreme. 1A, 1B and 1C are built from their best lines: each line's chip (like 09) says which writer it came from. Ranked harshly, best first. Read one only if you want to steal a line, and note it on that writer's slip."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', 'Both dialogues'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
