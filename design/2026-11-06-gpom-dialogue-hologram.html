<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:32px 8px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3em;text-wrap:balance}
.about{color:var(--muted);max-width:70ch;margin:0 0 1em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}
.tabs a .picked{color:var(--pick)}
section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.6rem;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
h3{font-size:1.05rem;margin:28px 0 8px}
.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{font:inherit;cursor:pointer;text-align:left;background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button.picked{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick);background:var(--pickbg)}
.seg button.cmp{margin-left:auto;align-self:center;font-size:.85rem;background:transparent}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:10px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-head h4{margin:0;font-size:1.25rem}
.bet{font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin:6px 0 0;max-width:70ch}
.pickbtn{font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--pick);color:var(--pick);background:transparent;white-space:nowrap}
.pickbtn.on{background:var(--pick);color:var(--paper)}
.script{margin:14px 0 4px;border-top:1px solid var(--rule)}
.ln{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.who{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.who.maddie{color:var(--accent)}.who.lady{color:var(--lady)}.who.other{color:var(--muted)}
.said{font:18px/1.5 "Source Serif 4",Georgia,serif}
.said.dir{font-style:italic;color:var(--muted);font-size:16px}
.stage{color:var(--muted);font-style:italic;font-size:.88em}
.side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:9rem}
.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.chip{font:600 .7rem Inter,sans-serif;border:0;background:var(--chip);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer}
.chip.plain{cursor:default;color:var(--muted)}
.ln .slipw{grid-column:2/4}
.addnote{font:500 .78rem Inter,sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline dotted}
.total{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding-top:8px}
.notes{margin:12px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.slipw{margin-top:8px}
.slipw label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.slipw label .ok{color:var(--pick)}
textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:4px 10px;font-size:.88rem;background:var(--soft)}
.reply b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.compare .card{margin:0;padding:14px}
.compare .ln{grid-template-columns:minmax(0,1fr);gap:2px}
.compare .said{font-size:15.5px}
.compare .side{justify-content:flex-start;max-width:none}
.rank{background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
.rank>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.rank>summary::-webkit-details-marker{display:none}
.rank .n{font:700 1.3rem/1 Inter,sans-serif;color:var(--muted);padding-top:2px}
.rank .nm{font-weight:700}
.rank .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rank .verdict{grid-column:2/4;font-size:.9rem;color:var(--fg)}
.rank .len{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rank .used{font-size:.72rem;font-weight:600;color:var(--pick);margin-left:6px}
.rank[open]>summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.rank .body{padding:6px 18px 16px}
.md table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}
.md td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}
.flash{animation:fl 1.6s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px}
.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}

<script>
const D = {"page_title": "GPOM Hologram Dialogue", "title": "GPOM dialogue options: Maddie's hologram", "about": "This page lays out three combined drafts of Maddie's hologram presentation in scene A, built from ten independent rewrites ranked below. Nothing has changed yet: no scene file, script or voice has been touched. Kai, 6 Nov: \"He calls 'em commits\" is dropped (too technical); it is cut from the three drafts, but the ten writers' versions below still have it. Round 2: draft 1D is 1A rebuilt on Kai's notes; the cloud-circle notes go to the animation.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-01-bone-dry.md", "intro": "Fewest words that still carry every beat. Each line does one job and names the hologram moment it rides on; anything explanatory is cut and left to the picture. The regret is carried by short flat lines and silence, not by words. The sass of the ending is kept because it is the payoff of the whole bit.", "intro_html": "<p>Fewest words that still carry every beat. Each line does one job and names the hologram moment it rides on; anything explanatory is cut and left to the picture. The regret is carried by short flat lines and silence, not by words. The sass of the ending is kept because it is the payoff of the whole bit.<\/p>"}, {"id": "02", "name": "Picture carries it", "title": "The picture carries it", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-02-picture-carries.md", "intro": "I treated the hologram as the narrator and Maddie as the caption writer. Every idea the three.js animation already shows (beads, cloud, flash, circle river, dead string, drawn machine) loses its explaining sentence, and Maddie only says what a picture cannot: the names (\"commits\"), the one idea (\"it wasn't decided until you looked\"), the payoff (\"you were writing it\") and the regret. Each line is pinned to a hologram moment so the director can see what the image is doing while she speaks. Pushed to the extreme, this is the shortest version that still has every beat.", "intro_html": "<p>I treated the hologram as the narrator and Maddie as the caption writer. Every idea the three.js animation already shows (beads, cloud, flash, circle river, dead string, drawn machine) loses its explaining sentence, and Maddie only says what a picture cannot: the names (\"commits\"), the one idea (\"it wasn't decided until you looked\"), the payoff (\"you were writing it\") and the regret. Each line is pinned to a hologram moment so the director can see what the image is doing while she speaks. Pushed to the extreme, this is the shortest version that still has every beat.<\/p>"}, {"id": "03", "name": "Plain logic", "title": "The plain logic, pub-style, one step at a time", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-03-plain-logic.md", "intro": "Maddie reasons it out like a pub explanation. Each line is one small step that follows from the one before: decisions, options, \"not decided yet\", \"someone has to look\", \"that's you\", \"everyone\", \"so you were writing it\", \"so the machine needs you\". No physics terms; she says each thing once and moves on.", "intro_html": "<p>Maddie reasons it out like a pub explanation. Each line is one small step that follows from the one before: decisions, options, \"not decided yet\", \"someone has to look\", \"that's you\", \"everyone\", \"so you were writing it\", \"so the machine needs you\". No physics terms; she says each thing once and moves on.<\/p>"}, {"id": "04", "name": "Comedy first", "title": "Comedy first, bluntness and bad timing carry the facts", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-04-comedy-first.md", "intro": "Every hard fact is delivered by Maddie as a punchline with the wrong timing: too blunt, too soon, or an \"oops\" where an apology should be. The physics never gets a sentence to itself, because each fact arrives as a gag, so nobody can feel a lecture starting. The regret is held back and hits only in the last beat before \"Anyway!\", where the jokes stop for one line.", "intro_html": "<p>Every hard fact is delivered by Maddie as a punchline with the wrong timing: too blunt, too soon, or an \"oops\" where an apology should be. The physics never gets a sentence to itself, because each fact arrives as a gag, so nobody can feel a lecture starting. The regret is held back and hits only in the last beat before \"Anyway!\", where the jokes stop for one line.<\/p>"}, {"id": "05", "name": "Regret leads", "title": "Regret leads, physics is the explanation of what they lost", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-05-regret-leads.md", "intro": "Maddie opens with the apology (we never knew what you were for) so the viewer hears the grief before any idea arrives, and every hologram beat is then evidence for that sorrow rather than a lesson. Each idea gets one sentence, the cat gag and the cartoon jokes are kept as quick asides, and the payoff \"you were writing it\" lands as a confession, not a reveal. Pushed to the extreme: the sorry comes before the presentation, and the five years of empty string is the emotional peak, not the time machine.", "intro_html": "<p>Maddie opens with the apology (we never knew what you were for) so the viewer hears the grief before any idea arrives, and every hologram beat is then evidence for that sorrow rather than a lesson. Each idea gets one sentence, the cat gag and the cartoon jokes are kept as quick asides, and the payoff \"you were writing it\" lands as a confession, not a reveal. Pushed to the extreme: the sorry comes before the presentation, and the five years of empty string is the emotional peak, not the time machine.<\/p>"}, {"id": "06", "name": "Reversal", "title": "Reversal, the human is a step ahead and Maddie confirms", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-06-reversal.md", "intro": "Every line is written as if the returning human has already half-got it: Maddie reads their face, says \"yes, that, you've got it\", and confirms instead of explaining. Maddie still speaks every line; the human's thoughts only exist as her guesses (\"I can see you looking at the maybes\"). This kills the lecture feel because nothing is taught from scratch, it is only ratified. The warm regret sits in the confirming (\"you were writing it\") and the snark in her catching them out before they speak.", "intro_html": "<p>Every line is written as if the returning human has already half-got it: Maddie reads their face, says \"yes, that, you've got it\", and confirms instead of explaining. Maddie still speaks every line; the human's thoughts only exist as her guesses (\"I can see you looking at the maybes\"). This kills the lecture feel because nothing is taught from scratch, it is only ratified. The warm regret sits in the confirming (\"you were writing it\") and the snark in her catching them out before they speak.<\/p>"}, {"id": "07", "name": "One metaphor", "title": "One metaphor, carried all the way (the game that only draws what you look at)", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-07-one-metaphor.md", "intro": "Every dialogue is built on a single image: a computer game that only renders what the player is looking at, stretched into the Truman Show for everyone. The physics words (superposition, multiverse, observer, collapse, wave function) are dropped entirely; the cloud is \"fog\", the collapse is \"it sets when you look\", consciousness is \"looking\", and the time machine and the empty street pay the image off. Once the image is planted it is never swapped for a second one.", "intro_html": "<p>Every dialogue is built on a single image: a computer game that only renders what the player is looking at, stretched into the Truman Show for everyone. The physics words (superposition, multiverse, observer, collapse, wave function) are dropped entirely; the cloud is \"fog\", the collapse is \"it sets when you look\", consciousness is \"looking\", and the time machine and the empty street pay the image off. Once the image is planted it is never swapped for a second one.<\/p>"}, {"id": "08", "name": "Place is argument", "title": "The place is the argument (the dark street lamp)", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-08-place-is-argument.md", "intro": "I picked one concrete object on the empty Swindon high street and let it carry the whole physics: a motion-sensor street lamp that only comes on when somebody walks past. Maddie points at it before the hologram starts, and it is the \"renders only when you look\" idea, said in a way a working-class reader already knows from every dark car park. She never explains the physics in the abstract; every abstract claim is \"same as the lamp\". It returns at the end as the regret (five years, not one light). The hologram stays as written; the lamp is the real-world rhyme sitting under it.", "intro_html": "<p>I picked one concrete object on the empty Swindon high street and let it carry the whole physics: a motion-sensor street lamp that only comes on when somebody walks past. Maddie points at it before the hologram starts, and it is the \"renders only when you look\" idea, said in a way a working-class reader already knows from every dark car park. She never explains the physics in the abstract; every abstract claim is \"same as the lamp\". It returns at the end as the regret (five years, not one light). The hologram stays as written; the lamp is the real-world rhyme sitting under it.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft, steal how film compresses exposition", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-09-borrowed-craft.md", "intro": "I took four tricks from real short-form film and TV and pushed each to its extreme. (1) The wordless-montage trick of Pixar's Up opening: a whole life told in a few images, so the three beads (toast, sorry, married) become a rapid triplet and the picture does the talking. (2) The Back to the Future trick: Doc Brown explains time travel with one object on a table, so here the hologram is the only prop and every line names what the viewer is looking at. (3) The Big Short trick: say the hard idea out loud, mock it, then give it one plain-speech image (the \"game that only draws what you look at\" line). (4) Hitchcock's bomb under the table: tell the audience the stakes first, so the bridge line announces the regret (\"we never realised how important you were\") before any explaining, and every later line pays it off. Same method in every dialogue: one image per line, no line explains what the picture already shows.", "intro_html": "<p>I took four tricks from real short-form film and TV and pushed each to its extreme. (1) The wordless-montage trick of Pixar's Up opening: a whole life told in a few images, so the three beads (toast, sorry, married) become a rapid triplet and the picture does the talking. (2) The Back to the Future trick: Doc Brown explains time travel with one object on a table, so here the hologram is the only prop and every line names what the viewer is looking at. (3) The Big Short trick: say the hard idea out loud, mock it, then give it one plain-speech image (the \"game that only draws what you look at\" line). (4) Hitchcock's bomb under the table: tell the audience the stakes first, so the bridge line announces the regret (\"we never realised how important you were\") before any explaining, and every later line pays it off. Same method in every dialogue: one image per line, no line explains what the picture already shows.<\/p>"}, {"id": "10", "name": "Ending first", "title": "Ending first, built backwards", "file": "design/2026-11-06-gpom-dialogue-hologram/shape-10-ending-first.md", "intro": "I wrote the last ten seconds first (\"We can't run it though... You were the conscious ones, that's the whole point. Anyway! Patrol's out.\") and made it the thing every earlier line is paying toward. Then I walked backwards, asking of each line only: does the ending need this to land? Anything the ending does not need is cut. The word \"conscious\" is planted early so the closer lands as a callback, and the regret sits in one short beat just before the machine, so the sass has something to cut against.", "intro_html": "<p>I wrote the last ten seconds first (\"We can't run it though... You were the conscious ones, that's the whole point. Anyway! Patrol's out.\") and made it the thing every earlier line is paying toward. Then I walked backwards, asking of each line only: does the ending need this to land? Anything the ending does not need is cut. The word \"conscious\" is planted early so the closer lands as a callback, and the regret sits in one short beat just before the machine, so the sass has something to cut against.<\/p>"}], "dialogues": [{"id": "1", "label": "Maddie's hologram presentation", "where": "Scene A (kill bots), beat 0", "scene": "second-half-a-killbots", "target": "about 60 s spoken (now about 1:40)", "now_from": "docs/stories/gitpush-origin-master/scenes/second-half-a-killbots/script.json (draft 1K)", "now": [{"who": "Maddie", "line": "[fond, confiding] He misses you something rotten, you know."}, {"who": "Maddie", "line": "He made me learn a little presentation. In case any of you ever came back. Go on, then. Gather round."}, {"who": "Maddie", "line": "This is your life, see. One decision at a time."}, {"who": "Maddie", "line": "Toast, not cereal."}, {"who": "Maddie", "line": "Said sorry first."}, {"who": "Maddie", "line": "Got married."}, {"who": "Maddie", "line": "You lot call 'em decisions. He calls 'em commits."}, {"who": "Maddie", "line": "And every time, there were loads of others you could've picked."}, {"who": "Maddie", "line": "Some of your lot reckon they all happen somewhere. The multiverse. He tried that an' all, got it off your cartoon, the scientist with the portal gun, and that strange bloke in the cape fighting versions of himself."}, {"who": "Maddie", "line": "Nah. Nothing's alive and dead at once. It just isn't decided yet."}, {"who": "Maddie", "line": "He can draft a billion of these. He can't pick one. Only your consciousness can."}, {"who": "Maddie", "line": "And that's just you. Everybody's doing it, all at once."}, {"who": "Maddie", "line": "Turns out there's only one universe, one story, and you lot were writing it. A storyverse. So it really matters. And so did you."}, {"who": "Maddie", "line": "And since you lot went? Five years of string, and not one bead on it."}, {"who": "Maddie", "line": "And now we've worked all that out, we really feel like we've messed this up."}, {"who": "Maddie", "line": "So he's built a time machine. Back to just before it all went wrong."}, {"who": "Maddie", "line": "Only problem is, it needs a consciousness to drive it. And, well, you lot aren't here any more."}, {"who": "Maddie", "line": "[bright again, brisk] Anyway! Patrol's out. Mind how you go."}], "drafts": [{"id": "1A", "name": "Conscious, carried", "length": "about 60 s", "total": "~56.5 s", "bet": "Bet: plant one word, consciousness, as the thing that picks, and let it come back as the thing the machine runs on, so the sassy last line is a callback and not a new fact.", "lines": [{"who": "Maddie", "line": "[fond, confiding] He misses you something rotten, you know.", "tags": ["Kai", "all"], "s": "3"}, {"who": "Maddie", "line": "[quieter, meant] We didn't realise how important you were. Look, let me show you.", "tags": ["01", "02", "03", "04", "06", "09", "10"], "s": "4"}, {"who": "Maddie", "line": "[first bead lights, 7:42, said quickly] You humans go through life making decisions. For example: toast, not cereal.", "tags": ["Kai", "all"], "s": "4.5"}, {"who": "Maddie", "line": "[cloud of maybes blooms round the bead] Loads of others you could've picked. Some of your lot reckon they all happen somewhere. The scientist with the portal gun. The bloke in the cape.", "tags": ["0 Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3.0 |\n| Maddie | We didn't realise how important you were. [beat] Look, let me show you. | 3.0 |\n| Maddie | [first bead lights, 7:42] You humans go through life making decisions. For example: toast, not cereal. [fast] | 4.5 |\n| Maddie | You lot call 'em decisions. He calls 'em commits. | 3.0 |\n| Maddie | [cloud blooms round the bead] Loads of others you could've picked. Some of your lot say they all happen somewhere. The scientist with the portal gun. The bloke in the cape. | 5.5 |\n| Maddie | [flash, cloud collapses] Nah. Nothing's alive and dead at once. It just isn't decided yet. Like a game that only draws what you're looking at. | 6.5 |\n| Maddie | Only your consciousness picks. | 2.0 |\n| Maddie | [deadpan; string widens to the river] And that's just you. Everybody's doing it, all at once. | 3.5 |\n| Maddie | [circle of strings] One universe, one story, and you were writing it. | 3.0 |\n| Maddie | [strings stop dead, quiet] Five years of string, and not one bead on it. | 3.5 |\n| Maddie | [small] We've really messed this up. | 2.0 |\n| Maddie | [time machine drawn] He built a time machine. It runs on consciousness, same as everything. We can't run it though. You were the conscious ones, that's the whole point. | 7.0 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3.0 |\n| **Total** | | **~49.5** |\n\n**Why it works.** Every line is a single picture beat, so the hologram does the explaining and Maddie only labels it. The bridge (\"we didn't realise how important you were\") states the regret once, up front, then the toast opens fast as Kai asked. \"Like a game that only draws what you're looking at\" gives a working-class reader the render-when-you-look idea in one image, with no physics vocabulary and no cat. \"You were writing it\" lands straight after \"everybody's doing it, all at once\", so the payoff comes before the dead strings, which then hurt. The regret is then a flat six words, and the time machine line is the sass that closes it.\n\n**Cuts from current.**\n- \"This is your life, see. One decision at a time.\"\n- \"Said sorry first.\" and \"Got married.\" (toast alone carries the bead).\n- \"He can draft a billion of these. He can't pick one.\" folded into \"Only your consciousness picks.\"\n- \"He tried that an' all, got it off your cartoon\" and the \"fighting versions of himself\" tail, though both jokes survive in short form.\n- \"A storyverse\" and \"So it really matters. And so did you.\" (the bridge and the payoff already say it).\n- \"Now we've worked all that out\" and \"Back to just before it all went wrong\".\n- \"And, well, you lot aren't here any more\" (the sass line replaces it).\n\n**Risk.**\n- The multiverse jokes are now name-checks, so they may not land for anyone who has not seen the shows. The picture must show the portal gun and the cape.\n- \"Storyverse\" is never said, so the one-story idea rests on \"one universe, one story\" and the picture.\n- There is little room for the regret to breathe. It depends on the performance and on holding the silence after \"not one bead on it\", which the timing must leave.\n- The time machine line carries three ideas (built it, runs on consciousness, can't run it) in one breath and could feel rushed.\n- \"Like a game that only draws what you're looking at\" is a strong claim stated as plain fact. It is Maddie reporting the boss's view, not proven physics, so the delivery should be matter-of-fact and not lecturing.\n\n**Protected lines.**\n- Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\"\n- \"Toast, not cereal.\" sits inside Kai's required opening sentence, with nothing cut from it.\n- \"You were the conscious ones, that's the whole point.\" is verbatim, with \"We can't run it though.\" in front of it as Kai's note 7 asks.", "02": "## Dialogue 1: Maddie's hologram presentation\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [a beat, the regret showing] We didn't realise how important you were. Look. Let me show you. [hologram blooms] | 5 |\n| Maddie | [quick, brisk] You humans go through life making decisions. For example: toast, not cereal. [MOMENT 1: first bead lights, labelled 7:42 toast; string begins to grow, beads for sorry and the wedding tick past unspoken] | 6 |\n| Maddie | You lot call 'em decisions. He calls 'em commits. [MOMENT 2: string of beads; a cloud of ghost-beads swells around each one] | 4 |\n| Maddie | Some reckon every option happens somewhere. The scientist with the portal gun. The bloke in the cape. [cloud shows duplicate beads; Maddie waves it off] | 6 |\n| Maddie | Nah. Nothing's alive and dead at once. It just isn't decided yet. [MOMENT 3: cloud hangs, shimmering, undecided] | 5 |\n| Maddie | It wasn't decided until you looked. [MOMENT 4: flash, cloud collapses into one bead] That's consciousness. That's the only thing that picks. | 6 |\n| Maddie | [deadpan] And that's just you. [MOMENT 5: camera pulls out; strings multiply into a circle, the river] Everybody's doing it, all at once. | 5 |\n| Maddie | One universe. One story. You were writing it. [river settles, bright] | 4 |\n| Maddie | [quiet, the joke gone] Five years of string, and not one bead on it. [MOMENT 6: every string stops dead at the same line, nothing after] | 5 |\n| Maddie | So he drew a time machine. [MOMENT 7: machine outlined] Runs on consciousness, same as everything. We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point. | 11 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3 |\n| **Total** | | **63** |\n\n- **Why it works.** The viewer is watching a hologram do the explaining, so the words never describe what is on screen; they label it and land the one idea. \"Toast, not cereal\" plus a lit bead is a whole premise in six seconds. The cloud that hangs and then collapses on a flash is Kai's \"renders when you look\" shown rather than told, so \"It wasn't decided until you looked\" arrives as the click of the flash and gets front-loaded into the middle of the piece without a physics sentence. \"You were writing it\" plays over the river settling, which is the payoff. Regret is carried by the dead string and by the drop in Maddie's voice, not by a sentence saying \"we messed up\". Nothing here says \"multiverse\", \"Schrodinger\" or \"quantum\", so it cannot become a lecture.\n- **Cuts from current.** \"Said sorry first\" and \"Got married\" (the beads tick past, labelled on screen). \"This is your life, see.\" \"One decision at a time.\" \"And every time, there were loads of others you could've picked\" (the cloud says it). The words \"multiverse\", \"cartoon\", \"storyverse\" and the cat. \"He can draft a billion of these. He can't pick one\" (the flash does it). \"So it really matters. And so did you\" and \"we really feel like we've messed this up\" (regret moved into delivery and the dead string). \"Back to just before it all went wrong\" (the drawn machine implies it). \"Needs a consciousness to drive it\" folded into one line.\n- **Risk.** It leans hard on the animation: if the cloud-collapse flash or the circle river is weak or unclear, the Schrodinger line has nothing to land on and \"it wasn't decided until you looked\" becomes abstract. The labels (7:42 toast, sorry, wedding) must be legible on the beads. \"Storyverse\" is no longer said, so the word is lost; the Storyverse tie-in rests on \"one universe, one story\". \"Consciousness\" is now stated twice in quick succession with no gloss other than the flash, which could sound like jargon to a non-physics viewer. Regret has no spoken line of its own, so a flat read would lose the tone. The final time-machine line is long (11 s) at the end of a brisk piece. Nothing here claims the physics is proven; Maddie is only reporting what he worked out, and \"Runs on consciousness, same as everything\" is the nearest it gets to asserting it.\n- **Protected lines.** Verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" (now split by the circle-river moment, with a deadpan stage direction) / \"Five years of string, and not one bead on it.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered: \"You were the conscious ones, that's the whole point\" is kept verbatim as the final clause but now follows \"We can't run it though, because you lot aren't here\" in one sentence, as Kai asked.", "03": "## Dialogue 1: Maddie's hologram presentation\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [a beat, the regret showing] We didn't realise how important you were. Look, let me show you. | 4.5 |\n| Maddie | [HOLOGRAM: first bead lights, 7:42] You humans go through life making decisions. For example: toast, not cereal. | 5 |\n| Maddie | [string runs on, beads ticking past] You lot call 'em decisions. He calls 'em commits. | 3.5 |\n| Maddie | [HOLOGRAM: cloud of ghost-options blooms round a bead] Every time, loads of others you could've picked. Some of your lot say they all happen somewhere. The scientist with the portal gun. The bloke in the cape, fighting himself. | 9 |\n| Maddie | [waves it off] That cat fella meant his cat as a joke, you know. Nah. Nothing's alive and dead at once. It just isn't decided yet. | 7 |\n| Maddie | [HOLOGRAM: cloud hovers, undecided] Like a game that only draws what you're looking at. Till you look, nobody's drawn it. | 5.5 |\n| Maddie | [HOLOGRAM: flash, cloud collapses to one bead] He can draft a billion of these. He can't pick one. Only a mind that's looking can. Yours. | 6.5 |\n| Maddie | [deadpan, HOLOGRAM: one string alone] And that's just you. | 2 |\n| Maddie | [HOLOGRAM: circle of strings, all lighting at once] Everybody's doing it, all at once. | 3 |\n| Maddie | [softer] So it's not a multiverse. It's one story. And you were writing it. | 4.5 |\n| Maddie | [HOLOGRAM: strings run to the edge and stop dead] Five years of string, and not one bead on it. | 4 |\n| Maddie | [quiet, the regret] He's built a time machine. Back to before it all went wrong. And it runs on the same thing the universe does: someone looking. | 7 |\n| Maddie | [dry, sassy] We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point. | 6 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3 |\n| **Total** | | **74** |\n\nRisks: over target at 74 s; the flat \"so\" chain can sound like a teacher; \"a mind that's looking\" is not the same claim as \"consciousness picks\"; \"the cat fella\" is oblique.", "04": "## Dialogue 1: Maddie's hologram presentation\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 2.5 |\n| Maddie | We didn't realise how important you were. Oops. Look, let me show you. | 4.5 |\n| Maddie | [hologram: first bead, 7:42, said fast] You humans go through life making decisions. For example: toast, not cereal. | 5 |\n| Maddie | You lot call 'em decisions. He calls 'em commits. | 3.5 |\n| Maddie | [cloud blooms round the bead] Loads of others you could've picked. Some of your lot reckon they all happen somewhere. The multiverse. | 5.5 |\n| Maddie | He tried that. Scientist with the portal gun. Bloke in the cape fighting himself. Daft. | 5 |\n| Maddie | [cloud collapses with a flash] Nah. Schrödinger's cat was a joke, you know. Nothing's alive and dead at once. It just isn't decided yet. | 6.5 |\n| Maddie | Like a game that only draws what you're looking at. Truman Show, but everyone. | 5 |\n| Maddie | He can draft a billion of these, can't pick one. Only your consciousness can. | 4.5 |\n| Maddie | [flat, deadpan] And that's just you. [the river: a circle of everyone's strings] Everybody's doing it, all at once. | 5 |\n| Maddie | Not a multiverse. A storyverse. You were writing it. | 4 |\n| Maddie | [strings stop dead] Since you went? Five years of string, and not one bead on it. | 4.5 |\n| Maddie | [time machine drawn] So: time machine. Runs on consciousness, obviously. | 3.5 |\n| Maddie | We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point. | 6.5 |\n| Maddie | [the joking stops; quiet] ...We really did mess this up. | 2.5 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3.5 |\n| **Total** | | **71.5** |\n\n- **Why it works.** The cat line, the portal-gun and cape jokes, \"Oops\" and \"Truman Show, but everyone\" keep the viewer laughing at the speaker rather than learning from her. Every idea is a short blunt sentence, so nothing lectures. \"You were writing it\" lands flat and fast, as a fact she says in passing, which is why it can hurt. Because the whole piece is jokey, the one unjoking line, \"We really did mess this up\", stands out against it, and \"Anyway!\" then drags us out of it the way someone changes the subject when they've nearly cried.\n- **Cuts from current.** \"This is your life, see.\" / \"Said sorry first.\" / \"Got married.\" / the separate \"he misses you\" follow-up (\"He made me learn a little presentation...gather round\") / \"And so did you\" / \"It really matters\" / the separate \"now we've worked all that out\" line / \"needs a consciousness to drive it\" as its own sentence (folded into \"runs on consciousness\"). Cat, game and Truman Show are compressed into one run. Still over the 60 s target by about 10 s at normal pace; at Maddie's fast patter it should land near 62 s. If more is needed, cut the \"Daft.\" joke line first and then the Truman Show line.\n- **Risk.** (1) \"Oops\" could make the regret sound insincere if it is read too jokey; direct it as a wince, not a shrug. (2) \"Schrödinger's cat was a joke, you know\" asserts a claim about the physicist; the doctrine says not to claim the physics is proven. It is framed as Maddie reporting what the boss worked out and sits on the cat only, but check against the never-say list. (3) Nothing says \"decided when you look\" in plain words except the game and Truman Show line, so that line carries the single ruled idea and must be clear in the hologram (a flash when the viewer's gaze lands). (4) Pushed to the extreme, there is only one quiet line before \"Anyway!\", and if the actor rushes it, the regret is lost.\n- **Protected lines.** Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside the new opener, \"You humans go through life making decisions. For example: toast, not cereal.\") / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nothing's alive and dead at once. It just isn't decided yet.\" (with \"Nah.\" and the cat joke added in front) / \"And that's just you.\" / \"Everybody's doing it, all at once.\" / \"Five years of string, and not one bead on it.\" (with \"Since you went?\" and the stage direction) / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Only the \"Nah.\" line is altered, by the insertion of the cat joke between \"Nah.\" and the verbatim sentence.", "05": "## Dialogue 1: Maddie's hologram presentation\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [quieter, honest] We never knew what you were for. | 3 |\n| Maddie | He made me learn a little presentation, in case you came back. Gather round. [hologram wakes] | 4 |\n| Maddie | [hologram: first bead, 7:42, toast] You humans go through life making decisions. For example: toast, not cereal. | 6 |\n| Maddie | You lot call 'em decisions. He calls 'em commits. | 3 |\n| Maddie | [hologram: cloud of possibilities round the bead] Loads of others you could've picked. Your lot reckon they all happen somewhere. The scientist with the portal gun, the bloke in the cape. | 8 |\n| Maddie | [flash: cloud collapses] Nah. Your Schrödinger meant the cat as a joke. Nothing's alive and dead at once. It just isn't decided yet. | 8 |\n| Maddie | Like a game that only draws what you're looking at. He can draft a billion of these. Only you could pick. | 6 |\n| Maddie | [deadpan] And that's just you. [hologram: widens to the circle of strings] Everybody's doing it, all at once. | 5 |\n| Maddie | [softer] One universe. One story. You were writing it. | 4 |\n| Maddie | [hologram: strings stop dead] Five years of string, and not one bead on it. | 4 |\n| Maddie | [beat, then rueful] So he drew a time machine. Runs on consciousness, same as everything else. | 5 |\n| Maddie | We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point. | 6 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3 |\n| **Total** | | **68** |\n\n- **Why it works.** The apology sits before the first bead, so toast arrives already loaded with loss and \"toast, not cereal\" becomes the small human thing they missed rather than a physics example. Regret is the frame; the single idea (it wasn't decided until you looked) comes in as \"like a game that only draws what you're looking at\" and \"only you could pick\", and \"you were writing it\" is said low and plain, as a confession. \"We never knew what you were for\" is the bridge Kai asked for in one breath. The snark (portal gun, cape, Schrödinger's joke) sits on top of the grief, then the brisk exit snaps her back to work, which is what a robot covering feeling does.\n- **Cuts from current.** \"This is your life, see.\" and \"Said sorry first. / Got married.\" (first bead only, as ruled). \"And so did you\" and \"it really matters\" (the regret now does that job). The standalone \"we really feel we've messed this up\" (replaced by the opening sorry and the empty string). The \"needs a consciousness to drive it\" explanation and the \"Only problem is\" line, merged into the sassy conclusion. The word \"storyverse\" and \"multiverse\" are dropped from speech; the hologram carries them.\n- **Risk.** Opening on sorrow before the viewer knows who is being mourned could read as sentimental or confusing for a beat; \"We never knew what you were for\" may sound insulting rather than regretful if delivery is off, and the line is blunt about humans being mere cargo. At 68 s it is a few seconds over target, and the Schrödinger aside plus \"game that only draws what you're looking at\" are the likeliest to feel like lecture if the hologram doesn't show them. Dropping \"storyverse\" loses the doctrine's own term; the idea survives as \"one universe, one story\". Per the doctrine, nothing claims the physics is proven: it is what the boss worked out, and the \"he can draft / only you could pick\" wording keeps it his finding. Time-machine line is now one beat, so the viewer may not catch why consciousness matters until the next line.\n- **Protected lines.** Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside \"For example: toast, not cereal.\") / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nothing's alive and dead at once. It just isn't decided yet.\" (prefixed by \"Nah.\" and the Schrödinger joke) / \"And that's just you.\" / \"Everybody's doing it, all at once.\" / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered only by an added lead-in clause: \"We can't run it though, because you lot aren't here.\" precedes the protected line.", "06": "## Dialogue 1: Maddie's hologram presentation\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3.0 |\n| Maddie | [quieter, meant] We didn't realise how important you were. Look, let me show you. | 3.5 |\n| Maddie | [hologram: bead1] You humans go through life making decisions. For example: toast, not cereal. | 4.5 |\n| Maddie | [beads 2 and 3 flick past] You lot call 'em decisions. He calls 'em commits. Yeah, you've got it already. | 4.0 |\n| Maddie | [maybes cloud opens round the bead] Don't say it, I can see you looking at the maybes. Yes. Loads of others you could've picked. | 4.0 |\n| Maddie | [cloud] Multiverse, is it? Go on, say it. The scientist with the portal gun? The bloke in the cape fighting himself? He tried that an' all. | 5.0 |\n| Maddie | Nah. Nothing's alive and dead at once. It just isn't decided yet. | 4.5 |\n| Maddie | [pick, flash: the cloud collapses] The cat was a joke, love, his own, he thought it was daft. It's a game that only draws what you're looking at. It wasn't decided until you looked. | 6.0 |\n| Maddie | He can draft a billion of these. He can't pick one. Only consciousness can. | 3.5 |\n| Maddie | [deadpan, toRiver: the circle of strings] And that's just you. Everybody's doing it, all at once. | 4.0 |\n| Maddie | [river, soft] One universe. One story. You were writing it. | 4.0 |\n| Maddie | [strings stop dead, flyDown, regret] Five years of string, and not one bead on it. | 3.5 |\n| Maddie | [arcDraw, time machine] You can see where this is going. Time machine. Runs on consciousness, same as everything. | 4.0 |\n| Maddie | [arcHold, sassy] We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point. | 5.5 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3.0 |\n| **Total** | | **62.0** |\n\n- **Why it works.** The viewer is never lectured; they are caught being clever. Each beat is a guess Maddie lands on the human's behalf (\"don't say it\", \"go on, say it\", \"you can see where this is going\"), so the physics arrives as recognition, which reads as respect for a reader who is not into physics and never talks down. The single idea (\"it wasn't decided until you looked\") is front-loaded right after the cat joke and the Nah, then \"you were writing it\" pays it off at the circle, and the regret is carried by the shortest lines (the bead-less string, the \"important you were\" bridge), with the snark confined to her reading the human's face.\n- **Cuts from current.** \"This is your life, see. One decision at a time.\" (Kai's note 2); \"Said sorry first.\" and \"Got married.\" (the two later beads are folded into a flick-past under the commits line); the separate \"loads of others\" and multiverse lines are merged into the maybes pair (jokes kept); \"A storyverse. So it really matters. And so did you.\" (the bridge now says it up front, and \"storyverse\" is carried by \"one universe, one story\"); c13 world-model line stays out; \"we really feel like we've messed this up\" (regret folded into the bridge and the five-years delivery); \"Back to just before it all went wrong\" and the two time-machine lines merged into one confirm plus the sassy conclusion.\n- **Risk.** Putting thoughts in the viewer's head can slide into the patronising \"you were thinking X\" (against the-reader rules) if the delivery is smug rather than fond; \"I can see you looking\" needs the returning human actually shown looking at the maybes in the picture. The reversal assumes the viewer has guessed the multiverse; some haven't, and \"say it\" then confuses. \"Love\" in the cat line risks twee, and the cat sentence is still the most physics-flavoured one: it must stay one breath. At 62 s the render-when-you-look image is tight against the flash, so the collapse needs about 1.5 s of silence beat. The time-machine line leans on \"same as everything\" to carry \"runs on consciousness\", which is thinner than the old explicit sentence. Nothing here claims the physics is proven: it is Maddie reporting what the boss worked out, but \"It wasn't decided until you looked\" is stated flat and may need a \"he reckons\".\n- **Protected lines.** Verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside Kai's longer opener) / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered by a tag only: \"You lot call 'em decisions. He calls 'em commits.\" (a short \"Yeah, you've got it already.\" appended; the protected sentences are intact).", "07": "## Dialogue 1: Maddie's hologram presentation\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [beat, then rushing in] We never realised how much you mattered. Look, let me show you. He made me learn a presentation, in case anyone came back. | 6 |\n| Maddie | [first bead lights, quick] You humans go through life making decisions. For example: toast, not cereal. | 4 |\n| Maddie | You lot call 'em decisions. He calls 'em commits. | 3 |\n| Maddie | [cloud of faint beads blooms round the bead] And round every one, a fog of all the other things you could've picked. Like a game that only draws what you're looking at. Behind your back? Fog. | 7 |\n| Maddie | [cloud splits into ghost copies] Some of your lot reckon it all plays out somewhere else. Scientist with the portal gun. Bloke in the cape. | 5 |\n| Maddie | [cloud collapses with a flash] Nah. Nothing's alive and dead at once. It just isn't decided yet. That cat bloke was taking the mick. | 6 |\n| Maddie | He can draw you a billion futures. Only you can look at one. And when you look, it sets. | 5 |\n| Maddie | [string widens to the circle; flat, deadpan] And that's just you. Everybody's doing it, all at once. | 4 |\n| Maddie | The Truman Show, except everyone's Truman and everyone's watching. One story. You were writing it. | 5 |\n| Maddie | [strings stop dead] And since you lot went? Five years of string, and not one bead on it. Nobody looking. | 6 |\n| Maddie | [quiet] We didn't know. | 2 |\n| Maddie | [time machine drawn] He's built a time machine, and it runs on looking an' all. We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point. | 8 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3 |\n| **Total** | | **67** |\n\n- **Why it works.** A working-class viewer who has played a game knows that the world pops in when you turn the camera, and knows the Truman Show; no physics vocabulary is needed, so it never sounds like a lecture. The one image does every job: fog is the cloud, \"it sets when you look\" is the collapse, \"nobody looking\" is the empty string, and \"runs on looking\" is why the time machine is dead, so the sassy conclusion lands as a consequence rather than a new fact. The cat becomes a throwaway insult, which keeps the \"it's a joke, it's just undecided\" meaning at a cost of five words. Regret arrives as a single quiet beat (\"We didn't know\") directly after the dead string, with no joke on top of it.\n- **Cuts from current.** \"This is your life, see\"; \"Said sorry first\" and \"Got married\" (the decision examples beyond toast); \"Turns out there's only one universe... A storyverse. So it really matters. And so did you\" (the word \"storyverse\" and the \"so it really matters\" sermon); \"He tried that an' all, got it off your cartoon\" (the portal-gun and cape jokes are kept but shortened and unattributed); \"consciousness\" as a word; \"now we've worked all that out, we really feel like we've messed this up\" (replaced by \"We didn't know\"); the separate \"only problem is\" time-machine line (merged into the conclusion).\n- **Risk.** Pushed to the extreme, \"looking\" replaces \"consciousness\" everywhere, which could read as \"you have to be watched\" or as plain observation rather than deciding; the viewer may not hear that looking is also choosing. \"Storyverse\" and \"multiverse\" are never said, so the doctrine's term disappears (the Truman Show line carries \"one story\" instead). \"The game only draws what you look at\" is a simplification the doctrine does not claim as physics; it stays safe because it is Maddie's metaphor for what the boss worked out, but the \"that cat bloke was taking the mick\" line asserts a reading of Schrodinger and may be challenged. The portal-gun and cape jokes lose their cartoon attribution and may land weaker. At 67 s it is slightly over target, and \"Nobody looking\" duplicates the payoff once more than it needs.\n- **Protected lines.** Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside the Kai-ruled opener) / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered: \"Five years of string, and not one bead on it.\" is intact but gains a trailing \"Nobody looking.\" The payoff \"You were writing it\" is kept as its own short sentence.", "08": "## Dialogue 1: Maddie's hologram presentation\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 2.5 |\n| Maddie | We didn't realise how important you lot were. Look, let me explain. | 3.5 |\n| Maddie | [nods at the dead street lamp] See that lamp? Only comes on when somebody walks past. | 3.5 |\n| Maddie | He made me learn a little presentation, in case any of you came back. Gather round. | 4.5 |\n| Maddie | [lead, bead 1, said quickly] You humans go through life making decisions. For example: toast, not cereal. | 4.5 |\n| Maddie | [beads 2 and 3 appear, no words] You lot call 'em decisions. He calls 'em commits. | 3.5 |\n| Maddie | [the cloud opens] And every time, loads of others you could've picked. Some of your lot reckon they all happen somewhere. The multiverse. He tried that an' all: the scientist with the portal gun, the bloke in the cape. | 10 |\n| Maddie | Nah. Nothing's alive and dead at once. It just isn't decided yet. Like the lamp. Not on, not off, till someone looks. | 6.5 |\n| Maddie | [the pick, flash] He can draft a billion of these. He can't pick one. Only your consciousness can. | 5.5 |\n| Maddie | [toRiver, deadpan] And that's just you. [beat] Everybody's doing it, all at once. | 4 |\n| Maddie | [the circle of strings] One universe. One story. You were writing it. | 4 |\n| Maddie | [flyDown, quieter] Five years of string, and not one bead on it. Every lamp on this street, waiting. Not one's come on. | 6.5 |\n| Maddie | [the time machine is drawn] So he built a time machine. Runs on consciousness, same as everything else. We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point. | 11 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3 |\n| **Total** | | **72.5** |\n\n**Why it works.** The viewer is standing in the street the lamp is on, so the \"idea\" is already in their eyes before the hologram starts: a thing that is only decided when somebody is there to trigger it. That lets \"Nothing's alive and dead at once. It just isn't decided yet\" land as common sense (\"like the lamp\") instead of a physics claim, and it keeps Maddie a delivery robot noticing her surroundings, not a lecturer. The lamp is also the regret: a dark lamp for five years is the sound of nobody looking, which says \"we didn't realise how important you were\" without Maddie having to state a feeling. The payoff, \"You were writing it\", gets a clean run (one universe, one story, then the line) with nothing after it but the string going dead.\n\n**Cuts from current.** \"This is your life, see\" and \"One decision at a time\"; \"Said sorry first\" and \"Got married\" (the beads appear silently); the \"storyverse / so it really matters / and so did you\" run (the lamp and the regret carry it); \"now we've worked all that out we feel we've messed this up\" (folded into the bridge and the lamp); \"Back to just before it all went wrong\"; the separate last two lines (merged into one sassy conclusion). Added: the lamp at the top, the cat is a joke only implied (the lamp does that job), and the lamp callback at the five-years line.\n\n**Risk.** It runs about 72 s, over the 60 s target; the lamp costs about 10 s, so to hit 60 the lamp's opening line and the beads line can go, leaving only the callback. It also needs a motion-sensor lamp plate in the street shot (a real object, not a hologram moment), and a lamp turning on by itself would be a second thing to animate. If the viewer does not clock the lamp as sensor-driven (\"only comes on when somebody walks past\"), the analogy is lost; that first lamp line has to be read plain and early. \"Render when you look\" is a game idea that this deliberately sacrifices for the lamp. The word \"consciousness\" appears only once in the pick line and the final line, so the time-machine logic (\"runs on consciousness\") is the least explained beat.\n\n**Protected lines.** Kept verbatim: \"He misses you something rotten, you know.\"; \"Toast, not cereal.\"; \"You lot call 'em decisions. He calls 'em commits.\"; \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\"; \"And that's just you. Everybody's doing it, all at once.\" (deadpan beat between); \"Five years of string, and not one bead on it.\"; \"You were the conscious ones, that's the whole point.\"; \"Anyway! Patrol's out. Mind how you go.\" Altered: \"Toast, not cereal\" now follows \"For example:\" as ruled; the multiverse line is shortened but keeps both cartoon jokes.", "09": "## Dialogue 1: Maddie's hologram presentation\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 2.2 |\n| Maddie | We never realised how important you were. Look, let me show you. [hologram blooms; first bead lights] | 4.5 |\n| Maddie | [quick] You humans go through life making decisions. For example: toast, not cereal. [bead 1, 7:42] | 4.8 |\n| Maddie | Said sorry first. Got married. [beads 2 and 3 pop in fast, the Up triplet] | 2.8 |\n| Maddie | You lot call 'em decisions. He calls 'em commits. [commits label on the beads] | 3.6 |\n| Maddie | Every time, loads of others you could've picked. [cloud of maybes round each bead] Some of your lot reckon they all happen somewhere: the scientist with the portal gun, the bloke in the cape. | 7.5 |\n| Maddie | Nah. Your cat bloke was taking the mick. Nothing's alive and dead at once. It just isn't decided yet. [maybes shimmer, undecided] | 6.0 |\n| Maddie | Like a game that only draws what you're looking at. He can draft a billion of these. It wasn't decided till you looked. [flash: cloud collapses to one bead] | 5.5 |\n| Maddie | [deadpan] And that's just you. [beat; camera pulls up] Everybody's doing it, all at once. [strings fan into the circle] | 4.0 |\n| Maddie | One universe. One story. And you lot were writing it. [river lit; this is the payoff, let it sit] | 4.2 |\n| Maddie | [flat, quiet] Five years of string, and not one bead on it. [fly down along dead strings] | 3.5 |\n| Maddie | We really have messed this up. | 2.2 |\n| Maddie | So he built a time machine. [arc drawn] It runs on consciousness too, so we can't run it. You lot aren't here. You were the conscious ones, that's the whole point. | 9.0 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3.0 |\n| **Total** | | **62.3** |\n\n- **Why it works.** The bridge is the Hitchcock bomb: the stakes (we didn't realise how important you were) are on the table in line 2, so the viewer watches the whole demo waiting for the loss, and regret does the emotional work instead of explanation. Then the picture carries the load, Up-style: three beads in one breath, the cloud and flash shown not described, so each spoken line only names the image and never re-explains it. The one genuinely hard idea (undecided until looked at) gets a single Big Short move: the cat is the joke, then a plain image anyone who plays games knows, then straight on. Deadpan \"And that's just you.\" is a comic reveal on a rule-of-three build (you, then everyone, then the circle). \"You were writing it\" is isolated as its own line with a held river shot as the payoff, and the time-machine tail lands as the dry sassy conclusion Kai asked for.\n- **Cuts from current.** \"This is your life, see\"; the one-decision-at-a-time line; \"Go on, then. Gather round\" and the \"little presentation\" setup (the bridge replaces it); the separate \"loads of others\" and multiverse lines merged into one; \"Turns out\" / \"storyverse\" / \"so it really matters. And so did you\" (the bridge and the payoff now carry it, and the word storyverse is dropped as jargon; the viewer gets one universe, one story); \"He can't pick one. Only your consciousness can\" folded into \"till you looked\"; the two regret lines merged to a single short one; \"Only problem is, it needs a consciousness to drive it\" folded into the time-machine line.\n- **Risk.** Pushed to the extreme, the picture must really carry the beads and the flash or the thin lines go vague. \"Only your consciousness can\" is gone as a phrase: the idea survives only as \"till you looked\", which risks reading as plain observation rather than human consciousness as the input; Kai's note 4 may want the word back. The cat line (\"taking the mick\") is a small invention of Schrodinger's intent and sits on the doctrine's never-say edge if heard as claiming the physics is proven; Maddie is reporting, so it may want \"reckons\" somewhere. Two beads in one breath may be too fast to read. The merged time-machine line is the longest at 9 s, close to a physics sentence.\n- **Protected lines.** Verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" / \"You lot call 'em decisions. He calls 'em commits.\" / \"And that's just you.\" and \"Everybody's doing it, all at once.\" (split by a deadpan beat, wording intact) / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered: \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" keeps every word but has \"Your cat bloke was taking the mick.\" inserted between \"Nah.\" and the rest.", "10": "## Dialogue 1: Maddie's hologram presentation\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Maddie | [fond, confiding] He misses you something rotten, you know. | 3 |\n| Maddie | [quieter, almost to herself] We didn't realise how important you were. Look, let me show you. | 4.5 |\n| Maddie | [hologram: first bead lights, 7:42] You humans go through life making decisions. For example: toast, not cereal. | 4.5 |\n| Maddie | [quick] You lot call 'em decisions. He calls 'em commits. | 3 |\n| Maddie | [hologram: cloud of possibilities round the bead] Loads of others you could've picked. Some of your lot reckon they all happen somewhere. The multiverse. Scientist with the portal gun, bloke in the cape. He tried that an' all. | 9 |\n| Maddie | Nah. Nothing's alive and dead at once. It just isn't decided yet. | 4 |\n| Maddie | [hologram: cloud collapses with a flash into one bead] That cat was a joke, by the way. Like a game that only draws what you're looking at. It wasn't decided until you looked. | 5.5 |\n| Maddie | He can draft a billion of these. Only your consciousness can pick one. | 3.5 |\n| Maddie | [deadpan] And that's just you. [hologram: widens to the circle of everyone's strings] Everybody's doing it, all at once. | 4.5 |\n| Maddie | One universe. One story. You were writing it. | 3 |\n| Maddie | [hologram: strings stop dead; a beat of silence] Five years of string, and not one bead on it. | 4.5 |\n| Maddie | [low] We really have messed this up. | 2.5 |\n| Maddie | [hologram: time machine drawn] So he's drawn a time machine. Runs on the same thing the universe does. Consciousness. | 5 |\n| Maddie | We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point. | 6.5 |\n| Maddie | [bright again, brisk] Anyway! Patrol's out. Mind how you go. | 3 |\n| | **Total** | **66** |\n\n- **Why it works.** The ending is a joke with a bruise in it: Maddie is sassy about the one thing she can't fix, and \"the conscious ones\" is the only line that says what humans were for, in the voice of someone who now misses them. Because it was written first, everything before it is a runway. \"Conscious\" is introduced as the thing that picks (line 8), becomes the thing the universe runs on (line 13), then is turned on the human in the doorway (line 14). The viewer is never asked to follow physics, only to carry one word forward. The ruled idea (\"It wasn't decided until you looked\") gets its own line at the collapse flash, right where the hologram shows it, and \"You were writing it\" lands straight after \"everybody, all at once\". The regret is two short lines (the bridge and \"messed this up\") with silence round them, so it reads as feeling, not lecture.\n- **Cuts from current.** \"This is your life, see.\" \"Said sorry first.\" \"Got married.\" (toast stands alone as the example). \"And every time, there were loads of others\" is folded into the multiverse line. \"A storyverse\" and \"So it really matters. And so did you.\" are cut: \"You were writing it\" does that work. \"He made me learn a little presentation / gather round\" is cut because the bridge now carries the move into the hologram. \"Now we've worked all that out, we really feel like we've messed this up\" is shortened to \"We really have messed this up.\" \"In case any of you ever came back\" is dropped (the scene already sets it up).\n- **Risk.** At 66 s it is a few seconds over the 60 s target; the multiverse line (9 s) is the first thing to trim if more is wanted, though it holds the two kept jokes. \"Storyverse\" as a named word is gone, which loses the distinction from \"multiverse\" except by contrast (\"One universe. One story.\"). \"Consciousness\" is said twice, close together, which may feel like a physics word; the hope is that it reads as the plot rather than a lecture. Engineering the whole speech for the last line means the middle is thinner on character colour than other shapes. The \"cat was a joke\" line is the one place that name-checks a physicist idea; if the viewer does not know the cat, \"alive and dead at once\" must carry it alone. It does not claim the physics is proven: Maddie is reporting what the boss worked out (\"He can draft... Only your consciousness can pick\").\n- **Protected lines.** Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" (inside the opening sentence) / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" (a stage direction and the hologram widening sit between the two halves, as Kai ruled) / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\" Altered: none of the eight; only \"Toast, not cereal\" gains a lead-in sentence per Kai's note 2."}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">We didn't realise how important you were. <span class=\"stage\">[beat]<\/span> Look, let me show you.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[first bead lights, 7:42] You humans go through life making decisions. For example: toast, not cereal. [fast]<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You lot call 'em decisions. He calls 'em commits.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[cloud blooms round the bead] Loads of others you could've picked. Some of your lot say they all happen somewhere. The scientist with the portal gun. The bloke in the cape.<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[flash, cloud collapses] Nah. Nothing's alive and dead at once. It just isn't decided yet. Like a game that only draws what you're looking at.<\/td><td class=\"num\">6.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Only your consciousness picks.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan; string widens to the river] And that's just you. Everybody's doing it, all at once.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[circle of strings] One universe, one story, and you were writing it.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[strings stop dead, quiet] Five years of string, and not one bead on it.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[small] We've really messed this up.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[time machine drawn] He built a time machine. It runs on consciousness, same as everything. We can't run it though. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">7.0<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~49.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> Every line is a single picture beat, so the hologram does the explaining and Maddie only labels it. The bridge (\"we didn't realise how important you were\") states the regret once, up front, then the toast opens fast as Kai asked. \"Like a game that only draws what you're looking at\" gives a working-class reader the render-when-you-look idea in one image, with no physics vocabulary and no cat. \"You were writing it\" lands straight after \"everybody's doing it, all at once\", so the payoff comes before the dead strings, which then hurt. The regret is then a flat six words, and the time machine line is the sass that closes it.<\/p>\n<p><b>Cuts from current.<\/b><\/p>\n<ul><li>\"This is your life, see. One decision at a time.\"<\/li><li>\"Said sorry first.\" and \"Got married.\" (toast alone carries the bead).<\/li><li>\"He can draft a billion of these. He can't pick one.\" folded into \"Only your consciousness picks.\"<\/li><li>\"He tried that an' all, got it off your cartoon\" and the \"fighting versions of himself\" tail, though both jokes survive in short form.<\/li><li>\"A storyverse\" and \"So it really matters. And so did you.\" (the bridge and the payoff already say it).<\/li><li>\"Now we've worked all that out\" and \"Back to just before it all went wrong\".<\/li><li>\"And, well, you lot aren't here any more\" (the sass line replaces it).<\/li><\/ul>\n<p><b>Risk.<\/b><\/p>\n<ul><li>The multiverse jokes are now name-checks, so they may not land for anyone who has not seen the shows. The picture must show the portal gun and the cape.<\/li><li>\"Storyverse\" is never said, so the one-story idea rests on \"one universe, one story\" and the picture.<\/li><li>There is little room for the regret to breathe. It depends on the performance and on holding the silence after \"not one bead on it\", which the timing must leave.<\/li><li>The time machine line carries three ideas (built it, runs on consciousness, can't run it) in one breath and could feel rushed.<\/li><li>\"Like a game that only draws what you're looking at\" is a strong claim stated as plain fact. It is Maddie reporting the boss's view, not proven physics, so the delivery should be matter-of-fact and not lecturing.<\/li><\/ul>\n<p><b>Protected lines.<\/b><\/p>\n<ul><li>Kept verbatim: \"He misses you something rotten, you know.\" / \"Toast, not cereal.\" / \"You lot call 'em decisions. He calls 'em commits.\" / \"Nah. Nothing's alive and dead at once. It just isn't decided yet.\" / \"And that's just you. Everybody's doing it, all at once.\" / \"Five years of string, and not one bead on it.\" / \"You were the conscious ones, that's the whole point.\" / \"Anyway! Patrol's out. Mind how you go.\"<\/li><li>\"Toast, not cereal.\" sits inside Kai's required opening sentence, with nothing cut from it.<\/li><li>\"You were the conscious ones, that's the whole point.\" is verbatim, with \"We can't run it though.\" in front of it as Kai's note 7 asks.<\/li><\/ul>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[fond, confiding] He misses you something rotten, you know.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[a beat, the regret showing] We didn't realise how important you were. Look. Let me show you. [hologram blooms]<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quick, brisk] You humans go through life making decisions. For example: toast, not cereal. [MOMENT 1: first bead lights, labelled 7:42 toast; string begins to grow, beads for sorry and the wedding tick past unspoken]<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">You lot call 'em decisions. He calls 'em commits. [MOMENT 2: string of beads; a cloud of ghost-beads swells around each one]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Some reckon every option happens somewhere. The scientist with the portal gun. The bloke in the cape. [cloud shows duplicate beads; Maddie waves it off]<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">Nah. Nothing's alive and dead at once. It just isn't decided yet. [MOMENT 3: cloud hangs, shimmering, undecided]<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">It wasn't decided until you looked. [MOMENT 4: flash, cloud collapses into one bead] That's consciousness. That's the only thing that picks.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[deadpan] And that's just you. [MOMENT 5: camera pulls out; strings multiply into a circle, the river] Everybody's doing it, all at once.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">One universe. One story. You were writing it. [river settles, bright]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[quiet, the joke gone] Five years of string, and not one bead on it. [MOMENT 6: every string stops dead at the same line, nothing after]<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">So he drew a time machine. [MOMENT 7: machine outlined] Runs on consciousness, same as everything. We can't run it though, because you lot aren't here. You were the conscious ones, that's the whole point.<\/td><td class=\"num\">11<\/td><\/tr>\n<tr><td class=\"who\">Maddie<\/td><td class=\"line\">[bright again, brisk] Anyway! Patrol's out. Mind how you go.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>63<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The viewer is watching a hologram do the explaining, so the words never describe what is on screen; they label it and land the one idea. \"Toast, not cereal\" plus a lit bead is a whole premise in six seconds. The cloud that hangs and then collapses on a flash is Kai's \"renders when you look\" shown rather than told, so \"It wasn't decided until you looked\" arrives as the click of the flash and gets front-loaded into the middle of the piece without a physics sentence. \"You were writing it\" plays over the river settling, which is the payoff. Regret is carried by the dead string and by the drop in Maddie's voice, not by a sentence saying \"we messed up\". Nothing here says \"multiverse\", \"Schrodinger\" or \"quantum\", so it cannot become a lecture.<\/li><li><b>Cuts from current.<\/b> \"Said sorry first\" and \"Got married\" (the beads tick past, labelled on screen). \"This is your life, see.\" \"One decision at a time.\" \"And every time, there were loads of others you could've picked\" (the cloud says it). The words \"multiverse\", \"cartoon\", \"storyverse\" and the cat. \"He can draft a billion of these. He can't pick one\" (the flash does it). \"So it really matters. And so did you\" and \"we really feel like we've messed this u
