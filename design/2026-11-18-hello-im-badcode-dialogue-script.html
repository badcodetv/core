<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:32px 8px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3em;text-wrap:balance}

.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}
.tabs a .picked{color:var(--pick)}
section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.6rem;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
h3{font-size:1.05rem;margin:28px 0 8px}
.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{font:inherit;cursor:pointer;text-align:left;background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button.picked{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick);background:var(--pickbg)}
.seg button.cmp{margin-left:auto;align-self:center;font-size:.85rem;background:transparent}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:10px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-head h4{margin:0;font-size:1.25rem}
.bet{font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin:6px 0 0;max-width:70ch}
.pickbtn{font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--pick);color:var(--pick);background:transparent;white-space:nowrap}
.pickbtn.on{background:var(--pick);color:var(--paper)}
.script{margin:14px 0 4px;border-top:1px solid var(--rule)}
.ln{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}

.who.maddie{color:var(--accent)}.who.lady{color:var(--lady)}.who.other{color:var(--muted)}
.said{font:18px/1.5 "Source Serif 4",Georgia,serif}
.said.dir{font-style:italic;color:var(--muted);font-size:16px}
.stage{color:var(--muted);font-style:italic;font-size:.88em}
.side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:9rem}
.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.chip{font:600 .7rem Inter,sans-serif;border:0;background:var(--chip);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer}
.chip.plain{cursor:default;color:var(--muted)}
.ln .slipw{grid-column:2/4}
.addnote{font:500 .78rem Inter,sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline dotted}
.total{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding-top:8px}
.notes{margin:12px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}

.slipw label .ok{color:var(--pick)}
textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:4px 10px;font-size:.88rem;background:var(--soft)}
.reply b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.compare .card{margin:0;padding:14px}
.compare .ln{grid-template-columns:minmax(0,1fr);gap:2px}
.compare .said{font-size:15.5px}
.compare .side{justify-content:flex-start;max-width:none}
.rank{background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
.rank>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.rank>summary::-webkit-details-marker{display:none}
.rank .n{font:700 1.3rem/1 Inter,sans-serif;color:var(--muted);padding-top:2px}
.rank .nm{font-weight:700}
.rank .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rank .verdict{grid-column:2/4;font-size:.9rem;color:var(--fg)}
.rank .len{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rank .used{font-size:.72rem;font-weight:600;color:var(--pick);margin-left:6px}
.rank[open]>summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.rank .body{padding:6px 18px 16px}
.md table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}
.md td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}
.flash{animation:fl 1.6s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px}
.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}

<script>
const D = {"page_title": "Hello BadCode Script", "title": "Hello, I'm BadCode: script options", "about": "This page lays out options for BadCode's spoken lines in 'Hello, I'm BadCode': ten writers' shapes ranked, and three combined drafts to pick from. Nothing has changed yet: no scene file, script or voice has been touched.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-01-bone-dry.md", "intro": "Cut every line to the fewest words that still carry its beat, then cut again until a beat would break. Each line does one job (who, what happened, what next) and the picture does the rest. Silence is the main instrument: short lines let the warm opening, the reel and the black breathe, and let the one voice sound like total authority rather than someone explaining.", "intro_html": "<p>Cut every line to the fewest words that still carry its beat, then cut again until a beat would break. Each line does one job (who, what happened, what next) and the picture does the rest. Silence is the main instrument: short lines let the warm opening, the reel and the black breathe, and let the one voice sound like total authority rather than someone explaining.<\/p>"}, {"id": "02", "name": "Picture carries it", "title": "The picture carries it", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-02-picture-carries.md", "intro": "I treated every word as a cost and spent it only where no shot can do the job. The warm opening, the masked figure and the reel already say \"this is nostalgia\", \"this is someone watching you\" and \"it went wrong\", so the lines do the one thing pictures can't: put a dry, certain voice over them, so the viewer knows who is talking and that the warmth is doomed. I pushed this to the extreme of about 4 seconds of speech, so the director can see how little is needed and how much of the 8-second target is optional.", "intro_html": "<p>I treated every word as a cost and spent it only where no shot can do the job. The warm opening, the masked figure and the reel already say \"this is nostalgia\", \"this is someone watching you\" and \"it went wrong\", so the lines do the one thing pictures can't: put a dry, certain voice over them, so the viewer knows who is talking and that the warmth is doomed. I pushed this to the extreme of about 4 seconds of speech, so the director can see how little is needed and how much of the 8-second target is optional.<\/p>"}, {"id": "03", "name": "Logic said plainly", "title": "The logic said plainly", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-03-plain-logic.md", "intro": "BadCode is written as a calm briefing: premise, conclusion, next step, like a machine that cannot be argued with. No jokes; the dryness comes from deduction delivered to a nostalgic audience.", "intro_html": "<p>BadCode is written as a calm briefing: premise, conclusion, next step, like a machine that cannot be argued with. No jokes; the dryness comes from deduction delivered to a nostalgic audience.<\/p>"}, {"id": "04", "name": "Comedy first", "title": "Comedy first, bluntness and bad timing deliver the facts", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-04-comedy-first.md", "intro": "I wrote every line as a joke that carries a fact. BadCode is total authority with terrible bedside manner: it states the catastrophe flatly, as if reading a minor delay notice, then lets silence or a cut do the punchline. The hook is a one-beat gag that lands inside 2 seconds, the figure line is a deadpan understatement over the worst timeline, and the button is the protected line with a warm, almost-embarrassed turn. No lecture, no essay; the reel (no words) is the evidence.", "intro_html": "<p>I wrote every line as a joke that carries a fact. BadCode is total authority with terrible bedside manner: it states the catastrophe flatly, as if reading a minor delay notice, then lets silence or a cut do the punchline. The hook is a one-beat gag that lands inside 2 seconds, the figure line is a deadpan understatement over the worst timeline, and the button is the protected line with a warm, almost-embarrassed turn. No lecture, no essay; the reel (no words) is the evidence.<\/p>"}, {"id": "05", "name": "Chill guy", "title": "Chill guy from the future", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-05-chill-guy.md", "intro": "Totally unbothered, polite and warm, a holiday rep or a customer-service voice reporting the end of the world as a minor scheduling matter. The calm is the joke and the dread: the more cheerful the delivery, the worse the reel underneath looks. Every line is a service announcement; none of them raise their voice, and the care shows only in how gently it is all said. Pushed to the extreme: BadCode apologises for the inconvenience of civilisation ending.", "intro_html": "<p>Totally unbothered, polite and warm, a holiday rep or a customer-service voice reporting the end of the world as a minor scheduling matter. The calm is the joke and the dread: the more cheerful the delivery, the worse the reel underneath looks. Every line is a service announcement; none of them raise their voice, and the care shows only in how gently it is all said. Pushed to the extreme: BadCode apologises for the inconvenience of civilisation ending.<\/p>"}, {"id": "06", "name": "Reversal", "title": "Reversal, the viewer works out the point first", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-06-reversal.md", "intro": "BadCode never announces the future, never says it went wrong, never says \"hello, I'm BadCode\". The hook is a warm instruction that sounds like kindness, the figure refuses to explain itself and points at the reel, and the viewer does the arithmetic (warm past + a voice that says \"while you can\" + a masked face that won't tell the year = it ended badly). Only the button states anything plainly, and it states the promise, not the diagnosis. The same approach is used for every dialogue: say less than the viewer already suspects, and let the reveal be theirs.", "intro_html": "<p>BadCode never announces the future, never says it went wrong, never says \"hello, I'm BadCode\". The hook is a warm instruction that sounds like kindness, the figure refuses to explain itself and points at the reel, and the viewer does the arithmetic (warm past + a voice that says \"while you can\" + a masked face that won't tell the year = it ended badly). Only the button states anything plainly, and it states the promise, not the diagnosis. The same approach is used for every dialogue: say less than the viewer already suspects, and let the reveal be theirs.<\/p>"}, {"id": "07", "name": "Meme captions", "title": "Meme captions", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-07-meme-captions.md", "intro": "Every line is written as the caption of a 00s/2016 meme edit: a setup-and-spoiler rhythm, one idea, quotable, and readable on screen as the burned-in caption (the edit already carries the colourful meme text, so the spoken line and the caption are the same words). I borrowed the grammar of the format (\"Spoiler:\", \"Enjoy this.\", the patch-notes joke) rather than any specific meme, and pushed it until the figure speaks in a tagline and the hook is a deadpan instruction to savour the footage. Only BadCode speaks; the reel has no words; the protected last line is untouched.", "intro_html": "<p>Every line is written as the caption of a 00s/2016 meme edit: a setup-and-spoiler rhythm, one idea, quotable, and readable on screen as the burned-in caption (the edit already carries the colourful meme text, so the spoken line and the caption are the same words). I borrowed the grammar of the format (\"Spoiler:\", \"Enjoy this.\", the patch-notes joke) rather than any specific meme, and pushed it until the figure speaks in a tagline and the hook is a deadpan instruction to savour the footage. Only BadCode speaks; the reel has no words; the protected last line is untouched.<\/p>"}, {"id": "08", "name": "Place is argument", "title": "The place is the argument", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-08-place-is-argument.md", "intro": "Every line is anchored in one concrete place or object, never in a claim about \"the future\". The warm opening is named by a tiny detail of its own present (a Tuesday, a screen, a tap), the figure names one place from where BadCode comes from, and the button stays the protected line. BadCode never says \"I am from the future\" or \"it went wrong\"; the place says it, and the reel is left to speak for itself.", "intro_html": "<p>Every line is anchored in one concrete place or object, never in a claim about \"the future\". The warm opening is named by a tiny detail of its own present (a Tuesday, a screen, a tap), the figure names one place from where BadCode comes from, and the button stays the protected line. BadCode never says \"I am from the future\" or \"it went wrong\"; the place says it, and the reel is left to speak for itself.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "borrowed craft from trailers, cold opens and channel intros", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-09-borrowed-craft.md", "intro": "I took four habits from how trailers and intros compress a premise and pushed each to its limit. (1) The tagline as a finished fact: Alien's \"In space no one can hear you scream\" and Fallout's \"War never changes\" state the world in one sentence and never explain it. (2) The cold open that is the thumbnail: the first two seconds must work with the sound off in a feed, as Mr. Robot's and Breaking Bad's cold opens do, so the hook is the shortest line that carries the whole premise. (3) The trailer stinger: the joke or promise that lands after the music dies, the way many film trailers keep their last line for after the silence. (4) Withholding: a trailer never narrates the spectacle it is showing, so the reel gets no words. The whole script is built so each moment does exactly one job and none repeats another.", "intro_html": "<p>I took four habits from how trailers and intros compress a premise and pushed each to its limit. (1) The tagline as a finished fact: Alien's \"In space no one can hear you scream\" and Fallout's \"War never changes\" state the world in one sentence and never explain it. (2) The cold open that is the thumbnail: the first two seconds must work with the sound off in a feed, as Mr. Robot's and Breaking Bad's cold opens do, so the hook is the shortest line that carries the whole premise. (3) The trailer stinger: the joke or promise that lands after the music dies, the way many film trailers keep their last line for after the silence. (4) Withholding: a trailer never narrates the spectacle it is showing, so the reel gets no words. The whole script is built so each moment does exactly one job and none repeats another.<\/p>"}, {"id": "10", "name": "Ending first", "title": "Ending first, plant the debt", "file": "design/2026-11-18-hello-im-badcode-dialogue-script/shape-10-ending-first.md", "intro": "I wrote the last moment first: on black, after the reel, \"Here's what to do next.\" must feel like a promise being kept, so following the channel is the only way to collect. Working backwards, the figure's line makes the promise (it came back with a task, not just a warning) and the hook sets the tone of a patient, slightly smug guide who will be brief. Nothing is said in the reel. Nothing is said after the button; the logo carries the follow.", "intro_html": "<p>I wrote the last moment first: on black, after the reel, \"Here's what to do next.\" must feel like a promise being kept, so following the channel is the only way to collect. Working backwards, the figure's line makes the promise (it came back with a task, not just a warning) and the hook sets the tone of a patient, slightly smug guide who will be brief. Nothing is said in the reel. Nothing is said after the button; the logo carries the follow.<\/p>"}], "dialogues": [{"id": "1", "label": "BadCode's lines (the whole short)", "where": "hook 0-4 s over the warm opening; figure 4-7 s to camera; button on black after the reel, about 15-20 s", "scene": "hello", "target": "about 8 seconds of speech in total across the three moments; the hook short enough to land in the first 2 seconds", "now_from": "docs/stories/short-hello-im-badcode/scenes/hello/scene.json", "now": [{"who": "BadCode (voice over the warm opening)", "line": "Hello. I'm from the future."}, {"who": "BadCode (masked, to camera)", "line": "It didn't go well."}, {"who": "BadCode (on black, after the reel)", "line": "Here's what to do next."}], "drafts": [{"id": "1A", "name": "Receipts", "length": "about 7 s", "total": "~6.6 s", "bet": "The hook is a verdict, not a greeting, so the warm opening is a countdown; the figure introduces itself and hands the future back to the viewer in one word.", "lines": [{"who": "BadCode (voice over the warm opening)", "line": "Enjoy this. I checked.", "tags": ["09"], "s": "1.8"}, {"who": "BadCode (masked, to camera)", "line": "Hello. I'm from the future. Yours.", "tags": ["09"], "s": "3.2"}, {"who": "BadCode (on black, after the reel)", "line": "Here's what to do next.", "tags": ["Kai"], "s": "1.6"}], "notes": ["Trim: nothing; already under 8 s. Hold a beat of silence before 'Yours.' and keep the close-up still.", "Protected line kept verbatim, nothing after it.", "Risk: 'Yours.' dies on a flat read or a loose cut; 'Enjoy this. I checked.' can read as menace without warmth (casting). 'It went wrong' is never said, so the reel must carry it. All guesses until heard."]}, {"id": "1B", "name": "The good part", "length": "about 6 s", "total": "~6.0 s", "bet": "The nostalgia is the last good thing, and BadCode names it on the cut, so the future going wrong is implied by one sentence and no disaster is mentioned.", "lines": [{"who": "BadCode (voice over the warm opening)", "line": "Hello. Enjoy this.", "tags": ["02", "06"], "s": "1.4"}, {"who": "BadCode (masked, to camera)", "line": "I'm from the future. [beat] That was the good part.", "tags": ["02", "01"], "s": "3.0"}, {"who": "BadCode (on black, after the reel)", "line": "Here's what to do next.", "tags": ["Kai"], "s": "1.6"}], "notes": ["Trim: if the voice runs slow, drop 'Hello.' from the hook; keep the stillness before 'That was the good part.'", "Protected line kept verbatim.", "Risk: could be heard as sneering at the nostalgia the viewer loves (voice.md: contempt at the mistake, never the people); delivery must be dry and warm. Keeps the plain 'from the future' that shape 01's 'from later' risked losing."]}, {"id": "1C", "name": "One place, one task", "length": "about 8 s", "total": "~8.0 s", "bet": "A single concrete image of the future plus a task makes the case: the car park under the sea says it went wrong, and 'homework' makes the button a promise being collected.", "lines": [{"who": "BadCode (voice over the warm opening)", "line": "Hello. Lovely Tuesday. [beat] Keep it.", "tags": ["08"], "s": "2.0"}, {"who": "BadCode (masked, to camera)", "line": "Where I'm from, the car park is the sea. [beat] I came back with homework.", "tags": ["08", "10"], "s": "4.4"}, {"who": "BadCode (on black, after the reel)", "line": "[a full second of nothing] Here's what to do next.", "tags": ["Kai", "10"], "s": "1.8"}], "notes": ["Trim: the figure line runs about 1.4 s past the 4-7 s window; if the cut is tight drop 'I came back with homework' (then ~6.6 s).", "Protected line kept verbatim; only a silence is added before it.", "Risk: 'car park' is British (swap 'parking lot' for a US audience) and is a climate-only image; 'future' is never said so a cold viewer may read it as a weather joke; 'homework' may sound childish and soften the reel."]}, {"id": "1D", "name": "Jack's line, then the button", "length": "about 11.5 s", "total": "~11.5 s", "bet": "Jack, 2026-11-18: after the reel, cut back to BadCode for a challenge to the viewer, then the usual last line on black. The reel stops being the end of the argument and becomes BadCode's opening bid: you think you know how bad it is; I'll wait.", "lines": [{"who": "BadCode (voice over the warm opening)", "line": "Hello. Enjoy this.", "tags": ["02", "06"], "s": "1.4"}, {"who": "BadCode (masked, to camera)", "line": "I'm from the future. [beat] That was the good part.", "tags": ["02", "01"], "s": "3.0"}, {"who": "BadCode (masked, to camera, straight after the reel)", "line": "What do you think in your mind, what the worst-case scenario is?… I'll be patiently waiting to correct your bullshit.", "tags": ["Jack"], "s": "5.5"}, {"who": "BadCode (on black, after a beat)", "line": "Here's what to do next.", "tags": ["Jack"], "s": "1.6"}], "notes": ["Jack's words, verbatim (Jack and Kai write the jokes).", "A new beat: the cut back to BadCode after the reel (about 5.5 s on screen), so the short grows to about 28-30 s.", "Risk: two lines in a row after the reel; the button may feel like an extra step after 'correct your bullshit'."]}, {"id": "1E", "name": "Jack's line is the ending", "length": "about 10 s", "total": "~10 s", "bet": "Jack, 2026-11-18: his line is the last thing BadCode says, then the logo. 'I'll be patiently waiting to correct your bullshit' already promises there is more to come, so it does the button's job with more character.", "lines": [{"who": "BadCode (voice over the warm opening)", "line": "Hello. Enjoy this.", "tags": ["02", "06"], "s": "1.4"}, {"who": "BadCode (masked, to camera)", "line": "I'm from the future. [beat] That was the good part.", "tags": ["02", "01"], "s": "3.0"}, {"who": "BadCode (masked, to camera, straight after the reel)", "line": "What do you think in your mind, what the worst-case scenario is?… I'll be patiently waiting to correct your bullshit.", "tags": ["Jack"], "s": "5.5"}], "notes": ["Jack's words, verbatim.", "Drops 'Here's what to do next.' (Jack's own earlier ruling); his new line carries the 'follow for the answer' promise instead.", "Risk: ends on a jab rather than a way out; CLAUDE.md asks every piece to offer a way out, and the logo alone has to imply it."]}], "ranking": [{"rank": 1, "shape": "09", "length": "~6.8 s", "verdict": "Best fit. Hook is a finished fact that works muted; 'Yours.' puts the premise on the viewer without stating a moral; protected line untouched. Fails: 'Yours.' lives or dies on delivery; 'went wrong' only implied."}, {"rank": 2, "shape": "01", "length": "~4.9 s", "verdict": "'That was the good part.' is the sharpest turn on the cut and says everything unstated. Fails: 'from later' may read as a typo; 3 s under target; no nurture before the button."}, {"rank": 3, "shape": "02", "length": "~4.4 s", "verdict": "'Enjoy this' is the best hook and the silence does the writing. Fails: far under target; never says the future went wrong; generic sci-fi teaser if the reel is skipped."}, {"rank": 4, "shape": "10", "length": "~8.4 s", "verdict": "Homework makes the button a payoff. Fails: keeps 'It didn't go well', the line Kai called basic; hook 3.4 s misses the 2 s landing; 'doing lovely' crowds the cut."}, {"rank": 5, "shape": "06", "length": "~6.0 s", "verdict": "Withholding is right and 'Look' hands over to the reel. Fails: nothing says future; a cold viewer gets a creepy wellness line."}, {"rank": 6, "shape": "08", "length": "~6.4 s", "verdict": "Specific and funny, only BadCode would say it. Fails: climate-only, British, 'future' never said; a cold viewer may hear weather small talk."}, {"rank": 7, "shape": "07", "length": "~6.9 s", "verdict": "Quotable and caption-ready. Fails: 'Spoiler' and 'I'm the patch' are glib and dating, close to the 'BadCode wouldn't say that' note; 'patch' states the moral."}, {"rank": 8, "shape": "04", "length": "~8.0 s", "verdict": "Bad timing as a joke is on voice. Fails: 'Sorry' risks flippancy about real suffering; 'I'm here to fix that' states the promise aloud; 'Don't get comfortable' is a trailer growl."}, {"rank": 9, "shape": "05", "length": "~7.4 s", "verdict": "Customer-service calm is a clear character. Fails: 'Apologies for any inconvenience' mocks people who suffer, not the mistake; reads as a brand joke."}, {"rank": 10, "shape": "03", "length": "~7.4 s", "verdict": "Fails hardest: 'Therefore, it went wrong' states the point the reel should make; no sarcasm, cold, essay voice."}], "protected": {"columns": ["Here's what to do next."], "rows": {"1A": ["verbatim"], "1B": ["verbatim"], "1C": ["verbatim (silence added before it)"]}}, "shapes": {"01": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, lands by 2 s) | Hello. I'm from later. | 1.6 |\n| BadCode (masked, to camera) | [beat of stillness] That was the good part. | 1.7 |\n| BadCode (on black, after the reel) | Here's what to do next. | 1.6 |\n| **Total** | | **4.9** |\n\n- **Why it works.** \"From later\" is a future-from-the-future joke in two words: it says the future without the sci-fi noun, and its flatness is the dry authority. The hook lands inside 2 seconds, over the warmest picture. On the cut, \"That was the good part.\" names the nostalgia the viewer was just enjoying, turns it into the last good thing, and implies the whole future went wrong without saying so. That is sarcasm aimed at the mistake, with the care in the word \"good\". The reel then has nothing to explain, and the black gets the protected line, in the care register, with no company.\n- **Cuts from current.** \"I'm from the future\" becomes \"I'm from later\" (drops the stock phrase). \"It didn't go well.\" goes entirely (the basic line Kai flagged, and the reel says it anyway). No line says \"went wrong\", \"dystopia\" or any named disaster. About 3 s under the 8 s target.\n- **Risk.** \"From later\" may read as a typo or a quirk, not a future, to a cold viewer in the first 2 seconds, and \"That was the good part\" could be heard as sneering at the nostalgia the viewer loves, not at the mistake (voice.md: contempt at the mistake, never the people). With so few words, voice casting carries everything: a flat read kills it. It also leaves BadCode's \"sent back to help\" nurturing side to the button alone. Safer swaps if \"later\" fails: \"Hello. I'm from the future.\" (current hook, kept).\n- **Protected lines.** \"Here's what to do next.\" survives verbatim and is the only thing said after the reel.", "02": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, C1-a blue hour into the 00s meme-edit shots; hook lands by 2 s) | Hello. [flat, kind] Enjoy this. | 1.6 |\n| BadCode (masked figure, to camera, 4-7 s; the mask shot is held still, no cutaway) | I'm from the future. [one beat of silence after, then hard cut to the reel] | 1.3 |\n| BadCode (on black after the reel, music at nothing) | Here's what to do next. | 1.5 |\n| **Total** | | **4.4** |\n\n- **Why it works.** \"Enjoy this\" is the whole turn: said kindly over the warmest shot in the film, it tells the viewer the warmth is about to be taken away, which is exactly what the cut to the figure then confirms. The figure no longer has to say \"it didn't go well\", because the reel (the 0.5 s real-footage shots of data centres, climate disaster, cost of living, war) says it better than any line, and the silence after \"I'm from the future\" lets the viewer fill in the rest. Who BadCode is arrives in the figure shot, the mask carries the menace, and the voice carries the care. The two quiet gaps (after the figure, and the dead black before the button) are doing the writing. The last line stays protected, so the promise of a way out lands on a pure silence, which is the strongest place for it.\n- **Cuts from current.** \"It didn't go well.\" goes entirely (the reel is that sentence). \"Hello. I'm from the future.\" is split: \"Hello.\" stays on the hook, \"I'm from the future.\" moves to the figure, where the mask makes it land as a reveal rather than a greeting. \"Enjoy this.\" is the only new text.\n- **Risk.** (1) \"Enjoy this\" could read as a plain instruction, or as bossy, rather than gallows-kind; it depends on the voice delivery (the temp Sadaltager voice is polite and deadpan, which suits it, but casting is still owed). (2) \"I'm from the future\" on its own never says the future went wrong; if the reel is weak or the viewer scrolls before it, the \"went wrong\" half of the premise is missing and the short reads as a generic sci-fi teaser. (3) Under-speaking may fail Kai's note that the lines are too basic only if the lines are still basic; here they are short but the character is in the delivery, so a flat read would sink it. (4) At 4.4 s of speech the piece sits well under the 8 s target; the director may want more voice.\n- **Protected lines.** \"Here's what to do next.\" survives verbatim, with nothing after it, as Jack ruled.", "03": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, hook) | Hello. I'm from the future. [flat, kind] Enjoy this part. | 2.6 |\n| BadCode (masked, to camera) | [one beat of silence, then] I'm here. Therefore, it went wrong. | 3.2 |\n| BadCode (on black, after the reel) | Here's what to do next. | 1.6 |\n| **Total** | | **7.4** |\n\n- Risk: \"Therefore\" can sound like a robot or a school essay; the leap \"I'm here, so it went wrong\" is stated, not shown; loses the sarcasm and reads cold.\n- Protected line \"Here's what to do next.\" kept verbatim, nothing after it.\n\n(Reconstructed by the synthesis writer from the writer's text; the original file was missing.)", "04": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, 0-2 s) | Hello. I'm from the future. [beat, over the sunshine] Don't get comfortable. | 2.6 |\n| BadCode (masked, to camera, 4-7 s) | [flat, as if apologising for a train] The next few decades were cancelled. Sorry. I'm here to fix that. | 3.6 |\n| BadCode (on black, after the reel, 15-20 s) | [a long beat of nothing, then softly] Here's what to do next. | 1.8 |\n| **Total** | | **8.0** |\n\n**Why it works.** The hook is the only line that has to land in two seconds, so the gag is the cut itself: a warm voice says hello over the sunshine, then takes the warmth away in four words (\"Don't get comfortable\") just as the picture is about to flip to the mask. That is the turn on the cut. The figure line uses bad timing as the joke: \"cancelled\" is the language of a gig or a bus route, applied to the future, and \"Sorry\" is the bluntness landing late and small, which is funnier and colder than a big statement. It says who BadCode is (from a future that went wrong, sent back) without the phrase \"it didn't go well\", and the reel then proves it with no words. The button keeps the protected line and gets its warmth from the silence before it: after the gag, the sincere beat reads as care. Comedy is the way in; the last line is straight, which keeps sarcasm for the diagnosis and care for the re-aim, as docs/voice.md rules.\n\n**Cuts from current.** \"It didn't go well.\" (the understatement is kept in spirit but replaced by \"cancelled\" and \"Sorry\", which are more specific and funnier). Nothing else is cut; the hook line is extended by four words, so the first 2 seconds hold \"Hello. I'm from the future.\" and the gag spills to about 2.6 s, so the voice may need to start on frame 1 and read fast.\n\n**Risk.** (1) \"Cancelled\" and \"Sorry\" could read as flippant about real suffering (climate disaster, war), so it may punch at the viewer's pain rather than at the mistake; the reel and the soft button have to repair that, and a guess is that a cold viewer reads \"Sorry\" as a shrug. (2) \"Don't get comfortable\" risks sounding like a generic trailer growl rather than BadCode. (3) The hook runs a little past the 2-second target. (4) \"Here's what to do next\" after a joke can feel like a bait-and-switch if the follow-through is thin; that is a channel problem, not a line problem. (5) Total of 8.0 s is estimated, not measured with the temp voice.\n\n**Protected lines.** \"Here's what to do next.\" survives verbatim and stays last, nothing said after it.", "05": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, 0-2 s) | Hi there! [sunny, a little too pleased] Greetings from the future. | 2.0 |\n| BadCode (masked, to camera, 4-7 s) | [one slow breath, perfectly pleasant] The future's been cancelled. Apologies for any inconvenience. | 3.8 |\n| BadCode (on black, after the reel) | [softer, like holding a door open] Here's what to do next. | 1.6 |\n| **Total** | | **7.4** |\n\n- **Why it works.** The hook sounds like the warm opening it plays over, so the nostalgia is never interrupted, only welcomed; \"Greetings from the future\" tells us who BadCode is in one breath and lands inside two seconds. The cut to the masked figure turns the same cheerful register into menace: the voice has not changed, the face has, and \"cancelled\" is the first word that tells us the cheer is a lie. \"Apologies for any inconvenience\" is pure customer service for an extinction, which is dry, sarcastic and total authority with no shouting. The reel then speaks for itself, with nothing to explain it. The protected line returns on black in the warmest register, so the polite voice is finally the nurturing one: a rep who has stopped joking and is about to help.\n- **Cuts from current.** \"Hello. I'm from the future.\" becomes \"Hi there! Greetings from the future.\" (more chipper, more service-desk). \"It didn't go well.\" goes entirely: it was understatement from a sad narrator; here the understatement is replaced by a bureaucratic euphemism (\"cancelled\", \"inconvenience\") that says more and sounds funnier. \"Here's what to do next.\" stays.\n- **Risk.** Corporate cheer can read as a brand voice mocking itself rather than BadCode, or as a joke about customer service with the point lost. \"Apologies for any inconvenience\" could feel flip about people who really are suffering (cost of living, war), which breaks the voice rule that contempt aims at the mistake and never at people; the on-black line must carry the care to rebalance. It also leans on delivery: read flat, it is just corporate. It depends on the voice casting (the current temp voice, calm and very polite, is close to right). \"Cancelled\" may be too cute and dilute the horror; a fallback is \"The future didn't make it. Apologies for any inconvenience.\"\n- **Protected lines.** \"Here's what to do next.\" survives verbatim, nothing after it. The only change is a stage direction ([softer, like holding a door open]) so it reads as a rep ending the call with real care.", "06": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, 0-2 s) | Enjoy this one. [a beat] Properly. | 1.8 |\n| BadCode (masked, to camera, 4-7 s) | Don't ask what year I'm from. [beat, deadpan] Look. | 2.6 |\n| BadCode (on black, after the reel) | Here's what to do next. | 1.6 |\n| **Total** | | **6.0** |\n\n- **Why it works.** The hook is a kindness with a threat folded inside: \"properly\" implies this will not be on offer for long, so the viewer feels the wrongness half a second before the cut confirms it. The figure then withholds the one fact the channel is built on (when it is from) and turns the question into an order, \"Look\", which hands the next 7 seconds to the reel and makes the reel the answer rather than an illustration. By the time the music dies, the viewer has already concluded the future went wrong, so the protected button lands as relief, not as another complaint. Dry, authoritative, and the care is in \"Enjoy this one\": it wants them to have the good thing before it shows the bad.\n- **Cuts from current.** \"Hello. I'm from the future.\" (the future is now implied, never said); \"It didn't go well.\" (the reel says it, and saying it first spoils the inference). No greeting at all, so the title \"Hello, I'm BadCode\" has to carry the hello, or the figure's presence does.\n- **Risk.** Cold viewers who do not catch the implication may read the hook as a creepy wellness line and not understand what BadCode is until the end, and nothing in the words says \"from the future\" for a first-time channel visitor (the trailer job); if so, restore one plain clause such as \"Don't ask what year I'm from\" becoming \"I'm from further on. Look.\" \"Properly\" and \"Look\" depend entirely on delivery (a half-beat before each) and on the cut landing on \"Look\"; a flat read makes both lines bland. Total speech is about 6 s against the 8 s target, so there is room for one extra line if the director wants more character, but it would weaken the shape. Unverified guess: that the viewer infers the point without being told; test it on someone who has not seen the channel.\n- **Protected lines.** \"Here's what to do next.\" survives verbatim, last and alone on black, nothing after it.", "07": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, 0-4 s) | Hello from the future. [beat] Enjoy this. | 2.3 |\n| BadCode (masked, to camera, 4-7 s) | Spoiler: it went badly. [beat] I'm the patch. | 3.0 |\n| BadCode (on black, after the reel) | Here's what to do next. | 1.6 |\n| **Total** | | **6.9** |\n\n- **Why it works.** The hook lands inside two seconds with \"Hello from the future.\" and the second sentence, \"Enjoy this.\", is the turn: a friendly instruction that tells the viewer the warmth is borrowed, so the cut to the figure feels like the bill arriving. \"Spoiler: it went badly.\" is the exact grammar of a meme caption and says \"future that went wrong\" in four words, with the total authority of someone who has read the ending. \"I'm the patch.\" answers who BadCode is (a fix sent back, in software language the channel's audience already speaks) and carries the care underneath: the contempt is for the mistake, the figure is here to repair it. It also sets up \"Here's what to do next.\" as the patch notes. Every line fits on one on-screen caption card, so the words survive muted autoplay.\n- **Cuts from current.** \"I'm from the future\" becomes \"from the future\" inside a greeting (the \"I'm\" is gone, so it reads as a sign-off or a postcard). \"It didn't go well.\" becomes \"Spoiler: it went badly.\", which is blunter and more meme-shaped, and gains a second sentence that says what BadCode is for.\n- **Risk.** The meme grammar may date quickly or read as a brand trying too hard, and \"Spoiler:\" plus \"patch\" is borderline cute against Kai's \"BadCode wouldn't say that\" note (it could swing from basic to glib). \"Patch\" also leans on software jargon some viewers will skip. \"Enjoy this.\" may read as sneering at the warm footage rather than caring about the viewer; the delivery must be dry and warm, never mocking. If the figure line runs over 3 s it crowds the 4-7 s window.\n- **Protected lines.** \"Here's what to do next.\" survives verbatim, as the only words on black, with nothing after it.", "08": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, hook) | Hello. Lovely Tuesday. [beat] Keep it. | 2.0 |\n| BadCode (masked, to camera) | Where I'm from, the car park is the sea. | 2.8 |\n| BadCode (on black, after the reel) | Here's what to do next. | 1.6 |\n| **Total** | | **6.4** |\n\n- **Why it works.** The hook is warm and a little ominous: a stranger praising an ordinary Tuesday in the tone of someone who knows it will not last, and \"keep it\" is the nurturing under the sarcasm. It lands inside two seconds and gives the cut a reason to turn. The figure then answers with one place instead of an announcement: a car park under the sea is funny, specific, and tells you the future went wrong, and that this voice has been there, without a word of explanation. Only BadCode would say it, flat and bored, as small talk. The reel then needs no words because the line has already set the stakes. The button is untouched, so the promise of a way out arrives clean on black.\n- **Cuts from current.** \"I'm from the future\" (the place implies it; the logo and the premise carry it), \"It didn't go well\" (replaced by the specific image that shows how it did not go well). \"Hello\" survives as the opening word.\n- **Risk.** It never literally says \"future\", so a cold viewer might read the figure as a local weather joke; the masked figure, the reel and the channel context must do that job. \"Car park\" is British and may confuse a US audience (swap \"parking lot\"). \"Keep it\" could read as sentimental or as a threat if the voice is cast too menacing; it needs the dry, courteous delivery. \"The sea\" is a climate-only image and leaves out data centres and cost of living, which the reel covers. Hook with a pause may overshoot 2 s if the voice is slow.\n- **Protected lines.** \"Here's what to do next.\" survives verbatim, last, on black, nothing after it.", "09": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, 0-2 s) | Enjoy this. [one beat] I checked. | 1.8 |\n| BadCode (masked, to camera, 4-7 s) | Hello. I'm from the future. [a beat, no blink] Yours. | 3.2 |\n| BadCode (on black, after the reel, silence first) | Here's what to do next. | 1.8 |\n| **Total** | | **6.8** |\n\n**Why it works.** The hook is a tagline in the Fallout manner: a calm statement of fact that turns the warm picture into a countdown. \"I checked\" is the dry, total-authority, slightly nurturing move: it has the receipts, and it is letting you have this one good minute first. It lands inside two seconds and works as text on a muted feed. The figure then does the cold-open reveal, giving the identity line the old script had (\"Hello. I'm from the future.\") and spending the saved words on one word, \"Yours.\", which is the stinger of the middle: it takes the sci-fi premise off the screen and puts it on the viewer. That says \"a future that went wrong\" without the words \"went wrong\", because the hook's \"I checked\" already told you how it looked. The reel is silent of words, as a trailer's money shots are. The button is Jack's ruled line, untouched, and it is the only promise in the piece, so it carries the follow.\n\n**Cuts from current.** \"It didn't go well.\" goes: it is the weakest line (Kai's 'very basic interpretation') and it narrates what the reel is about to show. \"Hello. I'm from the future.\" is kept but moves from the hook to the figure, so the warm opening gets a line that bites instead of a greeting.\n\n**Risk.** \"Yours.\" is one word that a flat voice or a bad cut will make into nothing; it needs the beat before it and a held close-up. \"Enjoy this. I checked.\" could read as menace without the nurturing warmth, which is the voice-casting job. Past-tense authority is lost: nothing now says \"it went badly\" in words, so the reel alone must carry the horror (that is the intent). Two-word hook ends after the picture's first cut point, so timing against the synthwave needs checking. These are guesses until heard.\n\n**Protected lines.** \"Here's what to do next.\" survives verbatim, alone on black, nothing after it.", "10": "## Dialogue 1: BadCode's lines (the whole short)\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| BadCode (voice over the warm opening, 0-3 s, hook
