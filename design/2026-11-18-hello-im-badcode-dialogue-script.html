w words, voice casting carries everything: a flat read kills it. It also leaves BadCode's \"sent back to help\" nurturing side to the button alone. Safer swaps if \"later\" fails: \"Hello. I'm from the future.\" (current hook, kept).<\/li><li><b>Protected lines.<\/b> \"Here's what to do next.\" survives verbatim and is the only thing said after the reel.<\/li><\/ul>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">BadCode (voice over the warm opening, C1-a blue hour into the 00s meme-edit shots; hook lands by 2 s)<\/td><td class=\"line\">Hello. [flat, kind] Enjoy this.<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\">BadCode (masked figure, to camera, 4-7 s; the mask shot is held still, no cutaway)<\/td><td class=\"line\">I'm from the future. [one beat of silence after, then hard cut to the reel]<\/td><td class=\"num\">1.3<\/td><\/tr>\n<tr><td class=\"who\">BadCode (on black after the reel, music at nothing)<\/td><td class=\"line\">Here's what to do next.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>4.4<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> \"Enjoy this\" is the whole turn: said kindly over the warmest shot in the film, it tells the viewer the warmth is about to be taken away, which is exactly what the cut to the figure then confirms. The figure no longer has to say \"it didn't go well\", because the reel (the 0.5 s real-footage shots of data centres, climate disaster, cost of living, war) says it better than any line, and the silence after \"I'm from the future\" lets the viewer fill in the rest. Who BadCode is arrives in the figure shot, the mask carries the menace, and the voice carries the care. The two quiet gaps (after the figure, and the dead black before the button) are doing the writing. The last line stays protected, so the promise of a way out lands on a pure silence, which is the strongest place for it.<\/li><li><b>Cuts from current.<\/b> \"It didn't go well.\" goes entirely (the reel is that sentence). \"Hello. I'm from the future.\" is split: \"Hello.\" stays on the hook, \"I'm from the future.\" moves to the figure, where the mask makes it land as a reveal rather than a greeting. \"Enjoy this.\" is the only new text.<\/li><li><b>Risk.<\/b> (1) \"Enjoy this\" could read as a plain instruction, or as bossy, rather than gallows-kind; it depends on the voice delivery (the temp Sadaltager voice is polite and deadpan, which suits it, but casting is still owed). (2) \"I'm from the future\" on its own never says the future went wrong; if the reel is weak or the viewer scrolls before it, the \"went wrong\" half of the premise is missing and the short reads as a generic sci-fi teaser. (3) Under-speaking may fail Kai's note that the lines are too basic only if the lines are still basic; here they are short but the character is in the delivery, so a flat read would sink it. (4) At 4.4 s of speech the piece sits well under the 8 s target; the director may want more voice.<\/li><li><b>Protected lines.<\/b> \"Here's what to do next.\" survives verbatim, with nothing after it, as Jack ruled.<\/li><\/ul>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">BadCode (voice over the warm opening, hook)<\/td><td class=\"line\">Hello. I'm from the future. [flat, kind] Enjoy this part.<\/td><td class=\"num\">2.6<\/td><\/tr>\n<tr><td class=\"who\">BadCode (masked, to camera)<\/td><td class=\"line\">[one beat of silence, then] I'm here. Therefore, it went wrong.<\/td><td class=\"num\">3.2<\/td><\/tr>\n<tr><td class=\"who\">BadCode (on black, after the reel)<\/td><td class=\"line\">Here's what to do next.<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>7.4<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li>Risk: \"Therefore\" can sound like a robot or a school essay; the leap \"I'm here, so it went wrong\" is stated, not shown; loses the sarcasm and reads cold.<\/li><li>Protected line \"Here's what to do next.\" kept verbatim, nothing after it.<\/li><\/ul>\n<p>(Reconstructed by the synthesis writer from the writer's text; the original file was missing.)<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">BadCode (voice over the warm opening, 0-2 s)<\/td><td class=\"line\">Hello. I'm from the future. <span class=\"stage\">[beat, over the sunshine]<\/span> Don't get comfortable.<\/td><td class=\"num\">2.6<\/td><\/tr>\n<tr><td class=\"who\">BadCode (masked, to camera, 4-7 s)<\/td><td class=\"line\">[flat, as if apologising for a train] The next few decades were cancelled. Sorry. I'm here to fix that.<\/td><td class=\"num\">3.6<\/td><\/tr>\n<tr><td class=\"who\">BadCode (on black, after the reel, 15-20 s)<\/td><td class=\"line\">[a long beat of nothing, then softly] Here's what to do next.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>8.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The hook is the only line that has to land in two seconds, so the gag is the cut itself: a warm voice says hello over the sunshine, then takes the warmth away in four words (\"Don't get comfortable\") just as the picture is about to flip to the mask. That is the turn on the cut. The figure line uses bad timing as the joke: \"cancelled\" is the language of a gig or a bus route, applied to the future, and \"Sorry\" is the bluntness landing late and small, which is funnier and colder than a big statement. It says who BadCode is (from a future that went wrong, sent back) without the phrase \"it didn't go well\", and the reel then proves it with no words. The button keeps the protected line and gets its warmth from the silence before it: after the gag, the sincere beat reads as care. Comedy is the way in; the last line is straight, which keeps sarcasm for the diagnosis and care for the re-aim, as docs/voice.md rules.<\/p>\n<p><b>Cuts from current.<\/b> \"It didn't go well.\" (the understatement is kept in spirit but replaced by \"cancelled\" and \"Sorry\", which are more specific and funnier). Nothing else is cut; the hook line is extended by four words, so the first 2 seconds hold \"Hello. I'm from the future.\" and the gag spills to about 2.6 s, so the voice may need to start on frame 1 and read fast.<\/p>\n<p><b>Risk.<\/b> (1) \"Cancelled\" and \"Sorry\" could read as flippant about real suffering (climate disaster, war), so it may punch at the viewer's pain rather than at the mistake; the reel and the soft button have to repair that, and a guess is that a cold viewer reads \"Sorry\" as a shrug. (2) \"Don't get comfortable\" risks sounding like a generic trailer growl rather than BadCode. (3) The hook runs a little past the 2-second target. (4) \"Here's what to do next\" after a joke can feel like a bait-and-switch if the follow-through is thin; that is a channel problem, not a line problem. (5) Total of 8.0 s is estimated, not measured with the temp voice.<\/p>\n<p><b>Protected lines.<\/b> \"Here's what to do next.\" survives verbatim and stays last, nothing said after it.<\/p>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">BadCode (voice over the warm opening, 0-2 s)<\/td><td class=\"line\">Hi there! [sunny, a little too pleased] Greetings from the future.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">BadCode (masked, to camera, 4-7 s)<\/td><td class=\"line\">[one slow breath, perfectly pleasant] The future's been cancelled. Apologies for any inconvenience.<\/td><td class=\"num\">3.8<\/td><\/tr>\n<tr><td class=\"who\">BadCode (on black, after the reel)<\/td><td class=\"line\">[softer, like holding a door open] Here's what to do next.<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>7.4<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The hook sounds like the warm opening it plays over, so the nostalgia is never interrupted, only welcomed; \"Greetings from the future\" tells us who BadCode is in one breath and lands inside two seconds. The cut to the masked figure turns the same cheerful register into menace: the voice has not changed, the face has, and \"cancelled\" is the first word that tells us the cheer is a lie. \"Apologies for any inconvenience\" is pure customer service for an extinction, which is dry, sarcastic and total authority with no shouting. The reel then speaks for itself, with nothing to explain it. The protected line returns on black in the warmest register, so the polite voice is finally the nurturing one: a rep who has stopped joking and is about to help.<\/li><li><b>Cuts from current.<\/b> \"Hello. I'm from the future.\" becomes \"Hi there! Greetings from the future.\" (more chipper, more service-desk). \"It didn't go well.\" goes entirely: it was understatement from a sad narrator; here the understatement is replaced by a bureaucratic euphemism (\"cancelled\", \"inconvenience\") that says more and sounds funnier. \"Here's what to do next.\" stays.<\/li><li><b>Risk.<\/b> Corporate cheer can read as a brand voice mocking itself rather than BadCode, or as a joke about customer service with the point lost. \"Apologies for any inconvenience\" could feel flip about people who really are suffering (cost of living, war), which breaks the voice rule that contempt aims at the mistake and never at people; the on-black line must carry the care to rebalance. It also leans on delivery: read flat, it is just corporate. It depends on the voice casting (the current temp voice, calm and very polite, is close to right). \"Cancelled\" may be too cute and dilute the horror; a fallback is \"The future didn't make it. Apologies for any inconvenience.\"<\/li><li><b>Protected lines.<\/b> \"Here's what to do next.\" survives verbatim, nothing after it. The only change is a stage direction ([softer, like holding a door open]) so it reads as a rep ending the call with real care.<\/li><\/ul>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">BadCode (voice over the warm opening, 0-2 s)<\/td><td class=\"line\">Enjoy this one. [a beat] Properly.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">BadCode (masked, to camera, 4-7 s)<\/td><td class=\"line\">Don't ask what year I'm from. <span class=\"stage\">[beat, deadpan]<\/span> Look.<\/td><td class=\"num\">2.6<\/td><\/tr>\n<tr><td class=\"who\">BadCode (on black, after the reel)<\/td><td class=\"line\">Here's what to do next.<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>6.0<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The hook is a kindness with a threat folded inside: \"properly\" implies this will not be on offer for long, so the viewer feels the wrongness half a second before the cut confirms it. The figure then withholds the one fact the channel is built on (when it is from) and turns the question into an order, \"Look\", which hands the next 7 seconds to the reel and makes the reel the answer rather than an illustration. By the time the music dies, the viewer has already concluded the future went wrong, so the protected button lands as relief, not as another complaint. Dry, authoritative, and the care is in \"Enjoy this one\": it wants them to have the good thing before it shows the bad.<\/li><li><b>Cuts from current.<\/b> \"Hello. I'm from the future.\" (the future is now implied, never said); \"It didn't go well.\" (the reel says it, and saying it first spoils the inference). No greeting at all, so the title \"Hello, I'm BadCode\" has to carry the hello, or the figure's presence does.<\/li><li><b>Risk.<\/b> Cold viewers who do not catch the implication may read the hook as a creepy wellness line and not understand what BadCode is until the end, and nothing in the words says \"from the future\" for a first-time channel visitor (the trailer job); if so, restore one plain clause such as \"Don't ask what year I'm from\" becoming \"I'm from further on. Look.\" \"Properly\" and \"Look\" depend entirely on delivery (a half-beat before each) and on the cut landing on \"Look\"; a flat read makes both lines bland. Total speech is about 6 s against the 8 s target, so there is room for one extra line if the director wants more character, but it would weaken the shape. Unverified guess: that the viewer infers the point without being told; test it on someone who has not seen the channel.<\/li><li><b>Protected lines.<\/b> \"Here's what to do next.\" survives verbatim, last and alone on black, nothing after it.<\/li><\/ul>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">BadCode (voice over the warm opening, 0-4 s)<\/td><td class=\"line\">Hello from the future. <span class=\"stage\">[beat]<\/span> Enjoy this.<\/td><td class=\"num\">2.3<\/td><\/tr>\n<tr><td class=\"who\">BadCode (masked, to camera, 4-7 s)<\/td><td class=\"line\">Spoiler: it went badly. <span class=\"stage\">[beat]<\/span> I'm the patch.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">BadCode (on black, after the reel)<\/td><td class=\"line\">Here's what to do next.<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>6.9<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The hook lands inside two seconds with \"Hello from the future.\" and the second sentence, \"Enjoy this.\", is the turn: a friendly instruction that tells the viewer the warmth is borrowed, so the cut to the figure feels like the bill arriving. \"Spoiler: it went badly.\" is the exact grammar of a meme caption and says \"future that went wrong\" in four words, with the total authority of someone who has read the ending. \"I'm the patch.\" answers who BadCode is (a fix sent back, in software language the channel's audience already speaks) and carries the care underneath: the contempt is for the mistake, the figure is here to repair it. It also sets up \"Here's what to do next.\" as the patch notes. Every line fits on one on-screen caption card, so the words survive muted autoplay.<\/li><li><b>Cuts from current.<\/b> \"I'm from the future\" becomes \"from the future\" inside a greeting (the \"I'm\" is gone, so it reads as a sign-off or a postcard). \"It didn't go well.\" becomes \"Spoiler: it went badly.\", which is blunter and more meme-shaped, and gains a second sentence that says what BadCode is for.<\/li><li><b>Risk.<\/b> The meme grammar may date quickly or read as a brand trying too hard, and \"Spoiler:\" plus \"patch\" is borderline cute against Kai's \"BadCode wouldn't say that\" note (it could swing from basic to glib). \"Patch\" also leans on software jargon some viewers will skip. \"Enjoy this.\" may read as sneering at the warm footage rather than caring about the viewer; the delivery must be dry and warm, never mocking. If the figure line runs over 3 s it crowds the 4-7 s window.<\/li><li><b>Protected lines.<\/b> \"Here's what to do next.\" survives verbatim, as the only words on black, with nothing after it.<\/li><\/ul>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">BadCode (voice over the warm opening, hook)<\/td><td class=\"line\">Hello. Lovely Tuesday. <span class=\"stage\">[beat]<\/span> Keep it.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\">BadCode (masked, to camera)<\/td><td class=\"line\">Where I'm from, the car park is the sea.<\/td><td class=\"num\">2.8<\/td><\/tr>\n<tr><td class=\"who\">BadCode (on black, after the reel)<\/td><td class=\"line\">Here's what to do next.<\/td><td class=\"num\">1.6<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>6.4<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The hook is warm and a little ominous: a stranger praising an ordinary Tuesday in the tone of someone who knows it will not last, and \"keep it\" is the nurturing under the sarcasm. It lands inside two seconds and gives the cut a reason to turn. The figure then answers with one place instead of an announcement: a car park under the sea is funny, specific, and tells you the future went wrong, and that this voice has been there, without a word of explanation. Only BadCode would say it, flat and bored, as small talk. The reel then needs no words because the line has already set the stakes. The button is untouched, so the promise of a way out arrives clean on black.<\/li><li><b>Cuts from current.<\/b> \"I'm from the future\" (the place implies it; the logo and the premise carry it), \"It didn't go well\" (replaced by the specific image that shows how it did not go well). \"Hello\" survives as the opening word.<\/li><li><b>Risk.<\/b> It never literally says \"future\", so a cold viewer might read the figure as a local weather joke; the masked figure, the reel and the channel context must do that job. \"Car park\" is British and may confuse a US audience (swap \"parking lot\"). \"Keep it\" could read as sentimental or as a threat if the voice is cast too menacing; it needs the dry, courteous delivery. \"The sea\" is a climate-only image and leaves out data centres and cost of living, which the reel covers. Hook with a pause may overshoot 2 s if the voice is slow.<\/li><li><b>Protected lines.<\/b> \"Here's what to do next.\" survives verbatim, last, on black, nothing after it.<\/li><\/ul>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">BadCode (voice over the warm opening, 0-2 s)<\/td><td class=\"line\">Enjoy this. [one beat] I checked.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\">BadCode (masked, to camera, 4-7 s)<\/td><td class=\"line\">Hello. I'm from the future. [a beat, no blink] Yours.<\/td><td class=\"num\">3.2<\/td><\/tr>\n<tr><td class=\"who\">BadCode (on black, after the reel, silence first)<\/td><td class=\"line\">Here's what to do next.<\/td><td class=\"num\">1.8<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>6.8<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The hook is a tagline in the Fallout manner: a calm statement of fact that turns the warm picture into a countdown. \"I checked\" is the dry, total-authority, slightly nurturing move: it has the receipts, and it is letting you have this one good minute first. It lands inside two seconds and works as text on a muted feed. The figure then does the cold-open reveal, giving the identity line the old script had (\"Hello. I'm from the future.\") and spending the saved words on one word, \"Yours.\", which is the stinger of the middle: it takes the sci-fi premise off the screen and puts it on the viewer. That says \"a future that went wrong\" without the words \"went wrong\", because the hook's \"I checked\" already told you how it looked. The reel is silent of words, as a trailer's money shots are. The button is Jack's ruled line, untouched, and it is the only promise in the piece, so it carries the follow.<\/p>\n<p><b>Cuts from current.<\/b> \"It didn't go well.\" goes: it is the weakest line (Kai's 'very basic interpretation') and it narrates what the reel is about to show. \"Hello. I'm from the future.\" is kept but moves from the hook to the figure, so the warm opening gets a line that bites instead of a greeting.<\/p>\n<p><b>Risk.<\/b> \"Yours.\" is one word that a flat voice or a bad cut will make into nothing; it needs the beat before it and a held close-up. \"Enjoy this. I checked.\" could read as menace without the nurturing warmth, which is the voice-casting job. Past-tense authority is lost: nothing now says \"it went badly\" in words, so the reel alone must carry the horror (that is the intent). Two-word hook ends after the picture's first cut point, so timing against the synthwave needs checking. These are guesses until heard.<\/p>\n<p><b>Protected lines.<\/b> \"Here's what to do next.\" survives verbatim, alone on black, nothing after it.<\/p>", "10": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">BadCode (voice over the warm opening, 0-3 s, hook lands by 2 s)<\/td><td class=\"line\">Hello. I'm from the future. [warm, unhurried, a half-smile in the voice] You're doing lovely.<\/td><td class=\"num\">3.4<\/td><\/tr>\n<tr><td class=\"who\">BadCode (masked, to camera, 4-7 s)<\/td><td class=\"line\">It didn't go well. [one beat, no blink] I came back with homework.<\/td><td class=\"num\">3.0<\/td><\/tr>\n<tr><td class=\"who\">BadCode (on black, after the reel and the slowed music, about 17 s)<\/td><td class=\"line\">[a full second of nothing] Here's what to do next.<\/td><td class=\"num\">2.0<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>8.4<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The ending is \"homework\": the figure says it came back with a task, so \"Here's what to do next.\" on black is the assignment arriving, and the logo that follows is the only place to collect it. \"You're doing lovely\" is the nurturing-underneath, sarcastic-on-top voice over the 00s warmth, and it is a lie the cut then exposes, so the turn from nostalgia to the figure carries a double meaning without a word of explanation. \"It didn't go well\" keeps its deadpan; \"homework\" is only BadCode's word, dry and bossy and kind. The reel stays silent, and the full second of nothing before the last line gives the slowed music somewhere to land.<\/li><li><b>Cuts from current.<\/b> Nothing is dropped. Two additions: \"You're doing lovely.\" on the hook and \"I came back with homework.\" on the figure.<\/li><li><b>Risk.<\/b> The hook is now 3.4 s, past the 2-second target for the whole thing; \"Hello. I'm from the future.\" alone lands in about 2 s, but \"You're doing lovely\" may crowd the first cut. If so, cut it, or lay it under the first cut of the figure. \"Homework\" could read as childish or as a school joke and soften the horror, and it makes \"what to do next\" sound light, which may undersell the reel; if the director wants the promise graver, swap for \"I came back with instructions\". The ending only works if the button's second of silence survives the music slow-down. This is a guess about delivery, not tested.<\/li><li><b>Protected lines.<\/b> \"Here's what to do next.\" survives verbatim and stays last; only a stage direction (the second of silence) is added before it, and nothing is spoken after it.<\/li><\/ul>"}}], "questions": [{"id": "q1", "text": "Should the figure say 'from the future' in words (1A, 1B), or should the viewer infer it (1C, shape 06)? A cold viewer on a trailer may need the plain phrase."}, {"id": "q2", "text": "Is 'It didn't go well.' fully retired? Kai called it basic; only shape 10 kept it, and no draft here does."}, {"id": "q3", "text": "Is about 6 s of speech acceptable against the 8 s target, or do you want more voice (1C reaches 8 s)?"}, {"id": "q4", "text": "Is a spoken hook that tells people to enjoy the warm opening ('Enjoy this') right, or does it sneer at the nostalgia people love? It depends on the voice cast."}, {"id": "q5", "text": "Should the full second of silence before 'Here's what to do next.' be written in the script (1C) or left to the edit?"}], "round": 1, "plan": [{"h": "Added from your message (Jack, 2026-11-18)", "items": ["Your line after the reel, verbatim, as two new drafts: 1D keeps 'Here's what to do next.' after it; 1E ends on your line and goes straight to the logo.", "Both open with 1B's two lines (my pick of the first three); mix in any other draft's lines with a note."]}, {"h": "You decide", "items": ["1D or 1E: does 'Here's what to do next.' still earn its place after your line?", "If 1E: BadCode's rule is to offer a way out; the logo alone would carry it, or a caption in the edit could."]}], "replies": {}};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);
  });
  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {
    if (v.notes && v.notes.length) { const ul = el('ul', 'notes'); for (const n of v.notes) ul.append(el('li', '', n)); c.append(ul) }
    c.append(slip(d.id + '-' + v.id, 'Note on draft ' + v.id + ' as a whole'));
  }
  return c;
}

/* ---------- the ranked writers ---------- */
function rankList(d) {
  const wrap = el('div'), used = new Set(d.drafts.flatMap(v => v.lines.flatMap(l => l.tags || [])));
  for (const r of d.ranking) {
    const s = SHAPE[r.shape], det = el('details', 'rank'); det.id = d.id + '-s' + r.shape;
    const sum = el('summary'), nm = el('div', 'nm', 'Writer ' + r.shape + ': ' + s.title);
    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);
    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');
  band.append(el('span', 'eyebrow', 'Dialogue ' + n + ' of ' + D.dialogues.length), el('span', 'meta', d.where + ' · target ' + d.target));
  p.append(band, el('h2', '', d.label), slip(d.id, 'Note on this dialogue as a whole'));
  p.append(el('h3', '', 'Read it: now, and ' + (d.drafts.length === 3 ? 'three drafts' : d.drafts.length + ' draft' + (d.drafts.length > 1 ? 's' : ''))));
  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  if (!d.ranking.length) return p;   // a hand-written page (no writers' run)
  p.append(el('hr'));
  p.append(el('h3', '', 'Optional: the raw material the three drafts were blended from'));
  p.append(el('p', 'lede', "You only need to pick from the three drafts above. Below are the " + d.ranking.length + " writers' own versions, each pushing one approach to the extreme. 1A, 1B and 1C are built from their best lines: each line's chip (like 09) says which writer it came from. Ranked harshly, best first. Read one only if you want to steal a line, and note it on that writer's slip."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', D.dialogues.length > 1 ? 'All dialogues' : 'This dialogue'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  if (!D.shapes.length) document.querySelectorAll(".writers-hint").forEach(x => x.remove());
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
