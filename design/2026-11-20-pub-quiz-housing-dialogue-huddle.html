<title>Pub Quiz Huddle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{--bg:#f4f1eb;--paper:#fffdf9;--fg:#1d1a16;--muted:#6f665c;--rule:#e0d8cc;--accent:#b4232c;--lady:#2f5d8a;--chip:#ece5d9;--soft:#f8f4ee;--pick:#1f7a4a;--pickbg:#e5f4e9;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--paper:#1c1915;--fg:#ece6dc;--muted:#a3998c;--rule:#342e27;--accent:#e2555c;--lady:#7fb0e0;--chip:#2a251f;--soft:#211d18;--pick:#5fd08f;--pickbg:#173322;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.55 "Inter",system-ui,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{padding-block:32px 8px}
h1{font-size:1.9rem;line-height:1.2;margin:0 0 .3em;text-wrap:balance}
.about{color:var(--muted);max-width:70ch;margin:0 0 1em}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:0 0 18px;padding:0;list-style:none;counter-reset:s}
.how li{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:10px 12px 10px 40px;position:relative;font-size:.9rem;counter-increment:s}
.how li::before{content:counter(s);position:absolute;left:12px;top:9px;width:20px;height:20px;border-radius:50%;background:var(--fg);color:var(--bg);font:700 12px/20px Inter,sans-serif;text-align:center}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--rule);display:flex;gap:4px;overflow-x:auto;padding-block:8px 0}
.tabs a{flex:0 0 auto;text-decoration:none;color:var(--muted);padding:8px 14px 10px;border-radius:8px 8px 0 0;font-weight:600;font-size:.92rem;border:1px solid transparent;border-bottom:0}
.tabs a small{display:block;font-weight:500;font-size:.75rem}
.tabs a.on{color:var(--fg);background:var(--paper);border-color:var(--rule);margin-bottom:-1px}
.tabs a .picked{color:var(--pick)}
section.panel{padding-block:20px 60px}
.band{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px;margin-bottom:6px}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
h2{font-size:1.6rem;margin:0;line-height:1.2}
.meta{color:var(--muted);font-size:.9rem}
h3{font-size:1.05rem;margin:28px 0 8px}
.lede{color:var(--muted);font-size:.9rem;margin:0 0 10px;max-width:70ch}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 0}
.seg button{font:inherit;cursor:pointer;text-align:left;background:var(--paper);color:var(--fg);border:1px solid var(--rule);border-radius:8px;padding:8px 12px;min-width:0}
.seg button b{display:block;font-size:.95rem}
.seg button span{font-size:.78rem;color:var(--muted)}
.seg button.on{border-color:var(--fg);box-shadow:inset 0 0 0 1px var(--fg)}
.seg button.picked{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick);background:var(--pickbg)}
.seg button.cmp{margin-left:auto;align-self:center;font-size:.85rem;background:transparent}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:18px 20px;margin-top:10px}
.card-head{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-start;justify-content:space-between}
.card-head h4{margin:0;font-size:1.25rem}
.bet{font-family:"Source Serif 4",Georgia,serif;font-style:italic;margin:6px 0 0;max-width:70ch}
.pickbtn{font:600 .9rem Inter,sans-serif;cursor:pointer;border-radius:999px;padding:8px 16px;border:1px solid var(--pick);color:var(--pick);background:transparent;white-space:nowrap}
.pickbtn.on{background:var(--pick);color:var(--paper)}
.script{margin:14px 0 4px;border-top:1px solid var(--rule)}
.ln{display:grid;grid-template-columns:5.5rem minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--rule);align-items:start}
.who{font-weight:700;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;padding-top:3px}
.who.maddie{color:var(--accent)}.who.lady{color:var(--lady)}.who.other{color:var(--muted)}
.said{font:18px/1.5 "Source Serif 4",Georgia,serif}
.said.dir{font-style:italic;color:var(--muted);font-size:16px}
.stage{color:var(--muted);font-style:italic;font-size:.88em}
.side{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap;max-width:9rem}
.secs{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.chip{font:600 .7rem Inter,sans-serif;border:0;background:var(--chip);color:var(--fg);border-radius:4px;padding:2px 6px;cursor:pointer}
.chip.plain{cursor:default;color:var(--muted)}
.ln .slipw{grid-column:2/4}
.addnote{font:500 .78rem Inter,sans-serif;background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 0;text-decoration:underline dotted}
.total{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);padding-top:8px}
.notes{margin:12px 0 0;padding-left:18px;font-size:.9rem;color:var(--muted)}
.slipw{margin-top:8px}
.slipw label{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--muted);margin-bottom:3px}
.slipw label .ok{color:var(--pick)}
textarea{width:100%;font:15px/1.45 Inter,sans-serif;color:var(--fg);background:var(--soft);border:1px solid var(--rule);border-radius:6px;padding:7px 9px;resize:vertical}
textarea:focus{outline:2px solid var(--fg);outline-offset:-1px}
.reply{margin-top:6px;border-left:3px solid var(--accent);padding:4px 10px;font-size:.88rem;background:var(--soft)}
.reply b{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.compare{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(280px,1fr);gap:10px;overflow-x:auto;margin-top:10px;padding-bottom:6px}
.compare .card{margin:0;padding:14px}
.compare .ln{grid-template-columns:minmax(0,1fr);gap:2px}
.compare .said{font-size:15.5px}
.compare .side{justify-content:flex-start;max-width:none}
.rank{background:var(--paper);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
.rank>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:2.4rem minmax(0,1fr) auto;gap:4px 12px;padding:12px 14px;align-items:start}
.rank>summary::-webkit-details-marker{display:none}
.rank .n{font:700 1.3rem/1 Inter,sans-serif;color:var(--muted);padding-top:2px}
.rank .nm{font-weight:700}
.rank .nm small{font-weight:500;color:var(--muted);margin-left:6px}
.rank .verdict{grid-column:2/4;font-size:.9rem;color:var(--fg)}
.rank .len{font-size:.82rem;color:var(--muted);white-space:nowrap}
.rank .used{font-size:.72rem;font-weight:600;color:var(--pick);margin-left:6px}
.rank[open]>summary{border-bottom:1px solid var(--rule);background:var(--soft)}
.rank .body{padding:6px 18px 16px}
.md table{border-collapse:collapse;width:100%;font-size:.9rem;margin:10px 0}
.md th{text-align:left;font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-bottom:1px solid var(--rule);padding:5px 8px}
.md td{border-top:1px solid var(--rule);padding:6px 8px;vertical-align:top}
.md .tbl{overflow-x:auto}
.md h2{font-size:1.05rem;margin:14px 0 6px}.md h3,.md h4{font-size:.95rem;margin:12px 0 4px;color:var(--accent)}
.md p,.md li{max-width:72ch;font-size:.94rem}
.md hr{border:0;border-top:1px solid var(--rule)}
.approach{margin:10px 0;border:1px dashed var(--rule);border-radius:8px;padding:0 12px}
.approach summary{cursor:pointer;font-size:.85rem;font-weight:600;padding:8px 0}
.flash{animation:fl 1.6s}
@keyframes fl{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.q{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-top:10px}
.q p{margin:0;font-family:"Source Serif 4",Georgia,serif;font-size:1.05rem}
.roundplan{background:var(--paper);border:1px solid var(--accent);border-radius:10px;padding:12px 16px;margin:0 0 16px}
.muted{color:var(--muted)}
@media (max-width:560px){.ln{grid-template-columns:minmax(0,1fr)}.ln .slipw{grid-column:1}.side{justify-content:flex-start;max-width:none}.seg button.cmp{margin-left:0}}
</style>

<script>
const D = {"page_title": "Pub Quiz Huddle", "title": "Pub Quiz: Housing, the huddle", "about": "This page offers three combined drafts of the huddle (beat 2) built from ten writers' shapes, with every shape ranked and open questions at the end. Nothing has changed yet: no scene file, script or voice has been touched.", "shapes": [{"id": "01", "name": "Bone-dry minimum", "title": "Bone-dry minimum", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-01-bone-dry.md", "intro": "Every line is cut to the fewest whispered words that still carry its beat: one fact, one reason from the speaker's own life or work, no connective talk. The silence, the leaning-in and the clock do the rest of the work, and the joke slots are left in the gaps where the cut words used to be. No jokes are written anywhere.", "intro_html": "<p>Every line is cut to the fewest whispered words that still carry its beat: one fact, one reason from the speaker's own life or work, no connective talk. The silence, the leaning-in and the clock do the rest of the work, and the joke slots are left in the gaps where the cut words used to be. No jokes are written anywhere.<\/p>"}, {"id": "02", "name": "Picture carries it", "title": "The picture carries it", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-02-picture-carries.md", "intro": "Every line the image can say is cut. The answer sheet, the pen, the countdown clock and the next table's leaning heads do the climbing, the doubting and the pressure; the speech is left with one short reason each from the plasterer, banker and Bob, whispered. Shots relied on: the answer sheet in close-up (the number crossed out and rewritten), the clock face or screen countdown, the eavesdroppers' heads tilting in, Bob's pen. No jokes written; slots only.", "intro_html": "<p>Every line the image can say is cut. The answer sheet, the pen, the countdown clock and the next table's leaning heads do the climbing, the doubting and the pressure; the speech is left with one short reason each from the plasterer, banker and Bob, whispered. Shots relied on: the answer sheet in close-up (the number crossed out and rewritten), the clock face or screen countdown, the eavesdroppers' heads tilting in, Bob's pen. No jokes written; slots only.<\/p>"}, {"id": "03", "name": "Plain step-by-step logic", "title": "The logic said plainly, one step at a time", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-03-plain-logic.md", "intro": "Each line is one step of a sum the table does out loud in whispers: a guess, a doubt, a number multiplied, a correction. Every speaker's own work or life supplies one step. Every figure that is not the answer is flagged as a guess by the speaker, so nobody states a statistic as fact. The clock cuts in between steps. Jokes are slots only.", "intro_html": "<p>Each line is one step of a sum the table does out loud in whispers: a guess, a doubt, a number multiplied, a correction. Every speaker's own work or life supplies one step. Every figure that is not the answer is flagged as a guess by the speaker, so nobody states a statistic as fact. The clock cuts in between steps. Jokes are slots only.<\/p>"}, {"id": "04", "name": "Clock drives it", "title": "The clock drives every line", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-04-the-clock.md", "intro": "Every line is built around the countdown: the quizmaster calls the time at fixed points and each call cuts someone off mid-sentence, so no one finishes a thought and the argument is half-sentences, overlaps and a number being forced out. The reasons (the plasterer's jobs, the banker's \"renting not buying\", Bob's room) are each squeezed into a clause. Nobody explains; they are trying to win. No jokes are written; every laugh is a [JOKE SLOT].", "intro_html": "<p>Every line is built around the countdown: the quizmaster calls the time at fixed points and each call cuts someone off mid-sentence, so no one finishes a thought and the argument is half-sentences, overlaps and a number being forced out. The reasons (the plasterer's jobs, the banker's \"renting not buying\", Bob's room) are each squeezed into a clause. Nobody explains; they are trying to win. No jokes are written; every laugh is a [JOKE SLOT].<\/p>"}, {"id": "05", "name": "Doubter sets terms", "title": "The other side wins: the doubter sets the terms", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-05-other-side-wins.md", "intro": "The student, the one who doubts, takes charge of the huddle and sets terms nobody can wriggle out of: one reason each, in plain words, or he writes a hundred million and they lose. Each expert has to give something up to win him round (the plasterer admits he has only seen three jobs, the banker drops the jargon and the certainty, Bob gives up his silence). The student is never a fool: he is the viewer, and he is the judge. No jokes written; every laugh is a [JOKE SLOT].", "intro_html": "<p>The student, the one who doubts, takes charge of the huddle and sets terms nobody can wriggle out of: one reason each, in plain words, or he writes a hundred million and they lose. Each expert has to give something up to win him round (the plasterer admits he has only seen three jobs, the banker drops the jargon and the certainty, Bob gives up his silence). The student is never a fool: he is the viewer, and he is the judge. No jokes written; every laugh is a [JOKE SLOT].<\/p>"}, {"id": "06", "name": "Student gets there first", "title": "Reversal, the student gets there first", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-06-reversal.md", "intro": "The student, who guesses lowest, does the sum out loud from the plasterer's job before the banker can finish his sentence, and the plasterer (who has seen the rooms) is the one who doubts it. The banker confirms rather than explains, and Bob settles it quietly with his own nine months and writes the number. Every guess is flagged as a guess; no one states a statistic. Joke slots are left open, no jokes written.", "intro_html": "<p>The student, who guesses lowest, does the sum out loud from the plasterer's job before the banker can finish his sentence, and the plasterer (who has seen the rooms) is the one who doubts it. The banker confirms rather than explains, and Bob settles it quietly with his own nine months and writes the number. Every guess is flagged as a guess; no one states a statistic. Joke slots are left open, no jokes written.<\/p>"}, {"id": "07", "name": "Room voices doubts", "title": "The chorus, the room voices the doubts", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-07-chorus.md", "intro": "The main table only reasons and guesses; every doubt, objection and \"that can't be right\" is voiced by the eavesdropping next table (and one hissed exchange across the gap), so the viewer's disbelief lives in the room and the four at the table never have to stop and defend themselves. The clock cuts in from the quizmaster. No jokes are written; slots are marked.", "intro_html": "<p>The main table only reasons and guesses; every doubt, objection and \"that can't be right\" is voiced by the eavesdropping next table (and one hissed exchange across the gap), so the viewer's disbelief lives in the room and the four at the table never have to stop and defend themselves. The clock cuts in from the quizmaster. No jokes are written; slots are marked.<\/p>"}, {"id": "08", "name": "Pub is the argument", "title": "The pub itself is the argument", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-08-place-is-argument.md", "intro": "The quiz is held in a pub with rooms upstairs: a chalkboard \"ROOMS, PER NIGHT\" behind the quizmaster and a VACANCIES sign in the window. The table never needs to explain the maths because the room does it: they count doors, nights and neighbouring signs, and the guess climbs as they look around. Each person's reason is tied to something in sight. No statistic is stated; every number is a guess or a sum done out loud. Jokes are slots only.", "intro_html": "<p>The quiz is held in a pub with rooms upstairs: a chalkboard \"ROOMS, PER NIGHT\" behind the quizmaster and a VACANCIES sign in the window. The table never needs to explain the maths because the room does it: they count doors, nights and neighbouring signs, and the guess climbs as they look around. Each person's reason is tied to something in sight. No statistic is stated; every number is a guess or a sum done out loud. Jokes are slots only.<\/p>"}, {"id": "09", "name": "Borrowed craft", "title": "Borrowed craft, the overheard room", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-09-borrowed-craft.md", "intro": "Approach: I stole three structural tricks from films and TV that fit argument into overheard talk. From 12 Angry Men (the argument advances by one person doubting one small thing, and a quiet voice lands the decisive point), from Armando Iannucci's The Thick of It and In the Loop (people talk over each other, and information arrives in fragments you assemble yourself), and from Aaron Sorkin's walk-and-talk (a ticking pressure makes everyone speak in clipped, finishing-each-other's-points rhythm). I applied them with no speeches: every line is cut off, answered or overridden, the clock and the eavesdropping table do the interrupting, and the numbers climb by objection, never by explanation. No jokes; slots only.", "intro_html": "<p>Approach: I stole three structural tricks from films and TV that fit argument into overheard talk. From 12 Angry Men (the argument advances by one person doubting one small thing, and a quiet voice lands the decisive point), from Armando Iannucci's The Thick of It and In the Loop (people talk over each other, and information arrives in fragments you assemble yourself), and from Aaron Sorkin's walk-and-talk (a ticking pressure makes everyone speak in clipped, finishing-each-other's-points rhythm). I applied them with no speeches: every line is cut off, answered or overridden, the clock and the eavesdropping table do the interrupting, and the numbers climb by objection, never by explanation. No jokes; slots only.<\/p>"}, {"id": "10", "name": "Ending written first", "title": "Ending first, written backwards", "file": "design/2026-11-20-pub-quiz-housing-dialogue-huddle/shape-10-ending-first.md", "intro": "I wrote the last seconds first: Bob's pen on the sheet, the banker seeing the number and saying nothing, then \"Pens down\". Everything before it exists only to make that quiet beat feel earned. So the guesses are laid as stepping stones that Bob's number sits just above, the clock lands twice to squeeze the table toward it, and Bob's one line is the only one that carries no sum, just a night he spent in a room. No jokes are written; every slot is marked.", "intro_html": "<p>I wrote the last seconds first: Bob's pen on the sheet, the banker seeing the number and saying nothing, then \"Pens down\". Everything before it exists only to make that quiet beat feel earned. So the guesses are laid as stepping stones that Bob's number sits just above, the clock lands twice to squeeze the table toward it, and Bob's one line is the only one that carries no sum, just a night he spent in a room. No jokes are written; every slot is marked.<\/p>"}], "dialogues": [{"id": "1", "label": "The huddle", "where": "Beat 2, 6-36 s, after the question and before 'Pens down'", "scene": "Pub Quiz: Housing, beat 2 (the huddle)", "target": "about 30 seconds of whispered lines (the clock can interrupt)", "now_from": "docs/stories/short-pub-quiz-housing/script.md (draft 1)", "now": [{"who": "Student", "line": "A hundred million? That's loads."}, {"who": "Plasterer", "line": "More. I've done three of them B&B jobs for the council this year. They're paying for every room, every night."}, {"who": "Banker", "line": "Nightly's the dearest way to buy anything. You're renting it, not buying it. It's billions, not millions. [JOKE SLOT: what the banker lets slip about himself]"}, {"who": "Student", "line": "Billions? On rooms? That's not possible."}, {"who": "Next table", "line": "[leans in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]"}, {"who": "Bob", "line": "[takes the pen, doesn't argue, writes a number] [JOKE SLOT: Bob's line, if any]"}, {"who": "Quizmaster", "line": "Pens down."}], "drafts": [{"id": "1D", "name": "Beer mat, pen and nod (1A + 1C, Jack's pick)", "length": "about 32 s", "total": "~32 s", "bet": "1C's frame (the guesses climb on the sheet, the banker hands it to Bob, a nod instead of a line) with 1A's beer-mat sum in the middle, so the viewer catches the scale before the answer.", "lines": [{"who": "Student", "line": "[writes the number on the sheet, pen in close-up] A hundred million? That's loads.", "tags": ["1C", "all"], "s": "2.5"}, {"who": "Plasterer", "line": "[crosses it out] More. I've done three of them B&B jobs for the council this year. Every room, every night.", "tags": ["1A", "1C"], "s": "4.5"}, {"who": "Student", "line": "[on a beer mat] Every night… Say fifty quid a night. Times three-sixty-five. Times, I don't know, a hundred thousand rooms? [JOKE SLOT: the student doing sums on a beer mat]", "tags": ["1A"], "s": "6"}, {"who": "Student", "line": "[stares at the beer mat] That's billions. That can't be right.", "tags": ["1A", "1C"], "s": "2"}, {"who": "Next table", "line": "[leans in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]", "tags": ["all"], "s": "3"}, {"who": "Quizmaster", "line": "[off] Twenty seconds.", "tags": ["1C"], "s": "1.5"}, {"who": "Banker", "line": "[calm, not looking up] Nightly's the dearest way to buy anything. It's billions. [JOKE SLOT: what the banker lets slip about himself]", "tags": ["1A", "1C", "all"], "s": "4"}, {"who": "Banker", "line": "[low] Bob.", "tags": ["1C"], "s": "1"}, {"who": "Bob", "line": "[takes the pen, no hurry] I was in one. They paid by the night. [JOKE SLOT: Bob's line, if any]", "tags": ["1A", "1C"], "s": "3"}, {"who": "Bob", "line": "[writes a number; turns the sheet so only the table sees]", "tags": ["1C"], "s": "2"}, {"who": "Banker", "line": "[reads it; a small nod]", "tags": ["1C"], "s": "1.5"}, {"who": "Quizmaster", "line": "Pens down.", "tags": ["all"], "s": "1"}], "notes": ["Fixed from 1A: the plasterer no longer argues both sides. He pushes the guess up and stays there; the doubt is the student's, at his own sum.", "The sum's three numbers are the student's guesses ('say', 'I don't know'); fifty × 365 × 100,000 ≈ £1.8 billion, short of the real £2.9 billion, so Bob still has to be nearer.", "Bob's 'I was in one. They paid by the night.' is invented (open question 2): Jack to confirm against Bob's canon, or Bob says nothing and only writes.", "Every joke slot is still blank for Jack and Kai.", "To trim to ~28 s: drop 'Twenty seconds.' and the banker's 'Bob.'"]}, {"id": "1A", "name": "The sum on a beer mat", "length": "about 32 s", "total": "~32 s", "bet": "Betting that the viewer enjoys catching the doubt and the sum themselves: the student works it out, the plasterer who has seen the rooms resists, and Bob arrives last with the one thing no sum has.", "lines": [{"who": "Student", "line": "A hundred million? That's loads.", "tags": ["all"], "s": "2"}, {"who": "Plasterer", "line": "More. I've done three of them B&B jobs for the council this year. Every room, every night.", "tags": ["06", "01", "02", "09"], "s": "4"}, {"who": "Banker", "line": "[low] Nightly's the dearest way to--", "tags": ["06", "04"], "s": "2"}, {"who": "Student", "line": "[cutting in] --every night. So it's rooms times nights. Say fifty quid a night. Times three-sixty-five. Times, I don't know, a hundred thousand rooms? [JOKE SLOT: the student doing sums on a beer mat] That's billions.", "tags": ["06", "03"], "s": "7"}, {"who": "Plasterer", "line": "Billions? On rooms? Come off it. I've seen the rooms.", "tags": ["06"], "s": "3"}, {"who": "Banker", "line": "[a beat] Nightly's the dearest way to buy anything. He's not wrong. [JOKE SLOT: what the banker lets slip about himself]", "tags": ["all", "06"], "s": "4"}, {"who": "Quizmaster", "line": "[off] Ten seconds.", "tags": ["04", "09", "10"], "s": "1.5"}, {"who": "Next table", "line": "[leans in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]", "tags": ["all"], "s": "3"}, {"who": "Bob", "line": "[quiet, to the sheet] I was in one. They paid by the night. [JOKE SLOT: Bob's line, if any]", "tags": ["02", "06", "10"], "s": "3"}, {"who": "Bob", "line": "[takes the pen, crosses out the hundred million, writes a number; the others watch the pen, not him]", "tags": ["02", "06"], "s": "2.5"}, {"who": "Quizmaster", "line": "Pens down.", "tags": ["all", "Kai"], "s": "1"}], "notes": ["Trims: cut the plasterer's 'I've seen the rooms' and the clock line to land about 28 s.", "Protected lines kept: none exist in draft 1; 'Pens down.' kept word for word.", "Fixed from shape 06: its sum (a few thousand rooms) did not reach a billion, so the maths here is fifty a night, times 365, times a hundred thousand rooms, which comes to about 1.8 billion. All three figures are the student's guesses, marked as guesses by 'say' and 'I don't know'.", "Risk: the sum lands close to the real answer, so it can sound too neat; the beer-mat slot is there to roughen it. The banker must stay warm and not look slow.", "Risk: Bob's 'I was in one' is new and invented (draft 1 gave him silence); flat delivery, pen beat straight after, or it tips into pity."]}, {"id": "1B", "name": "The clock cuts everyone off", "length": "about 30 s", "total": "~29.5 s", "bet": "Betting that pressure carries the argument: nobody finishes a sentence, the quizmaster's calls land as hard stops, and the viewer assembles the point from fragments.", "lines": [{"who": "Quizmaster", "line": "[off, over the room] Thirty seconds. Go.", "tags": ["04", "09"], "s": "1.5"}, {"who": "Student", "line": "[fast] Fifty million. Put fifty.", "tags": ["04"], "s": "2"}, {"who": "Plasterer", "line": "Fifty? I've done three B&B jobs for the council this year, they pay for every room, every ni--", "tags": ["04", "09"], "s": "4"}, {"who": "Student", "line": "[over him] Then a hundred. A hundred million.", "tags": ["04", "09"], "s": "1.5"}, {"who": "Quizmaster", "line": "[off] Twenty.", "tags": ["04", "09"], "s": "1"}, {"who": "Banker", "line": "[low, calm] Nightly's the dearest way to buy anything. So it's not millions. [JOKE SLOT: what the banker lets slip about himself]", "tags": ["04", "all"], "s": "4"}, {"who": "Student", "line": "Billions? On rooms? It can't be, that's--", "tags": ["04", "all"], "s": "2.5"}, {"who": "Plasterer", "line": "[barely audible, eyes on the clock] Two? Three?", "tags": ["01", "09"], "s": "1.5"}, {"who": "Banker", "line": "[mouthing] Three. Nearer three.", "tags": ["09"], "s": "1"}, {"who": "Next table", "line": "[leans in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]", "tags": ["all"], "s": "3"}, {"who": "Quizmaster", "line": "[off] Ten.", "tags": ["04", "09"], "s": "1"}, {"who": "Bob", "line": "[quiet, not looking up; the others stop] I was in one. They moved you every few nights. [JOKE SLOT: Bob's line, if any]", "tags": ["09", "02"], "s": "3.5"}, {"who": "Bob", "line": "[takes the pen, writes a number, turns the sheet face down]", "tags": ["09", "02"], "s": "3"}, {"who": "Quizmaster", "line": "Pens down.", "tags": ["all", "Kai"], "s": "1"}], "notes": ["Trims: drop the 'Ten.' call and the banker's mouthed line to reach about 27 s.", "Protected lines kept: none; 'Pens down.' unchanged.", "Cut from the shapes: 'you never own a brick of it' (09) and 'I didn't even get to the north' (09, an invented claim), both near the moral or a statistic. Also shape 04's 'three rooms and the kids' stuff in a bag', which pushes toward pity.", "Risk: cut-off lines and overlapping whispers are hard to voice in AI Studio and need pause tags so they do not read as errors; the mouthed 'Three. Nearer three.' only works in picture.", "Risk: three countdown calls can feel like a gimmick; reduce to two if so. Bob's 'moved every few nights' is invented experience for Jack to confirm."]}, {"id": "1C", "name": "The pen and the nod", "length": "about 33 s", "total": "~33 s", "bet": "Betting on the quiet ending: the guesses climb on the answer sheet, the banker concedes with a nod instead of a line, and the short's payoff is Bob being right without anyone saying why.", "lines": [{"who": "Student", "line": "[writes the number on the sheet, pen in close-up] A hundred million? That's loads.", "tags": ["02", "all"], "s": "2.5"}, {"who": "Plasterer", "line": "[crosses it out] More. Three B&B jobs for the council this year. Every room, every night.", "tags": ["02", "01", "10"], "s": "5"}, {"who": "Student", "line": "Five hundred million, then. [JOKE SLOT: the student's guess at scale]", "tags": ["10"], "s": "2.5"}, {"who": "Next table", "line": "[leans in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]", "tags": ["all"], "s": "3"}, {"who": "Quizmaster", "line": "[off] Twenty seconds.", "tags": ["10", "04"], "s": "1.5"}, {"who": "Banker", "line": "[calm, not looking up] Nightly's the dearest way to buy anything. It's billions. [JOKE SLOT: what the banker lets slip about himself]", "tags": ["01", "02", "10", "all"], "s": "4.5"}, {"who": "Student", "line": "[pen stops] Billions? On rooms? That's not possible.", "tags": ["all", "02"], "s": "2.5"}, {"who": "Plasterer", "line": "Billions? That's a lot of rooms.", "tags": ["06"], "s": "2"}, {"who": "Banker", "line": "[low] Bob.", "tags": ["10"], "s": "1"}, {"who": "Bob", "line": "[takes the pen, no hurry] I was in one. Nightly, they said. [JOKE SLOT: Bob's line, if any]", "tags": ["10", "02"], "s": "3.5"}, {"who": "Bob", "line": "[writes a number; turns the sheet so only the table sees]", "tags": ["10", "02"], "s": "2"}, {"who": "Banker", "line": "[reads it; a small nod]", "tags": ["10"], "s": "1.5"}, {"who": "Quizmaster", "line": "Pens down.", "tags": ["all", "Kai"], "s": "1"}], "notes": ["Trims: cut the student's 'Five hundred million' and the plasterer's 'That's a lot of rooms' to land about 28 s.", "Protected lines kept: none; 'Pens down.' unchanged.", "Cut from shape 10: the plasterer's 'Three jobs, one council. Do the sum.' (near a quip, and the table would be doing the sum for us) and Bob's 'Every night.' (a half-sentence of moral). Bob's written number is left unspecified; shape 10 had 'three billion'.", "Risk: needs the answer sheet legible in shot (shape 02); if not, the climb vanishes. The pen and nod are silent, so the beat could read as dead air in a short this tight.", "Risk: the banker's 'It's billions' is a guess voiced as sure; it must not sound like a statistic stated as fact."]}], "ranking": [{"rank": 1, "shape": "06", "length": "~31 s", "verdict": "Best on real resistance: the man who has seen the rooms doubts the student's sum, and the doubt is earned. Point lands unstated, voices differ, Bob arrives last and writes. Fails on arithmetic (a few thousand rooms does not make a billion, so it must be repaired) and the banker risks looking slow beside the student."}, {"rank": 2, "shape": "10", "length": "~36 s (30 with overlaps)", "verdict": "Strongest structure: guesses climb in three steps so Bob's number feels inevitable, and the banker's nod concedes without a speech. Over length before overlaps; the plasterer's 'Do the sum' is a near-quip; the sum is not actually done by anyone, so the doubt is thin."}, {"rank": 3, "shape": "02", "length": "~30 s", "verdict": "On length and says the climb in pictures, not words. Weak on resistance (the student's stalled pen is the whole argument) and wholly dependent on a legible sheet and a five-second silent clock beat."}, {"rank": 4, "shape": "04", "length": "~37 s", "verdict": "Best pressure: the cut-offs make the reasons land unfinished. Runs long, hard to voice, and the 'Add it up' and 'Four's too much' lines edge toward the banker asserting a figure."}, {"rank": 5, "shape": "09", "length": "~44 s", "verdict": "Good fragmenting and a strong 'three jobs is three jobs' doubt, but far too long, 'you never own a brick of it' is a moral aloud, and 'didn't get to the north' is an invented claim."}, {"rank": 6, "shape": "01", "length": "~25 s", "verdict": "Under length and clean, but too thin: 'Four rooms in a year' is unclear and the jump to billions has no support. Little real argument; the slots would have to carry the colour."}, {"rank": 7, "shape": "07", "length": "~32.5 s", "verdict": "Nice idea that the room voices our doubt, but the table's own argument is stolen by the bystanders, and it needs two extra voices. Most of the original lines survive unchanged, so it is the least rewritten."}, {"rank": 8, "shape": "08", "length": "~34.5 s", "verdict": "Puts evidence in the set, which is attractive, but 'count the doors' is an aphorism for Bob, the pub needs rooms upstairs, and a VACANCIES sign blurs 'B&Bs and nightly lets'. Little real resistance."}, {"rank": 9, "shape": "05", "length": "~38 s", "verdict": "The student's terms ('one reason each, no jargon') make him the teacher, the banker goes vague, and Bob's 'not once did they get a flat out of it' states the moral aloud. Breaks the never-preachy rule."}, {"rank": 10, "shape": "03", "length": "~44 s", "verdict": "A worked sum said step by step is the lecture the brief rules out. Twice the length of the target, and the specific guesses (eighty quid, a hundred thousand households) could be taken as claims."}], "shapes": {"01": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Student | A hundred million? | 1.5 |\n| Plasterer | More. Three B&B jobs this year. Council pays per room, per night. | 4.5 |\n| Student | Billions? On rooms? No. | 2 |\n| Banker | Nightly's the dearest way to hold anything. It's billions. [JOKE SLOT: what the banker lets slip about himself] | 4 |\n| Next table | [lean in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers] | 4 |\n| Plasterer | [barely audible, glancing at the clock] Two? Three? | 2 |\n| Bob | [takes the pen, writes] Four rooms in a year. [JOKE SLOT: Bob's line, if any] | 4 |\n| Student | [reading the number upside down] That's... | 1.5 |\n| Quizmaster | Pens down. | 1.5 |\n| **Total** | | **25** |\n\n**Why it works.** About 35 spoken words, so the argument is carried by pace and silence rather than talk. The guesses climb in three steps (a hundred million, \"billions\", \"two? three?\"), the student's \"No\" is the slight argument, and the plasterer, banker and Bob each give one reason from their own life: the jobs, how nightly renting prices, and the rooms Bob moved through. Bob says almost nothing and writes the closest number, so he is the one who knows, never pitied and never explaining. Nobody states the moral. The estimate runs about 5 s under target, and the joke slots and the clock's pauses are expected to take it to about 30.\n\n**Cuts from current.** \"That's loads\", \"I've done three of them... for the council\", \"You're renting it, not buying it\" (the renting point is folded into \"dearest way to hold anything\"), \"That's not possible\", and the banker's and student's second sentences. The student's second doubt is cut to one word. Bob's two-bar silence becomes one short line of personal experience.\n\n**Risk.** Too lean: the plasterer's \"per room, per night\" and the banker's \"billions\" are the only support for the jump to billions, so a viewer could miss why. Bob's \"Four rooms in a year\" is a personal-experience claim and needs Jack's sign-off that it fits Bob's background, and the line may read as a pitch for sympathy if it is delivered heavily. \"Hold\" is slightly stiff for a pub. The slots now carry most of the colour, so if none gets filled the beat is thin. No number is stated as a fact beyond guesses.\n\n**Protected lines.** None. The only line kept close to draft 1 is \"Pens down.\"", "02": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Student | [writes \"£100m\" on the sheet, close-up of the pen] A hundred million? | 2.5 |\n| Plasterer | [crosses it out, hard] More. Three B&B jobs for the council this year. Every room, every night. | 5 |\n| Student | [whisper, hopeful, writes over it] Hundreds of millions, then. | 2.5 |\n| Banker | [calm, doesn't look up] Nightly's the dearest way to buy anything. It's billions. [JOKE SLOT: what the banker lets slip about himself] | 4.5 |\n| Student | [stops writing, the sheet in shot] Billions? On rooms? | 2 |\n| (clock) | [CLOCK: 0:09 on screen; next table's heads lean in; the table goes dead silent; a long beat until they lean back] [JOKE SLOT: the eavesdroppers] | 5 |\n| Bob | [quiet, to the sheet, not to anyone] I was in one. They paid by the night. [JOKE SLOT: Bob's line, if any] | 3.5 |\n| Bob | [takes the pen; close-up: crosses out, writes \"£2.9bn\" in a steady hand; the others watch the pen, not him] | 3.5 |\n| Quizmaster | [off-screen] Pens down. | 1.5 |\n| **Total** | | **30** |\n\n- **Why it works.** The climb is shown, not spoken: the sheet goes from £100m to crossed-out to hundreds of millions to billions, so the viewer reads the numbers rising before anyone says \"billions\". Each of the three gets one reason from their own life (the plasterer's jobs, the banker's trade, Bob's room) and nobody explains it to the camera. The slight argument is the student's stalled pen on \"Billions? On rooms?\". The eavesdroppers are a silent shot that stops the whole table, so the pressure is felt and not described. Bob never argues; his pen is the proof, and the others watching his hand instead of him makes him the one who knows without anyone pitying him.\n- **Cuts from current.** The student's \"That's loads\" and \"That's not possible\" (the sheet and the stalled pen say it). The plasterer's \"They're paying for...\" explanation shortened to the three-jobs fact. The banker's \"You're renting it, not buying it\" (the line \"dearest way to buy\" already carries it). Any spoken line for the eavesdroppers. Bob's silence is partly broken: he gets one personal line, because the brief needs a reason from his own life.\n- **Risk.** If the sheet is not legible in shot, the climb vanishes and the student's lines go thin. The five-second silent clock beat could read as dead air in a 45-55 s short; 30 s of whispering with this many stage directions needs strong editing. Bob's \"I was in one\" sits close to a confession and could tip toward pity if delivered heavily: it must be flat and unremarkable, and the pen beat must follow at once. The banker's \"billions\" is a guess, not a claim, so it stays inside the rules.\n- **Protected lines.** None protected. \"Pens down\" survives unaltered as the last line.", "03": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Student | [whispering] A hundred million? Has to be. | 2 |\n| Plasterer | Higher. I've done three B&B jobs for the council this year. They pay for every room, every night. | 5 |\n| Banker | So don't guess the total, build it. A room, a night, a year. | 4 |\n| Plasterer | Say eighty quid a night. Guess. | 2 |\n| Banker | Eighty a night is nearly thirty thousand a year. For one room. [JOKE SLOT: what the banker lets slip about himself] | 5 |\n| Quizmaster | [from across the room] Twenty seconds. | 1 |\n| Student | Right, but that's one room. That's thousands, not billions. | 3 |\n| Banker | How many rooms, though? Say a hundred thousand households. Guess. | 3 |\n| Plasterer | [fast] Then it's billions. Thirty thousand times a hundred thousand. | 3 |\n| Student | Billions? On rooms? That's not possible. | 2 |\n| Next table | [lean in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers] | 2 |\n| Banker | Nightly's the dearest way to buy anything. You're renting it, not buying it. | 3 |\n| Bob | [quietly, not looking up] I was in one eleven months. Same room. Somebody paid for every night of it. | 4 |\n| Plasterer | So it's the nights that add up. | 2 |\n| Bob | [takes the pen, writes a number] [JOKE SLOT: Bob's line, if any] | 2 |\n| Quizmaster | Pens down. | 1 |\n| **Total** | | **44** |\n\n**Why it works.** The viewer can follow the sum themselves: a room, a night, a year, a hundred thousand households. The guesses climb because the arithmetic forces them to, and the student's doubt is the natural objection to each step. The plasterer, banker and Bob each add one step from their own life (the jobs, the price of renting versus owning, the eleven months), so nobody lectures. Bob does not do the sum. His step is what a night costs when you are the one in the room, and then he writes, which makes him the one who knew. The clock and the next table interrupt at the steps, not at the end, so the pressure is felt.\n\n**Cuts from current.** \"A hundred million? That's loads\" becomes a plain guess. \"It's billions, not millions\" is replaced by the sum that earns it. The B&B jobs line is kept but trimmed. Nothing else is lost.\n\n**Risk.** It runs about 44 s against a 30 s target, so it needs about 14 s trimmed: drop the \"Right, but that's one room\" exchange and one clock line to get to about 36. The sum is slightly maths-heavy and could sound like a lesson if delivered flat. The eighty-quid and hundred-thousand figures are guesses, but a listener could take them as facts, so they must be voiced as guesses (\"Say...\", \"Guess.\"). The sum lands near the answer by design, which risks sounding too neat. The eleven months is personal experience for Bob and must not be played for pity.\n\n**Protected lines.** None.", "04": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Quizmaster | [off, over the room] Thirty seconds. Go. | 1.5 |\n| Student | [whisper, fast] Fifty million. Fifty. Put fifty. | 2 |\n| Plasterer | Fifty? Mate, I've done three B&B jobs for the council since spring, they pay for every room, every ni-- | 3.5 |\n| Student | [over him] So a hundred. A hundred million. | 1.5 |\n| Plasterer | More. Way more. Per room, per night, it's-- | 2 |\n| Quizmaster | [off] Twenty. | 1 |\n| Banker | [low, calm, cutting in] Nightly's the dearest way to buy anything. You're renting, not buying. So it's not millions. [JOKE SLOT: what the banker lets slip about himself] | 4 |\n| Student | Billions? On rooms? It can't be, that's-- | 2 |\n| Banker | [flat] Add it up. Every room, every night. | 2 |\n| Next table | [leans in; the whole table freezes, pens still, until they lean back] [JOKE SLOT: the eavesdroppers] | 3 |\n| Student | [barely audible] Billions, then? Two? Three? | 1.5 |\n| Plasterer | Shh. Don't say it out loud. Three, maybe. Four-- | 2 |\n| Quizmaster | [off] Ten. | 1 |\n| Banker | Four's too much. Three. Say three. | 1.5 |\n| Student | Not even a million per-- no. Fine. Three. | 2 |\n| Bob | [takes the pen, no argument; one beat of quiet] Three rooms a night, we had, me and the kids' stuff in a bag. Someone paid for that. Every night. [writes a number] [JOKE SLOT: Bob's line, if any] | 4.5 |\n| Quizmaster | [off] Five. Four-- | 1 |\n| Bob | [caps the pen] | 0.5 |\n| Quizmaster | Pens down. | 1 |\n| **Total** | | **~37 (runs long; the clock calls and the Bob line are the first things to trim to hit 30)** |\n\n**Why it works.** The viewer feels the thirty seconds as pressure, not as a lecture. The guesses climb because the clock won't let anyone defend a low number: fifty million, a hundred, \"not millions\", then billions, then three. Each of the plasterer, banker and Bob gets one reason from their own life, and each is cut off at the point the reason lands, so the unfinished sentence does the work. The student's doubt is the slight argument, and the eavesdroppers are a hard stop the clock makes worse. Bob never argues; he gets the last reason, and the countdown hands him the pen.\n\n**Cuts from current.** \"Billions, not millions\" as a spoken moral is gone (replaced by \"not millions\" mid-argument). The student's separate \"That's not possible\" becomes a cut-off \"it can't be, that's--\". Bob's silent writing gets one short line of his own life, no pity. Plasterer's \"They're paying for every room, every night\" is now truncated.\n\n**Risk.** It runs long (about 37 s against 30) with all the interruptions, and overlapping whisper dialogue can be unintelligible once voiced, especially with cut-offs in AI Studio voices (cut-offs need pause tags and may sound like errors). Constant interruption could read as chaotic, not tense, and the quizmaster's countdown could feel like a gimmick if he calls too often (cut to two calls). Bob's line must stay plain and never tip into a sad story: \"Three rooms\" is a guess at his detail, mark for Jack to rewrite. Guesses of \"three\" or \"four\" are guesses, not claims, but \"Add it up\" / \"Four's too much\" edges close to the banker asserting; check against rule 3.\n\n**Protected lines.** None. Surviving from draft 1 in altered form: the student's \"a hundred million\", the plasterer's B&B jobs (cut off), the banker's \"dearest way to buy anything\" and \"renting, not buying\", the student's doubt, the eavesdroppers beat, Bob taking the pen, and \"Pens down\" (unchanged).", "05": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Student | [whisper, pen already moving] A hundred million. Go on, change my mind. One reason each, and no jargon, or that's what I'm writing. | 5 |\n| Plasterer | Three B&B jobs for the council this year, that's all I've seen. But they pay for every room, every night. | 5 |\n| Student | Three jobs. Fine, half a billion. That's me being generous. | 3 |\n| Banker | [low] Rooms by the night is the dearest way to buy anything. I can't give you the number, only which way it goes. [JOKE SLOT: what the banker lets slip about himself] | 6 |\n| Quizmaster | [off, over the speakers] Fifteen seconds. | 2 |\n| Student | Billions? On rooms? You've got to give me more than \"the dearest way\". | 4 |\n| Next table | [leans in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers] | 3 |\n| Bob | [takes the pen, quiet] I've slept in one of those rooms. Nobody asked me for rent. Someone paid, every night, and not once did they get a flat out of it. | 6 |\n| Student | [beat] ...Billions, then. Put billions. | 2 |\n| Bob | [writes a number] [JOKE SLOT: Bob's line, if any] | 1 |\n| Quizmaster | Pens down. | 1 |\n| **Total** | | **38** |\n\n**Why it works.** The doubt stops being a speed bump and becomes the engine: the student is the viewer's proxy and each person only wins him by giving something up, so the argument is visible as a negotiation, not an information dump. The guesses climb on his terms (a hundred million, half a billion, billions), each rise earned by one reason, and the clock and eavesdroppers squeeze the bargaining. Bob wins by being the one the student actually believes; he is persuasive, not pitied.\n\n**Cuts from current.** The student's \"That's loads\" and \"That's not possible\" merge into his terms and his concessions. The banker's \"It's billions, not millions\" goes (he now only gives direction). The plasterer's \"More.\" is replaced by his admission.\n\n**Risk.** Runs about 38 s, over the 30 s target; the Quizmaster's countdown line and the plasterer's first sentence are the first cuts. The student bossing the table could read as the lesson-giver if played arrogant; the terms must sound like a quiz player under pressure, not a teacher. Bob's \"Someone paid, every night\" edges toward explaining the point; if Kai finds it preachy, drop to \"Someone paid every night.\" and let the student's concession carry it. Banker conceding the number risks making him vague rather than calm and right.\n\n**Protected lines.** None protected. The current lines survive only in altered form: \"They're paying for every room, every night\" (plasterer, kept), \"dearest way to buy anything\" (banker, kept inside his concession), \"Billions? On rooms?\" (student, kept, now a demand), \"Pens down\" (kept).", "06": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Student | [whisper] A hundred million? That's loads. | 2 |\n| Plasterer | [whisper] More. I've done three of them B&B jobs for the council this year. Every room, every night. | 4 |\n| Banker | [whisper] Nightly's the dearest way to-- | 2 |\n| Student | [cutting in] --every night. So it's not rooms, it's rooms times nights. Say fifty quid a night, say a few thousand rooms, [JOKE SLOT: the student doing sums on a beer mat] that's a billion. Two billion. | 6 |\n| Plasterer | [whisper] Two billion? On rooms? Come off it, I've seen the rooms. | 3 |\n| Banker | [a beat; whispering] No, he's right. You rent it, you never own it, it just keeps coming. [JOKE SLOT: what the banker lets slip about himself] | 4 |\n| Quizmaster | [off] Ten seconds. | 1 |\n| Next table | [lean in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers] | 3 |\n| Bob | [takes the pen, quiet] I was in one nine months. They paid for it every night. [writes a number] [JOKE SLOT: Bob's line, if any] | 5 |\n| Quizmaster | [off] Pens down. | 1 |\n| **Total** | | **31** |\n\n**Why it works.** The viewer is the student: low guess, then the same doubt. Letting him reach \"billions\" by arithmetic before the banker finishes his sentence makes the argument something the viewer does with him, not something an expert tells them, and it keeps the banker calm and right without a lecture. The plasterer's doubt is the slight argument, and it is the more convincing for coming from the man who has seen the rooms. Bob arrives after the sum is done and adds the one thing no sum has: he was there. He never explains, he writes.\n\n**Cuts from current.** The banker's full explanation (\"renting it, not buying it. It's billions, not millions\") is cut to a half sentence that the student finishes, then a short confirmation. The student's \"That's not possible\" push-back moves to the plasterer. The plasterer's \"paying for every room\" line is trimmed.\n\n**Risk.** The student's \"fifty quid a night, a few thousand rooms\" are guesses, but spoken as a sum they may sound like claims; keep the \"say\" and consider a beer-mat joke slot to mark them as rough. A student out-reasoning a banker could read as the banker being slow (punching down at him) unless his reply stays warm. Bob must not look like a pupil to the student; the order of lines (Bob last, writes the number) is meant to guard that, and the director should check it. \"Nine months\" is invented personal experience, for Jack to confirm.\n\n**Protected lines.** None. \"Pens down\" survives verbatim as the final line. The student's \"A hundred million? That's loads.\" and the plasterer's \"I've done three of them B&B jobs for the council this year\" survive nearly unchanged; the banker's \"Nightly's the dearest way to buy anything\" is split between banker and student.", "07": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Student | [whisper] A hundred million? That's loads. | 3 |\n| Next table (A) | [leaning in, whispering to their own table] Hundred million. That's what I'd have put. | 3 |\n| Plasterer | [low] More. I've done three of them B&B jobs for the council this year. They're paying for every room, every night. | 5 |\n| Next table (B) | [hissed, to A] Every night? Every room? | 2.5 |\n| Banker | Nightly's the dearest way to buy anything. You're renting it, not buying it. It's billions, not millions. [JOKE SLOT: what the banker lets slip about himself] | 5 |\n| Next table | [the table goes silent; both tables freeze until the eavesdroppers lean back] [JOKE SLOT: the eavesdroppers] | 2 |\n| Student | [hissing at the next table, then back in] Oi. [to his own] Billions? On rooms? That's not possible. | 3.5 |\n| Plasterer / Banker | Plasterer: Two billion? Banker: Two. Three. [overlapping, the clock ticking over them] | 2 |\n| Bob | [quietly, the first thing he says, taking the pen] I've been in one of them rooms. [writes a number] [JOKE SLOT: Bob's line, if any] | 3.5 |\n| Quizmaster | [over the mic] Ten seconds. | 1.5 |\n| Quizmaster | Pens down. | 1 |\n| **Total** | | **32.5** |\n\n- **Why it works.** The viewer doubts the number, and the room says it out loud, so the table can stay calm and quick. The next table is a stand-in for the audience: they start where we start (a hundred million), they repeat the plasterer's detail back (so it lands twice), and they are the ones who say \"that can't be right\". The main table never lectures; the banker and plasterer just talk to each other while being overheard. Guesses climb from a hundred million to \"billions\" to \"two, three\" without anyone stating a statistic. Bob says one thing, from his own life, and writes; the room's doubt makes his silence louder.\n- **Cuts from current.** The student's second line is now aimed at the next table as well as his own, so it is a flash of irritation rather than the table's only push-back; the plasterer and banker lose their closing sentence in the join; the next table gets lines instead of a mime beat only. Bob gains one short line of experience (a guess at what Jack wants: marked as mine, to rule on) in place of pure silence.\n- **Risk.** The eavesdroppers can steal the doubt so completely that the table has no argument of its own, and the \"slight argument\" Jack asked for becomes a bystander commentary. Two voices outside the four are more casting and more voices to record. Bob's line \"I've been in one of them rooms\" could tip toward pity or lesson if delivered heavy; it must be flat and brief. \"Two. Three.\" is a guess, not a claim, but check it reads as a guess.\n- **Protected lines.** None protected. Surviving from draft 1: the student's \"A hundred million? That's loads.\", the plasterer's B&B line (unchanged), the banker's \"dearest way to buy anything\" line (unchanged), the student's \"Billions? On rooms? That's not possible.\" (now with an \"Oi\" before it), \"Pens down.\" (unchanged). Bob's line is new and is a guess to rule on.", "08": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Student | [whisper] A hundred million? That's loads. | 2 |\n| Plasterer | [nods at the ceiling] Them rooms upstairs. I did them up for the council. They pay for every one, every night. | 6 |\n| Student | That's one pub, though. | 1.5 |\n| Banker | [low] Count the doors. Doors times nights. Then do it for every town with a sign like that. [JOKE SLOT: what the banker lets slip about himself] | 6 |\n| Plasterer | [points at the window] VACANCIES. And next door. And the one past that. | 3.5 |\n| Student | Half a billion, then? | 1.5 |\n| Banker | Nightly's the dearest way to buy anything. You're renting it, not buying it. More. | 4 |\n| Student | Billions? On rooms? That's not possible. | 2 |\n| Quizmaster | [over the speaker] Ten seconds. | 1.5 |\n| Next table | [lean in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers] | 2.5 |\n| Bob | [looks at the ceiling, takes the pen] Count the doors. [JOKE SLOT: Bob's line, if any] [writes a number] | 3 |\n| Quizmaster | Pens down. | 1 |\n| **Total** | | **34.5** |\n\n**Why it works.** The set does the persuading, so nobody has to lecture: the board, the sign and the ceiling are the evidence, and the viewer can check them with their own eyes. Each reason comes from the person's own life or work (the plasterer's job, the banker's sums, Bob's \"count the doors\" from having slept in rooms like these) and is pointed at something in the room. The guess climbs from a hundred million to half a billion to \"billions\" as the table notices more. The student's doubt is the slight argument, and the clock and the eavesdroppers cut in. Bob never explains: he looks up, says three words and writes.\n\n**Cuts from current.** \"I've done three of them B&B jobs this year\" (a count we can't back up, swapped for \"I did them up for the council\"); \"It's billions, not millions\" (the climb now happens through the student's guesses); the student's \"That's not possible\" survives but follows the window sign instead of coming from nowhere. Bob's silent pen-taking gains one line.\n\n**Risk.** It needs a pub with rooms and a visible sign, which the look must carry in one frame; if the sign reads as a hotel it blurs \"B&Bs and nightly lets\" (the quizmaster's answer must still say it in full). \"Count the doors\" could read as a Bob-aphorism, close to a lesson; cut it to a look and the pen if so. Over target at about 34 s: the student's \"Half a billion\" and the second \"VACANCIES\" beat are the first to go. The pub having rooms is a set choice and not a claim about the real pub trade.\n\n**Protected lines.** None protected. Survive nearly intact: \"A hundred million? That's loads.\" (student), \"Nightly's the dearest way to buy anything. You're renting it, not buying it.\" (banker), \"Billions? On rooms? That's not possible.\" (student), \"Pens down.\" Altered: the plasterer's line loses the count of jobs and gains the ceiling gesture.", "09": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Quizmaster | [off, over the room] Thirty seconds. Nearest wins. | 2 |\n| Student | [whisper, fast] A hundred million. Tops. | 2 |\n| Plasterer | [whisper] No. I've done three of them B&B jobs this year, for the council. Every room, every night, they pay-- | 5 |\n| Student | [cutting in] Three jobs is three jobs. That's not the whole country. | 3 |\n| Plasterer | [flat] Three jobs, and I didn't even get to the north. | 3 |\n| Banker | [low] Billions. Say it, nobody's laughing. Nightly's the dearest way to buy anything, you never own a brick of it. [JOKE SLOT: what the banker lets slip about himself] | 6 |\n| Student | [too loud, then hushed] Billions? On rooms? [beat] On B&Bs? | 3 |\n| Quizmaster | [off] Twenty seconds. | 1 |\n| Next table | [a chair scrapes; two heads lean in; the huddle goes dead silent until they lean back] [JOKE SLOT: the eavesdroppers] | 4 |\n| Banker | [mouthing, barely audible] Two. Maybe three. | 2 |\n| Plasterer | [mouthing] Three. Nearer three. | 2 |\n| Student | [one more try] Why would anyone-- | 1 |\n| Bob | [quiet, not looking up; the others stop] I've slept in one. B&Bs and nightly lets. They move you every few nights. [JOKE SLOT: Bob's line, if any] | 5 |\n| Quizmaster | [off] Ten seconds. | 1 |\n| Bob | [takes the pen, writes a number, turns the paper face down] | 3 |\n| Quizmaster | [off] Pens down. | 1 |\n| **Total** | | **44** |\n\n**Why it works.** It is built like the 12 Angry Men jury room with the clock of a Sorkin corridor: the argument moves because someone doubts one small thing (the student, \"three jobs is three jobs\"), and the room only settles when the quietest voice speaks from lived experience and everyone else stops. The Thick of It trick is that nobody finishes a sentence, so the viewer assembles the point themselves, and the guesses climb (hundred million, then billions, then two or three) through objection and eavesdropping, never explanation. The quizmaster's countdown is the interrupter, so nobody can lecture, and the eavesdroppers cost the huddle its volume. Bob never argues, he just gives one fact from his own life and the others fall silent: the hero is the one who doesn't need the clock.\n\n**Cuts from current.** Student's \"That's not possible\" (the doubt now comes as \"three jobs is three jobs\", which is an argument, not a gasp). The banker's \"It's billions, not millions\" becomes \"Billions. Say it.\" Plasterer's \"They're paying for every room, every night\" is cut off mid-sentence. Bob no longer writes without speaking: he gets one line of experience, then the pen. Overshoots the 30 s target by about 14 s as written (44 s with pauses); the quizmaster countdowns and the eavesdrop beat can be trimmed or overlapped to land near 30 s, and the mouthed lines can run under other speech.\n\n**Risk.** Very fragmented: the whisper-and-cut-off style can read as noise in a voice engine, and two overlapping whispers are hard to voice from separate TTS lines. Bob's \"I've slept in one\" could read as a pity beat if delivered soft; it must be flat and factual. The mouthed guesses need picture, not audio, or they vanish. The quizmaster countdowns add time and may feel like a gimmick. The banker's \"you never own a brick of it\" edges towards stating the moral, so check it with Kai. \"Three jobs this year\" is personal experience, not a statistic, but \"I didn't even get to the north\" is an invented claim of reach and should go if Jack objects.\n\n**Protected lines.** None protected. \"Pens down\" survives verbatim as the closing line, and the banker's \"Nightly's the dearest way to buy anything\" and the plasterer's three B&B jobs survive almost as written.", "10": "## Dialogue 1: The huddle\n\n\n| Speaker | Line | Est. s |\n| --- | --- | --- |\n| Student | [whispering, pen hovering] A hundred million? Has to be. That's loads. | 3 |\n| Plasterer | More. I've done three B&B jobs for the council this year. They pay for every room, every night. | 5 |\n| Student | Five hundred million, then. [JOKE SLOT: the student's guess at scale] | 2.5 |\n| Next table | [leans in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers] | 3 |\n| Quizmaster | [over the mic] Twenty seconds. | 1.5 |\n| Banker | Nightly's the dearest way to buy anything. You're renting it, not buying it. It's billions, not millions. [JOKE SLOT: what the banker lets slip about himself] | 5.5 |\n| Student | Billions? On rooms? That's not possible. | 2.5 |\n| Plasterer | Three jobs, one council. Do the sum. | 2 |\n| Banker | [low] Bob. | 1 |\n| Bob | [takes the pen, no hurry] I was in one of those rooms. Nightly, they said. Every night. [JOKE SLOT: Bob's line, if any] | 4 |\n| Quizmaster | [over the mic] Ten seconds. | 1.5 |\n| Bob | [writes a number: three billion. Turns the sheet so only the table sees] | 2 |\n| Banker | [reads it; says nothing; a small nod] | 1.5 |\n| Quizmaster | Pens down. | 1 |\n| **Total** | | **36.5** |\n\n(The two clock lines and the two silent beats can overlap the whispers; with overlaps the spoken run is about 30 s.)\n\n- **Why it works.** The ending is a number on paper and a nod, so the short's payoff is Bob being right without anyone explaining why. The guesses climb in three clear steps (a hundred million, five hundred million, billions), so Bob's \"three billion\" reads as the next obvious step, not a leap. Each of the three gets one reason from their own life: the plasterer's three jobs, the banker's renting-versus-buying, Bob's own night in a room. The student's doubt is the argument, and the quizmaster's clock is what stops the table from talking itself into a speech. Bob says almost nothing and the banker is the one who concedes, so Bob is the hero and the banker is calm and right, not beaten.\n- **Cuts from current.** The student's second doubt is kept but shortened. The \"Next table\" beat moves earlier so the silence lands before the banker, not before Bob. Bob's wordless pen is kept but now carries one personal line, and the pen-writing is split from it so the number is the last visual.\n- **Risk.** \"Three billion\" is a guess, not a claim, but a viewer could read it as Bob knowing the real figure; the reveal in beat 3 has to make clear it is close, not exact. Bob's line (\"I was in one of those rooms\") sits near pity if it is delivered soft, so it needs to be flat and quick. The plasterer's \"Do the sum\" is a near-quip and Jack or Kai may want it blank. Total runs about 6 s over target before overlaps.\n- **Protected lines.** None. Surviving from draft 1 almost verbatim: the student's \"A hundred million? That's loads.\", the plasterer's B&B line, the banker's \"Nightly's the dearest way to buy anything\", the student's \"Billions? On rooms?\", and \"Pens down.\""}, "shapes_html": {"01": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">A hundred million?<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">More. Three B&amp;B jobs this year. Council pays per room, per night.<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Billions? On rooms? No.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">Nightly's the dearest way to hold anything. It's billions. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Next table<\/td><td class=\"line\">[lean in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[barely audible, glancing at the clock] Two? Three?<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[takes the pen, writes] Four rooms in a year. [JOKE SLOT: Bob's line, if any]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[reading the number upside down] That's...<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">Pens down.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>25<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> About 35 spoken words, so the argument is carried by pace and silence rather than talk. The guesses climb in three steps (a hundred million, \"billions\", \"two? three?\"), the student's \"No\" is the slight argument, and the plasterer, banker and Bob each give one reason from their own life: the jobs, how nightly renting prices, and the rooms Bob moved through. Bob says almost nothing and writes the closest number, so he is the one who knows, never pitied and never explaining. Nobody states the moral. The estimate runs about 5 s under target, and the joke slots and the clock's pauses are expected to take it to about 30.<\/p>\n<p><b>Cuts from current.<\/b> \"That's loads\", \"I've done three of them... for the council\", \"You're renting it, not buying it\" (the renting point is folded into \"dearest way to hold anything\"), \"That's not possible\", and the banker's and student's second sentences. The student's second doubt is cut to one word. Bob's two-bar silence becomes one short line of personal experience.<\/p>\n<p><b>Risk.<\/b> Too lean: the plasterer's \"per room, per night\" and the banker's \"billions\" are the only support for the jump to billions, so a viewer could miss why. Bob's \"Four rooms in a year\" is a personal-experience claim and needs Jack's sign-off that it fits Bob's background, and the line may read as a pitch for sympathy if it is delivered heavily. \"Hold\" is slightly stiff for a pub. The slots now carry most of the colour, so if none gets filled the beat is thin. No number is stated as a fact beyond guesses.<\/p>\n<p><b>Protected lines.<\/b> None. The only line kept close to draft 1 is \"Pens down.\"<\/p>", "02": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[writes \"£100m\" on the sheet, close-up of the pen] A hundred million?<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[crosses it out, hard] More. Three B&amp;B jobs for the council this year. Every room, every night.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[whisper, hopeful, writes over it] Hundreds of millions, then.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[calm, doesn't look up] Nightly's the dearest way to buy anything. It's billions. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[stops writing, the sheet in shot] Billions? On rooms?<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">(clock)<\/td><td class=\"line\">[CLOCK: 0:09 on screen; next table's heads lean in; the table goes dead silent; a long beat until they lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[quiet, to the sheet, not to anyone] I was in one. They paid by the night. [JOKE SLOT: Bob's line, if any]<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[takes the pen; close-up: crosses out, writes \"£2.9bn\" in a steady hand; the others watch the pen, not him]<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off-screen] Pens down.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>30<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The climb is shown, not spoken: the sheet goes from £100m to crossed-out to hundreds of millions to billions, so the viewer reads the numbers rising before anyone says \"billions\". Each of the three gets one reason from their own life (the plasterer's jobs, the banker's trade, Bob's room) and nobody explains it to the camera. The slight argument is the student's stalled pen on \"Billions? On rooms?\". The eavesdroppers are a silent shot that stops the whole table, so the pressure is felt and not described. Bob never argues; his pen is the proof, and the others watching his hand instead of him makes him the one who knows without anyone pitying him.<\/li><li><b>Cuts from current.<\/b> The student's \"That's loads\" and \"That's not possible\" (the sheet and the stalled pen say it). The plasterer's \"They're paying for...\" explanation shortened to the three-jobs fact. The banker's \"You're renting it, not buying it\" (the line \"dearest way to buy\" already carries it). Any spoken line for the eavesdroppers. Bob's silence is partly broken: he gets one personal line, because the brief needs a reason from his own life.<\/li><li><b>Risk.<\/b> If the sheet is not legible in shot, the climb vanishes and the student's lines go thin. The five-second silent clock beat could read as dead air in a 45-55 s short; 30 s of whispering with this many stage directions needs strong editing. Bob's \"I was in one\" sits close to a confession and could tip toward pity if delivered heavily: it must be flat and unremarkable, and the pen beat must follow at once. The banker's \"billions\" is a guess, not a claim, so it stays inside the rules.<\/li><li><b>Protected lines.<\/b> None protected. \"Pens down\" survives unaltered as the last line.<\/li><\/ul>", "03": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[whispering] A hundred million? Has to be.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">Higher. I've done three B&amp;B jobs for the council this year. They pay for every room, every night.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">So don't guess the total, build it. A room, a night, a year.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">Say eighty quid a night. Guess.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">Eighty a night is nearly thirty thousand a year. For one room. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[from across the room] Twenty seconds.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Right, but that's one room. That's thousands, not billions.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">How many rooms, though? Say a hundred thousand households. Guess.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[fast] Then it's billions. Thirty thousand times a hundred thousand.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Billions? On rooms? That's not possible.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Next table<\/td><td class=\"line\">[lean in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">Nightly's the dearest way to buy anything. You're renting it, not buying it.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[quietly, not looking up] I was in one eleven months. Same room. Somebody paid for every night of it.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">So it's the nights that add up.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[takes the pen, writes a number] [JOKE SLOT: Bob's line, if any]<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">Pens down.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>44<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The viewer can follow the sum themselves: a room, a night, a year, a hundred thousand households. The guesses climb because the arithmetic forces them to, and the student's doubt is the natural objection to each step. The plasterer, banker and Bob each add one step from their own life (the jobs, the price of renting versus owning, the eleven months), so nobody lectures. Bob does not do the sum. His step is what a night costs when you are the one in the room, and then he writes, which makes him the one who knew. The clock and the next table interrupt at the steps, not at the end, so the pressure is felt.<\/p>\n<p><b>Cuts from current.<\/b> \"A hundred million? That's loads\" becomes a plain guess. \"It's billions, not millions\" is replaced by the sum that earns it. The B&amp;B jobs line is kept but trimmed. Nothing else is lost.<\/p>\n<p><b>Risk.<\/b> It runs about 44 s against a 30 s target, so it needs about 14 s trimmed: drop the \"Right, but that's one room\" exchange and one clock line to get to about 36. The sum is slightly maths-heavy and could sound like a lesson if delivered flat. The eighty-quid and hundred-thousand figures are guesses, but a listener could take them as facts, so they must be voiced as guesses (\"Say...\", \"Guess.\"). The sum lands near the answer by design, which risks sounding too neat. The eleven months is personal experience for Bob and must not be played for pity.<\/p>\n<p><b>Protected lines.<\/b> None.<\/p>", "04": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off, over the room] Thirty seconds. Go.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[whisper, fast] Fifty million. Fifty. Put fifty.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">Fifty? Mate, I've done three B&amp;B jobs for the council since spring, they pay for every room, every ni--<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[over him] So a hundred. A hundred million.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">More. Way more. Per room, per night, it's--<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off] Twenty.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[low, calm, cutting in] Nightly's the dearest way to buy anything. You're renting, not buying. So it's not millions. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Billions? On rooms? It can't be, that's--<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[flat] Add it up. Every room, every night.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Next table<\/td><td class=\"line\">[leans in; the whole table freezes, pens still, until they lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[barely audible] Billions, then? Two? Three?<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">Shh. Don't say it out loud. Three, maybe. Four--<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off] Ten.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">Four's too much. Three. Say three.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Not even a million per-- no. Fine. Three.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[takes the pen, no argument; one beat of quiet] Three rooms a night, we had, me and the kids' stuff
