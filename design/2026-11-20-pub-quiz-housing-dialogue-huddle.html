 in a bag. Someone paid for that. Every night. [writes a number] [JOKE SLOT: Bob's line, if any]<\/td><td class=\"num\">4.5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off] Five. Four--<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[caps the pen]<\/td><td class=\"num\">0.5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">Pens down.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>~37 (runs long; the clock calls and the Bob line are the first things to trim to hit 30)<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The viewer feels the thirty seconds as pressure, not as a lecture. The guesses climb because the clock won't let anyone defend a low number: fifty million, a hundred, \"not millions\", then billions, then three. Each of the plasterer, banker and Bob gets one reason from their own life, and each is cut off at the point the reason lands, so the unfinished sentence does the work. The student's doubt is the slight argument, and the eavesdroppers are a hard stop the clock makes worse. Bob never argues; he gets the last reason, and the countdown hands him the pen.<\/p>\n<p><b>Cuts from current.<\/b> \"Billions, not millions\" as a spoken moral is gone (replaced by \"not millions\" mid-argument). The student's separate \"That's not possible\" becomes a cut-off \"it can't be, that's--\". Bob's silent writing gets one short line of his own life, no pity. Plasterer's \"They're paying for every room, every night\" is now truncated.<\/p>\n<p><b>Risk.<\/b> It runs long (about 37 s against 30) with all the interruptions, and overlapping whisper dialogue can be unintelligible once voiced, especially with cut-offs in AI Studio voices (cut-offs need pause tags and may sound like errors). Constant interruption could read as chaotic, not tense, and the quizmaster's countdown could feel like a gimmick if he calls too often (cut to two calls). Bob's line must stay plain and never tip into a sad story: \"Three rooms\" is a guess at his detail, mark for Jack to rewrite. Guesses of \"three\" or \"four\" are guesses, not claims, but \"Add it up\" / \"Four's too much\" edges close to the banker asserting; check against rule 3.<\/p>\n<p><b>Protected lines.<\/b> None. Surviving from draft 1 in altered form: the student's \"a hundred million\", the plasterer's B&amp;B jobs (cut off), the banker's \"dearest way to buy anything\" and \"renting, not buying\", the student's doubt, the eavesdroppers beat, Bob taking the pen, and \"Pens down\" (unchanged).<\/p>", "05": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[whisper, pen already moving] A hundred million. Go on, change my mind. One reason each, and no jargon, or that's what I'm writing.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">Three B&amp;B jobs for the council this year, that's all I've seen. But they pay for every room, every night.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Three jobs. Fine, half a billion. That's me being generous.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[low] Rooms by the night is the dearest way to buy anything. I can't give you the number, only which way it goes. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off, over the speakers] Fifteen seconds.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Billions? On rooms? You've got to give me more than \"the dearest way\".<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Next table<\/td><td class=\"line\">[leans in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[takes the pen, quiet] I've slept in one of those rooms. Nobody asked me for rent. Someone paid, every night, and not once did they get a flat out of it.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\"><span class=\"stage\">[beat]<\/span> ...Billions, then. Put billions.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[writes a number] [JOKE SLOT: Bob's line, if any]<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">Pens down.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>38<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The doubt stops being a speed bump and becomes the engine: the student is the viewer's proxy and each person only wins him by giving something up, so the argument is visible as a negotiation, not an information dump. The guesses climb on his terms (a hundred million, half a billion, billions), each rise earned by one reason, and the clock and eavesdroppers squeeze the bargaining. Bob wins by being the one the student actually believes; he is persuasive, not pitied.<\/p>\n<p><b>Cuts from current.<\/b> The student's \"That's loads\" and \"That's not possible\" merge into his terms and his concessions. The banker's \"It's billions, not millions\" goes (he now only gives direction). The plasterer's \"More.\" is replaced by his admission.<\/p>\n<p><b>Risk.<\/b> Runs about 38 s, over the 30 s target; the Quizmaster's countdown line and the plasterer's first sentence are the first cuts. The student bossing the table could read as the lesson-giver if played arrogant; the terms must sound like a quiz player under pressure, not a teacher. Bob's \"Someone paid, every night\" edges toward explaining the point; if Kai finds it preachy, drop to \"Someone paid every night.\" and let the student's concession carry it. Banker conceding the number risks making him vague rather than calm and right.<\/p>\n<p><b>Protected lines.<\/b> None protected. The current lines survive only in altered form: \"They're paying for every room, every night\" (plasterer, kept), \"dearest way to buy anything\" (banker, kept inside his concession), \"Billions? On rooms?\" (student, kept, now a demand), \"Pens down\" (kept).<\/p>", "06": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[whisper] A hundred million? That's loads.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[whisper] More. I've done three of them B&amp;B jobs for the council this year. Every room, every night.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[whisper] Nightly's the dearest way to--<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[cutting in] --every night. So it's not rooms, it's rooms times nights. Say fifty quid a night, say a few thousand rooms, [JOKE SLOT: the student doing sums on a beer mat] that's a billion. Two billion.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[whisper] Two billion? On rooms? Come off it, I've seen the rooms.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[a beat; whispering] No, he's right. You rent it, you never own it, it just keeps coming. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off] Ten seconds.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Next table<\/td><td class=\"line\">[lean in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[takes the pen, quiet] I was in one nine months. They paid for it every night. [writes a number] [JOKE SLOT: Bob's line, if any]<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off] Pens down.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>31<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The viewer is the student: low guess, then the same doubt. Letting him reach \"billions\" by arithmetic before the banker finishes his sentence makes the argument something the viewer does with him, not something an expert tells them, and it keeps the banker calm and right without a lecture. The plasterer's doubt is the slight argument, and it is the more convincing for coming from the man who has seen the rooms. Bob arrives after the sum is done and adds the one thing no sum has: he was there. He never explains, he writes.<\/p>\n<p><b>Cuts from current.<\/b> The banker's full explanation (\"renting it, not buying it. It's billions, not millions\") is cut to a half sentence that the student finishes, then a short confirmation. The student's \"That's not possible\" push-back moves to the plasterer. The plasterer's \"paying for every room\" line is trimmed.<\/p>\n<p><b>Risk.<\/b> The student's \"fifty quid a night, a few thousand rooms\" are guesses, but spoken as a sum they may sound like claims; keep the \"say\" and consider a beer-mat joke slot to mark them as rough. A student out-reasoning a banker could read as the banker being slow (punching down at him) unless his reply stays warm. Bob must not look like a pupil to the student; the order of lines (Bob last, writes the number) is meant to guard that, and the director should check it. \"Nine months\" is invented personal experience, for Jack to confirm.<\/p>\n<p><b>Protected lines.<\/b> None. \"Pens down\" survives verbatim as the final line. The student's \"A hundred million? That's loads.\" and the plasterer's \"I've done three of them B&amp;B jobs for the council this year\" survive nearly unchanged; the banker's \"Nightly's the dearest way to buy anything\" is split between banker and student.<\/p>", "07": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[whisper] A hundred million? That's loads.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Next table (A)<\/td><td class=\"line\">[leaning in, whispering to their own table] Hundred million. That's what I'd have put.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[low] More. I've done three of them B&amp;B jobs for the council this year. They're paying for every room, every night.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Next table (B)<\/td><td class=\"line\">[hissed, to A] Every night? Every room?<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">Nightly's the dearest way to buy anything. You're renting it, not buying it. It's billions, not millions. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Next table<\/td><td class=\"line\">[the table goes silent; both tables freeze until the eavesdroppers lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[hissing at the next table, then back in] Oi. [to his own] Billions? On rooms? That's not possible.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Plasterer / Banker<\/td><td class=\"line\">Plasterer: Two billion? Banker: Two. Three. [overlapping, the clock ticking over them]<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[quietly, the first thing he says, taking the pen] I've been in one of them rooms. [writes a number] [JOKE SLOT: Bob's line, if any]<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[over the mic] Ten seconds.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">Pens down.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>32.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<ul><li><b>Why it works.<\/b> The viewer doubts the number, and the room says it out loud, so the table can stay calm and quick. The next table is a stand-in for the audience: they start where we start (a hundred million), they repeat the plasterer's detail back (so it lands twice), and they are the ones who say \"that can't be right\". The main table never lectures; the banker and plasterer just talk to each other while being overheard. Guesses climb from a hundred million to \"billions\" to \"two, three\" without anyone stating a statistic. Bob says one thing, from his own life, and writes; the room's doubt makes his silence louder.<\/li><li><b>Cuts from current.<\/b> The student's second line is now aimed at the next table as well as his own, so it is a flash of irritation rather than the table's only push-back; the plasterer and banker lose their closing sentence in the join; the next table gets lines instead of a mime beat only. Bob gains one short line of experience (a guess at what Jack wants: marked as mine, to rule on) in place of pure silence.<\/li><li><b>Risk.<\/b> The eavesdroppers can steal the doubt so completely that the table has no argument of its own, and the \"slight argument\" Jack asked for becomes a bystander commentary. Two voices outside the four are more casting and more voices to record. Bob's line \"I've been in one of them rooms\" could tip toward pity or lesson if delivered heavy; it must be flat and brief. \"Two. Three.\" is a guess, not a claim, but check it reads as a guess.<\/li><li><b>Protected lines.<\/b> None protected. Surviving from draft 1: the student's \"A hundred million? That's loads.\", the plasterer's B&amp;B line (unchanged), the banker's \"dearest way to buy anything\" line (unchanged), the student's \"Billions? On rooms? That's not possible.\" (now with an \"Oi\" before it), \"Pens down.\" (unchanged). Bob's line is new and is a guess to rule on.<\/li><\/ul>", "08": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[whisper] A hundred million? That's loads.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[nods at the ceiling] Them rooms upstairs. I did them up for the council. They pay for every one, every night.<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">That's one pub, though.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[low] Count the doors. Doors times nights. Then do it for every town with a sign like that. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[points at the window] VACANCIES. And next door. And the one past that.<\/td><td class=\"num\">3.5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Half a billion, then?<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">Nightly's the dearest way to buy anything. You're renting it, not buying it. More.<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Billions? On rooms? That's not possible.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[over the speaker] Ten seconds.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Next table<\/td><td class=\"line\">[lean in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[looks at the ceiling, takes the pen] Count the doors. [JOKE SLOT: Bob's line, if any] [writes a number]<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">Pens down.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>34.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> The set does the persuading, so nobody has to lecture: the board, the sign and the ceiling are the evidence, and the viewer can check them with their own eyes. Each reason comes from the person's own life or work (the plasterer's job, the banker's sums, Bob's \"count the doors\" from having slept in rooms like these) and is pointed at something in the room. The guess climbs from a hundred million to half a billion to \"billions\" as the table notices more. The student's doubt is the slight argument, and the clock and the eavesdroppers cut in. Bob never explains: he looks up, says three words and writes.<\/p>\n<p><b>Cuts from current.<\/b> \"I've done three of them B&amp;B jobs this year\" (a count we can't back up, swapped for \"I did them up for the council\"); \"It's billions, not millions\" (the climb now happens through the student's guesses); the student's \"That's not possible\" survives but follows the window sign instead of coming from nowhere. Bob's silent pen-taking gains one line.<\/p>\n<p><b>Risk.<\/b> It needs a pub with rooms and a visible sign, which the look must carry in one frame; if the sign reads as a hotel it blurs \"B&amp;Bs and nightly lets\" (the quizmaster's answer must still say it in full). \"Count the doors\" could read as a Bob-aphorism, close to a lesson; cut it to a look and the pen if so. Over target at about 34 s: the student's \"Half a billion\" and the second \"VACANCIES\" beat are the first to go. The pub having rooms is a set choice and not a claim about the real pub trade.<\/p>\n<p><b>Protected lines.<\/b> None protected. Survive nearly intact: \"A hundred million? That's loads.\" (student), \"Nightly's the dearest way to buy anything. You're renting it, not buying it.\" (banker), \"Billions? On rooms? That's not possible.\" (student), \"Pens down.\" Altered: the plasterer's line loses the count of jobs and gains the ceiling gesture.<\/p>", "09": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off, over the room] Thirty seconds. Nearest wins.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[whisper, fast] A hundred million. Tops.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[whisper] No. I've done three of them B&amp;B jobs this year, for the council. Every room, every night, they pay--<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[cutting in] Three jobs is three jobs. That's not the whole country.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[flat] Three jobs, and I didn't even get to the north.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[low] Billions. Say it, nobody's laughing. Nightly's the dearest way to buy anything, you never own a brick of it. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">6<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[too loud, then hushed] Billions? On rooms? <span class=\"stage\">[beat]<\/span> On B&amp;Bs?<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off] Twenty seconds.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Next table<\/td><td class=\"line\">[a chair scrapes; two heads lean in; the huddle goes dead silent until they lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[mouthing, barely audible] Two. Maybe three.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">[mouthing] Three. Nearer three.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[one more try] Why would anyone--<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[quiet, not looking up; the others stop] I've slept in one. B&amp;Bs and nightly lets. They move you every few nights. [JOKE SLOT: Bob's line, if any]<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off] Ten seconds.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[takes the pen, writes a number, turns the paper face down]<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[off] Pens down.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>44<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Why it works.<\/b> It is built like the 12 Angry Men jury room with the clock of a Sorkin corridor: the argument moves because someone doubts one small thing (the student, \"three jobs is three jobs\"), and the room only settles when the quietest voice speaks from lived experience and everyone else stops. The Thick of It trick is that nobody finishes a sentence, so the viewer assembles the point themselves, and the guesses climb (hundred million, then billions, then two or three) through objection and eavesdropping, never explanation. The quizmaster's countdown is the interrupter, so nobody can lecture, and the eavesdroppers cost the huddle its volume. Bob never argues, he just gives one fact from his own life and the others fall silent: the hero is the one who doesn't need the clock.<\/p>\n<p><b>Cuts from current.<\/b> Student's \"That's not possible\" (the doubt now comes as \"three jobs is three jobs\", which is an argument, not a gasp). The banker's \"It's billions, not millions\" becomes \"Billions. Say it.\" Plasterer's \"They're paying for every room, every night\" is cut off mid-sentence. Bob no longer writes without speaking: he gets one line of experience, then the pen. Overshoots the 30 s target by about 14 s as written (44 s with pauses); the quizmaster countdowns and the eavesdrop beat can be trimmed or overlapped to land near 30 s, and the mouthed lines can run under other speech.<\/p>\n<p><b>Risk.<\/b> Very fragmented: the whisper-and-cut-off style can read as noise in a voice engine, and two overlapping whispers are hard to voice from separate TTS lines. Bob's \"I've slept in one\" could read as a pity beat if delivered soft; it must be flat and factual. The mouthed guesses need picture, not audio, or they vanish. The quizmaster countdowns add time and may feel like a gimmick. The banker's \"you never own a brick of it\" edges towards stating the moral, so check it with Kai. \"Three jobs this year\" is personal experience, not a statistic, but \"I didn't even get to the north\" is an invented claim of reach and should go if Jack objects.<\/p>\n<p><b>Protected lines.<\/b> None protected. \"Pens down\" survives verbatim as the closing line, and the banker's \"Nightly's the dearest way to buy anything\" and the plasterer's three B&amp;B jobs survive almost as written.<\/p>", "10": "<div class=\"tbl\"><table><thead><tr><th>Speaker<\/th><th>Line<\/th><th>Est. s<\/th><\/tr><\/thead><tbody>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">[whispering, pen hovering] A hundred million? Has to be. That's loads.<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">More. I've done three B&amp;B jobs for the council this year. They pay for every room, every night.<\/td><td class=\"num\">5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Five hundred million, then. [JOKE SLOT: the student's guess at scale]<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Next table<\/td><td class=\"line\">[leans in; the table goes silent until they lean back] [JOKE SLOT: the eavesdroppers]<\/td><td class=\"num\">3<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[over the mic] Twenty seconds.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">Nightly's the dearest way to buy anything. You're renting it, not buying it. It's billions, not millions. [JOKE SLOT: what the banker lets slip about himself]<\/td><td class=\"num\">5.5<\/td><\/tr>\n<tr><td class=\"who\">Student<\/td><td class=\"line\">Billions? On rooms? That's not possible.<\/td><td class=\"num\">2.5<\/td><\/tr>\n<tr><td class=\"who\">Plasterer<\/td><td class=\"line\">Three jobs, one council. Do the sum.<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[low] Bob.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[takes the pen, no hurry] I was in one of those rooms. Nightly, they said. Every night. [JOKE SLOT: Bob's line, if any]<\/td><td class=\"num\">4<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">[over the mic] Ten seconds.<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Bob<\/td><td class=\"line\">[writes a number: three billion. Turns the sheet so only the table sees]<\/td><td class=\"num\">2<\/td><\/tr>\n<tr><td class=\"who\">Banker<\/td><td class=\"line\">[reads it; says nothing; a small nod]<\/td><td class=\"num\">1.5<\/td><\/tr>\n<tr><td class=\"who\">Quizmaster<\/td><td class=\"line\">Pens down.<\/td><td class=\"num\">1<\/td><\/tr>\n<tr><td class=\"who\"><b>Total<\/b><\/td><td class=\"line\"><\/td><td class=\"num\"><b>36.5<\/b><\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>(The two clock lines and the two silent beats can overlap the whispers; with overlaps the spoken run is about 30 s.)<\/p>\n<ul><li><b>Why it works.<\/b> The ending is a number on paper and a nod, so the short's payoff is Bob being right without anyone explaining why. The guesses climb in three clear steps (a hundred million, five hundred million, billions), so Bob's \"three billion\" reads as the next obvious step, not a leap. Each of the three gets one reason from their own life: the plasterer's three jobs, the banker's renting-versus-buying, Bob's own night in a room. The student's doubt is the argument, and the quizmaster's clock is what stops the table from talking itself into a speech. Bob says almost nothing and the banker is the one who concedes, so Bob is the hero and the banker is calm and right, not beaten.<\/li><li><b>Cuts from current.<\/b> The student's second doubt is kept but shortened. The \"Next table\" beat moves earlier so the silence lands before the banker, not before Bob. Bob's wordless pen is kept but now carries one personal line, and the pen-writing is split from it so the number is the last visual.<\/li><li><b>Risk.<\/b> \"Three billion\" is a guess, not a claim, but a viewer could read it as Bob knowing the real figure; the reveal in beat 3 has to make clear it is close, not exact. Bob's line (\"I was in one of those rooms\") sits near pity if it is delivered soft, so it needs to be flat and quick. The plasterer's \"Do the sum\" is a near-quip and Jack or Kai may want it blank. Total runs about 6 s over target before overlaps.<\/li><li><b>Protected lines.<\/b> None. Surviving from draft 1 almost verbatim: the student's \"A hundred million? That's loads.\", the plasterer's B&amp;B line, the banker's \"Nightly's the dearest way to buy anything\", the student's \"Billions? On rooms?\", and \"Pens down.\"<\/li><\/ul>"}}], "questions": [{"id": "q1", "text": "Bob: every shape broke his silence with one line of his own experience ('I was in one'). Do you want that, or should he only take the pen and write? A spoken line risks pity; none risks making him a prop."}, {"id": "q2", "text": "The detail of Bob's time in temporary accommodation (they paid by the night, moved every few nights, nine or eleven months) is invented in every shape. Which, if any, is true to his canon?"}, {"id": "q3", "text": "Is a spoken sum by the student (fifty quid a night, a hundred thousand rooms, all marked as guesses) acceptable under the facts rule, or does it read as stating statistics?"}, {"id": "q4", "text": "Should the quizmaster call the time inside the huddle (Twenty, Ten), adding about 3 s and some pressure, or should the clock be left to the picture?"}, {"id": "q5", "text": "Should Bob's written number be shown to camera in this beat (near £2.9bn) or hidden until the answer, with the sheet turned face down?"}], "round": 1, "plan": [{"h": "Your pick", "items": ["1A combined with 1C, as draft 1D at the top: 1C's sheet, 'Bob.' and the nod, with 1A's beer-mat sum in the middle.", "Fixed: the plasterer only pushes the guess up; the doubt is the student's.", "Written into script.md, beat 2."]}, {"h": "You decide", "items": ["Bob's line: keep 'I was in one. They paid by the night.' (invented), or he only writes.", "Every joke slot."]}], "replies": {}};
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e };
let db = null, me = null; const NOTES = {};
const SHAPE = Object.fromEntries(D.shapes.map(s => [s.id, s]));

// Speech with its [stage directions] greyed; text only, never HTML from the data.
function said(text) {
  const d = el('div', 'said');
  for (const part of text.split(/(\[[^\]]+\])/)) { if (!part) continue; part.startsWith('[') ? d.append(el('span', 'stage', part)) : d.append(part) }
  return d;
}
const whoClass = w => /maddie/i.test(w) ? 'maddie' : /lady/i.test(w) ? 'lady' : 'other';

/* ---------- notes (same store and shape as the timeline pages: notes/<key>__<user>) ---------- */
function reply(key, host) { const r = (D.replies || {})[key]; if (!r) return; const d = el('div', 'reply'); d.append(el('b', '', "Claude's read"), r); host.append(d) }
const size = ta => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px' };
function slip(key, label, host) {
  const w = host || el('div', 'slipw'); w.classList.add('slipw');
  const l = el('label'), st = el('span'), ta = el('textarea'); ta.id = 'n-' + key; l.htmlFor = ta.id; ta.rows = 1;
  l.append(el('span', '', label), st); ta.value = NOTES[key] || ''; ta.disabled = !db; ta.placeholder = db ? '' : 'Sign in to leave notes';
  let timer; ta.oninput = () => { size(ta); st.className = ''; st.textContent = '…'; clearTimeout(timer); timer = setTimeout(() => save(key, ta.value, st), 700) };
  w.append(l, ta); reply(key, w); requestAnimationFrame(() => size(ta)); return w;
}
// A line's slip stays folded until asked for, unless it already holds a note or a reply.
function lineSlip(key, host) {
  if (NOTES[key] || (D.replies || {})[key]) { host.append(slip(key, 'Note on this line')); return }
  const b = el('button', 'addnote', '+ note this line'); b.onclick = () => { const s = slip(key, 'Note on this line'); b.replaceWith(s); s.querySelector('textarea').focus() }; host.append(b);
}
async function save(key, text, st, extra) {
  if (!db) return;
  try {
    const ref = db.doc('notes/' + key + '__' + me);
    if (text.trim()) await ref.set({ key, note: text, by: me, at: Date.now(), ...(extra || {}) }); else await ref.delete();
    NOTES[key] = text; if (st) { st.className = 'ok'; st.textContent = 'Saved' }
  } catch (e) { if (st) st.textContent = 'Not saved: ' + (e && e.code || 'error') }
}

/* ---------- a script: the lines of one version ---------- */
function script(d, v, compact) {
  const box = el('div', 'script');
  v.lines.forEach((ln, i) => {
    const row = el('div', 'ln'), who = el('div', 'who ' + whoClass(ln.who), ln.who), s = said(ln.line);
    if (/^(sfx|picture)/i.test(ln.who)) s.classList.add('dir');
    const side = el('div', 'side');
    for (const t of ln.tags || []) {
      if (SHAPE[t]) { const c = el('button', 'chip', t); c.title = 'From writer ' + t + ' (' + SHAPE[t].name + '): open their version'; c.onclick = () => openShape(d.id, t); side.append(c) }
      else side.append(el('span', 'chip plain', t === 'Kai' ? 'your line' : t === 'all' ? 'all' : t));
    }
    if (ln.s) side.append(el('span', 'secs', ln.s + ' s'));
    row.append(who, s, side);
    if (!compact && v.id) { const h = el('div'); h.className = 'slipw'; lineSlip(d.id + '-' + v.id + '-L' + (i + 1), h); row.append(h) }
    box.append(row);
  });
  return box;
}

function versionCard(d, v, compact) {
  const c = el('div', 'card'), head = el('div', 'card-head'), t = el('div');
  if (v.id) {
    t.append(el('div', 'eyebrow', 'Draft ' + v.id + ' · ' + (v.total || v.length)), el('h4', '', v.name));
    if (v.bet) t.append(Object.assign(el('p', 'bet', 'The bet: ' + v.bet)));
    head.append(t);
    const pk = el('button', 'pickbtn' + (NOTES['pick-' + d.id] === v.id ? ' on' : ''), NOTES['pick-' + d.id] === v.id ? '✓ Picked' : 'Pick ' + v.id);
    pk.disabled = !db; pk.onclick = async () => { const on = NOTES['pick-' + d.id] === v.id; await save('pick-' + d.id, on ? '' : v.id, null, { pick: true }); render() };
    head.append(pk);
  } else {
    t.append(el('div', 'eyebrow', 'In the cut now'), el('h4', '', 'What the scene says today'));
    t.append(el('p', 'lede', 'From ' + d.now_from + '. The starting point the drafts rewrite.'));
    head.append(t);
  }
  c.append(head, script(d, v, compact));
  if (v.id && !compact) {
    if (v.notes && v.notes.length) { const ul = el('ul', 'notes'); for (const n of v.notes) ul.append(el('li', '', n)); c.append(ul) }
    c.append(slip(d.id + '-' + v.id, 'Note on draft ' + v.id + ' as a whole'));
  }
  return c;
}

/* ---------- the ranked writers ---------- */
function rankList(d) {
  const wrap = el('div'), used = new Set(d.drafts.flatMap(v => v.lines.flatMap(l => l.tags || [])));
  for (const r of d.ranking) {
    const s = SHAPE[r.shape], det = el('details', 'rank'); det.id = d.id + '-s' + r.shape;
    const sum = el('summary'), nm = el('div', 'nm', 'Writer ' + r.shape + ': ' + s.title);
    if (used.has(r.shape)) nm.append(el('span', 'used', 'lines used in the drafts'));
    sum.append(el('div', 'n', '#' + r.rank), nm, el('div', 'len', r.length), el('div', 'verdict', r.verdict));
    const body = el('div', 'body md');
    const ap = el('details', 'approach'); ap.append(el('summary', '', "This writer's approach"));
    const apb = el('div'); apb.innerHTML = s.intro_html; ap.append(apb);
    const ver = el('div'); ver.innerHTML = d.shapes_html[r.shape];
    body.append(ap, ver, slip(d.id + '-s' + r.shape, 'Note on writer ' + r.shape + "'s version (a line to steal?)"));
    det.append(sum, body); wrap.append(det);
  }
  return wrap;
}
function openShape(did, sid) { const x = $(did + '-s' + sid); if (!x) return; x.open = true; x.scrollIntoView({ behavior: 'smooth', block: 'start' }); x.classList.remove('flash'); void x.offsetWidth; x.classList.add('flash') }

/* ---------- panels ---------- */
const VIEW = {};   // which version each dialogue shows: 'now' | draft id | 'compare'
function dialoguePanel(d, n) {
  const p = el('section', 'panel'), band = el('div', 'band');
  band.append(el('span', 'eyebrow', 'Dialogue ' + n + ' of ' + D.dialogues.length), el('span', 'meta', d.where + ' · target ' + d.target));
  p.append(band, el('h2', '', d.label), slip(d.id, 'Note on this dialogue as a whole'));
  p.append(el('h3', '', 'Read it: now, and ' + (d.drafts.length === 3 ? 'three drafts' : d.drafts.length + ' draft' + (d.drafts.length > 1 ? 's' : ''))));
  const v = VIEW[d.id] || d.drafts[0].id, seg = el('div', 'seg');
  const opt = (key, title, sub) => { const b = el('button', (v === key ? 'on' : '') + (NOTES['pick-' + d.id] === key ? ' picked' : '')); b.append(el('b', '', title), el('span', '', sub)); b.onclick = () => { VIEW[d.id] = key; render() }; return b };
  seg.append(opt('now', 'Now', 'in the cut, ' + d.now.length + ' lines'));
  for (const x of d.drafts) seg.append(opt(x.id, x.id + ' · ' + x.name, (x.total || x.length).replace(/\s*\(.*/, '') + (NOTES['pick-' + d.id] === x.id ? ' · picked' : '')));
  const cmp = el('button', 'cmp' + (v === 'compare' ? ' on' : ''), v === 'compare' ? 'One at a time' : 'Side by side');
  cmp.onclick = () => { VIEW[d.id] = v === 'compare' ? d.drafts[0].id : 'compare'; render() }; seg.append(cmp);
  p.append(seg);
  if (v === 'compare') { const g = el('div', 'compare'); g.append(versionCard(d, { lines: d.now }, true)); for (const x of d.drafts) g.append(versionCard(d, x, true)); p.append(g) }
  else p.append(versionCard(d, v === 'now' ? { lines: d.now } : d.drafts.find(x => x.id === v)));
  if (d.keeps) p.append(el('p', 'lede', d.keeps));
  if (d.protected) {
    p.append(el('h3', '', 'Your protected lines, per draft'));
    const t = el('table'), tr = el('tr'); tr.append(el('th', '', 'Draft')); for (const c of d.protected.columns) tr.append(el('th', '', c)); t.append(tr);
    for (const [k, vals] of Object.entries(d.protected.rows)) { const r = el('tr'); r.append(el('td', '', k)); for (const x of vals) r.append(el('td', '', x)); t.append(r) }
    const w = el('div', 'md'), sc = el('div', 'tbl'); sc.append(t); w.append(sc); p.append(w);
  }
  if (!d.ranking.length) return p;   // a hand-written page (no writers' run)
  p.append(el('hr'));
  p.append(el('h3', '', 'Optional: the raw material the three drafts were blended from'));
  p.append(el('p', 'lede', "You only need to pick from the three drafts above. Below are the " + d.ranking.length + " writers' own versions, each pushing one approach to the extreme. 1A, 1B and 1C are built from their best lines: each line's chip (like 09) says which writer it came from. Ranked harshly, best first. Read one only if you want to steal a line, and note it on that writer's slip."));
  p.append(rankList(d));
  return p;
}
function questionsPanel() {
  const p = el('section', 'panel');
  p.append(el('span', 'eyebrow', D.dialogues.length > 1 ? 'All dialogues' : 'This dialogue'), el('h2', '', 'Open questions for you'));
  p.append(el('p', 'lede', 'The drafts lean on these. Answer in the box under each.'));
  D.questions.forEach((q, i) => { const c = el('div', 'q'); c.append(el('p', '', (i + 1) + '. ' + q.text), slip(q.id, 'Your answer')); p.append(c) });
  return p;
}

function current() { const h = location.hash.slice(1); return D.dialogues.some(d => d.id === h) || h === 'q' ? h : D.dialogues[0].id }
function render() {
  if (!D.shapes.length) document.querySelectorAll(".writers-hint").forEach(x => x.remove());
  const cur = current(), tabs = $('tabs'); tabs.replaceChildren();
  D.dialogues.forEach((d, i) => {
    const a = el('a', cur === d.id ? 'on' : '', (i + 1) + ' · ' + d.label); a.href = '#' + d.id;
    const sm = el('small', '', d.where.split(' · ')[0]); if (NOTES['pick-' + d.id]) sm.append(' · ', Object.assign(el('span', 'picked', 'picked ' + NOTES['pick-' + d.id])));
    a.append(sm); tabs.append(a);
  });
  const qa = el('a', cur === 'q' ? 'on' : '', 'Open questions'); qa.href = '#q'; qa.append(el('small', '', D.questions.length + ' to answer')); tabs.append(qa);
  const m = $('main'); m.replaceChildren(cur === 'q' ? questionsPanel() : dialoguePanel(D.dialogues.find(d => d.id === cur), D.dialogues.findIndex(d => d.id === cur) + 1));
}
addEventListener('hashchange', () => { render(); scrollTo({ top: $('tabs').offsetTop - 8 }) });

$('title').textContent = D.title; $('about').textContent = D.about;
if (D.plan && D.plan.length) {
  const b = $('roundplan'); b.className = 'roundplan'; b.append(el('div', 'eyebrow', "Claude's read of your notes" + (D.round ? ' · round ' + D.round : '')));
  for (const g of D.plan) { const ul = el('ul'); for (const i of g.items) ul.append(el('li', '', i)); b.append(el('h3', '', g.h), ul) }
}
render();
(async () => {
  if (typeof claude === 'undefined') return;
  db = await claude.use('db'); const user = await claude.use('user');
  if (!db || !user) { db = null; return }
  me = await user.id();
  const snap = await db.collection('notes').where('by', '==', me).get();
  for (const d of snap.docs) { const v = d.data(); NOTES[v.key] = v.note || '' }
  slip('top', 'Note on the whole page', $('topSlip'));
  render();
})();
</script>
