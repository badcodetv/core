<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1728"><rect width="100%" height="100%" fill="#15181b"/><text x="24" y="44" font-family="Liberation Sans Narrow" font-weight="700" font-size="34" fill="#eef3f6" letter-spacing="1">BADCODE LOGO — DIRECTION SKETCHES</text><text x="24" y="76" font-family="monospace" font-size="18" fill="#aab3bb">2026-09-29 · napkin quality, for choosing a direction · A = recommended · B, C = alternatives · nothing here is finished design</text><g transform="translate(0,96)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><line x1="240" y1="0" x2="240" y2="292" stroke="#eef3f6" stroke-width="3.2"/><circle cx="240" cy="318" r="29" fill="#e6291c"/></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">A · THE MARK</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">A line from the top edge, ending in one red lamp.</text></g><g transform="translate(480,96)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><line x1="286" y1="0" x2="286" y2="341.76" stroke="#eef3f6" stroke-width="3.2"/><text x="249.88" y="372" text-anchor="end" font-family="Liberation Sans Narrow" font-weight="700" font-size="84" letter-spacing="1" fill="#eef3f6">BADC</text><circle cx="286" cy="341.76" r="30.24" fill="#e6291c"/><text x="322.12" y="372" text-anchor="start" font-family="Liberation Sans Narrow" font-weight="700" font-size="84" letter-spacing="1" fill="#eef3f6">DE</text></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">A · THE NAME</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">One rule: the O is the lamp. The line lands in it.</text></g><g transform="translate(960,96)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><rect width="480" height="240" fill="#0f0f0f"/><rect y="240" width="480" height="240" fill="#fff"/><svg x="30" y="56" width="128" height="128" viewBox="0 0 128 128"><g transform="scale(1.28)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg><svg x="30" y="296" width="128" height="128" viewBox="0 0 128 128"><g transform="scale(1.28)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg><svg x="192" y="88" width="64" height="64" viewBox="0 0 64 64"><g transform="scale(0.64)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg><svg x="192" y="328" width="64" height="64" viewBox="0 0 64 64"><g transform="scale(0.64)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg><svg x="290" y="100" width="40" height="40" viewBox="0 0 40 40"><g transform="scale(0.4)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg><svg x="290" y="340" width="40" height="40" viewBox="0 0 40 40"><g transform="scale(0.4)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg><svg x="364" y="106" width="28" height="28" viewBox="0 0 28 28"><g transform="scale(0.28)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg><svg x="364" y="346" width="28" height="28" viewBox="0 0 28 28"><g transform="scale(0.28)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg><svg x="426" y="112" width="16" height="16" viewBox="0 0 16 16"><g transform="scale(0.16)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg><svg x="426" y="352" width="16" height="16" viewBox="0 0 16 16"><g transform="scale(0.16)"><circle cx="50" cy="50" r="50" fill="#000"/><rect x="47.4" y="0" width="5.2" height="60" fill="#eef3f6"/><circle cx="50" cy="62" r="10.5" fill="#e6291c"/></g></svg></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">A · SMALL SIZES</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">Profile pictures at 128 to 16 pixels, dark and light apps.</text></g><g transform="translate(1440,96)"><rect x="5" y="5" width="470" height="470" fill="#0b0d0f"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><g transform="translate(40,22)"><rect width="400" height="130" fill="#000" stroke="#2a3138"/><line x1="212" y1="0" x2="212" y2="46" stroke="#eef3f6" stroke-width="1.6"/><text x="14" y="120" font-family="monospace" font-size="13" fill="#59626b">1</text></g><g transform="translate(40,172)"><rect width="400" height="130" fill="#000" stroke="#2a3138"/><line x1="212" y1="0" x2="212" y2="96" stroke="#eef3f6" stroke-width="1.6"/><text x="14" y="120" font-family="monospace" font-size="13" fill="#59626b">2</text></g><g transform="translate(40,322)"><rect width="400" height="130" fill="#000" stroke="#2a3138"/><line x1="212" y1="0" x2="212" y2="95.76" stroke="#eef3f6" stroke-width="1.6"/><text x="197.38" y="108" text-anchor="end" font-family="Liberation Sans Narrow" font-weight="700" font-size="34" letter-spacing="0.5" fill="#eef3f6">BADC</text><circle cx="212" cy="95.76" r="12.24" fill="#e6291c"/><text x="226.62" y="108" text-anchor="start" font-family="Liberation Sans Narrow" font-weight="700" font-size="34" letter-spacing="0.5" fill="#eef3f6">DE</text><text x="14" y="120" font-family="monospace" font-size="13" fill="#59626b">3</text></g></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">A · THE IDENT (2 seconds)</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">1 line drops · 2 silence · 3 lamp lights on the bass drop.</text></g><g transform="translate(0,640)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><line x1="220" y1="0" x2="220" y2="332" stroke="#eef3f6" stroke-width="3.2"/><path d="M220 150 C220 215 330 200 330 270 L330 480" fill="none" stroke="#e8c98a" stroke-width="3.2" stroke-dasharray="11 10"/><circle cx="220" cy="358" r="29" fill="#e6291c"/></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">A · THE WAY OUT</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">On the site the line forks: gold dashes leave before the lamp.</text></g><g transform="translate(480,640)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><rect x="80" y="100" width="320" height="220" fill="#1b2026" stroke="#3a424a"/><path d="M120 280 L190 190 L240 250 L280 212 L350 280 Z" fill="#2a3138"/><text x="80" y="356" font-family="Liberation Sans Narrow" font-weight="700" font-size="22" fill="#aab3bb" letter-spacing="2">YOUR WATER COMPANY</text><circle cx="380" cy="300" r="25" fill="#e6291c"/></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">A · THE DOT DOES JOBS</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">It lands on things as a SOLD sticker: names what was sold.</text></g><g transform="translate(960,640)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><text x="219.9" y="190" text-anchor="end" font-family="Liberation Sans Narrow" font-weight="700" font-size="70" letter-spacing="1" fill="#eef3f6">BADC</text><circle cx="250" cy="164.8" r="25.2" fill="#e6291c"/><text x="280.09999999999997" y="190" text-anchor="start" font-family="Liberation Sans Narrow" font-weight="700" font-size="70" letter-spacing="1" fill="#eef3f6">DE</text><line x1="60" y1="250" x2="420" y2="250" stroke="#2a3138"/><g transform="translate(76.82999999999998,372)"><circle cx="20.25" cy="-17" r="17" fill="none" stroke="#eef3f6" stroke-width="6.5"/><line x1="3.25" y1="-52.7" x2="3.25" y2="3.25" stroke="#eef3f6" stroke-width="6.5"/><circle cx="67.89" cy="-17" r="17" fill="none" stroke="#eef3f6" stroke-width="6.5"/><line x1="84.89" y1="-37.25" x2="84.89" y2="3.25" stroke="#eef3f6" stroke-width="6.5"/><circle cx="115.53" cy="-17" r="17" fill="none" stroke="#eef3f6" stroke-width="6.5"/><line x1="132.53" y1="-52.7" x2="132.53" y2="3.25" stroke="#eef3f6" stroke-width="6.5"/><path d="M175.80346203311572 -5.624779691899409 A17 17 0 1 1 175.80346203311572 -28.37522030810059" fill="none" stroke="#eef3f6" stroke-width="6.5"/><circle cx="210.81" cy="-17" r="20.25" fill="#e6291c"/><circle cx="258.45" cy="-17" r="17" fill="none" stroke="#eef3f6" stroke-width="6.5"/><line x1="275.45" y1="-52.7" x2="275.45" y2="3.25" stroke="#eef3f6" stroke-width="6.5"/><path d="M319.4861828113143 -6.53375491946381 A17 17 0 1 1 323.09000000000003 -17" fill="none" stroke="#eef3f6" stroke-width="6.5"/><line x1="289.09000000000003" y1="-17" x2="326.34000000000003" y2="-17" stroke="#eef3f6" stroke-width="6.5"/></g></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">DECISION · THE VOICE OF THE NAME</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">Top: blunt caps (recommended). Bottom: round lowercase.</text></g><g transform="translate(1440,640)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><path d="M233 6 C243 70 228 140 239 205 C245 245 234 270 238 298" fill="none" stroke="#eef3f6" stroke-width="10" stroke-linecap="round"/><path d="M238 302 m-38 4 c-5 -34 34 -50 59 -32 c30 21 18 68 -18 73 c-27 3 -39 -16 -41 -41 z" fill="#e6291c"/></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">A · DRAWN BADLY</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">Two strokes with a marker pen. Still reads.</text></g><g transform="translate(0,1184)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><circle cx="240" cy="240" r="160" fill="#0b0d10" stroke="#eef3f6" stroke-width="11"/><circle cx="328" cy="206" r="43" fill="#e6291c"/></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">B · THE LOOK</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">A machine eye that glances instead of stares. Most character.</text></g><g transform="translate(480,1184)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><text x="52" y="230" font-family="Liberation Sans Narrow" font-weight="700" font-size="84" letter-spacing="1" fill="#eef3f6">BADCODE</text><circle cx="426" cy="219" r="11" fill="#e6291c"/><line x1="52" y1="268" x2="428" y2="268" stroke="#eef3f6" stroke-width="1.5"/><text x="52" y="304" font-family="monospace" font-size="21" fill="#aab3bb" letter-spacing="2">BC-004   ·   8 BC   ·   RECEIVED</text></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">C · THE NOTICE</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">No symbol. Plain type, a red full stop, numbered like paperwork.</text></g><g transform="translate(960,1184)"><rect x="5" y="5" width="470" height="470" fill="#BADC0D"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><text x="225.88" y="270" text-anchor="end" font-family="Liberation Sans Narrow" font-weight="700" font-size="84" letter-spacing="1" fill="#0a0a0a">BADC</text><circle cx="262" cy="239.76" r="30.24" fill="#0a0a0a"/><text x="298.12" y="270" text-anchor="start" font-family="Liberation Sans Narrow" font-weight="700" font-size="84" letter-spacing="1" fill="#0a0a0a">DE</text><text x="56" y="330" font-family="monospace" font-size="22" fill="#0a0a0a">#BADC0D</text></svg><text x="14" y="504" fill="#eef3f6" font-family="Liberation Sans Narrow" font-weight="700" font-size="20" letter-spacing="1">PARKED · THE NAME IS A COLOUR</text><text x="14" y="528" fill="#aab3bb" font-family="Nimbus Sans" font-size="16">#BADC0D is a real colour code. Loud. Sticker use only.</text></g><g transform="translate(1440,1184)"><rect x="5" y="5" width="470" height="470" fill="#050607"/><svg x="5" y="5" width="470" height="470" viewBox="0 0 480 480" overflow="hidden"><svg x="130" y="120" width="220" height="220" viewBox="-22.03 -9.73 79.46 79.46"><g fill="none" stroke="#fff" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"><path d="M35.4 0C26.44 0 19.12 8.06 19.12 14.66V20.4C19.12 25.68 8.6 30 0 30"/><path d="M35.4 60C26.