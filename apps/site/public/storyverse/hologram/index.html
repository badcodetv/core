if(window.top===window) document.documentElement.classList.add('top-level');
controls.enabled=false; showSubs=false;
const gate=$('gate'), endCard=$('end'), go=$('go'), goLabel=$('goLabel'), hint=$('hint'), again=$('again');
let T=0, playing=false, last=0, dirty=true;
let actx=null, SRC=[], playT0=0, ctxT0=0, audioOn=false; const BUF={};
try{actx=new (window.AudioContext||window.webkitAudioContext)()}catch(e){actx=null}
const ready=Promise.all(CLIPS0.map(async c=>{if(!actx) return; try{const r=await fetch(c.file); if(!r.ok) throw new Error(r.status); BUF[c.id]=await actx.decodeAudioData(await r.arrayBuffer())}catch(e){console.warn('voice',c.id,'not loaded')}}));
function stopAudio(){SRC.forEach(x=>{try{x.stop()}catch(e){}}); SRC=[]; audioOn=false}
function startAudio(){stopAudio(); if(!actx||actx.state!=='running') return; const now=actx.currentTime+.05; ctxT0=now; playT0=T; audioOn=true;
  for(const c of CLIPS0){const b=BUF[c.id]; if(!b) continue; const st=ED.clips[c.id].start; if(st+b.duration<=T) continue;
    const src=actx.createBufferSource(); src.buffer=b; src.connect(actx.destination); src.start(now+Math.max(0,st-T),Math.max(0,T-st)); SRC.push(src)}}
function setPlay(on){playing=on; dirty=true;
  if(on){if(T>=TD-.05) T=0; last=0; if(actx) actx.resume().then(()=>{if(playing) startAudio()}).catch(()=>{})} else stopAudio()}
hint.textContent='Sound on · '+(TD<60?Math.round(TD)+' seconds':(Math.floor(TD/60)+' min '+String(Math.round(TD%60)).padStart(2,'0')));
ready.then(()=>{go.disabled=false; goLabel.textContent='Press to watch'});
function show(card,on){card.hidden=!on; if(on) card.querySelector('button').focus({preventScroll:true})}
function watch(){if(actx) actx.resume().catch(()=>{});   // inside the tap, so the browser lets the sound start
  show(gate,false); show(endCard,false); setPlay(true)}
go.addEventListener('click',watch);
again.addEventListener('click',()=>{T=0; watch()});
/* a tap on the picture pauses; the gate comes back as "carry on" */
canvas.addEventListener('click',()=>{if(!playing) return; setPlay(false); goLabel.textContent='Carry on watching'; show(gate,true)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){setPlay(false); goLabel.textContent='Carry on watching'; show(gate,true)}});
function finish(){T=TD; setPlay(false); setTimeout(()=>{if(!playing) show(endCard,true)},400)}
/* inside the TV the remote's keys keep working while the picture has focus (same origin: pass them up) */
if(window.top!==window) document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey||['Enter',' ','Tab'].includes(e.key)) return;
  try{parent.document.body.dispatchEvent(new KeyboardEvent('keydown',{key:e.key,bubbles:true,cancelable:true}))}catch(err){}});

function resize(){const w=stage.clientWidth,h=stage.clientHeight; if(!w||!h) return; renderer.setSize(w,h,false); composer.setSize(w,h); M.thread.resolution.set(w,h); M.thread.linewidth=P.threadPx*Math.max(.5,h/1080); camera.aspect=w/h; camera.updateProjectionMatrix(); screen.uniforms.res.value.set(w,h); const pr=renderer.getPixelRatio(); txtCanvas.width=Math.round(w*pr); txtCanvas.height=Math.round(h*pr); txtTex.dispose(); dirty=true}
new ResizeObserver(resize).observe(stage);
build(); liveMaterials();
function frame(now){
  requestAnimationFrame(frame);
  if(!playing&&!dirty) return;   // nothing moves on a still picture: don't spend the battery
  dirty=false;
  const dt=Math.min(.1,(now-(last||now))/1000); last=now;
  if(playing){T=audioOn&&actx?Math.max(playT0,playT0+(actx.currentTime-ctxT0)):T+dt; if(T>=TD) finish()}
  apply(T);
  const s=now/1000; screen.uniforms.time.value=reduce?0:s;
  if(!reduce) W.dust.position.y=Math.sin(s*.13)*.05;
  M.slot.emissiveIntensity=.25+.2*(.5+.5*Math.sin(s*1.6));
  M.arc.emissiveIntensity=1.3+(reduce?0:.15*Math.sin(s*23)*Math.sin(s*3.1));
  composer.render();
}
/* the words are drawn into the frame with the page's fonts: wait for them (briefly) before the first picture */
Promise.race([Promise.all([document.fonts.load('400 20px "Schibsted Grotesk"'),document.fonts.load('500 20px "JetBrains Mono"')]),new Promise(r=>setTimeout(r,2500))]).catch(()=>{}).then(()=>{dirty=true});
window.storyverse={get T(){return T},get TD(){return TD},get playing(){return playing},seek(t){if(playing) setPlay(false); T=t; dirty=true},play(){watch()}};   // for checks (a seek pauses)
resize(); requestAnimationFrame(frame);
</script>
</body>
