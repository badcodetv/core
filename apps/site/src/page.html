<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANON}}">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BadCode">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANON}}">
<meta property="og:image" content="{{OGIMG}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#050505">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Instrument+Serif:ital@0;1&family=Oswald:wght@500;700&family=Share+Tech+Mono&family=VT323&family=Public+Sans:wght@400;700;800&display=swap">
<link rel="stylesheet" href="/tv.css?v={{V}}">
<script>document.documentElement.classList.add('js')</script>
</head>
<body>
<div class="tv" id="tv">
  <div class="screen" id="scr" aria-label="Channel BadCode" role="region">
    <div class="layer prog" id="prog" aria-live="polite"></div>
    <div class="layer video" id="video"></div>
    <div class="layer tt" id="tt"><div class="ttbox"><div class="in" id="tti"></div></div></div>
    <div class="layer over" id="over"></div>
    <canvas class="snow" id="snow" width="160" height="120" aria-hidden="true"></canvas>
    <div class="osd" id="osd" aria-hidden="true"></div>
    <div class="standby" id="standby" aria-hidden="true"><svg viewBox="-34 -34 68 68"><path d="M13.38 -12.51A2.97 2.97 0 0 1 16.33 -8.29L12.77 -0.66A2.97 2.97 0 0 1 7.64 -0.21L2.82 -7.11A2.97 2.97 0 0 1 4.99 -11.77Z" fill="#cc2b37"/></svg></div>
  </div>

  <div class="remote" id="remote" role="group" aria-label="Remote control">
    <button class="tuck" data-k="tuck" aria-label="Hide the remote">✕</button>
    <div class="strands">
      <button class="st-stories" data-k="stories"><b>STORIES</b><small>spoiler alert</small></button>
      <button class="st-news" data-k="news"><b>NEWS</b><small>from next week</small></button>
      <button class="st-gov" data-k="government"><b>GOVT</b><small>arguing in public</small></button>
    </div>
    <div class="pad">
      <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="4">4</button>
      <button data-k="5">5</button><button data-k="6">6</button><button data-k="7">7</button><button data-k="8">8</button>
    </div>
    <div class="nav">
      <button data-k="prev" aria-label="Previous programme">◀</button>
      <button class="num" data-k="9">9</button>
      <button class="num" data-k="0" aria-label="Channel 0: test card and about">0</button>
      <button data-k="next" aria-label="Next programme">▶</button>
    </div>
  </div>
  <button class="untuck" id="untuck" data-k="tuck" aria-label="Show the remote">REMOTE</button>
</div>

<main class="plain" id="plain">
{{PLAIN}}
</main>

<script>window.BADCODE={{CONTENT_JSON}};</script>
<script src="/tv.js?v={{V}}" defer></script>
</body>
</html>
