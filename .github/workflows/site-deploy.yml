# Deploys badcode.tv on every push to main that changes the site or the government's manifesto
# (Kai, 2026-11-05: replaces "a push never deploys"). Same build and pinned wrangler as
# scripts/site/deploy.sh. A failed run leaves the previous version live.
# Plan: design/2026-11-05-site-government.md
# Future Proof Live (SIMULATED, /future-proof/live/) is built from the branch simulation/live, which Bob's
# workers push to every morning and the 13:00 UTC routine marks. The schedule below rebuilds the site after
# each: 12:15 UTC (the minister is done by about 11:30 London) and 14:30 UTC (after the clock). Why a
# schedule and not a push trigger: the data branch never touches main, and neither Bob nor the routine
# needs a GitHub token that can start workflows (design/2026-11-23-future-proof-rework/build-log.md, D8).
# The Future Proof Demo (/demo/) is built the same way from the branch demo/live; its Bob chain ends by
# about 14:40 London, so the 15:00 UTC run picks it up (design/2026-11-24-future-proof-demo/build-log.md).
name: site-deploy
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - docs/government/manifesto/**
      - docs/government/policies/**
      - docs/government/debates/**
      - docs/government/simulation/page/**
      - scripts/government/sim/**
      - docs/demo/page/**
      - docs/demo/cabinet.json
      - scripts/demo/**
  # The three daily rebuilds (12:15, 14:30, 15:00 UTC) are off while the government is paused
  # (Kai, 2026-11-26; docs/government/PAUSED.md). To bring them back:
  # schedule:
  #   - cron: '15 12 * * *'
  #   - cron: '30 14 * * *'
  #   - cron: '0 15 * * *'
  workflow_dispatch:
concurrency:
  group: site-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # each policy page prints its own git history (design §4.2)
      - name: Fetch the simulation's issues (branch simulation/live)
        run: git fetch --no-tags origin +refs/heads/simulation/live:refs/remotes/origin/simulation/live
      - name: Fetch the demo's days (branch demo/live)
        run: git fetch --no-tags origin +refs/heads/demo/live:refs/remotes/origin/demo/live || echo 'no demo/live yet'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node apps/site/build.mjs
      - name: Deploy to Cloudflare Pages (badcode-web → www.badcode.tv)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBJECT: ${{ github.event.head_commit.message || format('{0} rebuild', github.event_name) }}
        run: >
          npx -y wrangler@4.40.0 pages deploy apps/site/dist
          --project-name badcode-web --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$SUBJECT" | head -1 | cut -c1-200)"
