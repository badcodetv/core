# Deploys badcode.tv on every push to main that changes the site or the government's manifesto
# (Kai, 2026-11-05: replaces "a push never deploys"). Same build and pinned wrangler as
# scripts/site/deploy.sh. A failed run leaves the previous version live.
# Plan: design/2026-11-05-site-government.md
name: site-deploy
on:
  push:
    branches: [main]
    paths:
      - apps/site/**
      - docs/government/manifesto/**
  workflow_dispatch:
concurrency:
  group: site-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node apps/site/build.mjs
      - name: Deploy to Cloudflare Pages (badcode-web → www.badcode.tv)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBJECT: ${{ github.event.head_commit.message }}
        run: >
          npx -y wrangler@4.40.0 pages deploy apps/site/dist
          --project-name badcode-web --branch main
          --commit-hash "$GITHUB_SHA" --commit-message "$(printf '%s' "$SUBJECT" | head -1 | cut -c1-200)"
