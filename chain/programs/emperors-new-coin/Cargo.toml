[package]
name = "emperors-new-coin"
version = "0.1.0"
description = "Emperor's New Coin — supply pegged to the Fed's M2 money supply."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "emperors_new_coin"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
# Declared so the compiler stops warning that Anchor's macros reference a cfg
# this crate never defines. Not used directly.
anchor-debug = []
# Compiles the mock oracle instruction. Localnet only — a default build must not
# contain any way to set M2 by hand.
mock = []

[dependencies]
# init-if-needed: the mock oracle account uses it today, and T12's
# `settle_auction` needs it to create the outgoing holder's ENC account when
# they have closed it — otherwise an incumbent vetoes their own eviction and
# freezes the winner's escrow by closing one account. Anchor warns about
# reinitialisation attacks on this: the warning is about accounts whose state
# matters, and every use here is an associated-token account, which is
# canonical per (owner, mint) and idempotent to create.
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
spl-type-length-value = "0.9"
