[package]
name = "counter"
version = "0.1.0"
description = "A counter. The smallest program that exercises the whole toolchain."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "counter"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
# Declared so the compiler stops warning that Anchor's macros reference a cfg
# this crate never defines. Not used directly.
anchor-debug = []

[dependencies]
anchor-lang = "1.1.2"
