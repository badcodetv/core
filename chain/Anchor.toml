[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

# Prefer `./stack test [suite]`, which runs these against the validator started
# by `./stack start`. Two things bite if you call anchor directly:
#
#   --skip-local-validator  or Anchor starts a SECOND validator on port 8899 and
#                           the run dies on the port collision.
#   --validator legacy      only needed when you do let Anchor start its own:
#                           Anchor 1.x defaults to surfpool, which is not
#                           installed, and fails with "Failed to spawn `surfpool`".
#
#   anchor test --skip-local-validator                     # everything
#   anchor test --skip-local-validator --script test-smoke  # one suite
#
# One entry per suite below. Note `anchor test -- --grep X` does NOT work: args
# after -- go to `cargo build-sbf`, not to mocha. Use --script instead.
# Run through mocha with tsx as the loader, not ts-mocha. ts-mocha cannot
# resolve a TypeScript file importing another TypeScript file as an ES module,
# which is what these are — so the shared tests/enc-harness.ts is unreachable
# under it. tsx resolves both extensionless and .js-to-.ts specifiers.
[scripts]
test = "NODE_OPTIONS='--import tsx' npx mocha -t 1000000 'tests/**/*.ts'"
test-smoke = "NODE_OPTIONS='--import tsx' npx mocha -t 1000000 tests/smoke.ts"
test-counter = "NODE_OPTIONS='--import tsx' npx mocha -t 1000000 tests/counter.ts"
test-init = "NODE_OPTIONS='--import tsx' npx mocha -t 1000000 tests/initialize.ts"
test-sync = "NODE_OPTIONS='--import tsx' npx mocha -t 1000000 tests/sync_m2.ts"
test-auction = "NODE_OPTIONS='--import tsx' npx mocha -t 1000000 tests/auction.ts"
test-faucet = "NODE_OPTIONS='--import tsx' npx mocha -t 1000000 tests/faucet.ts"
